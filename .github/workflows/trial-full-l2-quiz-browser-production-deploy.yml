name: Trial full L2 quiz Browser production deploy

on:
  push:
    branches: [deploy/trial-full-l2-quiz-browser-2026-09-22]
    paths: ['.github/workflows/trial-full-l2-quiz-browser-production-deploy.yml']

permissions:
  contents: read

concurrency:
  group: trial-full-l2-quiz-browser-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.129.0
  PROD_HOST: lessons.futureperfect.education
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  FRONTEND_REPO: FuturePerfectTuitions/futureperfect-lessons-test
  FRONTEND_BASELINE_SHA: 63f37895727e41ada427c9644b41b5a026ed196b
  FRONTEND_SHA: 7d522548ba21683d74841f6a901ef0a83ae240a3

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact live Browser rollback anchor and topology
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/trial-browser-state.mjs <<'NODE'
          import fs from 'node:fs';
          const c = v => String(v ?? '').trim();
          const account = c(process.env.CLOUDFLARE_ACCOUNT_ID);
          const token = c(process.env.CLOUDFLARE_API_TOKEN);
          const browser = c(process.env.BROWSER_WORKER);
          const student = c(process.env.STUDENT_WORKER);
          const host = c(process.env.PROD_HOST).toLowerCase();
          const base = 'https://api.cloudflare.com/client/v4';
          const headers = { Authorization: `Bearer ${token}` };
          async function cf(path, opts={}) {
            const r = await fetch(`${base}${path}`, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
            const t = await r.text(); let j; try { j = JSON.parse(t); } catch {}
            if (!r.ok || j?.success !== true) throw new Error(`CF ${path} ${r.status}: ${t.slice(0,300)}`);
            return j;
          }
          function deploymentRows(j) {
            const r = j?.result;
            return Array.isArray(r?.deployments) ? r.deployments : (Array.isArray(r) ? r : []);
          }
          async function currentDeployment() {
            const j = await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(browser)}/deployments`);
            const d = deploymentRows(j)[0];
            if (!d) throw new Error('Browser deployment missing');
            const versions = (Array.isArray(d.versions) ? d.versions : []).map(v => ({ id:c(v.version_id), percentage:Number(v.percentage ?? 0) }));
            return { deploymentId:c(d.id), versions };
          }
          async function topology() {
            const settings = (await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(browser)}/settings`)).result || {};
            const bindings = Array.isArray(settings.bindings) ? settings.bindings : [];
            const assets = bindings.filter(b => c(b.name)==='ASSETS' && c(b.type)==='assets');
            const service = bindings.filter(b => c(b.name)==='STAGING_API' && c(b.type)==='service' && c(b.service)===student);
            if (assets.length !== 1 || service.length !== 1) throw new Error(`Browser binding drift: ${JSON.stringify(bindings)}`);
            const zones = (await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`)).result || [];
            const zone = zones.filter(z => host===c(z.name).toLowerCase() || host.endsWith(`.${c(z.name).toLowerCase()}`)).sort((a,b)=>c(b.name).length-c(a.name).length)[0];
            if (!zone) throw new Error('Production zone missing');
            const routes = (await cf(`/zones/${zone.id}/workers/routes`)).result || [];
            const hr = routes.filter(r => c(r.pattern).toLowerCase().includes(host));
            if (hr.length !== 1 || c(hr[0].pattern).toLowerCase() !== `${host}/*` || c(hr[0].script) !== browser) throw new Error(`Browser route drift: ${JSON.stringify(hr)}`);
            return { bindings: bindings.map(b=>({name:b.name,type:b.type,service:b.service||null})), route:{pattern:hr[0].pattern,script:hr[0].script} };
          }
          const mode = process.argv[2] || 'capture';
          const d = await currentDeployment();
          const topo = await topology();
          if (mode === 'capture') {
            const live = d.versions.filter(v => v.percentage === 100 && v.id);
            if (live.length !== 1 || d.versions.some(v => v.id !== live[0].id && v.percentage !== 0)) throw new Error(`Expected one 100% Browser version: ${JSON.stringify(d)}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `OLD_BROWSER_VERSION=${live[0].id}\n`);
            fs.writeFileSync('/tmp/trial-browser-state-before.json', JSON.stringify({marker:'TRIAL_FULL_L2_BROWSER_PRESTATE_PASS',...d,...topo},null,2));
            console.log(`Captured rollback Browser version ${live[0].id}`);
          } else if (mode === 'final') {
            const candidate = c(process.env.CANDIDATE_BROWSER_VERSION);
            if (!candidate || !d.versions.some(v => v.id===candidate && v.percentage===100)) throw new Error(`Candidate not 100%: ${JSON.stringify(d)}`);
            fs.writeFileSync('/tmp/trial-browser-state-final.json', JSON.stringify({marker:'TRIAL_FULL_L2_BROWSER_FINAL_STATE_PASS',...d,...topo},null,2));
          } else if (mode === 'rollback') {
            const old = c(process.env.OLD_BROWSER_VERSION);
            if (!old || !d.versions.some(v => v.id===old && v.percentage===100)) throw new Error(`Rollback version not 100%: ${JSON.stringify(d)}`);
            fs.writeFileSync('/tmp/trial-browser-state-rollback.json', JSON.stringify({marker:'TRIAL_FULL_L2_BROWSER_ROLLBACK_PASS',...d,...topo},null,2));
          }
          NODE
          node /tmp/trial-browser-state.mjs capture
          cat /tmp/trial-browser-state-before.json

      - name: Checkout exact reviewed frontend
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.FRONTEND_SHA }}
          path: frontend
          fetch-depth: 0
          persist-credentials: false

      - name: Reprove Trial quiz UI and build exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C frontend rev-parse HEAD)" = "$FRONTEND_SHA"
          git -C frontend merge-base --is-ancestor "$FRONTEND_BASELINE_SHA" "$FRONTEND_SHA"
          grep -Fq 'data-subject="maths"' frontend/src/app.js
          grep -Fq "if (subject === 'maths') void revealMathsPracticeCard();" frontend/src/app.js
          grep -Fq "payload?.eligible !== true" frontend/src/app.js
          grep -Fq '11+ Practice' frontend/src/app.js
          grep -Fq 'Take a real exam style GL quiz' frontend/src/app.js
          grep -Fq 'quiz.futureperfect.education' frontend/src/app.js
          grep -Fq 'No years or levels are currently available.' frontend/src/app.js
          cd frontend
          npm install --no-package-lock --no-audit --no-fund
          npm run test:static
          npm run build
          cd "$GITHUB_WORKSPACE"
          LOCAL_JS="$(find frontend/dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*protected*' | head -n1)"
          test -n "$LOCAL_JS"
          LOCAL_BUNDLE_SHA="$(sha256sum "$LOCAL_JS" | awk '{print $1}')"
          echo "LOCAL_BUNDLE_SHA=$LOCAL_BUNDLE_SHA" >> "$GITHUB_ENV"
          echo "LOCAL_JS=$LOCAL_JS" >> "$GITHUB_ENV"
          for marker in '/api/v2/student/quiz/eligibility' '/api/v2/student/quiz/launch' '11+ Practice' 'quiz.futureperfect.education'; do grep -Fq "$marker" "$LOCAL_JS"; done
          jq -n --arg frontendSha "$FRONTEND_SHA" --arg baselineSha "$FRONTEND_BASELINE_SHA" --arg bundleSha "$LOCAL_BUNDLE_SHA" '{marker:"TRIAL_FULL_L2_FRONTEND_BUILD_PASS",frontendSha:$frontendSha,baselineSha:$baselineSha,bundleSha256:$bundleSha,mathsZeroViewPath:true,eligibilityControlled:true}' > /tmp/trial-full-l2-frontend-build.json
          cat /tmp/trial-full-l2-frontend-build.json

      - name: Prepare exact production Browser configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
          rm -rf rebuild/browser-staging/public
          mkdir -p rebuild/browser-staging/public
          cp -a frontend/dist/. rebuild/browser-staging/public/
          cat > rebuild/browser-staging/wrangler.trial-full-l2.toml <<TOML
          name = "${BROWSER_WORKER}"
          main = "src/index.js"
          compatibility_date = "2026-08-20"
          workers_dev = true

          [[services]]
          binding = "STAGING_API"
          service = "${STUDENT_WORKER}"

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          TOML
          npx wrangler --version

      - name: Upload fresh Browser candidate without traffic
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BROWSER_WORKER}/versions"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API?per_page=100" -o /tmp/browser-versions-before.json
          npx wrangler versions upload --config rebuild/browser-staging/wrangler.trial-full-l2.toml --message "Trial full L2 quiz Browser ${FRONTEND_SHA}" | tee /tmp/browser-version-upload.log
          CANDIDATE_BROWSER_VERSION=''
          for i in $(seq 1 20); do
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API?per_page=100" -o /tmp/browser-versions-after.json
            CANDIDATE_BROWSER_VERSION="$(node <<'NODE'
          const fs=require('fs');
          const rows=j=>Array.isArray(j?.result)?j.result:(Array.isArray(j?.result?.items)?j.result.items:(Array.isArray(j?.result?.versions)?j.result.versions:[]));
          const before=new Set(rows(JSON.parse(fs.readFileSync('/tmp/browser-versions-before.json','utf8'))).map(v=>String(v.id||v.version_id||'')));
          const fresh=rows(JSON.parse(fs.readFileSync('/tmp/browser-versions-after.json','utf8'))).filter(v=>{const id=String(v.id||v.version_id||'');return id&&!before.has(id);});
          fresh.sort((a,b)=>String(b.created_on||b.created_at||'').localeCompare(String(a.created_on||a.created_at||'')));
          process.stdout.write(String(fresh[0]?.id||fresh[0]?.version_id||''));
          NODE
          )"
            [ -n "$CANDIDATE_BROWSER_VERSION" ] && break
            sleep 1
          done
          test -n "$CANDIDATE_BROWSER_VERSION"
          test "$CANDIDATE_BROWSER_VERSION" != "$OLD_BROWSER_VERSION"
          echo "CANDIDATE_BROWSER_VERSION=$CANDIDATE_BROWSER_VERSION" >> "$GITHUB_ENV"
          echo "Uploaded candidate Browser version $CANDIDATE_BROWSER_VERSION"

      - name: Establish zero-percent candidate and smoke exact version
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler versions deploy "${OLD_BROWSER_VERSION}@100%" "${CANDIDATE_BROWSER_VERSION}@0%" --config rebuild/browser-staging/wrangler.trial-full-l2.toml -y --message 'Trial full L2 quiz zero-percent smoke' | tee /tmp/browser-zero-percent.log
          OVERRIDE="Cloudflare-Workers-Version-Overrides: ${BROWSER_WORKER}=\"${CANDIDATE_BROWSER_VERSION}\""
          READY=0
          for i in $(seq 1 30); do
            ROOT="$(curl -sS -H "$OVERRIDE" -H 'Cache-Control: no-store' -o /tmp/candidate-index.html -w '%{http_code}' "https://${PROD_HOST}/?trialfullL2=${GITHUB_RUN_ID}-${i}" || true)"
            ELIG="$(curl -sS -H "$OVERRIDE" -H "Origin: https://${PROD_HOST}" -D /tmp/candidate-elig.headers -o /tmp/candidate-elig.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/eligibility" || true)"
            if [ "$ROOT" = 200 ] && [ "$ELIG" = 401 ] && grep -qi '^x-fpt-cp9-browser-facade: service-binding' /tmp/candidate-elig.headers; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/candidate-index.html | head -n1 | sed -E 's/^src="//;s/"$//')"
          test -n "$P"
          case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
          curl -fsS -H "$OVERRIDE" -H 'Cache-Control: no-store' "${U}?trialfullL2=${GITHUB_RUN_ID}" -o /tmp/candidate-bundle.js
          test "$(sha256sum /tmp/candidate-bundle.js | awk '{print $1}')" = "$LOCAL_BUNDLE_SHA"
          ALLOWED="$(curl -sS -H "$OVERRIDE" -H "Origin: https://${PROD_HOST}" -H 'Content-Type: application/json' -X POST -o /tmp/candidate-launch.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch" || true)"
          HOSTILE="$(curl -sS -H "$OVERRIDE" -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -o /tmp/candidate-hostile.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch" || true)"
          test "$ALLOWED" = 401
          test "$HOSTILE" = 403
          echo TRIAL_FULL_L2_ZERO_PERCENT_SMOKE_PASS

      - name: Promote exact candidate to 100 percent
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler versions deploy "${CANDIDATE_BROWSER_VERSION}@100%" --config rebuild/browser-staging/wrangler.trial-full-l2.toml -y --message "Trial full L2 quiz public Browser ${FRONTEND_SHA}" | tee /tmp/browser-promote.log
          sleep 2
          node /tmp/trial-browser-state.mjs final

      - name: Verify public propagation, exact bytes and security
        shell: bash
        run: |
          set -Eeuo pipefail
          MATCH=0
          for i in $(seq 1 60); do
            ROOT="$(curl -sS -H 'Cache-Control: no-store' -o /tmp/public-index.html -w '%{http_code}' "https://${PROD_HOST}/?trialfullL2=${GITHUB_RUN_ID}-public-${i}" || true)"
            if [ "$ROOT" = 200 ]; then
              P="$(grep -oE 'src="[^"]+\.js"' /tmp/public-index.html | head -n1 | sed -E 's/^src="//;s/"$//' || true)"
              if [ -n "$P" ]; then
                case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
                if curl -fsS -H 'Cache-Control: no-store' "${U}?trialfullL2=${GITHUB_RUN_ID}-public-${i}" -o /tmp/public-bundle.js; then
                  GOT="$(sha256sum /tmp/public-bundle.js | awk '{print $1}')"
                  if [ "$GOT" = "$LOCAL_BUNDLE_SHA" ]; then MATCH=1; break; fi
                fi
              fi
            fi
            sleep 2
          done
          test "$MATCH" = 1
          for marker in '/api/v2/student/quiz/eligibility' '/api/v2/student/quiz/launch' '11+ Practice' 'quiz.futureperfect.education'; do grep -Fq "$marker" /tmp/public-bundle.js; done
          ELIG="$(curl -sS -H "Origin: https://${PROD_HOST}" -o /tmp/public-elig.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/eligibility" || true)"
          LAUNCH="$(curl -sS -H "Origin: https://${PROD_HOST}" -H 'Content-Type: application/json' -X POST -o /tmp/public-launch.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch" || true)"
          HOSTILE="$(curl -sS -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -o /tmp/public-hostile.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch" || true)"
          test "$ELIG" = 401
          test "$LAUNCH" = 401
          test "$HOSTILE" = 403
          node /tmp/trial-browser-state.mjs final
          sleep 5
          curl -fsS -H 'Cache-Control: no-store' "https://${PROD_HOST}/?trialfullL2=${GITHUB_RUN_ID}-stable" -o /tmp/stable-index.html
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/stable-index.html | head -n1 | sed -E 's/^src="//;s/"$//')"
          case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
          curl -fsS -H 'Cache-Control: no-store' "${U}?trialfullL2=${GITHUB_RUN_ID}-stable" -o /tmp/stable-bundle.js
          test "$(sha256sum /tmp/stable-bundle.js | awk '{print $1}')" = "$LOCAL_BUNDLE_SHA"
          node /tmp/trial-browser-state.mjs final
          jq -n --arg marker TRIAL_FULL_L2_BROWSER_PRODUCTION_PASS --arg frontendSha "$FRONTEND_SHA" --arg oldBrowserVersion "$OLD_BROWSER_VERSION" --arg browserVersion "$CANDIDATE_BROWSER_VERSION" --arg bundleSha "$LOCAL_BUNDLE_SHA" '{marker:$marker,frontendSha:$frontendSha,rollbackAnchor:$oldBrowserVersion,browserVersion:$browserVersion,bundleSha256:$bundleSha,zeroPercentSmoke:true,publicPropagationVerified:true,stableRecheck:true,security:{unauthenticatedEligibility:401,unauthenticatedLaunch:401,hostileOriginLaunch:403},realTrialLoginConsumed:false}' > /tmp/trial-full-l2-browser-closeout.json
          cat /tmp/trial-full-l2-browser-closeout.json

      - name: Emergency rollback exact prior Browser version
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${OLD_BROWSER_VERSION:-}" ]; then
            npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}" >/dev/null 2>&1 || true
            npx wrangler versions deploy "${OLD_BROWSER_VERSION}@100%" --name "$BROWSER_WORKER" -y --message 'Trial full L2 quiz Browser emergency rollback' | tee /tmp/browser-rollback.log
            sleep 2
            node /tmp/trial-browser-state.mjs rollback
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-full-l2-quiz-browser-production-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/trial-browser-state-before.json
            /tmp/trial-browser-state-final.json
            /tmp/trial-browser-state-rollback.json
            /tmp/trial-full-l2-frontend-build.json
            /tmp/browser-versions-before.json
            /tmp/browser-versions-after.json
            /tmp/browser-version-upload.log
            /tmp/browser-zero-percent.log
            /tmp/browser-promote.log
            /tmp/browser-rollback.log
            /tmp/candidate-index.html
            /tmp/candidate-bundle.js
            /tmp/candidate-elig.headers
            /tmp/candidate-elig.json
            /tmp/candidate-launch.json
            /tmp/candidate-hostile.json
            /tmp/public-index.html
            /tmp/public-bundle.js
            /tmp/public-elig.json
            /tmp/public-launch.json
            /tmp/public-hostile.json
            /tmp/stable-index.html
            /tmp/stable-bundle.js
            /tmp/trial-full-l2-browser-closeout.json
