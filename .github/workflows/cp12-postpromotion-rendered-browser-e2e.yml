name: CP12 post-promotion rendered-browser L2 L3 acceptance
on:
  push:
    branches: [feature/cp12-browser-promotion-2026-09-21]
    paths: ['.github/workflows/cp12-postpromotion-rendered-browser-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp12-postpromotion-rendered-browser-e2e-production
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
  READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  BRIDGE_WORKER: fpt-portal-v2-worker
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  EXPECTED_STUDENT_VERSION: 51d725cc-d21e-4aad-9c64-24149c640637
  EXPECTED_BROWSER_VERSION: ea701c02-93f7-46e9-9182-59a785dc0bee
  EXPECTED_BRIDGE_VERSION: 2ae28100-b4c6-40a3-87e2-42aef86c6fdf
  EXPECTED_QUIZ_VERSION: 80d4942e-616c-4539-91f1-9f2daf05cfc1
  EXPECTED_HARNESS_SHA256: 7dcd92695ab9cde73690dcd099ff3c8a4393896eafe57844f8b5ceb84a1fc92b
  EXPECTED_BROWSER_BUNDLE_SHA256: ee665945ab14c80d2747d603138db8f0b4e2afef84656de04d0025409c2ef0c9
  PORTAL_ROOT: https://lessons.futureperfect.education
  QUIZ_ROOT: https://quiz.futureperfect.education
jobs:
  rendered-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Create guarded rendered-browser runtime harness
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=scripts/cp12-e2e-synthetic-fixture.mjs
          DST=scripts/cp12-rendered-browser-e2e.runtime.mjs
          ACTUAL_SHA="$(sha256sum "$SRC" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_HARNESS_SHA256"
          cp "$SRC" "$DST"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/cp12-rendered-browser-e2e.runtime.mjs')
          s = p.read_text()

          old = "import crypto from 'node:crypto';"
          new = "import crypto from 'node:crypto';\nimport { chromium } from '@playwright/test';"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one crypto import, found {s.count(old)}')
          s = s.replace(old, new, 1)

          insertion_marker = "async function assertNoQuizLearningHistory(persona) {"
          if s.count(insertion_marker) != 1:
              raise SystemExit(f'Expected one visual insertion marker, found {s.count(insertion_marker)}')
          visual = r'''
          async function renderedPortalAcceptance(persona) {
            // Use the existing signed login retry to ensure KV/read-model propagation has completed,
            // then prove the same journey through an actual Chromium render.
            await portalSession(persona);
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1200 } });
            const page = await context.newPage();
            try {
              await page.goto(`${portalRoot}/?cp12visual=${encodeURIComponent(runId)}-${persona.label}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.locator('#username').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#username').fill(persona.user);
              await page.locator('#password').fill(persona.password);
              await page.locator('#login-submit').click();
              await page.locator('[data-subject="maths"]').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('[data-subject="maths"]').click();
              const card = page.locator('[data-quiz-practice="true"]');
              await card.waitFor({ state: 'visible', timeout: 15000 });
              assert(await card.count() === 1, `${persona.label} rendered Portal did not expose exactly one 11+ Practice card`);
              const title = clean(await card.locator('.view-label').textContent());
              const meta = clean(await card.locator('.view-count').textContent());
              assert(title === '11+ Practice', `${persona.label} rendered practice-card title mismatch: ${title}`);
              assert(meta === 'Take a real exam style GL quiz', `${persona.label} rendered practice-card copy mismatch: ${meta}`);
              const box = await card.boundingBox();
              assert(box && box.width > 0 && box.height > 0, `${persona.label} practice card has no visible rendered box`);
              await page.screenshot({ path: `/tmp/cp12-rendered/${persona.label.toLowerCase()}-maths-practice-card.png`, fullPage: true });
              console.log(`CP12_${persona.label}_RENDERED_PRACTICE_CARD_PASS title=${JSON.stringify(title)} copy=${JSON.stringify(meta)} width=${Math.round(box.width)} height=${Math.round(box.height)}`);
              await page.locator('#logout').click().catch(() => {});
            } finally {
              await context.close();
              await browser.close();
            }
          }

          '''
          s = s.replace(insertion_marker, visual + insertion_marker, 1)

          replacements = [
              ("Portal root unavailable during withdrawal verification", "Portal root unavailable during rendered post-promotion verification"),
              ("assert(found.length === 0, `Public Quiz surface was exposed prematurely: ${found.join(', ')}`);",
               "assert(found.length === markers.length, `Public Quiz surface missing expected markers: ${markers.filter(marker => !found.includes(marker)).join(', ')}`);"),
              ("portalSurfaceWithdrawn=true", "portalSurfacePromoted=true"),
              ("for (const persona of state.personas) await createPersona(persona);\n  for (const persona of state.personas) await exercisePersona(persona);",
               "for (const persona of state.personas) await createPersona(persona);\n  for (const persona of state.personas) await renderedPortalAcceptance(persona);\n  for (const persona of state.personas) await exercisePersona(persona);"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one guarded source marker: {old!r}; found {s.count(old)}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          mkdir -p /tmp/cp12-rendered
          node --check "$DST"
          git diff --exit-code -- "$SRC"
          grep -Fq 'renderedPortalAcceptance(persona)' "$DST"
          grep -Fq 'CP12_${persona.label}_RENDERED_PRACTICE_CARD_PASS' "$DST"
          grep -Fq 'portalSurfacePromoted=true' "$DST"
          echo "CP12_RENDERED_RUNTIME_HARNESS_READY originalSha256=$ACTUAL_SHA"

      - name: Re-run authoritative publisher regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint3-atomic-publishing.mjs
          node tests/rebuild-checkpoint8-backfill-access-parity.mjs
          echo CP12_RENDERED_PUBLISHER_REGRESSION_PASS

      - name: Execute rendered L2 and L3 production acceptance with mandatory cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/cp12-rendered-browser-e2e.runtime.mjs 2>&1 | tee /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_L2_RENDERED_PRACTICE_CARD_PASS' /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_L3_RENDERED_PRACTICE_CARD_PASS' /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_L2_SIGNED_LAUNCH_REDEEM_PASS' /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_L3_SIGNED_LAUNCH_REDEEM_PASS' /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_E2E_CLEANUP_PASS' /tmp/cp12-rendered-e2e.log
          grep -Fq 'portalSurfacePromoted=true' /tmp/cp12-rendered-e2e.log
          grep -Fq 'CP12_SYNTHETIC_E2E_FINAL_PASS' /tmp/cp12-rendered-e2e.log
          test -s /tmp/cp12-rendered/l2-maths-practice-card.png
          test -s /tmp/cp12-rendered/l3-maths-practice-card.png
          echo CP12_POSTPROMOTION_RENDERED_BROWSER_E2E_PASS

      - name: Independently verify live bundle identity and security after rendered test
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS -H 'Cache-Control: no-store' "${PORTAL_ROOT}/?cp12rendered=${GITHUB_RUN_ID}" -o /tmp/cp12-rendered-index.html
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/cp12-rendered-index.html | head -n1 | sed -E 's/^src="//;s/"$//')"
          test -n "$P"
          case "$P" in
            http*) U="$P" ;;
            /*) U="${PORTAL_ROOT}${P}" ;;
            *) U="${PORTAL_ROOT}/${P}" ;;
          esac
          curl -fsS -H 'Cache-Control: no-store' "${U}?cp12rendered=${GITHUB_RUN_ID}" -o /tmp/cp12-rendered-bundle.js
          ACTUAL_BUNDLE_SHA="$(sha256sum /tmp/cp12-rendered-bundle.js | awk '{print $1}')"
          test "$ACTUAL_BUNDLE_SHA" = "$EXPECTED_BROWSER_BUNDLE_SHA256"
          ELIG="$(curl -sS -H "Origin: ${PORTAL_ROOT}" -o /tmp/cp12-rendered-elig.json -w '%{http_code}' "${PORTAL_ROOT}/api/v2/student/quiz/eligibility" || true)"
          LAUNCH="$(curl -sS -H "Origin: ${PORTAL_ROOT}" -H 'Content-Type: application/json' -X POST -o /tmp/cp12-rendered-launch.json -w '%{http_code}' "${PORTAL_ROOT}/api/v2/student/quiz/launch" || true)"
          HOSTILE="$(curl -sS -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -o /tmp/cp12-rendered-hostile.json -w '%{http_code}' "${PORTAL_ROOT}/api/v2/student/quiz/launch" || true)"
          test "$ELIG" = 401
          test "$LAUNCH" = 401
          test "$HOSTILE" = 403
          jq -n \
            --arg marker CP12_POSTPROMOTION_RENDERED_BROWSER_CLOSED_PASS \
            --arg runId "$GITHUB_RUN_ID" \
            --arg browserVersion "$EXPECTED_BROWSER_VERSION" \
            --arg bridgeVersion "$EXPECTED_BRIDGE_VERSION" \
            --arg bundleSha256 "$ACTUAL_BUNDLE_SHA" \
            '{marker:$marker,runId:$runId,browserVersion:$browserVersion,bridgeVersion:$bridgeVersion,bundleSha256:$bundleSha256,l2RenderedPracticeCard:true,l3RenderedPracticeCard:true,l2SignedLaunchRedeem:true,l3SignedLaunchRedeem:true,cleanupVerified:true,portalSurfacePromoted:true,security:{eligibilityUnauthenticated:401,launchUnauthenticated:401,hostileOriginLaunch:403}}' > /tmp/cp12-rendered-closeout.json
          cat /tmp/cp12-rendered-closeout.json

      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-postpromotion-rendered-browser-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/cp12-rendered-e2e.log
            /tmp/cp12-rendered/l2-maths-practice-card.png
            /tmp/cp12-rendered/l3-maths-practice-card.png
            /tmp/cp12-rendered-index.html
            /tmp/cp12-rendered-bundle.js
            /tmp/cp12-rendered-elig.json
            /tmp/cp12-rendered-launch.json
            /tmp/cp12-rendered-hostile.json
            /tmp/cp12-rendered-closeout.json
