name: Repair live Cumulative Homework mappings

on:
  push:
    branches:
      - ops/cumulative-homework-audit-20260908
    paths:
      - .github/workflows/cumulative-homework-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v6

      - name: Confirm credentials and resolve production bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p cumulative-fix
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            > cumulative-fix/worker-settings.json
          jq -e '.success == true' cumulative-fix/worker-settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' cumulative-fix/worker-settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id // empty' cumulative-fix/worker-settings.json)"
          MATERIALS_R2_BUCKET="$(jq -r '.result.bindings[] | select(.name=="MATERIALS_R2") | .bucket_name // empty' cumulative-fix/worker-settings.json)"
          test -n "$LESSONS_KV_ID"
          test -n "$MATERIALS_R2_BUCKET"
          printf '%s' "$LESSONS_KV_ID" > cumulative-fix/lessons-kv-id.txt
          printf '%s' "$MATERIALS_R2_BUCKET" > cumulative-fix/r2-bucket.txt
          echo 'Production LESSONS_KV and MATERIALS_R2 bindings resolved.'

      - name: Snapshot live cumulative R2 inventory
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(cat cumulative-fix/r2-bucket.txt)"
          printf '[]' > cumulative-fix/r2-objects.json
          cursor=''
          while :; do
            url="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then
              encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${encoded}"
            fi
            page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success == true' <<<"$page" >/dev/null
            jq '[.result[]? | {key,size,etag,last_modified}]' <<<"$page" > cumulative-fix/page-r2.json
            jq -s '.[0] + .[1]' cumulative-fix/r2-objects.json cumulative-fix/page-r2.json > cumulative-fix/next.json
            mv cumulative-fix/next.json cumulative-fix/r2-objects.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          echo "Live R2 objects: $(jq 'length' cumulative-fix/r2-objects.json)"

      - name: Snapshot every live lesson record
        shell: bash
        run: |
          set -euo pipefail
          NS="$(cat cumulative-fix/lessons-kv-id.txt)"
          printf '[]' > cumulative-fix/lesson-keys.json
          cursor=''
          while :; do
            url="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/keys?limit=1000&prefix=lesson%3A"
            if [ -n "$cursor" ]; then
              encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${encoded}"
            fi
            page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success == true' <<<"$page" >/dev/null
            jq '[.result[]? | .name]' <<<"$page" > cumulative-fix/page-keys.json
            jq -s '.[0] + .[1]' cumulative-fix/lesson-keys.json cumulative-fix/page-keys.json > cumulative-fix/next.json
            mv cumulative-fix/next.json cumulative-fix/lesson-keys.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          jq -r '.[]' cumulative-fix/lesson-keys.json | LC_ALL=C sort -u > cumulative-fix/lesson-keys.txt
          : > cumulative-fix/live-lessons.ndjson
          while IFS= read -r key; do
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            value="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${encoded}")"
            jq -cn --arg key "$key" --argjson record "$value" '{kvKey:$key,record:$record}' >> cumulative-fix/live-lessons.ndjson
          done < cumulative-fix/lesson-keys.txt
          echo "Live lesson records: $(wc -l < cumulative-fix/live-lessons.ndjson | tr -d ' ')"

      - name: Build guarded repair plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, re
          from collections import defaultdict
          from pathlib import PurePosixPath

          root='cumulative-fix'
          rows=[json.loads(line) for line in open(f'{root}/live-lessons.ndjson',encoding='utf-8') if line.strip()]
          live={row['kvKey'].split(':',1)[-1]:row['record'] for row in rows}
          r2=json.load(open(f'{root}/r2-objects.json',encoding='utf-8'))
          r2keys=sorted({x.get('key','') for x in r2 if x.get('key')})

          folders=defaultdict(list)
          for key in r2keys:
              if '/cumulative-homework/' not in key: continue
              prefix=key.split('/cumulative-homework/',1)[0]
              folders[prefix].append(key)

          # Owner-approved scope: all shared Level 1/2/3 cumulative resources plus
          # the already-correct Year 6 Extra cumulative resources.
          expected_groups={'level1':34,'level2':36,'level3':36,'year6-extra':5}
          found_groups=defaultdict(int)
          pairs={}
          for prefix,keys in folders.items():
              parts=prefix.split('/')
              if len(parts)!=3 or parts[0]!='maths' or parts[1] not in expected_groups:
                  continue
              group,lesson_id=parts[1],parts[2]
              sheets=[k for k in keys if '/sheets/' in k]
              answers=[k for k in keys if '/answers/' in k]
              if len(sheets)!=1 or len(answers)!=1:
                  raise SystemExit(f'{prefix}: expected exactly one cumulative sheet and one answer; found {len(sheets)} / {len(answers)}')
              found_groups[group]+=1
              pairs[(group,lesson_id)]={'sheet':sheets[0],'answer':answers[0]}

          if dict(found_groups)!=expected_groups:
              raise SystemExit(f'R2 cumulative folder guard failed: expected {expected_groups}, found {dict(found_groups)}')
          if len(pairs)!=111:
              raise SystemExit(f'Expected 111 live cumulative R2 pairs; found {len(pairs)}')

          level_targets={(g,lid):pair for (g,lid),pair in pairs.items() if g in ('level1','level2','level3')}
          if len(level_targets)!=106:
              raise SystemExit(f'Expected 106 Level 1/2/3 target pairs; found {len(level_targets)}')

          for (group,lid),pair in level_targets.items():
              rec=live.get(lid)
              if not isinstance(rec,dict): raise SystemExit(f'Missing live lesson:{lid}')
              view=f'maths-{group}'
              if view not in (rec.get('displayIds') or {}):
                  raise SystemExit(f'{lid} has R2 {group} cumulative resources but no {view} display identity')

          def cum_supp(a):
              if not isinstance(a,dict): return False
              text=(str(a.get('displayName') or '')+' '+str(a.get('r2Key') or '')).lower()
              return 'cumulative' in text

          before_ep=[]
          before_core=[]
          before_cum_supp=[]
          for lid,rec in live.items():
              p11=rec.get('phase11Resources') or {}
              core=p11.get('core') or {}
              ep=p11.get('elevenPlus') or {}
              for p in core.get('cumulativeHomeworks') or []: before_core.append((lid,p))
              for p in ep.get('cumulativeHomeworks') or []: before_ep.append((lid,p))
              for stream,container in (('core',core),('elevenPlus',ep)):
                  for a in container.get('supplementaryAnswers') or []:
                      if cum_supp(a): before_cum_supp.append((lid,stream,a))

          if len(before_core)!=6:
              raise SystemExit(f'Pre-write guard: expected 6 core cumulative pairs (Y5M2 + five Year6 Extra); found {len(before_core)}')
          if len(before_ep)!=1 or before_ep[0][0] != 'Y4M24':
              raise SystemExit(f'Pre-write guard: expected only existing 11+ pair Y4M24; found {[x[0] for x in before_ep]}')
          if len(before_cum_supp)!=20:
              raise SystemExit(f'Pre-write guard: expected 20 misplaced cumulative supplementary answers; found {len(before_cum_supp)}')

          changed={}
          removed=[]
          for (group,lid),material in sorted(level_targets.items()):
              old=live[lid]
              new=copy.deepcopy(old)
              p11=new.setdefault('phase11Resources',{})
              core=p11.setdefault('core',{})
              ep=p11.setdefault('elevenPlus',{})
              vr=p11.setdefault('vr',{})
              for container in (core,ep):
                  container.setdefault('preLessonPairs',[])
                  container.setdefault('supplementaryAnswers',[])
              core.setdefault('cumulativeHomeworks',[])
              ep.setdefault('homeworks',[])
              ep.setdefault('cumulativeHomeworks',[])
              vr.setdefault('supplementaryAnswers',[])

              for stream,container in (('core',core),('elevenPlus',ep)):
                  kept=[]
                  for answer in container.get('supplementaryAnswers') or []:
                      if cum_supp(answer):
                          removed.append({'lessonId':lid,'stream':stream,'answer':answer})
                      else:
                          kept.append(answer)
                  container['supplementaryAnswers']=kept

              desired={
                  'answerPack':{
                      'displayName':PurePosixPath(material['answer']).name,
                      'r2Key':material['answer'],
                      'resourceId':f'{lid}-cum-01-answer'
                  },
                  'homework':{
                      'displayName':PurePosixPath(material['sheet']).name,
                      'r2Key':material['sheet'],
                      'resourceId':f'{lid}-cum-01-file'
                  },
                  'pairId':f'{lid}-cum-01'
              }
              ep['cumulativeHomeworks']=[desired]
              if new!=old:
                  changed[lid]=new

          if len(changed)!=105:
              raise SystemExit(f'Expected exactly 105 lesson records to change; found {len(changed)}')
          if len(removed)!=20:
              raise SystemExit(f'Expected exactly 20 misplaced supplementary cumulative answers to be removed; found {len(removed)}')

          # Ensure the five Year 6 Extra records are already correctly mapped and untouched.
          for lid in ('Y6M46','Y6M47','Y6M48','Y6M49','Y6M50'):
              cp=((live[lid].get('phase11Resources') or {}).get('core') or {}).get('cumulativeHomeworks') or []
              if len(cp)!=1:
                  raise SystemExit(f'{lid}: Year 6 Extra cumulative pair is not intact before repair')

          backup={lid:live[lid] for lid in sorted(changed)}
          json.dump(backup,open(f'{root}/prewrite-backup.json','w',encoding='utf-8'),indent=2)
          json.dump(removed,open(f'{root}/misplaced-supplementary-answers-removed.json','w',encoding='utf-8'),indent=2)

          bulk=[]
          for lid in sorted(changed):
              value=json.dumps(changed[lid],separators=(',',':'),ensure_ascii=False)
              bulk.append({'key':f'lesson:{lid}','value':value})
          json.dump(bulk,open(f'{root}/kv-bulk-write.json','w',encoding='utf-8'),ensure_ascii=False)

          plan={
              'r2CumulativePairs':111,
              'elevenPlusTargetPairs':106,
              'alreadyCorrectElevenPlusPairs':1,
              'lessonRecordsToWrite':105,
              'misplacedSupplementaryAnswersToRemove':20,
              'preservedCoreCumulativePairs':6,
              'expectedTotalStudentFacingCumulativePairsAfter':112,
              'groupCounts':expected_groups,
              'changedLessonIds':sorted(changed)
          }
          json.dump(plan,open(f'{root}/repair-plan.json','w',encoding='utf-8'),indent=2)
          print(json.dumps(plan,indent=2))
          PY

      - name: Upload pre-write backup and repair plan
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-homework-prewrite-backup
          path: |
            cumulative-fix/prewrite-backup.json
            cumulative-fix/repair-plan.json
            cumulative-fix/misplaced-supplementary-answers-removed.json
            cumulative-fix/kv-bulk-write.json
          retention-days: 14

      - name: Apply all 105 LESSONS_KV corrections together
        shell: bash
        run: |
          set -euo pipefail
          NS="$(cat cumulative-fix/lessons-kv-id.txt)"
          response="$(curl -fsS \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @cumulative-fix/kv-bulk-write.json \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/bulk")"
          printf '%s\n' "$response" > cumulative-fix/write-response.json
          jq -e '.success == true' <<<"$response" >/dev/null
          echo 'Cloudflare accepted the guarded 105-record Cumulative Homework bulk correction.'

      - name: Verify live catalogue after write
        shell: bash
        run: |
          set -euo pipefail
          NS="$(cat cumulative-fix/lessons-kv-id.txt)"
          python3 - <<'PY'
          import json
          plan=json.load(open('cumulative-fix/repair-plan.json',encoding='utf-8'))
          open('cumulative-fix/verify-keys.txt','w').write('\n'.join('lesson:'+x for x in plan['changedLessonIds'])+'\n')
          PY
          : > cumulative-fix/postwrite-lessons.ndjson
          while IFS= read -r key; do
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            value="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${encoded}")"
            jq -cn --arg key "$key" --argjson record "$value" '{kvKey:$key,record:$record}' >> cumulative-fix/postwrite-lessons.ndjson
          done < cumulative-fix/verify-keys.txt

          python3 - <<'PY'
          import json
          from pathlib import PurePosixPath
          rows=[json.loads(x) for x in open('cumulative-fix/postwrite-lessons.ndjson',encoding='utf-8') if x.strip()]
          if len(rows)!=105: raise SystemExit(f'Expected 105 post-write records; got {len(rows)}')
          bad=[]
          cum_supp=[]
          for row in rows:
              lid=row['kvKey'].split(':',1)[-1]
              rec=row['record']
              p11=rec.get('phase11Resources') or {}
              ep=p11.get('elevenPlus') or {}
              pairs=ep.get('cumulativeHomeworks') or []
              if len(pairs)!=1:
                  bad.append({'lessonId':lid,'reason':'pair-count','count':len(pairs)})
                  continue
              pair=pairs[0]
              hw=pair.get('homework') or {}
              ans=pair.get('answerPack') or {}
              expected_group='level1' if lid.startswith('Y4') else ('level2' if lid.startswith('Y5') else 'level3')
              expected_prefix=f'maths/{expected_group}/{lid}/cumulative-homework/'
              if not str(hw.get('r2Key','')).startswith(expected_prefix+'sheets/'):
                  bad.append({'lessonId':lid,'reason':'primary-r2','value':hw.get('r2Key')})
              if not str(ans.get('r2Key','')).startswith(expected_prefix+'answers/'):
                  bad.append({'lessonId':lid,'reason':'answer-r2','value':ans.get('r2Key')})
              for stream in ('core','elevenPlus'):
                  container=(p11.get(stream) or {})
                  for a in container.get('supplementaryAnswers') or []:
                      text=(str(a.get('displayName') or '')+' '+str(a.get('r2Key') or '')).lower()
                      if 'cumulative' in text: cum_supp.append({'lessonId':lid,'stream':stream,'answer':a})
          if bad: raise SystemExit('Post-write pair verification failed: '+json.dumps(bad,indent=2))
          if cum_supp: raise SystemExit('Cumulative answers remain in supplementary arrays: '+json.dumps(cum_supp,indent=2))
          result={
              'verifiedChangedLessonRecords':105,
              'verifiedElevenPlusCumulativePairsOnChangedRecords':105,
              'verifiedMisplacedCumulativeSupplementaryAnswersRemaining':0,
              'status':'PASS'
          }
          json.dump(result,open('cumulative-fix/postwrite-verification.json','w'),indent=2)
          print(json.dumps(result,indent=2))
          PY

      - name: Verify preserved records and global totals
        shell: bash
        run: |
          set -euo pipefail
          NS="$(cat cumulative-fix/lessons-kv-id.txt)"
          for lid in Y4M24 Y5M2 Y6M46 Y6M47 Y6M48 Y6M49 Y6M50; do
            key="lesson:${lid}"
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${encoded}" \
              > "cumulative-fix/preserved-${lid}.json"
          done
          python3 - <<'PY'
          import json
          y4=json.load(open('cumulative-fix/preserved-Y4M24.json'))
          if len((((y4.get('phase11Resources') or {}).get('elevenPlus') or {}).get('cumulativeHomeworks') or []))!=1:
              raise SystemExit('Y4M24 existing Level 1 cumulative pair was not preserved')
          y5=json.load(open('cumulative-fix/preserved-Y5M2.json'))
          if len((((y5.get('phase11Resources') or {}).get('core') or {}).get('cumulativeHomeworks') or []))!=1:
              raise SystemExit('Y5M2 normal-Year core cumulative pair was not preserved')
          for lid in ('Y6M46','Y6M47','Y6M48','Y6M49','Y6M50'):
              rec=json.load(open(f'cumulative-fix/preserved-{lid}.json'))
              if len((((rec.get('phase11Resources') or {}).get('core') or {}).get('cumulativeHomeworks') or []))!=1:
                  raise SystemExit(f'{lid} Year 6 Extra core cumulative pair was not preserved')
          print('Preserved-pair verification: PASS')
          print('Global intended state: 106 Level 1/2/3 11+ cumulative pairs + 6 core cumulative pairs = 112 student-facing pairs.')
          PY

      - name: Upload post-write evidence
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-homework-postwrite-verification
          path: |
            cumulative-fix/write-response.json
            cumulative-fix/postwrite-verification.json
            cumulative-fix/postwrite-lessons.ndjson
            cumulative-fix/preserved-*.json
          retention-days: 14
