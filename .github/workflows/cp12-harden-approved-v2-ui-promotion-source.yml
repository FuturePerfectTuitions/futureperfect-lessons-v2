name: CP12 harden approved V2 UI promotion source

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths: ['.github/workflows/cp12-harden-approved-v2-ui-promotion-source.yml']

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden exact promotion workflow locally
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/cp12-harden-promotion-workflow.py
          test "$(git hash-object scripts/cp12-resource-ui-production-metadata.mjs)" = c30146fb3674449ba3b972f41ef52c04554d74e1
          test "$(git hash-object scripts/rebuild-cp12-admin-incident-auth-smoke.mjs)" = f153d85176e813d8507d03c9c59b6a5ebccfcf62
          grep -F 'CP12_APPROVED_V2_UI_ADMIN_PREWRITE_CREDENTIAL_GATE_PASS' .github/workflows/cp12-approved-v2-ui-production-promote.yml >/dev/null
          grep -F 'Automatic full rollback on any promotion failure' .github/workflows/cp12-approved-v2-ui-production-promote.yml >/dev/null
          ! grep -F "if: failure() && env.METADATA_PUBLISHED == 'true'" .github/workflows/cp12-approved-v2-ui-production-promote.yml
          test ! -e docs/rebuild/CP12_APPROVED_V2_UI_PRODUCTION_TRIGGER.md
          git diff --check
      - name: Commit validated hardened workflow locally
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name FuturePerfectTuitions
          git config user.email futureperfectlessons@gmail.com
          git add .github/workflows/cp12-approved-v2-ui-production-promote.yml
          git commit -m 'CP12: harden approved V2 UI production promotion'
          git push origin HEAD:fix/cp12-approved-v2-ui-staging-2026-09-14
