name: CP12 VR resource repair production preview

on:
  push:
    branches:
      - fix/cp12-vr-resource-repair-2026-09-14
    paths:
      - '.github/workflows/cp12-vr-resource-repair-production-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER: fpt-portal-v2-worker
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
      EXPECTED_LESSONS_KV_ID: 49619b1a24b244bc8aaa6223fcd24e80
      EXPECTED_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare live current and repaired candidates read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, pointerKey, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim();
          const token=clean(process.env.CLOUDFLARE_API_TOKEN),account=clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const legacy=clean(process.env.LEGACY_WORKER),student=clean(process.env.STUDENT_WORKER);
          const expectedLessons=clean(process.env.EXPECTED_LESSONS_KV_ID),expectedRead=clean(process.env.EXPECTED_READ_MODELS_KV_ID);
          const base='https://api.cloudflare.com/client/v4',auth={Authorization:`Bearer ${token}`};
          async function req(path){const r=await fetch(`${base}${path}`,{headers:auth});const text=await r.text();let body=null;try{body=JSON.parse(text);}catch{}return{r,text,body};}
          async function cf(path){const o=await req(path);if(!o.r.ok||o.body?.success!==true)throw new Error(`CF read failed ${o.r.status}: ${path}`);return o.body.result;}
          async function kvText(ns,key){const o=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(!o.r.ok)throw new Error(`KV read failed ${o.r.status}:${key}`);return o.text;}
          async function kvJson(ns,key){return JSON.parse(await kvText(ns,key));}
          const legacySettings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(legacy)}/settings`);
          const lessonsNs=clean((legacySettings.bindings||[]).find(b=>clean(b.name)==='LESSONS_KV')?.namespace_id);
          if(lessonsNs!==expectedLessons)throw new Error(`LESSONS_KV drift:${lessonsNs}`);
          const studentSettings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(student)}/settings`);
          const readNs=clean((studentSettings.bindings||[]).find(b=>clean(b.name)==='READ_MODELS_KV')?.namespace_id);
          if(readNs!==expectedRead)throw new Error(`READ_MODELS_KV drift:${readNs}`);
          const expected={Y4E1:['PRI260225Y4T1EE01VRH01.pdf','Answer Key PRI260225Y4T1EE01VRH01A.pdf'],Y5E2:['FAR070225Y5T1EE01VRP01.pdf','Answer key FAR070225Y5T1EE01VRP01A.pdf','FAR210225Y5T1EE01VRH01.pdf','Answer Key - FAR210225Y5T1EE01VRH01A.pdf']};
          const report={marker:'CP12_VR_PRODUCTION_PREVIEW_PASS',observedAt:new Date().toISOString(),lessons:{}};
          for(const id of ['Y4E1','Y5E2']){
            const source=await kvJson(lessonsNs,`lesson:${id}`);
            const candidate=await compileLessonDetail(source,{resourceExists:async()=>true});
            const scope=`lesson:${id}`;
            const pointer=await kvJson(readNs,pointerKey(scope));
            const currentEnvelope=await kvJson(readNs,versionKey(scope,clean(pointer?.current?.version)));
            const current=currentEnvelope?.payload;
            if(current?.kind!=='prepared-lesson-detail')throw new Error(`Current detail invalid:${id}`);
            const strip=p=>({schemaVersion:p.schemaVersion,kind:p.kind,lessonId:p.lessonId,title:p.title,description:p.description,videoVariants:p.videoVariants||null});
            if(stableStringify(strip(current))!==stableStringify(strip(candidate)))throw new Error(`Non-resource drift:${id}`);
            const currentKeys=new Set((current.resources||[]).map(r=>clean(r.objectKey)));
            const added=(candidate.resources||[]).filter(r=>!currentKeys.has(clean(r.objectKey)));
            const removed=(current.resources||[]).filter(r=>!(candidate.resources||[]).some(x=>clean(x.objectKey)===clean(r.objectKey)));
            if(removed.length)throw new Error(`Candidate removes resources:${id}:${removed.map(r=>r.objectKey).join(',')}`);
            for(const suffix of expected[id]){
              const row=added.find(r=>clean(r.objectKey).endsWith(suffix));
              if(!row)throw new Error(`Expected missing VR resource not in exact candidate delta:${id}:${suffix}`);
              if(JSON.stringify(row.presentationScopes)!==JSON.stringify(['vr']))throw new Error(`Added resource not VR scoped:${id}:${suffix}`);
              if(/answer/i.test(suffix)&&!(row.type==='answer-pack'&&row.protected===true))throw new Error(`Added answer not protected:${id}:${suffix}`);
            }
            if(added.length!==expected[id].length)throw new Error(`Unexpected extra candidate delta:${id}:${JSON.stringify(added.map(r=>r.objectKey))}`);
            report.lessons[id]={currentVersion:clean(pointer.current.version),currentResourceCount:current.resources.length,candidateResourceCount:candidate.resources.length,added:added.map(r=>({type:r.type,displayName:r.displayName,objectKey:r.objectKey,protected:r.protected===true,presentationScopes:r.presentationScopes}))};
          }
          fs.writeFileSync('/tmp/cp12-vr-production-preview.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-vr-production-preview
          path: /tmp/cp12-vr-production-preview.json
          if-no-files-found: error
          retention-days: 30
