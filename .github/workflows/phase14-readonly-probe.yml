name: Phase 14 read-only KV probe

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-readonly-probe.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  probe:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read-only KV probe
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS" && test -n "$LESSONS"

          $W kv key list --namespace-id "$STUDENTS" --prefix 'user:testy5p14' --remote >/tmp/p14-users.json
          jq -e 'length == 0' /tmp/p14-users.json >/dev/null

          $W kv key get 'lesson:Y5M1' --namespace-id "$LESSONS" --remote >/tmp/y5m1.json
          $W kv key get 'lesson:Y5E1' --namespace-id "$LESSONS" --remote >/tmp/y5e1.json
          jq -c '{lessonId,subject,active,curriculumCodes}' /tmp/y5m1.json
          jq -c '{lessonId,subject,active,curriculumCodes}' /tmp/y5e1.json
          jq -e '.lessonId=="Y5M1" and .subject=="maths"' /tmp/y5m1.json >/dev/null
          jq -e '.lessonId=="Y5E1" and .subject=="english"' /tmp/y5e1.json >/dev/null
          echo 'Phase 14 read-only KV probe: PASS'
