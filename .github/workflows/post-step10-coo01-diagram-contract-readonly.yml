name: Post-Step-10 COO-01 diagram contract read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-coo01-diagram-contract-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Extract JSON key/type contract only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-coo01-contract-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT question_id,presentation_type,diagram_type,diagram_spec_json,validation_spec_json FROM question_instance WHERE family_id='COO-01' AND lifecycle_status='Live';" --json >/tmp/raw.json
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=json.loads(Path('/tmp/raw.json').read_text())[0]['results']
          def shape(v,prefix=''):
              out=[]
              if isinstance(v,dict):
                  for k,val in sorted(v.items()):
                      path=f'{prefix}.{k}' if prefix else k
                      out.append((path,type(val).__name__))
                      if isinstance(val,(dict,list)): out.extend(shape(val,path))
              elif isinstance(v,list):
                  out.append((prefix+'[]','list_item:'+ (type(v[0]).__name__ if v else 'empty')))
                  if v and isinstance(v[0],(dict,list)): out.extend(shape(v[0],prefix+'[]'))
              return out
          result=[]
          for r in rows:
              d=json.loads(r['diagram_spec_json']) if r.get('diagram_spec_json') else None
              v=json.loads(r['validation_spec_json']) if r.get('validation_spec_json') else None
              result.append({
                  'question_id':r['question_id'],
                  'presentation_type':r['presentation_type'],
                  'diagram_type':r['diagram_type'],
                  'diagram_contract':'; '.join(f'{p}:{t}' for p,t in shape(d)),
                  'validation_contract':'; '.join(f'{p}:{t}' for p,t in shape(v))
              })
          with open('/tmp/coo01_contract.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=result[0].keys());w.writeheader();w.writerows(result)
          print(json.dumps({'marker':'POST_STEP10_COO01_CONTRACT_READONLY_PASS','live_rows':len(rows),'raw_question_text_exported':False,'raw_json_values_exported':False},indent=2))
          PY
          rm -f /tmp/raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-coo01-diagram-contract-readonly
          path: /tmp/coo01_contract.csv
          retention-days: 30
