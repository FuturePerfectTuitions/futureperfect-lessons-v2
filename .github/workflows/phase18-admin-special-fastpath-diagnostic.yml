name: Phase 18 Admin special fastpath diagnostic

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-admin-special-fastpath-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ADMIN_PASSWORD: ${{ secrets.FPT_ADMIN_DEMO_PASSWORD }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  ORIGIN: https://futureperfecttuitions.github.io
  WRANGLER_VERSION: 4.125.0
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_D1: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy fastpath temporarily, diagnose special areas, restore Phase 17
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          RESTORE_NEEDED=0
          restore() {
            local rc=$?
            trap - EXIT ERR
            set +e
            if [ "$RESTORE_NEEDED" -eq 1 ]; then
              cat > worker/wrangler.admin-special.restore.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase17.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "admin"
          STUDENT_LOGIN_ENABLED = "false"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${EXPECTED_STUDENTS_KV}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${EXPECTED_LESSONS_KV}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${EXPECTED_R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${EXPECTED_D1}"
          EOF
              $W deploy --config worker/wrangler.admin-special.restore.toml --keep-vars --message 'Restore Phase 17 after Admin special diagnostic' >/tmp/restore.log 2>&1
              echo 'ADMIN_SPECIAL_DIAG_RESTORE=ATTEMPTED'
            fi
            exit "$rc"
          }
          trap restore EXIT

          test -n "$ADMIN_PASSWORD"; test "${#ADMIN_PASSWORD}" -eq 4
          node --check worker/src/index-phase18-admin-demo.js
          node scripts/phase11-navigation-manifest.mjs >/tmp/nav.json

          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          test "$(jq -r '[.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)" = development
          test "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json | tr '[:upper:]' '[:lower:]')" = admin
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) exit 3;; esac

          cat > worker/wrangler.admin-special.diag.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase18-admin-demo.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "admin"
          STUDENT_LOGIN_ENABLED = "false"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${EXPECTED_STUDENTS_KV}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${EXPECTED_LESSONS_KV}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${EXPECTED_R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${EXPECTED_D1}"
          EOF
          $W deploy --config worker/wrangler.admin-special.diag.toml --keep-vars --message 'Temporary Admin special fastpath diagnostic' >/tmp/deploy.log 2>&1
          RESTORE_NEEDED=1
          sleep 4

          rm -f /tmp/cookies.txt
          LOGIN_CODE="$(curl --silent --show-error --max-time 15 --output /tmp/login.json --write-out '%{http_code}' --cookie-jar /tmp/cookies.txt --header "Origin: ${ORIGIN}" --header 'Content-Type: application/json' --data "$(jq -nc --arg u Admin --arg p "$ADMIN_PASSWORD" '{username:$u,password:$p}')" "$WORKER_BASE/api/v1/student/auth/login")"
          echo "ADMIN_SPECIAL_DIAG login_http=${LOGIN_CODE} ok=$(jq -r '.ok // false' /tmp/login.json 2>/dev/null || echo false)"
          test "$LOGIN_CODE" = 200

          for spec in 'VR_HOWTO|english-year5-11plus' 'Y4MAssT1|maths-level2' 'Y4MAssT2|maths-level2' 'Y5MAssT1|maths-level3' 'Y5MAssT2|maths-level3' 'MOCKS|maths-level3'; do
            bucket="${spec%%|*}"; view="${spec#*|}"
            START="$(date +%s%3N)"
            set +e
            CODE="$(curl --silent --show-error --max-time 20 --output "/tmp/${bucket}.json" --write-out '%{http_code}' --cookie /tmp/cookies.txt --header "Origin: ${ORIGIN}" "$WORKER_BASE/api/v1/student/special-areas/${bucket}?viewId=${view}")"
            CURL_RC=$?
            set -e
            END="$(date +%s%3N)"; MS=$((END-START))
            ERROR="$(jq -r '.error // ""' "/tmp/${bucket}.json" 2>/dev/null || true)"
            OK="$(jq -r '.ok // false' "/tmp/${bucket}.json" 2>/dev/null || echo false)"
            RETURNED="$(jq -r '.area.bucketId // ""' "/tmp/${bucket}.json" 2>/dev/null || true)"
            echo "ADMIN_SPECIAL_DIAG bucket=${bucket} view=${view} curl_rc=${CURL_RC} http=${CODE} ok=${OK} returned=${RETURNED} error=${ERROR} ms=${MS}"
          done

          $W d1 execute fpt_portal_v2_db --remote --json --command "SELECT COUNT(*) AS n FROM lesson_entitlements; SELECT COUNT(*) AS n FROM student_batch_assignments; SELECT COUNT(*) AS n FROM batch_lesson_releases;" >/tmp/d1.json 2>/tmp/d1.err
          echo "ADMIN_SPECIAL_DIAG_D1 entitlements=$(jq -r '.[0].results[0].n' /tmp/d1.json) assignments=$(jq -r '.[1].results[0].n' /tmp/d1.json) releases=$(jq -r '.[2].results[0].n' /tmp/d1.json)"
          test "$(jq -r '.[0].results[0].n' /tmp/d1.json)" = 173
          test "$(jq -r '.[1].results[0].n' /tmp/d1.json)" = 4
          test "$(jq -r '.[2].results[0].n' /tmp/d1.json)" = 0
          echo 'ADMIN_SPECIAL_DIAGNOSTIC=COMPLETE'
