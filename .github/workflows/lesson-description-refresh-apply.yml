name: Apply lesson description refresh

on:
  push:
    branches: [main]
    paths:
      - 'ops/lesson-description-refresh.json'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guarded live LESSONS_KV description update
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID
          node <<'NODE'
          const fs = require('fs');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const wc = s => String(s || '').trim() ? String(s).trim().split(/\s+/).length : 0;
          const withoutDescription = value => {
            const clone = JSON.parse(JSON.stringify(value));
            delete clone.description;
            return JSON.stringify(clone);
          };
          (async () => {
            const patch = JSON.parse(fs.readFileSync('ops/lesson-description-refresh.json','utf8'));
            if (!patch || !Array.isArray(patch.lessons) || !patch.lessons.length) throw new Error('Patch has no lessons.');
            const ids = patch.lessons.map(x => x.lessonId);
            if (new Set(ids).size !== ids.length) throw new Error('Duplicate lessonId in patch.');

            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const ns = process.env.LESSONS_KV_ID;
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
            const auth = {Authorization:`Bearer ${token}`};

            async function getRecord(id) {
              const r = await fetch(base + encodeURIComponent(`lesson:${id}`), {headers:auth});
              if (!r.ok) throw new Error(`GET lesson:${id} failed HTTP ${r.status}`);
              const text = await r.text();
              try { return JSON.parse(text); } catch { throw new Error(`lesson:${id} is not valid JSON`); }
            }
            async function putRecord(id, record) {
              const r = await fetch(base + encodeURIComponent(`lesson:${id}`), {
                method:'PUT',
                headers:{...auth,'Content-Type':'application/json; charset=utf-8'},
                body:JSON.stringify(record)
              });
              if (!r.ok) throw new Error(`PUT lesson:${id} failed HTTP ${r.status}: ${await r.text()}`);
            }
            async function verifyRecord(id, before, wanted) {
              let after;
              for (let attempt=1; attempt<=6; attempt++) {
                after = await getRecord(id);
                if (after.description === wanted && withoutDescription(after) === withoutDescription(before)) return;
                if (attempt < 6) await sleep(2000);
              }
              if (after.description !== wanted) throw new Error(`Verification failed for ${id}: description mismatch`);
              throw new Error(`Verification failed for ${id}: a non-description field changed`);
            }

            // Full preflight before the first write.
            const plan=[];
            for (const item of patch.lessons) {
              if (!item.lessonId || !item.expectedTitle || !item.description) throw new Error('Patch item missing required field.');
              const current = await getRecord(item.lessonId);
              if (String(current.lessonId || item.lessonId) !== item.lessonId) throw new Error(`lessonId mismatch for ${item.lessonId}`);
              if (current.title !== item.expectedTitle) throw new Error(`Title mismatch for ${item.lessonId}: live="${current.title}" expected="${item.expectedTitle}"`);
              if (current.description === item.description) {
                plan.push({item,current,action:'already'});
                continue;
              }
              const currentWords = wc(current.description);
              if (currentWords >= 200) {
                plan.push({item,current,action:'skip_detailed',currentWords});
                continue;
              }
              plan.push({item,current,action:'write',currentWords});
            }

            console.log(`PREFLIGHT_TOTAL=${plan.length}`);
            console.log(`PREFLIGHT_WRITE=${plan.filter(x=>x.action==='write').length}`);
            console.log(`PREFLIGHT_ALREADY=${plan.filter(x=>x.action==='already').length}`);
            console.log(`PREFLIGHT_SKIP_DETAILED=${plan.filter(x=>x.action==='skip_detailed').length}`);
            for (const x of plan.filter(x=>x.action==='skip_detailed')) console.log(`SKIP_DETAILED ${x.item.lessonId} words=${x.currentWords}`);

            const written=[];
            try {
              for (const x of plan) {
                if (x.action !== 'write') continue;
                const next = {...x.current, description:x.item.description};
                await putRecord(x.item.lessonId, next);
                await verifyRecord(x.item.lessonId, x.current, x.item.description);
                written.push(x);
                console.log(`UPDATED ${x.item.lessonId} ${x.item.expectedTitle}`);
              }
            } catch (err) {
              console.error(`APPLY_FAILED: ${err.message}`);
              console.error(`ROLLBACK_COUNT=${written.length}`);
              for (const x of written.reverse()) {
                try {
                  await putRecord(x.item.lessonId, x.current);
                  await verifyRecord(x.item.lessonId, {...x.current, description:x.item.description}, x.current.description || '');
                  console.log(`ROLLED_BACK ${x.item.lessonId}`);
                } catch (rollbackErr) {
                  console.error(`ROLLBACK_FAILED ${x.item.lessonId}: ${rollbackErr.message}`);
                }
              }
              process.exit(1);
            }

            // Final re-read of every written lesson.
            for (const x of written) {
              const after = await getRecord(x.item.lessonId);
              if (after.description !== x.item.description) throw new Error(`Final verification description mismatch for ${x.item.lessonId}`);
              if (withoutDescription(after) !== withoutDescription(x.current)) throw new Error(`Final verification non-description mismatch for ${x.item.lessonId}`);
            }
            console.log(`APPLIED=${written.length}`);
            console.log(`UNCHANGED_ALREADY=${plan.filter(x=>x.action==='already').length}`);
            console.log(`SKIPPED_ALREADY_DETAILED=${plan.filter(x=>x.action==='skip_detailed').length}`);
            console.log('FINAL_VERIFICATION=PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
