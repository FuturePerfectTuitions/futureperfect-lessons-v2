name: Phase 12 guarded real-student apply

on:
  pull_request:
    branches: [main]
    paths:
      - docs/data/phase12/real-students-payload.enc.json
      - scripts/phase12-real-student-apply-v2.mjs
      - .github/workflows/phase12-real-student-apply.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  apply-development:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-real-student-data' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare exact private apply engine
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/phase12-real-student-apply-v2.mjs scripts/phase12-real-student-run.mjs
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/phase12-real-student-run.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const beforeValue = 'fullLibraries: [],';
          const afterValue = 'fullLibraries: [...(student.fullLibraries || [])],';
          const beforeGuard = "if ((student.fullLibraries || []).length) fail('Full Library override not permitted for this exact apply');";
          const afterGuard = "{ const allowedFullLibraries = new Set(['ENGLISH_Y4_11PLUS_FULL','MATHS_L1_FULL','MATHS_L2_FULL']); for (const code of (student.fullLibraries || [])) if (!allowedFullLibraries.has(code)) fail('Unexpected full-catalogue presentation override'); }";
          if (!text.includes(beforeValue) || !text.includes(beforeGuard)) throw new Error('Private apply patch anchors changed');
          text = text.replace(beforeValue, afterValue).replace(beforeGuard, afterGuard);
          fs.writeFileSync(path, text);
          NODE
          node --check scripts/phase12-real-student-run.mjs

      - name: Apply and verify exactly two owner-approved students
        run: node --experimental-default-type=module scripts/phase12-real-student-run.mjs
