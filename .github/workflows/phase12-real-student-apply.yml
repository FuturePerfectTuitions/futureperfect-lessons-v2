name: Phase 12 guarded real-student apply

on:
  pull_request:
    branches: [main]
    paths:
      - docs/data/phase12/real-students-payload.enc.json
      - scripts/phase12-real-student-apply.mjs
      - .github/workflows/phase12-real-student-apply.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  apply-development:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-real-student-data' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify private apply engine syntax
        run: node --check scripts/phase12-real-student-apply.mjs

      - name: Apply and verify exactly two owner-approved students
        run: node --experimental-default-type=module scripts/phase12-real-student-apply.mjs
