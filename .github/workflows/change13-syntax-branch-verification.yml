name: Change 13 syntax branch verification

on:
  push:
    branches: [fix/change13-syntax-and-deploy]
    paths:
      - '.github/workflows/change13-syntax-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current Worker chain
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nav-check
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/nav-check >/tmp/nav-check.log
          node --check worker/src/index-phase20-change13.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node --check worker/src/phase11-navigation-cache.js
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          echo 'CHANGE13_SYNTAX_BRANCH_PASS'
