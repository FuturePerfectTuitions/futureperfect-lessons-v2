name: Phase 13 temporary assignment gate fixture

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-assignment-gate-temp.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  set-gate:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guard and move only controlled assignment start
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing.' >&2; false;; esac
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT batch_key,active_from,active_to FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__'; SELECT portal_user_id_norm,batch_key,effective_from,effective_to FROM student_batch_assignments WHERE portal_user_id_norm='testy2e' AND batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS entitlement_rows FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id='Y5E10'; SELECT COUNT(*) AS release_rows FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id='Y5E10'; PRAGMA quick_check;" >/tmp/pre.json
          test "$(jq -r '.[0].results|length' /tmp/pre.json)" = '1'
          test "$(jq -r '.[0].results[0].active_from' /tmp/pre.json)" = '2000-01-01'
          test "$(jq -r '.[1].results|length' /tmp/pre.json)" = '1'
          test "$(jq -r '.[1].results[0].effective_from' /tmp/pre.json)" = '2000-01-01'
          test "$(jq -r '.[2].results[0].entitlement_rows' /tmp/pre.json)" = '1'
          test "$(jq -r '.[3].results[0].release_rows' /tmp/pre.json)" = '1'
          jq -e '.[4].results[]|select(.quick_check=="ok")' /tmp/pre.json >/dev/null

          $W d1 execute fpt_portal_v2_db --remote --command \
            "UPDATE student_batch_assignments SET effective_from='2026-09-15', updated_at=CURRENT_TIMESTAMP WHERE portal_user_id_norm='testy2e' AND batch_key='__P13_ACCEPT_E5__' AND effective_from='2000-01-01' AND effective_to IS NULL;" --yes >/tmp/update.log 2>&1

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT portal_user_id_norm,batch_key,effective_from,effective_to FROM student_batch_assignments WHERE portal_user_id_norm='testy2e' AND batch_key='__P13_ACCEPT_E5__'; PRAGMA quick_check;" >/tmp/post.json
          test "$(jq -r '.[0].results|length' /tmp/post.json)" = '1'
          test "$(jq -r '.[0].results[0].effective_from' /tmp/post.json)" = '2026-09-15'
          jq -e '.[1].results[]|select(.quick_check=="ok")' /tmp/post.json >/dev/null
          echo 'Controlled assignment now begins 2026-09-15; existing entitlement/release retained.'
