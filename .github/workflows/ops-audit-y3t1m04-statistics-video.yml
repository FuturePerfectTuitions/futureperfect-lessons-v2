name: Ops audit Y3T1M04 Statistics video

on:
  push:
    branches: [ops/y3t1m04-video-audit-2026-09-28]
    paths: [.github/workflows/ops-audit-y3t1m04-statistics-video.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Read current production lesson and prepared state
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          export LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          export READ_MODELS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="READ_MODELS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          test -n "$READ_MODELS_KV_ID"; test "$READ_MODELS_KV_ID" != null

          node --input-type=module > /tmp/y3t1m04-audit.txt <<'NODE'
          import { pointerKey, resolveCurrentScope } from './worker/src/access-read-model-sync.js';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const lessonsNs=process.env.LESSONS_KV_ID, readNs=process.env.READ_MODELS_KV_ID;
          const auth={Authorization:`Bearer ${token}`};
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces`;
          async function text(ns,key){const r=await fetch(`${base}/${ns}/values/${encodeURIComponent(key)}`,{headers:auth});if(r.status===404)return null;if(!r.ok)throw new Error(`GET ${key} ${r.status}`);return r.text();}
          async function json(ns,key){const t=await text(ns,key);return t==null?null:JSON.parse(t);}
          async function keys(ns,prefix){const out=[];let cursor='';do{const u=new URL(`${base}/${ns}/keys`);u.searchParams.set('prefix',prefix);u.searchParams.set('limit','1000');if(cursor)u.searchParams.set('cursor',cursor);const r=await fetch(u,{headers:auth});if(!r.ok)throw new Error(`LIST ${r.status}`);const b=await r.json();out.push(...(b.result||[]).map(x=>x.name).filter(Boolean));cursor=String(b?.result_info?.cursor||'');}while(cursor);return out;}
          const vals=r=>Object.values(r?.displayIds||{}).map(String);
          const lessonKeys=await keys(lessonsNs,'lesson:');
          const matches=[];
          for(let i=0;i<lessonKeys.length;i+=25){const batch=lessonKeys.slice(i,i+25);const rows=await Promise.all(batch.map(async key=>({key,rec:await json(lessonsNs,key)})));for(const x of rows){if(vals(x.rec).includes('Y3T1M04')||/^statistics and measurements$/i.test(String(x.rec?.title||'').trim()))matches.push(x);}}
          if(matches.length!==1)throw new Error(`MATCH_COUNT_${matches.length}`);
          const {key,rec}=matches[0];
          const v=rec?.video||rec?.core?.video||null;
          const summary=v&&typeof v==='object'?{screenpal:v.screenpal||null,contentUrl:v.contentUrl||null,embedUrl:v.embedUrl||v.playerUrl||null,watchUrl:v.watchUrl||null}:v;
          console.log('CANONICAL='+JSON.stringify({key,lessonId:rec.lessonId,title:rec.title,displayIds:rec.displayIds,contentStatus:rec.contentStatus||null,video:summary}));
          const store={async get(k,o){const t=await text(readNs,k);return t==null?null:(o?.type==='json'?JSON.parse(t):t);}};
          const scope=`lesson:${rec.lessonId}`, pk=pointerKey(scope), rp=await store.get(pk);
          console.log('PREPARED_POINTER='+JSON.stringify({scope,pointerKey:pk,exists:rp!=null,rawPointer:rp}));
          if(rp!=null){const p=await resolveCurrentScope(store,scope);const urls=[];const walk=(x,path='$')=>{if(x==null)return;if(typeof x==='string'){if(/screenpal|https?:\/\//i.test(x))urls.push({path,value:x});return;}if(Array.isArray(x)){x.forEach((y,i)=>walk(y,`${path}[${i}]`));return;}if(typeof x==='object')for(const [k,y] of Object.entries(x))walk(y,`${path}.${k}`);};walk(p?.payload);console.log('PREPARED='+JSON.stringify({version:p?.version||null,payloadSha256:p?.payloadSha256||null,urlLike:urls}));}
          const code='cOjtl4nwixU';
          const target={screenpal:code,contentUrl:`https://screenpal.com/content/video/${code}`,embedUrl:`https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,watchUrl:`https://go.screenpal.com/watch/${code}`};
          console.log('TARGET='+JSON.stringify({...target,differsFromCanonical:summary?.screenpal!==target.screenpal||summary?.embedUrl!==target.embedUrl}));
          NODE
          cat /tmp/y3t1m04-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: y3t1m04-video-audit-evidence
          path: /tmp/y3t1m04-audit.txt
          if-no-files-found: error
          retention-days: 7
