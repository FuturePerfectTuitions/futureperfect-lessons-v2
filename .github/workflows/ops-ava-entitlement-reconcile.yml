name: Guarded Ava entitlement reconciliation

on:
  push:
    branches: [ops/ava-entitlement]
    paths:
      - '.github/workflows/ops-ava-entitlement-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      TARGET_STEM_SHA256: bf446ea38129b6f1a1ada774c9130c81a33904db1ee88e5b557d76ef1fb5e22d

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production and resolve bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          DBID="$(jq -r '.result.bindings[] | select(.name=="DB" and (.type=="d1" or .type=="d1_database")) | (.id // .database_id // empty)' /tmp/settings.json | head -n1)"
          test -n "$STUDENTS" && test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"
          echo "dbid=$DBID" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_GUARD=true'

      - name: Locate target and reconcile profile entitlements only
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix 'user:' --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys, urllib.parse, urllib.request
          target=os.environ['TARGET_STEM_SHA256']
          candidates=[]
          for item in json.load(open('/tmp/keys.json',encoding='utf-8')):
              key=str(item.get('name') or '')
              if not key.startswith('user:'): continue
              suffix=key[5:].strip().lower()
              if suffix.startswith(('admin','demo','trial')): continue
              stem=re.sub(r'\d+$','',suffix)
              if hashlib.sha256(stem.encode()).hexdigest()==target:
                  candidates.append((key,suffix))
          print('TARGET_MATCH_COUNT=' + str(len(candidates)))
          if len(candidates)!=1: sys.exit(2)
          key,suffix=candidates[0]
          p=subprocess.run(['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
          if p.returncode: sys.exit(3)
          user=json.loads(p.stdout)
          if str(user.get('role') or '').strip().lower()=='admin': sys.exit(4)

          manual=user.get('manualAccess') if isinstance(user.get('manualAccess'),dict) else {}
          before_safe={
            'fullLibraries': user.get('fullLibraries') if isinstance(user.get('fullLibraries'),list) else [],
            'upsellViews': user.get('upsellViews') if isinstance(user.get('upsellViews'),list) else None,
            'trialViews': user.get('trialViews') if isinstance(user.get('trialViews'),list) else [],
            'batches': user.get('batches') if isinstance(user.get('batches'),list) else [],
            'manualCoreLessons': manual.get('coreLessons') if isinstance(manual.get('coreLessons'),list) else [],
            'blockedLessons': user.get('blockedLessons') if isinstance(user.get('blockedLessons'),list) else [],
            'vrBuckets': user.get('vrBuckets') if isinstance(user.get('vrBuckets'),list) else [],
            'vrEligible': bool(user.get('vrEligible') is True)
          }
          print('BEFORE=' + json.dumps(before_safe,separators=(',',':'),sort_keys=True))

          before=json.loads(json.dumps(user))
          user['fullLibraries']=['MATHS_Y4_FULL']
          user['upsellViews']=['english-year5']
          user['trialViews']=[]

          before_other=json.loads(json.dumps(before))
          after_other=json.loads(json.dumps(user))
          for field in ('fullLibraries','upsellViews','trialViews'):
              before_other.pop(field,None); after_other.pop(field,None)
          if before_other != after_other:
              print('UNRELATED_FIELD_GUARD=false'); sys.exit(5)

          changed = before.get('fullLibraries') != user['fullLibraries'] or before.get('upsellViews') != user['upsellViews'] or before.get('trialViews') != user['trialViews']
          print('PROFILE_CHANGED=' + ('true' if changed else 'false'))
          if changed:
              data=json.dumps(user,separators=(',',':')).encode()
              url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/{os.environ['STUDENTS_KV_ID']}/values/{urllib.parse.quote(key,safe='')}"
              req=urllib.request.Request(url,data=data,headers={'Authorization':f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}",'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): sys.exit(6)

          open('/tmp/target-norm','w').write(suffix)
          open('/tmp/target-key','w').write(key)
          PY

      - name: Verify exact profile result
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat /tmp/target-key)"
          npx --yes wrangler@latest kv key get "$KEY" --namespace-id "$STUDENTS_KV_ID" --remote > /tmp/verify.json 2>/dev/null
          python3 - <<'PY'
          import json,sys
          user=json.load(open('/tmp/verify.json'))
          if user.get('fullLibraries') != ['MATHS_Y4_FULL']:
              print('FULL_LIBRARY_VERIFY=false'); sys.exit(2)
          if user.get('upsellViews') != ['english-year5']:
              print('UPSELL_VERIFY=false'); sys.exit(3)
          if user.get('trialViews') != []:
              print('TRIAL_VERIFY=false'); sys.exit(4)
          manual=user.get('manualAccess') if isinstance(user.get('manualAccess'),dict) else {}
          safe={
            'fullLibraries':user.get('fullLibraries'),
            'upsellViews':user.get('upsellViews'),
            'trialViews':user.get('trialViews'),
            'batches':user.get('batches') if isinstance(user.get('batches'),list) else [],
            'manualCoreLessons':manual.get('coreLessons') if isinstance(manual.get('coreLessons'),list) else [],
            'blockedLessons':user.get('blockedLessons') if isinstance(user.get('blockedLessons'),list) else []
          }
          print('AFTER=' + json.dumps(safe,separators=(',',':'),sort_keys=True))
          print('FULL_LIBRARY_VERIFY=true')
          print('UPSELL_VERIFY=true')
          print('TRIAL_VERIFY=true')
          PY

      - name: Read sanitized D1 ongoing releases
        if: ${{ steps.guard.outputs.dbid != '' }}
        env:
          DB_ID: ${{ steps.guard.outputs.dbid }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['DB_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; target=open('/tmp/target-norm').read().strip()
          def query(sql):
              req=urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',
                  data=json.dumps({'sql':sql,'params':[target]}).encode(),
                  headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},
                  method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(5)
              result=(body.get('result') or [{}])[0]
              return result.get('results') or []
          full=query('SELECT lesson_id, core_access, vr_access FROM lesson_entitlements WHERE portal_user_id_norm = ? ORDER BY lesson_id')
          pre=query('SELECT lesson_id, batch_key, vr_access FROM online_prelesson_entitlements WHERE portal_user_id_norm = ? ORDER BY lesson_id')
          print('D1_ENTITLEMENTS=' + json.dumps({'lessonEntitlements':full,'prelessonEntitlements':pre},separators=(',',':'),sort_keys=True))
          PY
