name: Phase 19 diagnostic verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-diagnostic-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      PAGES_ORIGIN: https://futureperfecttuitions.github.io/futureperfect-lessons-v2
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
      WRANGLER_VERSION: 4.125.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed source
        run: |
          set -euo pipefail
          node --check worker/src/index-phase19-access.js
          node --check assets/phase19-access-ui.js
          grep -Fq 'main = "src/index-phase19-access.js"' worker/wrangler.toml
          grep -Fq 'assets/phase19-access-ui.js' phase11.html

      - name: Verify D1 tables
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          DB_ID="$(jq -r '[.result.bindings[]|select(.name=="DB" and .type=="d1")|.id][0] // ""' /tmp/settings.json)"
          test -n "$DB_ID"
          cat >worker/wrangler.phase19.verify.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index-phase19-access.js"
          compatibility_date = "2026-08-20"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB_ID}"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --config worker/wrangler.phase19.verify.toml --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='trial_login_consumptions'" >/tmp/trial.json
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --config worker/wrangler.phase19.verify.toml --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='student_session_windows'" >/tmp/window.json
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --config worker/wrangler.phase19.verify.toml --remote --json --command "PRAGMA quick_check" >/tmp/quick.json
          echo "trial=$(jq -r '.[0].results[0].n' /tmp/trial.json) window=$(jq -r '.[0].results[0].n' /tmp/window.json) quick=$(jq -r '.[0].results[0].quick_check' /tmp/quick.json)"
          test "$(jq -r '.[0].results[0].n' /tmp/trial.json)" = 1
          test "$(jq -r '.[0].results[0].n' /tmp/window.json)" = 1
          test "$(jq -r '.[0].results[0].quick_check' /tmp/quick.json)" = ok

      - name: Verify live routes
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" "$WORKER_BASE/api/v1/student/session")"
          echo "session_code=$code body=$(cat /tmp/session.json)"
          test "$code" = 401
          grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/session.json

          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"username":"nobody","password":"Aa1b"}' "$WORKER_BASE/api/v1/student/auth/login")"
          echo "login_code=$code body=$(cat /tmp/login.json)"
          test "$code" = 401
          grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/login.json

          curl --silent --show-error --include --request OPTIONS --header "Origin: $PRODUCTION_ORIGIN" --header 'Access-Control-Request-Method: GET' --header 'Access-Control-Request-Headers: X-FPT-Window-Token' "$WORKER_BASE/api/v1/student/session" >/tmp/options.txt
          cat /tmp/options.txt
          grep -Eiq '^HTTP/[^ ]+ 204' /tmp/options.txt
          grep -Eiq '^access-control-allow-headers:.*x-fpt-window-token' /tmp/options.txt

          code="$(curl --silent --show-error --output /tmp/sync.json --write-out '%{http_code}' --header 'Content-Type: application/json' --request POST --data '{"items":[{"syncRowId":"phase19-noauth","operation":"status_check","portalUserId":"missing","lessonId":"missing","batchKey":"N","lessonDate":"2026-09-06"}]}' "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          echo "sync_code=$code body=$(cat /tmp/sync.json)"
          test "$code" = 401
          grep -Fq 'SYNC_UNAUTHORISED' /tmp/sync.json

      - name: Verify published frontend
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$PAGES_ORIGIN/phase11.html?phase19=${GITHUB_SHA}" -o /tmp/phase11.html && grep -Fq 'assets/phase19-access-ui.js' /tmp/phase11.html && curl --fail --silent --show-error "$PAGES_ORIGIN/assets/phase19-access-ui.js?phase19=${GITHUB_SHA}" -o /tmp/ui.js && grep -Fq 'fpt_v2_window_token' /tmp/ui.js && grep -Fq 'Trial access ended, please contact Future Perfect Tuitions to continue accessing content' /tmp/ui.js && grep -Fq 'Full access available to enrolled students of the subject only' /tmp/ui.js; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo PHASE19_DIAGNOSTIC_PASS
