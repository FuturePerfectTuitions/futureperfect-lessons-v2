name: Trial admin OPTIONS fix CI

on:
  push:
    branches:
      - fix/trial-admin-options-preflight-2026-09-22
    paths:
      - 'worker/src/admin-trial-manager-projected.js'
      - 'tests/admin-trial-manager-verification.mjs'
      - '.github/workflows/trial-admin-options-fix-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Trial admin preflight fix
        run: |
          set -Eeuo pipefail
          node --check worker/src/admin-trial-manager-projected.js
          node --experimental-default-type=module tests/admin-trial-manager-verification.mjs
          echo TRIAL_ADMIN_OPTIONS_FIX_CI_PASS
