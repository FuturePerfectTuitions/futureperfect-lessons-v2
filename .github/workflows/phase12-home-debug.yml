name: Phase 12 controlled home diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12-home-debug.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  TEST_ORIGIN: https://futureperfecttuitions.github.io

jobs:
  diagnose-home:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' && github.event.pull_request.head.ref == 'phase12-batch-aware-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Deploy temporarily, inspect controlled home response, rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          STUDENTS=''; LESSONS=''; DB=''; DEPLOYED=0

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings.json)"

          config() {
            cat >"$2" <<EOF
          name = "fpt-portal-v2-worker"
          main = "$1"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "fpt-materials-dev"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          }
          cleanup() {
            set +e
            $W d1 execute fpt_portal_v2_db --remote --command "DELETE FROM student_batch_assignments WHERE batch_key='__P12_DEBUG_E5__'; DELETE FROM batch_lesson_releases WHERE batch_key='__P12_DEBUG_E5__'; DELETE FROM batch_definitions WHERE batch_key='__P12_DEBUG_E5__';" --yes >/dev/null 2>&1
            if [ "$DEPLOYED" = 1 ]; then
              config 'src/index-phase11-efficient.js' 'worker/wrangler.p12-debug-rollback.toml'
              $W deploy --config worker/wrangler.p12-debug-rollback.toml --keep-vars --message 'Rollback Phase 12 controlled home diagnostic' >/dev/null 2>&1
            fi
            set -e
          }
          trap 'RC=$?; trap - EXIT; cleanup; exit $RC' EXIT

          cleanup
          config 'src/index-phase12.js' 'worker/wrangler.p12-debug.toml'
          $W deploy --config worker/wrangler.p12-debug.toml --keep-vars --message 'Phase 12 controlled home diagnostic' >/dev/null 2>&1
          DEPLOYED=1
          sleep 3
          $W d1 execute fpt_portal_v2_db --remote --command "INSERT INTO batch_definitions(batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to,created_at,updated_at) VALUES ('__P12_DEBUG_E5__','2026-27','english',5,'normal',NULL,'2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP); INSERT INTO student_batch_assignments(portal_user_id_norm,batch_key,effective_from,effective_to,created_at,updated_at) VALUES ('testy2e','__P12_DEBUG_E5__','2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);" --yes >/dev/null

          echo 'D1 controlled rows:'
          $W d1 execute fpt_portal_v2_db --remote --json --command "SELECT a.portal_user_id_norm,a.batch_key,a.effective_from,a.effective_to,b.subject,b.school_year,b.stream,b.maths_level,b.active_from,b.active_to FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.batch_key='__P12_DEBUG_E5__';"

          curl --fail-with-body --silent --show-error --cookie-jar /tmp/cookies \
            --header "Origin: $TEST_ORIGIN" --header 'Content-Type: application/json' \
            --request POST --data '{"username":"testy2e","password":"Te12"}' "$WORKER_BASE/api/v1/student/auth/login" >/tmp/login.json
          jq -e '.ok==true' /tmp/login.json >/dev/null
          curl --fail-with-body --silent --show-error --cookie /tmp/cookies --header "Origin: $TEST_ORIGIN" "$WORKER_BASE/api/v1/student/home" >/tmp/home.json
          echo 'Sanitised home result:'
          jq '{ok,student:{portalUserId:.student.portalUserId,schoolYear:.student.schoolYear},subjects:[.subjects[]|{subject,views:[.views[]|{viewId,label,current,group,lockedPreview,schoolYear,level}]}]}' /tmp/home.json
          trap - EXIT
          cleanup
          echo 'Controlled home diagnostic completed.'