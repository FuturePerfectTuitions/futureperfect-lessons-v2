name: Phase 17 Final Selected-Real and Dummy Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  acceptance:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard frozen source and Phase 18 boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/phase17-final-live-acceptance.sh
          node tests/phase17-explicit-special-screenpal-static.mjs
          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p17-nav.json
          jq -e '.catalogueSha256 == "7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons == 369 and .curricula == 11' /tmp/p17-nav.json >/dev/null
          grep -Fq 'main = "src/index-phase17.js"' worker/wrangler.toml
          ! grep -Fq 'STUDENT_LOGIN_ENABLED = "true"' worker/wrangler.toml
          grep -Fq 'DEV_LOGIN_ALLOWLIST = ""' worker/wrangler.toml
          echo 'Phase 18 boundary remains closed.'
      - name: Run guarded selected-real and controlled-dummy acceptance
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^  rm -rf "\$TMP"$/s//  :/' tests/phase17-final-live-acceptance.sh
          sed -i '2a PHASE17_STAGE=preflight\ntrap '\''rc=$?; echo "PHASE17_LIVE_DIAGNOSTIC_FAIL stage=${PHASE17_STAGE} line=${LINENO} rc=${rc}" >&2'\'' ERR' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Resolve the two production-intended records/i PHASE17_STAGE=resolve-real' tests/phase17-final-live-acceptance.sh
          sed -i '/^DUMMY_P=/i PHASE17_STAGE=dummy-create' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Temporarily allow exactly/i PHASE17_STAGE=allowlist-deploy' tests/phase17-final-live-acceptance.sh
          sed -i '/^FAKE_CODE=/i PHASE17_STAGE=fake-login' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Selected real Y3/i PHASE17_STAGE=y3-real' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Selected real Y5/i PHASE17_STAGE=y5-real' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Protected Answer Pack/i PHASE17_STAGE=protected-answer' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Controlled dummy exercises/i PHASE17_STAGE=dummy-vr-howto' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Normal logout path/i PHASE17_STAGE=logout' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Explicit cleanup now/i PHASE17_STAGE=explicit-cleanup' tests/phase17-final-live-acceptance.sh
          sed -i '/^cf_get "\$SETTINGS_URL" "\$TMP\/settings-after.json"/i PHASE17_STAGE=final-proof' tests/phase17-final-live-acceptance.sh
          bash tests/phase17-final-live-acceptance.sh
