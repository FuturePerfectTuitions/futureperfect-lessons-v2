name: Live Portal static diagnostic

on:
  push:
    branches: [fix/video-y411-entitlements]
    paths:
      - '.github/workflows/live-portal-static-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live Portal HTML and video scripts
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lessons.futureperfect.education'
          echo '=== ROOT HEADERS ==='
          curl -sSIL "$BASE/" | sed -n '1,40p'
          echo '=== ROOT SCRIPT TAGS ==='
          curl -fsSL "$BASE/" -o /tmp/root.html
          grep -oE '<script[^>]+src="[^"]+"[^>]*>' /tmp/root.html || true
          echo '=== ROOT FIRST LINES ==='
          sed -n '1,30p' /tmp/root.html
          echo '=== PHASE20 MARKERS ==='
          curl -fsSL "$BASE/assets/phase20-collapsible-lessons.js" -o /tmp/p20.js
          grep -nE "video-section|enhanceSection|phase20-collapse-toggle" /tmp/p20.js | head -30 || true
          echo '=== UPSELL MARKERS ==='
          curl -fsSL "$BASE/assets/phase7-upsell.js" -o /tmp/up.js
          grep -nE "removeLegacyVideoCollapse|phase12-video-toggle|ensureVideoToggle" /tmp/up.js | head -40 || true
          echo '=== PHASE21 STATUS ==='
          code="$(curl -sS -o /tmp/p21.js -w '%{http_code}' "$BASE/assets/phase21-video-single-click.js")"
          echo "phase21_http=$code"
          [ "$code" != 200 ] || grep -nE "phase21|phase12-video-toggle-row" /tmp/p21.js | head -20 || true
