name: Change 17 parent email production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change17-parent-email-production-deploy.yml'
      - 'admin-import.html'
      - 'assets/admin-import.js'
      - 'assets/sej-email-signature-clean.png'
      - 'worker/src/admin-lesson-release-import-email.js'
      - 'worker/src/parent-email.js'
      - 'worker/src/parent-email-signature.js'
      - 'worker/src/parent-email-signature-clean*.js'
      - 'worker/src/index-phase20-change13.js'
      - 'worker/src/index-phase20-change17-parent-email.js'
      - 'worker/src/live-student-catalogue-overlay.js'
      - 'worker/src/phase11-navigation-cache.js'
      - 'tests/live-student-catalogue-overlay-verification.mjs'
      - 'tests/phase11-navigation-cache-static-verification.mjs'
      - 'tests/parent-email-import-verification.mjs'
      - 'tests/parent-email-completed-status-verification.mjs'
      - 'tests/parent-email-test-routing-verification.mjs'
      - 'ops/deploy_change17_parent_email_preserve.sh'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_ENTRYPOINT: src/index-phase20-change17-parent-email.js
      WRANGLER_VERSION: 4.125.0
      PARENT_EMAIL_TEST_TO: sejal.mail@gmail.com
      DEPLOY_MESSAGE: Portal V2 Change 17 parent transactional email - test recipient mode

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Change 17 regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/change17-navigation-package
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/change17-navigation-package >/tmp/change17-navigation.log
          grep -Fq 'Navigation manifest SHA-256: d82ab8d3dbefc83f1b81b1d888a85eb1de9c759326042f446ad94efdfdb22083' worker/src/phase11-navigation-manifest.generated.js
          jq -e '.navigationManifestLessons == 369 and .navigationManifestCurricula == 11' /tmp/change17-navigation-package/phase11-apply-summary.json >/dev/null
          node --check worker/src/admin-lesson-release-import-email.js
          node --check worker/src/parent-email.js
          node --check worker/src/parent-email-signature.js
          node --check worker/src/parent-email-signature-clean.js
          node --check worker/src/index-phase20-change13.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node --check worker/src/live-student-catalogue-overlay.js
          node --check worker/src/phase11-navigation-cache.js
          node --check assets/admin-import.js
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-test-routing-verification.mjs
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/live-student-catalogue-overlay-verification.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          grep -Fq 'LIVE_CURRICULUM_AUTHORITY_V1' worker/src/phase11-navigation-cache.js
          grep -Fq 'LIVE_LESSON_METADATA_AUTHORITY_V1' worker/src/phase11-navigation-cache.js
          grep -Fq 'LIVE_STUDENT_CATALOGUE_OVERLAY_V1' worker/src/live-student-catalogue-overlay.js
          test -f "worker/$WORKER_ENTRYPOINT"
          grep -Fq "import fastNavigationWorker from './index-phase20-change17.js';" "worker/$WORKER_ENTRYPOINT"
          grep -Fq 'handleAdminLessonReleaseImport' "worker/$WORKER_ENTRYPOINT"
          grep -Fq 'repairLiveStudentCatalogueResponse' "worker/$WORKER_ENTRYPOINT"
          grep -Fq 'PARENT_EMAIL_TEST_TO' ops/deploy_change17_parent_email_preserve.sh
          grep -Fq '[[send_email]]' ops/deploy_change17_parent_email_preserve.sh
          echo 'CHANGE17_STATIC_PASS'

      - name: Require production bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PARENT_EMAIL_TEST_TO" = 'sejal.mail@gmail.com'
          test "$WORKER_ENTRYPOINT" = 'src/index-phase20-change17-parent-email.js'
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-settings-before.json
          jq -e '.success == true' /tmp/change17-settings-before.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/change17-settings-before.json >/dev/null
          done
          for required in ADMIN_IMPORT_PASSWORD ADMIN_IMPORT_SESSION_SECRET EXCEL_SYNC_TOKEN; do
            jq -e --arg n "$required" '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index($n) != null' /tmp/change17-settings-before.json >/dev/null
          done
          echo 'CHANGE17_BASE_BINDINGS_PASS'

      - name: Deploy Change 17 preserving bindings and forcing test recipient
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_change17_parent_email_preserve.sh

      - name: Verify live Change 17 test mode and security boundary
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-settings-after.json
          jq -e '.success == true' /tmp/change17-settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="EMAIL")' /tmp/change17-settings-after.json >/dev/null
          jq -e --arg expected "$PARENT_EMAIL_TEST_TO" '.result.bindings[] | select(.name=="PARENT_EMAIL_TEST_TO" and .type=="plain_text" and .text==$expected)' /tmp/change17-settings-after.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/change17-settings-after.json >/dev/null
          done
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-worker-after.bin
          grep -aFq 'live-kv-v1' /tmp/change17-worker-after.bin
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'
          code="$(curl --silent --show-error --output /tmp/change17-home.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" "$BASE/api/v1/student/home")"
          test "$code" = '401'
          echo 'CHANGE17_LIVE_TEST_MODE_AND_SECURITY_PASS'
