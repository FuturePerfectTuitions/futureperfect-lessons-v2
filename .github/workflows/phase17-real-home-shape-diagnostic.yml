name: Phase 17 sanitized real home shape diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase17-real-home-shape-diagnostic.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  sanitized-home-shape:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase17-prelaunch-freeze-production-verification' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show only sanitized view shapes, then rely on EXIT cleanup
        shell: bash
        run: |
          set -euo pipefail
          sed -i '0,/^  rm -rf "\$TMP"$/s//  :/' tests/phase17-final-live-acceptance.sh
          sed -i '/current==true and \.group=="current"/d' tests/phase17-final-live-acceptance.sh
          sed -i '/y3-current.json/d' tests/phase17-final-live-acceptance.sh
          sed -i '/y5-current.json/d' tests/phase17-final-live-acceptance.sh
          sed -i '/api_get .*y3-home.json/a echo PHASE17_Y3_HOME_SHAPE; jq -c '\''[.subjects[]? | {subject,views:[.views[]? | {viewId,group,current,openLessonCount,visibleLessonCount}]}]'\'' "$TMP/y3-home.json"' tests/phase17-final-live-acceptance.sh
          sed -i '/api_get .*y5-home.json/a echo PHASE17_Y5_HOME_SHAPE; jq -c '\''[.subjects[]? | {subject,views:[.views[]? | {viewId,group,current,openLessonCount,visibleLessonCount}]}]'\'' "$TMP/y5-home.json"' tests/phase17-final-live-acceptance.sh
          bash tests/phase17-final-live-acceptance.sh
