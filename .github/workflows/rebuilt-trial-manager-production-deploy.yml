name: Rebuilt Trial Manager - guarded production deploy

on:
  push:
    branches:
      - 'feature/rebuilt-trial-manager-2026-09-17'
    paths:
      - 'docs/rebuild/REBUILT_TRIAL_MANAGER_PRODUCTION_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: rebuilt-trial-manager-production-2026-09-17
  cancel-in-progress: false

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER: fpt-portal-v2-worker
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
      BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
      PROD_HOST: lessons.futureperfect.education
      WRANGLER_VERSION: 4.125.0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exact source and regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'feature/rebuilt-trial-manager-2026-09-17'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check worker/src/admin-prepared-access-publisher.js
          node --check worker/src/admin-trial-manager.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node --check rebuild/student/src/lib/trial-runtime.mjs
          node --check rebuild/student/src/index.js
          node --check assets/admin-trials.js
          node --check scripts/rebuilt-trial-production-smoke.mjs
          node tests/rebuilt-trial-manager-verification.mjs
          node tests/admin-prepared-access-publisher-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/rebuild-checkpoint2-read-models.mjs
          node tests/rebuild-checkpoint3-atomic-publishing.mjs
          node tests/rebuild-checkpoint5-auth-capability-core.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-cp12-resource-presentation-groups.mjs

      - name: Fresh Cloudflare topology, version and binding preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const legacy=process.env.LEGACY_WORKER,student=process.env.STUDENT_WORKER,browser=process.env.BROWSER_WORKER,host=process.env.PROD_HOST;
          const base='https://api.cloudflare.com/client/v4',headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(base+path,{headers});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`${r.status} ${path}: ${JSON.stringify(j.errors||[])}`);return j.result;}
          async function settings(name){return cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/settings`);}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');}
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`);
          const zone=zones.filter(z=>host===z.name||host.endsWith('.'+z.name)).sort((a,b)=>b.name.length-a.name.length)[0];
          if(!zone)throw new Error('Production zone unresolved');
          const routes=await cf(`/zones/${zone.id}/workers/routes`);
          const hostRoutes=routes.filter(r=>String(r.pattern||'').toLowerCase().includes(host.toLowerCase()));
          if(hostRoutes.length!==1||String(hostRoutes[0].pattern).toLowerCase()!==`${host.toLowerCase()}/*`||hostRoutes[0].script!==browser)throw new Error(`Public route drift: ${JSON.stringify(hostRoutes)}`);
          const browserSettings=await settings(browser);
          const services=(browserSettings.bindings||[]).filter(b=>b.type==='service');
          if(services.length!==1||services[0].service!==student)throw new Error(`Browser service drift: ${JSON.stringify(services)}`);
          if((browserSettings.bindings||[]).some(b=>/admin/i.test(`${b.name||''} ${b.service||''}`)))throw new Error('Forbidden Browser Admin binding');
          const supported=new Set(['plain_text','kv_namespace','d1','r2_bucket','send_email']);
          async function snapshotWorker(name){
            const s=await settings(name),oldVersion=await active(name);
            if(!oldVersion)throw new Error(`Active version unresolved for ${name}`);
            const unsupported=(s.bindings||[]).filter(b=>!/secret/i.test(String(b.type))&&!supported.has(b.type));
            if(unsupported.length)throw new Error(`Unsupported live binding types for ${name}: ${JSON.stringify(unsupported.map(b=>({name:b.name,type:b.type})))}`);
            const normalize=b=>({name:b.name,type:b.type,...(b.type==='plain_text'?{text:b.text}:{}),...(b.type==='kv_namespace'?{namespace_id:b.namespace_id}:{}),...(b.type==='d1'?{id:b.id||b.database_id}:{}),...(b.type==='r2_bucket'?{bucket_name:b.bucket_name}:{}),...(b.type==='send_email'?{}:{})});
            return {oldVersion,nonSecret:(s.bindings||[]).filter(b=>!/secret/i.test(String(b.type))).map(normalize).sort((a,b)=>String(a.name).localeCompare(String(b.name))),secretNames:(s.bindings||[]).filter(b=>/secret/i.test(String(b.type))).map(b=>b.name).sort()};
          }
          const legacySnap=await snapshotWorker(legacy),studentSnap=await snapshotWorker(student);
          for(const name of ['STUDENTS_KV','LESSONS_KV','REBUILD_SHADOW_KV','DB'])if(!legacySnap.nonSecret.some(b=>b.name===name))throw new Error(`Operational Worker missing ${name}`);
          for(const name of ['READ_MODELS_KV','STUDENTS_KV','DB','MATERIALS_R2'])if(!studentSnap.nonSecret.some(b=>b.name===name))throw new Error(`Student Worker missing ${name}`);
          for(const name of ['AUTH_SIGNING_SECRET','ACCESS_SCOPE_SECRET'])if(!studentSnap.secretNames.includes(name))throw new Error(`Student Worker missing secret ${name}`);
          const topology={route:{pattern:hostRoutes[0].pattern,script:hostRoutes[0].script},browserVersion:await active(browser),service:{name:services[0].name,service:services[0].service}};
          fs.writeFileSync('/tmp/trial-topology-before.json',JSON.stringify(topology,null,2));
          fs.writeFileSync('/tmp/trial-legacy-before.json',JSON.stringify(legacySnap,null,2),{mode:0o600});
          fs.writeFileSync('/tmp/trial-student-before.json',JSON.stringify(studentSnap,null,2),{mode:0o600});
          function q(v){return JSON.stringify(String(v??''));}
          async function writeConfig(path,name,main,snap){
            let toml=`name = ${q(name)}\nmain = ${q(main)}\ncompatibility_date = \"2026-08-20\"\nkeep_vars = true\nworkers_dev = true\n`;
            const plains=snap.nonSecret.filter(b=>b.type==='plain_text');
            if(plains.length){toml+='\n[vars]\n';for(const b of plains)toml+=`${b.name} = ${q(b.text)}\n`;}
            for(const b of snap.nonSecret.filter(b=>b.type==='kv_namespace'))toml+=`\n[[kv_namespaces]]\nbinding = ${q(b.name)}\nid = ${q(b.namespace_id)}\n`;
            for(const b of snap.nonSecret.filter(b=>b.type==='r2_bucket'))toml+=`\n[[r2_buckets]]\nbinding = ${q(b.name)}\nbucket_name = ${q(b.bucket_name)}\n`;
            for(const b of snap.nonSecret.filter(b=>b.type==='d1')){const db=await cf(`/accounts/${account}/d1/database/${encodeURIComponent(b.id)}`);toml+=`\n[[d1_databases]]\nbinding = ${q(b.name)}\ndatabase_name = ${q(db.name)}\ndatabase_id = ${q(b.id)}\n`;}
            for(const b of snap.nonSecret.filter(b=>b.type==='send_email'))toml+=`\n[[send_email]]\nname = ${q(b.name)}\n`;
            fs.writeFileSync(path,toml);
          }
          await writeConfig('worker/wrangler.rebuilt-trial-admin.toml',legacy,'src/index-phase23-protected-view-stability.js',legacySnap);
          await writeConfig('rebuild/student/wrangler.rebuilt-trial-prod.toml',student,'src/index.js',studentSnap);
          console.log(JSON.stringify({marker:'REBUILT_TRIAL_PRODUCTION_PREFLIGHT_PASS',sourceSha:process.env.GITHUB_SHA,topology,legacyOldVersion:legacySnap.oldVersion,studentOldVersion:studentSnap.oldVersion,legacyBindingNames:legacySnap.nonSecret.map(b=>`${b.name}:${b.type}`),studentBindingNames:studentSnap.nonSecret.map(b=>`${b.name}:${b.type}`),studentSecretNames:studentSnap.secretNames},null,2));
          NODE
          npx --yes wrangler@"$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/trial-admin-dryrun --config worker/wrangler.rebuilt-trial-admin.toml >/tmp/trial-admin-dryrun.log
          npx --yes wrangler@"$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/trial-student-dryrun --config rebuild/student/wrangler.rebuilt-trial-prod.toml >/tmp/trial-student-dryrun.log
          grep -R -Fq 'PREPARED_ACCESS_POST_PUBLISH_VERIFY_FAILED' /tmp/trial-admin-dryrun
          grep -R -Fq 'TRIAL_ACCESS_ENDED' /tmp/trial-student-dryrun

      - name: Deploy Admin and rebuilt Student Workers with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD_LEGACY="$(jq -r .oldVersion /tmp/trial-legacy-before.json)"
          OLD_STUDENT="$(jq -r .oldVersion /tmp/trial-student-before.json)"
          LEGACY_DEPLOYED=0
          STUDENT_DEPLOYED=0
          rollback(){
            rc=$?
            set +e
            if [ "$STUDENT_DEPLOYED" = '1' ]; then
              echo "Rolling Student Worker back to $OLD_STUDENT" >&2
              npx --yes wrangler@"$WRANGLER_VERSION" rollback "$OLD_STUDENT" --name "$STUDENT_WORKER" --message 'Automatic rollback: rebuilt Trial manager gate failure'
            fi
            if [ "$LEGACY_DEPLOYED" = '1' ]; then
              echo "Rolling operational Admin Worker back to $OLD_LEGACY" >&2
              npx --yes wrangler@"$WRANGLER_VERSION" rollback "$OLD_LEGACY" --name "$LEGACY_WORKER" --message 'Automatic rollback: rebuilt Trial manager gate failure'
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx --yes wrangler@"$WRANGLER_VERSION" deploy --config worker/wrangler.rebuilt-trial-admin.toml --keep-vars --message 'Admin Trial Manager: instant profile plus prepared access publishing'
          LEGACY_DEPLOYED=1
          npx --yes wrangler@"$WRANGLER_VERSION" deploy --config rebuild/student/wrangler.rebuilt-trial-prod.toml --keep-vars --message 'Rebuilt Student Trial policy: one login plus full year VR for 11+'
          STUDENT_DEPLOYED=1

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,legacy=process.env.LEGACY_WORKER,student=process.env.STUDENT_WORKER,browser=process.env.BROWSER_WORKER,host=process.env.PROD_HOST;
          const base='https://api.cloudflare.com/client/v4',headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(base+path,{headers});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`${r.status} ${path}: ${JSON.stringify(j.errors||[])}`);return j.result;}
          async function settings(name){return cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/settings`);}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');}
          const normalize=b=>({name:b.name,type:b.type,...(b.type==='plain_text'?{text:b.text}:{}),...(b.type==='kv_namespace'?{namespace_id:b.namespace_id}:{}),...(b.type==='d1'?{id:b.id||b.database_id}:{}),...(b.type==='r2_bucket'?{bucket_name:b.bucket_name}:{}),...(b.type==='send_email'?{}:{})});
          async function parity(name,beforePath){const before=JSON.parse(fs.readFileSync(beforePath,'utf8'));const s=await settings(name);const now={nonSecret:(s.bindings||[]).filter(b=>!/secret/i.test(String(b.type))).map(normalize).sort((a,b)=>String(a.name).localeCompare(String(b.name))),secretNames:(s.bindings||[]).filter(b=>/secret/i.test(String(b.type))).map(b=>b.name).sort()};if(JSON.stringify(now)!==JSON.stringify({nonSecret:before.nonSecret,secretNames:before.secretNames}))throw new Error(`${name} bindings changed`);const version=await active(name);if(!version||version===before.oldVersion)throw new Error(`${name} version did not advance`);return {oldVersion:before.oldVersion,newVersion:version,bindingParity:true};}
          const legacyResult=await parity(legacy,'/tmp/trial-legacy-before.json'),studentResult=await parity(student,'/tmp/trial-student-before.json');
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`),zone=zones.filter(z=>host===z.name||host.endsWith('.'+z.name)).sort((a,b)=>b.name.length-a.name.length)[0],routes=await cf(`/zones/${zone.id}/workers/routes`),hostRoutes=routes.filter(r=>String(r.pattern||'').toLowerCase().includes(host.toLowerCase()));
          const bs=await settings(browser),services=(bs.bindings||[]).filter(b=>b.type==='service');
          const after={route:{pattern:hostRoutes[0]?.pattern,script:hostRoutes[0]?.script},browserVersion:await active(browser),service:{name:services[0]?.name,service:services[0]?.service}};
          const before=JSON.parse(fs.readFileSync('/tmp/trial-topology-before.json','utf8'));
          if(JSON.stringify(after)!==JSON.stringify(before))throw new Error(`Public Browser topology changed: ${JSON.stringify({before,after})}`);
          fs.writeFileSync('/tmp/trial-deploy-result.json',JSON.stringify({marker:'REBUILT_TRIAL_WORKERS_DEPLOYED',sourceSha:process.env.GITHUB_SHA,legacy:legacyResult,student:studentResult,topology:after},null,2));
          console.log(fs.readFileSync('/tmp/trial-deploy-result.json','utf8'));
          NODE

          # The Trial Admin route must be present and protected; no Admin secret
          # is duplicated into GitHub Actions merely to exercise it.
          code="$(curl --silent --show-error -o /tmp/trial-admin-negative.json -w '%{http_code}' -X POST 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/admin/trials/list' -H 'Origin: https://futureperfecttuitions.github.io' -H 'Content-Type: application/json' --data '{}')"
          test "$code" = '401'
          jq -e '.error=="UNAUTHORISED"' /tmp/trial-admin-negative.json >/dev/null

          # Use Cloudflare's protected data APIs directly for migration and the
          # live smoke. Password values are never printed by the script.
          node scripts/rebuilt-trial-production-smoke.mjs
          jq -e '.marker=="REBUILT_TRIAL_LIVE_SMOKE_PASS" and .trialSej.firstLoginPassed==true and .trialSej.secondLoginBlocked==true and .trialSej.finalUnused==true and .trialEva.finalUnused==true and .passwordsLogged==false' /tmp/rebuilt-trial-live-smoke.json >/dev/null

          jq -n \
            --arg marker 'REBUILT_TRIAL_MANAGER_PRODUCTION_PASS' \
            --arg sourceSha "$GITHUB_SHA" \
            --slurpfile deploy /tmp/trial-deploy-result.json \
            --slurpfile smoke /tmp/rebuilt-trial-live-smoke.json \
            '{marker:$marker,sourceSha:$sourceSha,deploy:$deploy[0],smoke:$smoke[0],adminRouteProtected:true}' \
            >/tmp/rebuilt-trial-production-result.json
          cat /tmp/rebuilt-trial-production-result.json
          trap - ERR

      - name: Upload redacted deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-trial-manager-production-evidence
          path: /tmp/rebuilt-trial-production-result.json
          retention-days: 14
