name: Step 10 Gate E Browser Worker frontend deploy

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - 'docs/step10/STEP10_GATE_E_BROWSER_PRODUCTION_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: step10-gate-e-browser-production-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  PROD_HOST: lessons.futureperfect.education
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  PRE_BROWSER_VERSION: f8a64bc8-8192-4400-9e45-8f1a1de10019
  EXPECTED_STUDENT_VERSION: f26167b1-073c-4015-912a-288a3d20e0bb
  EXPECTED_QUIZ_VERSION: 13eda650-d6b3-4ed3-a3cc-c788306a4789
  EXPECTED_PRE_BUNDLE: assets/portal-CeIaLZ5y.js
  EXPECTED_PRE_BUNDLE_SHA256: 9dc3203a012c1530216cba9f8362d227a46745249499362a3160310bb34f45dc
  FRONTEND_REPO: FuturePerfectTuitions/futureperfect-lessons-test
  FRONTEND_SHA: c26f03d1b353fcccf46b783656bef3bef1315d6d
  PREFLIGHT_RUN_ID: '35332176899'
  PREFLIGHT_SHA: 1e0d3519606841c81ac08fa237a53cd021324ae1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: control

      - uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.FRONTEND_SHA }}
          path: frontend
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm authorised Gate E preflight and immutable source
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C frontend rev-parse HEAD)" = "$FRONTEND_SHA"
          grep -Fq 'Status: **CLOSED — PASS**' control/docs/step10/STEP10_GATE_D_CLOSEOUT_2026-09-18.md
          node --input-type=module <<'NODE'
          const r=await fetch(`https://api.github.com/repos/FuturePerfectTuitions/futureperfect-lessons-v2/actions/runs/${process.env.PREFLIGHT_RUN_ID}`,{headers:{'user-agent':'fpt-step10-gate-e-deploy'}});
          if(!r.ok) throw new Error(`Gate E preflight lookup failed: ${r.status}`);
          const j=await r.json();
          if(j.status!=='completed'||j.conclusion!=='success'||j.head_sha!==process.env.PREFLIGHT_SHA) throw new Error(`Gate E preflight is not the approved PASS: ${JSON.stringify({status:j.status,conclusion:j.conclusion,head_sha:j.head_sha})}`);
          console.log(JSON.stringify({marker:'STEP10_GATE_E_APPROVED_PREFLIGHT_PASS',runId:j.id,headSha:j.head_sha},null,2));
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const required=[
            "requestJson('/api/v2/student/quiz/eligibility')",
            "requestJson('/api/v2/student/quiz/launch', { method: 'POST' })",
            "if (subject === 'maths') void revealMathsPracticeCard();",
            "payload?.eligible !== true",
            '11+ Practice',
            "document.querySelector('[data-view-grid=\"current\"]')"
          ];
          for(const x of required) if(!app.includes(x)) throw new Error(`Approved Gate E source contract missing: ${x}`);
          if(app.includes('/api/v1/student/quiz/')) throw new Error('Retired v1 quiz endpoint present');
          NODE

      - name: Build exact approved frontend and record expected asset identity
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd frontend
          npm install --no-audit --no-fund
          npm run test:static
          node tests/cp12-collapsible-resource-sections-static.mjs
          node tests/cp12-approved-v2-ui-parity-static.mjs
          node tests/step10-v2-maths-practice-static.mjs
          npm run build
          git diff --check
          test -s dist/index.html
          grep -R -Fq '11+ Practice' dist
          grep -R -Fq '/api/v2/student/quiz/eligibility' dist
          grep -R -Fq '/api/v2/student/quiz/launch' dist
          ! grep -R -Fq '/api/v1/student/quiz/' dist
          cd "$GITHUB_WORKSPACE"
          rm -rf control/rebuild/browser-staging/public
          mkdir -p control/rebuild/browser-staging/public
          cp -a frontend/dist/. control/rebuild/browser-staging/public/
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path'; import crypto from 'node:crypto';
          const html=fs.readFileSync('frontend/dist/index.html','utf8');
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/gi)].map(m=>m[1]);
          const main=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];
          if(!main) throw new Error('Built main bundle not found');
          const rel=main.replace(/^\.\//,'').replace(/^\//,'');
          const bytes=fs.readFileSync(path.join('frontend/dist',rel));
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          const text=bytes.toString('utf8');
          for(const s of ['11+ Practice','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']) if(!text.includes(s)) throw new Error(`Built bundle missing ${s}`);
          if(text.includes('/api/v1/student/quiz/')) throw new Error('Built bundle contains retired v1 endpoint');
          fs.writeFileSync('/tmp/gate-e-build.json',JSON.stringify({marker:'STEP10_GATE_E_BUILD_PASS',frontendSha:process.env.FRONTEND_SHA,bundlePath:rel,bundleSha256:sha},null,2));
          fs.appendFileSync(process.env.GITHUB_ENV,`GATE_E_BUNDLE_PATH=${rel}\nGATE_E_BUNDLE_SHA256=${sha}\n`);
          console.log(fs.readFileSync('/tmp/gate-e-build.json','utf8'));
          NODE

      - name: Install pinned Wrangler and verify rollback command availability
        working-directory: control
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
          npx wrangler rollback --help > /tmp/wrangler-rollback-help.txt
          grep -Fq -- '--message' /tmp/wrangler-rollback-help.txt
          grep -Fq -- '--name' /tmp/wrangler-rollback-help.txt

      - name: Immediate pre-mutation production anchor verification
        id: premutation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const clean=v=>String(v??'').trim(); const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID),token=clean(process.env.CLOUDFLARE_API_TOKEN),base='https://api.cloudflare.com/client/v4';
          if(!account||!token) throw new Error('Cloudflare credentials unavailable');
          async function cf(p){const r=await fetch(base+p,{headers:{Authorization:`Bearer ${token}`}});const text=await r.text();let j;try{j=JSON.parse(text)}catch{};if(!r.ok||j?.success!==true)throw new Error(`${r.status} ${p}: ${JSON.stringify(j?.errors||text)}`);return j.result;}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];const d=ds[0];const vs=Array.isArray(d?.versions)?d.versions:[];return{deploymentId:clean(d?.id),versionId:clean((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id)};}
          const workers={browser:await active(process.env.BROWSER_WORKER),student:await active(process.env.STUDENT_WORKER),quiz:await active(process.env.QUIZ_WORKER)};
          if(workers.browser.versionId!==process.env.PRE_BROWSER_VERSION) throw new Error(`Browser version drift ${JSON.stringify(workers.browser)}`);
          if(workers.student.versionId!==process.env.EXPECTED_STUDENT_VERSION) throw new Error(`Student version drift ${JSON.stringify(workers.student)}`);
          if(workers.quiz.versionId!==process.env.EXPECTED_QUIZ_VERSION) throw new Error(`Quiz version drift ${JSON.stringify(workers.quiz)}`);
          const host=process.env.PROD_HOST.toLowerCase();
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`);const zone=zones.filter(z=>host===z.name||host.endsWith(`.${z.name}`)).sort((a,b)=>b.name.length-a.name.length)[0];if(!zone)throw new Error('Zone not found');
          const routes=await cf(`/zones/${zone.id}/workers/routes`);const matching=routes.filter(r=>clean(r.pattern).toLowerCase().includes(host));
          if(!matching.some(r=>clean(r.pattern).toLowerCase()===`${host}/*`&&clean(r.script)===process.env.BROWSER_WORKER)||matching.some(r=>clean(r.script)!==process.env.BROWSER_WORKER))throw new Error(`Route drift ${JSON.stringify(matching)}`);
          const settings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(process.env.BROWSER_WORKER)}/settings`);const bindings=Array.isArray(settings?.bindings)?settings.bindings:[];const service=bindings.find(b=>clean(b.type)==='service'&&clean(b.service)===process.env.STUDENT_WORKER);if(!service)throw new Error(`Service binding drift ${JSON.stringify(bindings)}`);
          const root=await fetch(`https://${host}/`,{headers:{'cache-control':'no-store','user-agent':'fpt-step10-gate-e-deploy'}});if(!root.ok)throw new Error(`Root ${root.status}`);const html=await root.text();const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);const bundle=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];if(!bundle)throw new Error('Live bundle missing');const norm=bundle.replace(/^\.\//,'').replace(/^\//,'').split('?')[0];if(norm!==process.env.EXPECTED_PRE_BUNDLE)throw new Error(`Pre bundle path drift ${norm}`);const br=await fetch(new URL(bundle,`https://${host}/`),{headers:{'cache-control':'no-store'}});if(!br.ok)throw new Error(`Bundle ${br.status}`);const bytes=Buffer.from(await br.arrayBuffer());const hash=sha256(bytes);if(hash!==process.env.EXPECTED_PRE_BUNDLE_SHA256)throw new Error(`Pre bundle hash drift ${hash}`);if(bytes.toString('utf8').includes('/api/v2/student/quiz/eligibility'))throw new Error('Gate E UI already unexpectedly live');
          const out={marker:'STEP10_GATE_E_IMMEDIATE_PREMUTATION_PASS',workers,route:matching,serviceBinding:{name:service.name,service:service.service},liveBundle:{path:norm,sha256:hash}};fs.writeFileSync('/tmp/gate-e-premutation.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE

      - name: Write exact Browser Worker deployment config
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > control/rebuild/browser-staging/wrangler.gatee.toml <<TOML
          name = "${BROWSER_WORKER}"
          main = "src/index.js"
          compatibility_date = "2026-08-20"
          workers_dev = true

          [[services]]
          binding = "STAGING_API"
          service = "${STUDENT_WORKER}"

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          TOML

      - name: Deploy approved Gate E assets to Browser Worker only
        id: deploy
        working-directory: control
        shell: bash
        run: |
          set -Eeuo pipefail
          npx wrangler deploy --config rebuild/browser-staging/wrangler.gatee.toml | tee /tmp/gate-e-wrangler-deploy.txt
          echo deployed=true >> "$GITHUB_OUTPUT"

      - name: Verify Gate E production deployment and unchanged backend anchors
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const clean=v=>String(v??'').trim(); const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID),token=clean(process.env.CLOUDFLARE_API_TOKEN),base='https://api.cloudflare.com/client/v4';
          async function cf(p){const r=await fetch(base+p,{headers:{Authorization:`Bearer ${token}`}});const text=await r.text();let j;try{j=JSON.parse(text)}catch{};if(!r.ok||j?.success!==true)throw new Error(`${r.status} ${p}: ${JSON.stringify(j?.errors||text)}`);return j.result;}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];const d=ds[0];const vs=Array.isArray(d?.versions)?d.versions:[];return{deploymentId:clean(d?.id),versionId:clean((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id)};}
          const workers={browser:await active(process.env.BROWSER_WORKER),student:await active(process.env.STUDENT_WORKER),quiz:await active(process.env.QUIZ_WORKER)};
          if(!workers.browser.versionId||workers.browser.versionId===process.env.PRE_BROWSER_VERSION)throw new Error(`Browser Worker did not advance ${JSON.stringify(workers.browser)}`);
          if(workers.student.versionId!==process.env.EXPECTED_STUDENT_VERSION)throw new Error(`Student Worker changed ${JSON.stringify(workers.student)}`);
          if(workers.quiz.versionId!==process.env.EXPECTED_QUIZ_VERSION)throw new Error(`Quiz Worker changed ${JSON.stringify(workers.quiz)}`);
          const host=process.env.PROD_HOST.toLowerCase();const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`);const zone=zones.filter(z=>host===z.name||host.endsWith(`.${z.name}`)).sort((a,b)=>b.name.length-a.name.length)[0];if(!zone)throw new Error('Zone missing');const routes=await cf(`/zones/${zone.id}/workers/routes`);const matching=routes.filter(r=>clean(r.pattern).toLowerCase().includes(host));if(!matching.some(r=>clean(r.pattern).toLowerCase()===`${host}/*`&&clean(r.script)===process.env.BROWSER_WORKER)||matching.some(r=>clean(r.script)!==process.env.BROWSER_WORKER))throw new Error(`Route changed ${JSON.stringify(matching)}`);const settings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(process.env.BROWSER_WORKER)}/settings`);const bindings=Array.isArray(settings?.bindings)?settings.bindings:[];const service=bindings.find(b=>clean(b.type)==='service'&&clean(b.service)===process.env.STUDENT_WORKER);if(!service)throw new Error(`Service binding changed ${JSON.stringify(bindings)}`);
          let observed=null;for(let i=0;i<30;i++){const root=await fetch(`https://${host}/`,{headers:{'cache-control':'no-store','user-agent':'fpt-step10-gate-e-postdeploy'}});if(root.ok){const html=await root.text();const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);const bundle=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];if(bundle){const norm=bundle.replace(/^\.\//,'').replace(/^\//,'').split('?')[0];const br=await fetch(new URL(bundle,`https://${host}/`),{headers:{'cache-control':'no-store'}});if(br.ok){const bytes=Buffer.from(await br.arrayBuffer());const hash=sha256(bytes);observed={path:norm,sha256:hash,text:bytes.toString('utf8')};if(norm===process.env.GATE_E_BUNDLE_PATH&&hash===process.env.GATE_E_BUNDLE_SHA256)break;}}}await new Promise(r=>setTimeout(r,1000));}
          if(!observed||observed.path!==process.env.GATE_E_BUNDLE_PATH||observed.sha256!==process.env.GATE_E_BUNDLE_SHA256)throw new Error(`Production bundle does not equal approved build ${JSON.stringify(observed&&{path:observed.path,sha256:observed.sha256})}`);
          for(const x of ['11+ Practice','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch','/api/v2/auth/login','/api/v2/student/home'])if(!observed.text.includes(x))throw new Error(`Production bundle missing ${x}`);if(observed.text.includes('/api/v1/student/quiz/'))throw new Error('Production bundle contains retired v1 quiz endpoint');
          const eligibility=await fetch(`https://${host}/api/v2/student/quiz/eligibility`,{redirect:'manual'});if(eligibility.status!==401)throw new Error(`Unauth eligibility expected 401 got ${eligibility.status}`);const launch=await fetch(`https://${host}/api/v2/student/quiz/launch`,{method:'POST',headers:{'content-type':'application/json','origin':`https://${host}`},body:'{}',redirect:'manual'});if(launch.status!==401)throw new Error(`Unauth launch expected 401 got ${launch.status}`);
          const out={marker:'STEP10_GATE_E_BROWSER_PRODUCTION_DEPLOY_PASS',frontendSha:process.env.FRONTEND_SHA,approvedBundle:{path:process.env.GATE_E_BUNDLE_PATH,sha256:process.env.GATE_E_BUNDLE_SHA256},workers,route:matching,serviceBinding:{name:service.name,service:service.service},unauthenticated:{eligibilityStatus:eligibility.status,launchStatus:launch.status},studentWorkerUnchanged:true,quizWorkerUnchanged:true};fs.writeFileSync('/tmp/gate-e-deploy.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE

      - name: Automatic Browser Worker rollback on any post-deploy failure
        if: ${{ failure() && steps.deploy.outputs.deployed == 'true' }}
        working-directory: control
        shell: bash
        run: |
          set +e
          echo 'Gate E post-deploy verification failed; rolling Browser Worker back to the exact pre-Gate-E version.'
          npx wrangler rollback "$PRE_BROWSER_VERSION" --name "$BROWSER_WORKER" --message "Step 10 Gate E automatic rollback"
          ROLLBACK_CODE=$?
          sleep 3
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const host=process.env.PROD_HOST;const root=await fetch(`https://${host}/`,{headers:{'cache-control':'no-store'}});if(!root.ok)throw new Error(`Rollback root ${root.status}`);const html=await root.text();const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);const bundle=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];if(!bundle)throw new Error('Rollback bundle missing');const norm=bundle.replace(/^\.\//,'').replace(/^\//,'').split('?')[0];const br=await fetch(new URL(bundle,`https://${host}/`),{headers:{'cache-control':'no-store'}});const bytes=Buffer.from(await br.arrayBuffer());const hash=crypto.createHash('sha256').update(bytes).digest('hex');if(norm!==process.env.EXPECTED_PRE_BUNDLE||hash!==process.env.EXPECTED_PRE_BUNDLE_SHA256)throw new Error(`Rollback bundle mismatch ${norm} ${hash}`);console.log(JSON.stringify({marker:'STEP10_GATE_E_AUTOMATIC_ROLLBACK_VERIFIED',bundlePath:norm,bundleSha256:hash},null,2));
          NODE
          exit $ROLLBACK_CODE

      - name: Upload Gate E deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step10-gate-e-browser-production-deploy
          path: |
            /tmp/gate-e-build.json
            /tmp/gate-e-premutation.json
            /tmp/gate-e-deploy.json
            /tmp/gate-e-wrangler-deploy.txt
          if-no-files-found: ignore
          retention-days: 30
