name: Final minimal - identify Y3 English obsolete R2 objects

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-y3-english-obsolete-identify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find Y3 English R2 objects not referenced by active curriculum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':f'Bearer {t}'}
          s=requests.get(f'{api}/accounts/{a}/workers/scripts/fpt-portal-v2-worker/settings',headers=h).json(); b=s['result']['bindings']; ns=next(x['namespace_id'] for x in b if x.get('name')=='LESSONS_KV'); assert next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT')=='development'
          base=f'{api}/accounts/{a}/storage/kv/namespaces/{ns}/values/'
          def kv(k):
            r=requests.get(base+urllib.parse.quote(k,safe=''),headers=h); r.raise_for_status(); return r.json()
          objs=[]; c=None
          while True:
            p={'per_page':'1000'}
            if c:p['cursor']=c
            q=requests.get(f'{api}/accounts/{a}/r2/buckets/fpt-materials-dev/objects',headers=h,params=p).json(); assert q.get('success'); objs += q.get('result') or []; i=q.get('result_info') or {}; c=i.get('cursor') if i.get('is_truncated') else None
            if not c:break
          physical={o['key'] for o in objs if o.get('key','').startswith('english/year3/Y3T') and not o['key'].endswith('/')}
          refs=set()
          def walk(x):
            if isinstance(x,dict):
              for k,v in x.items():
                if k=='r2Key' and isinstance(v,str) and v.startswith('english/year3/'): refs.add(v)
                else: walk(v)
            elif isinstance(x,list):
              for v in x: walk(v)
          ids=kv('curriculum:ENGLISH_Y3')['lessonIds']
          for lid in ids: walk(kv('lesson:'+lid))
          extra=sorted(physical-refs); missing=sorted(refs-physical)
          result={'physical':len(physical),'activeReferenced':len(refs),'unreferenced':extra,'missing':missing}
          print(json.dumps(result,indent=2)); json.dump(result,open('y3-english-obsolete-identification.json','w'),indent=2)
          assert len(physical)==86 and len(refs)==84 and len(extra)==2 and not missing
          assert any('Reading Assessment' in x for x in extra)
          assert any('Revision 3' in x for x in extra)
          print('Y3_ENGLISH_OBSOLETE_IDENTIFIED_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y3-english-obsolete-identification
          path: y3-english-obsolete-identification.json
          retention-days: 30
