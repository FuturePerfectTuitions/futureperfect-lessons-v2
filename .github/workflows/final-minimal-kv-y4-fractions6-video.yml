name: Final minimal KV - Year 4 Fractions 6 video

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-kv-y4-fractions6-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Correct Fractions 6 and verify Fractions 5/6 pair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          s=requests.get(f'{api}/accounts/{acct}/workers/scripts/fpt-portal-v2-worker/settings',headers=auth,timeout=60).json(); assert s.get('success')
          b=s['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); bucket=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert bucket=='fpt-materials-dev'; assert ns
          base=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def url(k): return base+urllib.parse.quote(k,safe='')
          def get(k):
            r=requests.get(url(k),headers=auth,timeout=60); r.raise_for_status(); return r.json()
          def put(k,v):
            r=requests.put(url(k),headers={**auth,'Content-Type':'application/json'},data=json.dumps(v,separators=(',',':')).encode(),timeout=60); r.raise_for_status(); assert r.json().get('success')
          f5=get('lesson:Y4M22'); assert f5.get('title')=='Fractions 5'
          assert (f5.get('core') or {}).get('video',{}).get('screenpal')=='cOV0oyn36Sg'
          f6=get('lesson:Y4M23'); assert f6.get('title')=='Fractions 6'; assert (f6.get('displayIds') or {}).get('maths-level1')=='L1T2M20'; assert (f6.get('displayIds') or {}).get('maths-year4')=='Y4T2M20'
          vid='cOVO15n3ovI'; v=f6.setdefault('core',{}).setdefault('video',{})
          v['screenpal']=vid; v['contentUrl']=f'https://screenpal.com/content/video/{vid}'; v['embedUrl']=f'https://go.screenpal.com/player/{vid}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent'; v['watchUrl']=f'https://go.screenpal.com/watch/{vid}'
          for k in list(v):
            if k=='quiz' or k.lower().startswith('quiz') or k.lower()=='elevenplus': v.pop(k,None)
          put('lesson:Y4M23',f6)
          a5=get('lesson:Y4M22'); a6=get('lesson:Y4M23')
          assert a5['core']['video']['screenpal']=='cOV0oyn36Sg'; assert a6['core']['video']['screenpal']=='cOVO15n3ovI'
          json.dump({'environment':env,'fractions5':a5['core']['video']['screenpal'],'fractions6':a6['core']['video']['screenpal']},open('y4-fractions56-video-evidence.json','w'),indent=2)
          print('Y4_FRACTIONS_5_6_VIDEO_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y4-fractions56-video-evidence
          path: y4-fractions56-video-evidence.json
          retention-days: 30
