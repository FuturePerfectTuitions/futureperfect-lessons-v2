name: Temporary live origin diagnostic
on:
  push:
    branches: [diagnose-live-origin-20260907]
    paths:
      - '.github/workflows/tmp-live-origin-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live custom domain and GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          getent ahosts lessons.futureperfect.education || true
          echo
          for url in \
            'https://lessons.futureperfect.education/' \
            'https://lessons.futureperfect.education/phase11-change8.html' \
            'https://futureperfecttuitions.github.io/futureperfect-lessons-v2/phase11-change8.html' \
            'https://futureperfecttuitions.github.io/futureperfect-lessons-v2/assets/phase20-collapsible-lessons.js'; do
            echo "=== $url ==="
            curl -fsSL -D /tmp/headers.txt -o /tmp/body.txt "$url" || { echo 'FETCH_FAILED'; continue; }
            sed -n '1,30p' /tmp/headers.txt
            echo '-- sha256 --'
            sha256sum /tmp/body.txt
            echo '-- fingerprints --'
            grep -o -E 'Just shared with you|phase20-collapsible-lessons.js|phase16-ui-refinement.css|phase20-recent-collapse.css|closed.:.Detail.|Description|Future Perfect Tuitions — Portal V2 Development' /tmp/body.txt | sort -u || true
            echo '-- first 25 lines --'
            sed -n '1,25p' /tmp/body.txt
            echo
          done
