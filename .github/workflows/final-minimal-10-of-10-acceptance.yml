name: Final minimal - 10 of 10 acceptance

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-10-of-10-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Final exact-current content, alias, media and Worker acceptance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node tests/final-minimal-reconciled-worker-static.mjs
          python3 - <<'PY'
          import json,os,re,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          worker='fpt-portal-v2-worker'; bucket='fpt-materials-dev'
          settings=requests.get(f'{api}/accounts/{acct}/workers/scripts/{worker}/settings',headers=auth,timeout=60).json(); assert settings.get('success')
          b=settings['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); r2bound=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert r2bound==bucket; assert ns
          login=next((x.get('text') for x in b if x.get('name')=='STUDENT_LOGIN_ENABLED' and x.get('type')=='plain_text'),'')
          assert str(login).lower() in ('','false')
          base=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def kv(k):
            r=requests.get(base+urllib.parse.quote(k,safe=''),headers=auth,timeout=60); r.raise_for_status(); return r.json()
          objs=[]; cursor=None
          while True:
            p={'per_page':'1000'}
            if cursor:p['cursor']=cursor
            q=requests.get(f'{api}/accounts/{acct}/r2/buckets/{bucket}/objects',headers=auth,params=p,timeout=120).json(); assert q.get('success'),q
            objs.extend(q.get('result') or []); info=q.get('result_info') or {}; cursor=info.get('cursor') if info.get('is_truncated') else None
            if not cursor:break
          r2={o.get('key') for o in objs if o.get('key') and not o.get('key').endswith('/')}
          stale_y3={
            'english/year3/Y3T3E07/homework/sheets/Y3T3E07 Homework Reading Assessment.pdf',
            'english/year3/Y3T3E10/prelesson/sheets/Y3T3E10 PreLesson Sheets Revision 3.pdf'
          }
          cfg=[
            (2,'Maths','MATHS_Y2',36,'maths/year2/','Y2T',85),
            (2,'English','ENGLISH_Y2',29,'english/year2/','Y2T',72),
            (3,'Maths','MATHS_Y3',34,'maths/year3/','Y3T',95),
            (3,'English','ENGLISH_Y3',32,'english/year3/','Y3T',84),
            (4,'Maths','MATHS_L1',35,'maths/year4/','L1T',100),
            (4,'English','ENGLISH_Y4',34,'english/year4/','Y4T',256),
            (5,'Maths','MATHS_L2',38,'maths/year5/','L2T',137),
            (5,'English','ENGLISH_Y5',36,'english/year5/','Y5T',285),
            (6,'Maths','MATHS_L3',43,'maths/year6/','L3T',138),
            (6,'English','ENGLISH_Y6',31,'english/year6/','Y6T',91),
          ]
          def refs_in(x,out=None):
            if out is None: out=[]
            if isinstance(x,dict):
              for k,v in x.items():
                if k=='r2Key' and isinstance(v,str) and v.strip(): out.append(v.strip())
                else: refs_in(v,out)
            elif isinstance(x,list):
              for v in x: refs_in(v,out)
            return out
          matrix=[]; all_active_refs=set()
          for year,subject,cur,expected_lessons,prefix,codeprefix,expected_r2 in cfg:
            c=kv('curriculum:'+cur); ids=c.get('lessonIds') or []; assert len(ids)==expected_lessons,(cur,len(ids))
            records=[kv('lesson:'+lid) for lid in ids]; assert all(r.get('active') is not False for r in records)
            current={k for k in r2 if k.startswith(prefix+codeprefix)}
            if cur=='ENGLISH_Y3': current-=stale_y3
            assert len(current)==expected_r2,(cur,'r2',len(current),expected_r2)
            refs=set()
            for rec in records: refs.update(x for x in refs_in(rec) if x.startswith(prefix.split('/')[0]+'/'))
            # Scope to this year so other non-target/special refs cannot mask mismatch.
            refs={x for x in refs if x.startswith(prefix)}
            assert refs==current,(cur,'coverage',len(current-refs),len(refs-current))
            assert not [x for x in refs if x not in r2]
            all_active_refs.update(refs)
            if subject=='Maths' and year>=4:
              level=year-3
              for rec in records:
                d=rec.get('displayIds') or {}; lv=str(d.get(f'maths-level{level}') or ''); yr=str(d.get(f'maths-year{year}') or '')
                assert re.fullmatch(fr'L{level}T[123]M\d{{2}}',lv),(rec.get('lessonId'),lv)
                assert yr==f'Y{year}'+lv[2:],(rec.get('lessonId'),lv,yr)
            if subject=='English' and year in (4,5):
              for rec in records:
                d=rec.get('displayIds') or {}; normal=str(d.get(f'english-year{year}') or ''); ep=str(d.get(f'english-year{year}-11plus') or '')
                assert re.fullmatch(fr'Y{year}T[123]E\d{{2}}',normal),(rec.get('lessonId'),normal)
                assert ep==re.sub(r'E(\d{2})$',r'EE\1',normal),(rec.get('lessonId'),normal,ep)
            matrix.append({'year':year,'subject':subject,'driveLessons':expected_lessons,'kvLessons':len(ids),'currentR2Objects':len(current),'activeReferencedR2Objects':len(refs),'brokenReferences':0,'status':'PASS'})

          # Owner-confirmed media/presentation exceptions.
          y5p=kv('lesson:Y5M19'); y6p=kv('lesson:Y6M25')
          assert y5p['core']['video']['screenpal']=='cO1Zionu8NC' and not y5p['core']['video'].get('quiz')
          assert y6p['core']['video']['screenpal']=='cO1Zionu8NC' and not y6p['core']['video'].get('quiz')
          t1=kv('lesson:Y4M25'); assert t1['title']=='Time 1' and t1['core']['video']['screenpal']=='cOeIjsnZCkU' and not t1['core']['video'].get('quiz')
          f5=kv('lesson:Y4M22'); f6=kv('lesson:Y4M23')
          assert f5['title']=='Fractions 5' and f5['core']['video']['screenpal']=='cOV0oyn36Sg'
          assert f6['title']=='Fractions 6' and f6['core']['video']['screenpal']=='cOVO15n3ovI'
          trans=kv('lesson:Y4E1'); assert trans['title']=='Transitioning from Year 3 to Year 4' and (trans.get('core') or {}).get('video') is None
          last=kv('lesson:Y6M45'); assert (last.get('displayIds') or {}).get('maths-level3')=='L3T3M43' and (last.get('displayIds') or {}).get('maths-year6')=='Y6T3M43' and last['core']['video']['screenpal']=='cOiDFVnUCjn'

          # No active target resource is missing physically.
          assert all(x in r2 for x in all_active_refs)
          result={'environment':env,'bucket':bucket,'targetLessonCount':sum(x[3] for x in cfg),'matrix':matrix,'specificMediaChecks':'PASS','displayAliasChecks':'PASS','resourceCoverageChecks':'PASS','finalParity':'PASS'}
          assert result['targetLessonCount']==348 and len(matrix)==10 and all(x['status']=='PASS' for x in matrix)
          json.dump(result,open('final-10-of-10-acceptance.json','w'),indent=2,sort_keys=True)
          print(json.dumps(result,indent=2,sort_keys=True))
          print('FINAL_PARITY_PASS')
          PY
      - name: Deployed no-auth smoke remains closed
        shell: bash
        run: |
          set -euo pipefail
          base='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          code="$(curl --silent --show-error --output /tmp/noauth.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$base/api/v1/student/home")"
          test "$code" = '401'
          echo 'DEPLOYED_NOAUTH_SMOKE_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-10-of-10-acceptance
          path: final-10-of-10-acceptance.json
          retention-days: 30
