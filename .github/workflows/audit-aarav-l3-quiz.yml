name: Targeted Aarav L3 and Quiz audit

on:
  push:
    branches: ['audit/aarav-l3-quiz-2026-09-28']
    paths: ['.github/workflows/audit-aarav-l3-quiz.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      DB_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      PORTAL_USER_ID_NORM: aar1811
    steps:
      - uses: actions/checkout@v4
      - name: Trace exact live Aar1811 programme read-only
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          query(){
            curl --fail --silent --show-error -X POST "$API/d1/database/${DB_ID}/query" -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/query.json
          }

          key="user:${PORTAL_USER_ID_NORM}"
          encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")
          curl --fail --silent --show-error "$API/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${encoded}" -H "$AUTH" -o /tmp/user.json
          echo PROFILE
          jq -c '{portalUserId,name,batches:(.batches//[]),fullLibraries:(.fullLibraries//[]),upsellViews:(.upsellViews//[])}' /tmp/user.json

          echo AAR_ASSIGNMENTS
          sql='SELECT a.assignment_id,a.batch_key,a.effective_from,a.effective_to,b.subject,b.school_year,b.stream,b.maths_level,b.active_from,b.active_to FROM student_batch_assignments a LEFT JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm=? ORDER BY a.effective_from,a.assignment_id'
          jq -n --arg sql "$sql" --arg id "$PORTAL_USER_ID_NORM" '{sql:$sql,params:[$id]}' >/tmp/query.json
          query | jq -c '.result[0].results[]'

          today=$(TZ=Europe/London date +%F)
          echo ACTIVE_Y6_EQUIVALENT_BATCH_DEFINITIONS
          sql='SELECT b.batch_key,b.subject,b.school_year,b.stream,b.maths_level,b.active_from,b.active_to,COUNT(a.assignment_id) AS active_student_count FROM batch_definitions b LEFT JOIN student_batch_assignments a ON a.batch_key=b.batch_key AND a.effective_from<=? AND (a.effective_to IS NULL OR ?<a.effective_to) WHERE lower(b.subject)="maths" AND (b.school_year=6 OR b.maths_level=3 OR (lower(b.stream)="11plus" AND b.school_year-3=3)) AND (b.active_from IS NULL OR b.active_from<=?) AND (b.active_to IS NULL OR ?<b.active_to) GROUP BY b.batch_key,b.subject,b.school_year,b.stream,b.maths_level,b.active_from,b.active_to ORDER BY b.stream,b.maths_level,b.batch_key'
          jq -n --arg sql "$sql" --arg d "$today" '{sql:$sql,params:[$d,$d,$d,$d]}' >/tmp/query.json
          query | jq -c '.result[0].results[]'

          echo Y611FM_ACTIVE_ASSIGNMENT_COUNT
          sql='SELECT COUNT(*) AS n FROM student_batch_assignments WHERE batch_key="Y611FM" AND effective_from<=? AND (effective_to IS NULL OR ?<effective_to)'
          jq -n --arg sql "$sql" --arg d "$today" '{sql:$sql,params:[$d,$d]}' >/tmp/query.json
          query | jq -c '.result[0].results[0]'

          echo D1_RELEVANT_TABLES
          sql='SELECT name FROM sqlite_master WHERE type="table" AND (lower(name) LIKE "%program%" OR lower(name) LIKE "%track%" OR lower(name) LIKE "%batch%" OR lower(name) LIKE "%student%") ORDER BY name'
          jq -n --arg sql "$sql" '{sql:$sql,params:[]}' >/tmp/query.json
          query | jq -c '.result[0].results[]'

          echo ENTITLEMENT_SCHEMA
          sql='PRAGMA table_info(student_lesson_entitlements)'
          jq -n --arg sql "$sql" '{sql:$sql,params:[]}' >/tmp/query.json
          query | jq -c '.result[0].results[] | {name,type}'

          echo QUIZ_ELIGIBILITY
          sql='SELECT a.assignment_id,a.batch_key,(CASE WHEN b.maths_level BETWEEN 1 AND 3 THEN b.maths_level ELSE b.school_year-3 END) AS maths_level FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm=? AND lower(b.subject)="maths" AND lower(b.stream)="11plus" AND (CASE WHEN b.maths_level BETWEEN 1 AND 3 THEN b.maths_level ELSE b.school_year-3 END) IN (2,3) AND a.effective_from<=? AND (a.effective_to IS NULL OR ?<a.effective_to) AND (b.active_from IS NULL OR b.active_from<=?) AND (b.active_to IS NULL OR ?<b.active_to)'
          jq -n --arg sql "$sql" --arg id "$PORTAL_USER_ID_NORM" --arg d "$today" '{sql:$sql,params:[$id,$d,$d,$d,$d]}' >/tmp/query.json
          query | jq -c '{rows:.result[0].results,count:(.result[0].results|length)}'
          echo AAR1811_TRACE_PASS
