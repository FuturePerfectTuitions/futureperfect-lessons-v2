name: Targeted Aarav L3 and Quiz audit

on:
  push:
    branches: ['audit/aarav-l3-quiz-2026-09-28']
    paths:
      - '.github/workflows/audit-aarav-l3-quiz.yml'
      - 'ops/aar1811-l3-quiz-preflight.mjs'
      - 'ops/aar1811-live-production-guard.mjs'
      - 'ops/y611fm-cohort-semantics-audit.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Aar1811 target preflight against live sources read-only
        run: |
          set -euo pipefail
          node --check ops/aar1811-l3-quiz-preflight.mjs
          node ops/aar1811-l3-quiz-preflight.mjs
      - name: Audit Y611FM cohort semantics read-only
        run: |
          set -euo pipefail
          node --check ops/y611fm-cohort-semantics-audit.mjs
          node ops/y611fm-cohort-semantics-audit.mjs
      - name: Run final live production guard read-only
        run: |
          set -euo pipefail
          node --check ops/aar1811-live-production-guard.mjs
          node ops/aar1811-live-production-guard.mjs
      - name: Confirm no production mutation in this workflow
        run: |
          set -euo pipefail
          ! grep -E 'method:.PUT.|method:.DELETE.|d1.*execute|wrangler.*deploy' ops/aar1811-l3-quiz-preflight.mjs ops/aar1811-live-production-guard.mjs ops/y611fm-cohort-semantics-audit.mjs
          echo AAR1811_TARGET_PREFLIGHT_READONLY_PASS
