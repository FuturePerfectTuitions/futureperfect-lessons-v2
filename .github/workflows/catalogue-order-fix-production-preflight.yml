name: Catalogue order fix - production preflight

on:
  push:
    branches:
      - fix/importer-publish-email-per-lesson-2026-09-16
    paths:
      - docs/rebuild/CATALOGUE_ORDER_FIX_PRODUCTION_PREFLIGHT_TRIGGER.md

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER: fpt-portal-v2-worker
      READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
      EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importer-publish-email-per-lesson-2026-09-16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regression tests
        run: |
          set -Eeuo pipefail
          node --check rebuild/shared/read-models/catalogue.mjs
          node tests/catalogue-curriculum-order-verification.mjs
          node tests/rebuild-checkpoint2-read-models.mjs
      - name: Read-only production candidate diff
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileGlobalScope } from './rebuild/adminops/src/lib/compiler.mjs';
          import { pointerKey, versionKey, stableStringify } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          import { VIEW_DEFINITIONS } from './rebuild/shared/read-models/view-registry.mjs';

          const clean=v=>String(v??'').trim();
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID), token=clean(process.env.CLOUDFLARE_API_TOKEN);
          const readNs=clean(process.env.READ_MODELS_KV), worker=clean(process.env.LEGACY_WORKER), expectedLessons=clean(process.env.EXPECTED_LESSONS_KV);
          if(!account||!token||!readNs||!worker||!expectedLessons) throw new Error('Required production configuration missing.');
          const base='https://api.cloudflare.com/client/v4', headers={Authorization:`Bearer ${token}`};
          async function req(path,opt={}){const r=await fetch(base+path,{...opt,headers:{...headers,...(opt.headers||{})}});const text=await r.text();let body=null;try{body=JSON.parse(text)}catch{}return{r,text,body}}
          async function envp(path){const o=await req(path);if(!o.r.ok||o.body?.success!==true)throw new Error(`${o.r.status} ${path}: ${JSON.stringify(o.body?.errors||[])}`);return o.body.result}
          async function kvText(ns,key){const o=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(o.r.status===404)return null;if(!o.r.ok)throw new Error(`KV read ${o.r.status}: ${key}`);return o.text}
          async function kvJson(ns,key){const t=await kvText(ns,key);return t==null?null:JSON.parse(t)}
          const settings=await envp(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/settings`);
          const lessonsNs=clean((settings.bindings||[]).find(x=>x.name==='LESSONS_KV')?.namespace_id);
          if(lessonsNs!==expectedLessons) throw new Error(`LESSONS_KV binding mismatch: ${lessonsNs}`);

          async function current(scope){const p=await kvJson(readNs,pointerKey(scope));const v=clean(p?.current?.version);if(!v)throw new Error(`Missing current pointer ${scope}`);const e=await kvJson(readNs,versionKey(scope,v));if(!e?.payload)throw new Error(`Missing current envelope ${scope}/${v}`);return{pointer:p,version:v,payload:e.payload}}
          const currentGlobal=await current('global');

          const curriculumCodes=['MATHS_Y2','MATHS_Y3','MATHS_L1','MATHS_L2','MATHS_L3','MATHS_Y6_EXTRA','ENGLISH_Y2','ENGLISH_Y3','ENGLISH_Y4','ENGLISH_Y5','ENGLISH_Y6'];
          const fallback={MATHS_Y2:['maths-year2'],MATHS_Y3:['maths-year3'],MATHS_L1:['maths-year4','maths-level1'],MATHS_L2:['maths-year5','maths-level2'],MATHS_L3:['maths-level3','maths-year6'],MATHS_Y6_EXTRA:['maths-year6-extra'],ENGLISH_Y2:['english-year2'],ENGLISH_Y3:['english-year3'],ENGLISH_Y4:['english-year4','english-year4-11plus'],ENGLISH_Y5:['english-year5','english-year5-11plus'],ENGLISH_Y6:['english-year6']};
          const items=raw=>Array.isArray(raw)?raw:Array.isArray(raw?.lessonIds)?raw.lessonIds:Array.isArray(raw?.lessons)?raw.lessons:Array.isArray(raw?.items)?raw.items:[];
          const curricula={}, ids=new Set();
          for(const code of curriculumCodes){let raw=await kvJson(lessonsNs,`curriculum:${code}`);if(!items(raw).length){for(const view of fallback[code]||[]){const probe=await kvJson(lessonsNs,`view:${view}`);if(items(probe).length){raw=probe;break;}}}const lessonIds=items(raw).map(x=>typeof x==='string'?clean(x):clean(x?.lessonId)).filter(Boolean);if(!lessonIds.length)throw new Error(`Empty curriculum ${code}`);curricula[code]={lessonIds};lessonIds.forEach(id=>ids.add(id));}
          const lessons={};for(const id of [...ids].sort()){const row=await kvJson(lessonsNs,`lesson:${id}`);if(!row)throw new Error(`Missing lesson:${id}`);lessons[id]=row;}
          if(Object.keys(lessons).length!==372) throw new Error(`Unexpected canonical lesson count ${Object.keys(lessons).length}; expected 372.`);

          const source=currentGlobal.payload?.source||{};
          const candidate=compileGlobalScope({sourceType:clean(source.type||'unknown'),sourceRevision:clean(source.revision||''),curricula,lessons},{sourceType:clean(source.type||'unknown'),sourceRevision:clean(source.revision||'')});
          const current=currentGlobal.payload;
          if(Object.keys(candidate.catalogues||{}).length!==Object.keys(VIEW_DEFINITIONS).length) throw new Error('Candidate view count mismatch.');
          if(stableStringify(candidate.navigation)!==stableStringify(current.navigation)) throw new Error('Navigation changed unexpectedly.');
          if(stableStringify(candidate.lessonToViews)!==stableStringify(current.lessonToViews)) throw new Error('lessonToViews changed unexpectedly.');

          const changed=[];
          const details=[];
          const stripOrder=row=>{const {order,...rest}=row||{};return rest};
          for(const viewId of Object.keys(candidate.catalogues||{})){
            const before=current.catalogues?.[viewId]?.lessons||[];
            const after=candidate.catalogues?.[viewId]?.lessons||[];
            if(before.length!==after.length) throw new Error(`${viewId}: lesson count changed.`);
            const beforeBy=new Map(before.map(r=>[clean(r.lessonId),stripOrder(r)]));
            const afterBy=new Map(after.map(r=>[clean(r.lessonId),stripOrder(r)]));
            if(stableStringify(Object.fromEntries([...beforeBy].sort()))!==stableStringify(Object.fromEntries([...afterBy].sort()))) throw new Error(`${viewId}: non-order lesson metadata changed.`);
            const sequenceBefore=before.map(r=>clean(r.lessonId));
            const sequenceAfter=after.map(r=>clean(r.lessonId));
            const orderBefore=before.map(r=>Number(r.order));
            const orderAfter=after.map(r=>Number(r.order));
            if(stableStringify(sequenceBefore)!==stableStringify(sequenceAfter)||stableStringify(orderBefore)!==stableStringify(orderAfter)){
              changed.push(viewId);details.push({viewId,sequenceChanged:stableStringify(sequenceBefore)!==stableStringify(sequenceAfter),orderChanged:stableStringify(orderBefore)!==stableStringify(orderAfter),before:first(before),after:first(after)});
            }
            const expected=[];const seen=new Set();for(const code of VIEW_DEFINITIONS[viewId].curricula){for(const id of curricula[code]?.lessonIds||[]){if(seen.has(id))continue;seen.add(id);if(lessons[id]?.active!==false)expected.push(id);}}
            if(stableStringify(sequenceAfter)!==stableStringify(expected)) throw new Error(`${viewId}: candidate does not exactly follow authoritative curriculum sequence.`);
            if(after.some((r,i)=>Number(r.order)!==i+1)) throw new Error(`${viewId}: candidate order metadata is not normalized.`);
          }
          function first(rows){return rows.slice(0,25).map(r=>({lessonId:clean(r.lessonId),displayLessonId:clean(r.displayLessonId),order:Number(r.order),title:clean(r.title)}))}
          const report={marker:'CATALOGUE_ORDER_FIX_PRODUCTION_PREFLIGHT_PASS',readOnly:true,observedAt:new Date().toISOString(),currentGlobalVersion:currentGlobal.version,canonicalLessonCount:Object.keys(lessons).length,changedViewIds:changed,details,candidatePreview:{mathsYear6:first(candidate.catalogues?.['maths-year6']?.lessons||[]),englishYear4:first(candidate.catalogues?.['english-year4']?.lessons||[])}};
          fs.writeFileSync('/tmp/catalogue-order-preflight.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-order-production-preflight
          path: /tmp/catalogue-order-preflight.json
          retention-days: 30
          if-no-files-found: error
