name: Phase 14 final backend acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-final-backend-acceptance.yml
      - tests/phase14-guarded-live-matrix-final.sh

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FPT_PORTAL_V2_EXCEL_SYNC_TOKEN: ${{ secrets.FPT_PORTAL_V2_EXCEL_SYNC_TOKEN }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  static-regression:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Phase 14 credited and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase13.js
          node tests/phase14-excel-sync-matrix-verification.mjs
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs
          node tests/phase12-batch-schema-static-verification.mjs
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/p14-catalogue.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/p14-catalogue.log
          node tests/phase11-session-efficiency-static-verification.mjs
          node tests/phase11-answer-dedup-static-verification.mjs
          node tests/phase11-answer-header-static-verification.mjs
          node tests/phase11-screenpal-static-verification.mjs
          node tests/phase11-vr-howto-top-level-static-verification.mjs
          node --experimental-default-type=module tests/phase11-vr-howto-real-catalogue-static-verification.mjs
          node tests/phase11-vr-solution-video-policy-static-verification.mjs
          node --experimental-default-type=module tests/phase11-test-personas-static-verification.mjs
          node --check worker/src/index-phase10.js
          node --check worker/src/index-phase10-history.js
          node --check assets/phase10.js
          node --check assets/phase10-counts.js
          node --check assets/phase10-history.js
          node --check tests/phase10-browser-verification.mjs
          bash -n tests/phase10-api-verification.sh
          grep -Fq 'MOCK_DAILY_PASSWORDS' worker/wrangler.toml
          grep -Fq 'must never be committed' worker/wrangler.toml
          grep -Fq 'CREATE TABLE IF NOT EXISTS mock_password_rate_limits' worker/migrations/0006_mock_password_rate_limits.sql
          ! grep -R -E '"password"[[:space:]]*:[[:space:]]*".+"' worker/fixtures/phase10/special-MOCKS.json
          grep -Fq 'MATHS_L2_FULL' worker/src/index.js
          grep -Fq 'function fullLibraryCoversLesson' worker/src/index.js
          grep -Fq 'ENGLISH_Y5_11PLUS_FULL' worker/src/index.js
          grep -Fq 'function fullLibraryGrantsVr' worker/src/index-phase9.js
          bash -n tests/phase14-guarded-live-matrix-final.sh
          echo 'Phase 14 final static/inherited regression gates: PASS'

  guarded-live-matrix:
    needs: static-regression
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Corrected isolated Phase 14 live outcome matrix
        shell: bash
        run: bash tests/phase14-guarded-live-matrix-final.sh
