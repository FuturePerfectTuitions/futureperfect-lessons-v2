name: Post-Step-10 first-tranche family rules read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-first-tranche-family-rules-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Export first-tranche family rules only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-first-tranche-family-rules-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT family_id,family_name,primary_skill_id,gl_method_signature,generator_rules_json,earliest_release_point,question_level_override_needed FROM question_family WHERE family_id IN ('MEA-07','MEA-01','MEA-02','COO-01','MEA-03','GEO-10','DAT-07','GEO-12','GEO-05','FRA-03','FRA-12','ALG-02') ORDER BY family_id;" --json >/tmp/rules.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/rules.json').read_text())[0]['results']
          assert len(rows)==12, len(rows)
          Path('/tmp/first_tranche_family_rules.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          print(json.dumps({'marker':'POST_STEP10_FIRST_TRANCHE_FAMILY_RULES_READONLY_PASS','rows':len(rows),'family_ids':[r['family_id'] for r in rows],'source_question_text_exported':False},indent=2))
          PY
          rm -f /tmp/rules.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-first-tranche-family-rules-readonly
          path: /tmp/first_tranche_family_rules.json
          retention-days: 30
