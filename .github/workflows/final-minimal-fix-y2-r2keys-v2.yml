name: Final minimal - repair Year 2 KV R2 links v2

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-fix-y2-r2keys-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Rebuild Year 2 broken refs from current reconciled R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy,json,os,re,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          worker='fpt-portal-v2-worker'; bucket='fpt-materials-dev'
          settings=requests.get(f'{api}/accounts/{acct}/workers/scripts/{worker}/settings',headers=auth,timeout=60).json(); assert settings.get('success')
          b=settings['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); r2bound=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert r2bound==bucket; assert ns
          kvbase=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def kvurl(key): return kvbase+urllib.parse.quote(key,safe='')
          def kvget(key):
            q=requests.get(kvurl(key),headers=auth,timeout=60); q.raise_for_status(); return q.json()
          def kvput(key,obj):
            q=requests.put(kvurl(key),headers={**auth,'Content-Type':'application/json'},data=json.dumps(obj,separators=(',',':')).encode(),timeout=60); q.raise_for_status(); p=q.json(); assert p.get('success'),p
          r2=[]; cursor=None
          while True:
            params={'per_page':'1000'}
            if cursor: params['cursor']=cursor
            p=requests.get(f'{api}/accounts/{acct}/r2/buckets/{bucket}/objects',headers=auth,params=params,timeout=120).json(); assert p.get('success'),p
            r2.extend(p.get('result') or []); info=p.get('result_info') or {}; cursor=info.get('cursor') if info.get('is_truncated') else None
            if not cursor: break
          r2keys={o.get('key') for o in r2 if o.get('key') and not o.get('key').endswith('/')}
          curricula=[('ENGLISH_Y2','english',re.compile(r'^Y2T[123]E\d{2}$')),('MATHS_Y2','maths',re.compile(r'^Y2T[123]M\d{2}$'))]
          os.makedirs('y2-v2-before',exist_ok=True); os.makedirs('y2-v2-after',exist_ok=True)
          report={'environment':env,'bucket':bucket,'initialBroken':0,'finalBroken':0,'changedLessons':[],'clearedEOS':[],'specialRebuilt':[]}
          def code_for(rec,rx):
            hits={str(v) for v in (rec.get('displayIds') or {}).values() if isinstance(v,str) and rx.fullmatch(v)}
            assert len(hits)==1,(rec.get('lessonId'),hits,rec.get('displayIds')); return next(iter(hits))
          def all_refs(x,out):
            if isinstance(x,dict):
              for k,v in x.items():
                if k=='r2Key' and isinstance(v,str) and v.strip(): out.append(v.strip())
                else: all_refs(v,out)
            elif isinstance(x,list):
              for v in x: all_refs(v,out)
          def keys_for(subject,code,category):
            prefix=f'{subject}/year2/{code}/{category}/'
            return sorted(k for k in r2keys if k.startswith(prefix))
          def basename(k): return k.rsplit('/',1)[-1]
          def identity(k):
            s=basename(k).lower().removesuffix('.pdf')
            s=re.sub(r'^y2t[123][em]\d{2}\s*','',s)
            s=re.sub(r'\b(answer\s*pack|homework|prelesson|pre-lesson|pre lesson)\b',' ',s)
            return re.sub(r'[^a-z0-9]+',' ',s).strip()
          def merge_resource(old,key):
            d=dict(old) if isinstance(old,dict) else {}
            d['r2Key']=key; d['displayName']=basename(key)
            return d
          def general_fix(x,subject,code):
            changed=0; unresolved=[]
            if isinstance(x,dict):
              for k,v in list(x.items()):
                if k=='r2Key' and isinstance(v,str) and v.strip() and v.strip() not in r2keys:
                  old=v.strip(); parts=old.split('/')
                  if len(parts)<5 or parts[0]!=subject or parts[1]!='year2': unresolved.append(old); continue
                  category='/'.join(parts[3:-1]); parts[2]=code; direct='/'.join(parts)
                  if direct in r2keys:
                    x[k]=direct
                    if 'displayName' in x: x['displayName']=basename(direct)
                    changed+=1; continue
                  candidates=keys_for(subject,code,category)
                  if len(candidates)==1:
                    x[k]=candidates[0]
                    if 'displayName' in x: x['displayName']=basename(candidates[0])
                    changed+=1; continue
                  unresolved.append(old)
                elif k!='r2Key':
                  c,u=general_fix(v,subject,code); changed+=c; unresolved+=u
            elif isinstance(x,list):
              for v in x:
                c,u=general_fix(v,subject,code); changed+=c; unresolved+=u
            return changed,unresolved
          active=[]
          for c,subject,rx in curricula:
            for lid in kvget('curriculum:'+c).get('lessonIds') or []: active.append((c,subject,rx,lid))
          # Count exact starting broken refs first.
          for c,subject,rx,lid in active:
            rec=kvget('lesson:'+lid); refs=[]; all_refs(rec,refs); report['initialBroken']+=sum(1 for k in refs if k not in r2keys)
          assert report['initialBroken']==181, report['initialBroken']
          for c,subject,rx,lid in active:
            rec=kvget('lesson:'+lid)
            if rec.get('active') is False: continue
            code=code_for(rec,rx); before=copy.deepcopy(rec); patched=copy.deepcopy(rec)
            # Current Drive/R2 has no eligible current-coded resources for these two EOS lessons.
            if code in {'Y2T3M35','Y2T3M36'}:
              assert not keys_for(subject,code,'homework/sheets') and not keys_for(subject,code,'homework/answers')
              if isinstance(patched.get('core'),dict): patched['core']['homeworks']=[]
              report['clearedEOS'].append({'lessonId':lid,'code':code})
              unresolved=[]; changed=1
            # Y2T1E09 has two newly named semantic pairs: Comprehension and Tenses.
            elif code=='Y2T1E09':
              sheets=keys_for('english',code,'homework/sheets'); answers=keys_for('english',code,'homework/answers')
              assert len(sheets)==2 and len(answers)==2,(sheets,answers)
              sm={identity(k):k for k in sheets}; am={identity(k):k for k in answers}; assert set(sm)==set(am)=={'comprehension','tenses'},(sm,am)
              existing=list((patched.get('core') or {}).get('homeworks') or [])
              pairs=[]
              for i,topic in enumerate(['comprehension','tenses']):
                base=copy.deepcopy(existing[i]) if i<len(existing) and isinstance(existing[i],dict) else {}
                base['homework']=merge_resource(base.get('homework'),sm[topic]); base['answerPack']=merge_resource(base.get('answerPack'),am[topic]); pairs.append(base)
              patched.setdefault('core',{})['homeworks']=pairs
              changed,unresolved=general_fix(patched,'english',code)
              report['specialRebuilt'].append({'lessonId':lid,'code':code,'pairs':['Comprehension','Tenses']})
            else:
              changed,unresolved=general_fix(patched,subject,code)
            assert not unresolved, f'{lid} {code} unresolved: {unresolved}'
            refs=[]; all_refs(patched,refs); bad=[k for k in refs if k not in r2keys]; assert not bad,(lid,code,bad)
            if patched!=before:
              json.dump(before,open(f'y2-v2-before/{lid}.json','w'),indent=2,sort_keys=True)
              kvput('lesson:'+lid,patched); after=kvget('lesson:'+lid); assert after==patched,f'readback {lid}'
              json.dump(after,open(f'y2-v2-after/{lid}.json','w'),indent=2,sort_keys=True)
              report['changedLessons'].append({'lessonId':lid,'code':code})
          # Full Year 2 post-write health proof.
          for c,subject,rx,lid in active:
            rec=kvget('lesson:'+lid); refs=[]; all_refs(rec,refs); report['finalBroken']+=sum(1 for k in refs if k not in r2keys)
          assert report['finalBroken']==0,report['finalBroken']
          json.dump(report,open('y2-r2key-v2-report.json','w'),indent=2,sort_keys=True)
          print('YEAR2_R2KEY_V2_PASS initial',report['initialBroken'],'final',report['finalBroken'],'changedLessons',len(report['changedLessons']))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y2-r2key-v2-evidence
          path: |
            y2-r2key-v2-report.json
            y2-v2-before/
            y2-v2-after/
          retention-days: 30
