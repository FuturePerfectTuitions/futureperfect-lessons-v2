name: Phase 18 read-only prelaunch diagnostic

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-readonly-prelaunch-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  R2_BUCKET: fpt-materials-dev

jobs:
  diagnose:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard frozen Phase 17 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='3c63a49ef0d679318e8c6901b12e82c007b56271'
          git merge-base --is-ancestor "$BASE" HEAD
          node scripts/phase11-navigation-manifest.mjs >/tmp/nav.json
          jq -e '.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons==369 and .curricula==11' /tmp/nav.json >/dev/null
      - name: Run existing Phase 17 exhaustive read-only verifier and print only its sanitised summary
        shell: bash
        run: |
          set +e
          node tests/phase17-prelaunch-readonly.mjs | tee /tmp/prelaunch-summary.json
          rc=${PIPESTATUS[0]}
          set -e
          test -s /tmp/prelaunch-summary.json
          echo 'PHASE18_PRELAUNCH_SANITISED_SUMMARY:'
          cat /tmp/prelaunch-summary.json
          echo "PHASE18_PRELAUNCH_EXIT_CODE=${rc}"
          exit "$rc"
