name: Phase 13 temporary lesson-date verification

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-date-change-verify-temp.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  verify-date-change:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify controlled entitlement and release date
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing.' >&2; false;; esac
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_rows, MIN(source_lesson_date) AS source_lesson_date, MIN(source_batch_code) AS source_batch_code FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id='Y5E10'; SELECT COUNT(*) AS release_rows, MIN(lesson_date) AS lesson_date FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id='Y5E10'; SELECT COUNT(*) AS assignment_rows, MIN(effective_from) AS effective_from FROM student_batch_assignments WHERE portal_user_id_norm='testy2e' AND batch_key='__P13_ACCEPT_E5__'; PRAGMA quick_check;" >/tmp/verify.json
          jq -c '[.[0].results[0],.[1].results[0],.[2].results[0],.[3].results[0]]' /tmp/verify.json
          test "$(jq -r '.[0].results[0].entitlement_rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[1].results[0].release_rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[1].results[0].lesson_date' /tmp/verify.json)" = '2026-09-13'
          test "$(jq -r '.[2].results[0].assignment_rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[2].results[0].effective_from' /tmp/verify.json)" = '2000-01-01'
          jq -e '.[3].results[]|select(.quick_check=="ok")' /tmp/verify.json >/dev/null
          echo 'DATE_CHANGE_VERIFIED=1 entitlement, 1 release, release date 2026-09-13, assignment restored.'
