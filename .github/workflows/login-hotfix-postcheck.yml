name: Login hotfix postcheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-hotfix-postcheck.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      PAGES_ORIGIN: https://futureperfecttuitions.github.io/futureperfect-lessons-v2
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
    steps:
      - name: Inspect live auth responses
        shell: bash
        run: |
          set -u
          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"username":"definitely-not-a-user","password":"Aa1b"}' "$WORKER_BASE/api/v1/student/auth/login")"
          echo "LOGIN_CODE=$code"
          echo "LOGIN_ERROR=$(jq -r '.error // "none"' /tmp/login.json 2>/dev/null || echo nonjson)"
          echo "LOGIN_BODY_OK=$(jq -r '.ok // false' /tmp/login.json 2>/dev/null || echo false)"

          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" "$WORKER_BASE/api/v1/student/session")"
          echo "SESSION_CODE=$code"
          echo "SESSION_ERROR=$(jq -r '.error // "none"' /tmp/session.json 2>/dev/null || echo nonjson)"

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          echo "SECRET_BINDINGS=$(jq -r '[.result.bindings[]|select((.type//"")|test("secret";"i"))|.name]|sort|join(",")' /tmp/settings.json)"
          echo "ENTRY_BINDINGS_OK=$(jq -r '[.result.bindings[]|.name] | ((index("STUDENTS_KV")!=null) and (index("LESSONS_KV")!=null) and (index("DB")!=null) and (index("MATERIALS_R2")!=null))' /tmp/settings.json)"

      - name: Inspect published frontend
        shell: bash
        run: |
          set -u
          code="$(curl --silent --show-error --output /tmp/html --write-out '%{http_code}' "$PAGES_ORIGIN/phase11.html?postcheck=${GITHUB_RUN_ID}")"
          echo "PAGES_HTML_CODE=$code"
          if grep -Fq 'phase19-access-ui.js?v=20260906-login-hotfix-2' /tmp/html; then echo 'PAGES_HOTFIX_TAG=yes'; else echo 'PAGES_HOTFIX_TAG=no'; fi
          code="$(curl --silent --show-error --output /tmp/ui --write-out '%{http_code}' "$PAGES_ORIGIN/assets/phase19-access-ui.js?v=20260906-login-hotfix-2")"
          echo "PAGES_UI_CODE=$code"
          if grep -Fq 'fpt_v2_window_login_v2' /tmp/ui; then echo 'PAGES_WINDOW_MARKER=yes'; else echo 'PAGES_WINDOW_MARKER=no'; fi
