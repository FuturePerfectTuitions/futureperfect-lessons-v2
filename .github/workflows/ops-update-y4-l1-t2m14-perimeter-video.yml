name: Ops update Y4/L1 T2M14 Perimeter video

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-update-y4-l1-t2m14-perimeter-video.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard production target, update Y4/L1 T2M14, and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_KV_ID;
          const valuesBase = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
          const keysBase = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/keys`;
          const auth = { Authorization: `Bearer ${token}` };

          const LEVEL_DISPLAY_ID = 'L1T2M14';
          const YEAR_DISPLAY_ID = 'Y4T2M14';
          const TARGET = 'cOQIiGnwJDh';
          const description = [
            'In this Year 4 Maths lesson, pupils develop a secure understanding of perimeter and learn efficient methods for finding the perimeter of rectangles, squares and rectilinear shapes.',
            '',
            'This lesson includes:',
            '✔ Understanding perimeter as the total distance around the outside of an enclosed shape',
            '✔ Calculating perimeter by counting unit lengths on centimetre grids',
            '✔ Checking stepped and irregular outlines carefully so that no sides are missed',
            '✔ Using the properties of rectangles, including equal opposite sides, to calculate perimeter efficiently',
            '✔ Using the properties of squares, including four equal sides, to calculate perimeter quickly',
            '✔ Calculating rectangle perimeter by adding all four sides or using 2 × (length + width)',
            '✔ Calculating square perimeter by multiplying one side length by 4',
            '✔ Finding missing side lengths when the perimeter of a rectangle or square is known',
            '✔ Recognising rectilinear shapes and adding all outside side lengths',
            '✔ Using known lengths to calculate missing sides in rectilinear shapes',
            '✔ Using commutativity to group side lengths efficiently when adding',
            '✔ Solving a challenge involving two joined rectilinear shapes and removing shared internal edges from the perimeter',
            '',
            'Pupils begin with perimeter on grids, counting every unit around the outside of shapes and identifying common counting errors. They then use the properties of rectangles and squares to move from counting to more efficient calculation methods.',
            '',
            'The lesson develops into missing-side problems, where pupils use known perimeter and shape properties to calculate unknown lengths. The final section introduces rectilinear shapes, including shapes with missing measurements and composite shapes made by joining two reflected copies.',
            '',
            'By the end of the lesson, learners will be able to calculate perimeter accurately, use efficient methods for rectangles and squares, and solve missing-length and rectilinear perimeter problems.'
          ].join('\n');

          function video(code) {
            return {
              screenpal: code,
              contentUrl: `https://screenpal.com/content/video/${code}`,
              embedUrl: `https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,
              watchUrl: `https://go.screenpal.com/watch/${code}`
            };
          }

          async function getJson(key) {
            const r = await fetch(valuesBase + encodeURIComponent(key), { headers: auth });
            if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
            const text = await r.text();
            try { return JSON.parse(text); } catch { throw new Error(`${key} is not valid JSON`); }
          }

          async function putJson(key, value) {
            const r = await fetch(valuesBase + encodeURIComponent(key), {
              method: 'PUT',
              headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(value)
            });
            if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
          }

          async function listLessonKeys() {
            const names = [];
            let cursor = '';
            do {
              const u = new URL(keysBase);
              u.searchParams.set('prefix', 'lesson:');
              u.searchParams.set('limit', '1000');
              if (cursor) u.searchParams.set('cursor', cursor);
              const r = await fetch(u, { headers: auth });
              if (!r.ok) throw new Error(`LIST lesson keys failed HTTP ${r.status}`);
              const body = await r.json();
              if (!body?.success || !Array.isArray(body?.result)) throw new Error('LIST lesson keys returned unexpected payload');
              for (const item of body.result) if (item?.name) names.push(item.name);
              cursor = String(body?.result_info?.cursor || '');
            } while (cursor);
            return names;
          }

          function hasExpectedDisplayId(r) {
            const vals = Object.values(r?.displayIds || {});
            return vals.includes(LEVEL_DISPLAY_ID) || vals.includes(YEAR_DISPLAY_ID);
          }

          function guardLesson(r) {
            if (r?.subject !== 'maths' || r?.active !== true) throw new Error('Y4/L1 T2M14 state mismatch');
            if (!hasExpectedDisplayId(r)) throw new Error(`Display ID mismatch for ${r?.lessonId}`);
            const title = String(r?.title || '').toLowerCase();
            if (!title.includes('perimeter')) throw new Error(`Perimeter title guard failed: ${r?.title}`);
            if (!r?.core || !Object.prototype.hasOwnProperty.call(r.core, 'video')) throw new Error('Perimeter core.video missing');
          }

          (async () => {
            const lessonKeys = await listLessonKeys();
            if (!lessonKeys.length) throw new Error('No lesson keys found in production LESSONS_KV');

            const matches = [];
            for (const key of lessonKeys) {
              const rec = await getJson(key);
              if (hasExpectedDisplayId(rec)) matches.push({ key, rec });
            }
            if (matches.length !== 1) {
              console.log('MATCH_DEBUG=' + JSON.stringify(matches.map(x => ({ key: x.key, lessonId: x.rec?.lessonId, title: x.rec?.title, displayIds: x.rec?.displayIds }))));
              throw new Error(`Expected exactly one Y4/L1 T2M14 lesson; found ${matches.length}`);
            }

            const lessonKey = matches[0].key;
            const before = matches[0].rec;
            guardLesson(before);

            const next = JSON.parse(JSON.stringify(before));
            next.description = description;
            next.core.video = video(TARGET);
            next.contentStatus = {
              ...(next.contentStatus || {}),
              description: 'available',
              mainVideo: 'available',
              ownerConfirmedPending: false
            };

            await putJson(lessonKey, next);

            let verified;
            for (let attempt = 1; attempt <= 6; attempt++) {
              verified = await getJson(lessonKey);
              const ok = verified?.core?.video?.screenpal === TARGET &&
                verified?.description === description &&
                verified?.contentStatus?.description === 'available' &&
                verified?.contentStatus?.mainVideo === 'available' &&
                verified?.contentStatus?.ownerConfirmedPending === false;
              if (ok) break;
              if (attempt < 6) await sleep(2000);
            }

            guardLesson(verified);
            if (verified?.core?.video?.screenpal !== TARGET) throw new Error('Perimeter ScreenPal verification failed');
            if (verified?.description !== description) throw new Error('Perimeter description verification failed');
            if (verified?.contentStatus?.description !== 'available' || verified?.contentStatus?.mainVideo !== 'available' || verified?.contentStatus?.ownerConfirmedPending !== false) {
              throw new Error('Perimeter content status verification failed');
            }

            console.log('Y4_L1_T2M14_VERIFIED=' + JSON.stringify({
              lessonKey,
              lessonId: verified.lessonId,
              levelDisplayId: verified?.displayIds?.['maths-level1'] || null,
              yearDisplayId: verified?.displayIds?.['maths-year4'] || null,
              title: verified.title,
              screenpal: verified.core.video.screenpal,
              contentStatus: verified.contentStatus
            }));
            console.log('OPS_UPDATE_Y4_L1_T2M14_PERIMETER_PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
