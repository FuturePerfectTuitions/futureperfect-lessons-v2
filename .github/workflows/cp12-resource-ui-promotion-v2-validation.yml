name: CP12 resource UI promotion v2 validation

on:
  push:
    branches: [fix/cp12-resource-collapsible-ui-2026-09-14]
    paths: ['.github/workflows/cp12-resource-ui-promotion-v2-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
      EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
      CP12_METADATA_ACTION: preview
      CP12_METADATA_BACKUP: /tmp/cp12-resource-ui-validation-backup.json
      CP12_METADATA_REPORT: /tmp/cp12-resource-ui-validation-report.json
      OFFICIAL_CP12_SHA: 766e9dd099edfc4bfed429ca7de1aa97ac7e4509
      METADATA_COMMIT: 9793028e34b16972defa64d3e465db907868e645
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate product source helper and promotion safety structure
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse origin/rebuild/checkpoint12-stabilisation-2026-09-14)" = "$OFFICIAL_CP12_SHA"
          git merge-base --is-ancestor "$METADATA_COMMIT" HEAD
          for path in rebuild/adminops/src/lib/compiler.mjs rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/student/src/lib/runtime.mjs; do
            test "$(git rev-parse "${METADATA_COMMIT}:${path}")" = "$(git hash-object "${path}")"
          done
          node --check scripts/cp12-resource-ui-production-metadata.mjs
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/cp12-resource-ui-production-promote-v2.yml').read_text()
          required=['versions upload','@0%','Automatic full rollback on any post-metadata failure','CP12_METADATA_ACTION: rollback','browserToAdminOps:false','PREFLIGHT_RUN_ID']
          for token in required:
              if token not in text: raise SystemExit(f'missing promotion safeguard: {token}')
          for line in text.splitlines():
              s=line.strip()
              if 'wrangler@"$WRANGLER_VERSION" deploy ' in s and '--dry-run' not in s:
                  raise SystemExit(f'direct wrangler deploy found: {s}')
          print('CP12_RESOURCE_UI_PROMOTION_STRUCTURE_PASS')
          PY
      - name: Re-run metadata helper in read-only preview mode against published production pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cp12-resource-ui-production-metadata.mjs
          jq -e '.marker=="CP12_RESOURCE_UI_METADATA_PREVIEW_PASS" and .status=="PASS" and .writes==false and .publishedLessonScopes==372 and .changedLessonScopes==369 and .unchangedLessonScopes==3 and .totalResources==1509 and .coreResources==984 and .elevenPlusResources==212 and .vrResources==313 and .nonPresentationGroupDiffs==0' "$CP12_METADATA_REPORT" >/dev/null
          echo CP12_RESOURCE_UI_PROMOTION_V2_VALIDATION_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: cp12-resource-ui-promotion-v2-validation
          path: |
            /tmp/cp12-resource-ui-validation-report.json
            /tmp/cp12-resource-ui-validation-backup.json
          if-no-files-found: error
          retention-days: 30
