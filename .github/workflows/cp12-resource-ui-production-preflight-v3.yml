name: CP12 resource UI production preflight v3

on:
  push:
    branches: [fix/cp12-resource-collapsible-ui-2026-09-14]
    paths: ['.github/workflows/cp12-resource-ui-production-preflight-v3.yml']

permissions:
  contents: read

concurrency:
  group: cp12-resource-ui-production-preflight-v3
  cancel-in-progress: false

env:
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_DB: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev
  EXPECTED_STUDENT_VERSION: bed8e660-facb-47f3-afad-7a9996d95c5a
  EXPECTED_STUDENT_ROLLBACK: 0751feed-5aa3-40fb-854f-5847c8603872
  METADATA_COMMIT: 9793028e34b16972defa64d3e465db907868e645
  CANDIDATE_FRONTEND_SHA: 2337732822b82bb8b782b57aaa512b8b0c973f82

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact backend metadata source and regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$METADATA_COMMIT" HEAD
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          echo CP12_RESOURCE_UI_SOURCE_GATE_PASS

      - name: Checkout exact staging-proven frontend
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.CANDIDATE_FRONTEND_SHA }}
          path: candidate-frontend
          persist-credentials: false

      - name: Build exact frontend candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate-frontend rev-parse HEAD)" = "$CANDIDATE_FRONTEND_SHA"
          cd candidate-frontend
          npm install --no-audit --no-fund
          npm run test:static
          node tests/cp12-collapsible-resource-sections-static.mjs
          npm run build
          grep -R -F 'Verbal Reasoning' dist >/dev/null
          grep -R -F 'data-resource-toggle' dist >/dev/null
          ! grep -R -F 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev' dist

      - name: Fresh production topology versions and binding baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}" "${AUTH[@]}" -o /tmp/zones.json
          ZONE_ID="$(jq -r '.result[]|select(.name=="futureperfect.education")|.id' /tmp/zones.json | head -n1)"; test -n "$ZONE_ID"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes.json >/dev/null
          for worker in "$LEGACY_WORKER" "$BROWSER_WORKER" "$STUDENT_WORKER"; do
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/settings" "${AUTH[@]}" -o "/tmp/${worker}-settings.json"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/${worker}-deployments.json"
          done
          jq -e --arg student "$STUDENT_WORKER" '.success==true and ([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .type=="service" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' "/tmp/${BROWSER_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_READ_MODELS_KV" 'any(.result.bindings[];.name=="READ_MODELS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_STUDENTS_KV" 'any(.result.bindings[];.name=="STUDENTS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_DB" 'any(.result.bindings[];.name=="DB" and (.database_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg bucket "$EXPECTED_R2" 'any(.result.bindings[];.name=="MATERIALS_R2" and (.bucket_name//.bucket)==$bucket)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${STUDENT_WORKER}-deployments.json" | head -n1)"
          test "$ACTIVE" = "$EXPECTED_STUDENT_VERSION"
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions.json
          jq -e --arg v "$EXPECTED_STUDENT_ROLLBACK" 'any(.result.items[];.id==$v)' /tmp/student-versions.json >/dev/null
          BROWSER_ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${BROWSER_WORKER}-deployments.json" | head -n1)"; test -n "$BROWSER_ACTIVE"
          LEGACY_ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${LEGACY_WORKER}-deployments.json" | head -n1)"; test -n "$LEGACY_ACTIVE"
          echo "$BROWSER_ACTIVE" >/tmp/browser-before-version
          echo "$LEGACY_ACTIVE" >/tmp/legacy-version
          jq '[.result.bindings[]|if ((.type//"")|test("secret";"i")) then {name,type} else . end]|sort_by(.name)' "/tmp/${STUDENT_WORKER}-settings.json" >/tmp/student-binding-signature.json
          jq '[.result.bindings[]]|sort_by(.name)' "/tmp/${BROWSER_WORKER}-settings.json" >/tmp/browser-binding-signature.json
          echo CP12_RESOURCE_UI_TOPOLOGY_PREFLIGHT_PASS

      - name: Prove published prepared lesson migration is presentation-metadata-only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim();
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID), token=clean(process.env.CLOUDFLARE_API_TOKEN);
          const lessons=clean(process.env.EXPECTED_LESSONS_KV), read=clean(process.env.EXPECTED_READ_MODELS_KV);
          const api=`https://api.cloudflare.com/client/v4/accounts/${account}`, headers={Authorization:`Bearer ${token}`};
          async function req(path){const r=await fetch(api+path,{headers});const text=await r.text();return{r,text};}
          async function kvText(ns,key){const o=await req(`/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(o.r.status===404)return null;if(!o.r.ok)throw new Error(`KV read ${o.r.status}:${key}`);return o.text;}
          async function kvJson(ns,key){const t=await kvText(ns,key);if(t==null)return null;return JSON.parse(t);}
          async function list(ns,prefix){let cursor='',out=[];do{const q=new URLSearchParams({prefix,limit:'1000'});if(cursor)q.set('cursor',cursor);const r=await fetch(`${api}/storage/kv/namespaces/${ns}/keys?${q}`,{headers});const b=await r.json();if(!r.ok||b.success!==true)throw new Error(`KV list failed:${prefix}`);out.push(...(b.result||[]).map(x=>clean(x.name)).filter(Boolean));cursor=clean(b.result_info?.cursor);}while(cursor);return out;}
          function stripGroups(value){
            if(Array.isArray(value)) return value.map(stripGroups);
            if(value&&typeof value==='object') return Object.fromEntries(Object.entries(value).filter(([k])=>k!=='presentationGroup').map(([k,v])=>[k,stripGroups(v)]));
            return value;
          }
          const allowed=new Set(['core-prelesson','core-homework','core-other','core-cumulative','core-answers','elevenplus-prelesson','elevenplus-homework','elevenplus-cumulative','elevenplus-answers','vr-prelesson','vr-homework','vr-answers']);
          const pointerKeys=(await list(read,'rm:v1:scope:lesson_3A')).filter(k=>k.endsWith(':current')).sort();
          if(pointerKeys.length<250) throw new Error(`Unexpected published lesson pointer count:${pointerKeys.length}`);
          const published=[];
          for(const pointerKey of pointerKeys){
            const pointer=await kvJson(read,pointerKey);
            const scope=clean(pointer?.scope);
            if(!scope.startsWith('lesson:')||!pointer?.current?.version) throw new Error(`Invalid lesson pointer:${pointerKey}`);
            published.push({pointerKey,pointer,scope,lessonId:scope.slice(7)});
          }
          const uniqueScopes=new Set(published.map(x=>x.scope));
          if(uniqueScopes.size!==published.length) throw new Error('Duplicate published lesson scope pointers');
          let changed=0, unchanged=0, resources=0, grouped=0, vr=0, eleven=0, core=0;
          const groupCounts={};
          for(const item of published){
            const record=await kvJson(lessons,`lesson:${item.lessonId}`);
            if(!record?.lessonId || clean(record.lessonId)!==item.lessonId) throw new Error(`Missing source for published scope:${item.scope}`);
            const candidate=await compileLessonDetail(record,{resourceExists:async()=>true});
            const env=await kvJson(read,versionKey(item.scope,item.pointer.current.version));
            if(!env?.payload) throw new Error(`Missing current envelope:${item.scope}`);
            const current=env.payload;
            if(stableStringify(stripGroups(current))!==stableStringify(stripGroups(candidate))) throw new Error(`Non-presentationGroup drift:${item.scope}`);
            if(stableStringify(current)!==stableStringify(candidate)) changed++; else unchanged++;
            for(const r of candidate.resources||[]){
              resources++;
              const g=clean(r.presentationGroup);
              if(!g||!allowed.has(g)) throw new Error(`Missing/unknown presentationGroup:${item.scope}:${clean(r.objectKey)}:${g}`);
              grouped++; groupCounts[g]=(groupCounts[g]||0)+1;
              if(g.startsWith('vr-'))vr++; else if(g.startsWith('elevenplus-'))eleven++; else if(g.startsWith('core-'))core++;
            }
          }
          const sourceKeys=(await list(lessons,'lesson:')).filter(k=>/^lesson:[A-Za-z0-9]+$/.test(k));
          const unpublishedSources=sourceKeys.filter(k=>!uniqueScopes.has(k)).length;
          if(resources!==grouped) throw new Error('Not every prepared resource is grouped');
          if(changed===0) throw new Error('No published prepared lesson requires metadata migration');
          if(vr===0||eleven===0||core===0) throw new Error(`Expected all resource families vr=${vr} eleven=${eleven} core=${core}`);
          const report={marker:'CP12_RESOURCE_UI_PREPARED_METADATA_ONLY_PASS',status:'PASS',publishedLessonScopes:published.length,changedLessonScopes:changed,unchangedLessonScopes:unchanged,sourceLessonRecords:sourceKeys.length,unpublishedSourceRecords:unpublishedSources,totalResources:resources,groupedResources:grouped,coreResources:core,elevenPlusResources:eleven,vrResources:vr,groupCounts,nonMetadataDiffs:0,writes:false};
          fs.writeFileSync('/tmp/cp12-resource-ui-prepared-preflight.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE

      - name: Assemble safe preflight evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg marker CP12_RESOURCE_UI_PRODUCTION_PREFLIGHT_V3_PASS --arg student "$EXPECTED_STUDENT_VERSION" --arg rollback "$EXPECTED_STUDENT_ROLLBACK" --arg browser "$(cat /tmp/browser-before-version)" --arg legacy "$(cat /tmp/legacy-version)" --slurpfile prepared /tmp/cp12-resource-ui-prepared-preflight.json '{marker:$marker,status:"PASS",readOnly:true,studentVersion:$student,studentRollbackRetained:$rollback,browserVersion:$browser,legacyVersion:$legacy,canonicalTopology:true,browserToAdminOps:false,prepared:$prepared[0],frontendSha:env.CANDIDATE_FRONTEND_SHA,metadataCommit:env.METADATA_COMMIT}' >/tmp/cp12-resource-ui-production-preflight-v3.json
          cat /tmp/cp12-resource-ui-production-preflight-v3.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-resource-ui-production-preflight-v3
          path: |
            /tmp/cp12-resource-ui-production-preflight-v3.json
            /tmp/cp12-resource-ui-prepared-preflight.json
            /tmp/student-binding-signature.json
            /tmp/browser-binding-signature.json
          if-no-files-found: error
          retention-days: 30
