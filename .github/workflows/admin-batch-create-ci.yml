name: Admin batch creation verification

on:
  push:
    branches:
      - feat/admin-create-batch-2026-09-25
    paths:
      - 'admin-import.html'
      - 'assets/admin-create-batch.js'
      - 'worker/src/admin-student-manager.js'
      - 'tests/admin-student-manager-verification.mjs'
      - '.github/workflows/admin-batch-create-ci.yml'
  pull_request:
    paths:
      - 'admin-import.html'
      - 'assets/admin-create-batch.js'
      - 'worker/src/admin-student-manager.js'
      - 'tests/admin-student-manager-verification.mjs'
      - '.github/workflows/admin-batch-create-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -Eeuo pipefail
          node --check assets/admin-create-batch.js
          node --check worker/src/admin-student-manager.js
          node --check tests/admin-student-manager-verification.mjs
      - name: Admin student and batch verification
        run: |
          set -Eeuo pipefail
          node tests/admin-student-manager-verification.mjs
