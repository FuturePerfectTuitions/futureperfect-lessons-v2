name: Secure Portal V2 production provisioning

# One-shot guarded production activation. Sensitive student values remain encrypted
# in source control and are decrypted only inside the authorised Actions runner.
# Preserves the existing non-student admin KV record while the production Worker
# explicitly allowlists only the 13 authorised student usernames.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prod-secure-provision.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  provision-production:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' && github.event.head_commit.message == 'Run secure production provisioning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical navigation manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs >/tmp/fpt-prod-navigation.json
          jq -e '.lessons==369 and .curricula==11' /tmp/fpt-prod-navigation.json >/dev/null
      - name: Decrypt and validate secure payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/prod-secure-decrypt.mjs
          test "$(jq 'length' /tmp/fpt-provision-bulk.json)" = '13'
      - name: Guard, provision and productionise V2
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare's settings API can show the new deployment slightly before
          # every workers.dev edge serves it. Make the functional acceptance retry
          # only that transient FORBIDDEN_ORIGIN response; all other 403s still fail.
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('scripts/prod-secure-apply.mjs', 'utf8');
          const needle = "    if (response.status !== 401) throw new Error(`Unexpected login status ${response.status} for ${id}`);\n    await sleep(5000);";
          const replacement = "    if (response.status === 403) {\n      const transient = await response.json().catch(() => null);\n      if (transient?.error === 'FORBIDDEN_ORIGIN') { await sleep(5000); continue; }\n    }\n    if (response.status !== 401) throw new Error(`Unexpected login status ${response.status} for ${id}`);\n    await sleep(5000);";
          if (!source.includes(needle)) throw new Error('Propagation retry patch target not found');
          fs.writeFileSync('/tmp/prod-secure-apply.mjs', source.replace(needle, replacement), { mode: 0o600 });
          NODE
          node /tmp/prod-secure-apply.mjs
