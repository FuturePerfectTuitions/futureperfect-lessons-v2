name: Temporary Aar1811 v3 live preflight

on:
  push:
    branches:
      - fix/aar1811-l3-quiz-preserve-history-2026-09-28
    paths:
      - 'ops/_temp_aar1811_v3_live_preflight.mjs'
      - '.github/workflows/_temp_aar1811_v3_live_preflight.yml'
      - 'worker/src/access-read-model-sync-v3.js'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile target from current production sources read-only
        run: |
          set -euo pipefail
          node --check ops/_temp_aar1811_v3_live_preflight.mjs
          node ops/_temp_aar1811_v3_live_preflight.mjs
      - name: Confirm preflight has no mutation methods
        run: |
          set -euo pipefail
          ! grep -E "method:'(PUT|DELETE|PATCH)'|/execute|wrangler.*deploy" ops/_temp_aar1811_v3_live_preflight.mjs
          echo TEMP_AAR1811_V3_LIVE_PREFLIGHT_READONLY_PASS
