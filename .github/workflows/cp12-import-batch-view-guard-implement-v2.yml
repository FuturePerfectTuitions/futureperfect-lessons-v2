name: CP12 implement ambiguous batch import guard v2

on:
  push:
    branches: [fix/cp12-import-batch-view-guard-2026-09-14]
    paths: ['.github/workflows/cp12-import-batch-view-guard-implement-v2.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cp12-import-batch-view-guard-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply smallest importer guard and regression coverage
        shell: bash
        env:
          PATCH_B64: " xT0UnLCB7CiAgICAgICAgYmF0Y2hfa2V5OidZNTE xT0UnLCBzdWJqZWN0OidlbmdsaXNoJywgc2Nob29sX3llYXI6NSwKICAgICAgICBzdHJlYW06JzExcGx1cycsIG1hdGhzX2xldmVsOm51bGwsIGFjdGl2ZV9mcm9tOicyMDI2LTA5LTAxJywgYWN0aXZlX3RvOm51bGwKICAgICAgfV0KICAgIF0pOwogIH0KIiIiLnJlcGxhY2UoJ1kgNTE  xT0VfTkVXX05PVF9JTl9EMSciLCJNb2RlOidZNTE "
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/cp12-import-guard.py
          python3 /tmp/cp12-import-guard.py
          node --check worker/src/admin-lesson-release-import.js
          node tests/admin-lesson-release-import-verification.mjs
          git diff --check
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/admin-lesson-release-import.js tests/admin-lesson-release-import-verification.mjs
          git commit -m 'CP12: reject undefined batch for ambiguous lesson views'
          git push origin HEAD:fix/cp12-import-batch-view-guard-2026-09-14
