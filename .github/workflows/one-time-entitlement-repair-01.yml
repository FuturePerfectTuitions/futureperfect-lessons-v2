name: One-time entitlement repair 01

on:
  push:
    branches: [ops/entitlement-repair-01]
    paths:
      - '.github/workflows/one-time-entitlement-repair-01.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      TARGET_NAME_SHA256: 70c64570680ddcef112f9cd6bfe44f671b40fa653beacc67ab2832792b42934d

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production Worker and resolve Students KV
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"
          echo "Production Students KV resolved."

      - name: Locate exactly one target profile without exposing identity
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix "user:" --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          target = os.environ['TARGET_NAME_SHA256']
          matches = []
          for item in json.load(open('/tmp/keys.json', encoding='utf-8')):
              key = str(item.get('name') or '')
              if not key.startswith('user:'):
                  continue
              p = subprocess.run(
                  ['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True
              )
              if p.returncode != 0:
                  continue
              try:
                  user = json.loads(p.stdout)
              except Exception:
                  continue
              name = str(user.get('name') or '').strip().lower()
              parts = name.split()
              first_token = parts[0] if parts else ''
              digest = hashlib.sha256(first_token.encode('utf-8')).hexdigest()
              if digest == target:
                  matches.append((key, user))
          if len(matches) != 1:
              print(f'TARGET_MATCH_COUNT={len(matches)}')
              sys.exit(2)
          key, user = matches[0]
          with open('/tmp/target-key','w',encoding='utf-8') as fh:
              fh.write(key)
          with open('/tmp/user-before.json','w',encoding='utf-8') as fh:
              json.dump(user, fh, ensure_ascii=False, separators=(',',':'))
          print('TARGET_MATCH_COUNT=1')
          print('CURRENT_FULL_LIBRARY_COUNT=' + str(len(user.get('fullLibraries') if isinstance(user.get('fullLibraries'), list) else [])))
          PY

      - name: Set exact Full Library entitlement from master
        shell: bash
        run: |
          set -euo pipefail
          jq '
            .fullLibraries = [
              "MATHS_Y3_FULL",
              "ENGLISH_Y3_FULL",
              "MATHS_L1_FULL",
              "ENGLISH_Y4_11PLUS_FULL",
              "MATHS_L2_FULL",
              "ENGLISH_Y5_11PLUS_FULL"
            ]
          ' /tmp/user-before.json > /tmp/user-after.json

          jq -S 'del(.fullLibraries)' /tmp/user-before.json > /tmp/before-other.json
          jq -S 'del(.fullLibraries)' /tmp/user-after.json > /tmp/after-other.json
          cmp /tmp/before-other.json /tmp/after-other.json

          jq -e '
            ((.fullLibraries // []) | sort) == ([
              "MATHS_Y3_FULL",
              "ENGLISH_Y3_FULL",
              "MATHS_L1_FULL",
              "ENGLISH_Y4_11PLUS_FULL",
              "MATHS_L2_FULL",
              "ENGLISH_Y5_11PLUS_FULL"
            ] | sort)
          ' /tmp/user-after.json >/dev/null
          echo 'LOCAL_PATCH_VERIFIED=true'

      - name: Persist only the target profile
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key', encoding='utf-8').read().strip(), safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/user-after.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}" \
            > /tmp/put.json
          jq -e '.success == true' /tmp/put.json >/dev/null
          echo 'PATCH_APPLIED=true'

      - name: Verify persisted record and no unrelated field changes
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key', encoding='utf-8').read().strip(), safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/user-verify.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}"

          jq -e '
            ((.fullLibraries // []) | sort) == ([
              "MATHS_Y3_FULL",
              "ENGLISH_Y3_FULL",
              "MATHS_L1_FULL",
              "ENGLISH_Y4_11PLUS_FULL",
              "MATHS_L2_FULL",
              "ENGLISH_Y5_11PLUS_FULL"
            ] | sort)
          ' /tmp/user-verify.json >/dev/null

          jq -S 'del(.fullLibraries)' /tmp/user-before.json > /tmp/before-other.json
          jq -S 'del(.fullLibraries)' /tmp/user-verify.json > /tmp/verify-other.json
          cmp /tmp/before-other.json /tmp/verify-other.json
          echo 'PERSISTED_EXACT_FULL_LIBRARIES=true'
          echo 'UNRELATED_FIELDS_UNCHANGED=true'
