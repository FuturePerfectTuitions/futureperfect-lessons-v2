name: Ops replace L3T2M24 Linear Sequences video

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-replace-l3t2m24-linear-sequences-video.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard production target, replace L3T2M24 video and description, and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_KV_ID;
          const valuesBase = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
          const keysBase = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/keys`;
          const auth = { Authorization: `Bearer ${token}` };

          const LEVEL_DISPLAY_ID = 'L3T2M24';
          const YEAR_DISPLAY_ID = 'Y6T2M24';
          const TARGET = 'cOQvDXnxxvX';
          const description = [
            'In this 11+ L3 Maths lesson, students develop a detailed understanding of sequences, with a strong focus on linear sequences, term-to-term rules, missing terms and nth-term formulae.',
            '',
            'This lesson includes:',
            '✔ Identifying and continuing sequences that increase or decrease by a constant amount',
            '✔ Finding term-to-term rules using addition and subtraction, including whole numbers, decimals and fractions',
            '✔ Extending sequences and filling missing terms accurately',
            '✔ Finding the common difference when known terms are not adjacent',
            '✔ Using the total change and number of equal steps to recover missing terms',
            '✔ Working backwards in a sequence by applying the inverse operation',
            '✔ Recognising and extending growing patterns made from shapes',
            '✔ Using sequence formulae such as 2n + 1, n - 3 and 6n - 5 to calculate specific terms',
            '✔ Deriving an nth-term formula from a linear sequence using the common difference and adjustment',
            '✔ Calculating later terms such as the 10th, 20th and other specified positions efficiently',
            '✔ Comparing linear sequences with other patterns, including divide-by-10, doubling, Fibonacci-style and square-number sequences',
            '✔ Applying sequence reasoning to grid-square totals and red/white tile patterns',
            '',
            'The lesson begins with term-to-term rules, where students identify how a sequence changes from one term to the next and use that rule to extend sequences or fill gaps. It then develops into problems where the first and last known terms are separated by missing values, requiring students to calculate the overall change and divide it equally across the steps.',
            '',
            'Students then explore growing shape patterns and move from term-to-term reasoning to position-to-term reasoning. They substitute values into nth-term formulae, derive formulae from linear sequences, and use those formulae to calculate terms much further along a sequence.',
            '',
            'The final section broadens the lesson to other sequence types and visual patterns, including repeated multiplication or division, Fibonacci-style rules, square numbers, totals of squares in grids, and tile-pattern formulae.',
            '',
            'By the end of the lesson, learners will be able to identify, extend and analyse linear sequences, find missing terms, derive and use nth-term formulae, and apply sequence reasoning to both numerical and visual patterns.'
          ].join('\n');

          function video(code) {
            return {
              screenpal: code,
              contentUrl: `https://screenpal.com/content/video/${code}`,
              embedUrl: `https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,
              watchUrl: `https://go.screenpal.com/watch/${code}`
            };
          }

          async function getJson(key) {
            const r = await fetch(valuesBase + encodeURIComponent(key), { headers: auth });
            if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
            const text = await r.text();
            try { return JSON.parse(text); } catch { throw new Error(`${key} is not valid JSON`); }
          }

          async function putJson(key, value) {
            const r = await fetch(valuesBase + encodeURIComponent(key), {
              method: 'PUT',
              headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(value)
            });
            if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
          }

          async function listLessonKeys() {
            const names = [];
            let cursor = '';
            do {
              const u = new URL(keysBase);
              u.searchParams.set('prefix', 'lesson:');
              u.searchParams.set('limit', '1000');
              if (cursor) u.searchParams.set('cursor', cursor);
              const r = await fetch(u, { headers: auth });
              if (!r.ok) throw new Error(`LIST lesson keys failed HTTP ${r.status}`);
              const body = await r.json();
              if (!body?.success || !Array.isArray(body?.result)) throw new Error('LIST lesson keys returned unexpected payload');
              for (const item of body.result) if (item?.name) names.push(item.name);
              cursor = String(body?.result_info?.cursor || '');
            } while (cursor);
            return names;
          }

          function hasExpectedDisplayId(r) {
            const vals = Object.values(r?.displayIds || {});
            return vals.includes(LEVEL_DISPLAY_ID) || vals.includes(YEAR_DISPLAY_ID);
          }

          function guardLesson(r) {
            if (r?.subject !== 'maths' || r?.active !== true) throw new Error('L3/Y6 T2M24 state mismatch');
            if (!hasExpectedDisplayId(r)) throw new Error(`Display ID mismatch for ${r?.lessonId}`);
            const title = String(r?.title || '').toLowerCase();
            if (!(title.includes('linear') && title.includes('sequence'))) {
              throw new Error(`Linear Sequences title guard failed: ${r?.title}`);
            }
            if (!r?.core || !Object.prototype.hasOwnProperty.call(r.core, 'video')) throw new Error('Linear Sequences core.video missing');
          }

          (async () => {
            const lessonKeys = await listLessonKeys();
            if (!lessonKeys.length) throw new Error('No lesson keys found in production LESSONS_KV');

            const matches = [];
            const batchSize = 25;
            for (let i = 0; i < lessonKeys.length; i += batchSize) {
              const batch = lessonKeys.slice(i, i + batchSize);
              const records = await Promise.all(batch.map(async key => ({ key, rec: await getJson(key) })));
              for (const item of records) if (hasExpectedDisplayId(item.rec)) matches.push(item);
            }
            if (matches.length !== 1) {
              console.log('MATCH_DEBUG=' + JSON.stringify(matches.map(x => ({ key: x.key, lessonId: x.rec?.lessonId, title: x.rec?.title, displayIds: x.rec?.displayIds }))));
              throw new Error(`Expected exactly one L3/Y6 T2M24 lesson; found ${matches.length}`);
            }

            const lessonKey = matches[0].key;
            const before = matches[0].rec;
            guardLesson(before);
            console.log('BEFORE=' + JSON.stringify({lessonKey, lessonId: before.lessonId, displayIds: before.displayIds, title: before.title, screenpal: before?.core?.video?.screenpal || null}));

            const next = JSON.parse(JSON.stringify(before));
            next.description = description;
            next.core.video = video(TARGET);
            next.contentStatus = {
              ...(next.contentStatus || {}),
              description: 'available',
              mainVideo: 'available',
              ownerConfirmedPending: false
            };

            await putJson(lessonKey, next);

            let verified;
            for (let attempt = 1; attempt <= 6; attempt++) {
              verified = await getJson(lessonKey);
              const ok = verified?.core?.video?.screenpal === TARGET &&
                verified?.description === description &&
                verified?.contentStatus?.description === 'available' &&
                verified?.contentStatus?.mainVideo === 'available' &&
                verified?.contentStatus?.ownerConfirmedPending === false;
              if (ok) break;
              if (attempt < 6) await sleep(2000);
            }

            guardLesson(verified);
            if (verified?.core?.video?.screenpal !== TARGET) throw new Error('Linear Sequences ScreenPal verification failed');
            if (verified?.description !== description) throw new Error('Linear Sequences description verification failed');
            if (verified?.contentStatus?.description !== 'available' || verified?.contentStatus?.mainVideo !== 'available' || verified?.contentStatus?.ownerConfirmedPending !== false) {
              throw new Error('Linear Sequences content status verification failed');
            }

            console.log('L3_T2M24_LINEAR_SEQUENCES_VERIFIED=' + JSON.stringify({
              lessonKey,
              lessonId: verified.lessonId,
              levelDisplayId: verified?.displayIds?.['maths-level3'] || null,
              yearDisplayId: verified?.displayIds?.['maths-year6'] || null,
              title: verified.title,
              screenpal: verified.core.video.screenpal,
              contentStatus: verified.contentStatus
            }));
            console.log('OPS_REPLACE_L3T2M24_LINEAR_SEQUENCES_PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
