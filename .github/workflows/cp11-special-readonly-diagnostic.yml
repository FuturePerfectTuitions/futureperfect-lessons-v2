name: CP11 Special Area Read-Only Diagnostic

on:
  push:
    branches:
      - rebuild/cp11-special-readonly-diagnostic-2026-09-14
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  CHECKPOINT8_AS_OF_DATE: '2026-09-14'

jobs:
  current-special-area-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm current production special-area usage read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          OUT="$(node scripts/rebuild-checkpoint8-special-area-audit.mjs)"
          printf '%s\n' "$OUT" | tee /tmp/cp11-special-area-diagnostic.json
          printf '%s\n' "$OUT" | jq -e '.status=="PASS" and .mismatchCount==0' >/dev/null
          COUNT="$(printf '%s\n' "$OUT" | jq -r '.profilesWithSpecialAreas')"
          echo "CURRENT_SPECIAL_AREA_PROFILE_COUNT=${COUNT}"
          test "$COUNT" = '0'
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp11-special-area-readonly-diagnostic
          path: /tmp/cp11-special-area-diagnostic.json
          if-no-files-found: ignore
          retention-days: 30
