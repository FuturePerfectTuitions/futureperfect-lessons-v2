name: CP12 VR full catalogue production preview

on:
  push:
    branches: [ops/reina-entitlement]
    paths: ['.github/workflows/ops-cp12-vr-full-catalogue-production-preview.yml']

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER: fpt-portal-v2-worker
      EXPECTED_LESSONS_KV_ID: 49619b1a24b244bc8aaa6223fcd24e80
      EXPECTED_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 766e9dd099edfc4bfed429ca7de1aa97ac7e4509
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare every live prepared lesson against corrected compiler
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, pointerKey, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim();
          const token=clean(process.env.CLOUDFLARE_API_TOKEN), account=clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const legacy=clean(process.env.LEGACY_WORKER), expectedLessons=clean(process.env.EXPECTED_LESSONS_KV_ID), rm=clean(process.env.EXPECTED_READ_MODELS_KV_ID);
          const base='https://api.cloudflare.com/client/v4', auth={Authorization:`Bearer ${token}`};
          async function request(path){const r=await fetch(`${base}${path}`,{headers:auth});const text=await r.text();let body=null;try{body=JSON.parse(text);}catch{}return{r,text,body};}
          async function cf(path){const o=await request(path);if(!o.r.ok||o.body?.success!==true)throw new Error(`CF_READ_FAILED:${o.r.status}:${path}`);return o.body.result;}
          async function kvText(ns,key){const o=await request(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(o.r.status===404)return null;if(!o.r.ok)throw new Error(`KV_READ_FAILED:${o.r.status}:${key}`);return o.text;}
          async function kvJson(ns,key){const t=await kvText(ns,key);return t==null?null:JSON.parse(t);}
          const settings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(legacy)}/settings`), bindings=settings?.bindings||[];
          const lessonsNs=clean(bindings.find(b=>clean(b.name)==='LESSONS_KV')?.namespace_id);
          if(lessonsNs!==expectedLessons)throw new Error(`LESSONS_KV_DRIFT:${lessonsNs}`);
          if(!bindings.some(b=>clean(b.namespace_id)===rm))throw new Error('READ_MODEL_KV_NOT_RETAINED');
          const curriculumCodes=['MATHS_Y2','MATHS_Y3','MATHS_L1','MATHS_L2','MATHS_L3','MATHS_Y6_EXTRA','ENGLISH_Y2','ENGLISH_Y3','ENGLISH_Y4','ENGLISH_Y5','ENGLISH_Y6'];
          const ids=new Set();
          for(const code of curriculumCodes){const raw=await kvJson(lessonsNs,`curriculum:${code}`);for(const item of (Array.isArray(raw)?raw:(raw?.lessonIds||raw?.lessons||raw?.items||[]))){const id=typeof item==='string'?clean(item):clean(item?.lessonId);if(id)ids.add(id);}}
          if(ids.size!==372)throw new Error(`LESSON_COUNT_DRIFT:${ids.size}`);
          const changed=[], unchanged=[];
          const strip=p=>({schemaVersion:p?.schemaVersion,kind:p?.kind,lessonId:p?.lessonId,title:p?.title,description:p?.description,videoVariants:p?.videoVariants||null});
          for(const id of [...ids].sort()){
            const source=await kvJson(lessonsNs,`lesson:${id}`);if(!source)throw new Error(`SOURCE_LESSON_MISSING:${id}`);
            const candidate=await compileLessonDetail(source,{resourceExists:async()=>true});
            const ptr=await kvJson(rm,pointerKey(`lesson:${id}`));const ver=clean(ptr?.current?.version);if(!ver)throw new Error(`PREPARED_POINTER_MISSING:${id}`);
            const env=await kvJson(rm,versionKey(`lesson:${id}`,ver));const current=env?.payload;if(current?.kind!=='prepared-lesson-detail')throw new Error(`PREPARED_PAYLOAD_INVALID:${id}`);
            if(stableStringify(current)===stableStringify(candidate)){unchanged.push(id);continue;}
            if(stableStringify(strip(current))!==stableStringify(strip(candidate)))throw new Error(`NON_RESOURCE_FIELD_DRIFT:${id}`);
            const curBy=new Map((current.resources||[]).map(r=>[clean(r.objectKey),r]));const canBy=new Map((candidate.resources||[]).map(r=>[clean(r.objectKey),r]));
            const removed=[...curBy.keys()].filter(k=>!canBy.has(k));if(removed.length)throw new Error(`RESOURCE_REMOVAL_FORBIDDEN:${id}:${removed.join(',')}`);
            const modified=[];for(const [key,row] of curBy){if(stableStringify(row)!==stableStringify(canBy.get(key)))modified.push(key);}if(modified.length)throw new Error(`EXISTING_RESOURCE_MUTATION_FORBIDDEN:${id}:${modified.join(',')}`);
            const added=[...canBy.entries()].filter(([k])=>!curBy.has(k)).map(([,r])=>r);
            if(!added.length)throw new Error(`UNCLASSIFIED_LESSON_DIFF:${id}`);
            for(const r of added){if(JSON.stringify(r.presentationScopes)!==JSON.stringify(['vr']))throw new Error(`NON_VR_ADDITION_FORBIDDEN:${id}:${r.objectKey}`);if(r.type==='answer-pack'&&r.protected!==true)throw new Error(`UNPROTECTED_VR_ANSWER:${id}:${r.objectKey}`);}
            changed.push({lessonId:id,currentVersion:ver,addedCount:added.length,addedTypes:added.map(r=>r.type).sort()});
          }
          const y4=changed.filter(x=>/^Y4E/.test(x.lessonId)).length, y5=changed.filter(x=>/^Y5E/.test(x.lessonId)).length;
          console.log(JSON.stringify({marker:'CP12_VR_FULL_CATALOGUE_PREVIEW_PASS',lessonCount:ids.size,unchangedCount:unchanged.length,changedCount:changed.length,changedY4:y4,changedY5:y5,totalAddedResources:changed.reduce((n,x)=>n+x.addedCount,0),changedLessonIds:changed.map(x=>x.lessonId),onlyVrAdditions:true,noExistingResourceMutation:true,noResourceRemoval:true}));
          NODE
