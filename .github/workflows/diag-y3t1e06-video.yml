name: Diagnose Y4T2E11 video state

on:
  push:
    branches: [main]
    paths:
      - '.github/diag-y3t1e06-video.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  LEGACY_WORKER: fpt-portal-v2-worker
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod

jobs:
  inspect:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect canonical and prepared video state
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${LEGACY_WORKER}/settings" > /tmp/legacy.json
          curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${STUDENT_WORKER}/settings" > /tmp/student.json
          LESSONS_NS="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/legacy.json)"
          READ_NS="$(jq -r '.result.bindings[]? | select(.name=="READ_MODELS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/student.json)"
          export LESSONS_NS READ_NS
          node --input-type=module <<'NODE'
          const clean=v=>String(v??'').trim();
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const auth={Authorization:`Bearer ${token}`};
          const base=ns=>`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}`;
          async function get(ns,key){const r=await fetch(`${base(ns)}/values/${encodeURIComponent(key)}`,{headers:auth}); if(!r.ok) throw new Error(`GET ${key} ${r.status}`); return JSON.parse(await r.text());}
          async function list(ns,prefix){const out=[];let cursor='';do{const u=new URL(`${base(ns)}/keys`);u.searchParams.set('prefix',prefix);u.searchParams.set('limit','1000');if(cursor)u.searchParams.set('cursor',cursor);const r=await fetch(u,{headers:auth});const b=await r.json();for(const x of b.result||[])out.push(x.name);cursor=clean(b?.result_info?.cursor);}while(cursor);return out;}
          function enc(scope){return encodeURIComponent(scope).replace(/%/g,'_');}
          const keys=await list(process.env.LESSONS_NS,'lesson:');
          const found=[];
          for(let i=0;i<keys.length;i+=30){const batch=keys.slice(i,i+30);const rows=await Promise.all(batch.map(async key=>({key,rec:await get(process.env.LESSONS_NS,key)})));for(const row of rows)if(Object.values(row.rec?.displayIds||{}).includes('Y4T2E11'))found.push(row);}
          if(found.length!==1) throw new Error('match count '+found.length);
          const {key,rec}=found[0];
          console.log('CANONICAL_SUMMARY='+JSON.stringify({key,lessonId:rec.lessonId,title:rec.title,subject:rec.subject,displayIds:rec.displayIds,topKeys:Object.keys(rec),coreKeys:Object.keys(rec.core||{}),video:rec.video||null,coreVideo:rec?.core?.video||null,contentStatus:rec.contentStatus||null,description:rec.description||null}));
          const scope='lesson:'+rec.lessonId;
          const pointer=await get(process.env.READ_NS,`rm:v1:scope:${enc(scope)}:current`);
          const ver=pointer.current.version;
          const env=await get(process.env.READ_NS,`rm:v1:scope:${enc(scope)}:version:${enc(ver)}`);
          console.log('PREPARED_SUMMARY='+JSON.stringify({scope,version:ver,payloadKeys:Object.keys(env.payload||{}),payload:env.payload}));
          const globalScope='global';
          const globalPointer=await get(process.env.READ_NS,`rm:v1:scope:${enc(globalScope)}:current`);
          const globalVer=globalPointer.current.version;
          const globalEnv=await get(process.env.READ_NS,`rm:v1:scope:${enc(globalScope)}:version:${enc(globalVer)}`);
          const viewId=Object.entries(rec.displayIds||{}).find(([,v])=>v==='Y4T2E11')?.[0]||null;
          const catRows=Array.isArray(globalEnv?.payload?.catalogues?.[viewId]?.lessons)?globalEnv.payload.catalogues[viewId].lessons:[];
          const catMatch=catRows.filter(r=>clean(r?.lessonId)===clean(rec.lessonId)||clean(r?.displayLessonId)==='Y4T2E11');
          console.log('GLOBAL_SUMMARY='+JSON.stringify({version:globalVer,viewId,lessonToViews:globalEnv?.payload?.lessonToViews?.[rec.lessonId]||null,catalogueMatches:catMatch}));
          const allMappedViewRows=Object.fromEntries((globalEnv?.payload?.lessonToViews?.[rec.lessonId]||[]).map(view=>
            [view,(globalEnv?.payload?.catalogues?.[view]?.lessons||[]).filter(r=>clean(r?.lessonId)===clean(rec.lessonId)||clean(r?.displayLessonId)==='Y4T2E11'||clean(r?.displayLessonId)==='Y4T2EE11').map(r=>({lessonId:r.lessonId,displayLessonId:r.displayLessonId,title:r.title,description:r.description}))]));
          console.log('ALL_MAPPED_VIEW_ROWS='+JSON.stringify(allMappedViewRows));

          const globalVersionKeys=(await list(process.env.READ_NS,`rm:v1:scope:${enc('global')}:version:`)).filter(k=>k.includes('video-desc-y4t2e11'));
          const globalCandidateDetails=await Promise.all(globalVersionKeys.map(async k=>{
            try{
              const env=await get(process.env.READ_NS,k);
              const rows=env?.payload?.catalogues?.[viewId]?.lessons||[];
              const matching=rows.filter(r=>clean(r?.lessonId)===clean(rec.lessonId)||clean(r?.displayLessonId)==='Y4T2E11');
              return {key:k,kind:env?.kind,scope:env?.scope,version:env?.version,sha256:env?.sha256,matchingRows:matching.map(r=>({lessonId:r.lessonId,displayLessonId:r.displayLessonId,description:r.description})),payloadKeys:Object.keys(env?.payload||{})};
            }catch(e){return {key:k,error:String(e)};}
          }));
          console.log('GLOBAL_CANDIDATES='+JSON.stringify({count:globalVersionKeys.length,details:globalCandidateDetails}));
          const crypto=await import('node:crypto');
          const stableValue=value=>{
            if(Array.isArray(value)) return value.map(stableValue);
            if(!value||typeof value!=='object') return value;
            const out={}; for(const key of Object.keys(value).sort()) out[key]=stableValue(value[key]); return out;
          };
          const stableStringify=value=>JSON.stringify(stableValue(value));
          const rawChecks=await Promise.all(globalVersionKeys.map(async k=>{
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${process.env.READ_NS}/values/${encodeURIComponent(k)}`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
            const raw=await response.text();
            let env=null; try{env=JSON.parse(raw);}catch{}
            const hash=value=>crypto.createHash('sha256').update(String(value)).digest('hex');
            const payloadHash=env?hash(stableStringify(env.payload)):null;
            const rawHash=hash(raw);
            const stableEnvelopeHash=env?hash(stableStringify(env)):null;
            return {key:k,status:response.status,rawLength:raw.length,rawPrefix:raw.slice(0,30),rawSuffix:raw.slice(-30),version:env?.version,scope:env?.scope,kind:env?.kind,storedPayloadHash:env?.sha256,computedPayloadHash:payloadHash,payloadHashMatches:payloadHash===env?.sha256,rawHash,stableEnvelopeHash,rawEqualsStableEnvelope:raw===stableStringify(env)};
          }));
          console.log('GLOBAL_RAW_HASH_CHECKS='+JSON.stringify(rawChecks));



          NODE
