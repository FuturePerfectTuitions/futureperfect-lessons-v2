name: Phase 10 history navigation static verification

on:
  pull_request:
    branches: [main]
    paths:
      - phase10.html
      - assets/phase10-history.js
      - worker/src/index-phase10-history.js
      - worker/wrangler.toml
      - worker/fixtures/phase10/user-test0707.json
      - worker/fixtures/phase10/lesson-DEV-HISTORY-*.json
      - worker/fixtures/phase10/curriculum-*.json
      - tests/phase10-history-*.sh
      - tests/phase10-history-*.mjs
      - .github/workflows/phase10-history-*.yml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate history navigation correction
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase10-history.js
          node --check assets/phase10-history.js
          node --check tests/phase10-history-browser-verification.mjs
          bash -n tests/phase10-history-api-verification.sh
          grep -Fq 'assets/phase10-history.js' phase10.html
          grep -Eq '^main = "src/(index-phase10-history|index-phase12)\.js"$' worker/wrangler.toml
          grep -Fq 'test0707' worker/wrangler.toml
          for f in worker/fixtures/phase10/user-test0707.json worker/fixtures/phase10/lesson-DEV-HISTORY-*.json worker/fixtures/phase10/curriculum-*.json; do jq -e . "$f" >/dev/null; done
          jq -e '.batches == ["Y5MDEVHIST","Y5EDEVHIST"] and .schoolYear == 5' worker/fixtures/phase10/user-test0707.json >/dev/null
          echo 'Phase 10 history navigation static verification: PASS'
