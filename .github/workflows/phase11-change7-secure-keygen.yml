name: Phase 11 Change 7 secure transfer keygen

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase11-change7-secure-keygen.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  keygen:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase11-change7-secure-transfer-keygen' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Guard keygen-only branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '${{ github.event.pull_request.base.sha }}'
          test "$(git diff --name-only '${{ github.event.pull_request.base.sha }}'..HEAD)" = '.github/workflows/phase11-change7-secure-keygen.yml'
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate one-time certificate and token-encrypted private key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/change7-keygen
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/change7-keygen/private.pem
          openssl req -new -x509 -sha256 -key /tmp/change7-keygen/private.pem \
            -subj '/CN=FPT Phase11 Change7 One-Time Transfer' -days 1 \
            -out /tmp/change7-keygen/cert.pem
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in /tmp/change7-keygen/private.pem \
            -out /tmp/change7-keygen/private.pem.enc
          rm -f /tmp/change7-keygen/private.pem
          sha256sum /tmp/change7-keygen/cert.pem /tmp/change7-keygen/private.pem.enc > /tmp/change7-keygen/SHA256SUMS.txt
          openssl x509 -in /tmp/change7-keygen/cert.pem -noout -subject -fingerprint -sha256
          echo 'One-time secure transfer key material generated. Private key is stored only encrypted under the existing Cloudflare secret.'

      - name: Upload one-time encrypted key material
        uses: actions/upload-artifact@v4
        with:
          name: phase11-change7-secure-key-material
          path: /tmp/change7-keygen/
          if-no-files-found: error
          retention-days: 1

      - name: Confirm no Cloudflare mutation
        run: echo 'Keygen only - no R2, KV, D1, or Worker mutation executed.'
