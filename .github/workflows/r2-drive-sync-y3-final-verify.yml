name: R2 Drive sync Y3 final read-only verify

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y3
    paths:
      - .github/workflows/r2-drive-sync-y3-final-verify.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  verify-year3:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Year 3 reconciliation branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet google-auth requests

      - name: Final read-only exact key, size and SHA-256 audit
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_verify_y3_final.py

      - name: Upload final Year 3 read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y3-final-read-only-byte-hash-audit
          path: y3-final-read-only-byte-hash-audit.json
          if-no-files-found: warn
          retention-days: 30
