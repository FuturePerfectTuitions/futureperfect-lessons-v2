name: Abigail one-time entitlement audit

on:
  push:
    branches: [ops/abigail-entitlement-fix]
    paths:
      - '.github/workflows/abigail-one-time-entitlement-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      D1_NAME: fpt_portal_v2_db
      TARGET_ID_SHA256: 4e80df5d8d5d1dfa83017f3bf2071c15fd696e03055d6c0bc394248288e4749a

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production Worker and resolve Students KV
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_GUARD=true'

      - name: Read sanitized KV entitlement state
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix 'user:' --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          target = os.environ['TARGET_ID_SHA256']
          matches=[]
          for item in json.load(open('/tmp/keys.json',encoding='utf-8')):
              key=str(item.get('name') or '')
              if not key.startswith('user:'): continue
              suffix=key[5:].strip().lower()
              if hashlib.sha256(suffix.encode()).hexdigest()!=target: continue
              p=subprocess.run(['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
              if p.returncode: continue
              try: user=json.loads(p.stdout)
              except Exception: continue
              matches.append((key,user))
          if len(matches)!=1:
              print(f'TARGET_MATCH_COUNT={len(matches)}')
              sys.exit(2)
          key,user=matches[0]
          open('/tmp/target-id','w').write(key[5:].strip().lower())
          libs=sorted(str(x).strip().upper() for x in (user.get('fullLibraries') if isinstance(user.get('fullLibraries'),list) else []))
          wanted=['ENGLISH_Y3_FULL']
          trials=[str(x).strip().lower() for x in (user.get('trialViews') if isinstance(user.get('trialViews'),list) else [])]
          batches=[str(x).strip().upper() for x in (user.get('batches') if isinstance(user.get('batches'),list) else [])]
          maths_batches=[x for x in batches if x.startswith('Y') and ('M' in x or '11' in x and not 'E11' in x)]
          y4e_batches=[x for x in batches if x in ('Y4E','Y4EO')]
          print('TARGET_MATCH_COUNT=1')
          print('FULL_LIBRARY_EXACT=' + str(libs==wanted).lower())
          print('FULL_LIBRARY_COUNT=' + str(len(libs)))
          print('TRIAL_VIEW_COUNT=' + str(len(trials)))
          print('LEGACY_MATHS_BATCH_COUNT=' + str(len(maths_batches)))
          print('LEGACY_Y4_ENGLISH_BATCH_COUNT=' + str(len(y4e_batches)))
          PY

      - name: Read sanitized D1 entitlement state
        shell: bash
        run: |
          set -euo pipefail
          ID="$(cat /tmp/target-id)"
          case "$ID" in *[!a-z0-9_-]*|'') exit 2;; esac
          TODAY='2026-09-08'
          npx --yes wrangler@latest d1 execute "$D1_NAME" --remote --json --command "
            SELECT COUNT(*) AS c FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm='$ID' AND b.subject='english' AND b.school_year=4 AND b.stream='normal' AND a.effective_from<='$TODAY' AND (a.effective_to IS NULL OR '$TODAY'<a.effective_to) AND (b.active_from IS NULL OR b.active_from<='$TODAY') AND (b.active_to IS NULL OR '$TODAY'<b.active_to);
            SELECT COUNT(*) AS c FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm='$ID' AND b.subject='maths' AND a.effective_from<='$TODAY' AND (a.effective_to IS NULL OR '$TODAY'<a.effective_to) AND (b.active_from IS NULL OR b.active_from<='$TODAY') AND (b.active_to IS NULL OR '$TODAY'<b.active_to);
            SELECT COUNT(*) AS c FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code WHERE e.portal_user_id_norm='$ID' AND e.core_access=1 AND b.subject='english' AND b.school_year=4 AND b.stream='normal';
            SELECT COUNT(*) AS c FROM online_prelesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.batch_key WHERE e.portal_user_id_norm='$ID' AND b.subject='english' AND b.school_year=4 AND b.stream='normal';
            SELECT COUNT(*) AS c FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code WHERE e.portal_user_id_norm='$ID' AND e.core_access=1 AND b.subject='maths';
            SELECT COUNT(*) AS c FROM online_prelesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.batch_key WHERE e.portal_user_id_norm='$ID' AND b.subject='maths';
          " > /tmp/d1.json 2>/dev/null
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const sets=Array.isArray(raw)?raw:[raw];
          const vals=[];
          for(const set of sets){const rows=set?.results||set?.result?.results||[]; if(rows[0]) vals.push(Number(rows[0].c||0));}
          const names=['CURRENT_Y4_ENGLISH_ASSIGNMENTS','CURRENT_MATHS_ASSIGNMENTS','Y4_ENGLISH_FULL_RELEASES','Y4_ENGLISH_PRELESSON_RELEASES','MATHS_FULL_RELEASES','MATHS_PRELESSON_RELEASES'];
          names.forEach((n,i)=>console.log(`${n}=${vals[i]??'unknown'}`));
          NODE
