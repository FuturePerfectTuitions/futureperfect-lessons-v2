name: Y4T1E01 lesson-shape read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/y4t1e01-shape-audit.yml

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Compare Y4E1 with neighbouring live English lesson records
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          test -n "$ns"; test "$ns" != null
          echo "LESSONS_KV=${ns}"

          for lesson in Y4E1 Y4E2 Y4E3 Y4E4; do
            enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "lesson:${lesson}")"
            status="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o "/tmp/${lesson}.json" -w '%{http_code}' "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}")"
            echo "=== ${lesson} HTTP ${status} ==="
            if [ "$status" != 200 ]; then continue; fi
            jq '{lessonId,title,displayIds,topLevelPreLessonSheets:.preLessonSheets,corePreLessonSheets:.core.preLessonSheets,phase11CorePreLessonPairs:.phase11Resources.core.preLessonPairs,phase11ElevenPreLessonPairs:.phase11Resources.elevenPlus.preLessonPairs}' "/tmp/${lesson}.json"
            echo '-- all JSON paths containing prelesson --'
            jq -r 'paths as $p | select(($p|map(tostring)|join("."))|ascii_downcase|contains("prelesson")) | ($p|map(tostring)|join("."))' "/tmp/${lesson}.json" | sort -u
          done

          echo 'READ_ONLY_SHAPE_AUDIT_COMPLETE=true'
