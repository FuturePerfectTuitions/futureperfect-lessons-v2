name: R2 Drive sync Y2 diagnostic

on:
  push:
    branches:
      - ops/r2-drive-sync-y2
    paths:
      - .github/workflows/r2-drive-sync-y2-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download and verify authoritative Y2T1E01 Drive file
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          FILE_ID="1nZ_cL_qPT5ECetDf9yr3XZpGhOYPky5c"
          EXPECTED_SIZE="64208"
          EXPECTED_SHA256="018221642603f3c602747209a4804cf529ba0369c565c1caf3439e76d583b5b7"
          OUTPUT_FILE="Y2T1E01-answer-pack.pdf"

          test -n "$ACCESS_TOKEN"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/${FILE_ID}?alt=media&supportsAllDrives=true" \
            -o "$OUTPUT_FILE"

          ACTUAL_SIZE="$(stat -c%s "$OUTPUT_FILE")"
          ACTUAL_SHA256="$(sha256sum "$OUTPUT_FILE" | awk '{print $1}')"
          ACTUAL_MIME="$(file -b --mime-type "$OUTPUT_FILE")"

          echo "Drive file ID: $FILE_ID"
          echo "MIME: $ACTUAL_MIME"
          echo "Size: $ACTUAL_SIZE"
          echo "SHA256: $ACTUAL_SHA256"

          test "$ACTUAL_MIME" = "application/pdf"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

          echo "Y2T1E01_DRIVE_EXACT_BYTE_VERIFICATION_PASS"
