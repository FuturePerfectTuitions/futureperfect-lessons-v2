name: R2 Drive sync Y2 diagnostic

on:
  push:
    branches:
      - ops/r2-drive-sync-y2
    paths:
      - .github/workflows/r2-drive-sync-y2-diagnostic.yml
      - .github/r2-drive-sync-y2-trigger.txt

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Search entire R2 bucket for Y2T1E01 PPTX candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          bucket=os.environ['R2_BUCKET']
          target_size=17100963
          target_hash='f9dc5f5a627749426c785a806210ceeb7bc57d47da7780423f9de74b3185df1a'
          cursor=None; total=0; candidates=[]
          while True:
              q={'per_page':'1000'}
              if cursor: q['cursor']=cursor
              url=f'https://api.cloudflare.com/client/v4/accounts/{acct}/r2/buckets/{bucket}/objects?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req) as r: data=json.load(r)
              if not data.get('success'): raise SystemExit(data)
              result=data.get('result') or []
              total += len(result)
              for o in result:
                  key=o.get('key') or ''
                  size=o.get('size')
                  if 'Y2T1E01' in key or size == target_size:
                      candidates.append((key,size,o.get('etag')))
              info=data.get('result_info') or {}
              cursor=info.get('cursor') if info.get('is_truncated') else None
              if not cursor: break
          print('R2_BUCKET_OBJECT_COUNT',total)
          print('R2_CANDIDATE_COUNT',len(candidates))
          for key,size,etag in candidates:
              print('R2_CANDIDATE',key,size,etag)
              encoded=urllib.parse.quote(key,safe='/')
              url=f'https://api.cloudflare.com/client/v4/accounts/{acct}/r2/buckets/{bucket}/objects/{encoded}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req) as r: body=r.read()
              digest=hashlib.sha256(body).hexdigest()
              print('R2_CANDIDATE_SHA256',key,'size='+str(len(body)),'sha256='+digest,'MATCH='+str(digest==target_hash))
          PY

      - name: Diagnostic pass
        run: echo 'Y2_R2_BUCKET_SEARCH_PASS'
