name: R2 Drive sync Y2 diagnostic

on:
  push:
    branches:
      - ops/r2-drive-sync-y2
    paths:
      - .github/workflows/r2-drive-sync-y2-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Google auth library
        run: python3 -m pip install --quiet google-auth requests

      - name: Download and verify authoritative Y2T1E01 Drive file
        shell: bash
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          file_id = '1nZ_cL_qPT5ECetDf9yr3XZpGhOYPky5c'
          expected_size = 64208
          expected_sha256 = '018221642603f3c602747209a4804cf529ba0369c565c1caf3439e76d583b5b7'

          info = json.loads(os.environ['GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/drive.readonly'],
          )
          session = AuthorizedSession(creds)
          url = f'https://www.googleapis.com/drive/v3/files/{file_id}?alt=media&supportsAllDrives=true'
          response = session.get(url, timeout=120)
          response.raise_for_status()
          body = response.content

          actual_size = len(body)
          actual_sha256 = hashlib.sha256(body).hexdigest()
          is_pdf = body.startswith(b'%PDF-')

          print('Drive file ID:', file_id)
          print('PDF signature:', is_pdf)
          print('Size:', actual_size)
          print('SHA256:', actual_sha256)

          assert is_pdf, 'Downloaded bytes are not a PDF'
          assert actual_size == expected_size, f'Size mismatch: {actual_size} != {expected_size}'
          assert actual_sha256 == expected_sha256, f'SHA256 mismatch: {actual_sha256} != {expected_sha256}'
          print('Y2T1E01_DRIVE_EXACT_BYTE_VERIFICATION_PASS')
          PY

# trigger direct Drive auth test
