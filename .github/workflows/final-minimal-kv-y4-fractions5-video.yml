name: Final minimal KV - Year 4 Fractions 5 video

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-kv-y4-fractions5-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply current Fractions 5 video and verify Fractions 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          s=requests.get(f'{api}/accounts/{acct}/workers/scripts/fpt-portal-v2-worker/settings',headers=auth,timeout=60).json(); assert s.get('success')
          b=s['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); bucket=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert bucket=='fpt-materials-dev'; assert ns
          base=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def url(k): return base+urllib.parse.quote(k,safe='')
          def get(k):
            r=requests.get(url(k),headers=auth,timeout=60); r.raise_for_status(); return r.json()
          def put(k,v):
            r=requests.put(url(k),headers={**auth,'Content-Type':'application/json'},data=json.dumps(v,separators=(',',':')).encode(),timeout=60); r.raise_for_status(); p=r.json(); assert p.get('success'),p
          rec=get('lesson:Y4M22'); assert rec.get('title')=='Fractions 5'; assert (rec.get('displayIds') or {}).get('maths-level1')=='L1T2M19'; assert (rec.get('displayIds') or {}).get('maths-year4')=='Y4T2M19'
          before=json.loads(json.dumps((rec.get('core') or {}).get('video')))
          vid='cOV0oyn36Sg'; v=rec.setdefault('core',{}).setdefault('video',{})
          v['screenpal']=vid; v['contentUrl']=f'https://screenpal.com/content/video/{vid}'; v['embedUrl']=f'https://go.screenpal.com/player/{vid}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent'; v['watchUrl']=f'https://go.screenpal.com/watch/{vid}'
          # Do not retain the superseded presentation-specific copy from the old Fractions numbering.
          v.pop('elevenPlus',None); v.pop('elevenplus',None)
          for k in list(v):
            if k=='quiz' or k.lower().startswith('quiz'): v.pop(k,None)
          put('lesson:Y4M22',rec); after=get('lesson:Y4M22'); av=(after.get('core') or {}).get('video') or {}; assert av.get('screenpal')==vid
          f6=get('lesson:Y4M23'); assert f6.get('title')=='Fractions 6'; f6v=(f6.get('core') or {}).get('video') or {}; assert f6v.get('screenpal')=='cOVO15n3ovI',(f6.get('title'),f6v)
          json.dump({'environment':env,'fractions5Before':before,'fractions5After':av,'fractions6Verified':f6v.get('screenpal')},open('y4-fractions5-video-evidence.json','w'),indent=2)
          print('Y4_FRACTIONS5_VIDEO_PASS',vid,'FRACTIONS6',f6v.get('screenpal'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y4-fractions5-video-evidence
          path: y4-fractions5-video-evidence.json
          retention-days: 30
