name: Abigail Year 3 English access repair

on:
  push:
    branches: [ops/abigail-y3-access]
    paths:
      - '.github/workflows/abigail-y3-access-repair.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0
  PORTAL_USER_ID_NORM: abi3007
  USER_KEY: user:abi3007

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production Worker and resolve bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ALLOWED_ORIGINS" and .type=="plain_text" and (.text | contains("https://lessons.futureperfect.education")))' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"

      - name: Read and diagnose Abigail record
        id: diagnose
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('user:abi3007', safe=''))
          PY
          )"
          HTTP="$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/user-before.json \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}")"
          test "$HTTP" = "200"
          jq -e 'type == "object"' /tmp/user-before.json >/dev/null

          HAS_ENGLISH_Y3="$(jq -r '[.fullLibraries[]? | ascii_upcase] | index("ENGLISH_Y3_FULL") != null' /tmp/user-before.json)"
          HAS_ANY_MATHS_LIBRARY="$(jq -r '[.fullLibraries[]? | ascii_upcase | startswith("MATHS_")] | any' /tmp/user-before.json)"
          HAS_LEGACY_Y3E="$(jq -r '[.batches[]? | ascii_upcase | test("^Y3EO?$")] | any' /tmp/user-before.json)"
          HAS_LEGACY_Y3M="$(jq -r '[.batches[]? | ascii_upcase | test("^Y3MO?$")] | any' /tmp/user-before.json)"
          HAS_MATHS_TRIAL="$(jq -r '[.trialViews[]? | ascii_downcase | startswith("maths-")] | any' /tmp/user-before.json)"
          LIBRARY_COUNT="$(jq -r '(.fullLibraries // []) | length' /tmp/user-before.json)"

          echo "user_exists=true"
          echo "has_english_y3_full=$HAS_ENGLISH_Y3"
          echo "has_any_maths_full_library=$HAS_ANY_MATHS_LIBRARY"
          echo "has_legacy_y3_english_batch=$HAS_LEGACY_Y3E"
          echo "has_legacy_y3_maths_batch=$HAS_LEGACY_Y3M"
          echo "has_maths_trial_view=$HAS_MATHS_TRIAL"
          echo "full_library_count=$LIBRARY_COUNT"
          echo "has_english_y3=$HAS_ENGLISH_Y3" >> "$GITHUB_OUTPUT"

      - name: Diagnose D1 navigation sources
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --json --command "
            SELECT COUNT(*) AS y3e_assignments
              FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key
             WHERE a.portal_user_id_norm='abi3007' AND lower(b.subject)='english' AND b.school_year=3;
            SELECT COUNT(*) AS maths_assignments
              FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key
             WHERE a.portal_user_id_norm='abi3007' AND lower(b.subject)='maths';
            SELECT COUNT(*) AS y3e_full_releases
              FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code
             WHERE e.portal_user_id_norm='abi3007' AND e.core_access=1 AND lower(b.subject)='english' AND b.school_year=3;
            SELECT COUNT(*) AS maths_full_releases
              FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code
             WHERE e.portal_user_id_norm='abi3007' AND e.core_access=1 AND lower(b.subject)='maths';
            SELECT COUNT(*) AS maths_prelesson_releases
              FROM online_prelesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.batch_key
             WHERE e.portal_user_id_norm='abi3007' AND lower(b.subject)='maths';
          " > /tmp/d1.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const sets = Array.isArray(raw) ? raw : [raw];
          const vals = [];
          for (const set of sets) {
            const rows = set?.results || set?.result?.results || [];
            if (rows[0]) vals.push(Object.values(rows[0])[0]);
          }
          const names = ['y3e_assignments','maths_assignments','y3e_full_releases','maths_full_releases','maths_prelesson_releases'];
          names.forEach((name, i) => console.log(`${name}=${vals[i] ?? 'unknown'}`));
          NODE

      - name: Add Full Year 3 English library entitlement only
        if: steps.diagnose.outputs.has_english_y3 != 'true'
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          jq '
            .fullLibraries = reduce (((.fullLibraries // []) + ["ENGLISH_Y3_FULL"])[]) as $x
              ([]; if index($x) then . else . + [$x] end)
          ' /tmp/user-before.json > /tmp/user-after.json

          jq -S 'del(.fullLibraries)' /tmp/user-before.json > /tmp/before-other.json
          jq -S 'del(.fullLibraries)' /tmp/user-after.json > /tmp/after-other.json
          cmp /tmp/before-other.json /tmp/after-other.json
          jq -e '[.fullLibraries[]? | ascii_upcase] | index("ENGLISH_Y3_FULL") != null' /tmp/user-after.json >/dev/null

          ENCODED_KEY="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('user:abi3007', safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/user-after.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}" \
            >/tmp/put.json
          jq -e '.success == true' /tmp/put.json >/dev/null
          echo 'PATCH_APPLIED=true'

      - name: Verify persisted access record
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('user:abi3007', safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}" \
            --output /tmp/user-verified.json
          jq -e '[.fullLibraries[]? | ascii_upcase] | index("ENGLISH_Y3_FULL") != null' /tmp/user-verified.json >/dev/null
          echo 'ENGLISH_Y3_FULL_VERIFIED=true'

      - name: Verify source upsell rule is still active
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'english-year3':'maths-year3'" worker/src/index-phase20-change17.js
          grep -Fq "targetSubject.views.push(previewSummary(counterpart, membership))" worker/src/index-phase20-change17.js
          echo 'MATHS_YEAR3_UPSELL_RULE_VERIFIED=true'
