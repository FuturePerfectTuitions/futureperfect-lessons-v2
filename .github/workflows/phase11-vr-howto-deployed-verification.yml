name: Phase 11 VR How To deployed verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/phase11-vr-howto-verify-trigger.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify deployed VR How To after guarded deploy
        shell: bash
        run: |
          set -euo pipefail
          bash tests/phase11-vr-howto-deployed-verification.sh
