name: Phase 11 Change 4 guarded apply now

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase11-change4-apply-now.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  WORKER_NAME: fpt-portal-v2-worker
  BUCKET: fpt-materials-dev
  SHARED_KEY: maths/level2/Y5M1/homework/answers/L2T1M01 Answer Pack Homework Number and Place Value I.pdf
  YEAR5_KEY: phase11/view-overrides/maths-year5/Y5M1/homework/answers/Y5T1M01 Answer Pack Homework Number and Place Value I.pdf
  SHARED_SHA256: e1b900264b562abfe561a0cd8149ccce991f69876f02690f6def9a6f535277e5

jobs:
  apply:
    if: github.head_ref == 'ops/phase11-change4-apply-now'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact apply branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard one-file operational PR
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '${{ github.event.pull_request.base.sha }}'
          test "$(git diff --name-only '${{ github.event.pull_request.base.sha }}'..HEAD)" = '.github/workflows/phase11-change4-apply-now.yml'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify source implementation and canonical package
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/phase11-year5-answer-pdf.js
          node --check worker/src/index-phase11-change4.js
          node tests/phase11-year5-answer-pdf-static-verification.mjs
          python -m py_compile scripts/phase11-build-year5-answer-pdf.py
          bash -n tests/phase11-api-verification.sh
          node --check tests/phase11-browser-verification.mjs
          rm -rf /tmp/p11-package
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/p11-package >/tmp/p11-package.log
          jq -e '.phase==11 and .catalogueLessons==369 and .catalogueCurricula==11 and .lessonsKvWrites==380 and .r2References==1669 and .developmentAllowlistCount==16' /tmp/p11-package/phase11-apply-summary.json >/dev/null

      - name: Guard V2 development environment
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.compatibility_date == "2026-08-20"' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)"
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings.json)"
          ALLOWLIST="$(jq -r '.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text' /tmp/settings.json)"
          TARGET_ALLOWLIST="$(cat /tmp/p11-package/phase11-dev-allowlist.txt)"
          LOGIN_ENABLED="$(jq -r '[.result.bindings[] | select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text") | .text][0] // ""' /tmp/settings.json)"
          test "$R2" = "$BUCKET"
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done
          test "$ALLOWLIST" = "$TARGET_ALLOWLIST"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login is enabled; refusing.' >&2; exit 1;; esac
          { echo "students=$STUDENTS"; echo "lessons=$LESSONS"; echo "r2=$R2"; echo "db=$DB"; echo "allowlist=$ALLOWLIST"; } >> "$GITHUB_OUTPUT"

      - name: Snapshot exact shared PDF and existing Year 5 override
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/change4-backup
          npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${BUCKET}/${SHARED_KEY}" --file=/tmp/change4-backup/shared.pdf --remote >/tmp/shared-get.log
          test "$(sha256sum /tmp/change4-backup/shared.pdf | awk '{print $1}')" = "$SHARED_SHA256"
          if npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${BUCKET}/${YEAR5_KEY}" --file=/tmp/change4-backup/year5-before.pdf --remote >/tmp/target-get.log 2>&1; then
            echo 'target_existed=true' >> "$GITHUB_OUTPUT"
          else
            rm -f /tmp/change4-backup/year5-before.pdf
            echo 'target_existed=false' >> "$GITHUB_OUTPUT"
          fi
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change4-backup/worker-before.bin
          for marker in student_session_profiles X-FPT-Students-KV-Read-Ops VR_HOWTO; do grep -aFq "$marker" /tmp/change4-backup/worker-before.bin; done

      - name: Upload rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase11-change4-prewrite-snapshot
          path: /tmp/change4-backup/
          if-no-files-found: error
          retention-days: 30

      - name: Build corrected Year 5 PDF
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyMuPDF==1.26.7'
          python scripts/phase11-build-year5-answer-pdf.py /tmp/change4-backup/shared.pdf /tmp/year5-corrected.pdf | tee /tmp/change4-build.log
          python - <<'PY'
          import fitz
          d=fitz.open('/tmp/year5-corrected.pdf')
          text='\n'.join(p.get_text('text') for p in d)
          assert d.page_count == 3
          assert text.count('Y5T1M01') == 6
          assert 'L2T1M01' not in text
          print('Corrected Year 5 PDF content: PASS')
          PY

      - name: Write isolated Year 5 R2 override
        id: r2write
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} r2 object put "${BUCKET}/${YEAR5_KEY}" --file=/tmp/year5-corrected.pdf --content-type=application/pdf --remote >/tmp/r2-put.log
          npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${BUCKET}/${YEAR5_KEY}" --file=/tmp/year5-after.pdf --remote >/tmp/r2-after.log
          test "$(sha256sum /tmp/year5-after.pdf | awk '{print $1}')" = "$(sha256sum /tmp/year5-corrected.pdf | awk '{print $1}')"

      - name: Build V2 development Worker config
        shell: bash
        env:
          STUDENTS: ${{ steps.guard.outputs.students }}
          LESSONS: ${{ steps.guard.outputs.lessons }}
          R2: ${{ steps.guard.outputs.r2 }}
          DB: ${{ steps.guard.outputs.db }}
          ALLOWLIST: ${{ steps.guard.outputs.allowlist }}
        run: |
          set -euo pipefail
          cat >worker/wrangler.change4.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase11-change4.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "${ALLOWLIST}"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.change4.toml --dry-run --outdir /tmp/change4-build >/tmp/change4-dry.log
          grep -R -aFq 'phase11/view-overrides/maths-year5/Y5M1' /tmp/change4-build
          grep -R -aFq 'X-FPT-Students-KV-Read-Ops' /tmp/change4-build

      - name: Deploy Change 4 Worker to V2 development
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.change4.toml --keep-vars --message 'Phase 11 Change 4 Year 5 PDF identity' >/tmp/change4-deploy.log

      - name: Run full deployed API acceptance
        shell: bash
        run: bash tests/phase11-api-verification.sh

      - name: Prove Year 5 and Level 2 PDF content separately
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://futureperfecttuitions.github.io'
          mkdir -p /tmp/proof
          get_pdf(){
            user="$1"; view="$2"; outfile="$3"
            jar="/tmp/proof/${user}.cookies"
            curl --fail-with-body --silent --show-error --cookie-jar "$jar" --header "Origin: $ORIGIN" --header 'Content-Type: application/json' --request POST --data "{\"username\":\"$user\",\"password\":\"Te12\"}" "$BASE/api/v1/student/auth/login" >/tmp/proof/login.json
            curl --fail-with-body --silent --show-error --cookie "$jar" --cookie-jar "$jar" --header "Origin: $ORIGIN" "$BASE/api/v1/student/lessons/Y5M1?viewId=$view" >/tmp/proof/detail.json
            key="$(jq -r '.lesson.homeworks[0].answerPack.resourceKey' /tmp/proof/detail.json)"
            curl --fail-with-body --silent --show-error --cookie "$jar" --cookie-jar "$jar" --header "Origin: $ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"password":"Te12"}' "$BASE/api/v1/student/resources/$key/answer/authorize?viewId=$view" >/tmp/proof/auth.json
            path="$(jq -r '.viewerPath' /tmp/proof/auth.json)"
            curl --fail-with-body --silent --show-error --cookie "$jar" --cookie-jar "$jar" --header "Origin: $ORIGIN" "$BASE$path" --output "$outfile"
          }
          get_pdf testy5em maths-year5 /tmp/proof/year5.pdf
          get_pdf testy411m maths-level2 /tmp/proof/level2.pdf
          python - <<'PY'
          import fitz
          checks=[('/tmp/proof/year5.pdf','Y5T1M01','L2T1M01'),('/tmp/proof/level2.pdf','L2T1M01','Y5T1M01')]
          for path, wanted, forbidden in checks:
              d=fitz.open(path); text='\n'.join(p.get_text('text') for p in d)
              assert d.page_count == 3
              assert text.count(wanted) == 6, (path,wanted,text.count(wanted))
              assert forbidden not in text, (path,forbidden)
              print(path, wanted, 'PASS')
          PY
          test "$(sha256sum /tmp/proof/year5.pdf | awk '{print $1}')" = "$(sha256sum /tmp/year5-after.pdf | awk '{print $1}')"
          test "$(sha256sum /tmp/proof/level2.pdf | awk '{print $1}')" = "$SHARED_SHA256"

      - name: Run real Chrome acceptance
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@latest >/dev/null
          google-chrome --version
          node tests/phase11-browser-verification.mjs

      - name: Re-measure representative KV journey
        shell: bash
        run: |
          set -euo pipefail
          bash tests/phase11-kv-journey.sh /tmp/change4-kv.json
          jq -e '.totals.studentsKvReadOps <= 6 and .totals.lessonsKvReadOps <= 5 and .totals.totalKvReadOps <= 11' /tmp/change4-kv.json >/dev/null
          jq '.totals' /tmp/change4-kv.json

      - name: Final safety verification
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${BUCKET}/${SHARED_KEY}" --file=/tmp/shared-final.pdf --remote >/tmp/shared-final.log
          test "$(sha256sum /tmp/shared-final.pdf | awk '{print $1}')" = "$SHARED_SHA256"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings-final.json
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings-final.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[] | select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text") | .text][0] // ""' /tmp/settings-final.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) exit 1;; esac
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" >/tmp/d1-final.json
          grep -Fq 'trg_student_sessions_single_active' /tmp/d1-final.json
          grep -Fq '"ok"' /tmp/d1-final.json

      - name: Roll back Worker on failure
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          STUDENTS: ${{ steps.guard.outputs.students }}
          LESSONS: ${{ steps.guard.outputs.lessons }}
          R2: ${{ steps.guard.outputs.r2 }}
          DB: ${{ steps.guard.outputs.db }}
          ALLOWLIST: ${{ steps.guard.outputs.allowlist }}
        run: |
          set -euo pipefail
          cat >worker/wrangler.rollback.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase11-efficient.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "${ALLOWLIST}"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.rollback.toml --keep-vars --message 'Rollback Phase 11 Change 4 apply' >/tmp/change4-worker-rollback.log

      - name: Roll back Year 5 override on failure
        if: failure() && steps.r2write.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.snapshot.outputs.target_existed }}' = 'true' ]; then
            npx --yes wrangler@${WRANGLER_VERSION} r2 object put "${BUCKET}/${YEAR5_KEY}" --file=/tmp/change4-backup/year5-before.pdf --content-type=application/pdf --remote >/tmp/change4-r2-rollback.log
          else
            npx --yes wrangler@${WRANGLER_VERSION} r2 object delete "${BUCKET}/${YEAR5_KEY}" --remote >/tmp/change4-r2-rollback.log
          fi

      - name: Completion
        if: success()
        run: echo 'Phase 11 Change 4 guarded apply: PASS'
