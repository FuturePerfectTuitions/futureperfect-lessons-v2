name: Navigation manifest branch verification

on:
  push:
    branches: [fix/restore-bundled-navigation-manifest]
    paths:
      - '.github/workflows/navigation-manifest-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical manifest and run navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nav-package
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/nav-package >/tmp/nav-package.log
          grep -Fq 'Navigation manifest SHA-256: d82ab8d3dbefc83f1b81b1d888a85eb1de9c759326042f446ad94efdfdb22083' worker/src/phase11-navigation-manifest.generated.js
          jq -e '.navigationManifestLessons == 369 and .navigationManifestCurricula == 11' /tmp/nav-package/phase11-apply-summary.json >/dev/null
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          bash -n ops/deploy_current_worker_preserve.sh
          grep -Fq 'phase11-apply-package.mjs' ops/deploy_current_worker_preserve.sh
          echo 'NAVIGATION_MANIFEST_BRANCH_PASS'
