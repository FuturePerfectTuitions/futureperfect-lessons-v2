name: Phase 17 Guarded Pre-Launch Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase17-guarded-finalize.yml'
      - 'tests/phase17-finalize-state.mjs'
      - 'tests/phase17-r2-fixture-safety.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-guarded-finalizer
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  R2_BUCKET: fpt-materials-dev
  WRANGLER_VERSION: 4.125.0
  PHASE17_REAL_BACKUP_FILE: /tmp/phase17-real-pre-finalize.json

jobs:
  finalize:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.ref == 'phase17-prelaunch-freeze-production-verification' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact Phase 17 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Phase 16 base and frozen source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='05f9c23bdb3e599ef0c641490822e9d63e5728fe'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_BASE"
            git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          fi
          node --check tests/phase17-finalize-state.mjs
          node --check tests/phase17-r2-fixture-safety.mjs
          node --check worker/src/index-phase17.js
          node tests/phase17-explicit-special-screenpal-static.mjs
          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p17-nav.json
          jq -e '.catalogueSha256 == "7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .curricula == 11 and .lessons == 369' /tmp/p17-nav.json >/dev/null
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase15-master-navigation-regression.mjs
          node tests/phase16-session-transport-static-verification.mjs
          git show df3a442c5d6956bb2c5b0ffe41e4b850e01d8a45:scripts/phase12-real-student-apply-v2.mjs > /tmp/p12-real-seed.mjs
          grep -Fq 'fullLibraries: [],' /tmp/p12-real-seed.mjs
          grep -Fq 'manualAccess: { coreLessons: [], vrLessons: [], specialBuckets: [] }' /tmp/p12-real-seed.mjs
          rm -f /tmp/p12-real-seed.mjs
          echo 'Frozen source and Phase 12 real-student seed baseline PASS.'

      - name: Require exact reconciled post-clean state
        shell: bash
        run: |
          set -euo pipefail
          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p17-reconcile-before.json
          jq -e '.status == "PASS" and .state == "POST_CLEANUP_EXACT" and .d1.entitlements == 173 and .kv.userRecords == 2 and .kv.lessonKvKeys == 381 and .kv.explicitVrHowToUrls == 11' /tmp/p17-reconcile-before.json >/dev/null
          PHASE17_FINALIZE_ACTION=precheck node tests/phase17-finalize-state.mjs | tee /tmp/p17-finalize-precheck.json
          jq -e '.status == "PASS" and .realStudentRecords == 2 and (.fullLibraryAssignments == 3 or .fullLibraryAssignments == 0) and .credentialFormatFailures == 0 and .identitiesOrPasswordsExposed == false' /tmp/p17-finalize-precheck.json >/dev/null

      - name: Back up current real KV configuration privately
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          PHASE17_FINALIZE_ACTION=backup-real node tests/phase17-finalize-state.mjs | tee /tmp/p17-real-backup-summary.json
          jq -e '.status == "PASS" and .backupWritten == true and .identitiesOrPasswordsExposed == false' /tmp/p17-real-backup-summary.json >/dev/null
          test -s "$PHASE17_REAL_BACKUP_FILE"
          chmod 600 "$PHASE17_REAL_BACKUP_FILE"
          HASH="$(sha256sum "$PHASE17_REAL_BACKUP_FILE" | awk '{print $1}')"
          BACKUP_KEY="_internal/phase17-backup/finalize-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}.json"
          $W r2 object put "$R2_BUCKET/$BACKUP_KEY" --file="$PHASE17_REAL_BACKUP_FILE" --content-type=application/json --remote >/tmp/p17-real-backup-put.log 2>&1
          $W r2 object get "$R2_BUCKET/$BACKUP_KEY" --file=/tmp/p17-real-backup-redownload.json --remote >/tmp/p17-real-backup-get.log 2>&1
          test "$(sha256sum /tmp/p17-real-backup-redownload.json | awk '{print $1}')" = "$HASH"
          echo "PHASE17_REAL_CONFIG_BACKUP_VERIFIED sha256=$HASH"

      - name: Restore authoritative real Full Library baseline only
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: fix-real-full-library
        run: |
          set -euo pipefail
          node tests/phase17-finalize-state.mjs | tee /tmp/p17-real-fix.json
          jq -e '.status == "PASS" and .realStudentRecords == 2 and .fullLibraryAssignments == 0 and .credentialFormatFailures == 0 and .d1.entitlements == 173 and .d1.batches == 4 and .d1.assignments == 4 and .d1.releases == 0' /tmp/p17-real-fix.json >/dev/null
          echo 'Real access configuration now matches the Phase 12 production seed baseline; credential values were not printed.'

      - name: Recover and verify the original private R2 fixture backup
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          PRE_KEY='_internal/phase17-backup/prelaunch-33251109750-9bace406a04b.tar.gz'
          $W r2 object get "$R2_BUCKET/$PRE_KEY" --file=/tmp/p17-preclean-backup.tar.gz --remote >/tmp/p17-preclean-backup-get.log 2>&1
          test "$(sha256sum /tmp/p17-preclean-backup.tar.gz | awk '{print $1}')" = 'fb214cb3abc5802b300cab00ad071e7bfcc459b10bbc1d1177d4efeb126c1a88'
          mkdir -p /tmp/p17-preclean
          tar -C /tmp/p17-preclean -xzf /tmp/p17-preclean-backup.tar.gz
          MANIFEST='/tmp/p17-preclean/r2-confirmed-development-fixtures/manifest.tsv'
          test -s "$MANIFEST"
          test "$(wc -l < "$MANIFEST" | tr -d ' ')" = '3'
          PHASE17_R2_FIXTURE_MANIFEST="$MANIFEST" node tests/phase17-r2-fixture-safety.mjs | tee /tmp/p17-r2-safety.json
          jq -e '.status == "PASS" and .backedUpDevelopmentR2Fixtures == 3 and .overlapsProductionRequiredResources == 0 and .objectNamesExposed == false' /tmp/p17-r2-safety.json >/dev/null
          echo 'Original private backup and three-object development-fixture manifest PASS.'

      - name: Remove only the three byte-verified backed-up development R2 fixtures
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          MANIFEST='/tmp/p17-preclean/r2-confirmed-development-fixtures/manifest.tsv'
          present=0
          removed=0
          already_absent=0
          while IFS=$'\t' read -r file key; do
            [ -n "$key" ] || continue
            live="/tmp/p17-live-fixture-${present}.bin"
            if $W r2 object get "$R2_BUCKET/$key" --file="$live" --remote >/tmp/p17-r2-current-get.log 2>&1; then
              present=$((present+1))
              cmp -s "$live" "/tmp/p17-preclean/r2-confirmed-development-fixtures/$file"
              $W r2 object delete "$R2_BUCKET/$key" --remote >/tmp/p17-r2-delete.log 2>&1
              removed=$((removed+1))
            else
              already_absent=$((already_absent+1))
            fi
            if $W r2 object get "$R2_BUCKET/$key" --file=/tmp/p17-should-not-exist.bin --remote >/tmp/p17-r2-after-get.log 2>&1; then
              echo 'A confirmed development R2 fixture still exists after deletion.' >&2
              exit 1
            fi
          done < "$MANIFEST"
          test $((removed + already_absent)) -eq 3
          echo "PHASE17_CONFIRMED_DEVELOPMENT_R2_CLEANUP_PASS removed=$removed already_absent=$already_absent"

      - name: Guard and deploy the frozen Phase 17 Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p17-settings-before.json
          jq -e '.success == true' /tmp/p17-settings-before.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p17-settings-before.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p17-settings-before.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login unexpectedly enabled.' >&2; exit 1;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p17-settings-before.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p17-settings-before.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p17-settings-before.json)"
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p17-settings-before.json)"
          ORIGINS="$(jq -r '[.result.bindings[]|select(.name=="ALLOWED_ORIGINS" and .type=="plain_text")|.text][0] // "https://futureperfecttuitions.github.io"' /tmp/p17-settings-before.json)"
          test "$R2" = "$R2_BUCKET"
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done
          jq -r '.result.bindings[]|select(.type=="secret_text")|.name' /tmp/p17-settings-before.json | sort > /tmp/p17-secrets-before.txt
          grep -Fxq 'EXCEL_SYNC_TOKEN' /tmp/p17-secrets-before.txt
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p17-namespaces.json
          LEGACY="$(jq -r '[.result[]|select(.title=="FPT_LESSONS_TEST")|.id][0] // ""' /tmp/p17-namespaces.json)"
          if [ -n "$LEGACY" ]; then test "$LESSONS" != "$LEGACY"; fi
          cat > worker/wrangler.phase17.runtime.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase17.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "${ORIGINS}"
          STUDENT_LOGIN_ENABLED = "false"
          DEV_LOGIN_ALLOWLIST = ""
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          $W deploy --config worker/wrangler.phase17.runtime.toml --dry-run --outdir /tmp/p17-build >/tmp/p17-dry-run.log 2>&1
          test -d /tmp/p17-build
          $W deploy --config worker/wrangler.phase17.runtime.toml --keep-vars --message 'Phase 17 frozen pre-launch Worker' >/tmp/p17-deploy.log 2>&1
          sleep 5
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p17-settings-after.json
          jq -e '.success == true' /tmp/p17-settings-after.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p17-settings-after.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/p17-settings-after.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text" and .text=="")' /tmp/p17-settings-after.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p17-settings-after.json)" = "$STUDENTS"
          test "$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p17-settings-after.json)" = "$LESSONS"
          test "$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p17-settings-after.json)" = "$DB"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p17-settings-after.json)" = "$R2_BUCKET"
          jq -r '.result.bindings[]|select(.type=="secret_text")|.name' /tmp/p17-settings-after.json | sort > /tmp/p17-secrets-after.txt
          cmp -s /tmp/p17-secrets-before.txt /tmp/p17-secrets-after.txt
          echo 'Frozen Phase 17 Worker deployed with exact isolated V2 bindings and normal login disabled.'

      - name: Verify no-auth boundary and exact final state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/p17-noauth-home.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE/api/v1/student/home")"
          test "$code" = '401'
          code="$(curl --silent --show-error --output /tmp/p17-noauth-special.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE/api/v1/student/special-resources/special%7CVR_HOWTO%7Cvr1/video")"
          test "$code" = '401'
          ! grep -Eq 'screenpal|r2Key|embedUrl' /tmp/p17-noauth-special.json
          PHASE17_FINALIZE_ACTION=postcheck node tests/phase17-finalize-state.mjs | tee /tmp/p17-finalize-postcheck.json
          jq -e '.status == "PASS" and .realStudentRecords == 2 and .fullLibraryAssignments == 0 and .credentialFormatFailures == 0 and .d1.entitlements == 173 and .d1.batches == 4 and .d1.assignments == 4 and .d1.releases == 0 and .quickCheck == "ok" and .triggerPresent == true' /tmp/p17-finalize-postcheck.json >/dev/null
          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p17-reconcile-after.json
          jq -e '.status == "PASS" and .state == "POST_CLEANUP_EXACT" and .kv.userRecords == 2 and .kv.lessonKvKeys == 381 and .kv.explicitVrHowToUrls == 11' /tmp/p17-reconcile-after.json >/dev/null
          echo 'Phase 17 guarded finalizer PASS.'
