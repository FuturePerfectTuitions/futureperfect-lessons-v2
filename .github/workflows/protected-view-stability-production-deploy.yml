name: Protected Answer viewer stability production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/protected-view-stability-production.trigger'

permissions:
  contents: read

concurrency:
  group: portal-v2-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      REQUIRE_PHASE23_ENTRYPOINT: '1'
      DEPLOY_MESSAGE: Portal V2 protected Answer viewer stability

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify protected viewer stability source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase23-protected-view-stability.js
          node --check assets/phase23-protected-view-stability.js
          node --experimental-default-type=module tests/protected-view-stability-static-verification.mjs
          grep -Fq 'main = "src/index-phase23-protected-view-stability.js"' worker/wrangler.toml
          grep -Fq "import currentWorker from './index-phase20-change20-configured-upsell.js';" worker/src/index-phase23-protected-view-stability.js
          echo 'PROTECTED_VIEW_STABILITY_SOURCE_PASS'

      - name: Require production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy current production Worker preserving bindings
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh

      - name: Verify live protected viewer stability wrapper
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'
          code="$(curl --silent --show-error \
            --header "Origin: $ORIGIN" \
            --dump-header /tmp/protected-view-headers.txt \
            --output /tmp/protected-view-body.json \
            --write-out '%{http_code}' \
            "$BASE/api/v1/student/answer-view/invalid-protected-view-token")"
          test "$code" = '410'
          grep -iFq 'x-fpt-protected-view-stability: phase23-protected-view-stability-v1' /tmp/protected-view-headers.txt
          grep -Fq 'ANSWER_VIEW_INVALID' /tmp/protected-view-body.json
          echo 'PROTECTED_VIEW_STABILITY_LIVE_PASS'
