name: Change 16 subject preview production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change16-subject-preview-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 Change 16 subject preview boundary

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Change 16 regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change16.js
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change16.js"' worker/wrangler.toml
          echo 'CHANGE16_STATIC_PASS'

      - name: Require production bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change16-settings-before.json
          jq -e '.success == true' /tmp/change16-settings-before.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/change16-settings-before.json >/dev/null
          done
          for required in ADMIN_IMPORT_PASSWORD ADMIN_IMPORT_SESSION_SECRET EXCEL_SYNC_TOKEN; do
            jq -e --arg n "$required" '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index($n) != null' /tmp/change16-settings-before.json >/dev/null
          done
          echo 'CHANGE16_BINDINGS_PASS'

      - name: Deploy current production Worker preserving bindings and secrets
        shell: bash
        run: |
          set -u -o pipefail
          set +e
          bash ops/deploy_current_worker_preserve.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Preserve script returned $rc after deployment attempt; validating live Worker bindings to distinguish post-check propagation from deployment failure."
          fi
          sleep 4
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change16-settings-after.json
          jq -e '.success == true' /tmp/change16-settings-after.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/change16-settings-after.json >/dev/null
          done
          for required in ADMIN_IMPORT_PASSWORD ADMIN_IMPORT_SESSION_SECRET EXCEL_SYNC_TOKEN; do
            jq -e --arg n "$required" '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index($n) != null' /tmp/change16-settings-after.json >/dev/null
          done
          echo 'CHANGE16_DEPLOY_BINDINGS_PASS'

      - name: Verify live security boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'
          code="$(curl --silent --show-error --output /tmp/change16-home.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" "$BASE/api/v1/student/home")"
          test "$code" = '401'
          echo 'CHANGE16_LIVE_SECURITY_PASS'
