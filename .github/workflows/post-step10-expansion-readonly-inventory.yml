name: Post-Step-10 expansion read-only bank inventory

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - '.github/workflows/post-step10-expansion-readonly-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-step10-expansion-readonly-bank-inventory
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"

      - name: Read schema and non-sensitive bank counts only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > /tmp/quiz-inventory-wrangler.toml <<TOML
          name = "step10-readonly-inventory"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML

          runq(){
            local label="$1"; shift
            echo "===== ${label} ====="
            npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/quiz-inventory-wrangler.toml --command "$1" --json
          }

          runq table_names "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('question_family','question_instance','gl_source_question','gl_evidence_link','family_lesson_requirement','family_skill') ORDER BY name;"
          runq question_family_schema "PRAGMA table_info(question_family);"
          runq question_instance_schema "PRAGMA table_info(question_instance);"
          runq gl_source_question_schema "PRAGMA table_info(gl_source_question);"
          runq gl_evidence_link_schema "PRAGMA table_info(gl_evidence_link);"
          runq question_instance_total "SELECT COUNT(*) AS question_instance_count FROM question_instance;"
          runq lifecycle_counts "SELECT lifecycle_status, COUNT(*) AS n FROM question_instance GROUP BY lifecycle_status ORDER BY lifecycle_status;"
          runq question_family_total "SELECT COUNT(*) AS question_family_count FROM question_family;"
          runq family_status_counts "SELECT family_wide_eligible, status, evidence_gate_status, COUNT(*) AS n FROM question_family GROUP BY family_wide_eligible,status,evidence_gate_status ORDER BY family_wide_eligible DESC,status,evidence_gate_status;"
          runq evidence_link_total "SELECT COUNT(*) AS evidence_link_count FROM gl_evidence_link;"
          echo 'POST_STEP10_READONLY_BANK_SCHEMA_AND_COUNTS_PASS'
