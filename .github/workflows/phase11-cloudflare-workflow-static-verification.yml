name: Phase 11 guarded Cloudflare workflow static verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase11-cloudflare-apply.yml
      - .github/workflows/phase11-worker-performance-deploy.yml
      - .github/workflows/phase11-login-diagnostic.yml
      - tests/phase11-cloudflare-workflow-static-verification.mjs
      - tests/phase11-home-performance.sh
      - worker/wrangler.toml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify guarded Phase 11 Cloudflare apply workflow
        run: |
          set -euo pipefail
          node --check tests/phase11-cloudflare-workflow-static-verification.mjs
          bash -n tests/phase11-home-performance.sh
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/phase11-login-diagnostic.yml')"
          node tests/phase11-cloudflare-workflow-static-verification.mjs
