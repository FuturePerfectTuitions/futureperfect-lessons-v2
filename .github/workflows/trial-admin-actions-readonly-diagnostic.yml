name: Trial admin actions read-only diagnostic

on:
  push:
    branches:
      - fix/trial-prepared-access-single-login-2026-09-21
    paths:
      - '.github/workflows/trial-admin-actions-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_NAME: fpt-portal-v2-worker
  PROD_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  TARGET_USER_NORM: trialeva
  BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  ORIGIN: https://lessons.futureperfect.education

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live CORS and TrialEva D1 state without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          echo '=== Live OPTIONS preflight ==='
          for path in rearm disable delete reset-passwords; do
            code="$(curl -sS -X OPTIONS \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' \
              -D "/tmp/${path}.headers" \
              -o "/tmp/${path}.body" \
              -w '%{http_code}' \
              "$BASE/api/v1/admin/trials/$path")"
            echo "$path HTTP=$code"
            grep -iE '^(access-control-allow-origin|access-control-allow-methods|access-control-allow-headers|vary):' "/tmp/${path}.headers" || true
            cat "/tmp/${path}.body" || true
            echo
            test "$code" = '200'
            grep -qi "access-control-allow-origin: $ORIGIN" "/tmp/${path}.headers"
            grep -qi 'access-control-allow-methods:.*POST' "/tmp/${path}.headers"
            grep -qi 'access-control-allow-headers:.*authorization' "/tmp/${path}.headers"
          done

          echo '=== D1 read-only state and statement compilation ==='
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const db=process.env.PROD_D1_ID;
          const user=process.env.TARGET_USER_NORM;
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}`;
          const headers={Authorization:`Bearer ${token}`,'content-type':'application/json'};
          async function d1(sql,params=[]){
            const r=await fetch(`${base}/d1/database/${db}/query`,{method:'POST',headers,body:JSON.stringify({sql,params})});
            const b=await r.json();
            if(!r.ok||b.success!==true) throw new Error(`D1 ${r.status} ${JSON.stringify(b.errors||[])}`);
            return b.result?.[0]?.results||[];
          }
          const tables=['student_sessions','student_session_profiles','student_session_windows','trial_login_consumptions'];
          const rows={};
          rows.student_sessions=await d1('SELECT token_hash, portal_user_id_norm, created_at, revoked_at FROM student_sessions WHERE portal_user_id_norm=?',[user]);
          rows.student_session_profiles=await d1('SELECT token_hash, portal_user_id_norm, created_at, updated_at FROM student_session_profiles WHERE portal_user_id_norm=?',[user]);
          rows.student_session_windows=await d1('SELECT token_hash, portal_user_id_norm, created_at FROM student_session_windows WHERE portal_user_id_norm=?',[user]);
          rows.trial_login_consumptions=await d1('SELECT portal_user_id_norm, consumed_at, first_session_token_hash FROM trial_login_consumptions WHERE portal_user_id_norm=?',[user]);
          const schema={};
          for(const t of tables){ schema[t]=await d1(`PRAGMA table_info(${t})`); }
          const plans={};
          plans.profiles=await d1("EXPLAIN QUERY PLAN DELETE FROM student_session_profiles WHERE token_hash IN (SELECT token_hash FROM student_sessions WHERE portal_user_id_norm = ?)",[user]);
          plans.windows=await d1('EXPLAIN QUERY PLAN DELETE FROM student_session_windows WHERE portal_user_id_norm = ?',[user]);
          plans.sessions=await d1('EXPLAIN QUERY PLAN DELETE FROM student_sessions WHERE portal_user_id_norm = ?',[user]);
          plans.consumption=await d1('EXPLAIN QUERY PLAN DELETE FROM trial_login_consumptions WHERE portal_user_id_norm = ?',[user]);
          const counts=Object.fromEntries(Object.entries(rows).map(([k,v])=>[k,v.length]));
          console.log(JSON.stringify({marker:'TRIAL_ADMIN_ACTIONS_READONLY_DIAGNOSTIC',user,counts,rows,schema,plans},null,2));
          NODE

          echo 'TRIAL_ADMIN_ACTIONS_READONLY_DIAGNOSTIC_PASS'

# Rerun marker: production preflight fix merged at 495e1b0c2ed38507e1f8e54e9d10373febe5b29a
