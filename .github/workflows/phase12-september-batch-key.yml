name: Phase 12 entitlement cohort diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12-september-batch-key.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  diagnose:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' && github.event.pull_request.head.ref == 'phase12-september-batches'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read aggregate cohort signatures only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) exit 1;; esac
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "SELECT source,COUNT(*) AS rows,COUNT(DISTINCT portal_user_id_norm) AS users FROM lesson_entitlements GROUP BY source ORDER BY source; SELECT COUNT(*) AS users_65 FROM (SELECT portal_user_id_norm FROM lesson_entitlements WHERE core_access=1 GROUP BY portal_user_id_norm HAVING COUNT(*)=65); SELECT COUNT(*) AS users_108 FROM (SELECT portal_user_id_norm FROM lesson_entitlements WHERE core_access=1 GROUP BY portal_user_id_norm HAVING COUNT(*)=108); SELECT COUNT(*) AS excel_users_65 FROM (SELECT portal_user_id_norm FROM lesson_entitlements WHERE core_access=1 AND source='excel' GROUP BY portal_user_id_norm HAVING COUNT(*)=65); SELECT COUNT(*) AS excel_users_108 FROM (SELECT portal_user_id_norm FROM lesson_entitlements WHERE core_access=1 AND source='excel' GROUP BY portal_user_id_norm HAVING COUNT(*)=108); SELECT COUNT(*) AS batches FROM batch_definitions WHERE batch_key IN ('Y3FE','Y3FM','Y511FE','Y511FM'); SELECT COUNT(*) AS assignments FROM student_batch_assignments; SELECT COUNT(*) AS releases FROM batch_lesson_releases; PRAGMA quick_check;" >/tmp/state.json 2>/tmp/state.err
          cat /tmp/state.json
