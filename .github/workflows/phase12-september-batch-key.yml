name: Phase 12 September batch transport key

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12-september-batch-key.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  bootstrap:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-september-batches' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Guard isolated development state and create one-time transport key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal student login enabled; refusing.' >&2; exit 1;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"; test "$STUDENTS" != null

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          chmod 600 /tmp/private.pem
          KEY_NAME='phase12:september-batches:private-key'
          KEY_ESCAPED="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("phase12:september-batches:private-key", safe=""))')"
          curl --fail --silent --show-error --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/values/${KEY_ESCAPED}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/private.pem >/dev/null

          echo 'PHASE12_BATCH_PUBLIC_KEY_BEGIN'
          cat /tmp/public.pem
          echo 'PHASE12_BATCH_PUBLIC_KEY_END'
          sha256sum /tmp/public.pem | awk '{print "PHASE12_BATCH_PUBLIC_KEY_SHA256=" $1}'
          rm -f /tmp/private.pem /tmp/public.pem
