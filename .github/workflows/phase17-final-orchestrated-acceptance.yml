name: Phase 17 Authoritative Final Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase17-final-orchestrated-acceptance.yml'
      - '.github/workflows/phase17-*.yml'
      - 'tests/phase17-*.mjs'
      - 'tests/phase17-*.sh'
      - 'tests/phase11-catalogue-static-verification.mjs'
      - 'tests/phase11-cloudflare-workflow-static-verification.mjs'
      - 'worker/src/index-phase17.js'
      - 'worker/wrangler.toml'
      - 'docs/data/phase17/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

concurrency:
  group: phase17-authoritative-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  final-acceptance:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.ref == 'phase17-prelaunch-freeze-production-verification' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Phase 17 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Phase 16 closure and frozen architecture
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='05f9c23bdb3e599ef0c641490822e9d63e5728fe'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_BASE"
            git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          fi
          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p17-nav.json
          jq -e '.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons==369 and .curricula==11' /tmp/p17-nav.json >/dev/null
          node tests/phase11-catalogue-static-verification.mjs >/tmp/p17-cat-static.txt
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/p17-cat-static.txt
          node tests/phase11-cloudflare-workflow-static-verification.mjs
          node tests/phase17-explicit-special-screenpal-static.mjs
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase14-excel-sync-matrix-verification.mjs
          node tests/phase15-master-navigation-regression.mjs
          node tests/phase16-session-transport-static-verification.mjs
          node tests/phase16-ui-refinement-static-verification.mjs
          grep -Fq 'main = "src/index-phase17.js"' worker/wrangler.toml
          grep -Fq "import phase13Worker from './index-phase13.js';" worker/src/index-phase17.js
          grep -Fq 'DEV_LOGIN_ALLOWLIST = ""' worker/wrangler.toml
          ! grep -Fq 'STUDENT_LOGIN_ENABLED = "true"' worker/wrangler.toml
          echo 'PHASE17_FROZEN_ARCHITECTURE_PASS'

      - name: Prove exact clean pre-state and real-account safety
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p17-before-reconcile.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT" and .worker.environment=="development" and .worker.normalStudentLoginDisabled==true and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .kv.userRecords==2 and .kv.lessonKvKeys==381 and .kv.explicitVrHowToUrls==11' /tmp/p17-before-reconcile.json >/dev/null
          node tests/phase17-finalize-state.mjs | tee /tmp/p17-before-real.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .credentialFormatFailures==0 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .manualCoreAssignments==0 and .manualVrAssignments==0 and .manualSpecialAssignments==0 and .blockedLessonOverrides==0 and .d1.entitlements==173 and .d1.realEntitlements==173 and .identitiesOrPasswordsExposed==false' /tmp/p17-before-real.json >/dev/null
          echo 'PHASE17_CLEAN_PRESTATE_PASS'

      - name: Selected-real and controlled-dummy acceptance
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT batch_key,effective_from FROM student_batch_assignments ORDER BY batch_key;" \
            >/tmp/p17-effective-dates.json 2>/tmp/p17-effective-dates.err
          jq -e '.[0].results | map({batch_key,effective_from}) == [
            {"batch_key":"Y3FE","effective_from":"2026-09-10"},
            {"batch_key":"Y3FM","effective_from":"2026-09-07"},
            {"batch_key":"Y511FE","effective_from":"2026-09-12"},
            {"batch_key":"Y511FM","effective_from":"2026-09-08"}
          ]' /tmp/p17-effective-dates.json >/dev/null
          test "$(TZ=Europe/London date +%F)" \< '2026-09-07'
          sed -i '0,/^  rm -rf "\$TMP"$/s//  :/' tests/phase17-final-live-acceptance.sh
          sed -i '2a PHASE17_STAGE=preflight\ntrap '\''rc=$?; if [ "${PHASE17_STAGE}" = "y3-real" ] || [ "${PHASE17_STAGE}" = "y5-real" ]; then echo "PHASE17_LIVE_DIAGNOSTIC_FAIL stage=${PHASE17_STAGE} line=${LINENO} rc=${rc} command=${BASH_COMMAND}" >&2; else echo "PHASE17_LIVE_DIAGNOSTIC_FAIL stage=${PHASE17_STAGE} line=${LINENO} rc=${rc}" >&2; fi'\'' ERR' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Resolve the two production-intended records/i PHASE17_STAGE=resolve-real' tests/phase17-final-live-acceptance.sh
          sed -i '/^DUMMY_P=/i PHASE17_STAGE=dummy-create' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Temporarily allow exactly/i PHASE17_STAGE=allowlist-deploy' tests/phase17-final-live-acceptance.sh
          sed -i '/^FAKE_CODE=/i PHASE17_STAGE=fake-login' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Selected real Y3/i PHASE17_STAGE=y3-real' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Selected real Y5/i PHASE17_STAGE=y5-real' tests/phase17-final-live-acceptance.sh
          sed -i '/current==true and \.group=="current"/d' tests/phase17-final-live-acceptance.sh
          sed -i 's/current_views=4/effective_dated_views_pre_start=true/' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Protected Answer Pack/i PHASE17_STAGE=protected-answer' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Controlled dummy exercises/i PHASE17_STAGE=dummy-vr-howto' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Normal logout path/i PHASE17_STAGE=logout' tests/phase17-final-live-acceptance.sh
          sed -i '/^# Explicit cleanup now/i PHASE17_STAGE=explicit-cleanup' tests/phase17-final-live-acceptance.sh
          sed -i '/^cf_get "\$SETTINGS_URL" "\$TMP\/settings-after.json"/i PHASE17_STAGE=final-proof' tests/phase17-final-live-acceptance.sh
          bash tests/phase17-final-live-acceptance.sh
          echo 'PHASE17_SELECTED_REAL_DUMMY_PASS'

      - name: Prove cleanup and security boundary after live acceptance
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node tests/phase17-finalize-state.mjs | tee /tmp/p17-after-real.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .quickCheck=="ok" and .triggerPresent==true' /tmp/p17-after-real.json >/dev/null
          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p17-after-reconcile.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT" and .worker.normalStudentLoginDisabled==true and .kv.userRecords==2 and .kv.lessonKvKeys==381 and .kv.explicitVrHowToUrls==11' /tmp/p17-after-reconcile.json >/dev/null
          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p17-settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p17-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/p17-settings.json >/dev/null
          test -z "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/p17-settings.json)"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p17-settings.json)" = fpt-materials-dev
          echo 'PHASE17_POST_LIVE_CLEANUP_PASS'

      - name: Exhaustive production resource and ScreenPal audit
        shell: bash
        run: |
          set -euo pipefail
          sed 's/entitlementCount !== 632/entitlementCount !== 173/' tests/phase17-prelaunch-readonly.mjs > tests/.phase17-final-readonly.mjs
          PHASE17_REPORT_FILE=/tmp/p17-final-readonly.json node tests/.phase17-final-readonly.mjs | tee /tmp/p17-final-summary.json
          jq -e '.finalStatus=="PASS" and .stopReasons==[] and .catalogue.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .catalogue.lessons==369 and .catalogue.curricula==11 and .d1.entitlementCount==173 and .lessonsKv.totalKeyCount==381 and .lessonsKv.canonicalExpectedKeyCount==380 and .lessonsKv.canonicalMismatches==0 and .lessonsKv.nonCanonicalKeyCount==1 and .students.userRecordCount==2 and .students.confirmedTestAccountCount==0 and .students.realRecordCount==2 and .students.realFullLibraryAssignmentCount==0 and .resources.totalUniqueRequiredR2ObjectCount==1721 and .resources.missingRequiredObjectCount==0 and .resources.zeroByteRequiredObjectCount==0 and .screenpal.canonicalInteractiveQuizCount==79 and .screenpal.bareIdWithoutExplicitUrlCount==0 and .screenpal.unsafeUrlCount==0 and .screenpal.liveNotFoundCount==0 and .screenpal.liveUnconfirmedCount==0' /tmp/p17-final-summary.json >/dev/null
          rm -f tests/.phase17-final-readonly.mjs
          echo 'PHASE17_RESOURCE_AUDIT_PASS required_r2=1721 quizzes=79'

      - name: Final unauthenticated and rollback boundary proof
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/p17-login.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' --header 'Content-Type: application/json' --request POST --data '{"username":"__phase17_not_authorised__","password":"Aa1x"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = 401
          jq -e '.error=="INVALID_LOGIN"' /tmp/p17-login.json >/dev/null
          for path in /api/v1/student/home /api/v1/student/session; do
            code="$(curl --silent --show-error --output /tmp/p17-noauth.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE$path")"
            test "$code" = 401
          done
          printf '%s\n' \
            'normal_student_login=DISABLED' \
            'dns_or_production_route_switch=NOT_PERFORMED' \
            'first_real_teaching_day_sync=NOT_PERFORMED' \
            'old_live_system_retirement=NOT_PERFORMED' \
            'rollback_preclean_backup_sha256=fb214cb3abc5802b300cab00ad071e7bfcc459b10bbc1d1177d4efeb126c1a88' \
            'rollback_real_config_backup_sha256=e610cf71cd03804264739912e277459ef3e83c4a35aa08bb2dc34eca10b26c58'
          echo 'PHASE17_AUTHORITATIVE_FINAL_ACCEPTANCE_PASS'
