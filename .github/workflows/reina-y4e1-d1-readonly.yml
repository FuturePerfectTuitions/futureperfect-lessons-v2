name: Y4E1 deployed renderer read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/reina-y4e1-d1-readonly.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Inspect deployed Worker source without mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/content" -o /tmp/worker-content
          echo '=== DEPLOYED CONTENT SIZE ==='
          wc -c /tmp/worker-content
          echo '=== CORE PRELESSON FALLBACK SIGNATURES ==='
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/worker-content').read_text('utf-8', errors='ignore')
          checks = {
              'lessonCollections': 'function lessonCollections(record)' in text,
              'corePreLessonFallback': 'Array.isArray(core.preLessonSheets)' in text,
              'safeLessonModel': 'async function safeLessonModel' in text,
              'renderPreLessonPayload': 'preLessonSheets: await Promise.all(packageData.preLessonSheets.map(safeFile))' in text,
              'step10Bridge': "import currentWorker from './index-admin-tools.js'" in text or '/api/v1/student/quiz/eligibility' in text,
          }
          for key, value in checks.items():
              print(f'{key}={str(value).lower()}')
          PY
          echo 'READ_ONLY_COMPLETE=true'
