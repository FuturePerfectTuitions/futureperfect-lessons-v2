name: Excel online PreLesson production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/excel-online-prelesson-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Fix Excel online PreLesson authoritative-row sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change7.js
          node --check worker/src/index-phase19-access.js
          node --check worker/src/index-phase18-online-prelesson.js
          grep -Fq 'processAuthoritativePrelessonItem' worker/src/index-phase20-change7.js
          grep -Fq "PRELESSON_OPERATIONS = new Set(['prelesson_grant', 'prelesson_status_check'])" worker/src/index-phase20-change7.js
          grep -Fq 'main = "src/index-phase20-change7.js"' ops/deploy_current_worker_preserve.sh
          echo 'PRELESSON_FIX_STATIC_PASS'

      - name: Deploy current production Worker preserving bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          bash ops/deploy_current_worker_preserve.sh
          echo 'PRELESSON_FIX_DEPLOY_PASS'

      - name: Live route remains fail-closed without sync token
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          code="$(curl --silent --show-error --output /tmp/noauth.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"items":[{"syncRowId":"noauth-check","operation":"prelesson_grant","portalUserId":"missing","lessonId":"missing","batchKey":"O","lessonDate":"2026-09-07"}]}' \
            "$BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = '401'
          jq -e '.error == "SYNC_UNAUTHORISED"' /tmp/noauth.json >/dev/null
          echo 'PRELESSON_FIX_LIVE_FAIL_CLOSED_PASS'
