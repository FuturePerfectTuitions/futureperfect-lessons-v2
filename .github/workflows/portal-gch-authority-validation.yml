name: Portal V2 GCH authority validation

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'gch/portal-v2-current/**'
      - '.github/workflows/portal-gch-authority-validation.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'gch/portal-v2-current/**'
      - '.github/workflows/portal-gch-authority-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate machine-readable authority set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('gch/portal-v2-current')
          current = json.loads((root / 'GCH_CURRENT.json').read_text())
          base = json.loads((root / 'GCH_STATE.json').read_text())
          replace_override = json.loads((root / 'GCH_OVERRIDE_2026-09-23_REPLACE_RESOURCE.json').read_text())
          quiz_override = json.loads((root / 'GCH_OVERRIDE_2026-09-23_QUIZ_BRIDGE_COMPOSITION.json').read_text())
          batch_override = json.loads((root / 'GCH_OVERRIDE_2026-09-25_ADMIN_BATCH_CREATION.json').read_text())
          lookup_override = json.loads((root / 'GCH_OVERRIDE_2026-09-25_ADMIN_PORTAL_LOOKUP.json').read_text())
          workflow = json.loads((root / 'WEBSITE_WORKFLOW_2026-09-23.json').read_text())

          assert current['status'] == 'AUTHORITATIVE_CURRENT'
          assert current['authorityVersion'] in {
              '5.2-quiz-bridge-composition',
              '5.3-replace-resource-preflight',
              '5.4-admin-batch-creation',
              '5.5-admin-batch-reactivation',
              '5.6-admin-simple-batch-create',
              '5.7-admin-portal-login-lookup',
              '5.8-admin-reset-show-credentials'
          }
          assert base['status'] == 'AUTHORITATIVE_CURRENT'
          assert replace_override['status'] == 'AUTHORITATIVE_CURRENT_OVERRIDE'
          assert quiz_override['status'] in {
              'REPAIR_PREPARED_PENDING_PRODUCTION_VERIFICATION',
              'PRODUCTION_REPAIR_PASS_PENDING_STUDENT_BROWSER_VERIFICATION',
              'CLOSED_PASS_OWNER_VERIFIED'
          }
          assert batch_override['status'] == 'AUTHORITATIVE_CURRENT_OVERRIDE'
          assert lookup_override['status'] == 'AUTHORITATIVE_CURRENT_OVERRIDE'
          assert workflow['status'] == 'AUTHORITATIVE_CURRENT_WORKFLOW'

          expected_quiz_path = 'gch/portal-v2-current/GCH_OVERRIDE_2026-09-23_QUIZ_BRIDGE_COMPOSITION.json'
          assert current['authorityComposition']['quizBridgeCompositionOverride']['path'] == expected_quiz_path
          assert expected_quiz_path in current['readOrder']
          assert quiz_override['requiredProductionTopology']['canonicalWranglerEntrypoint'] == 'src/index-step10-quiz-bridge.js'
          assert quiz_override['requiredProductionTopology']['compositionChain'][0] == 'index-step10-quiz-bridge.js'
          assert quiz_override['requiredProductionTopology']['compositionChain'][1] == 'index-admin-tools.js'
          assert quiz_override['publicQuizRuntimeBoundary']['releaseContext'] == 'quiz-release-context-v2.0 / portal-live-maths11plus-release-v2'
          assert quiz_override['publicQuizRuntimeBoundary']['quizWorkerMutationRequiredForThisIncident'] is False

          expected_batch_path = 'gch/portal-v2-current/GCH_OVERRIDE_2026-09-25_ADMIN_BATCH_CREATION.json'
          assert current['authorityComposition']['adminBatchCreationOverride']['path'] == expected_batch_path
          assert expected_batch_path in current['readOrder']
          assert batch_override['requiredBehaviour']['createApi'] == 'POST /api/v1/admin/students/batches/create'
          assert 'reactivateApi' not in batch_override['requiredBehaviour']
          assert 'created_at' in batch_override['requiredBehaviour']['createTimestampRule']
          assert 'updated_at' in batch_override['requiredBehaviour']['createTimestampRule']
          assert 'UNIQUE' in batch_override['requiredBehaviour']['constraintClassificationRule']
          assert 'dropdownPresentation' in batch_override['requiredBehaviour']
          assert 'visible space' in batch_override['requiredBehaviour']['dropdownPresentation']
          assert batch_override['incident20260925']['rootCause']

          expected_lookup_path = 'gch/portal-v2-current/GCH_OVERRIDE_2026-09-25_ADMIN_PORTAL_LOOKUP.json'
          assert current['authorityComposition']['adminPortalLookupOverride']['path'] == expected_lookup_path
          assert expected_lookup_path in current['readOrder']
          assert lookup_override['requiredBehaviour']['lookupApi'] == 'POST /api/v1/admin/students/lookup'
          assert lookup_override['requiredBehaviour']['resetApi'] == 'POST /api/v1/admin/students/reset-credentials'
          assert lookup_override['requiredBehaviour']['lookupReadOnly'] is True
          assert set(lookup_override['requiredBehaviour']['resetScope']) == {'p', 'loginPassword', 'answerPassword'}
          assert 'STUDENTS_KV' in lookup_override['requiredBehaviour']['canonicalSource']
          assert 'sessions' in current['latestRepositoryChange']['resetBoundary']

          for rel in current['readOrder'][1:]:
              assert Path(rel).exists(), rel

          rr = workflow['websiteWorkflows']['replaceResource']
          assert rr['status'] == 'PERMANENT_CONSISTENCY_FIX_LIVE_AND_OWNER_VERIFIED_2026-09-23'
          assert rr['closedIncidentEvidence']['ownerBrowserVerification'] == 'PASS'
          assert rr['closedIncidentEvidence']['canonicalOldKeyCount'] == 0
          assert rr['closedIncidentEvidence']['canonicalNewKeyCount'] == 1
          assert rr['closedIncidentEvidence']['preparedOldKeyCount'] == 0
          assert rr['closedIncidentEvidence']['preparedNewKeyCount'] == 1

          assert replace_override['incidentCloseout']['ownerBrowserVerification']['result'] == 'PASS'
          assert replace_override['permanentImplementation']['failureSemantics']['failureMarker'] == 'RESOURCE_REPLACE_PROJECTION_FAILED'
          assert replace_override['permanentImplementation']['preflightGuardMarker'] == 'replace-resource-preflight-pass-v1'
          preflight = replace_override['preflightIncident20260923']
          assert preflight['canonicalLessonId'] == 'Y6M1.4'
          assert preflight['readOnlyFindings']['githubPagesOriginPreflightHttpStatus'] == 500
          assert preflight['readOnlyFindings']['canonicalAndPreparedStillMatchOldObject'] is True
          assert 'OPTIONS' in replace_override['permanentImplementation']['transportBoundary']['rule']

          agents = Path('AGENTS.md').read_text()
          for required in current['readOrder'][1:]:
              assert required in agents, required

          print('PORTAL_GCH_AUTHORITY_VALIDATION_PASS')
          PY
