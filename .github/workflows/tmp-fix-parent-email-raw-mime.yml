name: Temporary raw MIME parent email patch

on:
  push:
    branches: [fix/email-signature-raw-mime]
    paths:
      - '.github/workflows/tmp-fix-parent-email-raw-mime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-signature-raw-mime

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace structured CID builder with explicit raw MIME
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('worker/src/parent-email.js')
          s = p.read_text(encoding='utf-8')
          assert 'async function loadSignatureBytes' in s
          assert 'function buildRawMime' not in s

          marker = 'function htmlShell(content) {'
          helpers = r'''function utf8Base64(value) {
            return bytesToBase64(new TextEncoder().encode(String(value ?? '')));
          }

          function wrapBase64(value, width = 76) {
            const text = String(value || '');
            if (!text) return '';
            const lines = [];
            for (let i = 0; i < text.length; i += width) lines.push(text.slice(i, i + width));
            return lines.join('\r\n');
          }

          function safeHeader(value) {
            return String(value ?? '').replace(/[\r\n]+/g, ' ').trim();
          }

          function mimeBoundary(prefix) {
            const id = crypto.randomUUID().replace(/-/g, '');
            return `${prefix}_${id}`;
          }

          function buildRawMime({ fromEmail, fromName, toEmail, ccEmail = '', subject, html, text, signatureBytes }) {
            const relatedBoundary = mimeBoundary('fpt_related');
            const alternativeBoundary = mimeBoundary('fpt_alt');
            const imageBase64 = wrapBase64(bytesToBase64(signatureBytes));
            const textBase64 = wrapBase64(utf8Base64(text));
            const htmlBase64 = wrapBase64(utf8Base64(html));
            const lines = [
              `From: ${safeHeader(fromName)} <${safeHeader(fromEmail)}>`,
              `To: ${safeHeader(toEmail)}`,
              ...(ccEmail ? [`Cc: Barkha <${safeHeader(ccEmail)}>`] : []),
              `Subject: ${safeHeader(subject)}`,
              'MIME-Version: 1.0',
              `Content-Type: multipart/related; boundary="${relatedBoundary}"`,
              '',
              `--${relatedBoundary}`,
              `Content-Type: multipart/alternative; boundary="${alternativeBoundary}"`,
              '',
              `--${alternativeBoundary}`,
              'Content-Type: text/plain; charset="UTF-8"',
              'Content-Transfer-Encoding: base64',
              '',
              textBase64,
              '',
              `--${alternativeBoundary}`,
              'Content-Type: text/html; charset="UTF-8"',
              'Content-Transfer-Encoding: base64',
              '',
              htmlBase64,
              '',
              `--${alternativeBoundary}--`,
              '',
              `--${relatedBoundary}`,
              `Content-Type: image/png; name="${SIGNATURE_FILENAME}"`,
              'Content-Transfer-Encoding: base64',
              `Content-ID: <${SIGNATURE_CID}>`,
              `X-Attachment-Id: ${SIGNATURE_CID}`,
              `Content-Disposition: inline; filename="${SIGNATURE_FILENAME}"`,
              '',
              imageBase64,
              '',
              `--${relatedBoundary}--`,
              ''
            ];
            return lines.join('\r\n');
          }

          async function createRawEmailMessage(env, fromEmail, envelopeTo, rawMime) {
            if (typeof env?.__EMAIL_MESSAGE_FACTORY === 'function') {
              return env.__EMAIL_MESSAGE_FACTORY(fromEmail, envelopeTo, rawMime);
            }
            const { EmailMessage } = await import('cloudflare:email');
            return new EmailMessage(fromEmail, envelopeTo, rawMime);
          }

          '''
          s = s.replace(marker, helpers + marker, 1)

          start = s.index('async function sendParentEmail(env, item) {')
          end = s.index('\n\nexport {', start)
          new_send = r'''async function sendParentEmail(env, item) {
            const validation = validateParentEmailFields(item, env);
            if (validation) return { ok:false, status:validation[0], message:validation[1] };

            const built = buildParentEmail(item);
            if (!built) return { ok:true, status:'NOT_REQUIRED', messageId:'' };

            const fromEmail = clean(env?.PARENT_EMAIL_FROM) || DEFAULT_FROM;
            const fromName = clean(env?.PARENT_EMAIL_FROM_NAME) || DEFAULT_FROM_NAME;
            const ccEmail = clean(env?.PARENT_EMAIL_CC) || DEFAULT_CC;
            const intendedTo = clean(item.parentEmail);
            const testTo = clean(env?.PARENT_EMAIL_TEST_TO);
            const deliveredTo = testTo || intendedTo;
            const testMode = Boolean(testTo);

            let signatureBytes = null;
            try {
              signatureBytes = await loadSignatureBytes(env);
            } catch (error) {
              return {
                ok:false,
                status:'EMAIL_SIGNATURE_LOAD_FAILED',
                message:clean(error?.message) || 'Could not load the parent email signature image.',
                testMode,
                deliveredTo,
                intendedTo,
                intendedCc:ccEmail
              };
            }

            const rawMime = buildRawMime({
              fromEmail,
              fromName,
              toEmail:deliveredTo,
              ccEmail:testMode ? '' : ccEmail,
              subject:built.subject,
              html:built.html,
              text:built.text,
              signatureBytes
            });
            const envelopeRecipients = testMode ? [deliveredTo] : [intendedTo, ccEmail];

            try {
              const messageIds = [];
              for (const envelopeTo of envelopeRecipients) {
                const message = await createRawEmailMessage(env, fromEmail, envelopeTo, rawMime);
                const response = await env.EMAIL.send(message);
                const id = clean(response?.messageId);
                if (id) messageIds.push(id);
              }
              return {
                ok:true,
                status:'SENT',
                messageId:messageIds[0] || '',
                messageIds,
                subject:built.subject,
                testMode,
                deliveredTo,
                intendedTo,
                intendedCc:ccEmail
              };
            } catch (error) {
              return {
                ok:false,
                status:clean(error?.code) || 'EMAIL_SEND_FAILED',
                message:clean(error?.message) || 'Cloudflare could not send the parent email.',
                testMode,
                deliveredTo,
                intendedTo,
                intendedCc:ccEmail
              };
            }
          }'''
          s = s[:start] + new_send + s[end:]
          s = s.replace('  loadSignatureBytes,\n  SIGNATURE_CID,', '  loadSignatureBytes,\n  buildRawMime,\n  SIGNATURE_CID,', 1)
          p.write_text(s, encoding='utf-8')

          # Update the main parent-email verification to exercise raw MIME.
          p = Path('tests/parent-email-import-verification.mjs')
          t = p.read_text(encoding='utf-8')
          start = t.index('// Cloudflare Email Sending payload must use Sej as sender and Barkha as CC.')
          end = t.index('// A delivery failure is reported as an email failure;', start)
          replacement = r'''// Cloudflare Email Sending now receives an explicit raw RFC 5322 MIME message.
          // The same MIME has To=parent and Cc=Barkha, while both addresses are supplied as
          // envelope recipients. The signature part has a literal matching Content-ID.
          const TEST_SIGNATURE_BASE64 = 'dGVzdC1zaWduYXR1cmU=';
          const sentPayloads = [];
          const env = {
            PARENT_EMAIL_SIGNATURE_BASE64: TEST_SIGNATURE_BASE64,
            __EMAIL_MESSAGE_FACTORY(from, to, raw) { return { from, to, raw }; },
            EMAIL:{
              async send(payload) {
                sentPayloads.push(payload);
                return { messageId:`synthetic-${sentPayloads.length}` };
              }
            }
          };
          const sent = await sendParentEmail(env, upcoming);
          assert.equal(sent.ok, true);
          assert.equal(sent.status, 'SENT');
          assert.equal(sent.messageId, 'synthetic-1');
          assert.equal(sentPayloads.length, 2);
          assert.equal(sentPayloads[0].from, 'sej@futureperfect.education');
          assert.equal(sentPayloads[0].to, 'sara_shinde@hotmail.co.uk');
          assert.equal(sentPayloads[1].to, 'barkha@futureperfect.education');
          assert.equal(sentPayloads[0].raw, sentPayloads[1].raw);
          assert.match(sentPayloads[0].raw, /From: Sejal Dalal <sej@futureperfect\.education>/);
          assert.match(sentPayloads[0].raw, /To: sara_shinde@hotmail\.co\.uk/);
          assert.match(sentPayloads[0].raw, /Cc: Barkha <barkha@futureperfect\.education>/);
          assert.match(sentPayloads[0].raw, /Content-Type: multipart\/related/);
          assert.match(sentPayloads[0].raw, /Content-ID: <fpt-email-signature-clean>/);
          assert.match(sentPayloads[0].raw, /X-Attachment-Id: fpt-email-signature-clean/);
          assert.match(sentPayloads[0].raw, /Content-Disposition: inline; filename="fpt-email-signature\.png"/);
          assert.match(sentPayloads[0].raw, /dGVzdC1zaWduYXR1cmU=/);

          '''
          t = t[:start] + replacement + t[end:]
          old_failed = """const failed = await sendParentEmail({\n  PARENT_EMAIL_SIGNATURE_BASE64: TEST_SIGNATURE_BASE64,\n  EMAIL:{ async send() { throw Object.assign(new Error('Synthetic delivery failure'), { code:'DELIVERY_FAILURE' }); } }\n}, completed);"""
          new_failed = """const failed = await sendParentEmail({\n  PARENT_EMAIL_SIGNATURE_BASE64: TEST_SIGNATURE_BASE64,\n  __EMAIL_MESSAGE_FACTORY(from, to, raw) { return { from, to, raw }; },\n  EMAIL:{ async send() { throw Object.assign(new Error('Synthetic delivery failure'), { code:'DELIVERY_FAILURE' }); } }\n}, completed);"""
          assert old_failed in t
          t = t.replace(old_failed, new_failed, 1)
          t = t.replace('runtime signature loading, L-prefix normalisation and Cloudflare payload: PASS', 'runtime signature loading, raw MIME CID linkage, L-prefix normalisation and Cloudflare delivery: PASS')
          p.write_text(t, encoding='utf-8')

          # Update test-recipient routing to use the raw EmailMessage test factory.
          p = Path('tests/parent-email-test-routing-verification.mjs')
          u = p.read_text(encoding='utf-8')
          u = u.replace("const result = await sendParentEmail({\n  PARENT_EMAIL_TEST_TO:'sejal.mail@gmail.com',\n  EMAIL:{", "const result = await sendParentEmail({\n  PARENT_EMAIL_TEST_TO:'sejal.mail@gmail.com',\n  PARENT_EMAIL_SIGNATURE_BASE64:'dGVzdC1zaWduYXR1cmU=',\n  __EMAIL_MESSAGE_FACTORY(from, to, raw) { return { from, to, raw }; },\n  EMAIL:{", 1)
          old_asserts = """assert.equal(payloads.length, 1);\nassert.equal(payloads[0].to, 'sejal.mail@gmail.com');\nassert.equal('cc' in payloads[0], false, 'Test mode must not send a copy to Barkha');\nassert.equal(payloads[0].subject, 'Upcoming Lesson for Annisha and the worksheets to be printed before the next session on 7th September 2026.');"""
          new_asserts = """assert.equal(payloads.length, 1);\nassert.equal(payloads[0].to, 'sejal.mail@gmail.com');\nassert.match(payloads[0].raw, /To: sejal\\.mail@gmail\\.com/);\nassert.doesNotMatch(payloads[0].raw, /^Cc:/m, 'Test mode must not send a copy to Barkha');\nassert.match(payloads[0].raw, /Subject: Upcoming Lesson for Annisha and the worksheets to be printed before the next session on 7th September 2026\\./);\nassert.match(payloads[0].raw, /Content-ID: <fpt-email-signature-clean>/);"""
          assert old_asserts in u
          u = u.replace(old_asserts, new_asserts, 1)
          p.write_text(u, encoding='utf-8')
          PY

      - name: Verify raw MIME implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/parent-email.js
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-test-routing-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'Content-ID: <${SIGNATURE_CID}>' worker/src/parent-email.js
          grep -Fq "await import('cloudflare:email')" worker/src/parent-email.js
          echo RAW_MIME_PARENT_EMAIL_PASS

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-parent-email-raw-mime.yml
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/parent-email.js tests/parent-email-import-verification.mjs tests/parent-email-test-routing-verification.mjs .github/workflows/tmp-fix-parent-email-raw-mime.yml
          git commit -m 'Send parent signature with explicit raw MIME Content-ID'
          git push origin HEAD:fix/email-signature-raw-mime
