name: Change 7 Year 6 SATs read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change7-y6-sats-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect production catalogue state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/settings.json
          LESSONS_ID="$(jq -r '.result.bindings[] | select(.name == "LESSONS_KV") | .namespace_id' /tmp/settings.json)"
          R2_BUCKET="$(jq -r '.result.bindings[] | select(.name == "MATERIALS_R2") | .bucket_name' /tmp/settings.json)"
          test -n "$LESSONS_ID"
          echo "LESSONS_KV_ID=$LESSONS_ID"
          echo "R2_BUCKET=$R2_BUCKET"
          echo '=== curriculum:MATHS_L3 ==='
          npx --yes wrangler@4.125.0 kv key get 'curriculum:MATHS_L3' --namespace-id "$LESSONS_ID" --remote || true
          echo '=== curriculum:MATHS_Y6_EXTRA ==='
          npx --yes wrangler@4.125.0 kv key get 'curriculum:MATHS_Y6_EXTRA' --namespace-id "$LESSONS_ID" --remote || true
          echo '=== lesson:Y6M* keys ==='
          npx --yes wrangler@4.125.0 kv key list --namespace-id "$LESSONS_ID" --prefix 'lesson:Y6M' --remote
          echo '=== lesson:Y6SM* keys ==='
          npx --yes wrangler@4.125.0 kv key list --namespace-id "$LESSONS_ID" --prefix 'lesson:Y6SM' --remote
          echo '=== lesson:Y6MS* keys ==='
          npx --yes wrangler@4.125.0 kv key list --namespace-id "$LESSONS_ID" --prefix 'lesson:Y6MS' --remote
          echo '=== Candidate legacy SATS records ==='
          npx --yes wrangler@4.125.0 kv key list --namespace-id "$LESSONS_ID" --prefix 'lesson:' --remote > /tmp/all-lessons.json
          jq -r '.[].name' /tmp/all-lessons.json | grep -Ei 'Y6(S?M|MS)|SAT' | head -n 250 || true
          echo CHANGE7_READ_ONLY_AUDIT_PASS
