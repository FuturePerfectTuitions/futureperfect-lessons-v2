name: Change 7 Year 6 SATs R2 read-only audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change7-y6-sats-r2-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
      - name: Locate R2 binding
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/settings.json
          R2_BUCKET="$(jq -r '.result.bindings[] | select(.name=="MATERIALS_R2") | .bucket_name' /tmp/settings.json)"
          test -n "$R2_BUCKET"
          echo "R2_BUCKET=$R2_BUCKET" >> "$GITHUB_ENV"
      - name: List and filter R2 keys
        shell: bash
        run: |
          set -euo pipefail
          printf '[]' > /tmp/all.json
          cursor=''
          while :; do
            url="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then
              esc="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${esc}"
            fi
            page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success==true' <<<"$page" >/dev/null
            jq '[.result[]? | {key,size,etag}]' <<<"$page" > /tmp/page.json
            jq -s '.[0]+.[1]' /tmp/all.json /tmp/page.json > /tmp/next.json && mv /tmp/next.json /tmp/all.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          echo '=== SATS-related keys ==='
          jq -r '.[].key' /tmp/all.json | grep -Ei 'sats|Y6MS|Y6M0?[1-9]|Y6M1[0-9]' | sort || true
          echo '=== Total objects ==='
          jq 'length' /tmp/all.json
          echo CHANGE7_R2_AUDIT_PASS
