name: Guarded Ayla entitlement reconcile

on:
  push:
    branches: [ops/ayla-entitlement-20260908b]
    paths:
      - '.github/workflows/ops-ayla-entitlement-reconcile.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      TARGET_PORTAL_ID_SHA256: 75dce907a0bcfd76f3ef903ad953e45ab7f21b37b8323b7c64adaab2739a3ec9

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production and resolve bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          DBID="$(jq -r '.result.bindings[] | select(.name=="DB" and (.type=="d1" or .type=="d1_database")) | (.id // .database_id // empty)' /tmp/settings.json | head -n1)"
          test -n "$STUDENTS" && test "$STUDENTS" != null
          test -n "$DBID" && test "$DBID" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"
          echo "dbid=$DBID" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_GUARD=true'

      - name: Locate exact target and prepare profile-only patch
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix 'user:' --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          target=os.environ['TARGET_PORTAL_ID_SHA256']
          matches=[]
          for item in json.load(open('/tmp/keys.json',encoding='utf-8')):
              key=str(item.get('name') or '')
              if not key.startswith('user:'): continue
              suffix=key[5:].strip().lower()
              if hashlib.sha256(suffix.encode()).hexdigest()==target:
                  matches.append((key,suffix))
          print('TARGET_MATCH_COUNT=' + str(len(matches)))
          if len(matches)!=1: sys.exit(2)
          key,suffix=matches[0]
          p=subprocess.run(['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
          if p.returncode: sys.exit(3)
          user=json.loads(p.stdout)
          if str(user.get('role') or '').strip().lower()=='admin': sys.exit(4)
          before=json.loads(json.dumps(user))
          user['fullLibraries']=[]
          user['upsellViews']=['maths-level1','maths-level2']
          user['trialViews']=[]
          user['vrEligible']=True
          manual=user.get('manualAccess') if isinstance(user.get('manualAccess'),dict) else {}
          manual=json.loads(json.dumps(manual))
          specials=manual.get('specialBuckets') if isinstance(manual.get('specialBuckets'),list) else []
          manual['specialBuckets']=sorted(set([str(x) for x in specials if str(x).strip()] + ['VR_HOWTO']))
          user['manualAccess']=manual
          before_other=json.loads(json.dumps(before)); after_other=json.loads(json.dumps(user))
          for f in ('fullLibraries','upsellViews','trialViews','vrEligible','manualAccess'):
              before_other.pop(f,None); after_other.pop(f,None)
          if before_other != after_other:
              print('UNRELATED_FIELD_GUARD=false'); sys.exit(5)
          open('/tmp/target-key','w').write(key)
          open('/tmp/target-norm','w').write(suffix)
          json.dump(before,open('/tmp/before.json','w'),separators=(',',':'))
          json.dump(user,open('/tmp/after.json','w'),separators=(',',':'))
          print('PROFILE_PATCH_READY=true')
          PY

      - name: Audit current English 11+ releases before write
        env:
          DB_ID: ${{ steps.guard.outputs.dbid }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          target=open('/tmp/target-norm').read().strip(); account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['DB_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          def q(sql):
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',data=json.dumps({'sql':sql,'params':[target]}).encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(6)
              return ((body.get('result') or [{}])[0].get('results') or [])
          full=q("SELECT e.lesson_id,e.vr_access,e.source_batch_code,e.source_lesson_date FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code WHERE e.portal_user_id_norm=? AND b.subject='english' AND b.stream='11plus' ORDER BY e.source_lesson_date,e.lesson_id")
          pre=q("SELECT e.lesson_id,e.vr_access,e.batch_key,e.lesson_date FROM online_prelesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.batch_key WHERE e.portal_user_id_norm=? AND b.subject='english' AND b.stream='11plus' ORDER BY e.lesson_date,e.lesson_id")
          assignments=q("SELECT a.batch_key,b.school_year,b.stream FROM student_batch_assignments a LEFT JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm=? AND b.subject='english' AND b.stream='11plus' ORDER BY a.batch_key")
          print('ENGLISH_11PLUS_FULL_RELEASE_COUNT=' + str(len(full)))
          print('ENGLISH_11PLUS_PRELESSON_COUNT=' + str(len(pre)))
          print('ENGLISH_11PLUS_ASSIGNMENT_COUNT=' + str(len(assignments)))
          json.dump({'full':full,'pre':pre,'assign':assignments},open('/tmp/d1-before.json','w'),separators=(',',':'),sort_keys=True)
          PY

      - name: Persist only the target profile
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat /tmp/target-key)"
          ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$KEY")"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/after.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED}" \
            > /tmp/put.json
          jq -e '.success == true' /tmp/put.json >/dev/null
          echo 'KV_PATCH_APPLIED=true'

      - name: Ensure existing English 11+ rows carry VR access
        env:
          DB_ID: ${{ steps.guard.outputs.dbid }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          target=open('/tmp/target-norm').read().strip(); account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['DB_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          def q(sql):
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',data=json.dumps({'sql':sql,'params':[target]}).encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(7)
              return ((body.get('result') or [{}])[0].get('results') or [])
          q("UPDATE lesson_entitlements SET vr_access=1 WHERE portal_user_id_norm=? AND source_batch_code IN (SELECT batch_key FROM batch_definitions WHERE subject='english' AND stream='11plus')")
          q("UPDATE online_prelesson_entitlements SET vr_access=1 WHERE portal_user_id_norm=? AND batch_key IN (SELECT batch_key FROM batch_definitions WHERE subject='english' AND stream='11plus')")
          print('EXISTING_11PLUS_ENGLISH_VR_RECONCILED=true')
          PY

      - name: Verify Ayla state
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
          DB_ID: ${{ steps.guard.outputs.dbid }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat /tmp/target-key)"
          npx --yes wrangler@latest kv key get "$KEY" --namespace-id "$STUDENTS_KV_ID" --remote > /tmp/verify.json 2>/dev/null
          python3 - <<'PY'
          import json, os, sys, urllib.request
          before=json.load(open('/tmp/before.json')); verify=json.load(open('/tmp/verify.json'))
          if verify.get('fullLibraries') != []: sys.exit(2)
          if verify.get('upsellViews') != ['maths-level1','maths-level2']: sys.exit(3)
          if verify.get('trialViews') != []: sys.exit(4)
          if verify.get('vrEligible') is not True: sys.exit(5)
          manual=verify.get('manualAccess') if isinstance(verify.get('manualAccess'),dict) else {}
          if 'VR_HOWTO' not in (manual.get('specialBuckets') or []): sys.exit(6)
          if any(str(x).startswith('MATHS_') for x in verify.get('fullLibraries',[])): sys.exit(7)
          before_other=json.loads(json.dumps(before)); verify_other=json.loads(json.dumps(verify))
          for f in ('fullLibraries','upsellViews','trialViews','vrEligible','manualAccess'):
              before_other.pop(f,None); verify_other.pop(f,None)
          if before_other != verify_other: sys.exit(8)
          target=open('/tmp/target-norm').read().strip(); account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['DB_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          def q(sql):
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',data=json.dumps({'sql':sql,'params':[target]}).encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(9)
              return ((body.get('result') or [{}])[0].get('results') or [])
          bad=q("SELECT COUNT(*) c FROM lesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.source_batch_code WHERE e.portal_user_id_norm=? AND b.subject='english' AND b.stream='11plus' AND COALESCE(e.vr_access,0)<>1")
          badpre=q("SELECT COUNT(*) c FROM online_prelesson_entitlements e LEFT JOIN batch_definitions b ON b.batch_key=e.batch_key WHERE e.portal_user_id_norm=? AND b.subject='english' AND b.stream='11plus' AND COALESCE(e.vr_access,0)<>1")
          if int((bad[0] if bad else {}).get('c') or 0) or int((badpre[0] if badpre else {}).get('c') or 0): sys.exit(10)
          print('NO_FULL_LIBRARY_VERIFY=true')
          print('MATHS_L1_L2_UPSELL_VERIFY=true')
          print('VR_ELIGIBLE_VERIFY=true')
          print('VR_HOWTO_VERIFY=true')
          print('EXISTING_ENGLISH_11PLUS_VR_ROWS_VERIFY=true')
          print('UNRELATED_PROFILE_FIELDS_UNCHANGED=true')
          PY
