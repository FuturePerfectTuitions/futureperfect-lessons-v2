name: L3T1M02 secure transfer bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/l3t1m02-add-cumulative-20260912.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Generate one-off encrypted transfer keypair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p /tmp/l3t1m02-bootstrap
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/l3t1m02-bootstrap/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/l3t1m02-bootstrap/private.pem -pubout -out /tmp/l3t1m02-bootstrap/public.pem >/dev/null 2>&1
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/l3t1m02-bootstrap/private.pem \
            -out /tmp/l3t1m02-bootstrap/private.pem.enc \
            -pass env:CLOUDFLARE_API_TOKEN
          echo "PUBLIC_KEY_B64_BEGIN"
          base64 -w0 /tmp/l3t1m02-bootstrap/public.pem
          echo
          echo "PUBLIC_KEY_B64_END"
          echo "WRAPPED_PRIVATE_KEY_B64_BEGIN"
          base64 -w0 /tmp/l3t1m02-bootstrap/private.pem.enc
          echo
          echo "WRAPPED_PRIVATE_KEY_B64_END"
          echo "BOOTSTRAP PASS"
