name: Add L3T1M02 cumulative homework 2026-09-12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/l3t1m02-add-cumulative-20260912.yml

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0
  TARGET_KV_KEY: lesson:Y6M2.2
  EXPECTED_DISPLAY_ID: L3T1M02
  EXPECTED_TITLE: Number and Place Value II
  QUESTION_DRIVE_ID: 1ZsWzygh10Xa8pzeo1KXlzBKQtKWFigAR
  ANSWER_DRIVE_ID: 1GGQkvvs9jVgYBAPMwjKmTYYXSZAOqr_4
  QUESTION_SHA256: a1ac33df9284342c1b636d68d5aa205dcf138dfe6efc21383300e235d768ddd7
  ANSWER_SHA256: dcacb5ba2ecd09406fcc4c6e619445164772ddcd52ddf75df1c673234925833e
  NEW_SHEET_KEY: maths/level3/Y6M2.2/cumulative-homework/sheets/Cumulative Homework L3T1M02.pdf
  NEW_ANSWER_KEY: maths/level3/Y6M2.2/cumulative-homework/answers/Answer Pack Cumulative Homework L3T1M02.pdf

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download and verify the exact supplied PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l3t1m02
          download_drive() {
            local id="$1" out="$2" expected="$3"
            local u1="https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            local u2="https://drive.google.com/uc?export=download&id=${id}&confirm=t"
            if ! curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$u1" -o "$out"; then
              curl -fL --retry 2 --connect-timeout 20 --max-time 120 "$u2" -o "$out"
            fi
            head -c 4 "$out" | grep -q '%PDF'
            actual="$(sha256sum "$out" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "SHA mismatch: ${out} ${actual}" >&2; exit 1; }
          }
          download_drive "$QUESTION_DRIVE_ID" /tmp/l3t1m02/question.pdf "$QUESTION_SHA256"
          download_drive "$ANSWER_DRIVE_ID" /tmp/l3t1m02/answer.pdf "$ANSWER_SHA256"
          echo 'Exact PDF verification: PASS'

      - name: Guard production and snapshot current lesson
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          settings="$(curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          bucket="$(jq -r '.result.bindings[]? | select(.name=="MATERIALS_R2" and .type=="r2_bucket") | .bucket_name' <<<"$settings")"
          test -n "$ns"; test "$ns" != null; test -n "$bucket"; test "$bucket" != null
          echo "ns=$ns" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}" \
            -o /tmp/l3t1m02/lesson-before.json
          jq -e --arg id "$EXPECTED_DISPLAY_ID" --arg title "$EXPECTED_TITLE" '
            .lessonId=="Y6M2.2" and .displayIds["maths-level3"]==$id and .title==$title and
            ((.phase11Resources.core.cumulativeHomeworks // [])|length)==0 and
            ((.phase11Resources.elevenPlus.cumulativeHomeworks // [])|length)==0
          ' /tmp/l3t1m02/lesson-before.json >/dev/null
          echo "Production guard PASS: ${WORKER_NAME} / ${bucket}"

      - name: Upload pre-change lesson snapshot
        uses: actions/upload-artifact@v4
        with:
          name: l3t1m02-before-add-cumulative-20260912
          path: /tmp/l3t1m02/lesson-before.json
          retention-days: 30

      - name: Upload question and answer PDFs to R2 and verify hashes
        shell: bash
        env:
          BUCKET: ${{ steps.guard.outputs.bucket }}
        run: |
          set -euo pipefail
          npm install -g wrangler@${WRANGLER_VERSION} >/dev/null
          wrangler r2 object put "${BUCKET}/${NEW_SHEET_KEY}" --file=/tmp/l3t1m02/question.pdf --content-type='application/pdf' --remote >/dev/null
          wrangler r2 object put "${BUCKET}/${NEW_ANSWER_KEY}" --file=/tmp/l3t1m02/answer.pdf --content-type='application/pdf' --remote >/dev/null
          wrangler r2 object get "${BUCKET}/${NEW_SHEET_KEY}" --file=/tmp/l3t1m02/question-readback.pdf --remote >/dev/null
          wrangler r2 object get "${BUCKET}/${NEW_ANSWER_KEY}" --file=/tmp/l3t1m02/answer-readback.pdf --remote >/dev/null
          test "$(sha256sum /tmp/l3t1m02/question-readback.pdf | awk '{print $1}')" = "$QUESTION_SHA256"
          test "$(sha256sum /tmp/l3t1m02/answer-readback.pdf | awk '{print $1}')" = "$ANSWER_SHA256"
          echo 'R2 upload/hash verification: PASS'

      - name: Add cumulative pair to L3T1M02 LESSONS_KV
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
        run: |
          set -euo pipefail
          jq --arg sk "$NEW_SHEET_KEY" --arg ak "$NEW_ANSWER_KEY" '
            .phase11Resources.elevenPlus.cumulativeHomeworks = [{
              answerPack: {
                displayName: "Answer Pack Cumulative Homework L3T1M02.pdf",
                r2Key: $ak,
                resourceId: "Y6M2.2-cum-01-answer"
              },
              homework: {
                displayName: "Cumulative Homework L3T1M02.pdf",
                r2Key: $sk,
                resourceId: "Y6M2.2-cum-01-file"
              },
              pairId: "Y6M2.2-cum-01"
            }]
          ' /tmp/l3t1m02/lesson-before.json > /tmp/l3t1m02/lesson-after.json
          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          resp="$(curl -fsS -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/l3t1m02/lesson-after.json \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${enc}")"
          jq -e '.success == true' <<<"$resp" >/dev/null

      - name: Final production verification
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
          BUCKET: ${{ steps.guard.outputs.bucket }}
        run: |
          set -euo pipefail
          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          for i in $(seq 1 20); do
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${enc}" \
              -o /tmp/l3t1m02/final.json
            if jq -e --arg sk "$NEW_SHEET_KEY" --arg ak "$NEW_ANSWER_KEY" '
              ((.phase11Resources.core.cumulativeHomeworks // [])|length)==0 and
              ((.phase11Resources.elevenPlus.cumulativeHomeworks // [])|length)==1 and
              .phase11Resources.elevenPlus.cumulativeHomeworks[0].pairId=="Y6M2.2-cum-01" and
              .phase11Resources.elevenPlus.cumulativeHomeworks[0].homework.resourceId=="Y6M2.2-cum-01-file" and
              .phase11Resources.elevenPlus.cumulativeHomeworks[0].answerPack.resourceId=="Y6M2.2-cum-01-answer" and
              .phase11Resources.elevenPlus.cumulativeHomeworks[0].homework.r2Key==$sk and
              .phase11Resources.elevenPlus.cumulativeHomeworks[0].answerPack.r2Key==$ak
            ' /tmp/l3t1m02/final.json >/dev/null; then break; fi
            sleep 2
          done
          jq -e --arg sk "$NEW_SHEET_KEY" --arg ak "$NEW_ANSWER_KEY" '
            ((.phase11Resources.elevenPlus.cumulativeHomeworks // [])|length)==1 and
            .phase11Resources.elevenPlus.cumulativeHomeworks[0].homework.r2Key==$sk and
            .phase11Resources.elevenPlus.cumulativeHomeworks[0].answerPack.r2Key==$ak
          ' /tmp/l3t1m02/final.json >/dev/null
          wrangler r2 object get "${BUCKET}/${NEW_SHEET_KEY}" --file=/tmp/l3t1m02/final-question.pdf --remote >/dev/null
          wrangler r2 object get "${BUCKET}/${NEW_ANSWER_KEY}" --file=/tmp/l3t1m02/final-answer.pdf --remote >/dev/null
          test "$(sha256sum /tmp/l3t1m02/final-question.pdf | awk '{print $1}')" = "$QUESTION_SHA256"
          test "$(sha256sum /tmp/l3t1m02/final-answer.pdf | awk '{print $1}')" = "$ANSWER_SHA256"
          echo 'FINAL PASS: L3T1M02 cumulative homework pair added and verified in production.'
