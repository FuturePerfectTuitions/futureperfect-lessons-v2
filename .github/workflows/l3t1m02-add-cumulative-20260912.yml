name: L3T1M02 secure transfer bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/l3t1m02-add-cumulative-20260912.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate one-off encrypted transfer keypair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          mkdir -p .github/secure-transfer/l3t1m02
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/l3t1m02-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/l3t1m02-private.pem -pubout -out .github/secure-transfer/l3t1m02/public.pem >/dev/null 2>&1
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/l3t1m02-private.pem \
            -out .github/secure-transfer/l3t1m02/private.pem.enc \
            -pass env:CLOUDFLARE_API_TOKEN
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/secure-transfer/l3t1m02/public.pem .github/secure-transfer/l3t1m02/private.pem.enc
          git commit -m "Stage encrypted L3T1M02 transfer keypair"
          git push
          echo "BOOTSTRAP PASS"
