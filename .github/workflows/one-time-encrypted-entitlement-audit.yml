          1+oZRXk8y5E6mE7uZZGUXTZu7bymDsxbmkUbA5IzzbsIjQg1WbUuxQ8mKdrinccR
          CC9kDmB2/SbtvaynK5/4nt+NXXwODSUnx0W+5OuSvB3vll4z9cBrtXGTHRUbQ4ak
          hOgf9GgRHJb5YN0Ub44mWE0IkOPTqvOheEfhpupjaHlErIEtUdZjV42hPhUsmog=
          -----END CERTIFICATE-----
          CERT

          python3 - <<'PY' | openssl cms -encrypt -binary -aes256 -outform DER -recip /tmp/audit-cert.pem -out /tmp/live-entitlement-audit.p7m
          import json
          def load(path):
              with open(path, encoding='utf-8') as fh:
                  return json.load(fh)
          payload = {
              'profiles': load('/tmp/profiles.json'),
              'assignments': load('/tmp/assignments.json'),
              'lessonEntitlements': load('/tmp/lesson-entitlements.json'),
              'prelessonEntitlements': load('/tmp/prelesson-entitlements.json')
          }
          print(json.dumps(payload, ensure_ascii=False, separators=(',',':')))
          PY

          rm -f /tmp/profiles.json /tmp/assignments.json /tmp/lesson-entitlements.json /tmp/prelesson-entitlements.json /tmp/user-keys.json
          echo "Encrypted audit package created. Plain student entitlement data was not uploaded or printed."

      - name: Upload encrypted audit package
        uses: actions/upload-artifact@v4
        with:
          name: one-time-live-entitlement-audit-encrypted
          path: /tmp/live-entitlement-audit.p7m
          if-no-files-found: error
          retention-days: 1
