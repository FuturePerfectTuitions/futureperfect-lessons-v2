name: Step 10 Gate C bridge compatibility verification

# Historical Gate C originally deployed the shared production Worker directly.
# As of 2026-09-23 the canonical production deployment owner is
# admin-superuser-production-deploy.yml, which deploys the composed
# Quiz Bridge -> Admin Tools -> current Portal chain with rollback and live
# compatibility checks. This workflow is intentionally verification-only so
# a change to the Step 10 bridge cannot race a second production deployment.
on:
  pull_request:
    paths:
      - 'worker/src/index-step10-quiz-bridge.js'
      - 'worker/src/index-admin-tools.js'
      - 'worker/src/index-phase24-trial-vr.js'
      - 'worker/wrangler.toml'
      - 'worker/migrations/0011_quiz_launch_codes.sql'
      - 'tests/step10-quiz-bridge-static-verification.mjs'
      - 'tests/cp12-quiz-redeem-v2.mjs'
      - 'tests/shared-worker-entrypoint-preservation.mjs'
      - '.github/workflows/step10-gate-c-hidden-backend-deploy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Step 10 bridge syntax and contract
        run: |
          set -euo pipefail
          node --check worker/src/index-step10-quiz-bridge.js
          node --check worker/src/index-admin-tools.js
          node --check worker/src/index-phase24-trial-vr.js
          node tests/step10-quiz-bridge-static-verification.mjs
          node tests/cp12-quiz-redeem-v2.mjs
          node tests/shared-worker-entrypoint-preservation.mjs
          grep -Fq 'main = "src/index-step10-quiz-bridge.js"' worker/wrangler.toml
          grep -Fq "import currentWorker from './index-admin-tools.js';" worker/src/index-step10-quiz-bridge.js
          grep -Fq "import currentWorker from './index-phase24-trial-vr.js';" worker/src/index-admin-tools.js
      - name: Re-run established Portal regressions
        run: |
          set -euo pipefail
          node tests/admin-resource-replace-verification.mjs
          node tests/admin-tools-ui-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/admin-superuser-static-verification.mjs
          node --experimental-default-type=module tests/protected-view-stability-static-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs
          node tests/phase13-excel-sync-verification.mjs
          echo STEP10_GATE_C_COMPATIBILITY_VERIFICATION_PASS
