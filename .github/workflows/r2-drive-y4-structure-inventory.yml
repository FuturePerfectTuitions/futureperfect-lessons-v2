name: R2 Y4 path-family inventory

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-structure-inventory.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  inventory-y4-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - name: Inventory Year 4 R2 path families without mutation
        run: python3 scripts/r2_y4_path_inventory.py
      - name: Upload Year 4 R2 path inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-r2-path-inventory
          path: y4-r2-path-inventory.json
          if-no-files-found: warn
          retention-days: 30
