name: Drive Y4 active folder census

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-structure-inventory.yml

permissions:
  contents: read

concurrency:
  group: drive-y4-active-folder-census
  cancel-in-progress: false

jobs:
  census-year4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Census every active Drive folder beginning Y4
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/drive_y4_active_folder_census.py
      - name: Upload Year 4 active folder census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-active-folder-census
          path: y4-active-folder-census.json
          if-no-files-found: warn
          retention-days: 30
