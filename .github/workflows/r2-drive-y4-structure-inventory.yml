name: Y4 legacy R2 semantic mapping audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-structure-inventory.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  map-y4-legacy-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Map historical Y4E R2 families to current Drive lessons without mutation
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/y4_r2_semantic_mapping_audit.py
      - name: Upload Year 4 semantic mapping audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-r2-semantic-mapping-audit
          path: y4-r2-semantic-mapping-audit.json
          if-no-files-found: warn
          retention-days: 30
