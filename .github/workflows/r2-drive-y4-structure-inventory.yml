name: Y4 special Games/R2 overlap audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-structure-inventory.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  audit-y4-special-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Compare Year 4 Games/Mysteries Drive resources to scoped R2 without mutation
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/y4_special_games_r2_overlap.py
      - name: Upload special-area overlap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-special-games-r2-overlap
          path: y4-special-games-r2-overlap.json
          if-no-files-found: warn
          retention-days: 30
