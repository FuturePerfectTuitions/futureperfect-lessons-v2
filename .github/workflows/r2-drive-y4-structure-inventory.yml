name: R2 Drive Y4 structure inventory

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-structure-inventory.yml
      - scripts/r2_drive_y4_structure_inventory.py

permissions:
  contents: read

concurrency:
  group: r2-drive-y4-structure-inventory
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  inventory-year4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Inspect Year 4 Drive/R2 structure without mutation
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_y4_structure_inventory.py
      - name: Upload Year 4 structure inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-r2-structure-inventory
          path: y4-r2-structure-inventory.json
          if-no-files-found: warn
          retention-days: 30
