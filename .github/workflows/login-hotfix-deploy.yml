name: Portal login hotfix deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-hotfix-deploy.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      PAGES_ORIGIN: https://futureperfecttuitions.github.io/futureperfect-lessons-v2
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
      WRANGLER_VERSION: 4.125.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply login hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker = Path('worker/src/index-phase19-access.js')
          s = worker.read_text(encoding='utf-8')

          old_guard = """async function handleLogin(request, env, ctx) {
            const windowToken = clean(request.headers.get(WINDOW_HEADER));
            if (windowToken.length < 24) {
              return json({ error: 'WINDOW_SESSION_REQUIRED' }, { status: 401 }, request, env);
            }

            const response = await phase18Worker.fetch(request, env, ctx);"""
          new_guard = """async function handleLogin(request, env, ctx) {
            // Valid credentials must not depend on a custom browser-window header.
            // Window-close reauthentication is enforced by sessionStorage in the UI.
            const windowToken = clean(request.headers.get(WINDOW_HEADER));
            const response = await phase18Worker.fetch(request, env, ctx);"""
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)
          elif "if (windowToken.length < 24)" in s:
              raise SystemExit('Unexpected Phase19 login guard shape')

          # Remove the Phase19 global server-side window-header gate structurally,
          # irrespective of indentation. Trial one-use and content restrictions remain.
          needle = "if (url.pathname.startsWith('/api/v1/student/')) {"
          start = s.find(needle)
          if start >= 0:
              if 'WINDOW_SESSION_REQUIRED' not in s[start:start+1200]:
                  raise SystemExit('Found student gate but not expected window error')
              line_start = s.rfind('\n', 0, start) + 1
              brace = s.find('{', start)
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  ch = s[i]
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('Could not locate end of server window gate')
              while end < len(s) and s[end] in ' \t': end += 1
              if end < len(s) and s[end] == '\n': end += 1
              s = s[:line_start] + s[end:]
          elif 'WINDOW_SESSION_REQUIRED' in s:
              # Remaining occurrence is allowed only in historical helper/constant code,
              # not as an active fetch gate. The login guard above must already be gone.
              pass

          worker.write_text(s, encoding='utf-8')

          ui = Path('assets/phase19-access-ui.js')
          u = ui.read_text(encoding='utf-8')
          u = u.replace("const WINDOW_KEY = 'fpt_v2_window_token';", "const WINDOW_KEY = 'fpt_v2_window_login_v2';", 1)
          start = u.find('  window.fetch = async (input, init) => {')
          end_marker = '\n\n  function applyLoginError()'
          end = u.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Phase19 UI fetch wrapper boundaries not found')
          new_fetch = r'''  window.fetch = async (input, init) => {
            const url = requestUrl(input);
            const studentApi = Boolean(url?.pathname?.startsWith('/api/v1/student/'));
            const login = url?.pathname === '/api/v1/student/auth/login';
            const logout = url?.pathname === '/api/v1/student/auth/logout';

            // A successful login marks only this browser window. sessionStorage
            // survives reloads in the same window/tab but disappears when it is closed.
            // A fresh window therefore cannot reuse an older HttpOnly session cookie.
            if (studentApi && !login && !getWindowToken()) {
              return new Response(JSON.stringify({ error: 'WINDOW_LOGIN_REQUIRED' }), {
                status: 401,
                headers: { 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' }
              });
            }

            const response = await originalFetch(input, init);

            if (login) {
              const body = await response.clone().json().catch(() => null);
              lastLoginError = body?.error === 'TRIAL_ACCESS_ENDED'
                ? String(body?.message || TRIAL_ENDED_MESSAGE)
                : '';
              if (response.ok && body?.ok) {
                try { sessionStorage.setItem(WINDOW_KEY, 'authenticated'); } catch (_) {}
              } else {
                clearWindowToken();
              }
            } else if (studentApi && response.status === 401) {
              clearWindowToken();
            }

            if (logout && response.ok) clearWindowToken();

            if (/\/api\/v1\/student\/views\/[^/]+\/lessons$/.test(url?.pathname || '')) {
              response.clone().json().then(body => {
                listModes = new Map();
                for (const lesson of Array.isArray(body?.lessons) ? body.lessons : []) {
                  const mode = String(lesson?.accessMode || '');
                  if (!['trial', 'subject-preview'].includes(mode)) continue;
                  for (const code of [lesson?.lessonId, lesson?.displayLessonId].map(String).filter(Boolean)) {
                    listModes.set(code, mode);
                  }
                }
                queueApply();
              }).catch(() => {});
            }

            if (/\/api\/v1\/student\/lessons\/[^/]+$/.test(url?.pathname || '')) {
              response.clone().json().then(body => {
                const mode = String(body?.lesson?.accessMode || '');
                currentDetail = ['trial', 'subject-preview'].includes(mode)
                  ? {
                      mode,
                      lessonId: String(body.lesson.lessonId || ''),
                      displayLessonId: String(body.lesson.displayLessonId || ''),
                      message: String(body.lesson.accessMessage || (mode === 'trial' ? TRIAL_MESSAGE : SUBJECT_PREVIEW_MESSAGE))
                    }
                  : null;
                queueApply();
              }).catch(() => {});
            }

            return response;
          };'''
          u = u[:start] + new_fetch + u[end:]
          ui.write_text(u, encoding='utf-8')

          html = Path('phase11.html')
          h = html.read_text(encoding='utf-8')
          old = '<script src="assets/phase19-access-ui.js"></script>'
          new = '<script src="assets/phase19-access-ui.js?v=20260906-login-hotfix-2"></script>'
          if old in h:
              h = h.replace(old, new, 1)
          elif 'assets/phase19-access-ui.js?v=20260906-login-hotfix-' in h:
              import re
              h = re.sub(r'assets/phase19-access-ui\.js\?v=20260906-login-hotfix-\d+', 'assets/phase19-access-ui.js?v=20260906-login-hotfix-2', h, count=1)
          else:
              raise SystemExit('Phase19 UI script tag not found')
          html.write_text(h, encoding='utf-8')
          PY

          node --check worker/src/index-phase19-access.js
          node --check assets/phase19-access-ui.js
          grep -Fq "fpt_v2_window_login_v2" assets/phase19-access-ui.js
          grep -Fq "sessionStorage.setItem(WINDOW_KEY, 'authenticated')" assets/phase19-access-ui.js
          grep -Fq 'phase19-access-ui.js?v=20260906-login-hotfix-2' phase11.html
          ! grep -A8 -F "async function handleLogin(request, env, ctx)" worker/src/index-phase19-access.js | grep -Fq "WINDOW_SESSION_REQUIRED"

      - name: Commit hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/index-phase19-access.js assets/phase19-access-ui.js phase11.html
          if ! git diff --cached --quiet; then
            git commit -m 'Hotfix portal login window handling'
            git push origin HEAD:main
          fi

      - name: Preserve production Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/before.json
          jq -e '.success == true' /tmp/before.json >/dev/null
          plain() { jq -r --arg n "$1" '[.result.bindings[]|select(.name==$n and .type=="plain_text")|.text][0] // ""' /tmp/before.json; }
          field() { jq -r --arg n "$1" --arg t "$2" --arg f "$3" '[.result.bindings[]|select(.name==$n and .type==$t)|.[$f]][0] // ""' /tmp/before.json; }
          ENVIRONMENT_VALUE="$(plain ENVIRONMENT)"
          ORIGINS="$(plain ALLOWED_ORIGINS)"
          DEV_ALLOWLIST="$(plain DEV_LOGIN_ALLOWLIST)"
          PROD_ALLOWLIST="$(plain PROD_LOGIN_ALLOWLIST)"
          LOGIN_ENABLED="$(plain STUDENT_LOGIN_ENABLED)"
          STUDENTS_ID="$(field STUDENTS_KV kv_namespace namespace_id)"
          LESSONS_ID="$(field LESSONS_KV kv_namespace namespace_id)"
          DATABASE_ID="$(field DB d1 id)"
          R2_BUCKET="$(field MATERIALS_R2 r2_bucket bucket_name)"
          for v in "$STUDENTS_ID" "$LESSONS_ID" "$DATABASE_ID" "$R2_BUCKET"; do test -n "$v"; done
          jq -c '[.result.bindings[]|select((.type//"")|test("secret";"i"))|.name]|sort' /tmp/before.json >/tmp/secrets
          cat >worker/wrangler.login-hotfix.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index-phase19-access.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "${ENVIRONMENT_VALUE}"
          ALLOWED_ORIGINS = "${ORIGINS}"
          DEV_LOGIN_ALLOWLIST = "${DEV_ALLOWLIST}"
          PROD_LOGIN_ALLOWLIST = "${PROD_ALLOWLIST}"
          STUDENT_LOGIN_ENABLED = "${LOGIN_ENABLED}"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_ID}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_ID}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2_BUCKET}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DATABASE_ID}"
          EOF

      - name: Deploy Worker hotfix
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.login-hotfix.toml --keep-vars --message 'Hotfix portal login window handling'

      - name: Verify live authentication path
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"username":"definitely-not-a-user","password":"Aa1b"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = 401
          grep -Fq 'INVALID_LOGIN' /tmp/login.json
          ! grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/login.json

          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" "$WORKER_BASE/api/v1/student/session")"
          test "$code" = 401
          ! grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/session.json

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/after.json
          jq -c '[.result.bindings[]|select((.type//"")|test("secret";"i"))|.name]|sort' /tmp/after.json >/tmp/secrets-after
          cmp -s /tmp/secrets /tmp/secrets-after
          echo 'LOGIN_WORKER_HOTFIX_PASS'

      - name: Verify published frontend
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PAGES_ORIGIN/phase11.html?loginhotfix=${GITHUB_RUN_ID}" -o /tmp/phase11.html && grep -Fq 'phase19-access-ui.js?v=20260906-login-hotfix-2' /tmp/phase11.html && curl --fail --silent --show-error "$PAGES_ORIGIN/assets/phase19-access-ui.js?v=20260906-login-hotfix-2" -o /tmp/ui.js && grep -Fq 'fpt_v2_window_login_v2' /tmp/ui.js && grep -Fq "sessionStorage.setItem(WINDOW_KEY, 'authenticated')" /tmp/ui.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          echo 'LOGIN_FRONTEND_HOTFIX_PASS'
