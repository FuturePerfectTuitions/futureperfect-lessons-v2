name: Step 10 Gate D account preflight

# Gate D live bundled-frontend/session diagnostic: 2026-09-18.
on:
  push:
    branches:
      - ops/step10-gate-c-readonly-20260917-2012
    paths:
      - .github/workflows/step10-gate-d-account-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.134.0
      TEST_USER: kiaan1312
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect actual live bundled Portal frontend
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://lessons.futureperfect.education/'
          ROOT_STATUS="$(curl --silent --show-error --location -o /tmp/live-index.html -w '%{http_code}' "$ROOT" || true)"
          echo "LIVE_ROOT_STATUS=${ROOT_STATUS}"
          echo "LIVE_ROOT_BYTES=$(wc -c </tmp/live-index.html 2>/dev/null || echo 0)"
          [ "$ROOT_STATUS" = '200' ]
          BUNDLE_REL="$(grep -Eo 'src="\./assets/portal-[^"]+\.js"' /tmp/live-index.html | head -n1 | sed -E 's/^src="\.\///; s/"$//')"
          echo "LIVE_BUNDLE_PATH=${BUNDLE_REL}"
          [ -n "$BUNDLE_REL" ]
          BUNDLE_STATUS="$(curl --silent --show-error --location -o /tmp/live-portal.js -w '%{http_code}' "https://lessons.futureperfect.education/${BUNDLE_REL}" || true)"
          echo "LIVE_BUNDLE_STATUS=${BUNDLE_STATUS}"
          echo "LIVE_BUNDLE_BYTES=$(wc -c </tmp/live-portal.js 2>/dev/null || echo 0)"
          [ "$BUNDLE_STATUS" = '200' ]
          echo "LIVE_BUNDLE_SHA256=$(sha256sum /tmp/live-portal.js | awk '{print $1}')"
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('/tmp/live-portal.js', 'utf8');
          const markers = [
            'fpt-portal-v2-worker.futureperfectlessons.workers.dev',
            '/api/v1/student/session',
            '/api/v1/student/auth/login',
            '/api/v1/student/home',
            'credentials',
            'include',
            'localStorage',
            'sessionStorage',
            'fpt_v2_session',
            '/api/'
          ];
          for (const m of markers) console.log(`BUNDLE_HAS_${m.replace(/[^A-Za-z0-9]+/g,'_').toUpperCase()}=${s.includes(m)}`);
          const urls = [...new Set((s.match(/https:\/\/[^"'`\\\s)]+/g) || []))]
            .filter(x => /futureperfect|workers\.dev|pages\.dev|github\.io/i.test(x));
          console.log('BUNDLE_FPT_URLS=' + JSON.stringify(urls.slice(0,40)));
          const routeMatches = s.match(/\/api\/[A-Za-z0-9_./:-]+/g) || [];
          const routes = [...new Set(routeMatches)].sort();
          console.log('BUNDLE_API_ROUTES=' + JSON.stringify(routes.slice(0,120)));
          const needle = '/api/v1/student/session';
          const i = s.indexOf(needle);
          if (i >= 0) {
            const context = s.slice(Math.max(0,i-350), Math.min(s.length,i+550))
              .replace(/[\r\n\t]+/g,' ')
              .replace(/\s+/g,' ');
            console.log('BUNDLE_SESSION_CONTEXT=' + context);
          }
          NODE
          echo 'LIVE_PORTAL_BUNDLE_DIAGNOSTIC_PASS'

      - name: Verify authorised account currently has active L3 Maths 11plus assignment
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/London date +%F)"
          SQL="SELECT a.portal_user_id_norm,a.batch_key,b.subject,b.stream,b.maths_level,b.school_year,a.effective_from,a.effective_to,b.active_from,b.active_to FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm='${TEST_USER}' AND lower(b.subject)='maths' AND lower(b.stream)='11plus' AND (CASE WHEN b.maths_level BETWEEN 1 AND 3 THEN b.maths_level ELSE b.school_year-3 END)=3 AND a.effective_from<='${TODAY}' AND (a.effective_to IS NULL OR '${TODAY}'<a.effective_to) AND (b.active_from IS NULL OR b.active_from<='${TODAY}') AND (b.active_to IS NULL OR '${TODAY}'<b.active_to);"
          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute fpt_portal_v2_db --remote --command "$SQL" --yes | tee /tmp/gated-l3.txt
          grep -Fq '"portal_user_id_norm": "kiaan1312"' /tmp/gated-l3.txt || grep -Fq '"portal_user_id_norm":"kiaan1312"' /tmp/gated-l3.txt
          grep -Eq '"maths_level"[[:space:]]*:[[:space:]]*3' /tmp/gated-l3.txt
          echo 'GATE_D_AUTHORISED_ACCOUNT_L3_ACTIVE_PASS'

      - name: Inspect Portal session state without exposing token hashes
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT portal_user_id_norm,created_at,last_activity_at,idle_expires_at,revoked_at FROM student_sessions WHERE portal_user_id_norm='${TEST_USER}' ORDER BY created_at DESC LIMIT 5; SELECT portal_user_id_norm,created_at,updated_at FROM student_session_profiles WHERE portal_user_id_norm='${TEST_USER}' ORDER BY updated_at DESC LIMIT 5; SELECT COUNT(*) AS live_sessions FROM student_sessions WHERE portal_user_id_norm='${TEST_USER}' AND revoked_at IS NULL AND idle_expires_at>strftime('%Y-%m-%dT%H:%M:%fZ','now'); SELECT portal_user_id_norm,created_at,last_activity_at,idle_expires_at,revoked_at FROM student_sessions WHERE created_at>strftime('%Y-%m-%dT%H:%M:%fZ','now','-20 minutes') ORDER BY created_at DESC LIMIT 20;"
          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute fpt_portal_v2_db --remote --command "$SQL" --yes | tee /tmp/gated-session-state.txt
          echo 'GATE_D_SESSION_STATE_CAPTURED_NO_TOKENS'

      - name: Confirm preflight remained read-only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute fpt_portal_v2_db --remote --command "SELECT COUNT(*) AS launch_code_rows FROM quiz_launch_codes;" --yes | tee /tmp/gated-launch-count.txt
          echo 'GATE_D_ACCOUNT_PREFLIGHT_READ_ONLY_PASS'
