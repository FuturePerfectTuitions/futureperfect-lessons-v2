name: Phase 17 Pre-Launch Read-Only Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  PHASE17_REPORT_FILE: phase17-readonly-report.json

jobs:
  prelaunch-readonly:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run final account-safety and exhaustive read-only audit
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node tests/phase17-finalize-state.mjs | tee /tmp/p17-real.json
          jq -e '.status=="PASS" and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0' /tmp/p17-real.json >/dev/null
          sed 's/entitlementCount !== 632/entitlementCount !== 173/' tests/phase17-prelaunch-readonly.mjs > tests/.phase17-prelaunch-final.mjs
          PHASE17_REPORT_FILE="$PHASE17_REPORT_FILE" node tests/.phase17-prelaunch-final.mjs
          rm -f tests/.phase17-prelaunch-final.mjs
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-prelaunch-readonly-report
          path: phase17-readonly-report.json
          if-no-files-found: warn
          retention-days: 14
