name: Ops update Y6T1E04 Synonyms Formality and Punctuation

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-update-y6e4-synonyms-formality-punctuation.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard production target, update Y6T1E04, and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_KV_ID;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
          const auth = { Authorization: `Bearer ${token}` };

          const TARGET = 'cOQjXHnwzZj';
          const PLACEHOLDER = 'cO1Zionu8NC';
          const description = [
            'In this Year 6 English lesson, students develop vocabulary, spoken-language and punctuation skills through work on synonyms and antonyms, formal and informal language, and the accurate use of semicolons, colons and dashes.',
            '',
            'This lesson includes:',
            '✔ Identifying synonyms and antonyms and choosing more precise vocabulary',
            '✔ Using a thesaurus and selecting stronger, more effective word choices',
            '✔ Distinguishing between formal and informal vocabulary and speech',
            '✔ Matching formal and informal alternatives such as communicate/speak, profession/job and sufficient/enough',
            '✔ Recognising how audience and purpose affect the level of formality',
            '✔ Planning and delivering formal and informal speech for the same topic',
            '✔ Using semicolons to link closely related independent clauses and organise detailed lists',
            '✔ Using colons to expand an idea and introduce lists',
            '✔ Using dashes to connect clauses and mark out extra information',
            '',
            'Students move from vocabulary choice into spoken-language work, comparing formal and informal speeches and creating their own examples for different audiences. The lesson then focuses on punctuation, with clear explanations and practice using semicolons, colons and dashes in a range of sentence structures.',
            '',
            'By the end of the lesson, learners will be able to make more precise vocabulary choices, adapt language to suit context and audience, and use semicolons, colons and dashes more confidently in their writing.'
          ].join('\n');

          function video(code) {
            return {
              screenpal: code,
              contentUrl: `https://screenpal.com/content/video/${code}`,
              embedUrl: `https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,
              watchUrl: `https://go.screenpal.com/watch/${code}`
            };
          }

          async function getJson(key) {
            const r = await fetch(base + encodeURIComponent(key), { headers: auth });
            if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
            const text = await r.text();
            try { return JSON.parse(text); } catch { throw new Error(`${key} is not valid JSON`); }
          }

          async function putJson(key, value) {
            const r = await fetch(base + encodeURIComponent(key), {
              method: 'PUT',
              headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(value)
            });
            if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
          }

          function guardLesson(r) {
            if (r?.lessonId !== 'Y6E4') throw new Error(`Y6E4 identity mismatch: ${r?.lessonId}`);
            if (r?.subject !== 'english' || r?.active !== true) throw new Error('Y6E4 state mismatch');
            if (!Object.values(r?.displayIds || {}).includes('Y6T1E04')) throw new Error('Y6E4 display ID mismatch');
            const title = String(r?.title || '').toLowerCase();
            if (!title.includes('synonym') || !title.includes('formal') || !title.includes('informal')) {
              throw new Error(`Y6E4 title guard failed: ${r?.title}`);
            }
            if (!r?.core || !Object.prototype.hasOwnProperty.call(r.core, 'video')) throw new Error('Y6E4 core.video missing');
          }

          (async () => {
            const curriculum = await getJson('curriculum:ENGLISH_Y6');
            if (curriculum?.curriculumCode !== 'ENGLISH_Y6') throw new Error('ENGLISH_Y6 curriculum identity mismatch');
            if (!Array.isArray(curriculum.lessonIds) || !curriculum.lessonIds.includes('Y6E4')) {
              throw new Error('ENGLISH_Y6 does not contain Y6E4');
            }

            const before = await getJson('lesson:Y6E4');
            guardLesson(before);
            const currentScreenPal = before?.core?.video?.screenpal ?? null;
            if (![null, PLACEHOLDER, TARGET].includes(currentScreenPal)) {
              throw new Error(`Y6E4 has an unexpected existing ScreenPal video: ${currentScreenPal}`);
            }

            const next = JSON.parse(JSON.stringify(before));
            next.description = description;
            next.core.video = video(TARGET);
            next.contentStatus = {
              ...(next.contentStatus || {}),
              description: 'available',
              mainVideo: 'available',
              ownerConfirmedPending: false
            };

            await putJson('lesson:Y6E4', next);

            let verified;
            for (let attempt = 1; attempt <= 6; attempt++) {
              verified = await getJson('lesson:Y6E4');
              const ok = verified?.core?.video?.screenpal === TARGET &&
                verified?.description === description &&
                verified?.contentStatus?.description === 'available' &&
                verified?.contentStatus?.mainVideo === 'available' &&
                verified?.contentStatus?.ownerConfirmedPending === false;
              if (ok) break;
              if (attempt < 6) await sleep(2000);
            }

            guardLesson(verified);
            if (verified?.core?.video?.screenpal !== TARGET) throw new Error('Y6E4 ScreenPal verification failed');
            if (verified?.description !== description) throw new Error('Y6E4 description verification failed');
            if (verified?.contentStatus?.description !== 'available' || verified?.contentStatus?.mainVideo !== 'available' || verified?.contentStatus?.ownerConfirmedPending !== false) {
              throw new Error('Y6E4 content status verification failed');
            }

            console.log('Y6E4_VERIFIED=' + JSON.stringify({
              lessonId: verified.lessonId,
              displayId: verified.displayIds['english-year6'],
              title: verified.title,
              screenpal: verified.core.video.screenpal,
              contentStatus: verified.contentStatus
            }));
            console.log('OPS_UPDATE_Y6E4_PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
