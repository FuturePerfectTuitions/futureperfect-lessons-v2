name: Step 10 Gate D live frontend probe

on:
  push:
    branches:
      - ops/step10-gate-c-readonly-20260917-2012
    paths:
      - .github/workflows/step10-gate-d-live-frontend-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live compiled Portal source map for API v2 authority
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://lessons.futureperfect.education'
          ASSET='portal-CeIaLZ5y.js'
          curl --fail --silent --show-error --location --max-time 30 "$BASE/assets/$ASSET.map?gate_d_probe=20260918e" -o /tmp/bundle.map
          jq -e '.version == 3 and (.sources|length) > 0 and (.sourcesContent|length) > 0' /tmp/bundle.map >/dev/null
          echo 'SOURCE_NAMES_BEGIN'
          jq -r '.sources[]' /tmp/bundle.map
          echo 'SOURCE_NAMES_END'
          echo 'API_V2_SOURCE_SNIPPETS_BEGIN'
          jq -r '[.sources,.sourcesContent] | transpose[] | select(.[1] != null and (.[1] | contains("/api/v2"))) | "SOURCE=" + .[0] + "\n" + .[1]' /tmp/bundle.map | sed -n '1,1600p'
          echo 'API_V2_SOURCE_SNIPPETS_END'
          echo 'GATE_D_SOURCE_MAP_AUTHORITY_PROBE_PASS'
