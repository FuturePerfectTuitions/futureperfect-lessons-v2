name: Phase 11 VR How To top-level static verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'config.js'
      - 'assets/phase11-vr-howto.js'
      - 'worker/src/index-phase11-efficient.js'
      - 'worker/src/phase11-vr-howto.js'
      - 'tests/phase11-vr-howto-top-level-static-verification.mjs'
      - '.github/workflows/phase11-vr-howto-top-level-static-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify top-level VR How To rule
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/phase11-vr-howto.js
          node --check worker/src/phase11-vr-howto.js
          node --check worker/src/index-phase11-efficient.js
          node --experimental-default-type=module tests/phase11-vr-howto-top-level-static-verification.mjs
