name: Phase 11 canonical catalogue guarded Cloudflare apply

on:
  pull_request:
    branches: [main]
    paths: [.github/phase11-apply-trigger.txt]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  apply:
    name: Apply and verify Phase 11 real catalogue
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'ops/phase11-catalogue-apply' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact trigger branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard trigger-only apply branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..HEAD)" = ".github/phase11-apply-trigger.txt"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate immutable Phase 11 package
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/phase11-catalogue.mjs
          node --check scripts/phase11-test-personas.mjs
          node --check scripts/phase11-apply-package.mjs
          node --check scripts/phase11-kv-remote-verify.mjs
          node --check scripts/phase11-kv-snapshot.mjs
          node --check scripts/phase11-verify-test-d1.mjs
          node --check worker/src/index-phase11-final.js
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs
          node --experimental-default-type=module tests/phase11-test-personas-static-verification.mjs
          node --experimental-default-type=module tests/phase11-apply-package-static-verification.mjs
          bash -n tests/phase11-api-verification.sh
          node --check tests/phase11-browser-verification.mjs
          grep -Fq 'main = "src/index-phase10-history.js"' worker/wrangler.toml
          ! grep -Fq 'assets/phase11-resources.js' phase10.html
          grep -Fq 'assets/phase11-resources.js' phase11.html
          grep -Fq 'assets/phase11-protected-bridge.js' phase11.html
          grep -Fq 'assets/phase11-other.js' phase11.html
          rm -rf /tmp/phase11-apply
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/phase11-apply >/tmp/phase11-package.log
          jq -e '.phase==11 and .catalogueLessons==369 and .catalogueCurricula==11 and .lessonsKvWrites==380 and .r2References==1669 and .testPersonas==9 and .testPersonaEntitlementRows==447 and .testPersonaVrRows==64 and .historyRegressionRows==5 and .developmentAllowlistCount==16' /tmp/phase11-apply/phase11-apply-summary.json >/dev/null

      - name: Guard isolated V2 development bindings and login state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.compatibility_date == "2026-08-20"' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ALLOWED_ORIGINS" and .type=="plain_text" and .text=="https://futureperfecttuitions.github.io")' /tmp/settings.json >/dev/null
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)"
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings.json)"
          test "$R2" = 'fpt-materials-dev'
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done
          CURRENT="$(jq -r '.result.bindings[] | select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text") | .text' /tmp/settings.json)"
          OLD='test0101,test0202,test0303,test0404,test0505,test0606,test0707'
          TARGET="$(cat /tmp/phase11-apply/phase11-dev-allowlist.txt)"
          case "$CURRENT" in "$OLD"|"$TARGET") ;; *) echo "Unexpected development allowlist; refusing Phase 11 apply." >&2; exit 1;; esac
          LOGIN_ENABLED="$(jq -r '[.result.bindings[] | select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text") | .text][0] // ""' /tmp/settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login appears enabled; refusing Phase 11 apply.' >&2; exit 1;; esac
          jq '{compatibility_date:.result.compatibility_date, bindings:[.result.bindings[]|{name,type,namespace_id,bucket_name,database_id,text:(if (.name=="ENVIRONMENT" or .name=="ALLOWED_ORIGINS" or .name=="DEV_LOGIN_ALLOWLIST" or .name=="STUDENT_LOGIN_ENABLED") then .text else null end)}]}' /tmp/settings.json >/tmp/settings-sanitized.json
          { echo "students=$STUDENTS"; echo "lessons=$LESSONS"; echo "r2=$R2"; echo "db=$DB"; echo "target_allowlist=$TARGET"; } >> "$GITHUB_OUTPUT"

      - name: Confirm deployed Phase 10 security baseline before writes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-before.bin
          for marker in SPECIAL_ACCESS_REQUIRED MOCK_PASSWORD_INCORRECT MOCK_DAILY_PASSWORDS QUIZ_NOT_AVAILABLE answer_view_tokens previous; do
            grep -aFq "$marker" /tmp/worker-before.bin
          done

      - name: Snapshot all Phase 11 write targets and protected special keys
        shell: bash
        env:
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase11-backup
          cp /tmp/worker-before.bin /tmp/phase11-backup/worker-before.bin
          cp /tmp/settings-sanitized.json /tmp/phase11-backup/settings-sanitized.json
          node scripts/phase11-kv-snapshot.mjs "$LESSONS_KV_ID" /tmp/phase11-apply/phase11-lessons-kv-bulk.json /tmp/phase11-backup/lessons-write-targets-before.json
          node scripts/phase11-kv-snapshot.mjs "$STUDENTS_KV_ID" /tmp/phase11-apply/phase11-test-students-kv-bulk.json /tmp/phase11-backup/test-users-before.json
          cat >/tmp/special-keys.json <<'JSON'
          ["special:Y4MAssT1","special:Y4MAssT2","special:Y5MAssT1","special:Y5MAssT2","special:VR_HOWTO","special:MOCKS"]
          JSON
          node scripts/phase11-kv-snapshot.mjs "$LESSONS_KV_ID" /tmp/special-keys.json /tmp/phase11-backup/special-keys-before.json
          jq -e '[.values[] | select(. != null)] | length == 6' /tmp/phase11-backup/special-keys-before.json >/dev/null
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          IDS="'test0707','testy2e','testy2m','testy2em','testy4em','testy411m','testy511e','testy5em','testy5e','testy511em'"
          $W d1 execute fpt_portal_v2_db --remote --command "SELECT * FROM lesson_entitlements WHERE portal_user_id_norm IN (${IDS}) ORDER BY portal_user_id_norm, lesson_id;" --json >/tmp/phase11-backup/d1-test-entitlements-before.json

      - name: Upload pre-write rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase11-prewrite-backup
          path: /tmp/phase11-backup
          if-no-files-found: error
          retention-days: 30

      - name: Guard test user keys against unexpected pre-existing records
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const snap = JSON.parse(fs.readFileSync('/tmp/phase11-backup/test-users-before.json','utf8'));
          const planned = JSON.parse(fs.readFileSync('/tmp/phase11-apply/phase11-test-students-kv-bulk.json','utf8'));
          const p = new Map(planned.map(x => [x.key, x.value]));
          for (const key of snap.keys) {
            const existing = snap.values[key];
            if (existing !== null && existing !== p.get(key)) {
              throw new Error(`Unexpected pre-existing test user record at ${key}; refusing overwrite.`);
            }
          }
          NODE

      - name: Generate isolated Phase 11 runtime config
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
          R2_BUCKET: ${{ steps.guard.outputs.r2 }}
          DB_ID: ${{ steps.guard.outputs.db }}
          TARGET_ALLOWLIST: ${{ steps.guard.outputs.target_allowlist }}
        run: |
          set -euo pipefail
          cat >worker/wrangler.phase11.runtime.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase11-final.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "${TARGET_ALLOWLIST}"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_KV_ID}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_KV_ID}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2_BUCKET}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB_ID}"
          EOF

      - name: Dry-run Phase 11 Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.phase11.runtime.toml --dry-run --outdir /tmp/phase11-worker-build >/tmp/phase11-dry-run.log
          grep -R -aFq 'VIDEO_URL_REQUIRED' /tmp/phase11-worker-build
          grep -R -aFq 'p11elevenother' /tmp/phase11-worker-build

      - name: Deploy backwards-compatible Phase 11 Worker to V2 development
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.phase11.runtime.toml --keep-vars --message 'Phase 11 real catalogue and resources' >/tmp/phase11-deploy.log

      - name: Apply canonical LESSONS_KV catalogue
        shell: bash
        env:
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          if node <<'NODE'
          const fs = require('fs');
          const snap = JSON.parse(fs.readFileSync('/tmp/phase11-backup/lessons-write-targets-before.json', 'utf8'));
          const planned = JSON.parse(fs.readFileSync('/tmp/phase11-apply/phase11-lessons-kv-bulk.json', 'utf8'));
          const exact = snap.keys.length === planned.length && planned.every(item => snap.values[item.key] === item.value);
          process.exit(exact ? 0 : 1);
          NODE
          then
            echo 'Remote LESSONS_KV already exactly matches the canonical Phase 11 package; skipping redundant bulk write.' | tee /tmp/phase11-lessons-kv-put.log
          else
            npx --yes wrangler@${WRANGLER_VERSION} kv bulk put /tmp/phase11-apply/phase11-lessons-kv-bulk.json --namespace-id "$LESSONS_KV_ID" --remote >/tmp/phase11-lessons-kv-put.log
          fi

      - name: Seed owner-requested development test users
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          if node <<'NODE'
          const fs = require('fs');
          const snap = JSON.parse(fs.readFileSync('/tmp/phase11-backup/test-users-before.json', 'utf8'));
          const planned = JSON.parse(fs.readFileSync('/tmp/phase11-apply/phase11-test-students-kv-bulk.json', 'utf8'));
          const exact = snap.keys.length === planned.length && planned.every(item => snap.values[item.key] === item.value);
          process.exit(exact ? 0 : 1);
          NODE
          then
            echo 'Remote STUDENTS_KV TestY* records already exactly match the canonical Phase 11 package; skipping redundant bulk write.' | tee /tmp/phase11-students-kv-put.log
          else
            npx --yes wrangler@${WRANGLER_VERSION} kv bulk put /tmp/phase11-apply/phase11-test-students-kv-bulk.json --namespace-id "$STUDENTS_KV_ID" --remote >/tmp/phase11-students-kv-put.log
          fi

      - name: Seed owner test entitlements and real-catalogue history regression
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --file /tmp/phase11-apply/phase11-test-entitlements.sql --yes >/tmp/phase11-test-d1.log
          $W d1 execute fpt_portal_v2_db --remote --file /tmp/phase11-apply/phase11-history-entitlements.sql --yes >/tmp/phase11-history-d1.log

      - name: Exact-verify remote KV values
        shell: bash
        env:
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          node scripts/phase11-kv-remote-verify.mjs "$LESSONS_KV_ID" /tmp/phase11-apply/phase11-lessons-kv-bulk.json >/tmp/phase11-lessons-kv-verify.json
          node scripts/phase11-kv-remote-verify.mjs "$STUDENTS_KV_ID" /tmp/phase11-apply/phase11-test-students-kv-bulk.json >/tmp/phase11-students-kv-verify.json
          jq -e '.verifiedKeys == 380 and .status == "PASS"' /tmp/phase11-lessons-kv-verify.json >/dev/null
          jq -e '.verifiedKeys == 9 and .status == "PASS"' /tmp/phase11-students-kv-verify.json >/dev/null

      - name: Verify test/history D1 entitlements
        shell: bash
        run: |
          set -euo pipefail
          IDS="'test0707','testy2e','testy2m','testy2em','testy4em','testy411m','testy511e','testy5em','testy5e','testy511em'"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --command "SELECT portal_user_id_norm, COUNT(*) AS entitlement_count, SUM(vr_access) AS vr_count FROM lesson_entitlements WHERE portal_user_id_norm IN (${IDS}) GROUP BY portal_user_id_norm ORDER BY portal_user_id_norm;" --json >/tmp/phase11-d1-counts.json
          node scripts/phase11-verify-test-d1.mjs /tmp/phase11-d1-counts.json >/tmp/phase11-d1-verification.json

      - name: Prove Phase 10 special catalogue keys were not changed
        shell: bash
        env:
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          node scripts/phase11-kv-snapshot.mjs "$LESSONS_KV_ID" /tmp/special-keys.json /tmp/special-keys-after.json >/tmp/special-snapshot-after.log
          diff -u /tmp/phase11-backup/special-keys-before.json /tmp/special-keys-after.json

      - name: Verify deployed Phase 11 security and feature markers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-after.bin
          for marker in SPECIAL_ACCESS_REQUIRED MOCK_PASSWORD_INCORRECT MOCK_DAILY_PASSWORDS QUIZ_NOT_AVAILABLE answer_view_tokens previous VIDEO_URL_REQUIRED p11elevenother; do
            grep -aFq "$marker" /tmp/worker-after.bin
          done

      - name: Run deployed Phase 11 API acceptance
        shell: bash
        run: bash tests/phase11-api-verification.sh

      - name: Wait for Phase 11 GitHub Pages proof page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://futureperfecttuitions.github.io/futureperfect-lessons-v2/phase11.html'
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error "$URL" --output /tmp/phase11-page.html && grep -Fq 'assets/phase11-resources.js' /tmp/phase11-page.html && grep -Fq 'assets/phase11-other.js' /tmp/phase11-page.html; then exit 0; fi
            sleep 5
          done
          echo 'Phase 11 GitHub Pages proof page did not become available in time.' >&2
          exit 1

      - name: Install Playwright driver
        shell: bash
        run: npm install --no-save --no-package-lock playwright@latest >/dev/null

      - name: Run real Chrome Phase 11 acceptance
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          google-chrome --version
          node tests/phase11-browser-verification.mjs

      - name: Collect Phase 11 verification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/phase11-apply
          for f in /tmp/phase11-package.log /tmp/phase11-dry-run.log /tmp/phase11-deploy.log /tmp/phase11-lessons-kv-verify.json /tmp/phase11-students-kv-verify.json /tmp/phase11-d1-verification.json /tmp/phase11-d1-counts.json /tmp/phase11-test-d1.log /tmp/phase11-history-d1.log; do
            if [ -f "$f" ]; then cp "$f" artifacts/phase11-apply/; fi
          done
          cp /tmp/phase11-apply/phase11-apply-summary.json artifacts/phase11-apply/ 2>/dev/null || true

      - name: Upload Phase 11 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-catalogue-acceptance
          path: |
            artifacts/phase11-apply
            artifacts/phase11-browser
          if-no-files-found: warn
          retention-days: 30