name: Fix importer - apply source and regression suite

on:
  push:
    branches:
      - fix/importer-publish-email-per-lesson-2026-09-16
    paths:
      - docs/rebuild/FIX_IMPORTER_APPLY_V2_TRIGGER.md

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/importer-publish-email-per-lesson-2026-09-16
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact source patches
        run: python3 scripts/fix-importer-apply-source.py

      - name: Run importer and email regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check worker/src/admin-prepared-access-publisher.js
          node --check worker/src/admin-lesson-release-import.js
          node --check worker/src/parent-email.js
          node tests/admin-prepared-access-publisher-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/admin-lesson-release-y6-sats-verification.mjs
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-import-auto-process-static-verification.mjs
          node tests/admin-import-manual-email-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-idempotency-verification.mjs
          node tests/parent-email-test-routing-verification.mjs

      - name: Assert narrow source diff and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          for required in \
            worker/src/admin-lesson-release-import.js \
            worker/src/parent-email.js \
            tests/admin-lesson-release-import-verification.mjs \
            tests/parent-email-completed-status-verification.mjs; do
            echo "$changed" | grep -Fx "$required" >/dev/null
          done
          unexpected="$(echo "$changed" | grep -Ev '^(worker/src/admin-lesson-release-import\.js|worker/src/parent-email\.js|tests/admin-lesson-release-import-verification\.mjs|tests/parent-email-completed-status-verification\.mjs)$' || true)"
          test -z "$unexpected"
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/admin-lesson-release-import.js worker/src/parent-email.js tests/admin-lesson-release-import-verification.mjs tests/parent-email-completed-status-verification.mjs
          git commit -m 'Fix importer prepared access publication and per-lesson email status'
          git push origin HEAD:fix/importer-publish-email-per-lesson-2026-09-16
