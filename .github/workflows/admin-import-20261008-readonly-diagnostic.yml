name: October 8 Admin import five-row read-only diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose-admin-import-20261008-readonly.mjs'
      - '.github/workflows/admin-import-20261008-readonly-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-admin-import-20261008-readonly.mjs'
      - '.github/workflows/admin-import-20261008-readonly-diagnostic.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and no-mutation guard
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/diagnose-admin-import-20261008-readonly.mjs
          ! grep -Eq 'kvPut\(|method:[[:space:]]*["\x27](PUT|DELETE|PATCH)["\x27]|deploy|send_email|EMAIL.send' scripts/diagnose-admin-import-20261008-readonly.mjs
          echo 'ADMIN_IMPORT_READONLY_DIAGNOSTIC_STATIC_PASS'

  inspect:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose October 8 CSV footprint using read-only API
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/diagnose-admin-import-20261008-readonly.mjs
