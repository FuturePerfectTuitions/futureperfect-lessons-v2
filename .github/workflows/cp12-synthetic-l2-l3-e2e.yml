name: CP12 guarded synthetic L2 L3 E2E
on:
  push:
    branches: [feature/cp12-e2e-synthetic-fixture-2026-09-21]
    paths: ['.github/workflows/cp12-synthetic-l2-l3-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp12-synthetic-l2-l3-e2e-production
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
  READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  BRIDGE_WORKER: fpt-portal-v2-worker
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  EXPECTED_STUDENT_VERSION: 51d725cc-d21e-4aad-9c64-24149c640637
  EXPECTED_BROWSER_VERSION: f8a64bc8-8192-4400-9e45-8f1a1de10019
  EXPECTED_BRIDGE_VERSION: 2631c603-89eb-495c-b0e4-c2d87272a5b2
  EXPECTED_QUIZ_VERSION: 80d4942e-616c-4539-91f1-9f2daf05cfc1
  PORTAL_ROOT: https://lessons.futureperfect.education
  QUIZ_ROOT: https://quiz.futureperfect.education
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed pre-run source corrections and freeze executable
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/cp12-e2e-synthetic-fixture.mjs')
          s=p.read_text()
          replacements=[
            ("import { opaqueAccessScopeId } from '../rebuild/adminops/src/lib/compatibility.mjs';", "import { opaqueAccessScopeId } from '../rebuild/student/src/lib/access-scope.mjs';", 'authoritative Student access-scope derivation'),
            ("VALUES(?,?,1,0,'excel',?,?,?,?,?)", "VALUES(?,?,1,0,'excel',?,?,?,?)", 'entitlement placeholder correction'),
            ("batches: [clean(persona.batch.batch_key)],", "batches: [],", 'synthetic legacy-batches narrowing'),
          ]
          for old,new,label in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one {label}, found {s.count(old)}')
              s=s.replace(old,new)

          old_func=r'''function canonicalLessonCodes(globalReadModel, level, count = 2) {
            const viewId = `maths-level${level}`;
            const lessons = globalReadModel?.catalogues?.[viewId]?.lessons || [];
            const re = new RegExp(`^L${level}T\\d+M\\d+$`, 'i');
            const out = [];
            for (const lesson of lessons) {
              const code = [lesson?.lessonId, lesson?.displayLessonId].map(clean).find(value => re.test(value));
              if (code && !out.includes(code.toUpperCase())) out.push(code.toUpperCase());
              if (out.length >= count) break;
            }
            assert(out.length === count, `Could not select ${count} canonical L${level} lessons from prepared global catalogue`);
            return out;
          }'''.replace('          ','')
          new_func=r'''function canonicalLessonFixture(globalReadModel, level, count = 2) {
            const viewId = `maths-level${level}`;
            const lessons = globalReadModel?.catalogues?.[viewId]?.lessons || [];
            const re = new RegExp(`^L${level}T\\d+M\\d+$`, 'i');
            const rows = [];
            const seenLessonIds = new Set();
            const seenReleaseCodes = new Set();
            for (const lesson of lessons) {
              const lessonId = clean(lesson?.lessonId);
              const releaseCode = [lesson?.displayLessonId, lesson?.lessonId].map(clean).find(value => re.test(value));
              if (!lessonId || !releaseCode) continue;
              const code = releaseCode.toUpperCase();
              if (seenLessonIds.has(lessonId) || seenReleaseCodes.has(code)) continue;
              seenLessonIds.add(lessonId);
              seenReleaseCodes.add(code);
              rows.push({ lessonId, releaseCode: code });
              if (rows.length >= count) break;
            }
            assert(rows.length === count, `Could not select ${count} canonical L${level} lesson fixtures from prepared global catalogue`);
            return {
              lessonIds: rows.map(row => row.lessonId),
              releaseCodes: rows.map(row => row.releaseCode)
            };
          }'''.replace('          ','')
          if s.count(old_func)!=1:
              raise SystemExit(f'expected one canonicalLessonCodes function, found {s.count(old_func)}')
          s=s.replace(old_func,new_func)

          old_personas='''  const nonce = crypto.randomBytes(4).toString('hex');
          state.personas = [
            { level: 2, label: 'L2', user: `cp12e2el2${runId}${nonce}`.toLowerCase(), password: password4(), batch: l2Batch, assignmentId: Number(gaps[0].assignment_id), lessonCodes: canonicalLessonCodes(global.payload, 2, 2) },
            { level: 3, label: 'L3', user: `cp12e2el3${runId}${nonce}`.toLowerCase(), password: password4(), batch: l3Batch, assignmentId: Number(gaps[1].assignment_id), lessonCodes: canonicalLessonCodes(global.payload, 3, 2) }
          ];'''.replace('          ','')
          new_personas='''  const nonce = crypto.randomBytes(4).toString('hex');
          const l2Fixture = canonicalLessonFixture(global.payload, 2, 2);
          const l3Fixture = canonicalLessonFixture(global.payload, 3, 2);
          state.personas = [
            { level: 2, label: 'L2', user: `cp12e2el2${runId}${nonce}`.toLowerCase(), password: password4(), batch: l2Batch, assignmentId: Number(gaps[0].assignment_id), lessonCodes: l2Fixture.lessonIds, expectedReleaseCodes: l2Fixture.releaseCodes },
            { level: 3, label: 'L3', user: `cp12e2el3${runId}${nonce}`.toLowerCase(), password: password4(), batch: l3Batch, assignmentId: Number(gaps[1].assignment_id), lessonCodes: l3Fixture.lessonIds, expectedReleaseCodes: l3Fixture.releaseCodes }
          ];'''.replace('          ','')
          if s.count(old_personas)!=1:
              raise SystemExit(f'expected one persona fixture block, found {s.count(old_personas)}')
          s=s.replace(old_personas,new_personas)

          old_l2="assert(sameSet(context?.releasedL2LessonCodes || [], persona.lessonCodes), 'L2 release list is not exactly the explicit L2 entitlements');"
          new_l2="const actual = context?.releasedL2LessonCodes || []; if (!sameSet(actual, persona.expectedReleaseCodes)) console.log(`CP12_L2_RELEASE_CONTEXT_MISMATCH expected=${JSON.stringify(persona.expectedReleaseCodes)} actual=${JSON.stringify(actual)}`); assert(sameSet(actual, persona.expectedReleaseCodes), 'L2 release list is not exactly the explicit L2 entitlement release codes');"
          if s.count(old_l2)!=1:
              raise SystemExit(f'expected one L2 release assertion, found {s.count(old_l2)}')
          s=s.replace(old_l2,new_l2)
          old_l3="assert(sameSet(context?.releasedL3LessonCodes || [], persona.lessonCodes), 'L3 release list is not exactly the explicit L3 entitlements');"
          new_l3="const actual = context?.releasedL3LessonCodes || []; if (!sameSet(actual, persona.expectedReleaseCodes)) console.log(`CP12_L3_RELEASE_CONTEXT_MISMATCH expected=${JSON.stringify(persona.expectedReleaseCodes)} actual=${JSON.stringify(actual)}`); assert(sameSet(actual, persona.expectedReleaseCodes), 'L3 release list is not exactly the explicit L3 entitlement release codes');"
          if s.count(old_l3)!=1:
              raise SystemExit(f'expected one L3 release assertion, found {s.count(old_l3)}')
          s=s.replace(old_l3,new_l3)

          old='''async function portalSession(persona) {
            const login = await jsonFetch(`${portalRoot}/api/v2/auth/login`, {
              method: 'POST',
              headers: { Origin: portalRoot, 'content-type': 'application/json' },
              body: JSON.stringify({ username: persona.user, password: persona.password })
            });
            assert(login.response.status === 200 && login.body?.ok === true && login.body?.accountLocked === false, `${persona.label} signed Portal login failed`);
            return cookieFrom(login.response, 'fpt_session');
          }'''.replace('          ','')
          new='''async function portalSession(persona) {
            let lastStatus = 0;
            let lastError = '';
            for (let attempt = 1; attempt <= 20; attempt += 1) {
              const login = await jsonFetch(`${portalRoot}/api/v2/auth/login`, {
                method: 'POST',
                headers: { Origin: portalRoot, 'content-type': 'application/json' },
                body: JSON.stringify({ username: persona.user, password: persona.password })
              });
              lastStatus = login.response.status;
              lastError = clean(login.body?.error);
              if (lastStatus === 200 && login.body?.ok === true && login.body?.accountLocked === false) {
                console.log(`CP12_${persona.label}_EDGE_PROPAGATION_READY_PASS attempts=${attempt}`);
                return cookieFrom(login.response, 'fpt_session');
              }
              const credentialPropagationPending = lastStatus === 401 && lastError === 'LOGIN_INVALID';
              const readModelPropagationPending = lastStatus === 503 && ['READ_MODEL_POINTER_UNAVAILABLE','READ_MODEL_NO_VERIFIED_VERSION','RUNTIME_UNAVAILABLE'].includes(lastError);
              if (!credentialPropagationPending && !readModelPropagationPending) {
                throw new Error(`${persona.label} signed Portal login hard-failed status=${lastStatus} error=${lastError || 'none'}`);
              }
              if (attempt < 20) await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error(`${persona.label} signed Portal login propagation timeout status=${lastStatus} error=${lastError || 'none'}`);
          }'''.replace('          ','')
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one portalSession propagation patch target, found {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          grep -Fq "from '../rebuild/student/src/lib/access-scope.mjs'" scripts/cp12-e2e-synthetic-fixture.mjs
          ! grep -Fq "from '../rebuild/adminops/src/lib/compatibility.mjs'" scripts/cp12-e2e-synthetic-fixture.mjs
          grep -Fq 'expectedReleaseCodes' scripts/cp12-e2e-synthetic-fixture.mjs
          node --check scripts/cp12-e2e-synthetic-fixture.mjs
          sha256sum scripts/cp12-e2e-synthetic-fixture.mjs
          echo CP12_E2E_EXECUTABLE_FROZEN_PASS
      - name: Re-run authoritative compiler and atomic-publisher regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint3-atomic-publishing.mjs
          node tests/rebuild-checkpoint8-backfill-access-parity.mjs
          echo CP12_E2E_PUBLISHER_REGRESSION_PASS
      - name: Execute guarded synthetic L2 and L3 production acceptance with mandatory cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/cp12-e2e-synthetic-fixture.mjs
