name: Rebuild Checkpoint 9 - Production-shaped Staging UAT

on:
  push:
    branches:
      - rebuild/checkpoint9-production-shaped-staging-2026-09-13
      - rebuild/portal-v2-performance-2026-09-13
    paths:
      - 'rebuild/student/**'
      - 'rebuild/browser-staging/**'
      - 'rebuild/shared/**'
      - 'rebuild/adminops/src/lib/**'
      - 'scripts/rebuild-checkpoint9-*.mjs'
      - 'tests/rebuild-checkpoint*.mjs'
      - 'docs/rebuild/CHECKPOINT_9_PRODUCTION_SHAPED_STAGING_UAT.md'
      - '.github/workflows/rebuild-checkpoint9-production-shaped-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-v2-rebuild-checkpoint9-uat
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_WORKER: fpt-portal-v2-worker
  STAGING_WORKER: fpt-portal-v2-rebuild-student-staging
  STAGING_READ_MODELS_KV_TITLE: FPT_PORTAL_V2_REBUILD_READ_MODELS_STAGING
  STAGING_STUDENTS_KV_TITLE: FPT_PORTAL_V2_REBUILD_STUDENTS_STAGING
  STAGING_R2: fpt-portal-v2-rebuild-materials-staging
  STAGING_BASE_URL: https://fpt-portal-v2-rebuild-student-staging.futureperfectlessons.workers.dev
  BROWSER_STAGING_WORKER: fpt-portal-v2-rebuild-browser-staging-cp9
  CP9_BROWSER_BASE_URL: https://fpt-portal-v2-rebuild-browser-staging-cp9.futureperfectlessons.workers.dev
  CP7_FRONTEND_REPO: FuturePerfectTuitions/futureperfect-lessons-test
  CP7_FRONTEND_SHA: a4513da67ee66f51212114620c8e401bd5e31a8c
  WRANGLER_VERSION: 4.129.0
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  checkpoint9-production-shaped-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm safety boundary and generate masked synthetic UAT secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$STAGING_WORKER" == *rebuild*staging* ]]
          [[ "$STAGING_R2" == *rebuild*staging* ]]
          [[ "$STAGING_STUDENTS_KV_TITLE" == *REBUILD*STAGING* ]]
          [[ "$BROWSER_STAGING_WORKER" == *rebuild*staging* ]]
          [[ "$CP9_BROWSER_BASE_URL" == https://fpt-portal-v2-rebuild-browser-staging-cp9.futureperfectlessons.workers.dev ]]
          [[ "$CP7_FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          python - <<'PY' > /tmp/cp9-secrets.env
          import secrets,string
          def four():
              chars=[secrets.choice(string.ascii_uppercase),secrets.choice(string.ascii_lowercase),secrets.choice(string.digits),secrets.choice(string.ascii_letters+string.digits)]
              secrets.SystemRandom().shuffle(chars)
              return ''.join(chars)
          print('UAT_LOGIN_PASSWORD='+four())
          print('UAT_ANSWER_PASSWORD='+four())
          print('AUTH_SIGNING_SECRET='+secrets.token_hex(32))
          print('ACCESS_SCOPE_SECRET='+secrets.token_hex(32))
          PY
          while IFS='=' read -r key value; do
            test -n "$key"; test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < /tmp/cp9-secrets.env
          rm -f /tmp/cp9-secrets.env
      - name: Pin Wrangler and browser runner
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}" "@playwright/test@${PLAYWRIGHT_VERSION}"
      - name: Syntax and prior-checkpoint regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/rebuild-checkpoint9-seed-staging.mjs
          node --check scripts/rebuild-checkpoint9-copy-r2.mjs
          node --check scripts/rebuild-checkpoint9-staging-uat.mjs
          node --check scripts/rebuild-checkpoint9-browser-uat.mjs
          node --check rebuild/browser-staging/src/index.js
          node --check rebuild/student/src/index.js
          node --check rebuild/student/src/lib/runtime.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint8-backfill-access-parity.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          node tests/rebuild-checkpoint5-auth-capability-core.mjs
          node tests/rebuild-checkpoint4-dual-write-compatibility.mjs
          node tests/rebuild-checkpoint3-atomic-publishing.mjs
          node tests/rebuild-checkpoint2-read-models.mjs
      - name: Resolve isolated staging resource IDs and freeze production anchor
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/storage/kv/namespaces?per_page=100" "${AUTH[@]}" -o /tmp/kv.json
          READ_ID="$(jq -r --arg title "$STAGING_READ_MODELS_KV_TITLE" '.result[] | select(.title==$title) | .id' /tmp/kv.json | head -n1)"
          STUDENT_ID="$(jq -r --arg title "$STAGING_STUDENTS_KV_TITLE" '.result[] | select(.title==$title) | .id' /tmp/kv.json | head -n1)"
          test -n "$READ_ID"; test -n "$STUDENT_ID"
          echo "STAGING_READ_MODELS_KV_ID=$READ_ID" >> "$GITHUB_ENV"
          echo "STAGING_STUDENTS_KV_ID=$STUDENT_ID" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "${API}/workers/scripts/${PROD_WORKER}/deployments" "${AUTH[@]}" -o /tmp/prod-before.json
          PROD_DEPLOYMENT="$(jq -r '.result.deployments[0].id // .result[0].id // empty' /tmp/prod-before.json)"
          PROD_VERSION="$(jq -r '((.result.deployments[0].versions // .result[0].versions // []) | map(select((.percentage // 0) == 100)) | .[0].version_id) // empty' /tmp/prod-before.json)"
          test -n "$PROD_DEPLOYMENT"; test -n "$PROD_VERSION"
          echo "PROD_DEPLOYMENT=$PROD_DEPLOYMENT" >> "$GITHUB_ENV"
          echo "PROD_VERSION=$PROD_VERSION" >> "$GITHUB_ENV"
      - name: Compile and publish production-shaped staging seed
        run: node scripts/rebuild-checkpoint9-seed-staging.mjs
      - name: Copy representative production resources read-only into isolated staging R2
        run: node scripts/rebuild-checkpoint9-copy-r2.mjs
      - name: Install isolated staging Worker secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$AUTH_SIGNING_SECRET" | npx wrangler secret put AUTH_SIGNING_SECRET --env staging --config rebuild/student/wrangler.toml
          printf '%s' "$ACCESS_SCOPE_SECRET" | npx wrangler secret put ACCESS_SCOPE_SECRET --env staging --config rebuild/student/wrangler.toml
      - name: Deploy only the isolated CP9 Student Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          OUTPUT="$(npx wrangler deploy --env staging --config rebuild/student/wrangler.toml 2>&1)"
          printf '%s\n' "$OUTPUT"
          echo "$OUTPUT" | grep -F "$STAGING_WORKER" >/dev/null
          if echo "$OUTPUT" | grep -F 'fpt-portal-v2-worker' >/dev/null; then
            echo 'Production Worker name appeared in staging deployment output.' >&2
            exit 1
          fi
      - name: Wait for isolated staging health
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            CODE="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' "$STAGING_BASE_URL/health" || true)"
            if [ "$CODE" = 200 ] && jq -e '.ok==true and .environment=="staging" and .productionTarget==false and .preparedReadModels.kvBound==true and .auth.studentStoreBound==true and .resources.r2Bound==true and .resources.answerRateStoreBound==true' /tmp/health.json >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1
      - name: Run production-shaped API UAT
        run: node scripts/rebuild-checkpoint9-staging-uat.mjs
      - name: Checkout exact accepted CP7 frontend source
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: a4513da67ee66f51212114620c8e401bd5e31a8c
          path: cp7-frontend
          persist-credentials: false
      - name: Build exact CP7 frontend and record provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C cp7-frontend rev-parse HEAD)" = "$CP7_FRONTEND_SHA"
          cd cp7-frontend
          npm install --no-audit --no-fund
          npm run test:static
          npm run build
          ! grep -R -F 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev' dist
          cd "$GITHUB_WORKSPACE"
          rm -rf rebuild/browser-staging/public
          mkdir -p rebuild/browser-staging/public
          cp -a cp7-frontend/dist/. rebuild/browser-staging/public/
          find rebuild/browser-staging/public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/checkpoint9-frontend-files.sha256
          FRONTEND_TREE_SHA="$(sha256sum /tmp/checkpoint9-frontend-files.sha256 | awk '{print $1}')"
          jq -n \
            --arg marker 'REBUILD_CHECKPOINT9_FRONTEND_PROVENANCE' \
            --arg repository "$CP7_FRONTEND_REPO" \
            --arg sha "$CP7_FRONTEND_SHA" \
            --arg treeSha "$FRONTEND_TREE_SHA" \
            --arg note 'Exact CP7 Vite build; no production worker URL present; runtime API base remains same-origin.' \
            '{marker:$marker,repository:$repository,sha:$sha,builtTreeSha256:$treeSha,note:$note}' > /tmp/checkpoint9-frontend-provenance.json
      - name: Install supported real browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Deploy isolated same-origin CP9 browser facade
        shell: bash
        run: |
          set -Eeuo pipefail
          OUTPUT="$(npx wrangler deploy --config rebuild/browser-staging/wrangler.toml 2>&1)"
          printf '%s\n' "$OUTPUT"
          echo "$OUTPUT" | grep -F "$BROWSER_STAGING_WORKER" >/dev/null
          if echo "$OUTPUT" | grep -F 'fpt-portal-v2-worker' >/dev/null; then
            echo 'Production Worker name appeared in browser staging deployment output.' >&2
            exit 1
          fi
      - name: Wait for isolated CP9 browser facade and verify same-origin API hop
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 30); do
            CODE="$(curl --silent --location --output /tmp/cp9-browser-index.html --write-out '%{http_code}' "$CP9_BROWSER_BASE_URL/" || true)"
            if [ "$CODE" = 200 ] && grep -F 'Future Perfect Tuitions' /tmp/cp9-browser-index.html >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/cp9-browser-index.html 2>/dev/null || true
              exit 1
            fi
            sleep 2
          done
          JS_PATH="$(grep -oE '<script[^>]+src="[^"]+"' /tmp/cp9-browser-index.html | sed -E 's/.*src="([^"]+)".*/\1/' | head -n1)"
          test -n "$JS_PATH"
          curl --fail --silent --show-error "$CP9_BROWSER_BASE_URL$JS_PATH" -o /tmp/cp9-browser-app.js
          grep -F 'Student Login' /tmp/cp9-browser-app.js >/dev/null
          HOME_CODE="$(curl --silent --show-error -D /tmp/cp9-browser-home.headers -o /tmp/cp9-browser-home.json --write-out '%{http_code}' "$CP9_BROWSER_BASE_URL/api/v2/student/home" || true)"
          test "$HOME_CODE" = 401
          grep -i '^x-fpt-cp9-browser-facade: service-binding' /tmp/cp9-browser-home.headers >/dev/null
      - name: Run real CP7 browser UAT against production-shaped staging
        run: node scripts/rebuild-checkpoint9-browser-uat.mjs
      - name: Prove production deployment remained unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${PROD_DEPLOYMENT:-}"
          test -n "${PROD_VERSION:-}"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/workers/scripts/${PROD_WORKER}/deployments" "${AUTH[@]}" -o /tmp/prod-after.json
          AFTER_DEPLOYMENT="$(jq -r '.result.deployments[0].id // .result[0].id // empty' /tmp/prod-after.json)"
          AFTER_VERSION="$(jq -r '((.result.deployments[0].versions // .result[0].versions // []) | map(select((.percentage // 0) == 100)) | .[0].version_id) // empty' /tmp/prod-after.json)"
          test "$AFTER_DEPLOYMENT" = "$PROD_DEPLOYMENT"
          test "$AFTER_VERSION" = "$PROD_VERSION"
          jq -n --arg deployment "$AFTER_DEPLOYMENT" --arg version "$AFTER_VERSION" '{productionChanged:false,deploymentId:$deployment,versionId:$version}' > /tmp/checkpoint9-production-anchor.json
      - name: Assemble exact-SHA CP9 gate evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg marker 'REBUILD_CHECKPOINT9_FULL_GATE_PASS' \
            --arg candidateSha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg frontendSha "$CP7_FRONTEND_SHA" \
            --slurpfile api /tmp/checkpoint9-uat-summary.json \
            --slurpfile browser /tmp/checkpoint9-browser-uat-summary.json \
            --slurpfile production /tmp/checkpoint9-production-anchor.json \
            --slurpfile frontend /tmp/checkpoint9-frontend-provenance.json \
            '{marker:$marker,candidateSha:$candidateSha,branch:$branch,runId:$runId,runAttempt:$runAttempt,frontendSha:$frontendSha,api:$api[0],browser:$browser[0],production:$production[0],frontendProvenance:$frontend[0]}' \
            > /tmp/checkpoint9-full-gate-summary.json
          jq -e '.api.marker=="REBUILD_CHECKPOINT9_STAGING_UAT_PASS" and .browser.marker=="REBUILD_CHECKPOINT9_BROWSER_UAT_PASS" and .browser.cookieTopology.approvedCookieArchitectureUnchanged==true and .browser.cookieTopology.sameSite=="Lax" and .browser.cookieTopology.productionBrowserRequestCount==0 and .production.productionChanged==false' /tmp/checkpoint9-full-gate-summary.json >/dev/null
      - name: Upload redacted CP9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint9-production-shaped-uat-evidence
          path: |
            /tmp/checkpoint9-seed-summary.json
            /tmp/checkpoint9-r2-copy-summary.json
            /tmp/checkpoint9-uat-summary.json
            /tmp/checkpoint9-production-anchor.json
            /tmp/checkpoint9-frontend-provenance.json
            /tmp/checkpoint9-frontend-files.sha256
            /tmp/checkpoint9-browser-uat-summary.json
            /tmp/checkpoint9-browser-uat-failure.json
            /tmp/checkpoint9-full-gate-summary.json
            /tmp/checkpoint9-browser-evidence/
          retention-days: 30
          if-no-files-found: warn
