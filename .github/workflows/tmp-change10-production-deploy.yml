name: Temporary Change 10 production deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-change10-production-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 Change 10 empty PreLesson navigation guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate canonical Phase 11 navigation manifest
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs >/tmp/phase11-navigation-manifest.json
          jq -e '.curricula == 11 and .lessons == 369' /tmp/phase11-navigation-manifest.json >/dev/null
          grep -Fq 'const PHASE11_NAVIGATION_MANIFEST = {' worker/src/phase11-navigation-manifest.generated.js

      - name: Verify Change 10 and importer regression
        run: |
          set -euo pipefail
          bash -n ops/deploy_current_worker_preserve.sh
          node --check worker/src/index-phase20-change10.js
          node --check assets/phase7.js
          node tests/prelesson-empty-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change10.js"' worker/wrangler.toml

      - name: Confirm production admin secrets exist
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_PASSWORD") != null' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_SESSION_SECRET") != null' /tmp/settings.json >/dev/null

      - name: Deploy configured Worker preserving bindings and secrets
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          grep -Fq 'main = "src/index-phase20-change10.js"' worker/wrangler.runtime-preserve.toml

      - name: Verify live Worker contains Change 10
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/worker.bin
          grep -aFq 'preLessonAvailability' /tmp/worker.bin
          grep -aFq 'No PreLesson Sheets' /tmp/worker.bin
          grep -aFq 'preLessonAvailable' /tmp/worker.bin
          echo 'CHANGE10_LIVE_MARKERS_PASS'

      - name: Verify admin isolation remains intact
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          code="$(curl -sS -o /tmp/admin-body -w '%{http_code}' -X POST "$BASE/api/v1/admin/lesson-releases/preview" -H 'Content-Type: application/json' --data '{}')"
          test "$code" = '401'
          code="$(curl -sS -o /tmp/excel-body -w '%{http_code}' -X POST "$BASE/api/v1/admin/excel-entitlements/sync" -H 'Origin: https://lessons.futureperfect.education' -H 'Content-Type: application/json' --data '{}')"
          test "$code" = '403'
          echo 'ADMIN_ISOLATION_PASS'
