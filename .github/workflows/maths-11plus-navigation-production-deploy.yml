name: Portal Year 6 and SATS production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maths-11plus-navigation-production-deploy.yml'
      - 'worker/wrangler.toml'
      - 'worker/src/index-step11-year6-catalogue-boundary.js'
      - 'worker/src/index-step10-quiz-bridge.js'
      - 'worker/src/index-admin-tools.js'
      - 'worker/src/index-maths-equivalent-navigation-final.js'
      - 'worker/src/index-phase20-change15.js'
      - 'tests/year6-catalogue-boundary-verification.mjs'
      - 'tests/maths-11plus-level-navigation-verification.mjs'
      - 'tests/final-maths-equivalent-navigation-verification.mjs'
      - 'ops/verify_owner_special_logins_live_20260930.sh'
      - 'ops/deploy_current_worker_preserve.sh'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 Year 6 catalogue and SATS presentation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify current Portal composition and navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-step11-year6-catalogue-boundary.js
          node --check worker/src/index-step10-quiz-bridge.js
          node --check worker/src/index-maths-equivalent-navigation-final.js
          node --check worker/src/index-phase20-change15.js
          node tests/year6-catalogue-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/final-maths-equivalent-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-step11-year6-catalogue-boundary.js"' worker/wrangler.toml
          grep -Fq "import currentWorker from './index-step10-quiz-bridge.js';" worker/src/index-step11-year6-catalogue-boundary.js
          grep -Fq "import currentWorker from './index-admin-tools.js';" worker/src/index-step10-quiz-bridge.js
          grep -Fq "index-maths-equivalent-navigation-final.js" worker/src/index-admin-tools.js
          echo 'PORTAL_YEAR6_SATS_STATIC_PASS'

      - name: Require production bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/portal-settings.json
          jq -e '.success == true' /tmp/portal-settings.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/portal-settings.json >/dev/null
          done
          echo 'PORTAL_YEAR6_SATS_BINDINGS_PASS'

      - name: Deploy current production Worker preserving bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          echo 'PORTAL_YEAR6_SATS_DEPLOY_PASS'

      - name: Verify live Worker security boundary after deploy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'
          code="$(curl --silent --show-error --output /tmp/portal-home.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" \
            "$BASE/api/v1/student/home")"
          test "$code" = '401'
          echo 'PORTAL_YEAR6_SATS_LIVE_SECURITY_PASS'

      - name: Verify Admin0206 SATS and Year 6 boundary live
        shell: bash
        run: |
          set -euo pipefail
          bash ops/verify_owner_special_logins_live_20260930.sh
