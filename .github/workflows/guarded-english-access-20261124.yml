name: Guarded two-account English access correction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-v2-one-off-20261124
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded canonical and prepared access correction
        shell: bash
        run: |
          set -euo pipefail
          cat > .one-off-access-20261124.mjs <<'NODE'
          import {createHash} from 'node:crypto';
          import {SCOPE_SALT_KEY,opaqueAccessScopeId,resolveCurrentScope,globalToCatalogue,pointerKey,stableStringify,assertCanonicalAccessProjected} from './worker/src/access-read-model-sync.js';
          import {loadStudentAccessInput,compileAuthoritativeAccessScope,refreshStudentAccessReadModel,assertReadModelReconciliationReady} from './worker/src/access-read-model-sync-v2.js';
          const norm=v=>String(v??'').trim().toLowerCase();
          const hash=v=>createHash('sha256').update(norm(v)).digest('hex');
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error('MISSING_CREDENTIALS');
          const ids={STUDENTS_KV:'c9723c8806334e4ea54d1b456d31b794',READ_MODELS_KV:'77b35165c8694087bc1b0515c35a7e89',DB:'97250a54-fa91-45ad-a002-3c4566b1fc38'};
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function request(path,options={}){
           const r=await fetch(base+path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});
           const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{}
           return {r,raw,j};
          }
          async function api(path,options){const {r,j}=await request(path,options);if(!r.ok||!j?.success)throw Error('API_FAILURE_'+r.status);return j;}
          const settings=(await api('/workers/scripts/fpt-portal-v2-worker/settings')).result;
          for(const [name,id] of Object.entries(ids)){const b=settings.bindings.find(x=>x.name===name);if((name==='DB'?(b?.database_id||b?.id):b?.namespace_id)!==id)throw Error('BINDING_DRIFT');}
          const ns=n=>'/storage/kv/namespaces/'+ids[n];
          async function get(n,k){const {r,raw}=await request(ns(n)+'/values/'+encodeURIComponent(k));if(r.status===404)return null;if(!r.ok)throw Error('KV_READ_FAILED');return raw;}
          let studentKey='',scopePrefix='';
          async function put(n,k,v){if(!(n==='STUDENTS_KV'&&k===studentKey)&&!(n==='READ_MODELS_KV'&&scopePrefix&&k.startsWith(scopePrefix)&&(k.endsWith(':current')||k.includes(':version:'))))throw Error('WRITE_SCOPE_VIOLATION');await api(ns(n)+'/values/'+encodeURIComponent(k),{method:'PUT',headers:{'content-type':'text/plain'},body:v});}
          const students={get:async(k,o)=>{const v=await get('STUDENTS_KV',k);return o?.type==='json'&&v?JSON.parse(v):v;},put:(k,v)=>put('STUDENTS_KV',k,v)};
          const store={get:k=>get('READ_MODELS_KV',k),put:(k,v)=>put('READ_MODELS_KV',k,v)};
          const db={prepare(sql){if(!/^\s*SELECT\b/i.test(sql))throw Error('D1_WRITE_FORBIDDEN');return {bind(...params){return {...this,params}},async all(){const j=await api('/d1/database/'+ids.DB+'/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql,params:this.params||[]})});return {results:j.result[0].results||[]};}}}};
          const env={STUDENTS_KV:students,READ_MODELS_KV:store,DB:db};
          await assertReadModelReconciliationReady(env);
          const salt=await store.get(SCOPE_SALT_KEY);
          const catalogue=globalToCatalogue((await resolveCurrentScope(store,'global')).payload);
          const targets=['849cb0835c0b1d1ef6f57e936929e5acd32ffbb5384fac81ca4ceb08f955c397','40fc3451e882282df7cc37fdc6d3fd9b4a1d3673c1a05c0350ed4ce31a3ce49b'];
          const matches=[[],[]];let cursor='',count=0;
          do {const j=await api(ns('STUDENTS_KV')+'/keys?limit=1000&prefix=user%3A'+(cursor?'&cursor='+encodeURIComponent(cursor):''));for(const k of j.result){if(++count>1500)throw Error('SCAN_LIMIT');const p=await students.get(k.name,{type:'json'});const i=targets.indexOf(hash(p?.firstName));if(i>=0 && norm(p.accountStatus||p.status||'active')==='active' && !p.isAdmin && !p.superuser && !norm(p.role||p.accountType).includes('admin'))matches[i].push(k.name);}cursor=j.result_info?.cursor||'';}while(cursor);
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const same=(a,b)=>stableStringify(a)===stableStringify(b);
          let failures=0;
          for(let i=0;i<2;i++){
           let stage='IDENTITY',written=false,oldText,newText,id,scope,prior;
           try{
           console.log('TARGET_'+(i+1)+'_ACTIVE_MATCH_COUNT_'+matches[i].length);if(matches[i].length!==1)throw Error('IDENTITY_NOT_UNIQUE');
           studentKey=matches[i][0];id=studentKey.slice(5);
           oldText=await get('STUDENTS_KV',studentKey);const old=JSON.parse(oldText);
           if(norm(old.portalUserId)!==id||hash(old.firstName)!==targets[i]||norm(old.accountStatus||old.status||'active')!=='active'||old.isAdmin||old.superuser||norm(old.role||old.accountType).includes('admin'))throw Error('IDENTITY_GUARD');
           const opaque=await opaqueAccessScopeId(id,salt);scope='access:'+opaque;scopePrefix=pointerKey(scope).slice(0,-7);
           prior=await resolveCurrentScope(store,scope);
           const input=await loadStudentAccessInput(env,id,date);
           if(!same(input.user,old))throw Error('CONCURRENT_CHANGE');
           const before=compileAuthoritativeAccessScope(input,catalogue,opaque,date);assertCanonicalAccessProjected(input,before);
           stage='PLAN';const next=structuredClone(old);
           if(i===0){
            if(!before.snapshot.views.some(v=>v.viewId==='english-year4-11plus'&&!v.lockedPreview))throw Error('RETAINED_VIEW_MISSING');
            if(Array.isArray(next.historicalViews))next.historicalViews=next.historicalViews.filter(v=>norm(v)!=='english-year4');
            if(Array.isArray(next.fullLibraries))next.fullLibraries=next.fullLibraries.filter(v=>norm(v)!=='english_y4_full');
           }else{
            if(!before.snapshot.views.some(v=>/^english-year[45]-11plus$/.test(v.viewId)&&!v.lockedPreview))throw Error('ELEVEN_PLUS_VIEW_MISSING');
            next.manualAccess={...next.manualAccess,specialBuckets:[...new Set([...(next.manualAccess?.specialBuckets||[]),'VR_HOWTO'])]};
           }
           const modified={...input,user:next};const planned=compileAuthoritativeAccessScope(modified,catalogue,opaque,date);assertCanonicalAccessProjected(modified,planned);
           const a=before.snapshot,b=planned.snapshot;
           if(!same(a.lessonAccess,b.lessonAccess))throw Error('LESSON_ACCESS_DRIFT');
           if(i===0){
            if(b.views.some(v=>v.viewId==='english-year4')){
            const normalBatch=x=>norm(x?.subject)==='english'&&Number(x?.school_year)===4&&norm(x?.stream)!=='11plus';
            const legacyNormal=x=>/^Y4E(?!11)/i.test(String(x||''));
            console.log(JSON.stringify({target:1,normalBatchAssignments:input.batchAssignments.filter(normalBatch).length,normalProfileBatches:(old.batches||[]).filter(legacyNormal).length,normalEntitlementSources:input.entitlements.filter(x=>legacyNormal(x.source_batch_code)).length,normalPreLessonSources:input.onlinePreLessonEntitlements.filter(x=>legacyNormal(x.batch_key)).length,manualYear4CoreCount:(old.manualAccess?.coreLessons||[]).filter(x=>/^Y4E/i.test(x)).length,standardFullLibrary:(old.fullLibraries||[]).some(x=>norm(x)==='english_y4_full'),standardHistoricalView:(old.historicalViews||[]).some(x=>norm(x)==='english-year4')}));
            throw Error('DUPLICATE_DERIVED_FROM_OTHER_CANONICAL_SOURCE');
           }
            if(!same(a.views.filter(v=>v.viewId!=='english-year4'),b.views)||!same(a.specialAreas,b.specialAreas))throw Error('UNRELATED_VIEW_DRIFT');
           }else{
            if(!b.specialAreas.includes('VR_HOWTO')||!same(a.specialAreas.filter(v=>v!=='VR_HOWTO'),b.specialAreas.filter(v=>v!=='VR_HOWTO'))||!same(a.views,b.views))throw Error('SPECIAL_ACCESS_DRIFT');
           }
           if(!same(prior.payload.snapshot.lessonAccess,a.lessonAccess))throw Error('PREEXISTING_PREPARED_DRIFT');
           stage='WRITE';newText=JSON.stringify(next);
           if(await get('STUDENTS_KV',studentKey)!==oldText)throw Error('CONCURRENT_CHANGE');
           if((await resolveCurrentScope(store,scope)).sha256!==prior.sha256)throw Error('CONCURRENT_PREPARED_CHANGE');
           if(!same(old,next)){await students.put(studentKey,newText);written=true;}
           if(!same(await students.get(studentKey,{type:'json'}),next))throw Error('CANONICAL_READBACK');
           const pub=await refreshStudentAccessReadModel(env,id,{asOfDate:date});
           const actual=await resolveCurrentScope(store,scope);
           if(actual.sha256!==pub.sha256||!same(actual.payload,planned))throw Error('PREPARED_READBACK');
           console.log('TARGET_'+(i+1)+'_PRODUCTION_READBACK_PASS');
           }catch(e){
           failures++;
           if(written){try{if(await get('STUDENTS_KV',studentKey)!==newText)throw Error('CONCURRENT');await students.put(studentKey,oldText);await refreshStudentAccessReadModel(env,id,{asOfDate:date});if(await get('STUDENTS_KV',studentKey)!==oldText)throw Error('READBACK');console.log('TARGET_'+(i+1)+'_ROLLBACK_PASS');}catch{console.log('TARGET_'+(i+1)+'_ROLLBACK_REQUIRES_REVIEW');}}
           const safe=['IDENTITY_NOT_UNIQUE','IDENTITY_GUARD','RETAINED_VIEW_MISSING','ELEVEN_PLUS_VIEW_MISSING','LESSON_ACCESS_DRIFT','DUPLICATE_DERIVED_FROM_OTHER_CANONICAL_SOURCE','UNRELATED_VIEW_DRIFT','SPECIAL_ACCESS_DRIFT','PREEXISTING_PREPARED_DRIFT','CONCURRENT_CHANGE','CONCURRENT_PREPARED_CHANGE','CANONICAL_READBACK','PREPARED_READBACK'];console.log('TARGET_'+(i+1)+'_STOP_'+stage+'_'+(safe.includes(e.message)?e.message:'GUARD_FAILURE'));
           }finally{studentKey='';scopePrefix='';}
          }
          if(failures)process.exitCode=1;
          NODE
          node --check .one-off-access-20261124.mjs
          node .one-off-access-20261124.mjs
