name: Post-Step-10 visual family contracts read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-visual-family-contracts-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Extract structural contracts only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-visual-family-contracts-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT family_id,question_id,presentation_type,diagram_type,diagram_spec_json,validation_spec_json FROM question_instance WHERE family_id IN ('GEO-10','DAT-07','GEO-12','GEO-05') AND lifecycle_status='Live' ORDER BY family_id,question_id;" --json >/tmp/raw.json
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=json.loads(Path('/tmp/raw.json').read_text())[0]['results']
          def shape(v,prefix=''):
              out=[]
              if isinstance(v,dict):
                  for k,val in sorted(v.items()):
                      p=f'{prefix}.{k}' if prefix else k
                      out.append((p,type(val).__name__))
                      if isinstance(val,(dict,list)): out.extend(shape(val,p))
              elif isinstance(v,list):
                  out.append((prefix+'[]','list_item:'+ (type(v[0]).__name__ if v else 'empty')))
                  if v and isinstance(v[0],(dict,list)): out.extend(shape(v[0],prefix+'[]'))
              return out
          families={}
          for r in rows:
              f=families.setdefault(r['family_id'],{'presentation_types':set(),'diagram_types':set(),'diagram_shapes':set(),'validation_types':set(),'count':0})
              f['count']+=1; f['presentation_types'].add(r['presentation_type']); f['diagram_types'].add(r['diagram_type'])
              d=json.loads(r['diagram_spec_json']) if r.get('diagram_spec_json') else None
              v=json.loads(r['validation_spec_json']) if r.get('validation_spec_json') else None
              f['diagram_shapes'].add('; '.join(f'{p}:{t}' for p,t in shape(d)))
              if isinstance(v,dict) and 'type' in v: f['validation_types'].add(str(v['type']))
          out=[]
          for family_id,f in sorted(families.items()):
              out.append({'family_id':family_id,'live_count':f['count'],'presentation_types':' | '.join(sorted(f['presentation_types'])),'diagram_types':' | '.join(sorted(f['diagram_types'])),'validation_types':' | '.join(sorted(f['validation_types'])),'diagram_contract_variants':len(f['diagram_shapes']),'diagram_contracts':' || '.join(sorted(f['diagram_shapes']))})
          with open('/tmp/visual_family_contracts.csv','w',newline='',encoding='utf-8') as h:
              w=csv.DictWriter(h,fieldnames=out[0].keys());w.writeheader();w.writerows(out)
          print(json.dumps({'marker':'POST_STEP10_VISUAL_FAMILY_CONTRACTS_READONLY_PASS','families':[x['family_id'] for x in out],'live_rows':len(rows),'raw_question_text_exported':False,'raw_diagram_values_exported':False},indent=2))
          PY
          rm -f /tmp/raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-visual-family-contracts-readonly
          path: /tmp/visual_family_contracts.csv
          retention-days: 30
