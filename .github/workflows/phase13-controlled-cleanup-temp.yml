name: Phase 13 temporary controlled fixture cleanup

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-controlled-cleanup-temp.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  cleanup-controlled-fixture:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guard, remove only Phase 13 TestY fixture, and prove baseline restored
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing cleanup.' >&2; false;; esac
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"; test "$STUDENTS" != null

          KEY='user%3Atesty2e'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/values/${KEY}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/user.json
          jq -e 'type=="object"' /tmp/user.json >/dev/null
          jq -e '((.blockedLessons // []) | index("Y5E11")) == null' /tmp/user.json >/dev/null

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS fixture_entitlements FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id IN ('Y5E10','Y5E11'); SELECT COUNT(*) AS fixture_entitlements_exact FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id IN ('Y5E10','Y5E11') AND source_batch_code='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS fixture_releases FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS fixture_batches FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS fixture_assignments FROM student_batch_assignments WHERE batch_key='__P13_ACCEPT_E5__' AND portal_user_id_norm='testy2e'; SELECT COUNT(*) AS invalid_rows FROM lesson_entitlements WHERE portal_user_id_norm='p13missinguser9999'; PRAGMA quick_check;" >/tmp/before.json
          echo 'Cleanup preflight:'
          jq -c '[.[0].results[0],.[1].results[0],.[2].results[0],.[3].results[0],.[4].results[0],.[5].results[0],.[6].results[0],.[7].results[0],.[8].results[0],.[9].results[0],.[10].results[0]]' /tmp/before.json

          ENT="$(jq -r '.[0].results[0].entitlement_count' /tmp/before.json)"
          BAT="$(jq -r '.[1].results[0].batch_count' /tmp/before.json)"
          ASN="$(jq -r '.[2].results[0].assignment_count' /tmp/before.json)"
          REL="$(jq -r '.[3].results[0].release_count' /tmp/before.json)"
          FENT="$(jq -r '.[4].results[0].fixture_entitlements' /tmp/before.json)"
          FENTX="$(jq -r '.[5].results[0].fixture_entitlements_exact' /tmp/before.json)"
          FREL="$(jq -r '.[6].results[0].fixture_releases' /tmp/before.json)"
          FBAT="$(jq -r '.[7].results[0].fixture_batches' /tmp/before.json)"
          FASN="$(jq -r '.[8].results[0].fixture_assignments' /tmp/before.json)"
          INVALID="$(jq -r '.[9].results[0].invalid_rows' /tmp/before.json)"
          jq -e '.[10].results[]|select(.quick_check=="ok")' /tmp/before.json >/dev/null

          test "$INVALID" = '0'
          test "$FENT" = "$FENTX"
          test $((ENT - FENT)) -eq 632
          test $((BAT - FBAT)) -eq 4
          test $((ASN - FASN)) -eq 4
          test $((REL - FREL)) -eq 0
          test "$FENT" -ge 0; test "$FENT" -le 2
          test "$FREL" -ge 0; test "$FREL" -le 2
          test "$FBAT" -ge 0; test "$FBAT" -le 1
          test "$FASN" -ge 0; test "$FASN" -le 1

          if [ "$FREL" -gt 0 ]; then
            $W d1 execute fpt_portal_v2_db --remote --yes --command \
              "DELETE FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id IN ('Y5E10','Y5E11');" >/tmp/delete-release.log 2>&1
          fi
          if [ "$FASN" -gt 0 ]; then
            $W d1 execute fpt_portal_v2_db --remote --yes --command \
              "DELETE FROM student_batch_assignments WHERE batch_key='__P13_ACCEPT_E5__' AND portal_user_id_norm='testy2e';" >/tmp/delete-assignment.log 2>&1
          fi
          if [ "$FBAT" -gt 0 ]; then
            $W d1 execute fpt_portal_v2_db --remote --yes --command \
              "DELETE FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__';" >/tmp/delete-batch.log 2>&1
          fi
          if [ "$FENT" -gt 0 ]; then
            $W d1 execute fpt_portal_v2_db --remote --yes --command \
              "DELETE FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id IN ('Y5E10','Y5E11') AND source_batch_code='__P13_ACCEPT_E5__';" >/tmp/delete-entitlement.log 2>&1
          fi

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS fixture_entitlements FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id IN ('Y5E10','Y5E11'); SELECT COUNT(*) AS fixture_releases FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS fixture_batches FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS fixture_assignments FROM student_batch_assignments WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS invalid_rows FROM lesson_entitlements WHERE portal_user_id_norm='p13missinguser9999'; PRAGMA quick_check;" >/tmp/after.json
          echo 'Cleanup result:'
          jq -c '[.[0].results[0],.[1].results[0],.[2].results[0],.[3].results[0],.[4].results[0],.[5].results[0],.[6].results[0],.[7].results[0],.[8].results[0],.[9].results[0]]' /tmp/after.json
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/after.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/after.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/after.json)" = '4'
          test "$(jq -r '.[3].results[0].release_count' /tmp/after.json)" = '0'
          test "$(jq -r '.[4].results[0].fixture_entitlements' /tmp/after.json)" = '0'
          test "$(jq -r '.[5].results[0].fixture_releases' /tmp/after.json)" = '0'
          test "$(jq -r '.[6].results[0].fixture_batches' /tmp/after.json)" = '0'
          test "$(jq -r '.[7].results[0].fixture_assignments' /tmp/after.json)" = '0'
          test "$(jq -r '.[8].results[0].invalid_rows' /tmp/after.json)" = '0'
          jq -e '.[9].results[]|select(.quick_check=="ok")' /tmp/after.json >/dev/null
          echo 'PHASE13_FIXTURE_CLEANUP_OK=baseline 632/4/4/0 restored; TestY fixture removed only.'
