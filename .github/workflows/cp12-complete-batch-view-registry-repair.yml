name: CP12 complete batch-view registry repair

on:
  push:
    branches:
      - fix/cp12-complete-batch-view-registry-2026-09-14
    paths:
      - 'scripts/cp12-complete-batch-view-registry-repair.mjs'
      - '.github/workflows/cp12-complete-batch-view-registry-repair.yml'
      - '.github/cp12-batch-registry-apply.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp12-batch-registry-production-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_WORKER: fpt-portal-v2-worker
      BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
      EXPECTED_STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      EXPECTED_LESSONS_KV_ID: 49619b1a24b244bc8aaa6223fcd24e80
      EXPECTED_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      EXPECTED_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      EXPECTED_R2: fpt-materials-dev
      CP12_AS_OF_DATE: '2026-09-14'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Cloudflare credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Cloudflare credentials are present; values are not printed.'

      - name: Syntax check guarded repair
        run: node --check scripts/cp12-complete-batch-view-registry-repair.mjs

      - name: Determine dry-run or explicit apply
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/cp12-batch-registry-apply.trigger ]] && [[ "$(cat .github/cp12-batch-registry-apply.trigger)" == 'APPLY_CP12_BATCH_REGISTRY_2026-09-14' ]]; then
            echo 'apply=1' >> "$GITHUB_OUTPUT"
            echo 'Explicit CP12 batch-registry apply trigger is present.'
          else
            echo 'apply=0' >> "$GITHUB_OUTPUT"
            echo 'No explicit apply trigger; running read-only preflight.'
          fi

      - name: Read-only production preflight
        if: steps.mode.outputs.apply != '1'
        env:
          CP12_BATCH_REGISTRY_APPLY: '0'
        run: node scripts/cp12-complete-batch-view-registry-repair.mjs

      - name: Guarded production repair
        if: steps.mode.outputs.apply == '1'
        env:
          CP12_BATCH_REGISTRY_APPLY: '1'
        run: node scripts/cp12-complete-batch-view-registry-repair.mjs

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-complete-batch-view-registry-repair
          path: |
            /tmp/cp12-batch-registry-before.json
            /tmp/cp12-batch-registry-after.json
            /tmp/rebuild-checkpoint11-backfill.json
          if-no-files-found: warn
          retention-days: 30
