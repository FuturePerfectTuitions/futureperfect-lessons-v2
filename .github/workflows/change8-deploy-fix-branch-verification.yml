name: Change 8 deploy fix branch verification

on:
  push:
    branches: [fix-change8-production-deploy]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deploy path and generated navigation
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/deploy_current_worker_preserve.sh
          node scripts/phase11-navigation-manifest.mjs >/tmp/manifest.json
          jq -e '.curricula == 11 and .lessons == 369' /tmp/manifest.json >/dev/null
          grep -Fq 'const PHASE11_NAVIGATION_MANIFEST = {' worker/src/phase11-navigation-manifest.generated.js
          grep -Fq 'main = "src/index-phase20-change8.js"' worker/wrangler.toml
          node --check worker/src/index-phase20-change8.js
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          echo 'CHANGE8_DEPLOY_FIX_VERIFY_PASS'
