name: Phase 17 Post-Deploy Runtime Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev

jobs:
  diagnostic:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated deployment and unauthenticated boundary
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.success==true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/settings.json >/dev/null
          test -z "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = fpt-materials-dev
          for path in /api/v1/student/home /api/v1/student/session; do
            code="$(curl --silent --show-error --output /tmp/probe.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE$path")"
            test "$code" = 401
          done
          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' --header 'Content-Type: application/json' --request POST --data '{"username":"__phase17_not_authorised__","password":"Aa1x"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = 401
          jq -e '.error=="INVALID_LOGIN"' /tmp/login.json >/dev/null
          echo 'PHASE17_MANUAL_RUNTIME_DIAGNOSTIC_PASS'
