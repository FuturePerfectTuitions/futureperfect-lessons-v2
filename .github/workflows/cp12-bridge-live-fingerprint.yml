name: CP12 bridge live fingerprint
on:
  push:
    branches: [feature/cp12-quiz-redeem-v2-2026-09-21]
    paths: ['.github/workflows/cp12-bridge-live-fingerprint.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  PORTAL_ROOT: https://lessons.futureperfect.education/
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read current hidden bridge state
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl -fsS -H "$AUTH" "$API/workers/scripts/${WORKER_NAME}/deployments" -o /tmp/deployments.json
          jq -e '.success==true' /tmp/deployments.json >/dev/null
          echo '=== DEPLOYMENTS ==='
          jq -c '.result.deployments[0:5] | map({id,created_on,source,annotations,versions})' /tmp/deployments.json

          curl -fsS -H "$AUTH" "$API/workers/scripts/${WORKER_NAME}/settings" -o /tmp/settings.json
          jq -e '.success==true' /tmp/settings.json >/dev/null
          echo '=== BINDINGS ==='
          jq -c '.result.bindings | map({name,type,service,environment,database_id:(.id // .database_id),bucket_name}) | sort_by(.name)' /tmp/settings.json
          jq -e --arg id "$PORTAL_D1_ID" '.result.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/settings.json >/dev/null

          curl -fsS -H "$AUTH" "$API/workers/scripts/${WORKER_NAME}" -o /tmp/script.bin
          echo '=== SCRIPT ==='
          sha256sum /tmp/script.bin
          wc -c /tmp/script.bin
          for marker in 'quiz-release-context-v2.0' 'portal-live-maths11plus-release-v2' 'portal-api-v2-live-l3-view-v1' '/api/v1/quiz-bridge/redeem'; do
            if grep -aFq "$marker" /tmp/script.bin; then echo "MARKER_PRESENT $marker"; else echo "MARKER_ABSENT $marker"; fi
          done

          npm install --no-save wrangler@4.134.0 >/dev/null 2>&1
          npx wrangler d1 execute "$PORTAL_D1_ID" --remote --command="SELECT COUNT(*) AS n FROM quiz_launch_codes;" --json > /tmp/rows.json
          echo '=== LAUNCH CODE ROWS ==='
          jq -c '.' /tmp/rows.json

          curl -fsS "$PORTAL_ROOT" -o /tmp/portal.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,urllib.parse,os
          root=os.environ['PORTAL_ROOT']
          html=Path('/tmp/portal.html').read_text(errors='replace')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          text=''
          for i,ref in enumerate(refs):
              p=f'/tmp/a{i}.js'
              subprocess.run(['curl','-fsS',urllib.parse.urljoin(root,ref),'-o',p],check=True)
              text += Path(p).read_text(errors='replace')
          markers=['11+ Practice','quiz.futureperfect.education','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']
          found=[m for m in markers if m in text]
          if found: raise SystemExit('QUIZ_SURFACE_NOT_WITHDRAWN '+repr(found))
          print('PORTAL_QUIZ_SURFACE_WITHDRAWN_PASS')
          PY
          echo CP12_BRIDGE_LIVE_FINGERPRINT_PASS
