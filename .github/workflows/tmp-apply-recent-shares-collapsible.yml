name: One-shot apply recent shares and collapsible lessons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-recent-shares-collapsible.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: student-recent-shares-collapsible-lessons
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply scoped patch
        run: python3 ops/apply_recent_shares_collapsible.py

      - name: Verify syntax and regressions
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/admin-lesson-release-import.js
          node --check assets/phase7.js
          node --check assets/phase20-collapsible-lessons.js
          node tests/recent-shares-collapsible-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/lesson-release-navigation-verification.mjs
          node tests/prelesson-11plus-regression.mjs

      - name: Remove patch helper and commit feature
        run: |
          set -euo pipefail
          rm ops/apply_recent_shares_collapsible.py
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add -A
          git commit -m 'Add recent shares panel and collapsible lessons'
          git push origin HEAD:student-recent-shares-collapsible-lessons
