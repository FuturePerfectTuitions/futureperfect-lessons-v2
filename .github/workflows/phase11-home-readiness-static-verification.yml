name: Phase 11 home readiness static verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase11.html'
      - 'assets/phase11-home-readiness.js'
      - 'tests/phase11-home-readiness-static-verification.mjs'
      - '.github/workflows/phase11-home-readiness-static-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Phase 11 curriculum readiness prefetch
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/phase11-home-readiness.js
          node --experimental-default-type=module tests/phase11-home-readiness-static-verification.mjs
