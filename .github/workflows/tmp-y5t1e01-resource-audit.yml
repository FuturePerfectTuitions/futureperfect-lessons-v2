name: Temporary Y5T1E01 resource audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-y5t1e01-resource-audit.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  audit:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read live Y5T1E01 lesson record and matching R2 references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const workerName = String(process.env.WORKER_NAME || '').trim();
          if (!accountId || !token || !workerName) throw new Error('Missing Cloudflare configuration');

          const targets = new Set([
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Adventure.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Chiller.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fable.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fantasy.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Mystery.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Myths and Legends.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Sci-Fi.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Traditional Tale.pdf'
          ]);

          async function cf(pathname, init = {}) {
            const res = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              ...init,
              headers: { Authorization: `Bearer ${token}`, ...(init.body ? {'Content-Type':'application/json'} : {}), ...(init.headers || {}) }
            });
            const body = await res.json().catch(() => null);
            if (!res.ok || !body?.success) throw new Error(`Cloudflare request failed ${pathname} HTTP ${res.status}`);
            return body;
          }
          const settings = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const bind = (name,type) => settings.result.bindings.find(x => x?.name===name && (!type || x?.type===type));
          const env = String(bind('ENVIRONMENT','plain_text')?.text || '');
          const lessonsId = String(bind('LESSONS_KV','kv_namespace')?.namespace_id || '');
          const bucket = String(bind('MATERIALS_R2','r2_bucket')?.bucket_name || '');
          if (env !== 'production' || !lessonsId || !bucket) throw new Error(`Unexpected production bindings env=${env}`);

          const keys=[]; let cursor='';
          for (;;) {
            const q = new URLSearchParams({limit:'1000'}); if (cursor) q.set('cursor',cursor);
            const body = await cf(`/accounts/${accountId}/storage/kv/namespaces/${lessonsId}/keys?${q}`);
            for (const x of body.result || []) if (String(x?.name||'').startsWith('lesson:')) keys.push(x.name);
            cursor=String(body?.result_info?.cursor||''); if(!cursor) break;
          }

          async function bulkGet(chunk) {
            const body = await cf(`/accounts/${accountId}/storage/kv/namespaces/${lessonsId}/bulk/get`, {method:'POST', body:JSON.stringify({keys:chunk,type:'text',withMetadata:false})});
            return body?.result?.values || {};
          }
          const values={};
          for (let i=0;i<keys.length;i+=100) Object.assign(values, await bulkGet(keys.slice(i,i+100)));

          function hasDisplayId(v) {
            if (!v || typeof v !== 'object') return false;
            if (v.lessonId === 'Y5T1E01' || v.displayId === 'Y5T1E01') return true;
            if (v.displayIds && Object.values(v.displayIds).some(x => String(x)==='Y5T1E01')) return true;
            return false;
          }
          const found=[];
          for (const [key,raw] of Object.entries(values)) {
            try { const rec=JSON.parse(String(raw)); if (hasDisplayId(rec)) found.push({key,rec}); } catch {}
          }
          if (found.length !== 1) throw new Error(`Expected exactly one Y5T1E01 record, found ${found.length}`);
          const {key:lessonKey,rec} = found[0];

          const refs=[];
          function walk(v,path='$') {
            if (Array.isArray(v)) return v.forEach((x,i)=>walk(x,`${path}[${i}]`));
            if (!v || typeof v!=='object') return;
            if (typeof v.r2Key==='string') {
              const base=v.r2Key.split('/').pop();
              refs.push({path,r2Key:v.r2Key,basename:base,title:v.title||v.label||v.name||v.displayName||null});
            }
            for (const [k,x] of Object.entries(v)) walk(x,`${path}.${k}`);
          }
          walk(rec);
          const matches=refs.filter(x=>targets.has(x.basename));
          console.log(JSON.stringify({status:matches.length===8?'PASS':'STOP',environment:env,bucket,lessonKey,lessonId:rec.lessonId||null,displayIds:rec.displayIds||null,targetCount:targets.size,matchCount:matches.length,matches},null,2));
          if (matches.length !== 8 || new Set(matches.map(x=>x.basename)).size !== 8) process.exit(2);
          NODE
