name: Audit prepared global SATS catalogue

on:
  push:
    branches:
      - ops/purge-lessons-cache-20261002
    paths:
      - '.github/workflows/audit-prepared-global-sats-20261002.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-rebuild-student-prod
    steps:
      - name: Inspect exact prepared global read model read-only
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error             "$API/workers/scripts/$WORKER_NAME/settings"             "${AUTH[@]}" -o /tmp/settings.json

          NS="$(jq -r '.result.bindings[] | select(.name=="READ_MODELS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$NS"; test "$NS" != null

          pointer_key='rm:v1:scope:global:current'
          pointer_enc="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("rm:v1:scope:global:current", safe=""))')"
          curl --fail --silent --show-error             "$API/storage/kv/namespaces/$NS/values/$pointer_enc"             "${AUTH[@]}" -o /tmp/pointer.json

          echo 'GLOBAL_POINTER_SUMMARY='
          jq -c '{kind,scope,current:{version:.current.version,sha256:.current.sha256},previous:{version:.previous.version,sha256:.previous.sha256}}' /tmp/pointer.json

          version="$(jq -r '.current.version' /tmp/pointer.json)"
          test -n "$version"; test "$version" != null
          version_key="rm:v1:scope:global:version:$version"
          version_enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe="").replace("%","_"))' "$version_key")"

          # Resolver encodes only the scope/version components, not the whole key separators.
          encoded_version="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe="").replace("%","_"))' "$version")"
          envelope_key="rm:v1:scope:global:version:$encoded_version"
          envelope_enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$envelope_key")"

          curl --fail --silent --show-error             "$API/storage/kv/namespaces/$NS/values/$envelope_enc"             "${AUTH[@]}" -o /tmp/envelope.json

          jq -e '.kind=="prepared-read-model-envelope" and .scope=="global"' /tmp/envelope.json >/dev/null

          python3 - <<'PY'
          import json,re,pathlib
          obj=json.loads(pathlib.Path('/tmp/envelope.json').read_text())
          payload=obj.get('payload') or {}
          print('PAYLOAD_KEYS=',sorted(payload.keys()))
          nav=payload.get('navigation') or payload.get('views') or []
          print('NAVIGATION=',[(v.get('viewId'),v.get('label'),v.get('lessonCount'),v.get('visibleLessonCount')) for v in nav if isinstance(v,dict)])

          def walk(node,path='payload'):
              if isinstance(node,dict):
                  for k,v in node.items():
                      yield from walk(v,f'{path}.{k}')
              elif isinstance(node,list):
                  # If this looks like a lesson-row list, inspect it as a unit.
                  rows=[x for x in node if isinstance(x,dict)]
                  if rows:
                      sats=[]
                      for row in rows:
                          ids=[str(row.get(x) or '') for x in ('lessonId','displayLessonId','canonicalLessonId')]
                          hit=False
                          for value in ids:
                              if re.match(r'^Y6(?:SM|MS)\d+$',value,re.I):
                                  hit=True
                              m=re.match(r'^Y6M(\d+)$',value,re.I)
                              if m and 51 <= int(m.group(1)) <= 69:
                                  hit=True
                          if hit:
                              sats.append({
                                  'lessonId':row.get('lessonId'),
                                  'displayLessonId':row.get('displayLessonId'),
                                  'canonicalLessonId':row.get('canonicalLessonId'),
                                  'title':row.get('title')
                              })
                      if sats:
                          print('SATS_ROWS_AT',path,'COUNT',len(sats),'SAMPLE',sats[:8])
                  for i,v in enumerate(node):
                      yield from walk(v,f'{path}[{i}]')

          list(walk(payload))
          PY
          echo 'PREPARED_GLOBAL_SATS_AUDIT_COMPLETE'
