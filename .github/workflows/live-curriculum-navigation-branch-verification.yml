name: Live curriculum navigation branch verification

on:
  push:
    branches: [fix/live-curriculum-navigation-authority]
    paths:
      - '.github/workflows/live-curriculum-navigation-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify navigation and entitlement regressions
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          grep -Fq 'LIVE_CURRICULUM_AUTHORITY_V1' worker/src/phase11-navigation-cache.js
          echo 'LIVE_CURRICULUM_NAV_BRANCH_PASS'
