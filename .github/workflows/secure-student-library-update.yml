# Exact-scope English entitlement update retry
name: Secure production entitlement update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-student-library-update.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - name: Apply encrypted additive student-library update
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl -fsSL 'https://raw.githubusercontent.com/FuturePerfectTuitions/futureperfect-lessons-v2/3ff1e74c177474d21500f78e8cc68715a863439a/.secure-provisioning/private.enc.json' -o /tmp/fpt-private.enc.json
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          async function main() {
            const token = String(process.env.CLOUDFLARE_API_TOKEN || '');
            const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
            const workerName = String(process.env.WORKER_NAME || 'fpt-portal-v2-worker');
            if (!token || !accountId) throw new Error('Required protected credentials are unavailable.');

            const wrappedPrivate = JSON.parse(fs.readFileSync('/tmp/fpt-private.enc.json', 'utf8'));
            if (wrappedPrivate.schema !== 'fpt-prod-private-key-wrap-v1') throw new Error('Unexpected private-key envelope.');
            const wrapKey = crypto.createHash('sha256').update('fpt-prod-provision-wrap-v1\0').update(token).digest();
            const privateDecipher = crypto.createDecipheriv('aes-256-gcm', wrapKey, Buffer.from(wrappedPrivate.iv, 'base64'));
            privateDecipher.setAuthTag(Buffer.from(wrappedPrivate.tag, 'base64'));
            const privatePem = Buffer.concat([
              privateDecipher.update(Buffer.from(wrappedPrivate.ciphertext, 'base64')),
              privateDecipher.final()
            ]).toString('utf8');

            const envelope = JSON.parse(fs.readFileSync('.secure-update/payload.enc.json', 'utf8'));
            if (envelope.schema !== 'fpt-prod-payload-envelope-v1') throw new Error('Unexpected payload envelope.');
            const dataKey = crypto.privateDecrypt({
              key: privatePem,
              oaepHash: 'sha256',
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING
            }, Buffer.from(envelope.wrappedKey, 'base64'));
            const decipher = crypto.createDecipheriv('aes-256-gcm', dataKey, Buffer.from(envelope.iv, 'base64'));
            decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
            const payload = JSON.parse(Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
              decipher.final()
            ]).toString('utf8'));

            if (payload.schema !== 'fpt-portal-v2-secure-student-update-v1') throw new Error('Unexpected update schema.');
            const id = String(payload.portalUserId || '').trim().toLowerCase();
            const expectedFirstName = String(payload.expectedFirstName || '').trim();
            const required = Array.isArray(payload.requiredExistingFullLibraries) ? payload.requiredExistingFullLibraries.map(String) : [];
            const additions = Array.isArray(payload.addFullLibraries) ? payload.addFullLibraries.map(String) : [];
            const allowed = new Set(['ENGLISH_Y3_FULL', 'ENGLISH_Y4_FULL']);
            if (!id || !expectedFirstName || required.length !== 0 || additions.length !== 2 || !additions.every(code => allowed.has(code))) {
              throw new Error('Encrypted update failed its exact-scope guard.');
            }

            async function cf(pathname, init = {}) {
              const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
                ...init,
                headers: {
                  Authorization: `Bearer ${token}`,
                  ...(init.body ? { 'Content-Type': 'application/json' } : {}),
                  ...(init.headers || {})
                }
              });
              const body = await response.json().catch(() => null);
              if (!response.ok || !body?.success) throw new Error(`Protected Cloudflare operation failed: HTTP ${response.status}`);
              return body;
            }

            const settings = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
            const bindings = settings?.result?.bindings || [];
            const environment = String(bindings.find(item => item?.name === 'ENVIRONMENT' && item?.type === 'plain_text')?.text || '');
            if (environment !== 'production') throw new Error('Refusing to update a non-production Worker binding set.');
            const studentsId = String(bindings.find(item => item?.name === 'STUDENTS_KV' && item?.type === 'kv_namespace')?.namespace_id || '');
            if (!studentsId) throw new Error('Production Students KV binding is unavailable.');

            const key = `user:${id}`;
            async function getRecord() {
              const body = await cf(`/accounts/${accountId}/storage/kv/namespaces/${studentsId}/bulk/get`, {
                method: 'POST',
                body: JSON.stringify({ keys: [key], type: 'text', withMetadata: false })
              });
              const raw = body?.result?.values?.[key];
              if (!raw) throw new Error('Target student record was not found.');
              return JSON.parse(String(raw));
            }
            async function putRecord(record) {
              const body = await cf(`/accounts/${accountId}/storage/kv/namespaces/${studentsId}/bulk`, {
                method: 'PUT',
                body: JSON.stringify([{ key, value: JSON.stringify(record) }])
              });
              if ((body?.result?.unsuccessful_keys || []).length) throw new Error('KV update reported an unsuccessful key.');
            }

            const before = await getRecord();
            if (String(before.portalUserId || '').trim().toLowerCase() !== id) throw new Error('Target identity validation failed.');
            if (String(before.firstName || '').trim() !== expectedFirstName) throw new Error('Target first-name validation failed.');
            const beforeLibraries = Array.isArray(before.fullLibraries) ? before.fullLibraries.map(String) : [];
            const merged = [...beforeLibraries];
            for (const code of additions) if (!merged.includes(code)) merged.push(code);
            const after = { ...before, fullLibraries: merged };
            const withoutLibraries = value => {
              const clone = { ...value };
              delete clone.fullLibraries;
              return JSON.stringify(clone);
            };
            if (withoutLibraries(before) !== withoutLibraries(after)) throw new Error('Non-library mutation detected before write.');

            await putRecord(after);
            try {
              let verified = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const actual = await getRecord();
                const libraries = Array.isArray(actual.fullLibraries) ? actual.fullLibraries.map(String) : [];
                if (withoutLibraries(actual) === withoutLibraries(before) && additions.every(code => libraries.includes(code))) {
                  verified = true;
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 1500));
              }
              if (!verified) throw new Error('Post-write verification did not reach exact parity.');
            } catch (error) {
              await putRecord(before).catch(() => {});
              throw error;
            }

            console.log('SECURE_PRODUCTION_ENTITLEMENT_UPDATE_PASS libraries_added=2');
          }

          main().catch(error => {
            console.error(error?.message || 'Secure entitlement update failed.');
            process.exit(1);
          });
          NODE
