name: Guarded duplicate English card prepared-model correction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-v2-one-off-20261124
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish only verified target prepared navigation correction
        shell: bash
        run: |
          set -euo pipefail
          cat > .one-off-card-20261124.mjs <<'NODE'
          import {createHash} from 'node:crypto';
          import {SCOPE_SALT_KEY,opaqueAccessScopeId,resolveCurrentScope,globalToCatalogue,pointerKey,stableStringify,assertCanonicalAccessProjected,publishScopeAtomic} from './worker/src/access-read-model-sync.js';
          import {loadStudentAccessInput,compileAuthoritativeAccessScope,refreshStudentAccessReadModel,assertReadModelReconciliationReady} from './worker/src/access-read-model-sync-v2.js';
          const norm=v=>String(v??'').trim().toLowerCase();
          const hash=v=>createHash('sha256').update(norm(v)).digest('hex');
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error('MISSING_CREDENTIALS');
          const ids={STUDENTS_KV:'c9723c8806334e4ea54d1b456d31b794',READ_MODELS_KV:'77b35165c8694087bc1b0515c35a7e89',DB:'97250a54-fa91-45ad-a002-3c4566b1fc38'};
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function request(path,options={}){
           const r=await fetch(base+path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});
           const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{}
           return {r,raw,j};
          }
          async function api(path,options){const {r,j}=await request(path,options);if(!r.ok||!j?.success)throw Error('API_FAILURE_'+r.status);return j;}
          const settings=(await api('/workers/scripts/fpt-portal-v2-worker/settings')).result;
          for(const [name,id] of Object.entries(ids)){const b=settings.bindings.find(x=>x.name===name);if((name==='DB'?(b?.database_id||b?.id):b?.namespace_id)!==id)throw Error('BINDING_DRIFT');}
          const ns=n=>'/storage/kv/namespaces/'+ids[n];
          async function get(n,k){const {r,raw}=await request(ns(n)+'/values/'+encodeURIComponent(k));if(r.status===404)return null;if(!r.ok)throw Error('KV_READ_FAILED');return raw;}
          let studentKey='',scopePrefix='';
          async function put(n,k,v){if(!(n==='STUDENTS_KV'&&k===studentKey)&&!(n==='READ_MODELS_KV'&&scopePrefix&&k.startsWith(scopePrefix)&&(k.endsWith(':current')||k.includes(':version:'))))throw Error('WRITE_SCOPE_VIOLATION');await api(ns(n)+'/values/'+encodeURIComponent(k),{method:'PUT',headers:{'content-type':'text/plain'},body:v});}
          const students={get:async(k,o)=>{const v=await get('STUDENTS_KV',k);return o?.type==='json'&&v?JSON.parse(v):v;},put:(k,v)=>put('STUDENTS_KV',k,v)};
          const store={get:k=>get('READ_MODELS_KV',k),put:(k,v)=>put('READ_MODELS_KV',k,v)};
          const db={prepare(sql){if(!/^\s*SELECT\b/i.test(sql))throw Error('D1_WRITE_FORBIDDEN');return {bind(...params){return {...this,params}},async all(){const j=await api('/d1/database/'+ids.DB+'/query',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql,params:this.params||[]})});return {results:j.result[0].results||[]};}}}};
          const env={STUDENTS_KV:students,READ_MODELS_KV:store,DB:db};
          await assertReadModelReconciliationReady(env);
          const salt=await store.get(SCOPE_SALT_KEY);
          const catalogue=globalToCatalogue((await resolveCurrentScope(store,'global')).payload);
          const target='849cb0835c0b1d1ef6f57e936929e5acd32ffbb5384fac81ca4ceb08f955c397';
          let cursor='',count=0;const matches=[];
          do {
           const j=await api(ns('STUDENTS_KV')+'/keys?limit=1000&prefix=user%3A'+(cursor?'&cursor='+encodeURIComponent(cursor):''));
           for(const k of j.result){
            if(++count>1500)throw Error('SCAN_LIMIT');
            const p=await students.get(k.name,{type:'json'});
            if(hash(p?.firstName)===target&&norm(p.accountStatus||p.status||'active')==='active'&&!p.isAdmin&&!p.superuser&&!norm(p.role||p.accountType).includes('admin'))matches.push(k.name);
           }
           cursor=j.result_info?.cursor||'';
          }while(cursor);
          if(matches.length!==1)throw Error('IDENTITY_NOT_UNIQUE');
          const key=matches[0],id=key.slice(5),raw=await get('STUDENTS_KV',key),user=JSON.parse(raw);
          if(norm(user.portalUserId)!==id||hash(user.firstName)!==target)throw Error('IDENTITY_GUARD');
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const scopeId=await opaqueAccessScopeId(id,salt),scope='access:'+scopeId;
          scopePrefix=pointerKey(scope).slice(0,-7);
          // Canonical profile and D1 are read-only; only this student's prepared pointer/version may be published.
          const input=await loadStudentAccessInput(env,id,date);
          const compiled=compileAuthoritativeAccessScope(input,catalogue,scopeId,date);
          assertCanonicalAccessProjected(input,compiled);
          const prior=await resolveCurrentScope(store,scope);
          if(prior.usedFallback)throw Error('PREPARED_FALLBACK_ACTIVE');
          const same=(a,b)=>stableStringify(a)===stableStringify(b);
          if(!same(prior.payload.snapshot.lessonAccess,compiled.snapshot.lessonAccess))throw Error('CANONICAL_PREPARED_ACCESS_DRIFT');
          const old=prior.payload.snapshot;
          const standard=old.views.find(v=>v.viewId==='english-year4');
          const retained=old.views.find(v=>v.viewId==='english-year4-11plus'&&!v.lockedPreview);
          if(!retained)throw Error('RETAINED_YEAR4_11PLUS_MISSING');
          const normalLessons=catalogue.views['english-year4']?.lessons;
          const plusLessons=catalogue.views['english-year4-11plus']?.lessons;
          if(!normalLessons?.length||!plusLessons?.length)throw Error('CATALOGUE_MISSING');
          const plusIds=new Set(plusLessons.map(x=>x.lessonId));
          if(normalLessons.some(x=>!plusIds.has(x.lessonId)&&(old.lessonAccess[x.lessonId]?.core||old.lessonAccess[x.lessonId]?.vr||old.lessonAccess[x.lessonId]?.preLessonOnly)))throw Error('UNIQUE_ACCESS_WOULD_BE_HIDDEN');
          if(!standard){console.log('KIAAN_PREPARED_ALREADY_CORRECT');process.exit(0);}
          const next=structuredClone(prior.payload);
          next.snapshot.views=next.snapshot.views.filter(v=>v.viewId!=='english-year4');
          assertCanonicalAccessProjected(input,next);
          if(await get('STUDENTS_KV',key)!==raw||(await resolveCurrentScope(store,scope)).sha256!==prior.sha256)throw Error('CONCURRENT_CHANGE');
          try{
           const published=await publishScopeAtomic(store,{scope,payload:next});
           const readback=await resolveCurrentScope(store,scope);
           if(readback.usedFallback||readback.sha256!==published.payloadSha256||!same(readback.payload,next)||await get('STUDENTS_KV',key)!==raw)throw Error('READBACK_FAILED');
           console.log('KIAAN_PREPARED_READBACK_PASS: standard Year 4 removed; all other views and lesson access unchanged; canonical record unchanged');
          }catch(e){
           const current=await resolveCurrentScope(store,scope).catch(()=>null);
           if(current&&same(current.payload,next)){
            await publishScopeAtomic(store,{scope,payload:prior.payload});
            if(!same((await resolveCurrentScope(store,scope)).payload,prior.payload))throw Error('ROLLBACK_READBACK_FAILED');
            console.log('ROLLBACK_PASS');
           }
           throw Error('PUBLICATION_FAILED');
          }
          NODE
          node --check .one-off-card-20261124.mjs
          node .one-off-card-20261124.mjs
