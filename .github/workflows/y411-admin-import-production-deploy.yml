name: Year 4 11+ admin import production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/y411-admin-import-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 Year 4 11+ Maths L1 baseline import

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Change 14 and importer regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change14.js
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change14.js"' worker/wrangler.toml
          grep -Fq 'expandYear4ElevenPlusMathsBaselineRows' worker/src/index-phase20-change14.js
          echo 'Y411_IMPORT_STATIC_PASS'

      - name: Require production bindings and admin-import secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/y411-settings.json
          jq -e '.success == true' /tmp/y411-settings.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/y411-settings.json >/dev/null
          done
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_PASSWORD") != null' /tmp/y411-settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_SESSION_SECRET") != null' /tmp/y411-settings.json >/dev/null
          echo 'Y411_PRODUCTION_BINDINGS_PASS'

      - name: Deploy current production Worker preserving bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          echo 'Y411_PRODUCTION_DEPLOY_PASS'

      - name: Verify live admin security boundary after deploy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'

          code="$(curl --silent --show-error --output /tmp/y411-login.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"password":"__deliberately_wrong__"}' \
            "$BASE/api/v1/admin/lesson-releases/login")"
          test "$code" = '401'
          jq -e '.error == "UNAUTHORISED"' /tmp/y411-login.json >/dev/null

          code="$(curl --silent --show-error --output /tmp/y411-preview.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"rows":[{"Student":"Probe","Subject":"Maths","Mode":"Y411FM","Lesson":"L2T1M01 Probe","LessonDated":"7th September 2026","LessonStatus":"completed"}]}' \
            "$BASE/api/v1/admin/lesson-releases/preview")"
          test "$code" = '401'
          jq -e '.error == "UNAUTHORISED"' /tmp/y411-preview.json >/dev/null
          echo 'Y411_LIVE_SECURITY_PASS'
