name: Ops Y5E2 VR homework replacement apply v3

on:
  push:
    branches:
      - ops/y5e2-vr-homework-replace-2026-09-17
    paths:
      - '.github/workflows/ops-y5e2-vr-homework-replacement-apply-v3.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AUTHORITY_BRANCH: fix/importer-publish-email-per-lesson-2026-09-16
  AUTHORITY_SHA: 53c80f1ba68caabeb0da272c647b3dc1fbe48b0f
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  MATERIALS_R2: fpt-materials-dev
  EXPECTED_PREPARED_VERSION: cp12-ui-0cdaf84f0988b1b8-34949406556
  DRIVE_FILE_ID: 1G5b015ALOcHqDXakPpyumuh-PN2Ej7oC
  OLD_NAME: FAR210225Y5T1EE01VRH01.pdf
  OLD_KEY: english/year5/Y5T1E01/vr/homework/sheets/FAR210225Y5T1EE01VRH01.pdf
  NEW_NAME: FAR210225Y5E2.pdf
  NEW_KEY: english/year5/Y5T1E01/vr/homework/sheets/FAR210225Y5E2.pdf
  NEW_SIZE: '236797'
  NEW_SHA256: 86288e1f40ef8b012ad791fc3be70026cd3d274c8a586e0188ca51867c1fdbd5

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact replacement privately from Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import hashlib,json,os,pathlib,requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info=json.loads(os.environ['GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/drive.readonly']); creds.refresh(Request())
          r=requests.get(f"https://www.googleapis.com/drive/v3/files/{os.environ['DRIVE_FILE_ID']}?alt=media&supportsAllDrives=true",headers={'Authorization':f'Bearer {creds.token}'},timeout=60); r.raise_for_status(); data=r.content
          got=hashlib.sha256(data).hexdigest()
          if len(data)!=int(os.environ['NEW_SIZE']) or got!=os.environ['NEW_SHA256'] or data[:4]!=b'%PDF': raise SystemExit(f'Drive verification failed size={len(data)} sha={got}')
          pathlib.Path('/tmp/new.pdf').write_bytes(data); print(f'DRIVE_FILE_VERIFIED size={len(data)} sha256={got}')
          PY
      - name: Guard current production and build surgical candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote origin "refs/heads/${AUTHORITY_BRANCH}" | awk '{print $1}')" = "$AUTHORITY_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs'; import { stableStringify,sha256Hex,pointerKey,versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const c=v=>String(v??'').trim(),account=c(process.env.CLOUDFLARE_ACCOUNT_ID),token=c(process.env.CLOUDFLARE_API_TOKEN),base='https://api.cloudflare.com/client/v4',H={Authorization:`Bearer ${token}`};
          async function req(path,o={}){const r=await fetch(`${base}${path}`,{...o,headers:{...H,...(o.headers||{})}}),text=await r.text();let body=null;try{body=JSON.parse(text)}catch{}return{r,text,body}} async function cf(path){const x=await req(path);if(!x.r.ok||x.body?.success!==true)throw new Error(`CF ${x.r.status}:${path}`);return x.body.result} async function get(ns,key){const x=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(!x.r.ok)throw new Error(`KV ${x.r.status}:${key}`);return x.text}
          const host=c(process.env.PROD_HOST).toLowerCase(),browser=c(process.env.BROWSER_WORKER),student=c(process.env.STUDENT_WORKER),legacy=c(process.env.LEGACY_WORKER),lessons=c(process.env.LESSONS_KV),read=c(process.env.READ_MODELS_KV),bucket=c(process.env.MATERIALS_R2),oldName=c(process.env.OLD_NAME),oldKey=c(process.env.OLD_KEY),newName=c(process.env.NEW_NAME),newKey=c(process.env.NEW_KEY),expected=c(process.env.EXPECTED_PREPARED_VERSION);
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`),zone=zones.filter(z=>host===z.name||host.endsWith(`.${z.name}`)).sort((a,b)=>b.name.length-a.name.length)[0],routes=await cf(`/zones/${zone.id}/workers/routes`),hr=routes.filter(r=>c(r.pattern).toLowerCase()===`${host}/*`);if(hr.length!==1||c(hr[0].script)!==browser)throw new Error('Route drift');
          const bb=(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(browser)}/settings`))?.bindings||[],svc=bb.filter(b=>c(b.type)==='service');if(svc.length!==1||c(svc[0].service)!==student||bb.some(b=>/admin/i.test(`${c(b.name)} ${c(b.service)}`)))throw new Error('Browser topology drift');const lb=(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(legacy)}/settings`))?.bindings||[];if(c(lb.find(b=>c(b.name)==='LESSONS_KV')?.namespace_id)!==lessons||c(lb.find(b=>c(b.name)==='MATERIALS_R2')?.bucket_name)!==bucket)throw new Error('Legacy binding drift');const sb=(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(student)}/settings`))?.bindings||[];if(c(sb.find(b=>c(b.name)==='READ_MODELS_KV')?.namespace_id)!==read||c(sb.find(b=>c(b.name)==='MATERIALS_R2')?.bucket_name)!==bucket)throw new Error('Student binding drift');
          const sourceText=await get(lessons,'lesson:Y5E2'),source=JSON.parse(sourceText),hw=source?.vr?.homeworks?.[0]?.homework;if(c(source?.lessonId)!=='Y5E2'||c(hw?.displayName)!==oldName||c(hw?.r2Key)!==oldKey)throw new Error('Source drift');const pKey=pointerKey('lesson:Y5E2'),pointerText=await get(read,pKey),pointer=JSON.parse(pointerText);if(c(pointer?.current?.version)!==expected)throw new Error(`Pointer drift:${c(pointer?.current?.version)}`);const envelope=JSON.parse(await get(read,versionKey('lesson:Y5E2',expected))),rows=envelope?.payload?.resources||[],idx=rows.findIndex(r=>c(r.objectKey)===oldKey);if(idx<0||rows.filter(r=>c(r.objectKey)===oldKey).length!==1||rows.some(r=>c(r.objectKey)===newKey))throw new Error('Prepared drift');
          const nextSource=structuredClone(source);nextSource.vr.homeworks[0].homework={...nextSource.vr.homeworks[0].homework,displayName:newName,r2Key:newKey};const compiled=await compileLessonDetail(nextSource,{resourceExists:async()=>true}),candidate=(compiled.resources||[]).find(r=>c(r.objectKey)===newKey),current=rows[idx];if(!candidate||candidate.type!==current.type||candidate.presentationGroup!==current.presentationGroup||JSON.stringify(candidate.presentationScopes)!==JSON.stringify(current.presentationScopes)||Boolean(candidate.protected)!==Boolean(current.protected))throw new Error('Candidate semantics drift');const payload=structuredClone(envelope.payload);payload.resources[idx]=candidate;
          const changed=[];function d(a,b,p=''){if(Object.is(a,b))return;if(Array.isArray(a)&&Array.isArray(b)){for(let i=0;i<Math.max(a.length,b.length);i++)d(a[i],b[i],`${p}[${i}]`);return}if(a&&b&&typeof a==='object'&&typeof b==='object'){for(const k of new Set([...Object.keys(a),...Object.keys(b)]))d(a[k],b[k],p?`${p}.${k}`:k);return}changed.push(p)}d(envelope.payload,payload);if(changed.length!==2||!changed.includes(`resources[${idx}].displayName`)||!changed.includes(`resources[${idx}].objectKey`))throw new Error(`Unexpected diff:${JSON.stringify(changed)}`);
          const payloadText=stableStringify(payload),payloadSha=await sha256Hex(payloadText),version=`ops-y5e2-vr-${payloadSha.slice(0,16)}-${c(process.env.GITHUB_RUN_ID)}`,nextEnvelope={schemaVersion:1,kind:'prepared-read-model-envelope',scope:'lesson:Y5E2',version,sha256:payloadSha,payload},envelopeText=stableStringify(nextEnvelope),envelopeSha=await sha256Hex(envelopeText);fs.writeFileSync('/tmp/source-old.txt',sourceText);fs.writeFileSync('/tmp/source-new.txt',JSON.stringify(nextSource));fs.writeFileSync('/tmp/pointer-old.txt',pointerText);fs.writeFileSync('/tmp/envelope-new.txt',envelopeText);fs.writeFileSync('/tmp/meta.json',JSON.stringify({version,payloadSha,envelopeSha,previousVersion:expected,index:idx},null,2));
          NODE
      - name: Stage and hash-verify replacement R2 object
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@4.125.0 r2 object put "${MATERIALS_R2}/${NEW_KEY}" --file /tmp/new.pdf --content-type application/pdf --remote
          npx --yes wrangler@4.125.0 r2 object get "${MATERIALS_R2}/${NEW_KEY}" --file /tmp/r2-new.pdf --remote >/dev/null
          test "$(stat -c '%s' /tmp/r2-new.pdf)" = "$NEW_SIZE"
          test "$(sha256sum /tmp/r2-new.pdf | awk '{print $1}')" = "$NEW_SHA256"
      - name: Publish source and prepared model with final concurrency check
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {stableStringify,pointerKey,versionKey} from './rebuild/adminops/src/lib/atomic-publisher.mjs';const c=v=>String(v??'').trim(),account=c(process.env.CLOUDFLARE_ACCOUNT_ID),token=c(process.env.CLOUDFLARE_API_TOKEN),lessons=c(process.env.LESSONS_KV),read=c(process.env.READ_MODELS_KV),base='https://api.cloudflare.com/client/v4',H={Authorization:`Bearer ${token}`};async function req(path,o={}){const r=await fetch(`${base}${path}`,{...o,headers:{...H,...(o.headers||{})}}),text=await r.text();let body=null;try{body=JSON.parse(text)}catch{}return{r,text,body}}async function get(ns,key){const x=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(!x.r.ok)throw new Error(`KV get ${x.r.status}:${key}`);return x.text}async function put(ns,key,value){const x=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{method:'PUT',headers:{'content-type':'text/plain;charset=UTF-8'},body:value});if(!x.r.ok||x.body?.success!==true)throw new Error(`KV put ${x.r.status}:${key}`)}
          const oldSource=fs.readFileSync('/tmp/source-old.txt','utf8'),newSource=fs.readFileSync('/tmp/source-new.txt','utf8'),oldPointer=fs.readFileSync('/tmp/pointer-old.txt','utf8'),envelope=fs.readFileSync('/tmp/envelope-new.txt','utf8'),meta=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')),pKey=pointerKey('lesson:Y5E2');if((await get(lessons,'lesson:Y5E2'))!==oldSource)throw new Error('Concurrent source change');if((await get(read,pKey))!==oldPointer)throw new Error('Concurrent pointer change');let sourceWritten=false,pointerWritten=false;try{await put(lessons,'lesson:Y5E2',newSource);sourceWritten=true;if((await get(lessons,'lesson:Y5E2'))!==newSource)throw new Error('Source readback mismatch');await put(read,versionKey('lesson:Y5E2',meta.version),envelope);if((await get(read,versionKey('lesson:Y5E2',meta.version)))!==envelope)throw new Error('Envelope readback mismatch');const prior=JSON.parse(oldPointer),nextPointer={schemaVersion:1,kind:'prepared-read-model-pointer',scope:'lesson:Y5E2',current:{version:meta.version,sha256:meta.payloadSha,envelopeSha256:meta.envelopeSha},previous:prior.current||null,updatedAt:new Date().toISOString()};await put(read,pKey,stableStringify(nextPointer));pointerWritten=true;const confirmed=JSON.parse(await get(read,pKey));if(c(confirmed?.current?.version)!==meta.version)throw new Error('Pointer readback mismatch');fs.writeFileSync('/tmp/apply.json',JSON.stringify({marker:'Y5E2_VR_HOMEWORK_REPLACEMENT_APPLY_PASS',observedAt:new Date().toISOString(),previousVersion:meta.previousVersion,currentVersion:meta.version,newKey:process.env.NEW_KEY,newSha256:process.env.NEW_SHA256},null,2));console.log(`PUBLISHED_VERSION=${meta.version}`)}catch(e){if(pointerWritten)await put(read,pKey,oldPointer);if(sourceWritten)await put(lessons,'lesson:Y5E2',oldSource);throw e}
          NODE
      - name: Verify current student-facing model and R2 bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {pointerKey,versionKey} from './rebuild/adminops/src/lib/atomic-publisher.mjs';const c=v=>String(v??'').trim(),account=c(process.env.CLOUDFLARE_ACCOUNT_ID),token=c(process.env.CLOUDFLARE_API_TOKEN),lessons=c(process.env.LESSONS_KV),read=c(process.env.READ_MODELS_KV),base='https://api.cloudflare.com/client/v4',H={Authorization:`Bearer ${token}`},oldKey=c(process.env.OLD_KEY),oldName=c(process.env.OLD_NAME),newKey=c(process.env.NEW_KEY),newName=c(process.env.NEW_NAME);async function req(path){const r=await fetch(`${base}${path}`,{headers:H}),text=await r.text();return{r,text}}async function get(ns,key){const x=await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(!x.r.ok)throw new Error(`KV ${x.r.status}:${key}`);return x.text}const src=JSON.parse(await get(lessons,'lesson:Y5E2')),hw=src?.vr?.homeworks?.[0]?.homework;if(c(hw?.displayName)!==newName||c(hw?.r2Key)!==newKey)throw new Error('Source verify failed');const p=JSON.parse(await get(read,pointerKey('lesson:Y5E2'))),env=JSON.parse(await get(read,versionKey('lesson:Y5E2',p.current.version))),rows=env?.payload?.resources||[];if(rows.filter(r=>c(r.objectKey)===newKey&&c(r.displayName)===newName&&r.type==='homework'&&JSON.stringify(r.presentationScopes)===JSON.stringify(['vr'])).length!==1||rows.some(r=>c(r.objectKey)===oldKey||c(r.displayName)===oldName))throw new Error('Current student-facing model verify failed');fs.writeFileSync('/tmp/verify.json',JSON.stringify({marker:'Y5E2_VR_HOMEWORK_REPLACEMENT_MODEL_VERIFY_PASS',observedAt:new Date().toISOString(),currentVersion:c(p.current.version),newName,newKey,oldReferenceAbsent:true},null,2));console.log(`STUDENT_MODEL_VERIFIED version=${c(p.current.version)} new=${newName}`)
          NODE
          npx --yes wrangler@4.125.0 r2 object get "${MATERIALS_R2}/${NEW_KEY}" --file /tmp/r2-final.pdf --remote >/dev/null
          test "$(stat -c '%s' /tmp/r2-final.pdf)" = "$NEW_SIZE"
          test "$(sha256sum /tmp/r2-final.pdf | awk '{print $1}')" = "$NEW_SHA256"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y5e2-vr-homework-replacement-apply-v3
          path: |
            /tmp/apply.json
            /tmp/verify.json
          if-no-files-found: ignore
          retention-days: 30
