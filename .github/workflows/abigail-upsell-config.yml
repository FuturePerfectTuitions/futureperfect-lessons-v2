name: Configure Abigail immediate upsell views

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/abigail-upsell-config.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      TARGET_ID_SHA256: 4e80df5d8d5d1dfa83017f3bf2071c15fd696e03055d6c0bc394248288e4749a

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve production Students KV
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"

      - name: Locate target and prepare exact upsell patch
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix 'user:' --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          target=os.environ['TARGET_ID_SHA256']
          matches=[]
          for item in json.load(open('/tmp/keys.json',encoding='utf-8')):
              key=str(item.get('name') or '')
              if not key.startswith('user:'): continue
              suffix=key[5:].strip().lower()
              if hashlib.sha256(suffix.encode()).hexdigest()!=target: continue
              p=subprocess.run(['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
              if p.returncode: continue
              try: user=json.loads(p.stdout)
              except Exception: continue
              matches.append((key,user))
          if len(matches)!=1:
              print(f'TARGET_MATCH_COUNT={len(matches)}')
              sys.exit(2)
          key,user=matches[0]
          libs=sorted(str(x).strip().upper() for x in (user.get('fullLibraries') if isinstance(user.get('fullLibraries'),list) else []))
          if libs != ['ENGLISH_Y3_FULL']:
              print('FULL_LIBRARY_GUARD=false')
              sys.exit(3)
          before=json.loads(json.dumps(user))
          user['upsellViews']=['maths-year3','maths-year4']
          before_other=json.loads(json.dumps(before)); before_other.pop('upsellViews',None)
          after_other=json.loads(json.dumps(user)); after_other.pop('upsellViews',None)
          if before_other != after_other:
              print('UNRELATED_FIELD_GUARD=false')
              sys.exit(4)
          open('/tmp/target-key','w').write(key)
          json.dump(before,open('/tmp/before.json','w'),separators=(',',':'))
          json.dump(user,open('/tmp/after.json','w'),separators=(',',':'))
          print('TARGET_MATCH_COUNT=1')
          print('FULL_LIBRARY_GUARD=true')
          print('UPSELL_COUNT=2')
          PY

      - name: Persist target profile only
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key').read().strip(),safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/after.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}" \
            > /tmp/put.json
          jq -e '.success == true' /tmp/put.json >/dev/null

      - name: Verify exact persisted result
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key').read().strip(),safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/verify.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}"
          python3 - <<'PY'
          import json,sys
          before=json.load(open('/tmp/before.json'))
          verify=json.load(open('/tmp/verify.json'))
          if verify.get('upsellViews') != ['maths-year3','maths-year4']:
              print('UPSELL_VERIFY=false'); sys.exit(2)
          if sorted(str(x).strip().upper() for x in verify.get('fullLibraries',[])) != ['ENGLISH_Y3_FULL']:
              print('FULL_LIBRARY_VERIFY=false'); sys.exit(3)
          before.pop('upsellViews',None); verify.pop('upsellViews',None)
          if before != verify:
              print('UNRELATED_FIELDS_UNCHANGED=false'); sys.exit(4)
          print('UPSELL_VERIFY=true')
          print('FULL_LIBRARY_VERIFY=true')
          print('UNRELATED_FIELDS_UNCHANGED=true')
          PY
