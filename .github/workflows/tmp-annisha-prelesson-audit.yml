name: Temporary Annisha PreLesson read-only audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-annisha-prelesson-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4

      - name: Read Worker bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings.json > /tmp/lessons_kv_id
          jq -r '.result.bindings[] | select(.name=="STUDENTS_KV") | .namespace_id' /tmp/settings.json > /tmp/students_kv_id
          jq -r '.result.bindings[] | select(.name=="MATERIALS_R2") | .bucket_name' /tmp/settings.json > /tmp/bucket
          test -s /tmp/lessons_kv_id
          test -s /tmp/students_kv_id
          test -s /tmp/bucket
          echo "Bindings resolved." > audit/report.txt

      - name: Read Annisha student record and entitlement rows
        shell: bash
        run: |
          set -euo pipefail
          STUDENTS_KV_ID="$(cat /tmp/students_kv_id)"
          npx --yes wrangler@latest kv key get "user:ann3009" --namespace-id "$STUDENTS_KV_ID" --remote > /tmp/annisha.json
          {
            echo '=== Annisha student access fields (passwords redacted) ==='
            jq '{name, portalUserId, vrEligible, fullLibraries, manualAccess, blockedLessons}' /tmp/annisha.json
            echo '=== Full entitlements ==='
            npx --yes wrangler@latest d1 execute fpt_portal_v2_db --remote --command \
              "SELECT lesson_id, core_access, vr_access, source, source_batch_code, source_lesson_date FROM lesson_entitlements WHERE portal_user_id_norm='ann3009' ORDER BY lesson_id;"
            echo '=== PreLesson entitlements ==='
            npx --yes wrangler@latest d1 execute fpt_portal_v2_db --remote --command \
              "SELECT lesson_id, batch_key, lesson_date, vr_access, source_row_id FROM online_prelesson_entitlements WHERE portal_user_id_norm='ann3009' ORDER BY lesson_id, batch_key;"
          } >> audit/report.txt 2>&1

      - name: Read live Y5E2 VR resource record
        shell: bash
        run: |
          set -euo pipefail
          LESSONS_KV_ID="$(cat /tmp/lessons_kv_id)"
          npx --yes wrangler@latest kv key get "lesson:Y5E2" --namespace-id "$LESSONS_KV_ID" --remote > /tmp/y5e2.json
          {
            echo '=== Y5E2 identity/display IDs ==='
            jq '{lessonId, subject, active, displayIds}' /tmp/y5e2.json
            echo '=== Y5E2 VR PreLesson ==='
            jq '.vr.preLesson' /tmp/y5e2.json
          } >> audit/report.txt

      - name: Verify Y5E2 VR PreLesson R2 keys exist
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(cat /tmp/bucket)"
          cursor=''
          : > /tmp/r2keys.txt
          while :; do
            url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then
              enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${enc}"
            fi
            curl -fsS "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/r2-page.json
            jq -e '.success == true' /tmp/r2-page.json >/dev/null
            jq -r '.result[]?.key' /tmp/r2-page.json >> /tmp/r2keys.txt
            cursor="$(jq -r '.result_info.cursor // empty' /tmp/r2-page.json)"
            [ -z "$cursor" ] && break
          done
          python3 - <<'PY' >> audit/report.txt
          import json
          lesson=json.load(open('/tmp/y5e2.json'))
          keys=set(open('/tmp/r2keys.txt').read().splitlines())
          rows=(lesson.get('vr') or {}).get('preLesson') or []
          print('=== VR PreLesson R2 existence ===')
          for i,row in enumerate(rows,1):
              if not isinstance(row,dict):
                  print(i,'invalid-row')
                  continue
              sheet_key=row.get('r2Key') or ((row.get('sheet') or {}).get('r2Key') if isinstance(row.get('sheet'),dict) else None)
              answer=row.get('answerKey') or {}
              answer_key=answer.get('r2Key') if isinstance(answer,dict) else None
              print(f'pair {i}: sheet_key={sheet_key!r} exists={sheet_key in keys if sheet_key else False}')
              print(f'pair {i}: answer_key={answer_key!r} exists={answer_key in keys if answer_key else False}')
          PY

      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: annisha-prelesson-audit
          path: audit/report.txt
          retention-days: 1

      - name: Completed
        run: echo 'Read-only audit complete; no Portal data was changed.'
