name: Owner demo Full Library apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-demo-full-library-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Owner demo Full Library support
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source patch
        run: python ops/owner_demo_full_library_patch.py
      - name: Verify source syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/index-phase12.js
          node --check worker/src/index-phase19-access.js
      - name: Commit source
        run: |
          git config user.name FuturePerfectTuitions
          git config user.email futureperfectlessons@gmail.com
          git add worker/src/index.js worker/src/index-phase12.js worker/src/index-phase19-access.js
          if ! git diff --cached --quiet; then
            git commit -m 'Support owner demo Full Libraries'
            git push origin HEAD:main
          fi
      - name: Deploy Worker preserving bindings
        run: bash ops/deploy_current_worker_preserve.sh
      - name: Complete
        run: echo OWNER_DEMO_FULL_LIBRARY_DEPLOY_PASS
