name: Maths 11+ navigation branch verification

on:
  push:
    branches: [fix/maths-11plus-level-navigation]
    paths:
      - '.github/workflows/maths-11plus-navigation-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Change 15
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change15.js
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change15.js"' worker/wrangler.toml
          echo 'MATHS_11PLUS_NAV_BRANCH_PASS'
