name: Y4E1 live frontend read-only audit

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-live-frontend-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract actual live Vite API contract and resource grouping without mutation
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/root.html https://lessons.futureperfect.education/
          script="$(grep -oE 'src="\./assets/[^"]+\.js"' /tmp/root.html | head -n1 | sed -E 's/^src="\.([^\"]+)"$/\1/')"
          test -n "$script"
          curl -fsSL "https://lessons.futureperfect.education${script}" -o /tmp/live-bundle.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/live-bundle.js').read_text(errors='ignore')
          print('=== API-LIKE STRINGS ===')
          vals=sorted(set(re.findall(r'["`\']([^"`\']*(?:/api/|api/v|student/)[^"`\']*)["`\']', text)))
          for v in vals:
              if len(v)<300: print(v)
          print('=== CONTEXTS ===')
          for needle in ['resourcesIncluded','function fe','fe=','section','fetch(','/student/','lesson-detail','lessonId','resources||[]']:
              print(f'### {needle} count={text.count(needle)}')
              start=0; shown=0
              while shown<12:
                  i=text.find(needle,start)
                  if i<0: break
                  print(f'--- {shown+1} @ {i} ---')
                  print(text[max(0,i-2200):min(len(text),i+3200)].replace('\n',' '))
                  start=i+len(needle); shown+=1
          PY
