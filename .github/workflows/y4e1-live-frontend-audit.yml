name: Y4E1 live frontend read-only audit

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-live-frontend-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live portal frontend paths and renderer without mutation
        shell: bash
        run: |
          set -euo pipefail
          for path in '/' '/index.html' '/phase11.html' '/config.js' '/assets/phase7.js' '/assets/phase7.js?v=20260907-prelesson-empty-1'; do
            safe="$(printf '%s' "$path" | tr '/?=&' '____')"
            code="$(curl -sSL -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' "https://lessons.futureperfect.education${path}")"
            echo "=== ${path} status=${code} ==="
            grep -Ei '^(location|cache-control|etag|last-modified|cf-cache-status|age|content-type|server):' "/tmp/${safe}.headers" || true
            wc -c "/tmp/${safe}.body"
            sha256sum "/tmp/${safe}.body"
          done

          live=/tmp/_assets_phase7.js.body
          if [ -s "$live" ]; then
            echo '=== PRELESSON RENDERER IN LIVE /assets/phase7.js ==='
            grep -n -A8 -B2 'function renderPreLesson' "$live" || true
            echo '=== REPOSITORY PHASE7 HASH ==='
            sha256sum assets/phase7.js
            cmp -s "$live" assets/phase7.js && echo 'LIVE_PHASE7_EQUALS_REPO=true' || echo 'LIVE_PHASE7_EQUALS_REPO=false'
          fi

          for candidate in /tmp/_.body /tmp/_index.html.body /tmp/_phase11.html.body; do
            [ -s "$candidate" ] || continue
            if grep -q '<script' "$candidate"; then
              echo "=== SCRIPT REFERENCES: ${candidate} ==="
              grep -oE '<script[^>]+src="[^"]+"' "$candidate" | tail -n 40 || true
            fi
          done
