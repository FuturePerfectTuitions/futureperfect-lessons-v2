name: Y4E1 live frontend read-only audit

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-live-frontend-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace actual live Vite resource-section data model without mutation
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/root.html https://lessons.futureperfect.education/
          script="$(grep -oE 'src="\./assets/[^"]+\.js"' /tmp/root.html | head -n1 | sed -E 's/^src="\.([^\"]+)"$/\1/')"
          test -n "$script"
          curl -fsSL "https://lessons.futureperfect.education${script}" -o /tmp/live-bundle.js
          echo "LIVE_BUNDLE_PATH=${script}"
          sha256sum /tmp/live-bundle.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/live-bundle.js').read_text(errors='ignore')
          needles=[
            'core-prelesson','core-homework','verbal-reasoning',
            '/api/v1/student/lessons/','resources','resourceGroups','sections',
            'lesson.resources','s.resources','preLessonSheets','phase11Resources'
          ]
          for needle in needles:
              print(f'COUNT {needle!r}={text.count(needle)}')
          for needle in ['core-prelesson','/api/v1/student/lessons/','core-homework','verbal-reasoning']:
              print(f'=== CONTEXTS FOR {needle} ===')
              start=0; shown=0
              while shown<20:
                  i=text.find(needle,start)
                  if i<0: break
                  print(f'--- occurrence {shown+1} @ {i} ---')
                  print(text[max(0,i-1800):min(len(text),i+2600)].replace('\n',' '))
                  start=i+len(needle); shown+=1
          PY
