name: Enable preserved admin production login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-production-login.yml'

permissions:
  contents: read

jobs:
  enable-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
    steps:
      - uses: actions/checkout@v4

      - name: Validate current production state and prepare config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings-before.json

          plain() {
            jq -r --arg n "$1" '[.result.bindings[] | select(.name == $n and .type == "plain_text") | .text][0] // ""' /tmp/settings-before.json
          }
          binding_field() {
            local name="$1" type="$2" field="$3"
            jq -r --arg n "$name" --arg t "$type" --arg f "$field" '[.result.bindings[] | select(.name == $n and .type == $t) | .[$f]][0] // ""' /tmp/settings-before.json
          }

          test "$(plain ENVIRONMENT | tr '[:upper:]' '[:lower:]')" = "production"
          test "$(plain STUDENT_LOGIN_ENABLED | tr '[:upper:]' '[:lower:]')" = "true"

          ORIGINS="$(plain ALLOWED_ORIGINS)"
          printf '%s' "$ORIGINS" | tr ',' '\n' | grep -Fxq "$PRODUCTION_ORIGIN"

          STUDENTS_ID="$(binding_field STUDENTS_KV kv_namespace namespace_id)"
          LESSONS_ID="$(binding_field LESSONS_KV kv_namespace namespace_id)"
          DATABASE_ID="$(binding_field DB d1 id)"
          R2_BUCKET="$(binding_field MATERIALS_R2 r2_bucket bucket_name)"
          test -n "$STUDENTS_ID"
          test -n "$LESSONS_ID"
          test -n "$DATABASE_ID"
          test -n "$R2_BUCKET"

          curl --fail --silent --show-error "$API/storage/kv/namespaces/${STUDENTS_ID}/keys?prefix=user%3Aadmin&limit=10" -H "$AUTH" -o /tmp/admin-keys.json
          jq -e '.result[] | select(.name == "user:admin")' /tmp/admin-keys.json >/dev/null

          CURRENT_ALLOWLIST="$(plain PROD_LOGIN_ALLOWLIST)"
          CURRENT_COUNT="$(printf '%s' "$CURRENT_ALLOWLIST" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | sort -u | wc -l | tr -d ' ')"
          test "$CURRENT_COUNT" -ge 13
          UPDATED_ALLOWLIST="$({ printf '%s\n' "$CURRENT_ALLOWLIST" | tr ',' '\n'; printf '%s\n' admin; } | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | sort -u | paste -sd, -)"

          BEFORE_SECRETS="$(jq -c '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | sort' /tmp/settings-before.json)"
          printf '%s' "$BEFORE_SECRETS" > /tmp/secrets-before.json
          printf '%s' "$CURRENT_ALLOWLIST" > /tmp/allowlist-before.txt
          printf '%s' "$STUDENTS_ID" > /tmp/students-id.txt
          printf '%s' "$LESSONS_ID" > /tmp/lessons-id.txt
          printf '%s' "$DATABASE_ID" > /tmp/database-id.txt
          printf '%s' "$R2_BUCKET" > /tmp/r2-bucket.txt

          DEV_ALLOWLIST="$(plain DEV_LOGIN_ALLOWLIST)"
          cat > worker/wrangler.admin-login.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index-phase17.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true

          [vars]
          ENVIRONMENT = "production"
          ALLOWED_ORIGINS = "${ORIGINS}"
          DEV_LOGIN_ALLOWLIST = "${DEV_ALLOWLIST}"
          PROD_LOGIN_ALLOWLIST = "${UPDATED_ALLOWLIST}"
          STUDENT_LOGIN_ENABLED = "true"

          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_ID}"

          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_ID}"

          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2_BUCKET}"

          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DATABASE_ID}"
          EOF
          chmod 600 worker/wrangler.admin-login.toml
          echo "Preflight passed: preserved admin record exists; production state captured without exposing credentials."

      - name: Deploy admin-enabled production allowlist
        shell: bash
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.125.0 deploy --config worker/wrangler.admin-login.toml --keep-vars --message "Allow preserved admin login in production" >/dev/null 2>/tmp/wrangler-error.log; then
            echo "Wrangler deployment failed; no sensitive deployment output was printed."
            exit 1
          fi
          rm -f worker/wrangler.admin-login.toml /tmp/wrangler-error.log

      - name: Verify only admin was added and production bindings remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings-after.json

          plain_after() {
            jq -r --arg n "$1" '[.result.bindings[] | select(.name == $n and .type == "plain_text") | .text][0] // ""' /tmp/settings-after.json
          }
          binding_after() {
            local name="$1" type="$2" field="$3"
            jq -r --arg n "$name" --arg t "$type" --arg f "$field" '[.result.bindings[] | select(.name == $n and .type == $t) | .[$f]][0] // ""' /tmp/settings-after.json
          }

          test "$(plain_after ENVIRONMENT | tr '[:upper:]' '[:lower:]')" = "production"
          test "$(plain_after STUDENT_LOGIN_ENABLED | tr '[:upper:]' '[:lower:]')" = "true"
          test "$(binding_after STUDENTS_KV kv_namespace namespace_id)" = "$(cat /tmp/students-id.txt)"
          test "$(binding_after LESSONS_KV kv_namespace namespace_id)" = "$(cat /tmp/lessons-id.txt)"
          test "$(binding_after DB d1 id)" = "$(cat /tmp/database-id.txt)"
          test "$(binding_after MATERIALS_R2 r2_bucket bucket_name)" = "$(cat /tmp/r2-bucket.txt)"

          BEFORE_SORTED="$(cat /tmp/allowlist-before.txt | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | sort -u)"
          AFTER_SORTED="$(plain_after PROD_LOGIN_ALLOWLIST | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | tr '[:upper:]' '[:lower:]' | sort -u)"
          EXPECTED_SORTED="$({ printf '%s\n' "$BEFORE_SORTED"; printf '%s\n' admin; } | sed '/^$/d' | sort -u)"
          test "$AFTER_SORTED" = "$EXPECTED_SORTED"
          printf '%s\n' "$AFTER_SORTED" | grep -Fxq admin

          AFTER_SECRETS="$(jq -c '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | sort' /tmp/settings-after.json)"
          test "$AFTER_SECRETS" = "$(cat /tmp/secrets-before.json)"

          echo "ADMIN_ALLOWLIST_FIX_PASS: existing admin login is permitted again; student allowlist, bindings and secrets are preserved."
