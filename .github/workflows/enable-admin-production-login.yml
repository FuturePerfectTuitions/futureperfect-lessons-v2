name: Enable preserved admin production login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-production-login.yml'

permissions:
  contents: read

jobs:
  enable-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare admin-enabled production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs = require('fs');
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const workerName = process.env.WORKER_NAME;

          async function api(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body?.success) throw new Error(`Cloudflare API failed: ${path} HTTP ${response.status}`);
            return body;
          }
          function binding(settings, name, type = null) {
            return (settings?.result?.bindings || []).find(b => b?.name === name && (!type || b?.type === type)) || null;
          }
          function plain(settings, name) {
            return String(binding(settings, name, 'plain_text')?.text || '');
          }
          function secretNames(settings) {
            return (settings?.result?.bindings || []).filter(b => String(b?.type || '').includes('secret')).map(b => String(b.name)).sort();
          }

          const settings = await api(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          if (plain(settings, 'ENVIRONMENT').trim().toLowerCase() !== 'production') throw new Error('Worker is not in production mode.');
          if (plain(settings, 'STUDENT_LOGIN_ENABLED').trim().toLowerCase() !== 'true') throw new Error('Student login is not enabled.');

          const origins = plain(settings, 'ALLOWED_ORIGINS');
          if (!origins.split(',').map(x => x.trim()).includes(process.env.PRODUCTION_ORIGIN)) throw new Error('Production origin is missing.');

          const studentsId = String(binding(settings, 'STUDENTS_KV', 'kv_namespace')?.namespace_id || '');
          const lessonsId = String(binding(settings, 'LESSONS_KV', 'kv_namespace')?.namespace_id || '');
          const databaseId = String(binding(settings, 'DB', 'd1')?.id || '');
          const databaseName = String(binding(settings, 'DB', 'd1')?.database_name || 'fpt_portal_v2_db');
          const r2Bucket = String(binding(settings, 'MATERIALS_R2', 'r2_bucket')?.bucket_name || '');
          if (!studentsId || !lessonsId || !databaseId || !r2Bucket) throw new Error('Required production bindings are missing.');

          const keys = await api(`/accounts/${accountId}/storage/kv/namespaces/${studentsId}/keys?prefix=user%3Aadmin&limit=10`);
          if (!(keys.result || []).some(item => String(item.name) === 'user:admin')) throw new Error('Preserved user:admin record is missing.');

          const originalAllowlist = plain(settings, 'PROD_LOGIN_ALLOWLIST').split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
          if (originalAllowlist.length < 13) throw new Error('Existing production student allowlist is unexpectedly short.');
          const allowlist = [...new Set([...originalAllowlist, 'admin'])].sort();

          const config = `name = "${workerName}"\nmain = "src/index-phase17.js"\ncompatibility_date = "2026-08-20"\nkeep_vars = true\nworkers_dev = true\n\n[vars]\nENVIRONMENT = "production"\nALLOWED_ORIGINS = "${origins}"\nDEV_LOGIN_ALLOWLIST = "${plain(settings, 'DEV_LOGIN_ALLOWLIST')}"\nPROD_LOGIN_ALLOWLIST = "${allowlist.join(',')}"\nSTUDENT_LOGIN_ENABLED = "true"\n\n[[kv_namespaces]]\nbinding = "STUDENTS_KV"\nid = "${studentsId}"\n\n[[kv_namespaces]]\nbinding = "LESSONS_KV"\nid = "${lessonsId}"\n\n[[r2_buckets]]\nbinding = "MATERIALS_R2"\nbucket_name = "${r2Bucket}"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "${databaseName}"\ndatabase_id = "${databaseId}"\n`;
          fs.writeFileSync('worker/wrangler.admin-login.toml', config, { mode: 0o600 });
          fs.writeFileSync('/tmp/admin-login-before.json', JSON.stringify({
            originalAllowlist: [...new Set(originalAllowlist)].sort(),
            studentsId, lessonsId, databaseId, r2Bucket,
            secretNames: secretNames(settings)
          }), { mode: 0o600 });
          console.log('Preflight passed: preserved admin record exists and production bindings were captured.');
          NODE

      - name: Deploy admin-enabled production allowlist
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config worker/wrangler.admin-login.toml --keep-vars --message "Allow preserved admin login in production"
          rm -f worker/wrangler.admin-login.toml

      - name: Verify production invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const workerName = process.env.WORKER_NAME;
          const before = JSON.parse(fs.readFileSync('/tmp/admin-login-before.json', 'utf8'));

          async function api(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json().catch(() => null);
            if (!response.ok || !body?.success) throw new Error(`Cloudflare API failed: ${path} HTTP ${response.status}`);
            return body;
          }
          function binding(settings, name, type = null) {
            return (settings?.result?.bindings || []).find(b => b?.name === name && (!type || b?.type === type)) || null;
          }
          function plain(settings, name) {
            return String(binding(settings, name, 'plain_text')?.text || '');
          }
          function secretNames(settings) {
            return (settings?.result?.bindings || []).filter(b => String(b?.type || '').includes('secret')).map(b => String(b.name)).sort();
          }

          const settings = await api(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const afterAllowlist = [...new Set(plain(settings, 'PROD_LOGIN_ALLOWLIST').split(',').map(x => x.trim().toLowerCase()).filter(Boolean))].sort();
          const expected = [...new Set([...before.originalAllowlist, 'admin'])].sort();
          if (JSON.stringify(afterAllowlist) !== JSON.stringify(expected)) throw new Error('Production allowlist changed beyond adding admin.');
          if (plain(settings, 'ENVIRONMENT').trim().toLowerCase() !== 'production') throw new Error('Production mode changed unexpectedly.');
          if (plain(settings, 'STUDENT_LOGIN_ENABLED').trim().toLowerCase() !== 'true') throw new Error('Student login changed unexpectedly.');
          if (String(binding(settings, 'STUDENTS_KV', 'kv_namespace')?.namespace_id || '') !== before.studentsId) throw new Error('STUDENTS_KV binding changed.');
          if (String(binding(settings, 'LESSONS_KV', 'kv_namespace')?.namespace_id || '') !== before.lessonsId) throw new Error('LESSONS_KV binding changed.');
          if (String(binding(settings, 'DB', 'd1')?.id || '') !== before.databaseId) throw new Error('D1 binding changed.');
          if (String(binding(settings, 'MATERIALS_R2', 'r2_bucket')?.bucket_name || '') !== before.r2Bucket) throw new Error('R2 binding changed.');
          if (JSON.stringify(secretNames(settings)) !== JSON.stringify(before.secretNames)) throw new Error('Worker secret bindings changed.');
          console.log('ADMIN_ALLOWLIST_FIX_PASS: admin added; all existing production students, bindings and secrets preserved.');
          NODE
