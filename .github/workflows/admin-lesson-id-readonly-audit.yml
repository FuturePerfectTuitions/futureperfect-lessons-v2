name: Admin lesson ID readonly audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-lesson-id-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: List current curriculum keys
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          LESSONS="$(jq -r '[.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id][0] // ""' /tmp/settings.json)"
          test -n "$LESSONS"
          curl --fail --silent --show-error "$API/storage/kv/namespaces/$LESSONS/keys?limit=1000" -H "$AUTH" -o /tmp/keys.json
          jq -r '.result[].name | select(startswith("curriculum:"))' /tmp/keys.json | sort
