name: One-shot apply PreLesson 11+ fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-apply-prelesson-11plus-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-prelesson-11plus-entitlement-v2
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply focused Worker fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('worker/src/index-phase18-online-prelesson.js')
          s = p.read_text()
          needle = "    if (url.pathname === EXCEL_SYNC_PATH && request.method === 'POST') return handleExcelSync(request, env);\n"
          assert needle in s, 'Phase 18 Excel route anchor missing'
          insert = needle + "\n" + \
            "    const disableLegacyPrelessonOverlay = env?.PHASE20_DISABLE_LEGACY_PRELESSON_OVERLAY === true;\n" + \
            "    if (disableLegacyPrelessonOverlay) {\n" + \
            "      const isStudentHome = request.method === 'GET' && url.pathname === '/api/v1/student/home';\n" + \
            "      const isStudentList = request.method === 'GET' && /^\\/api\\/v1\\/student\\/views\\/[^/]+\\/lessons$/.test(url.pathname);\n" + \
            "      const isStudentDetail = request.method === 'GET' && /^\\/api\\/v1\\/student\\/lessons\\/[^/]+$/.test(url.pathname);\n" + \
            "      const isStudentResource = /^\\/api\\/v1\\/student\\/resources\\//.test(url.pathname);\n" + \
            "      if (isStudentHome || isStudentList || isStudentDetail || isStudentResource) {\n" + \
            "        return phase17Worker.fetch(request, env, ctx);\n" + \
            "      }\n" + \
            "    }\n"
          s = s.replace(needle, insert, 1)
          p.write_text(s)

          p = Path('worker/src/index-phase20-change8.js')
          s = p.read_text()
          anchor = "const norm = value => clean(value).toLowerCase();\n"
          assert anchor in s, 'Change 8 helper anchor missing'
          helper = anchor + "\n" + \
            "function withoutLegacyPrelessonOverlay(env) {\n" + \
            "  return new Proxy(env, {\n" + \
            "    get(target, prop) {\n" + \
            "      if (prop === 'PHASE20_DISABLE_LEGACY_PRELESSON_OVERLAY') return true;\n" + \
            "      const value = Reflect.get(target, prop, target);\n" + \
            "      return typeof value === 'function' ? value.bind(target) : value;\n" + \
            "    }\n" + \
            "  });\n" + \
            "}\n"
          s = s.replace(anchor, helper, 1)
          start = s.index('export default {')
          head, tail = s[:start], s[start:]
          url_line = "    const url = new URL(request.url);\n"
          assert url_line in tail, 'Change 8 fetch URL anchor missing'
          tail = tail.replace(url_line, url_line + "    const releaseEnv = withoutLegacyPrelessonOverlay(env);\n", 1)
          replacements = [
            ("return handleHome(request, env, ctx);", "return handleHome(request, releaseEnv, ctx);"),
            ("return handleLessonList(request, env, ctx, viewId);", "return handleLessonList(request, releaseEnv, ctx, viewId);"),
            ("return handleLessonDetail(request, env, ctx, lessonId, viewId);", "return handleLessonDetail(request, releaseEnv, ctx, lessonId, viewId);"),
            ("return handleResource(request, env, ctx, parsed, viewId);", "return handleResource(request, releaseEnv, ctx, parsed, viewId);")
          ]
          for old, new in replacements:
            assert old in tail, f'Change 8 route anchor missing: {old}'
            tail = tail.replace(old, new, 1)
          p.write_text(head + tail)

          p = Path('worker/src/index-phase9.js')
          s = p.read_text()
          answer_anchor = "      const answerKey = item?.answerKey || null;\n"
          assert answer_anchor in s, 'Phase 9 VR answer anchor missing'
          s = s.replace(answer_anchor, "      const sheet = item?.sheet || ((item?.r2Key || item?.r2 || item?.displayName || item?.name) ? item : null);\n" + answer_anchor, 1)
          assert "        sheet: item\n          ? {\n" in s, 'Phase 9 VR sheet selector missing'
          s = s.replace("        sheet: item\n          ? {\n", "        sheet: sheet\n          ? {\n", 1)
          assert "String(item.displayName || item.name || `VR PreLesson Sheet ${index + 1}`)" in s
          s = s.replace("String(item.displayName || item.name || `VR PreLesson Sheet ${index + 1}`)", "String(sheet.displayName || sheet.name || `VR PreLesson Sheet ${index + 1}`)", 1)
          assert "String(item.r2Key || item.r2 || '').trim()" in s
          s = s.replace("String(item.r2Key || item.r2 || '').trim()", "String(sheet.r2Key || sheet.r2 || '').trim()", 1)
          export_anchor = "export default {\n"
          assert export_anchor in s
          s = s.replace(export_anchor, "export { normaliseVr };\n\n" + export_anchor, 1)
          p.write_text(s)

          test_lines = [
            "import assert from 'node:assert/strict';",
            "import { readFileSync } from 'node:fs';",
            "import { normaliseVr } from '../worker/src/index-phase9.js';",
            "",
            "const nested = normaliseVr({ vr:{ preLesson:[{ sheet:{ displayName:'Nested VR sheet', r2Key:'english/year5/lesson/vr-sheet.pdf' }, answerKey:{ displayName:'Nested VR answer', r2Key:'english/year5/lesson/vr-answer.pdf' } }] } });",
            "assert.equal(nested.preLesson[0].sheet.displayName, 'Nested VR sheet');",
            "assert.equal(nested.preLesson[0].sheet.r2Key, 'english/year5/lesson/vr-sheet.pdf');",
            "assert.equal(nested.preLesson[0].answerKey.r2Key, 'english/year5/lesson/vr-answer.pdf');",
            "",
            "const legacy = normaliseVr({ vr:{ preLesson:[{ displayName:'Legacy VR sheet', r2Key:'legacy-sheet.pdf', answerKey:{ displayName:'Legacy VR answer', r2Key:'legacy-answer.pdf' } }] } });",
            "assert.equal(legacy.preLesson[0].sheet.r2Key, 'legacy-sheet.pdf');",
            "assert.equal(legacy.preLesson[0].answerKey.r2Key, 'legacy-answer.pdf');",
            "",
            "const phase18 = readFileSync(new URL('../worker/src/index-phase18-online-prelesson.js', import.meta.url), 'utf8');",
            "const change8 = readFileSync(new URL('../worker/src/index-phase20-change8.js', import.meta.url), 'utf8');",
            "assert.match(phase18, /PHASE20_DISABLE_LEGACY_PRELESSON_OVERLAY/);",
            "assert.match(change8, /withoutLegacyPrelessonOverlay/);",
            "assert.match(change8, /handleHome\\(request, releaseEnv, ctx\\)/);",
            "assert.match(change8, /handleLessonList\\(request, releaseEnv, ctx, viewId\\)/);",
            "assert.match(change8, /handleLessonDetail\\(request, releaseEnv, ctx, lessonId, viewId\\)/);",
            "assert.match(change8, /handleResource\\(request, releaseEnv, ctx, parsed, viewId\\)/);",
            "console.log('PreLesson 11+ regression verification: PASS');"
          ]
          Path('tests/prelesson-11plus-regression.mjs').write_text('\n'.join(test_lines) + '\n')
          PY

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase18-online-prelesson.js
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/index-phase9.js
          node tests/prelesson-11plus-regression.mjs
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs

      - name: Commit fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/index-phase18-online-prelesson.js worker/src/index-phase20-change8.js worker/src/index-phase9.js tests/prelesson-11plus-regression.mjs
          git commit -m 'Fix 11+ PreLesson view and nested VR sheet'
          git push origin HEAD:fix-prelesson-11plus-entitlement-v2
