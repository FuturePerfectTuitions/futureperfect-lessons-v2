name: Step 10 final live topology snapshot

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - '.github/workflows/step10-final-live-topology-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step10-final-live-topology-snapshot
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  PORTAL_HOST: lessons.futureperfect.education
  QUIZ_HOST: quiz.futureperfect.education

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Cloudflare topology only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const clean=v=>String(v??'').trim();
          const token=clean(process.env.CLOUDFLARE_API_TOKEN),account=clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          if(!token||!account) throw new Error('Cloudflare credentials unavailable');
          const base='https://api.cloudflare.com/client/v4';
          async function cf(path){
            const r=await fetch(base+path,{headers:{Authorization:`Bearer ${token}`}});
            const text=await r.text(); let j=null; try{j=JSON.parse(text)}catch{}
            if(!r.ok||j?.success!==true) throw new Error(`${r.status} ${path}: ${JSON.stringify(j?.errors||text)}`);
            return j.result;
          }
          async function active(name){
            const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);
            const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];
            const d=ds[0]; if(!d) throw new Error(`No deployment for ${name}`);
            const vs=Array.isArray(d?.versions)?d.versions:[];
            return {deploymentId:clean(d.id),versionId:clean((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id)};
          }
          const workers={
            browser:await active(process.env.BROWSER_WORKER),
            student:await active(process.env.STUDENT_WORKER),
            quiz:await active(process.env.QUIZ_WORKER)
          };
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`);
          async function routesFor(host){
            const zone=zones.filter(z=>host===z.name||host.endsWith(`.${z.name}`)).sort((a,b)=>b.name.length-a.name.length)[0];
            if(!zone) throw new Error(`Zone not found for ${host}`);
            const routes=await cf(`/zones/${zone.id}/workers/routes`);
            return routes.filter(r=>clean(r.pattern).toLowerCase().includes(host.toLowerCase())).map(r=>({pattern:clean(r.pattern),script:clean(r.script)}));
          }
          const portalRoutes=await routesFor(process.env.PORTAL_HOST);
          const quizRoutes=await routesFor(process.env.QUIZ_HOST);
          const browserSettings=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(process.env.BROWSER_WORKER)}/settings`);
          const bindings=(Array.isArray(browserSettings?.bindings)?browserSettings.bindings:[]).filter(b=>clean(b.type)==='service').map(b=>({name:clean(b.name),service:clean(b.service),environment:clean(b.environment)}));
          const root=await fetch(`https://${process.env.PORTAL_HOST}/`,{headers:{'cache-control':'no-store','user-agent':'fpt-step10-final-snapshot'}});
          if(!root.ok) throw new Error(`Portal root failed ${root.status}`);
          const html=await root.text();
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);
          const bundlePath=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];
          if(!bundlePath) throw new Error('Portal JS bundle not found');
          const bundleUrl=new URL(bundlePath,`https://${process.env.PORTAL_HOST}/`);
          const br=await fetch(bundleUrl,{headers:{'cache-control':'no-store','user-agent':'fpt-step10-final-snapshot'}});
          if(!br.ok) throw new Error(`Portal bundle failed ${br.status}`);
          const bytes=Buffer.from(await br.arrayBuffer()); const text=bytes.toString('utf8');
          const bundle={path:bundlePath.replace(/^\.\//,'').replace(/^\//,'').split('?')[0],sha256:crypto.createHash('sha256').update(bytes).digest('hex'),hasPracticeCard:text.includes('11+ Practice'),hasEligibility:text.includes('/api/v2/student/quiz/eligibility'),hasLaunch:text.includes('/api/v2/student/quiz/launch')};
          const eligibility=await fetch(`https://${process.env.PORTAL_HOST}/api/v2/student/quiz/eligibility`,{redirect:'manual',headers:{'cache-control':'no-store','user-agent':'fpt-step10-final-snapshot'}});
          const quiz=await fetch(`https://${process.env.QUIZ_HOST}/`,{redirect:'manual',headers:{'cache-control':'no-store','user-agent':'fpt-step10-final-snapshot'}});
          const out={marker:'STEP10_FINAL_LIVE_TOPOLOGY_SNAPSHOT',readOnly:true,workers,portalRoutes,quizRoutes,browserServiceBindings:bindings,portalBundle:bundle,unauthEligibility:{status:eligibility.status},unauthQuizRoot:{status:quiz.status,location:quiz.headers.get('location')||''}};
          fs.writeFileSync('/tmp/step10-final-live-topology.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: step10-final-live-topology-snapshot
          path: /tmp/step10-final-live-topology.json
          retention-days: 90
