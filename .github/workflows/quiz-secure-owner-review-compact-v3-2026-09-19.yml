name: Secure Quiz compact owner-review deploy v3 2026-09-19

on:
  push:
    branches:
      - ops/quiz-diagram-renderer-2026-09-19
    paths:
      - '.github/workflows/quiz-secure-owner-review-compact-v3-2026-09-19.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secure-quiz-compact-owner-review-v3-2026-09-19
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  EXPECTED_OLD_QUIZ_VERSION: 3c969e3c-af89-44ba-a382-2d87e05de53a
  EXPECTED_SOURCE_COMMIT: 125f45cf4c0c08452c9565f54592bb6d699577de
  EXPECTED_SOURCE_ZIP_SHA256: 7aed87fd66c47908db33db9c413b4c8ba2e9feb5f145cba0e7f6a5276ddba913
  EXPECTED_LIVE_COUNT: '714'
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  EXPECTED_BROWSER_VERSION: f8a64bc8-8192-4400-9e45-8f1a1de10019
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_STUDENT_VERSION: f26167b1-073c-4015-912a-288a3d20e0bb
  TRANSFER_BRANCH: ops/quiz-diagram-renderer-2026-09-19

jobs:
  deploy-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/quiz-diagram-renderer-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove owner-review hold and exact rollback anchor
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/quiz-compact-v3

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/quiz-compact-v3/quiz-before.json
          OLD_VERSION="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-compact-v3/quiz-before.json | head -n1)"
          test "$OLD_VERSION" = "$EXPECTED_OLD_QUIZ_VERSION" || { echo "QUIZ_VERSION_DRIFT expected=$EXPECTED_OLD_QUIZ_VERSION actual=$OLD_VERSION"; exit 1; }
          echo "OLD_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$BROWSER_WORKER" --json > /tmp/quiz-compact-v3/browser-before.json
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$STUDENT_WORKER" --json > /tmp/quiz-compact-v3/student-before.json
          browser="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-compact-v3/browser-before.json | head -n1)"
          student="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-compact-v3/student-before.json | head -n1)"
          test "$browser" = "$EXPECTED_BROWSER_VERSION" || { echo "BROWSER_VERSION_DRIFT $browser"; exit 1; }
          test "$student" = "$EXPECTED_STUDENT_VERSION" || { echo "STUDENT_VERSION_DRIFT $student"; exit 1; }

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$QUIZ_D1_NAME" --remote --command "SELECT COUNT(*) AS live_questions FROM question_instance WHERE UPPER(lifecycle_status)='LIVE'; SELECT COUNT(*) AS active_non_review FROM quiz_auth_session WHERE revoked_at IS NULL AND expires_at > datetime('now') AND portal_user_id NOT LIKE 'owner-review-%';" --json > /tmp/quiz-compact-v3/db-before.json
          test "$(jq -r '.[0].results[0].live_questions' /tmp/quiz-compact-v3/db-before.json)" = "$EXPECTED_LIVE_COUNT" || { echo LIVE_BANK_DRIFT; exit 1; }
          test "$(jq -r '.[1].results[0].active_non_review' /tmp/quiz-compact-v3/db-before.json)" = '0' || { echo NON_REVIEW_SESSION_ACTIVE; exit 1; }

          curl --fail --silent --show-error 'https://lessons.futureperfect.education/' -o /tmp/quiz-compact-v3/portal-root.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, urllib.parse
          html=Path('/tmp/quiz-compact-v3/portal-root.html').read_text(errors='replace')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not refs: raise SystemExit('NO_PORTAL_JS_ASSET_FOUND')
          text=''
          for i,ref in enumerate(refs):
              out=f'/tmp/quiz-compact-v3/portal-{i}.js'
              subprocess.run(['curl','--fail','--silent','--show-error',urllib.parse.urljoin('https://lessons.futureperfect.education/',ref),'-o',out],check=True)
              text += Path(out).read_text(errors='replace')
          markers=['11+ Practice','quiz.futureperfect.education','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']
          found=[m for m in markers if m in text]
          if found: raise SystemExit('QUIZ_SURFACE_PRESENT_IN_PORTAL: '+repr(found))
          PY

          code="$(curl --silent --show-error --output /tmp/quiz-compact-v3/review-before.html --write-out '%{http_code}' 'https://futureperfect-11plus-practice-owner-review.futureperfectlessons.workers.dev/review')"
          test "$code" = '200'
          echo OWNER_REVIEW_HOLD_PREFLIGHT_PASS

      - name: Generate one-time RSA transfer key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/quiz-compact-v3/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/quiz-compact-v3/private.pem -pubout -out /tmp/quiz-compact-v3/public.pem >/dev/null 2>&1
          body="$(printf 'Temporary one-time public key for secure compact Quiz owner-review transfer run `%s`. The private key exists only in this runner.\n\n```pem\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat /tmp/quiz-compact-v3/public.pem)")"
          issue_url="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="TEMP Quiz compact v3 secure transfer public key ${GITHUB_RUN_ID}" -f body="$body" --jq .html_url)"
          issue_no="${issue_url##*/}"
          echo "TRANSFER_ISSUE=$issue_no" >> "$GITHUB_ENV"
          echo "TRANSFER_ISSUE=$issue_no"

      - name: Receive decrypt and verify exact tested runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          base="ops/quiz-secure-transfer-v3/${GITHUB_RUN_ID}"
          ready=false
          for attempt in $(seq 1 180); do
            git fetch origin "$TRANSFER_BRANCH" --quiet || true
            ok=true
            for f in key.b64 part00 part01 part02 part03 part04; do
              git show "origin/${TRANSFER_BRANCH}:${base}/${f}" > "/tmp/quiz-compact-v3/${f}" 2>/dev/null || { ok=false; break; }
            done
            if test "$ok" = true; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true || { echo ENCRYPTED_TRANSFER_TIMEOUT; exit 1; }
          cat /tmp/quiz-compact-v3/part0{0,1,2,3,4} | base64 -d > /tmp/quiz-compact-v3/runtime.zip.enc
          base64 -d /tmp/quiz-compact-v3/key.b64 > /tmp/quiz-compact-v3/key.enc
          openssl pkeyutl -decrypt -inkey /tmp/quiz-compact-v3/private.pem -in /tmp/quiz-compact-v3/key.enc -out /tmp/quiz-compact-v3/pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/quiz-compact-v3/runtime.zip.enc -out /tmp/quiz-compact-v3/runtime.zip -pass file:/tmp/quiz-compact-v3/pass.txt
          actual="$(sha256sum /tmp/quiz-compact-v3/runtime.zip | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SOURCE_ZIP_SHA256" || { echo "SOURCE_ZIP_DIGEST_MISMATCH expected=$EXPECTED_SOURCE_ZIP_SHA256 actual=$actual"; exit 1; }
          mkdir -p /tmp/quiz-compact-v3/runtime
          unzip -q /tmp/quiz-compact-v3/runtime.zip -d /tmp/quiz-compact-v3/runtime
          test "$(cat /tmp/quiz-compact-v3/runtime/SOURCE_COMMIT.txt)" = "$EXPECTED_SOURCE_COMMIT"
          sed 's#/tmp/quiz-runtime-source/#/tmp/quiz-compact-v3/runtime/#' /tmp/quiz-compact-v3/runtime/SHA256SUMS.txt > /tmp/quiz-compact-v3/runtime/SHA256SUMS.local.txt
          sha256sum -c /tmp/quiz-compact-v3/runtime/SHA256SUMS.local.txt
          node --check /tmp/quiz-compact-v3/runtime/src/index.js
          for marker in "function diagram(type,spec,stem='')" "diagram(q.diagramType,q.diagramSpec,q.stem)" "diagram(x.diagramType,x.diagramSpec,x.stem)" "Diagram unavailable" "max-height:min(26vh,250px)" "@media(max-height:820px)" "max-height:min(22vh,180px)" "max-height:min(23vh,190px)"; do grep -Fq "$marker" /tmp/quiz-compact-v3/runtime/src/index.js; done
          echo TESTED_COMPACT_RUNTIME_TRANSFER_PASS

      - name: Prepare keep-vars deployment and verify binding contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/quiz-compact-v3/runtime/wrangler.toml <<TOML
          name = "${QUIZ_WORKER}"
          main = "src/index.js"
          compatibility_date = "2026-09-17"
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${QUIZ_WORKER}/settings" -H "$AUTH" -o /tmp/quiz-compact-v3/settings-before.json
          expected='DB,ENVIRONMENT,LAUNCH_REDEEM_TIMEOUT_MS,PORTAL_BRIDGE_URL,PORTAL_LOGIN_URL,QUIZ_BRIDGE_SECRET,QUIZ_ORIGIN,QUIZ_SESSION_TTL_SECONDS'
          actual="$(jq -r '[.result.bindings[].name] | sort | join(",")' /tmp/quiz-compact-v3/settings-before.json)"
          test "$actual" = "$expected" || { echo "BINDING_SET_DRIFT $actual"; exit 1; }
          jq -e --arg id "$QUIZ_D1_ID" '.result.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/quiz-compact-v3/settings-before.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/quiz-compact-v3/settings-before.json >/dev/null
          npx --yes wrangler@"$WRANGLER_VERSION" versions list --name "$QUIZ_WORKER" --json > /tmp/quiz-compact-v3/versions-before.json
          jq -r '.[] | (.id // .version_id // empty)' /tmp/quiz-compact-v3/versions-before.json | sort -u > /tmp/quiz-compact-v3/version-ids-before.txt

      - name: Upload candidate without traffic
        id: upload
        working-directory: /tmp/quiz-compact-v3/runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions upload src/index.js --config wrangler.toml --keep-vars --message 'Owner-review: comprehensive diagrams plus compact single-screen question layout' >/tmp/quiz-compact-v3/upload.txt
          npx --yes wrangler@"$WRANGLER_VERSION" versions list --name "$QUIZ_WORKER" --json > /tmp/quiz-compact-v3/versions-after.json
          jq -r '.[] | (.id // .version_id // empty)' /tmp/quiz-compact-v3/versions-after.json | sort -u > /tmp/quiz-compact-v3/version-ids-after.txt
          NEW_VERSION="$(comm -13 /tmp/quiz-compact-v3/version-ids-before.txt /tmp/quiz-compact-v3/version-ids-after.txt | head -n1)"
          test -n "$NEW_VERSION"
          test "$NEW_VERSION" != "$OLD_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "CANDIDATE=$NEW_VERSION"

      - name: Verify candidate bindings before promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${QUIZ_WORKER}/versions/${NEW_VERSION}" -H "$AUTH" -o /tmp/quiz-compact-v3/candidate.json
          expected='DB,ENVIRONMENT,LAUNCH_REDEEM_TIMEOUT_MS,PORTAL_BRIDGE_URL,QUIZ_BRIDGE_SECRET,PORTAL_LOGIN_URL,QUIZ_ORIGIN,QUIZ_SESSION_TTL_SECONDS'
          actual="$(jq -r '[.result.resources.bindings[].name] | sort | join(",")' /tmp/quiz-compact-v3/candidate.json)"
          expected_sorted='DB,ENVIRONMENT,LAUNCH_REDEEM_TIMEOUT_MS,PORTAL_BRIDGE_URL,PORTAL_LOGIN_URL,QUIZ_BRIDGE_SECRET,QUIZ_ORIGIN,QUIZ_SESSION_TTL_SECONDS'
          test "$actual" = "$expected_sorted" || { echo "CANDIDATE_BINDING_SET_DRIFT $actual"; exit 1; }
          jq -e --arg id "$QUIZ_D1_ID" '.result.resources.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/quiz-compact-v3/candidate.json >/dev/null
          jq -e '.result.resources.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/quiz-compact-v3/candidate.json >/dev/null

      - name: Promote hidden owner-review Quiz worker only
        id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$NEW_VERSION@100%" --name "$QUIZ_WORKER" --message 'Owner-review only: comprehensive diagrams plus compact questions' -y

      - name: Verify compact owner-review runtime and withdrawal boundary
        id: verify
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/quiz-compact-v3/quiz-after.json
          jq -e --arg id "$NEW_VERSION" '.versions[] | select(.version_id==$id and .percentage==100)' /tmp/quiz-compact-v3/quiz-after.json >/dev/null
          test "$(curl --silent --show-error --output /tmp/quiz-compact-v3/health.json --write-out '%{http_code}' 'https://quiz.futureperfect.education/health')" = '200'

          curl --fail --silent --show-error 'https://quiz.futureperfect.education/assets/app.js' -o /tmp/quiz-compact-v3/live-app.js
          for marker in "function diagram(type,spec,stem='')" "spec.translation" "spec.mirror_axis" "spec.fraction" "spec.clockwise_turn_degrees" "spec.dimensions_cm" "diagram(q.diagramType,q.diagramSpec,q.stem)" "diagram(x.diagramType,x.diagramSpec,x.stem)" "Diagram unavailable"; do grep -Fq "$marker" /tmp/quiz-compact-v3/live-app.js; done
          ! grep -Fq '<strong>Equal-part diagram:</strong>' /tmp/quiz-compact-v3/live-app.js
          ! grep -Fq '<strong>3D solid:</strong>' /tmp/quiz-compact-v3/live-app.js

          curl --fail --silent --show-error 'https://quiz.futureperfect.education/assets/styles.css' -o /tmp/quiz-compact-v3/live-styles.css
          for marker in "max-height:min(26vh,250px)" "@media(max-height:820px)" "max-height:min(22vh,180px)" "max-height:min(23vh,190px)" ".card.question{padding:14px;margin-bottom:10px}" ".options{display:grid;gap:6px}"; do grep -Fq "$marker" /tmp/quiz-compact-v3/live-styles.css; done

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$QUIZ_D1_NAME" --remote --command "SELECT COUNT(*) AS live_questions FROM question_instance WHERE UPPER(lifecycle_status)='LIVE'; SELECT COUNT(*) AS active_non_review FROM quiz_auth_session WHERE revoked_at IS NULL AND expires_at > datetime('now') AND portal_user_id NOT LIKE 'owner-review-%';" --json > /tmp/quiz-compact-v3/db-after.json
          test "$(jq -r '.[0].results[0].live_questions' /tmp/quiz-compact-v3/db-after.json)" = "$EXPECTED_LIVE_COUNT"
          test "$(jq -r '.[1].results[0].active_non_review' /tmp/quiz-compact-v3/db-after.json)" = '0'

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$BROWSER_WORKER" --json > /tmp/quiz-compact-v3/browser-after.json
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$STUDENT_WORKER" --json > /tmp/quiz-compact-v3/student-after.json
          test "$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-compact-v3/browser-after.json | head -n1)" = "$EXPECTED_BROWSER_VERSION"
          test "$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-compact-v3/student-after.json | head -n1)" = "$EXPECTED_STUDENT_VERSION"

          curl --fail --silent --show-error 'https://lessons.futureperfect.education/' -o /tmp/quiz-compact-v3/portal-root-after.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, urllib.parse
          html=Path('/tmp/quiz-compact-v3/portal-root-after.html').read_text(errors='replace')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not refs: raise SystemExit('NO_PORTAL_JS_ASSET_FOUND_AFTER')
          text=''
          for i,ref in enumerate(refs):
              out=f'/tmp/quiz-compact-v3/portal-after-{i}.js'
              subprocess.run(['curl','--fail','--silent','--show-error',urllib.parse.urljoin('https://lessons.futureperfect.education/',ref),'-o',out],check=True)
              text += Path(out).read_text(errors='replace')
          markers=['11+ Practice','quiz.futureperfect.education','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']
          found=[m for m in markers if m in text]
          if found: raise SystemExit('QUIZ_SURFACE_REAPPEARED_IN_PORTAL: '+repr(found))
          PY

          code="$(curl --silent --show-error --output /tmp/quiz-compact-v3/review-after.html --write-out '%{http_code}' 'https://futureperfect-11plus-practice-owner-review.futureperfectlessons.workers.dev/review')"
          test "$code" = '200'
          echo OWNER_REVIEW_COMPACT_V3_VERIFY_PASS

      - name: Automatic Quiz-only rollback on any failed promotion verification
        if: always() && env.OLD_VERSION != '' && (steps.promote.outcome != 'success' || steps.verify.outcome != 'success')
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$OLD_VERSION@100%" --name "$QUIZ_WORKER" --message 'Automatic rollback after compact owner-review verification failure' -y
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/quiz-compact-v3/rollback.json
          jq -e --arg id "$OLD_VERSION" '.versions[] | select(.version_id==$id and .percentage==100)' /tmp/quiz-compact-v3/rollback.json >/dev/null
          echo OWNER_REVIEW_COMPACT_V3_ROLLBACK_PASS

      - name: Close temporary key issue
        if: always() && env.TRANSFER_ISSUE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh issue comment "$TRANSFER_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Secure compact owner-review v3 transfer finished. Verification outcome: **${{ steps.verify.outcome }}**. The one-time private key has been destroyed with the runner."
          gh issue close "$TRANSFER_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Require verified compact owner-review deployment
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.promote.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
          echo QUIZ_COMPACT_OWNER_REVIEW_V3_DEPLOY_COMPLETE
