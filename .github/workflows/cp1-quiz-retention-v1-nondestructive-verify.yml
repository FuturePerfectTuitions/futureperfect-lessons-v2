name: CP1 Quiz retention v1 non-destructive verify

on:
  push:
    branches:
      - ops/cp1-retention-control-v1-2026-09-20
    paths:
      - 'ops/quiz-retention/retention_v1.mjs'
      - '.github/workflows/cp1-quiz-retention-v1.yml'
      - '.github/workflows/cp1-quiz-retention-v1-nondestructive-verify.yml'
      - 'docs/CP1_QUIZ_RETENTION_CONTROL_v1_RUNBOOK.md'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  EXPECTED_D1_UUID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  RETENTION_MODE: dry-run
  AUTHORITY_VERSION: v1.3
  COHORT_LABEL: CONTROL-VERIFICATION-NO-MATCH
  RETENTION_DATE: 2027-09-10
  CONTROL_VERIFICATION_FIXTURE: '1'
  RETENTION_TARGET_MANIFEST_JSON: '{"authorityVersion":"v1.3","cohortLabel":"CONTROL-VERIFICATION-NO-MATCH","retentionDate":"2027-09-10","portalUserIds":["__FPT_RETENTION_CONTROL_V1_NO_MATCH__"]}'
  RETENTION_AUDIT_DIR: retention-audit

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard workflow shape and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ops/quiz-retention/retention_v1.mjs
          python3 - <<'PY'
          from pathlib import Path
          operational=Path('.github/workflows/cp1-quiz-retention-v1.yml').read_text()
          verifier=Path('.github/workflows/cp1-quiz-retention-v1-nondestructive-verify.yml').read_text()
          script=Path('ops/quiz-retention/retention_v1.mjs').read_text()
          assert 'workflow_dispatch:' in operational
          assert '\n  schedule:' not in operational
          assert '\n  push:' not in operational
          assert "RETENTION_MODE: ${{ inputs.mode }}" in operational
          assert "retentionDate!==new Date().toISOString().slice(0,10)" in script
          assert 'expected rollback bookmark' not in script.lower() or 'rollback bookmark' in script.lower()
          assert 'question_aggregate' in script
          assert 'PRAGMA foreign_key_check' in script
          assert 'DELETE FROM' in script
          assert 'CONTROL_VERIFICATION_FIXTURE' in verifier
          print('CP1_RETENTION_V1_STATIC_PASS')
          PY
      - name: Fresh exact-production read-only control verification
        run: node ops/quiz-retention/retention_v1.mjs
      - name: Assert zero writes and live invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('retention-audit/cp1-retention-dry-run-audit.json','utf8'));
          if(a.mode!=='dry-run'||a.productionMutation!==false||a.writeOperationsAttempted!==0) throw new Error('write invariant failed');
          if(a.pre.global.liveQuestions!==714||a.pre.global.liveFamilies!==91||a.pre.global.foreignKeyViolations!==0) throw new Error('global invariant failed');
          if(a.pre.activeNonAbandonedSessions!==0) throw new Error('active session invariant failed');
          if(Object.values(a.pre.direct).some(Boolean)||Object.values(a.pre.children).some(Boolean)) throw new Error('dummy fixture matched production rows');
          if(!a.pre.aggregate.sha256||!a.rollbackBookmark||!a.manifest.sha256) throw new Error('audit proof incomplete');
          if(a.manifest.rawIdsPersisted!==false) throw new Error('raw ID persistence invariant failed');
          console.log('CP1_RETENTION_V1_NONDESTRUCTIVE_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cp1-retention-v1-nondestructive-verification
          path: retention-audit/
          retention-days: 365
