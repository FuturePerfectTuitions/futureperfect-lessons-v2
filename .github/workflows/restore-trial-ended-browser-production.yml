name: Restore friendly Trial-ended Browser UX

on:
  push:
    branches:
      - fix/trial-prepared-access-single-login-2026-09-21
    paths:
      - '.github/workflows/restore-trial-ended-browser-production.yml'

permissions:
  contents: read

concurrency:
  group: restore-trial-ended-browser-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  ADMIN_WORKER: fpt-portal-v2-worker
  PROD_HOST: lessons.futureperfect.education
  PROD_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_BROWSER_VERSION: ea701c02-93f7-46e9-9182-59a785dc0bee
  EXPECTED_STUDENT_VERSION: 51d725cc-d21e-4aad-9c64-24149c640637
  FRONTEND_BASE_SHA: 63f37895727e41ada427c9644b41b5a026ed196b
  FRONTEND_FIX_SHA: d7a416c2e13af7bab092efdb7694bde03ff7e245
  WRANGLER_VERSION: 4.129.0

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact current accepted frontend plus narrow Trial-ended source fix
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.FRONTEND_FIX_SHA }}
          path: frontend
          persist-credentials: false
          fetch-depth: 0

      - name: Prove narrow source delta, test and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C frontend rev-parse HEAD)" = "$FRONTEND_FIX_SHA"
          git -C frontend cat-file -e "${FRONTEND_BASE_SHA}^{commit}"
          mapfile -t CHANGED < <(git -C frontend diff --name-only "$FRONTEND_BASE_SHA" "$FRONTEND_FIX_SHA" | sort)
          printf '%s\n' "${CHANGED[@]}"
          EXPECTED=(.github/workflows/restore-trial-ended-ux-source.yml src/app.js src/styles.css)
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for f in "${EXPECTED[@]}"; do printf '%s\n' "${CHANGED[@]}" | grep -Fxq "$f"; done

          grep -Fq 'TRIAL_ACCESS_ENDED' frontend/src/app.js
          grep -Fq 'Your Future Perfect trial has now ended.' frontend/src/app.js
          grep -Fq 'right programme for your child.' frontend/src/app.js
          grep -Fq 'This part of the portal could not be loaded. Please try again.' frontend/src/app.js
          grep -Fq '.error-box.trial-ended' frontend/src/styles.css

          cd frontend
          npm install --no-package-lock --no-audit --no-fund
          npm run test:static
          npm run build
          cd "$GITHUB_WORKSPACE"

          BUNDLE=$(find frontend/dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*protected*' | head -n1)
          STYLE=$(find frontend/dist/assets -maxdepth 1 -type f -name 'portal-*.css' | head -n1)
          test -n "$BUNDLE"; test -n "$STYLE"
          grep -Fq 'TRIAL_ACCESS_ENDED' "$BUNDLE"
          grep -Fq 'Your Future Perfect trial has now ended.' "$BUNDLE"
          grep -Fq 'right programme for your child.' "$BUNDLE"
          grep -Fq 'This part of the portal could not be loaded. Please try again.' "$BUNDLE"
          grep -Fq 'eef8f3' "$STYLE"
          echo TRIAL_ENDED_BUILD_PASS

      - name: Recreate exact current Browser facade and Wrangler config
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p deploy
          cat > deploy/index.js <<'JS'
          const API_PREFIX = '/api/v2/';
          function internalApiUrl(request) {
            const incoming = new URL(request.url);
            return new URL(`${incoming.pathname}${incoming.search}`, 'https://cp9-staging-api.internal');
          }
          async function proxyApi(request, env) {
            if (!env.STAGING_API || typeof env.STAGING_API.fetch !== 'function') {
              throw new Error('MISSING_STAGING_API_SERVICE_BINDING');
            }
            const headers = new Headers(request.headers);
            headers.delete('host');
            const init = { method:request.method, headers, redirect:'manual' };
            if (!['GET','HEAD'].includes(request.method)) init.body = request.body;
            const upstream = await env.STAGING_API.fetch(internalApiUrl(request), init);
            const responseHeaders = new Headers(upstream.headers);
            responseHeaders.set('x-fpt-cp9-browser-facade', 'service-binding');
            responseHeaders.set('cache-control', responseHeaders.get('cache-control') || 'private, no-store');
            return new Response(upstream.body, { status:upstream.status, statusText:upstream.statusText, headers:responseHeaders });
          }
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname.startsWith(API_PREFIX)) return proxyApi(request, env);
              return env.ASSETS.fetch(request);
            }
          };
          JS

          cat > deploy/wrangler.toml <<TOML
          name = "${BROWSER_WORKER}"
          main = "index.js"
          compatibility_date = "2026-08-20"
          workers_dev = true

          [[services]]
          binding = "STAGING_API"
          service = "${STUDENT_WORKER}"

          [assets]
          directory = "../frontend/dist"
          binding = "ASSETS"
          run_worker_first = true
          TOML
          node --check deploy/index.js

      - name: Fresh production preflight and TrialEva one-login state capture
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=v=>String(v??'').trim();
          const account=c(process.env.CLOUDFLARE_ACCOUNT_ID), token=c(process.env.CLOUDFLARE_API_TOKEN);
          const base='https://api.cloudflare.com/client/v4', headers={Authorization:`Bearer ${token}`};
          async function cf(path,opts={}){const r=await fetch(base+path,{...opts,headers:{...headers,...(opts.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{};if(!r.ok||j?.success!==true)throw new Error(`CF ${path} ${r.status}: ${t.slice(0,240)}`);return j.result;}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:(Array.isArray(x)?x:[]);const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return c((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id);}
          async function settings(name){return cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/settings`);}
          async function d1(sql,params=[]){const r=await fetch(`${base}/accounts/${account}/d1/database/${process.env.PROD_D1_ID}/query`,{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({sql,params})});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`D1 ${r.status}: ${JSON.stringify(j.errors||[])}`);return j.result?.[0]?.results||[];}

          const browser=await active(process.env.BROWSER_WORKER), student=await active(process.env.STUDENT_WORKER), admin=await active(process.env.ADMIN_WORKER);
          if(browser!==process.env.EXPECTED_BROWSER_VERSION) throw new Error(`Browser moved: ${browser}`);
          if(student!==process.env.EXPECTED_STUDENT_VERSION) throw new Error(`Student moved: ${student}`);
          const bs=await settings(process.env.BROWSER_WORKER), bindings=Array.isArray(bs?.bindings)?bs.bindings:[];
          const services=bindings.filter(b=>b.type==='service');
          if(services.length!==1||c(services[0].name)!=='STAGING_API'||c(services[0].service)!==process.env.STUDENT_WORKER) throw new Error(`Browser service drift: ${JSON.stringify(services)}`);
          if(!bindings.some(b=>b.type==='assets'&&c(b.name)==='ASSETS')) throw new Error('Browser assets binding missing');

          const host=c(process.env.PROD_HOST).toLowerCase(), zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`), zone=(zones||[]).filter(z=>host===c(z.name).toLowerCase()||host.endsWith(`.${c(z.name).toLowerCase()}`)).sort((a,b)=>c(b.name).length-c(a.name).length)[0];
          if(!zone) throw new Error('Production zone unresolved');
          const routes=await cf(`/zones/${zone.id}/workers/routes`), matches=(routes||[]).filter(r=>c(r.pattern).toLowerCase().includes(host));
          if(matches.length!==1||c(matches[0].pattern).toLowerCase()!==`${host}/*`||c(matches[0].script)!==process.env.BROWSER_WORKER) throw new Error(`Route drift: ${JSON.stringify(matches)}`);

          const consumed=await d1('SELECT consumed_at FROM trial_login_consumptions WHERE portal_user_id_norm = ? ORDER BY consumed_at',['trialeva']);
          if(consumed.length!==1||!c(consumed[0]?.consumed_at)) throw new Error(`Expected exactly one consumed TrialEva login before UX repair, got ${JSON.stringify(consumed)}`);
          const out={browserVersion:browser,studentVersion:student,adminVersion:admin,route:{pattern:matches[0].pattern,script:matches[0].script},service:{name:services[0].name,service:services[0].service},trialEvaConsumption:consumed};
          fs.writeFileSync('/tmp/trial-ended-before.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({marker:'TRIAL_ENDED_PREFLIGHT_PASS',browserVersion:browser,studentVersion:student,adminVersion:admin,trialEvaConsumed:true},null,2));
          NODE

          npx --yes wrangler@"$WRANGLER_VERSION" deploy --dry-run --outdir /tmp/trial-ended-dryrun --config deploy/wrangler.toml >/tmp/trial-ended-dryrun.log
          test -s /tmp/trial-ended-dryrun.log
          echo TRIAL_ENDED_DRYRUN_PASS

      - name: Deploy Browser only with automatic rollback and verify production
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD_BROWSER=$(jq -r .browserVersion /tmp/trial-ended-before.json)
          DEPLOYED=0
          rollback(){
            rc=$?
            set +e
            if [ "$DEPLOYED" = '1' ]; then
              npx --yes wrangler@"$WRANGLER_VERSION" rollback "$OLD_BROWSER" --name "$BROWSER_WORKER" --message 'Automatic rollback: Trial-ended Browser UX verification failed'
            fi
            exit "$rc"
          }
          trap rollback ERR

          npx --yes wrangler@"$WRANGLER_VERSION" deploy --config deploy/wrangler.toml --message 'Restore friendly exhausted-Trial guidance on current accepted Browser UI'
          DEPLOYED=1
          sleep 4

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=v=>String(v??'').trim();
          const before=JSON.parse(fs.readFileSync('/tmp/trial-ended-before.json','utf8'));
          const account=c(process.env.CLOUDFLARE_ACCOUNT_ID), token=c(process.env.CLOUDFLARE_API_TOKEN), base='https://api.cloudflare.com/client/v4', headers={Authorization:`Bearer ${token}`};
          async function cf(path,opts={}){const r=await fetch(base+path,{...opts,headers:{...headers,...(opts.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{};if(!r.ok||j?.success!==true)throw new Error(`CF ${path} ${r.status}: ${t.slice(0,240)}`);return j.result;}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:(Array.isArray(x)?x:[]);const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return c((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id);}
          async function settings(name){return cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/settings`);}
          async function d1(sql,params=[]){const r=await fetch(`${base}/accounts/${account}/d1/database/${process.env.PROD_D1_ID}/query`,{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({sql,params})});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`D1 ${r.status}`);return j.result?.[0]?.results||[];}
          const browser=await active(process.env.BROWSER_WORKER), student=await active(process.env.STUDENT_WORKER), admin=await active(process.env.ADMIN_WORKER);
          if(!browser||browser===before.browserVersion) throw new Error('Browser version did not advance');
          if(student!==before.studentVersion) throw new Error('Student Worker changed unexpectedly');
          if(admin!==before.adminVersion) throw new Error('Admin Worker changed unexpectedly');
          const bs=await settings(process.env.BROWSER_WORKER), bindings=Array.isArray(bs?.bindings)?bs.bindings:[], services=bindings.filter(b=>b.type==='service');
          if(services.length!==1||c(services[0].name)!=='STAGING_API'||c(services[0].service)!==process.env.STUDENT_WORKER) throw new Error('Browser service binding changed');
          const consumed=await d1('SELECT consumed_at FROM trial_login_consumptions WHERE portal_user_id_norm = ? ORDER BY consumed_at',['trialeva']);
          if(JSON.stringify(consumed)!==JSON.stringify(before.trialEvaConsumption)) throw new Error(`TrialEva one-login state changed: ${JSON.stringify(consumed)}`);
          fs.writeFileSync('/tmp/trial-ended-after.json',JSON.stringify({marker:'TRIAL_ENDED_BROWSER_DEPLOY_CONTROL_PASS',oldBrowserVersion:before.browserVersion,newBrowserVersion:browser,studentVersion:student,adminVersion:admin,trialEvaConsumptionPreserved:true},null,2));
          NODE

          READY=0
          for i in $(seq 1 40); do
            curl -fsS -H 'Cache-Control: no-store' "https://${PROD_HOST}/?trial-ended-ux=${GITHUB_RUN_ID}-${i}" -o /tmp/live-index.html || true
            P=$(grep -oE 'src="[^"]+portal-[A-Za-z0-9_-]+\.js"' /tmp/live-index.html | head -n1 | sed -E 's/^src="//;s/"$//' || true)
            if [ -n "$P" ]; then
              case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
              if curl -fsS -H 'Cache-Control: no-store' "${U}?trial-ended-ux=${GITHUB_RUN_ID}-${i}" -o /tmp/live-main.js; then
                if grep -Fq 'Your Future Perfect trial has now ended.' /tmp/live-main.js && grep -Fq 'right programme for your child.' /tmp/live-main.js && grep -Fq 'TRIAL_ACCESS_ENDED' /tmp/live-main.js && grep -Fq 'This part of the portal could not be loaded. Please try again.' /tmp/live-main.js; then READY=1; break; fi
              fi
            fi
            sleep 1
          done
          test "$READY" = 1

          API_CODE=$(curl -sS -H "Origin: https://${PROD_HOST}" -D /tmp/api.headers -o /tmp/api.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/home" || true)
          test "$API_CODE" = 401
          grep -qi '^x-fpt-cp9-browser-facade: service-binding' /tmp/api.headers

          jq -e '.marker=="TRIAL_ENDED_BROWSER_DEPLOY_CONTROL_PASS" and .trialEvaConsumptionPreserved==true' /tmp/trial-ended-after.json >/dev/null
          cat /tmp/trial-ended-after.json
          echo TRIAL_ENDED_BROWSER_PRODUCTION_PASS
          trap - ERR

      - name: Upload redacted deployment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-trial-ended-browser-production-evidence
          path: |
            /tmp/trial-ended-before.json
            /tmp/trial-ended-after.json
          retention-days: 14
          if-no-files-found: ignore
