name: R2 Drive sync Y3 mutate

on:
  workflow_dispatch:

concurrency:
  group: r2-drive-sync-y3-mutate
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
  CONFIRM_YEAR3_APPLY: YES

jobs:
  reconcile-year3:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Year 3 reconciliation branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet google-auth requests

      - name: Reconcile all Year 3 English and Maths from Drive to R2
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_sync_y3_full.py

      - name: Upload Year 3 reconciliation audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y3-r2-reconciliation-summary
          path: y3-r2-reconciliation-summary.json
          if-no-files-found: warn
          retention-days: 30
