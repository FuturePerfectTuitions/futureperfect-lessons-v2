name: Year 4 core PreLesson convention read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/y4-core-prelesson-pattern-readonly.yml

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect existing Year 4 English core PreLesson pairs
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          settings="$(curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .text=="production")' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV") | .namespace_id' <<<"$settings")"
          getkv() {
            local key="$1" enc
            enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$key")"
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}"
          }
          getkv 'curriculum:ENGLISH_Y4' > /tmp/curriculum.json
          jq -r '.lessonIds[]' /tmp/curriculum.json | while read -r lesson; do
            getkv "lesson:${lesson}" > /tmp/lesson.json || continue
            count="$(jq '(.phase11Resources.core.preLessonPairs // []) | length' /tmp/lesson.json)"
            if [ "$count" -gt 0 ]; then
              jq '{lessonId,title,pairs:.phase11Resources.core.preLessonPairs}' /tmp/lesson.json
            fi
          done
          echo 'PASS: read-only convention audit complete.'
