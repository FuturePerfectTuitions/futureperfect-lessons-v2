name: Phase 12 controlled fixture cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12-fixture-cleanup.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  cleanup:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' && github.event.pull_request.head.ref == 'phase12-batch-aware-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Remove only Phase 12 controlled fixture rows and verify empty batch config
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing cleanup.' >&2; exit 1;; esac

          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --command \
            "DELETE FROM student_batch_assignments WHERE batch_key LIKE '__P12_ACCEPT_%' OR batch_key LIKE '__P12_DIAG_%' OR batch_key LIKE '__P12_DEBUG_%'; DELETE FROM batch_lesson_releases WHERE batch_key LIKE '__P12_ACCEPT_%' OR batch_key LIKE '__P12_DIAG_%' OR batch_key LIKE '__P12_DEBUG_%'; DELETE FROM batch_definitions WHERE batch_key LIKE '__P12_ACCEPT_%' OR batch_key LIKE '__P12_DIAG_%' OR batch_key LIKE '__P12_DEBUG_%';" \
            --yes >/tmp/cleanup.log 2>&1

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS fixture_batch_count FROM batch_definitions WHERE batch_key LIKE '__P12_%'; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/verify.json 2>/tmp/verify.err
          test "$(jq -r '.[0].results[0].batch_count' /tmp/verify.json)" = '0'
          test "$(jq -r '.[1].results[0].assignment_count' /tmp/verify.json)" = '0'
          test "$(jq -r '.[2].results[0].release_count' /tmp/verify.json)" = '0'
          test "$(jq -r '.[3].results[0].fixture_batch_count' /tmp/verify.json)" = '0'
          grep -Fq 'trg_student_sessions_single_active' /tmp/verify.json
          grep -Fq '"ok"' /tmp/verify.json
          echo 'Phase 12 controlled fixture cleanup: PASS'