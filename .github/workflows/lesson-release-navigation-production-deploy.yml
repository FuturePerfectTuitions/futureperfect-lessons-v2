name: Lesson release navigation production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lesson-release-navigation-production-deploy.yml'
      - 'ops/deploy_current_worker_preserve.sh'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_ENTRYPOINT: src/index-phase20-change8.js
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 lesson release navigation surface Change 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate canonical Phase 11 navigation manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs >/tmp/phase11-navigation-manifest.json
          jq -e '.curricula == 11 and .lessons == 369' /tmp/phase11-navigation-manifest.json >/dev/null
          grep -Fq 'const PHASE11_NAVIGATION_MANIFEST = {' worker/src/phase11-navigation-manifest.generated.js
          echo 'PHASE11_NAVIGATION_MANIFEST_GENERATED_PASS'

      - name: Verify lesson release navigation and importer
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/deploy_current_worker_preserve.sh
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/index-phase20-change7.js
          node --check worker/src/admin-lesson-release-import.js
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change8.js"' worker/wrangler.toml
          echo 'LESSON_RELEASE_NAVIGATION_STATIC_PASS'

      - name: Require admin-import secrets before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_PASSWORD") != null' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_SESSION_SECRET") != null' /tmp/settings.json >/dev/null
          echo 'ADMIN_IMPORT_SECRETS_PRESENT_PASS'

      - name: Deploy Change 8 preserving production bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          grep -Fq 'main = "src/index-phase20-change8.js"' worker/wrangler.runtime-preserve.toml
          echo 'LESSON_RELEASE_NAVIGATION_DEPLOY_PASS'

      - name: Verify deployed Worker really contains Change 8
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-after.bin
          grep -aFq 'lessonReleaseEntitlement' /tmp/worker-after.bin
          grep -aFq 'english-year5-11plus' /tmp/worker-after.bin
          grep -aFq 'Only PreLesson Sheets available to download and print.' /tmp/worker-after.bin
          echo 'CHANGE8_DEPLOYED_MARKERS_PASS'

      - name: Verify live admin endpoint remains protected
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://futureperfecttuitions.github.io'
          code="$(curl --silent --show-error --output /tmp/admin-preview.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"rows":[]}' \
            "$BASE/api/v1/admin/lesson-releases/preview")"
          test "$code" = '401'
          jq -e '.error == "UNAUTHORISED"' /tmp/admin-preview.json >/dev/null
          echo 'LESSON_RELEASE_NAVIGATION_LIVE_ROUTE_PASS'
