name: Temporary Change 9 verification
on:
  push:
    branches: [fix-live-ui-regressions-20260907]
    paths:
      - '.github/workflows/tmp-change9-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify navigation labels and existing UI regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change9.js
          node tests/phase20-change9-ui-labels-verification.mjs
          node tests/recent-shares-collapsible-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change9.js"' worker/wrangler.toml
          grep -Fq 'background: var(--c8-navy);' assets/phase16-ui-refinement.css
          grep -Fq 'color: #fff;' assets/phase16-ui-refinement.css
          grep -Fq 'phase20-collapsible-lessons.js' phase11.html
          grep -Fq 'Just shared with you' phase11.html
