name: Phase 11 Answer Pack content diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase11-answer-content-diagnostic.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build suspected duplicate list
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module <<'NODE' > /tmp/suspects.tsv
          import { loadPhase11Catalogue } from './scripts/phase11-catalogue.mjs';
          const catalogue = loadPhase11Catalogue();
          function norm(v){ return String(v || '').toLowerCase().replace(/\.pdf$/,'').replace(/\b(?:answer|pack|homework)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
          for (const record of Object.values(catalogue.lessons)) {
            const ordinary = Array.isArray(record?.homeworks) ? record.homeworks : (Array.isArray(record?.core?.homeworks) ? record.core.homeworks : []);
            const paired = ordinary.map(x => x?.answerPack).filter(Boolean);
            const supplementary = record?.phase11Resources?.core?.supplementaryAnswers || [];
            for (const a of paired) for (const s of supplementary) {
              if (norm(a?.displayName || a?.name) && norm(a?.displayName || a?.name) === norm(s?.displayName || s?.name)) {
                console.log([record.lessonId, a.r2Key, s.r2Key].join('\t'));
              }
            }
          }
          NODE
          test "$(wc -l < /tmp/suspects.tsv)" -gt 0
          echo "suspect_count=$(wc -l < /tmp/suspects.tsv)"
      - name: Compare R2 object SHA-256 hashes
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/results.tsv
          while IFS=$'\t' read -r lesson paired supplementary; do
            rm -f /tmp/a.pdf /tmp/b.pdf
            npx --yes wrangler@${WRANGLER_VERSION} r2 object get "fpt-materials-dev/${paired}" --file=/tmp/a.pdf --remote >/dev/null
            npx --yes wrangler@${WRANGLER_VERSION} r2 object get "fpt-materials-dev/${supplementary}" --file=/tmp/b.pdf --remote >/dev/null
            ha="$(sha256sum /tmp/a.pdf | awk '{print $1}')"
            hb="$(sha256sum /tmp/b.pdf | awk '{print $1}')"
            same=false
            if [ "$ha" = "$hb" ]; then same=true; fi
            printf '%s\t%s\t%s\t%s\n' "$lesson" "$same" "$ha" "$hb" | tee -a /tmp/results.tsv
          done < /tmp/suspects.tsv
          total="$(wc -l < /tmp/results.tsv)"
          identical="$(awk -F '\t' '$2=="true"{n++} END{print n+0}' /tmp/results.tsv)"
          echo "TOTAL=$total IDENTICAL=$identical"
          test "$total" = "$identical"
