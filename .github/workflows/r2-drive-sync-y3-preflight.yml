name: R2 Drive sync Y3 read-only preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y3
    paths:
      - .github/workflows/r2-drive-sync-y3-preflight.yml
      - scripts/r2_drive_sync_y3_preflight.py

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  preflight-year3:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Year 3 reconciliation branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet google-auth requests

      - name: Read-only Year 3 Drive and R2 preflight
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_sync_y3_preflight.py

      - name: Upload Year 3 preflight summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y3-r2-preflight-summary
          path: y3-r2-preflight-summary.json
          if-no-files-found: warn
          retention-days: 30
