name: Phase 13 temporary late-added lesson verification

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-late-added-verify-temp.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  verify-late-added:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify both controlled lessons remain independently entitled
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing.' >&2; false;; esac
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT lesson_id,COUNT(*) AS rows,MIN(source_batch_code) AS source_batch_code,MIN(source_lesson_date) AS source_lesson_date FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id IN ('Y5E10','Y5E11') GROUP BY lesson_id ORDER BY lesson_id; SELECT lesson_id,COUNT(*) AS rows,MIN(lesson_date) AS lesson_date FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id IN ('Y5E10','Y5E11') GROUP BY lesson_id ORDER BY lesson_id; PRAGMA quick_check;" >/tmp/verify.json
          jq -c '[.[0].results,.[1].results,.[2].results[0]]' /tmp/verify.json
          test "$(jq -r '.[0].results|length' /tmp/verify.json)" = '2'
          test "$(jq -r '.[0].results[]|select(.lesson_id=="Y5E10")|.rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[0].results[]|select(.lesson_id=="Y5E11")|.rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[0].results[]|select(.lesson_id=="Y5E10")|.source_batch_code' /tmp/verify.json)" = '__P13_ACCEPT_E5__'
          test "$(jq -r '.[0].results[]|select(.lesson_id=="Y5E11")|.source_batch_code' /tmp/verify.json)" = '__P13_ACCEPT_E5__'
          test "$(jq -r '.[1].results|length' /tmp/verify.json)" = '2'
          test "$(jq -r '.[1].results[]|select(.lesson_id=="Y5E10")|.rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[1].results[]|select(.lesson_id=="Y5E11")|.rows' /tmp/verify.json)" = '1'
          test "$(jq -r '.[1].results[]|select(.lesson_id=="Y5E10")|.lesson_date' /tmp/verify.json)" = '2026-09-13'
          test "$(jq -r '.[1].results[]|select(.lesson_id=="Y5E11")|.lesson_date' /tmp/verify.json)" = '2026-09-13'
          jq -e '.[2].results[]|select(.quick_check=="ok")' /tmp/verify.json >/dev/null
          echo 'LATE_ADDED_VERIFIED=Y5E10 retained, Y5E11 created, one entitlement and release each.'
