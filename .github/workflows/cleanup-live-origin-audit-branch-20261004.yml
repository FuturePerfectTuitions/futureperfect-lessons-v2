name: Cleanup temporary live-origin audit branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-live-origin-audit-branch-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete temporary audit branch
        shell: bash
        run: |
          set -euo pipefail
          branch='ops/live-origin-audit-20261004'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
            echo "DELETED $branch"
          else
            echo "ABSENT $branch"
          fi
