name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Compare stored access snapshots with current source compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      DB_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      AS_OF_DATE: '2026-09-26'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare exact compiler source used by rebuilt pipeline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 'rebuild/post-cp13-entitlement-fix-2026-09-15:refs/remotes/origin/rebuild/post-cp13-entitlement-fix-2026-09-15'
          git worktree add --detach /tmp/rebuild-source refs/remotes/origin/rebuild/post-cp13-entitlement-fix-2026-09-15

      - name: Compare stored current snapshots to freshly compiled current inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rebuild-source/scripts/diagnose-current-vs-stored.mjs <<'NODE'
          import { compileAccessScope, globalToCatalogue } from '../rebuild/adminops/src/lib/compiler.mjs';
          import { pointerKey, versionKey } from '../rebuild/adminops/src/lib/atomic-publisher.mjs';

          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const studentsNs=process.env.STUDENTS_KV_ID, readNs=process.env.READ_MODELS_KV_ID, db=process.env.DB_ID, asOf=process.env.AS_OF_DATE;
          const base='https://api.cloudflare.com/client/v4', headers={Authorization:`Bearer ${token}`};
          const clean=v=>String(v??'').trim(), norm=v=>clean(v).toLowerCase();
          async function env(path,init={}){const r=await fetch(`${base}${path}`,{...init,headers:{...headers,...(init.headers||{})}});const b=await r.json().catch(()=>null);if(!r.ok||b?.success!==true)throw new Error(`CF ${r.status} ${path}`);return b;}
          async function kvJson(ns,key){const r=await fetch(`${base}/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers});if(r.status===404)return null;if(!r.ok)throw new Error(`KV ${r.status}`);return r.json();}
          async function kvKeys(ns,prefix){const out=[];let cursor='';do{const q=new URLSearchParams({limit:'1000',prefix});if(cursor)q.set('cursor',cursor);const b=await env(`/accounts/${account}/storage/kv/namespaces/${ns}/keys?${q}`);out.push(...(b.result||[]).map(x=>x.name));cursor=clean(b.result_info?.cursor);}while(cursor);return out;}
          async function d1(sql,params=[]){const b=await env(`/accounts/${account}/d1/database/${db}/query`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql,params})});const x=Array.isArray(b.result)?b.result[0]:b.result;return x?.results||[];}

          const globalPointer=await kvJson(readNs,pointerKey('global'));
          const globalEnvelope=await kvJson(readNs,versionKey('global',globalPointer.current.version));
          const catalogue=globalToCatalogue(globalEnvelope.payload);
          const defs=await d1('SELECT batch_key, academic_year, subject, school_year, stream, maths_level, active_from, active_to FROM batch_definitions');
          const studentKeys=await kvKeys(studentsNs,'user:');
          const targetProfiles=[];
          for(const key of studentKeys){const user=await kvJson(studentsNs,key);const first=norm(user?.firstName||user?.name);if(first==='devansh'||first==='kiaan')targetProfiles.push({label:first==='devansh'?'DEVANSH':'KIAAN',id:norm(key.slice(5)),user});}
          if(targetProfiles.length!==2)throw new Error(`TARGETS ${targetProfiles.length}`);

          const accessPointers=await kvKeys(readNs,'rm:v1:scope:access_3A');
          const currentPointers=accessPointers.filter(k=>k.endsWith(':current'));
          const storedByName=new Map();
          for(const key of currentPointers){const p=await kvJson(readNs,key);if(!p?.current?.version)continue;const scopeEncoded=key.slice('rm:v1:scope:'.length,-':current'.length);const ekey=`rm:v1:scope:${scopeEncoded}:version:${encodeURIComponent(p.current.version).replace(/%/g,'_')}`;const e=await kvJson(readNs,ekey);const first=norm(e?.payload?.snapshot?.account?.firstName);if(first==='devansh'||first==='kiaan')storedByName.set(first,{pointer:p,envelope:e});}

          const maths=v=>(v||[]).filter(x=>x.subject==='maths').map(x=>({viewId:x.viewId,label:x.label,current:x.current,group:x.group,open:x.openLessonCount,locked:x.lockedLessonCount}));
          for(const t of targetProfiles){
            const assignments=await d1('SELECT a.batch_key,a.effective_from,a.effective_to,b.subject,b.school_year,b.stream,b.maths_level,b.active_from AS batch_active_from,b.active_to AS batch_active_to FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm=?',[t.id]);
            const ent=await d1('SELECT lesson_id,core_access,vr_access,source,source_batch_code,source_lesson_date,first_granted_at,last_confirmed_at FROM lesson_entitlements WHERE portal_user_id_norm=?',[t.id]);
            const pre=await d1('SELECT lesson_id,batch_key,lesson_date,first_granted_at FROM online_prelesson_entitlements WHERE portal_user_id_norm=?',[t.id]);
            const input={asOfDate:asOf,user:t.user,batchDefinitions:defs,batchAssignments:assignments,entitlements:ent,onlinePreLessonEntitlements:pre};
            const fresh=compileAccessScope(input,catalogue,{scopeId:'diagnostic',asOfDate:asOf}).snapshot;
            const stored=storedByName.get(t.label.toLowerCase());
            if(!stored)throw new Error(`NO_STORED_${t.label}`);
            console.log(`=== ${t.label} STORED VS FRESH ===`);
            console.log(JSON.stringify({
              pointerUpdatedAt:stored.pointer.updatedAt||null,
              storedVersion:stored.pointer.current.version,
              previousVersion:stored.pointer.previous?.version||null,
              storedMaths:maths(stored.envelope.payload.snapshot.views),
              freshMaths:maths(fresh.views),
              exactViewIdsEqual:JSON.stringify((stored.envelope.payload.snapshot.views||[]).map(x=>x.viewId))===JSON.stringify((fresh.views||[]).map(x=>x.viewId))
            },null,2));
          }
          NODE
          cd /tmp/rebuild-source
          node scripts/diagnose-current-vs-stored.mjs

      - name: Audit complete
        run: echo 'STORED_VS_FRESH_ACCESS_SNAPSHOT_COMPARE_COMPLETE'
