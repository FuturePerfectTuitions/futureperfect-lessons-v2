name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Audit live lessons domain routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: futureperfect.education
      HOST_NAME: lessons.futureperfect.education
    steps:
      - uses: actions/checkout@v6

      - name: Confirm read credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Cloudflare read credentials present.'

      - name: Resolve zone and DNS record
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --get \
            'https://api.cloudflare.com/client/v4/zones' \
            -H "$AUTH" --data-urlencode "name=${ZONE_NAME}" -o /tmp/zones.json
          jq '{success,errors,result:[.result[]|{id,name,status}]}' /tmp/zones.json
          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json)"
          test -n "$ZONE_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "$AUTH" --data-urlencode "name=${HOST_NAME}" -o /tmp/dns.json
          echo '=== DNS RECORD ==='
          jq '{success,errors,result:[.result[]|{id,type,name,content,proxied,proxiable,ttl,comment,tags}]}' /tmp/dns.json

      - name: Read Worker routes and custom domains
        shell: bash
        run: |
          set -u
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo '=== ZONE WORKER ROUTES ==='
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "$AUTH" -o /tmp/routes.json || true
          jq '{success,errors,result:[(.result // [])[]|{id,pattern,script,environment}]}' /tmp/routes.json 2>/dev/null || cat /tmp/routes.json

          echo '=== ACCOUNT WORKER CUSTOM DOMAINS ==='
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "$AUTH" -o /tmp/domains.json || true
          jq '{success,errors,result:[(.result // [])[]|{id,hostname,service,environment,zone_id,zone_name}]}' /tmp/domains.json 2>/dev/null || cat /tmp/domains.json

      - name: Read Pages projects and domains
        shell: bash
        run: |
          set -u
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "$AUTH" -o /tmp/pages.json || true
          echo '=== PAGES PROJECTS ==='
          jq '{success,errors,result:[(.result // [])[]|{name,subdomain,production_branch,created_on,source,domains,canonical_deployment:{id:.canonical_deployment.id,url:.canonical_deployment.url,environment:.canonical_deployment.environment,created_on:.canonical_deployment.created_on,latest_stage:.canonical_deployment.latest_stage}}]}' /tmp/pages.json 2>/dev/null || cat /tmp/pages.json

      - name: Read Worker script names
        shell: bash
        run: |
          set -u
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "$AUTH" -o /tmp/scripts.json || true
          echo '=== WORKER SCRIPTS ==='
          jq '{success,errors,result:[(.result // [])[]|{id,etag,modified_on,created_on,usage_model,handlers}]}' /tmp/scripts.json 2>/dev/null || cat /tmp/scripts.json

      - name: Verify public live asset and record headers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LIVE ROOT HEADERS ==='
          curl --fail --silent --show-error --location -D - "https://${HOST_NAME}/" -o /tmp/live.html
          echo '=== LIVE ASSET REFERENCES ==='
          grep -Eo '<script[^>]+src="[^"]+"[^>]*>|<link[^>]+href="[^"]+"[^>]*>' /tmp/live.html || true
          echo 'CLOUDFLARE_LIVE_DOMAIN_PROVENANCE_AUDIT_COMPLETE'
