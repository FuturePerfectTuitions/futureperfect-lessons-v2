name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Trace prepared access snapshot producer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Confirm read credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Cloudflare read credentials present.'

      - name: Inspect stored prepared snapshots for only the two reported students
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${READ_MODELS_KV_ID}"
          : > /tmp/kv-keys.txt
          cursor=''
          page=0
          while :; do
            page=$((page+1))
            if [ -n "$cursor" ]; then
              curl --fail --silent --show-error --get "$API/keys" -H "$AUTH" \
                --data-urlencode 'limit=1000' --data-urlencode "cursor=$cursor" -o /tmp/kv-page.json
            else
              curl --fail --silent --show-error --get "$API/keys" -H "$AUTH" \
                --data-urlencode 'limit=1000' -o /tmp/kv-page.json
            fi
            jq -e '.success == true' /tmp/kv-page.json >/dev/null
            jq -r '.result[].name' /tmp/kv-page.json >> /tmp/kv-keys.txt
            cursor="$(jq -r '.result_info.cursor // empty' /tmp/kv-page.json)"
            [ -z "$cursor" ] && break
            [ "$page" -lt 20 ] || { echo 'KV pagination safety stop'; exit 2; }
          done
          echo "READ_MODELS_KV_KEY_COUNT=$(wc -l < /tmp/kv-keys.txt | tr -d ' ')"

          : > /tmp/matches.ndjson
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            encoded="$(jq -rn --arg v "$key" '$v|@uri')"
            if ! curl --fail --silent --show-error "$API/values/$encoded" -H "$AUTH" -o /tmp/value.json; then
              continue
            fi
            if ! jq -e . /tmp/value.json >/dev/null 2>&1; then
              continue
            fi
            name="$(jq -r '.snapshot.student.displayName // .student.displayName // empty' /tmp/value.json)"
            case "${name,,}" in
              devansh|kiaan)
                jq -c '{
                  displayName:(.snapshot.student.displayName // .student.displayName),
                  modelMetadata:{schema:(.schema // null),version:(.version // null),generatedAt:(.generatedAt // .snapshot.generatedAt // null),scopeType:(.scopeType // null),source:(.source // null),generations:(.snapshot.generations // .generations // null)},
                  accessViews:(.views // []),
                  subjects:[(.snapshot.subjects // [])[] | {
                    subject,
                    views:[(.views // [])[] | {viewId,label,current,group,visibleLessonCount,openLessonCount,lockedLessonCount,catalogueAvailable,lockedPreview}]
                  }]
                }' /tmp/value.json >> /tmp/matches.ndjson
                ;;
            esac
          done < /tmp/kv-keys.txt

          echo '=== MATCHED PREPARED SNAPSHOTS (ONLY DEVANSH/KIAAN) ==='
          if [ -s /tmp/matches.ndjson ]; then
            jq . /tmp/matches.ndjson
          else
            echo 'NO_MATCHING_PREPARED_SNAPSHOTS_FOUND'
          fi

      - name: Recover exact deployed scope-key construction
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --dump-header /tmp/student.headers \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${STUDENT_WORKER}" \
            -H "$AUTH" -o /tmp/student.package
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          import re
          raw=open('/tmp/student.package','rb').read()
          headers=open('/tmp/student.headers','rb').read().decode('latin-1','replace')
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ct=m.group(1).strip() if m else ''
          if ct.lower().startswith('multipart/'):
              msg=BytesParser(policy=default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+raw)
              parts=[]
              for p in msg.iter_parts():
                  payload=p.get_payload(decode=True) or b''
                  if b'/api/v2/student/home' in payload: parts.append(payload)
              if not parts: raise SystemExit('NO_STUDENT_MODULE')
              payload=max(parts,key=len)
          else: payload=raw
          text=payload.decode('utf-8','replace')
          print('=== DEPLOYED SCOPE-KEY / READ-MODEL FUNCTIONS ===')
          for needle in ['function accessObjectKey','function opaqueScopeId','function resolveAccess']:
              pos=text.find(needle)
              print('\n###',needle)
              print(text[max(0,pos-800):min(len(text),pos+2400)] if pos>=0 else 'NOT_FOUND')
          PY

      - name: Locate the exact rebuild source and READ_MODELS_KV writer across rebuild branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/rebuild/*:refs/remotes/origin/rebuild/*'
          mapfile -t refs < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/rebuild/*')
          echo "REBUILD_REF_COUNT=${#refs[@]}"

          echo '=== SOURCE PATH CANDIDATES ==='
          for ref in "${refs[@]}"; do
            git ls-tree -r --name-only "$ref" | grep -E '(^|/)(shared/view-model\.js|src/student-worker\.js|access-read-model[^/]*\.js|[^/]*read-model[^/]*\.js|[^/]*access[^/]*sync[^/]*\.js)$' | sed "s#^#$ref #" || true
          done | sort -u | head -n 500

          echo '=== EXACT STRING LOCATIONS ==='
          for ref in "${refs[@]}"; do
            for needle in 'Access read model unavailable' 'prepared-access-read-model' 'MATHS_Y6_EXTRA' 'accessObjectKey' 'READ_MODELS_KV.put' 'snapshot.subjects'; do
              git grep -n -F "$needle" "$ref" -- 2>/dev/null | sed "s#^#$ref | #" || true
            done
          done | sort -u | head -n 1000

          echo '=== COMMITS TOUCHING LIKELY PRODUCER PATHS ==='
          git log --all --date=iso --pretty='format:%H %ad %s' -- '**/shared/view-model.js' '**/src/student-worker.js' '**/*access*read*model*.js' '**/*read*model*.js' | head -n 200 || true

      - name: Audit complete
        run: echo 'PREPARED_ACCESS_SNAPSHOT_PRODUCER_TRACE_COMPLETE'
