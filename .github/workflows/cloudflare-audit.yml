name: Cloudflare V2 LESSONS_KV read-only export

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Export V2 LESSONS_KV safely
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Confirm Cloudflare read credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials present; values not printed."

      - name: Resolve current LESSONS_KV namespace and export key list
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p audit/values
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > audit/worker-settings.json
          jq -e '.success == true' audit/worker-settings.json >/dev/null
          NS_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' audit/worker-settings.json | head -n1)"
          test -n "$NS_ID"
          echo "$NS_ID" > audit/namespace-id.txt
          jq '[.result.bindings[] | select(.name=="LESSONS_KV") | {name,type,namespace_id}]' audit/worker-settings.json > audit/namespace.json
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS_ID}/keys?limit=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > audit/keys-response.json
          jq -e '.success == true' audit/keys-response.json >/dev/null
          jq '[.result[] | {name, expiration, metadata}]' audit/keys-response.json > audit/keys.json
          jq -r '.result[].name' audit/keys-response.json > audit/key-names.txt
          echo "V2 LESSONS_KV key count: $(wc -l < audit/key-names.txt)"

      - name: Read and sanitize every current V2 lesson KV value
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          ns_id = pathlib.Path('audit/namespace-id.txt').read_text().strip()
          names = pathlib.Path('audit/key-names.txt').read_text().splitlines()
          out = pathlib.Path('audit/values'); out.mkdir(parents=True, exist_ok=True)
          sensitive_fragments = ('password','passwd','secret','token','credential')
          def sanitize(v):
              if isinstance(v, dict):
                  r={}
                  for k,val in v.items():
                      r[k] = '<REDACTED>' if any(f in str(k).lower() for f in sensitive_fragments) else sanitize(val)
                  return r
              if isinstance(v,list): return [sanitize(x) for x in v]
              return v
          manifest=[]; all_values={}
          for i,name in enumerate(names):
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns_id}/values/{urllib.parse.quote(name,safe="")}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read()
              text=raw.decode('utf-8','replace')
              try:
                  parsed=json.loads(text); cleaned=sanitize(parsed); kind='json'
              except Exception:
                  cleaned=text; kind='text'
              safe=f'{i:03d}_{urllib.parse.quote(name,safe="")}.json'
              (out/safe).write_text(json.dumps({'key':name,'kind':kind,'value':cleaned},ensure_ascii=False,indent=2),encoding='utf-8')
              manifest.append({'key':name,'file':safe,'kind':kind}); all_values[name]=cleaned
          pathlib.Path('audit/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('audit/LESSONS_KV_SANITIZED.json').write_text(json.dumps(all_values,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Exported {len(manifest)} sanitized V2 KV values.')
          PY
          sha256sum audit/LESSONS_KV_SANITIZED.json > audit/export.sha256

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-lessons-kv-sanitized
          path: audit/
          if-no-files-found: error
          retention-days: 7

      - name: Confirm read-only completion
        run: echo "READ_ONLY_V2_LESSONS_KV_AUDIT_PASS - no Cloudflare write, delete, deploy or KV put command executed."
