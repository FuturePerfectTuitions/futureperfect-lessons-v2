name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Trace exact prepared access snapshots and producer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Confirm read credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Read only access-model keys and identify Devansh/Kiaan snapshots
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${READ_MODELS_KV_ID}"
          PREFIX='rm:v1:scope:access_3A'
          : > /tmp/access-keys.txt
          cursor=''
          page=0
          while :; do
            page=$((page+1))
            args=(--get "$API/keys" -H "$AUTH" --data-urlencode 'limit=1000' --data-urlencode "prefix=$PREFIX")
            if [ -n "$cursor" ]; then args+=(--data-urlencode "cursor=$cursor"); fi
            curl --fail --silent --show-error "${args[@]}" -o /tmp/access-page.json
            jq -e '.success == true' /tmp/access-page.json >/dev/null
            jq -r '.result[].name' /tmp/access-page.json >> /tmp/access-keys.txt
            cursor="$(jq -r '.result_info.cursor // empty' /tmp/access-page.json)"
            [ -z "$cursor" ] && break
            [ "$page" -lt 10 ] || { echo 'ACCESS_KEY_PAGINATION_SAFETY_STOP'; exit 2; }
          done
          sort -u /tmp/access-keys.txt -o /tmp/access-keys.txt
          echo "ACCESS_MODEL_KEY_COUNT=$(wc -l < /tmp/access-keys.txt | tr -d ' ')"
          grep ':current$' /tmp/access-keys.txt > /tmp/access-pointers.txt || true
          echo "ACCESS_POINTER_COUNT=$(wc -l < /tmp/access-pointers.txt | tr -d ' ')"

          : > /tmp/matches.ndjson
          while IFS= read -r pointerKey; do
            [ -n "$pointerKey" ] || continue
            encodedPointer="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$pointerKey")"
            curl --fail --silent --show-error "$API/values/$encodedPointer" -H "$AUTH" -o /tmp/pointer.json
            version="$(jq -r '.current.version // empty' /tmp/pointer.json)"
            [ -n "$version" ] || continue
            scopeEncoded="${pointerKey#rm:v1:scope:}"
            scopeEncoded="${scopeEncoded%:current}"
            versionEncoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="-_.!~*\x27()" ).replace("%","_"))' "$version")"
            envelopeKey="rm:v1:scope:${scopeEncoded}:version:${versionEncoded}"
            encodedEnvelope="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$envelopeKey")"
            if ! curl --fail --silent --show-error "$API/values/$encodedEnvelope" -H "$AUTH" -o /tmp/envelope.json; then
              continue
            fi
            firstName="$(jq -r '.payload.snapshot.account.firstName // empty' /tmp/envelope.json)"
            case "${firstName,,}" in
              devansh|kiaan)
                jq -c --arg pointerKey "$pointerKey" '{
                  firstName:.payload.snapshot.account.firstName,
                  pointerKey:$pointerKey,
                  envelope:{schemaVersion,kind,scope,version,generatedAt,sha256},
                  snapshot:{
                    asOfDate:.payload.snapshot.asOfDate,
                    account:.payload.snapshot.account,
                    fullViewIds:.payload.snapshot.fullViewIds,
                    views:[(.payload.snapshot.views // [])[] | {viewId,subject,label,current,group,lockedPreview,catalogueAvailable,visibleLessonCount,openLessonCount,lockedLessonCount}],
                    lessonAccessCount:(.payload.snapshot.lessonAccess // {} | length)
                  }
                }' /tmp/envelope.json >> /tmp/matches.ndjson
                ;;
            esac
          done < /tmp/access-pointers.txt

          echo '=== EXACT CURRENT PREPARED SNAPSHOTS: DEVANSH/KIAAN ==='
          if [ -s /tmp/matches.ndjson ]; then
            jq . /tmp/matches.ndjson
          else
            echo 'TARGET_SNAPSHOTS_NOT_FOUND'
            exit 3
          fi

      - name: Locate access-snapshot producer and publisher across rebuild branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/rebuild/*:refs/remotes/origin/rebuild/*'
          mapfile -t refs < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/rebuild/*')
          echo "REBUILD_REF_COUNT=${#refs[@]}"

          echo '=== EXACT PRODUCER SOURCE MATCHES ==='
          for ref in "${refs[@]}"; do
            for needle in 'function compileAccessSnapshot' 'compileAccessSnapshot(' 'prepared-access-read-model' 'READ_MODELS_KV.put' 'publishPrepared' 'rm:v1:scope:'; do
              git grep -n -F "$needle" "$ref" -- 'rebuild/**' 'scripts/**' '.github/workflows/**' 2>/dev/null | sed "s#^#$ref | #" || true
            done
          done | sort -u > /tmp/producer-matches.txt
          cat /tmp/producer-matches.txt | head -n 1500

          echo '=== ACCESS SNAPSHOT SOURCE HASHES BY REBUILD REF ==='
          for ref in "${refs[@]}"; do
            if git cat-file -e "$ref:rebuild/shared/read-models/access-snapshot.mjs" 2>/dev/null; then
              printf '%s ' "$ref"
              git show "$ref:rebuild/shared/read-models/access-snapshot.mjs" | sha256sum | awk '{print $1}'
            fi
          done | sort -k2,2 -k1,1

          echo '=== CURRENT/HISTORICAL PUBLISH WORKFLOW PATHS ==='
          for ref in "${refs[@]}"; do
            git ls-tree -r --name-only "$ref" | grep -E '(^|/)(.*compile.*publish.*|.*read.*model.*publish.*|.*backfill.*access.*|.*snapshot.*)\.(mjs|js|yml|yaml)$' | sed "s#^#$ref | #" || true
          done | sort -u | head -n 1000

      - name: Audit complete
        run: echo 'EXACT_PREPARED_ACCESS_ROOT_TRACE_COMPLETE'
