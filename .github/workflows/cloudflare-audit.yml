name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Audit V2 Cloudflare state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Confirm secrets are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare CI credentials are present. Values are not printed."

      - name: Wrangler identity and version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest --version
          npx --yes wrangler@latest whoami

      - name: Worker deployment status
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Current deployment status ==="
          npx --yes wrangler@latest deployments status --name "$WORKER_NAME" --json
          echo "=== Recent deployments ==="
          npx --yes wrangler@latest deployments list --name "$WORKER_NAME" --json
          echo "=== Secret names only ==="
          npx --yes wrangler@latest secret list --name "$WORKER_NAME" --format json

      - name: Worker runtime settings and bindings (sanitized)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-settings.json

          jq '{
            success,
            errors,
            messages,
            result: {
              compatibility_date: .result.compatibility_date,
              compatibility_flags: .result.compatibility_flags,
              usage_model: .result.usage_model,
              placement: .result.placement,
              bindings: [
                (.result.bindings // [])[] |
                if .type == "plain_text" and (["ENVIRONMENT","ALLOWED_ORIGINS","DEV_LOGIN_ALLOWLIST","STUDENT_LOGIN_ENABLED"] | index(.name)) then
                  {name, type, text}
                elif ((.type // "") | test("secret"; "i")) then
                  {name, type}
                else
                  {name, type, namespace_id, bucket_name, database_name, database_id, id, service, environment}
                end
              ]
            }
          }' /tmp/worker-settings.json

      - name: Account resource inventory (read-only)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== KV namespaces ==="
          npx --yes wrangler@latest kv namespace list
          echo "=== D1 databases ==="
          npx --yes wrangler@latest d1 list --json
          echo "=== R2 buckets ==="
          npx --yes wrangler@latest r2 bucket list

      - name: Repository deployment config snapshot
        shell: bash
        working-directory: worker
        run: |
          set -euo pipefail
          echo "=== worker/wrangler.toml ==="
          cat wrangler.toml

      - name: Audit completed
        run: echo "Read-only Cloudflare audit completed. No deploy or write command was executed."
