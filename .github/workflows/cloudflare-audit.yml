name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Audit all current Year 6-equivalent access sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      DB_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      AS_OF_DATE: '2026-09-27'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare exact compiler source used by rebuilt pipeline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 'rebuild/post-cp13-entitlement-fix-2026-09-15:refs/remotes/origin/rebuild/post-cp13-entitlement-fix-2026-09-15'
          git worktree add --detach /tmp/rebuild-source refs/remotes/origin/rebuild/post-cp13-entitlement-fix-2026-09-15
          cp scripts/audit-y6-equivalent-global.mjs /tmp/rebuild-source/scripts/audit-y6-equivalent-global.mjs

      - name: Compare KV, D1, entitlements, stored snapshot and fresh compile for every current Year 6-equivalent student
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/rebuild-source
          node scripts/audit-y6-equivalent-global.mjs

      - name: Audit complete
        run: echo 'Y6_EQUIVALENT_GLOBAL_SOURCE_AUDIT_COMPLETE_READ_ONLY'
