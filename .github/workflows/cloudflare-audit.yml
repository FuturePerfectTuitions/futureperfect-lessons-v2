name: Cloudflare read-only audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/cloudflare-audit.yml
      - .github/cloudflare-audit-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    name: Trace exact live student home view selector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
    steps:
      - uses: actions/checkout@v6

      - name: Download live student Worker read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --dump-header /tmp/student.headers \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${STUDENT_WORKER}" \
            -H "$AUTH" -o /tmp/student.package

      - name: Extract deployed JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          import re, hashlib
          raw=open('/tmp/student.package','rb').read()
          headers=open('/tmp/student.headers','rb').read().decode('latin-1','replace')
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ct=m.group(1).strip() if m else ''
          if ct.lower().startswith('multipart/'):
              msg=BytesParser(policy=default).parsebytes((f'Content-Type: {ct}\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+raw)
              candidates=[]
              for p in msg.iter_parts():
                  name=p.get_filename() or p.get_param('name',header='content-disposition') or p.get_param('name') or '(unnamed)'
                  payload=p.get_payload(decode=True) or b''
                  if payload and (name.endswith('.js') or b'/api/v2/student/home' in payload): candidates.append((name,payload))
              if not candidates: raise SystemExit('NO_JS_MODULE')
              name,payload=max(candidates,key=lambda x:len(x[1]))
          else:
              name,payload='single-script',raw
          open('/tmp/student.js','wb').write(payload)
          print('MODULE',name,'BYTES',len(payload),'SHA256',hashlib.sha256(payload).hexdigest())
          PY

      - name: Print module provenance and home-selector neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          text=open('/tmp/student.js','r',encoding='utf-8',errors='replace').read()
          lines=text.splitlines()

          print('=== SOURCE / MODULE MARKERS ===')
          for n,line in enumerate(lines,1):
              s=line.strip()
              if re.match(r'^//\s*(?:\.\.?/|src/|worker/|shared/|packages/)',s):
                  print(f'{n}: {s}')

          needles=[
              'source: "prepared-access-read-model"',
              "source: 'prepared-access-read-model'",
              'prepared-access-read-model',
              '/api/v2/student/home',
              'function snapshot(',
              'snapshot =',
              'function resolveAccess(',
              'resolveAccess =',
              'visibleLessonCount',
              'openLessonCount',
              'lockedLessonCount',
              'catalogueAvailable',
              'lockedPreview',
              'maths-year4',
              'maths-level1',
              'maths-year5',
              'maths-level2',
              'maths-year6',
              'maths-level3'
          ]
          print('\n=== MATCHING LINE NEIGHBORHOODS ===')
          emitted=set()
          for needle in needles:
              for n,line in enumerate(lines,1):
                  if needle not in line: continue
                  key=(max(1,n-12),min(len(lines),n+30))
                  if key in emitted: continue
                  emitted.add(key)
                  print(f'\n--- needle={needle!r} line={n} range={key[0]}..{key[1]} ---')
                  for i in range(key[0],key[1]+1): print(f'{i:05d}: {lines[i-1]}')

          print('\n=== FUNCTION NAMES CONTAINING ACCESS/HOME/VIEW/SNAPSHOT/CATALOGUE ===')
          names=[]
          patterns=[r'function\s+([A-Za-z_$][\w$]*)\s*\(',r'(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\([^)]*\)\s*=>']
          for pat in patterns:
              for m in re.finditer(pat,text):
                  name=m.group(1)
                  if re.search(r'access|home|view|snapshot|catalog|summary|lesson',name,re.I): names.append(name)
          for name in sorted(set(names)): print(name)

          print('\n=== HOME ROUTE LARGE CONTEXT ===')
          pos=text.find('/api/v2/student/home')
          if pos>=0:
              start=max(0,pos-5000); end=min(len(text),pos+10000)
              print(text[start:end])
          else:
              print('HOME_ROUTE_NOT_FOUND')

          print('\n=== PREPARED ACCESS LARGE CONTEXT ===')
          pos=text.find('prepared-access-read-model')
          if pos>=0:
              start=max(0,pos-10000); end=min(len(text),pos+10000)
              print(text[start:end])
          else:
              print('PREPARED_ACCESS_MARKER_NOT_FOUND')
          PY

      - name: Audit complete
        run: echo 'LIVE_STUDENT_HOME_SELECTOR_TRACE_COMPLETE'
