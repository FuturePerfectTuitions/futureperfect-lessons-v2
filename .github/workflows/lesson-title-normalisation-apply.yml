name: Apply lesson title normalisation

on:
  push:
    branches: [main]
    paths:
      - 'ops/lesson-title-normalisation-trigger.txt'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guarded live LESSONS_KV title normalisation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json

          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const clean = value => String(value ?? '').trim();

          // Only the legacy label is removed. Numbers that are part of the real
          // Drive title (for example "Statistics 2" or "Fractions 4") remain.
          const DISPLAY_CODE_PREFIX = /^(?:Y[2-6]T\d+[ME]\d+|L[1-3]T\d+[ME]\d+)\s+/i;
          const LEGACY_LESSON_PREFIX = /^Lesson\s+\d+(?:\.\d+)?(?:\s*[-:–—]\s*|\s+)/i;
          const VALID_DISPLAY_ID = /^(?:Y[2-6]T\d+[ME]\d+|L[1-3]T\d+[ME]\d+)$/i;

          function normaliseTitle(value) {
            let title = clean(value);
            title = title.replace(DISPLAY_CODE_PREFIX, '').trim();
            title = title.replace(LEGACY_LESSON_PREFIX, '').trim();
            return title;
          }

          function isCoreCurriculumLesson(record) {
            const ids = record?.displayIds && typeof record.displayIds === 'object'
              ? Object.values(record.displayIds).map(clean).filter(Boolean)
              : [];
            return ids.some(id => VALID_DISPLAY_ID.test(id));
          }

          function withoutTitle(value) {
            const clone = JSON.parse(JSON.stringify(value));
            delete clone.title;
            return JSON.stringify(clone);
          }

          (async () => {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const ns = process.env.LESSONS_KV_ID;
            const apiBase = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}`;
            const auth = { Authorization: `Bearer ${token}` };

            async function listLessonKeys() {
              const keys = [];
              let cursor = '';
              do {
                const params = new URLSearchParams({ limit: '1000', prefix: 'lesson:' });
                if (cursor) params.set('cursor', cursor);
                const r = await fetch(`${apiBase}/keys?${params}`, { headers: auth });
                if (!r.ok) throw new Error(`LIST lesson keys failed HTTP ${r.status}: ${await r.text()}`);
                const body = await r.json();
                if (!body.success || !Array.isArray(body.result)) throw new Error('LIST lesson keys returned an invalid response.');
                keys.push(...body.result.map(item => clean(item.name)).filter(Boolean));
                cursor = clean(body?.result_info?.cursor);
              } while (cursor);
              return keys;
            }

            async function getRecord(key) {
              const r = await fetch(`${apiBase}/values/${encodeURIComponent(key)}`, { headers: auth });
              if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
              const text = await r.text();
              try { return JSON.parse(text); }
              catch { throw new Error(`${key} is not valid JSON`); }
            }

            async function putRecord(key, record) {
              const r = await fetch(`${apiBase}/values/${encodeURIComponent(key)}`, {
                method: 'PUT',
                headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(record)
              });
              if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
            }

            async function verifyRecord(key, before, expectedTitle) {
              let after;
              for (let attempt = 1; attempt <= 6; attempt += 1) {
                after = await getRecord(key);
                if (clean(after.title) === expectedTitle && withoutTitle(after) === withoutTitle(before)) return after;
                if (attempt < 6) await sleep(2000);
              }
              if (clean(after?.title) !== expectedTitle) {
                throw new Error(`Verification failed for ${key}: title="${after?.title}" expected="${expectedTitle}"`);
              }
              throw new Error(`Verification failed for ${key}: a non-title field changed`);
            }

            const keys = await listLessonKeys();
            if (!keys.length) throw new Error('No lesson:* keys were found in LESSONS_KV.');

            // Full read-only preflight before the first write.
            const plan = [];
            let curriculumCount = 0;
            for (const key of keys) {
              const current = await getRecord(key);
              if (!isCoreCurriculumLesson(current)) continue;
              curriculumCount += 1;
              const currentTitle = clean(current.title);
              const wantedTitle = normaliseTitle(currentTitle);
              if (!wantedTitle) throw new Error(`Normalisation would produce an empty title for ${key}.`);
              if (wantedTitle !== currentTitle) plan.push({ key, current, currentTitle, wantedTitle });
            }

            console.log(`LESSON_KEYS_SCANNED=${keys.length}`);
            console.log(`CORE_CURRICULUM_LESSONS=${curriculumCount}`);
            console.log(`TITLE_UPDATES_PLANNED=${plan.length}`);
            for (const item of plan) {
              console.log(`PLAN ${item.key}: "${item.currentTitle}" -> "${item.wantedTitle}"`);
            }

            const written = [];
            try {
              for (const item of plan) {
                const next = { ...item.current, title: item.wantedTitle };
                await putRecord(item.key, next);
                await verifyRecord(item.key, item.current, item.wantedTitle);
                written.push(item);
                console.log(`UPDATED ${item.key}: ${item.wantedTitle}`);
              }
            } catch (err) {
              console.error(`APPLY_FAILED: ${err.message}`);
              console.error(`ROLLBACK_COUNT=${written.length}`);
              for (const item of written.reverse()) {
                try {
                  await putRecord(item.key, item.current);
                  await verifyRecord(
                    item.key,
                    { ...item.current, title: item.wantedTitle },
                    clean(item.current.title)
                  );
                  console.log(`ROLLED_BACK ${item.key}`);
                } catch (rollbackErr) {
                  console.error(`ROLLBACK_FAILED ${item.key}: ${rollbackErr.message}`);
                }
              }
              process.exit(1);
            }

            // Final live re-read of every changed lesson and a global residual scan.
            for (const item of written) {
              await verifyRecord(item.key, item.current, item.wantedTitle);
            }

            let residual = 0;
            for (const key of keys) {
              const record = await getRecord(key);
              if (!isCoreCurriculumLesson(record)) continue;
              if (normaliseTitle(record.title) !== clean(record.title)) {
                residual += 1;
                console.error(`RESIDUAL ${key}: ${record.title}`);
              }
            }
            if (residual) throw new Error(`Residual legacy curriculum titles remain: ${residual}`);

            console.log(`APPLIED=${written.length}`);
            console.log('RESIDUAL_LEGACY_TITLES=0');
            console.log('FINAL_VERIFICATION=PASS');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
