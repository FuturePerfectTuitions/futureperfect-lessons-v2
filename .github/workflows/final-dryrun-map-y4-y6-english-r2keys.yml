name: Final dry-run - map Year 4-6 English KV R2 links

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-dryrun-map-y4-y6-english-r2keys.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve all broken Year 4-6 English refs without writing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.parse,requests,difflib
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          bucket='fpt-materials-dev'; worker='fpt-portal-v2-worker'
          settings=requests.get(f'{api}/accounts/{acct}/workers/scripts/{worker}/settings',headers=auth,timeout=60).json(); assert settings.get('success')
          b=settings['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); r2bound=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert r2bound==bucket; assert ns
          kvbase=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def kg(k):
            q=requests.get(kvbase+urllib.parse.quote(k,safe=''),headers=auth,timeout=60); q.raise_for_status(); return q.json()
          r2=[]; cursor=None
          while True:
            params={'per_page':'1000'}
            if cursor: params['cursor']=cursor
            p=requests.get(f'{api}/accounts/{acct}/r2/buckets/{bucket}/objects',headers=auth,params=params,timeout=120).json(); assert p.get('success'),p
            r2.extend(p.get('result') or []); info=p.get('result_info') or {}; cursor=info.get('cursor') if info.get('is_truncated') else None
            if not cursor: break
          r2keys={o.get('key') for o in r2 if o.get('key') and not o.get('key').endswith('/')}
          cfg=[('ENGLISH_Y4','year4',re.compile(r'^Y4T[123]E\d{2}$')),('ENGLISH_Y5','year5',re.compile(r'^Y5T[123]E\d{2}$')),('ENGLISH_Y6','year6',re.compile(r'^Y6T[123]E\d{2}$'))]
          def current_code(rec,rx):
            vals=[]
            def walk(x):
              if isinstance(x,dict):
                for k,v in x.items():
                  if k=='r2Key': continue
                  if isinstance(v,str) and rx.fullmatch(v): vals.append(v)
                  else: walk(v)
              elif isinstance(x,list):
                for v in x: walk(v)
            for v in (rec.get('displayIds') or {}).values():
              if isinstance(v,str) and rx.fullmatch(v): vals.append(v)
            vals=sorted(set(vals)); assert len(vals)==1,(rec.get('lessonId'),vals); return vals[0]
          def norm(s):
            s=urllib.parse.unquote(s).rsplit('/',1)[-1].lower()
            s=re.sub(r'\.[a-z0-9]{2,5}$','',s)
            s=re.sub(r'pri\d+',' ',s)
            s=re.sub(r'\b(?:y[456](?:t[123])?e?e?\d{1,2}|l[123]t[123]e\d{1,2})\b',' ',s)
            s=re.sub(r'\b(?:answer key|answer pack|answers?|homework|prelesson|pre lesson|sheet|sheets|marking scheme|mark scheme)\b',' ',s)
            s=re.sub(r'[^a-z0-9]+',' ',s)
            return ' '.join(s.split())
          def resolve(old,year,current):
            parts=old.split('/')
            if len(parts)<5 or parts[0]!='english' or parts[1]!=year: return None,'bad-path',[]
            category='/'.join(parts[3:-1]); bn=parts[-1]; prefix=f'english/{year}/{current}/{category}/'
            candidates=sorted(z for z in r2keys if z.startswith(prefix))
            direct=prefix+bn
            if direct in r2keys: return direct,'same-basename',candidates
            if len(candidates)==1: return candidates[0],'single-in-category',candidates
            nb=norm(bn)
            exact=[z for z in candidates if norm(z)==nb and nb]
            if len(exact)==1: return exact[0],'normalized-exact',candidates
            scored=sorted(((difflib.SequenceMatcher(None,nb,norm(z)).ratio(),z) for z in candidates if nb and norm(z)),reverse=True)
            if scored and scored[0][0]>=0.72 and (len(scored)==1 or scored[0][0]-scored[1][0]>=0.12): return scored[0][1],f'fuzzy-{scored[0][0]:.3f}',candidates
            return None,'unresolved',candidates
          rows=[]; broken=0
          for c,year,rx in cfg:
            for lid in kg('curriculum:'+c).get('lessonIds') or []:
              rec=kg('lesson:'+lid); current=current_code(rec,rx)
              def walk(x,path=''):
                nonlocal_dummy=None
                global broken
                if isinstance(x,dict):
                  for k,v in x.items():
                    p=f'{path}.{k}' if path else k
                    if k=='r2Key' and isinstance(v,str) and v.strip() and v.strip() not in r2keys:
                      old=v.strip(); target,method,cands=resolve(old,year,current)
                      rows.append({'curriculum':c,'lessonId':lid,'currentCode':current,'jsonPath':p,'old':old,'target':target,'method':method,'candidateCount':len(cands),'candidates':cands})
                    else: walk(v,p)
                elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
              walk(rec)
          broken=len(rows); unresolved=[r for r in rows if not r['target']]
          methods={}
          for r in rows: methods[r['method']]=methods.get(r['method'],0)+1
          report={'environment':env,'bucket':bucket,'broken':broken,'resolved':broken-len(unresolved),'unresolved':len(unresolved),'methods':methods,'rows':rows}
          json.dump(report,open('y4-y6-english-map.json','w'),indent=2,sort_keys=True)
          print(json.dumps({k:report[k] for k in ['broken','resolved','unresolved','methods']},indent=2,sort_keys=True))
          assert broken==660,broken
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y4-y6-english-map
          path: y4-y6-english-map.json
          retention-days: 30
