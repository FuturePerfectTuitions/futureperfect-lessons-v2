name: L2 L3 hidden bridge guarded deploy
on:
  push:
    branches: [feature/l2-l3-quiz-bridge-2026-09-21]
    paths: ['.github/workflows/l2-l3-bridge-hidden-deploy.yml']
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.134.0
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_OLD_VERSION: c0d2d5f2-a43a-4b3a-8078-839353a9c58c
  BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  PORTAL_ROOT: https://lessons.futureperfect.education/
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and Portal regression boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check worker/src/index-step10-quiz-bridge.js
          grep -Fq "POLICY_VERSION='quiz-release-context-v2.0'" worker/src/index-step10-quiz-bridge.js
          grep -Fq "RELEASE_SOURCE='portal-live-maths11plus-release-v2'" worker/src/index-step10-quiz-bridge.js
          grep -Fq "inheritedLevels:level===3?['L2']:[]" worker/src/index-step10-quiz-bridge.js
          node tests/admin-resource-replace-verification.mjs
          node tests/admin-tools-ui-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/admin-superuser-static-verification.mjs
          node --experimental-default-type=module tests/protected-view-stability-static-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs
          node tests/phase13-excel-sync-verification.mjs
      - name: Guarded hidden bridge cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ORIGIN='https://lessons.futureperfect.education'
          DEPLOYED=0
          rollback(){
            code=$?
            if [ "$DEPLOYED" = 1 ]; then
              echo "VERIFY_FAILED_ROLLING_BACK_TO=$EXPECTED_OLD_VERSION" >&2
              npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$EXPECTED_OLD_VERSION@100%" --name "$WORKER_NAME" --message 'Rollback L2 L3 hidden bridge' -y || true
              sleep 3
            fi
            exit "$code"
          }
          trap rollback ERR

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$WORKER_NAME" --json > /tmp/before.json
          OLD="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/before.json | head -n1)"
          test "$OLD" = "$EXPECTED_OLD_VERSION" || { echo "PORTAL_VERSION_DRIFT expected=$EXPECTED_OLD_VERSION actual=$OLD"; exit 1; }
          curl -fsS -H "$AUTH" "$API/workers/scripts/${WORKER_NAME}/settings" -o /tmp/settings-before.json
          jq -r '[.result.bindings[].name]|sort|join(",")' /tmp/settings-before.json > /tmp/names-before.txt
          jq -e --arg id "$PORTAL_D1_ID" '.result.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/settings-before.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/settings-before.json >/dev/null

          for path in /api/v1/student/quiz/eligibility /api/v1/student/quiz/launch /api/v1/quiz-bridge/redeem; do
            case "$path" in
              */eligibility) c="$(curl -sS -H "Origin: $ORIGIN" -o /tmp/pre.json -w '%{http_code}' "$BASE$path")" ;;
              */launch) c="$(curl -sS -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}' -o /tmp/pre.json -w '%{http_code}' "$BASE$path")" ;;
              *) c="$(curl -sS -X POST -H 'Content-Type: application/json' --data '{"code":"guard-invalid"}' -o /tmp/pre.json -w '%{http_code}' "$BASE$path")" ;;
            esac
            test "$c" = 501
          done

          WORKER_ENTRYPOINT=src/index-step10-quiz-bridge.js DEPLOY_MESSAGE='L2 L3 trusted release-context hidden bridge' bash ops/deploy_current_worker_preserve.sh
          DEPLOYED=1
          sleep 4

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$WORKER_NAME" --json > /tmp/after.json
          NEW="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/after.json | head -n1)"
          test -n "$NEW"; test "$NEW" != "$OLD"
          echo "NEW_PORTAL_VERSION=$NEW"
          curl -fsS -H "$AUTH" "$API/workers/scripts/${WORKER_NAME}/settings" -o /tmp/settings-after.json
          jq -r '[.result.bindings[].name]|sort|join(",")' /tmp/settings-after.json > /tmp/names-after.txt
          cmp /tmp/names-before.txt /tmp/names-after.txt
          jq -e --arg id "$PORTAL_D1_ID" '.result.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/settings-after.json >/dev/null

          admin="$(curl -sS -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}' -o /tmp/admin.json -w '%{http_code}' "$BASE/api/v1/admin/trials/list")"
          test "$admin" = 401; grep -Fq 'UNAUTHORISED' /tmp/admin.json
          protected="$(curl -sS -H "Origin: $ORIGIN" -D /tmp/ph -o /tmp/pb -w '%{http_code}' "$BASE/api/v1/student/answer-view/invalid-protected-view-token")"
          test "$protected" = 410
          grep -iFq 'x-fpt-protected-view-stability: phase23-protected-view-stability-v3' /tmp/ph

          eligibility="$(curl -sS -H "Origin: $ORIGIN" -o /tmp/e.json -w '%{http_code}' "$BASE/api/v1/student/quiz/eligibility")"
          launch="$(curl -sS -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}' -o /tmp/l.json -w '%{http_code}' "$BASE/api/v1/student/quiz/launch")"
          redeem="$(curl -sS -X POST -H 'Content-Type: application/json' --data '{"code":"guard-invalid"}' -o /tmp/r.json -w '%{http_code}' "$BASE/api/v1/quiz-bridge/redeem")"
          test "$eligibility" = 401; grep -Fq '"eligible":false' /tmp/e.json
          test "$launch" = 401; grep -Fq 'SESSION_INVALID' /tmp/l.json
          test "$redeem" = 401; grep -Fq 'UNAUTHORIZED' /tmp/r.json

          curl -fsS "$PORTAL_ROOT" -o /tmp/portal.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,urllib.parse,os
          html=Path('/tmp/portal.html').read_text(errors='replace')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          text=''
          for i,ref in enumerate(refs):
              p=f'/tmp/post{i}.js'; subprocess.run(['curl','-fsS',urllib.parse.urljoin(os.environ['PORTAL_ROOT'],ref),'-o',p],check=True); text+=Path(p).read_text(errors='replace')
          markers=['11+ Practice','quiz.futureperfect.education','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']
          found=[m for m in markers if m in text]
          if found: raise SystemExit('QUIZ_SURFACE_PRESENT_AFTER '+repr(found))
          print('PORTAL_WITHDRAWAL_AFTER_PASS')
          PY
          trap - ERR
          echo HIDDEN_BRIDGE_DEPLOY_PASS
