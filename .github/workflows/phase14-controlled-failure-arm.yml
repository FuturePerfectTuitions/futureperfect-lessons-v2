name: Phase 14 controlled desktop server failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-controlled-failure-arm.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FPT_PORTAL_V2_EXCEL_SYNC_TOKEN: ${{ secrets.FPT_PORTAL_V2_EXCEL_SYNC_TOKEN }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  arm-controlled-failure:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Arm exact TestY-only HTTP 503 failure
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          STAGE='initialise'
          STUDENTS=''; LESSONS=''; DB=''; R2=''; DEPLOYED=0

          make_config() {
            local ENTRYPOINT="$1"
            local OUT="$2"
            cat >"$OUT" <<EOF
          name = "fpt-portal-v2-worker"
          main = "${ENTRYPOINT}"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          }

          rollback_worker() {
            if [ "$DEPLOYED" -ne 1 ] || [ -z "$STUDENTS" ] || [ -z "$LESSONS" ] || [ -z "$DB" ] || [ -z "$R2" ]; then return; fi
            set +e
            make_config 'src/index-phase13.js' 'worker/wrangler.phase14.rollback.toml'
            $W deploy --config worker/wrangler.phase14.rollback.toml --keep-vars \
              --message 'Rollback Phase 14 controlled failure to canonical Phase 13 Worker' >/tmp/p14-force-rollback.log 2>&1
            RC=$?
            if [ "$RC" -eq 0 ]; then
              echo 'Automatic rollback to canonical Phase 13 Worker completed.'
            else
              echo 'ERROR: automatic Worker rollback failed.' >&2
              tail -n 60 /tmp/p14-force-rollback.log || true
            fi
            set -e
          }

          failure() {
            STATUS=$?
            trap - ERR
            echo "Phase 14 controlled-failure deployment failed at stage: ${STAGE}" >&2
            rollback_worker
            exit "$STATUS"
          }
          trap failure ERR

          STAGE='source-and-secret-guard'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FPT_PORTAL_V2_EXCEL_SYNC_TOKEN"
          test "${#FPT_PORTAL_V2_EXCEL_SYNC_TOKEN}" -ge 24
          node --check worker/src/index-phase13.js
          ! grep -Fq 'PHASE14_FORCED_FAILURE' worker/src/index-phase13.js

          STAGE='cloudflare-isolation-guard'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-force-settings-before.json
          jq -e '.success == true' /tmp/p14-force-settings-before.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-force-settings-before.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-force-settings-before.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal V2 student login is enabled; refusing controlled failure.' >&2; false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p14-force-settings-before.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p14-force-settings-before.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p14-force-settings-before.json)"
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-force-settings-before.json)"
          test "$R2" = 'fpt-materials-dev'
          for V in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$V"; test "$V" != null; done

          STAGE='desktop-fixture-baseline-guard'
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS test_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS test_assignments FROM student_batch_assignments WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full'); PRAGMA quick_check;" \
            >/tmp/p14-force-before.json 2>/tmp/p14-force-before.err
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-force-before.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p14-force-before.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-force-before.json)" = '8'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-force-before.json)" = '0'
          test "$(jq -r '.[4].results[0].test_entitlements' /tmp/p14-force-before.json)" = '0'
          test "$(jq -r '.[5].results[0].test_assignments' /tmp/p14-force-before.json)" = '4'
          jq -e '.[6].results[0].quick_check == "ok"' /tmp/p14-force-before.json >/dev/null

          STAGE='build-test-only-entrypoint'
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'worker/src/index-phase13.js';
          const outPath = 'worker/src/index-phase14-forced-failure.js';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const needle = "  const results = [];\n";
          if (!source.includes(needle)) throw new Error('Expected Phase 13 insertion point not found.');
          const injected = `  const phase14ForcedFailure = body.items.some(item =>\n    normalisePortalUserId(item?.portalUserId) === 'testy3p14m' &&\n    cleanText(item?.lessonId) === 'Y3M1' &&\n    cleanText(item?.operation).toLowerCase() === 'grant'\n  );\n  if (phase14ForcedFailure) {\n    return json({ ok: false, error: 'PHASE14_FORCED_FAILURE' }, 503);\n  }\n\n`;
          source = source.replace(needle, injected + needle);
          fs.writeFileSync(outPath, source);
          NODE
          node --check worker/src/index-phase14-forced-failure.js
          grep -Fq 'PHASE14_FORCED_FAILURE' worker/src/index-phase14-forced-failure.js

          STAGE='dry-run-test-only-entrypoint'
          make_config 'src/index-phase14-forced-failure.js' 'worker/wrangler.phase14.force.toml'
          $W deploy --config worker/wrangler.phase14.force.toml --dry-run --outdir /tmp/p14-force-build >/tmp/p14-force-dry-run.log
          grep -R -aFq 'PHASE14_FORCED_FAILURE' /tmp/p14-force-build
          grep -R -aFq '/api/v1/admin/excel-entitlements/sync' /tmp/p14-force-build

          STAGE='deploy-controlled-failure'
          $W deploy --config worker/wrangler.phase14.force.toml --keep-vars \
            --message 'Phase 14 TestY-only controlled Excel 503 acceptance failure' >/tmp/p14-force-deploy.log 2>&1
          DEPLOYED=1
          sleep 3

          STAGE='post-deploy-isolation-guard'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-force-settings-after.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-force-settings-after.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-force-settings-after.json)" = 'fpt-materials-dev'
          AFTER_LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-force-settings-after.json)"
          case "${AFTER_LOGIN,,}" in ''|'false') ;; *) false;; esac

          STAGE='authenticated-503-probe'
          CODE="$(curl --silent --show-error --output /tmp/p14-force-probe.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $FPT_PORTAL_V2_EXCEL_SYNC_TOKEN" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"items":[{"syncRowId":"P14-FORCED-FAILURE-PROBE","operation":"grant","portalUserId":"testy3p14m","lessonId":"Y3M1","batchKey":"Y3FM","lessonDate":"2026-09-15"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          test "$CODE" = '503'
          jq -e '.ok == false and .error == "PHASE14_FORCED_FAILURE"' /tmp/p14-force-probe.json >/dev/null

          STAGE='no-mutation-after-probe'
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS target_entitlement FROM lesson_entitlements WHERE portal_user_id_norm='testy3p14m' AND lesson_id='Y3M1'; SELECT COUNT(*) AS target_release FROM batch_lesson_releases WHERE batch_key='Y3FM' AND lesson_id='Y3M1'; PRAGMA quick_check;" \
            >/tmp/p14-force-after.json 2>/tmp/p14-force-after.err
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-force-after.json)" = '632'
          test "$(jq -r '.[1].results[0].assignment_count' /tmp/p14-force-after.json)" = '8'
          test "$(jq -r '.[2].results[0].release_count' /tmp/p14-force-after.json)" = '0'
          test "$(jq -r '.[3].results[0].target_entitlement' /tmp/p14-force-after.json)" = '0'
          test "$(jq -r '.[4].results[0].target_release' /tmp/p14-force-after.json)" = '0'
          jq -e '.[5].results[0].quick_check == "ok"' /tmp/p14-force-after.json >/dev/null

          trap - ERR
          echo 'PHASE14_CONTROLLED_FAILURE_ARMED'
          echo 'Scope: development Worker only; exact testy3p14m + Y3M1 grant only; HTTP 503; no D1 mutation.'
