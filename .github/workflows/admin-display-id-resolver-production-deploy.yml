name: Admin display ID resolver production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-display-id-resolver-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Portal V2 admin import display ID resolver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify display-ID resolver and importer regression
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/admin-lesson-release-import.js
          node --check worker/src/index-phase20-change7.js
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'curriculumCandidatesForDisplayId' worker/src/admin-lesson-release-import.js
          grep -Fq 'createLessonResolver' worker/src/admin-lesson-release-import.js
          echo 'ADMIN_DISPLAY_ID_STATIC_PASS'

      - name: Require admin-import secrets before deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_PASSWORD") != null' /tmp/settings.json >/dev/null
          jq -e '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index("ADMIN_IMPORT_SESSION_SECRET") != null' /tmp/settings.json >/dev/null
          echo 'ADMIN_IMPORT_SECRETS_PRESENT_PASS'

      - name: Deploy current production Worker preserving bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          echo 'ADMIN_DISPLAY_ID_DEPLOY_PASS'

      - name: Verify live admin endpoint remains protected
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://futureperfecttuitions.github.io'
          code="$(curl --silent --show-error --output /tmp/admin-preview.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"rows":[]}' \
            "$BASE/api/v1/admin/lesson-releases/preview")"
          test "$code" = '401'
          jq -e '.error == "UNAUTHORISED"' /tmp/admin-preview.json >/dev/null
          echo 'ADMIN_DISPLAY_ID_LIVE_ROUTE_PASS'
