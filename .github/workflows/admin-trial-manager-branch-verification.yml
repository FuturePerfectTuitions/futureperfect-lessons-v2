name: Admin Trial Manager branch verification

on:
  push:
    branches:
      - 'feature/admin-trial-login-manager-2026-09-17'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_PHASE23_ENTRYPOINT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check worker/src/admin-trial-manager.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node --check assets/admin-trials.js
          node --check worker/src/admin-lesson-release-import.js
          node --check worker/src/admin-lesson-release-import-email.js
          node --check worker/src/index-phase23-protected-view-stability.js
      - name: Trial manager verification
        run: node --experimental-default-type=module tests/admin-trial-manager-verification.mjs
      - name: Existing Admin and protected-view regressions
        run: |
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/admin-superuser-static-verification.mjs
          node --experimental-default-type=module tests/protected-view-stability-static-verification.mjs
