name: Year 6 current KV key layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/year6-current-kv-key-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Inspect actual live Year 6 curricula and records
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          NS="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings.json)"
          echo "NAMESPACE=$NS"
          getkv() {
            local key="$1" encoded
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            curl --fail --silent --show-error "$API/storage/kv/namespaces/$NS/values/$encoded" -H "$AUTH"
          }
          getkv 'curriculum:MATHS_L3' >/tmp/l3.json
          getkv 'curriculum:MATHS_Y6_EXTRA' >/tmp/extra.json
          echo '--- curricula ---'
          jq -c . /tmp/l3.json
          jq -c . /tmp/extra.json
          jq -r '.lessonIds[]' /tmp/l3.json /tmp/extra.json | awk '!seen[$0]++' >/tmp/ids.txt
          : >/tmp/records.tsv
          while IFS= read -r id; do
            getkv "lesson:$id" >/tmp/lesson.json
            ID="$id" jq -r --arg id "$id" '[ $id, (.displayIds["maths-year6"] // .displayLessonIds["maths-year6"] // .presentation.displayIds["maths-year6"] // ""), (.title // "") ] | @tsv' /tmp/lesson.json >>/tmp/records.tsv
          done </tmp/ids.txt
          echo '--- actual live merged order: canonical / display / title ---'
          cat /tmp/records.tsv
          echo '--- display IDs only ---'
          cut -f2 /tmp/records.tsv
          echo '--- boundary around Y6T1M21 ---'
          awk -F '\t' 'p>0 {print; p--; next} $2=="Y6T1M21" {print; p=5}' /tmp/records.tsv
          echo '--- duplicates ---'
          cut -f2 /tmp/records.tsv | grep -v '^$' | sort | uniq -cd || true
