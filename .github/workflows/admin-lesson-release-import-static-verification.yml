name: Admin lesson release import verification

on:
  pull_request:
    branches: [main]
    paths:
      - admin-import.html
      - assets/admin-import.js
      - assets/admin-import-manual-email.js
      - worker/src/admin-lesson-release-import.js
      - worker/src/admin-lesson-release-import-email.js
      - worker/src/admin-lesson-release-import-manual-email.js
      - worker/src/parent-email.js
      - worker/src/parent-email-signature.js
      - worker/src/index-phase20-change7.js
      - worker/src/index-phase20-change8.js
      - worker/src/index-phase20-change17-parent-email.js
      - tests/admin-import-auto-process-static-verification.mjs
      - tests/admin-import-manual-email-verification.mjs
      - tests/admin-lesson-release-import-verification.mjs
      - tests/parent-email-import-verification.mjs
      - tests/parent-email-idempotency-verification.mjs
      - tests/parent-email-completed-status-verification.mjs
      - tests/parent-email-test-routing-verification.mjs
      - tests/lesson-release-navigation-verification.mjs
      - .github/workflows/admin-lesson-release-import-static-verification.yml
  push:
    branches: [lesson-release-admin-import, feature/parent-email-csv-import, feature/admin-import-auto-process, feature/import-auto-send-manual]
    paths:
      - admin-import.html
      - assets/admin-import.js
      - assets/admin-import-manual-email.js
      - worker/src/admin-lesson-release-import.js
      - worker/src/admin-lesson-release-import-email.js
      - worker/src/admin-lesson-release-import-manual-email.js
      - worker/src/parent-email.js
      - worker/src/parent-email-signature.js
      - worker/src/index-phase20-change7.js
      - worker/src/index-phase20-change8.js
      - worker/src/index-phase20-change17-parent-email.js
      - tests/admin-import-auto-process-static-verification.mjs
      - tests/admin-import-manual-email-verification.mjs
      - tests/admin-lesson-release-import-verification.mjs
      - tests/parent-email-import-verification.mjs
      - tests/parent-email-idempotency-verification.mjs
      - tests/parent-email-completed-status-verification.mjs
      - tests/parent-email-test-routing-verification.mjs
      - tests/lesson-release-navigation-verification.mjs
      - .github/workflows/admin-lesson-release-import-static-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check worker/src/admin-lesson-release-import.js
          node --check worker/src/admin-lesson-release-import-email.js
          node --check worker/src/admin-lesson-release-import-manual-email.js
          node --check worker/src/parent-email.js
          node --check worker/src/parent-email-signature.js
          node --check worker/src/index-phase20-change7.js
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node --check assets/admin-import.js
          node --check assets/admin-import-manual-email.js
      - name: Importer verification
        run: |
          set -euo pipefail
          node tests/admin-import-auto-process-static-verification.mjs
          node tests/admin-import-manual-email-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-idempotency-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-test-routing-verification.mjs
      - name: Lesson release navigation verification
        run: |
          set -euo pipefail
          node tests/lesson-release-navigation-verification.mjs
          test -f worker/src/index-phase20-change17-parent-email.js
          grep -Fq 'main = "src/index-phase20-change20-configured-upsell.js"' worker/wrangler.toml
