name: Y4E1 live-data student detail simulation

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-live-simulation.yml
      - .github/diagnostics/y4e1-live-sim.mjs

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Run current worker code against live read-only production data for Reina Y4E1
        shell: bash
        run: |
          set -euo pipefail
          node .github/diagnostics/y4e1-live-sim.mjs
