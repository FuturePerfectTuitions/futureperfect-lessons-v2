name: Rebuild Checkpoint 6 - New Student Worker

on:
  push:
    branches:
      - rebuild/checkpoint6-new-student-worker-2026-09-13
      - rebuild/portal-v2-performance-2026-09-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint6-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new runtime
        run: |
          node --check rebuild/student/src/index.js
          node --check rebuild/student/src/lib/runtime.mjs
          node --check rebuild/student/src/lib/runtime-adapters.mjs
          node --check rebuild/student/src/lib/access-scope.mjs
          node --check rebuild/student/src/lib/read-model-resolver.mjs
          node --check rebuild/shared/read-models/video.mjs
          node --check rebuild/adminops/src/lib/compiler.mjs
      - name: Checkpoint 6 new Student Worker gate
        run: node tests/rebuild-checkpoint6-new-student-worker.mjs
      - name: Checkpoint 5 authentication capability regression
        run: node tests/rebuild-checkpoint5-auth-capability-core.mjs
      - name: Checkpoint 4 dual-write compatibility regression
        run: node tests/rebuild-checkpoint4-dual-write-compatibility.mjs
      - name: Checkpoint 3 atomic publishing regression
        run: node tests/rebuild-checkpoint3-atomic-publishing.mjs
      - name: Checkpoint 2 prepared read-model regression
        run: node tests/rebuild-checkpoint2-read-models.mjs
