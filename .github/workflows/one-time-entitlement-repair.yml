name: Guarded one-time entitlement repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-entitlement-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      TARGET_FIRST_NAME_SHA256: a9916765f2a4b978f30c19e9c5bd0d70cd015ce0542c4587b4e0c4fee98f5366

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard production and resolve Students KV
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_GUARD=true'

      - name: Locate exactly one target and prepare entitlement-only patch
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$STUDENTS_KV_ID" --prefix 'user:' --remote > /tmp/keys.json 2>/dev/null
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          target=os.environ['TARGET_FIRST_NAME_SHA256']
          matches=[]
          for item in json.load(open('/tmp/keys.json',encoding='utf-8')):
              key=str(item.get('name') or '')
              if not key.startswith('user:'): continue
              suffix=key[5:].strip().lower()
              if suffix.startswith(('admin','demo','trial')): continue
              p=subprocess.run(['npx','--yes','wrangler@latest','kv','key','get',key,'--namespace-id',os.environ['STUDENTS_KV_ID'],'--remote'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
              if p.returncode: continue
              try: user=json.loads(p.stdout)
              except Exception: continue
              raw_name=str(user.get('name') or user.get('studentName') or '').strip().lower()
              first=(raw_name.split() or [''])[0]
              if hashlib.sha256(first.encode()).hexdigest()!=target: continue
              if str(user.get('role') or '').strip().lower()=='admin': continue
              matches.append((key,user))
          print('TARGET_MATCH_COUNT=' + str(len(matches)))
          if len(matches)!=1: sys.exit(2)
          key,user=matches[0]
          before=json.loads(json.dumps(user))
          user['fullLibraries']=['MATHS_Y4_FULL','MATHS_Y5_FULL']
          user['upsellViews']=['english-year5','english-year6']
          user['trialViews']=[]
          before_other=json.loads(json.dumps(before))
          after_other=json.loads(json.dumps(user))
          for field in ('fullLibraries','upsellViews','trialViews'):
              before_other.pop(field,None); after_other.pop(field,None)
          if before_other != after_other:
              print('UNRELATED_FIELD_GUARD=false'); sys.exit(3)
          open('/tmp/target-key','w').write(key)
          json.dump(before,open('/tmp/before.json','w'),separators=(',',':'))
          json.dump(user,open('/tmp/after.json','w'),separators=(',',':'))
          print('ENTITLEMENT_PATCH_READY=true')
          PY

      - name: Persist target profile only
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key').read().strip(),safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/after.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}" \
            > /tmp/put.json
          jq -e '.success == true' /tmp/put.json >/dev/null

      - name: Verify exact entitlement result and unrelated-field preservation
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        shell: bash
        run: |
          set -euo pipefail
          ENCODED_KEY="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote(open('/tmp/target-key').read().strip(),safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/verify.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${ENCODED_KEY}"
          python3 - <<'PY'
          import json,sys
          before=json.load(open('/tmp/before.json'))
          verify=json.load(open('/tmp/verify.json'))
          if verify.get('fullLibraries') != ['MATHS_Y4_FULL','MATHS_Y5_FULL']:
              print('FULL_LIBRARY_VERIFY=false'); sys.exit(2)
          if verify.get('upsellViews') != ['english-year5','english-year6']:
              print('UPSELL_VERIFY=false'); sys.exit(3)
          if verify.get('trialViews') != []:
              print('TRIAL_VERIFY=false'); sys.exit(4)
          for field in ('fullLibraries','upsellViews','trialViews'):
              before.pop(field,None); verify.pop(field,None)
          if before != verify:
              print('UNRELATED_FIELDS_UNCHANGED=false'); sys.exit(5)
          print('FULL_LIBRARY_VERIFY=true')
          print('UPSELL_VERIFY=true')
          print('TRIAL_VERIFY=true')
          print('UNRELATED_FIELDS_UNCHANGED=true')
          PY
