name: Step 10 Gate E real UI acceptance baseline

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - 'docs/step10/STEP10_GATE_E_REAL_UI_BASELINE_TRIGGER.md'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
      TEST_USER: kiaan1312
      BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
      QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
      EXPECTED_BROWSER_VERSION: d59497dd-c2cc-48d6-b733-5169270059de
      EXPECTED_STUDENT_VERSION: f26167b1-073c-4015-912a-288a3d20e0bb
      EXPECTED_QUIZ_VERSION: 13eda650-d6b3-4ed3-a3cc-c788306a4789
      EXPECTED_LIVE_BUNDLE: assets/portal-wK1OwW5J.js
      EXPECTED_LIVE_BUNDLE_SHA256: 3907cb7782d070590c2f2c00bebb09fe80260de295e35b3dd1a41a8309e2cb5e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture read-only Gate E baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const clean=v=>String(v??'').trim(); const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID),token=clean(process.env.CLOUDFLARE_API_TOKEN); const base='https://api.cloudflare.com/client/v4';
          async function cf(path,opts={}){const r=await fetch(base+path,{...opts,headers:{Authorization:`Bearer ${token}`,'content-type':'application/json',...(opts.headers||{})}});const text=await r.text();let j;try{j=JSON.parse(text)}catch{};if(!r.ok||j?.success!==true)throw new Error(`${r.status} ${path}: ${JSON.stringify(j?.errors||text)}`);return j.result;}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`);const ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[];const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');}
          const workers={browser:await active(process.env.BROWSER_WORKER),student:await active(process.env.STUDENT_WORKER),quiz:await active(process.env.QUIZ_WORKER)};
          if(workers.browser!==process.env.EXPECTED_BROWSER_VERSION||workers.student!==process.env.EXPECTED_STUDENT_VERSION||workers.quiz!==process.env.EXPECTED_QUIZ_VERSION) throw new Error(`Worker drift ${JSON.stringify(workers)}`);

          const root=await fetch('https://lessons.futureperfect.education/',{headers:{'cache-control':'no-store','user-agent':'fpt-step10-gate-e-baseline'}});if(!root.ok)throw new Error(`Portal root ${root.status}`);const html=await root.text();const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);const bundle=scripts.find(x=>/portal-|\/assets\//i.test(x))||scripts[0];if(!bundle)throw new Error('Live bundle missing');const norm=bundle.replace(/^\.\//,'').replace(/^\//,'').split('?')[0];const br=await fetch(new URL(bundle,'https://lessons.futureperfect.education/'),{headers:{'cache-control':'no-store'}});const bytes=Buffer.from(await br.arrayBuffer());const hash=crypto.createHash('sha256').update(bytes).digest('hex');if(norm!==process.env.EXPECTED_LIVE_BUNDLE||hash!==process.env.EXPECTED_LIVE_BUNDLE_SHA256)throw new Error(`Gate E bundle drift ${norm} ${hash}`);const text=bytes.toString('utf8');if(!text.includes('Take a real exam style GL quiz')||text.includes('Take a Maths quiz'))throw new Error('Final Gate E copy not live');

          async function d1(id,sql){const result=await cf(`/accounts/${account}/d1/database/${id}/query`,{method:'POST',body:JSON.stringify({sql})});for(const b of result||[])if(Number(b?.meta?.rows_written||0)!==0||b?.meta?.changed_db===true)throw new Error('Read-only baseline unexpectedly wrote D1');return (result||[]).map(x=>x.results||[]);}
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const portalSql=`SELECT a.portal_user_id_norm,a.batch_key,b.subject,b.stream,b.maths_level,b.school_year,a.effective_from,a.effective_to FROM student_batch_assignments a JOIN batch_definitions b ON b.batch_key=a.batch_key WHERE a.portal_user_id_norm='${process.env.TEST_USER}' AND lower(b.subject)='maths' AND lower(b.stream)='11plus' AND (CASE WHEN b.maths_level BETWEEN 1 AND 3 THEN b.maths_level ELSE b.school_year-3 END)=3 AND a.effective_from<='${today}' AND (a.effective_to IS NULL OR '${today}'<a.effective_to) AND (b.active_from IS NULL OR b.active_from<='${today}') AND (b.active_to IS NULL OR '${today}'<b.active_to); SELECT COUNT(*) AS count, MAX(created_at) AS latest_created_at, SUM(CASE WHEN used_at IS NOT NULL THEN 1 ELSE 0 END) AS used_count FROM quiz_launch_codes WHERE portal_user_id_norm='${process.env.TEST_USER}';`;
          const portal=await d1(process.env.PORTAL_D1_ID,portalSql);
          const assignment=portal[0]; if(assignment.length!==1||assignment[0].batch_key!=='Y511FM')throw new Error(`Kiaan assignment drift ${JSON.stringify(assignment)}`);
          const launch={count:Number(portal[1]?.[0]?.count||0),usedCount:Number(portal[1]?.[0]?.used_count||0),latestCreatedAt:portal[1]?.[0]?.latest_created_at||null};

          const quizSql=`SELECT COUNT(*) AS count, MAX(created_at) AS latest_created_at FROM quiz_auth_session WHERE portal_user_id='${process.env.TEST_USER}'; SELECT COUNT(*) AS count, MAX(event_at) AS latest_event_at FROM quiz_audit_event WHERE portal_user_id='${process.env.TEST_USER}' AND event_type='QUIZ_LOGIN_CREATED'; SELECT COUNT(*) AS count FROM quiz_session WHERE portal_user_id='${process.env.TEST_USER}';`;
          const quiz=await d1(process.env.QUIZ_D1_ID,quizSql);
          const auth={count:Number(quiz[0]?.[0]?.count||0),latestCreatedAt:quiz[0]?.[0]?.latest_created_at||null}; const audits={count:Number(quiz[1]?.[0]?.count||0),latestEventAt:quiz[1]?.[0]?.latest_event_at||null}; const tests={count:Number(quiz[2]?.[0]?.count||0)};
          const out={marker:'STEP10_GATE_E_REAL_UI_BASELINE_PASS',readOnly:true,testUser:process.env.TEST_USER,workers,liveBundle:{path:norm,sha256:hash},copy:'Take a real exam style GL quiz',assignment:assignment[0],launch,quizAuth:auth,quizLoginAudits:audits,quizTests:tests,capturedAt:new Date().toISOString()};fs.writeFileSync('/tmp/gate-e-real-ui-baseline.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: step10-gate-e-real-ui-baseline
          path: /tmp/gate-e-real-ui-baseline.json
          retention-days: 30
