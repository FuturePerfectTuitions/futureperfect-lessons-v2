name: Phase 17 authoritative closure acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase17-authoritative-closure.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

concurrency:
  group: phase17-authoritative-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  closure:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase17-prelaunch-freeze-production-verification' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frozen architecture and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.base.sha }}' = '05f9c23bdb3e599ef0c641490822e9d63e5728fe'
          git merge-base --is-ancestor 05f9c23bdb3e599ef0c641490822e9d63e5728fe HEAD
          node scripts/phase11-navigation-manifest.mjs >/tmp/nav.json
          jq -e '.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons==369 and .curricula==11' /tmp/nav.json >/dev/null
          node tests/phase11-catalogue-static-verification.mjs >/tmp/catalogue-static.txt
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/catalogue-static.txt
          node tests/phase11-cloudflare-workflow-static-verification.mjs
          node tests/phase17-explicit-special-screenpal-static.mjs
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase14-excel-sync-matrix-verification.mjs
          node tests/phase15-master-navigation-regression.mjs
          node tests/phase16-session-transport-static-verification.mjs
          node tests/phase16-ui-refinement-static-verification.mjs
          grep -Fq 'main = "src/index-phase17.js"' worker/wrangler.toml
          grep -Fq "import phase13Worker from './index-phase13.js';" worker/src/index-phase17.js
          grep -Fq "const historicalViews = new Set(" worker/src/index.js
          grep -Fq "explicitlyRetained('maths-level1')" worker/src/index.js
          grep -Fq "explicitlyRetained('english-year4-11plus')" worker/src/index.js
          grep -Fq 'DEV_LOGIN_ALLOWLIST = ""' worker/wrangler.toml
          ! grep -Fq 'STUDENT_LOGIN_ENABLED = "true"' worker/wrangler.toml
          echo 'PHASE17_FROZEN_ARCHITECTURE_PASS'

      - name: Exact clean pre-state and effective-date boundary
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node tests/phase17-reconcile-readonly.mjs >/tmp/reconcile-before.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT" and .worker.environment=="development" and .worker.normalStudentLoginDisabled==true and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .kv.userRecords==2 and .kv.lessonKvKeys==381 and .kv.explicitVrHowToUrls==11' /tmp/reconcile-before.json >/dev/null
          node tests/phase17-finalize-state.mjs >/tmp/finalize-before.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .credentialFormatFailures==0 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .manualCoreAssignments==0 and .manualVrAssignments==0 and .manualSpecialAssignments==0 and .blockedLessonOverrides==0 and .d1.entitlements==173 and .d1.realEntitlements==173 and .identitiesOrPasswordsExposed==false' /tmp/finalize-before.json >/dev/null
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "SELECT batch_key,effective_from FROM student_batch_assignments ORDER BY batch_key;" >/tmp/effective.json 2>/tmp/effective.err
          jq -e '.[0].results | map({batch_key,effective_from}) == [{"batch_key":"Y3FE","effective_from":"2026-09-10"},{"batch_key":"Y3FM","effective_from":"2026-09-07"},{"batch_key":"Y511FE","effective_from":"2026-09-12"},{"batch_key":"Y511FM","effective_from":"2026-09-08"}]' /tmp/effective.json >/dev/null
          test "$(TZ=Europe/London date +%F)" \< '2026-09-07'
          echo 'PHASE17_CLEAN_PRESTATE_PASS'

      - name: Selected real and controlled dummy live acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/phase17-final-live-acceptance.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  rm -rf "$TMP"\n','  : # keep temporary evidence until the final proof\n',1)
          anchor='kv_get "$STUDENTS" "user:$Y5" "$TMP/y5.json"\n'
          extra='jq -e \'(.historicalViews//[])==["english-year4-11plus","maths-level1","maths-level2"]\' "$TMP/y5.json" >/dev/null\n'
          if extra not in s:
              if anchor not in s: raise SystemExit('STOP: Y5 private-config anchor not found')
              s=s.replace(anchor,anchor+extra,1)
          a=s.find('# Selected real Y3:')
          b=s.find('# Protected Answer Pack:',a)
          if a<0 or b<0: raise SystemExit('STOP: selected-real acceptance anchors not found')
          block=r'''# Selected real Y3 before effective_from: retained Year 2 history remains available; future Year 3 is not yet Current or routable.
          login_from_file "$Y3" "$TMP/y3.json" "$TMP/y3.jar" "$TMP/y3-login.json"
          api_get "$TMP/y3.jar" '/api/v1/student/home' "$TMP/y3-home.json"
          jq -e '.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year2" and .current==false and .group=="previous" and .openLessonCount==29)' "$TMP/y3-home.json" >/dev/null
          jq -e '.subjects[]|select(.subject=="maths")|.views[]|select(.viewId=="maths-year2" and .current==false and .group=="previous" and .openLessonCount==36)' "$TMP/y3-home.json" >/dev/null
          jq -e '[..|objects|select((.viewId?=="english-year3" or .viewId?=="maths-year3") and .current?==true)]|length==0' "$TMP/y3-home.json" >/dev/null
          PRE_Y3_CODE="$(api_code_get "$TMP/y3.jar" '/api/v1/student/views/english-year3/lessons' "$TMP/y3-pre-effective.json")"; test "$PRE_Y3_CODE" = '404'
          api_get "$TMP/y3.jar" '/api/v1/student/views/english-year2/lessons' "$TMP/y3-history.json"
          jq -e '[.lessons[]|select(.locked==false)]|length==29' "$TMP/y3-history.json" >/dev/null

          # Selected real Y5 before effective_from: retained English Y4 11+ and Maths Levels 1/2 are Previous; future Y5 11+/Level 3 is inactive.
          login_from_file "$Y5" "$TMP/y5.json" "$TMP/y5.jar" "$TMP/y5-login.json"
          api_get "$TMP/y5.jar" '/api/v1/student/home' "$TMP/y5-home.json"
          jq -e '.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year4-11plus" and .current==false and .group=="previous" and .openLessonCount==34)' "$TMP/y5-home.json" >/dev/null
          jq -e '.subjects[]|select(.subject=="maths")|.views[]|select(.viewId=="maths-level1" and .current==false and .group=="previous" and .openLessonCount==36)' "$TMP/y5-home.json" >/dev/null
          jq -e '.subjects[]|select(.subject=="maths")|.views[]|select(.viewId=="maths-level2" and .current==false and .group=="previous" and .openLessonCount==38)' "$TMP/y5-home.json" >/dev/null
          jq -e '[..|objects|select(.viewId?=="english-year4" or .viewId?=="maths-year4" or .viewId?=="maths-year5")]|length==0' "$TMP/y5-home.json" >/dev/null
          jq -e '[..|objects|select((.viewId?=="english-year5-11plus" or .viewId?=="maths-level3") and .current?==true)]|length==0' "$TMP/y5-home.json" >/dev/null
          PRE_Y5_CODE="$(api_code_get "$TMP/y5.jar" '/api/v1/student/views/english-year5-11plus/lessons' "$TMP/y5-pre-effective.json")"; test "$PRE_Y5_CODE" = '404'
          api_get "$TMP/y5.jar" '/api/v1/student/views/english-year4-11plus/lessons' "$TMP/y5-history.json"
          jq -e '[.lessons[]|select(.locked==false)]|length==34' "$TMP/y5-history.json" >/dev/null

          '''
          s=s[:a]+block+s[b:]
          s=s.replace('current_views=4 retained_history=true current_catalogues_locked=true','pre_effective_future_views_inactive=true retained_11plus_history=true')
          p.write_text(s,encoding='utf-8')
          PY
          bash -n tests/phase17-final-live-acceptance.sh
          bash tests/phase17-final-live-acceptance.sh
          echo 'PHASE17_SELECTED_REAL_DUMMY_PASS'

      - name: Cleanup, state, and deployed-security proof
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node tests/phase17-finalize-state.mjs >/tmp/finalize-after.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .manualCoreAssignments==0 and .manualVrAssignments==0 and .manualSpecialAssignments==0 and .blockedLessonOverrides==0 and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .quickCheck=="ok" and .triggerPresent==true' /tmp/finalize-after.json >/dev/null
          node tests/phase17-reconcile-readonly.mjs >/tmp/reconcile-after.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT" and .worker.normalStudentLoginDisabled==true and .kv.userRecords==2 and .kv.lessonKvKeys==381 and .kv.explicitVrHowToUrls==11' /tmp/reconcile-after.json >/dev/null
          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/settings.json >/dev/null
          test -z "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'
          echo 'PHASE17_POST_LIVE_CLEANUP_PASS'

      - name: Exhaustive R2, catalogue, ScreenPal, and quiz audit
        shell: bash
        run: |
          set -euo pipefail
          sed 's/entitlementCount !== 632/entitlementCount !== 173/' tests/phase17-prelaunch-readonly.mjs > tests/.phase17-closure-readonly.mjs
          PHASE17_REPORT_FILE=/tmp/readonly.json node tests/.phase17-closure-readonly.mjs >/tmp/summary.json
          jq -e '.finalStatus=="PASS" and .stopReasons==[] and .catalogue.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .catalogue.lessons==369 and .catalogue.curricula==11 and .d1.entitlementCount==173 and .lessonsKv.totalKeyCount==381 and .lessonsKv.canonicalExpectedKeyCount==380 and .lessonsKv.canonicalMismatches==0 and .lessonsKv.nonCanonicalKeyCount==1 and .students.userRecordCount==2 and .students.confirmedTestAccountCount==0 and .students.realRecordCount==2 and .students.realFullLibraryAssignmentCount==0 and .resources.totalUniqueRequiredR2ObjectCount==1721 and .resources.missingRequiredObjectCount==0 and .resources.zeroByteRequiredObjectCount==0 and .screenpal.canonicalInteractiveQuizCount==79 and .screenpal.bareIdWithoutExplicitUrlCount==0 and .screenpal.unsafeUrlCount==0 and .screenpal.liveNotFoundCount==0 and .screenpal.liveUnconfirmedCount==0' /tmp/summary.json >/dev/null
          rm -f tests/.phase17-closure-readonly.mjs
          echo 'PHASE17_RESOURCE_AUDIT_PASS required_r2=1721 quizzes=79'

      - name: Final unauthenticated and rollback boundary proof
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' --header 'Content-Type: application/json' --request POST --data '{"username":"__phase17_not_authorised__","password":"Aa1x"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = '401'; jq -e '.error=="INVALID_LOGIN"' /tmp/login.json >/dev/null
          for path in /api/v1/student/home /api/v1/student/session; do
            code="$(curl --silent --show-error --output /tmp/noauth.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE$path")"
            test "$code" = '401'
          done
          printf '%s\n' 'normal_student_login=DISABLED' 'dns_or_production_route_switch=NOT_PERFORMED' 'first_real_teaching_day_sync=NOT_PERFORMED' 'old_live_system_retirement=NOT_PERFORMED' 'rollback_preclean_backup_sha256=fb214cb3abc5802b300cab00ad071e7bfcc459b10bbc1d1177d4efeb126c1a88' 'rollback_real_config_backup_sha256=e610cf71cd03804264739912e277459ef3e83c4a35aa08bb2dc34eca10b26c58' 'rollback_retained_history_backup_sha256=7d45b4ec24b57f92aff61f8f38a522536e57ce0378919d2ad53caa8961524f72'
          echo 'PHASE17_AUTHORITATIVE_FINAL_ACCEPTANCE_PASS'
