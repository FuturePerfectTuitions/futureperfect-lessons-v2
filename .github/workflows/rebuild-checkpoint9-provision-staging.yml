name: Rebuild Checkpoint 9 - Provision Staging

on:
  push:
    branches:
      - rebuild/checkpoint9-production-shaped-staging-2026-09-13
    paths:
      - '.github/workflows/rebuild-checkpoint9-provision-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-v2-rebuild-checkpoint9-provision
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_WORKER: fpt-portal-v2-worker
  STUDENTS_KV_TITLE: FPT_PORTAL_V2_REBUILD_STUDENTS_STAGING
  MATERIALS_R2_BUCKET: fpt-portal-v2-rebuild-materials-staging
  STAGING_D1_NAME: fpt_portal_v2_rebuild_compat_staging

jobs:
  provision-isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm credentials without printing them
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$STUDENTS_KV_TITLE" == *REBUILD*STAGING* ]]
          [[ "$MATERIALS_R2_BUCKET" == *rebuild*staging* ]]
          [[ "$STAGING_D1_NAME" == *rebuild*staging* ]]
      - name: Provision only isolated CP9 stores
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          JSON=(--header 'Content-Type: application/json')
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          BEFORE_DEPLOYMENT=''
          BEFORE_VERSION=''

          cf_call() {
            local label="$1" method="$2" url="$3" body="${4:-}"
            local output="/tmp/${label}.json" code
            if [ -n "$body" ]; then
              code="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --request "$method" "$url" "${AUTH[@]}" "${JSON[@]}" --data "$body")"
            else
              code="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' --request "$method" "$url" "${AUTH[@]}")"
            fi
            echo "${label}:HTTP_${code}"
            if [[ ! "$code" =~ ^2 ]]; then
              jq -c '{success,errors,messages}' "$output" 2>/dev/null || true
              return 1
            fi
          }

          verify_production_anchor() {
            local code after_deployment after_version
            [ -n "$BEFORE_DEPLOYMENT" ] || return 0
            code="$(curl --silent --show-error --output /tmp/prod-after.json --write-out '%{http_code}' "${API}/workers/scripts/${PROD_WORKER}/deployments" "${AUTH[@]}" || true)"
            if [ "$code" != 200 ]; then
              echo "production_anchor_recheck:HTTP_${code}" >&2
              return 1
            fi
            after_deployment="$(jq -r '.result.deployments[0].id // .result[0].id // empty' /tmp/prod-after.json)"
            after_version="$(jq -r '((.result.deployments[0].versions // .result[0].versions // []) | map(select((.percentage // 0) == 100)) | .[0].version_id) // empty' /tmp/prod-after.json)"
            test "$after_deployment" = "$BEFORE_DEPLOYMENT"
            test "$after_version" = "$BEFORE_VERSION"
            echo 'production_anchor:UNCHANGED'
          }
          trap 'verify_production_anchor' EXIT

          cf_call prod-before GET "${API}/workers/scripts/${PROD_WORKER}/deployments"
          BEFORE_DEPLOYMENT="$(jq -r '.result.deployments[0].id // .result[0].id // empty' /tmp/prod-before.json)"
          BEFORE_VERSION="$(jq -r '((.result.deployments[0].versions // .result[0].versions // []) | map(select((.percentage // 0) == 100)) | .[0].version_id) // empty' /tmp/prod-before.json)"
          test -n "$BEFORE_DEPLOYMENT"
          test -n "$BEFORE_VERSION"

          cf_call kv-list GET "${API}/storage/kv/namespaces?per_page=100"
          STUDENTS_KV_ID="$(jq -r --arg title "$STUDENTS_KV_TITLE" '.result[] | select(.title==$title) | .id' /tmp/kv-list.json | head -n1)"
          if [ -z "$STUDENTS_KV_ID" ]; then
            cf_call kv-create POST "${API}/storage/kv/namespaces" "$(jq -nc --arg title "$STUDENTS_KV_TITLE" '{title:$title}')"
            jq -e '.success == true' /tmp/kv-create.json >/dev/null
            STUDENTS_KV_ID="$(jq -r '.result.id' /tmp/kv-create.json)"
          fi
          test -n "$STUDENTS_KV_ID"
          echo 'students_kv:READY'

          cf_call r2-list GET "${API}/r2/buckets?per_page=100"
          R2_EXISTS="$(jq -r --arg name "$MATERIALS_R2_BUCKET" '[.result.buckets[]? | select(.name==$name)] | length' /tmp/r2-list.json)"
          if [ "$R2_EXISTS" = "0" ]; then
            cf_call r2-create POST "${API}/r2/buckets" "$(jq -nc --arg name "$MATERIALS_R2_BUCKET" '{name:$name}')"
            jq -e '.success == true' /tmp/r2-create.json >/dev/null
          fi
          echo 'materials_r2:READY'

          cf_call d1-list GET "${API}/d1/database?per_page=100"
          STAGING_D1_ID="$(jq -r --arg name "$STAGING_D1_NAME" '.result[] | select(.name==$name) | (.uuid // .id // empty)' /tmp/d1-list.json | head -n1)"
          test -n "$STAGING_D1_ID"
          echo 'staging_d1_identity:RESOLVED'
          SQL='CREATE TABLE IF NOT EXISTS answer_password_rate_limits (session_token_hash TEXT PRIMARY KEY, window_started_at INTEGER NOT NULL, attempt_count INTEGER NOT NULL);'
          cf_call d1-create-table POST "${API}/d1/database/${STAGING_D1_ID}/query" "$(jq -nc --arg sql "$SQL" '{sql:$sql}')"
          jq -e '.success == true and ([.result[]?.success] | all(. == true))' /tmp/d1-create-table.json >/dev/null
          cf_call d1-schema POST "${API}/d1/database/${STAGING_D1_ID}/query" "$(jq -nc '{sql:"PRAGMA table_info(answer_password_rate_limits);"}')"
          jq -e '.success == true and ([.result[].results[]?.name] | sort) == (["attempt_count","session_token_hash","window_started_at"] | sort)' /tmp/d1-schema.json >/dev/null
          echo 'staging_d1:READY'

          verify_production_anchor
          trap - EXIT

          jq -n \
            --arg studentsKvId "$STUDENTS_KV_ID" \
            --arg studentsKvTitle "$STUDENTS_KV_TITLE" \
            --arg r2 "$MATERIALS_R2_BUCKET" \
            --arg d1Id "$STAGING_D1_ID" \
            --arg d1Name "$STAGING_D1_NAME" \
            --arg prodDeployment "$BEFORE_DEPLOYMENT" \
            --arg prodVersion "$BEFORE_VERSION" \
            '{checkpoint:9, mode:"isolated-staging-provision", studentsKv:{id:$studentsKvId,title:$studentsKvTitle}, materialsR2:{name:$r2}, d1:{id:$d1Id,name:$d1Name,answerRateLimitTable:true}, productionAnchor:{deploymentId:$prodDeployment,versionId:$prodVersion}, productionChanged:false}' \
            > /tmp/checkpoint9-provision.json
          cat /tmp/checkpoint9-provision.json
      - name: Upload provisioning evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint9-staging-provision
          path: /tmp/checkpoint9-provision.json
          retention-days: 30
