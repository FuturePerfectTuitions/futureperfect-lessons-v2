name: CP12 propagation-aware Browser public promotion
on:
  push:
    branches: [feature/cp12-browser-promotion-2026-09-21]
    paths: ['.github/workflows/cp12-browser-public-promotion-propagation-aware.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp12-browser-public-promotion
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.129.0
  PROD_HOST: lessons.futureperfect.education
  FRONTEND_SHA: 63f37895727e41ada427c9644b41b5a026ed196b
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  BRIDGE_WORKER: fpt-portal-v2-worker
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  EXPECTED_STUDENT_VERSION: 51d725cc-d21e-4aad-9c64-24149c640637
  OLD_BROWSER_VERSION: f8a64bc8-8192-4400-9e45-8f1a1de10019
  CANDIDATE_BROWSER_VERSION: ea701c02-93f7-46e9-9182-59a785dc0bee
  CANDIDATE_PREVIEW_ROOT: https://ea701c02-fpt-portal-v2-rebuild-browser-prod.futureperfectlessons.workers.dev
  EXPECTED_BRIDGE_VERSION: 2ae28100-b4c6-40a3-87e2-42aef86c6fdf
  EXPECTED_QUIZ_VERSION: 80d4942e-616c-4539-91f1-9f2daf05cfc1
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install state verifier and assert exact rollback baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/cp12-state.mjs <<'NODE'
          import fs from 'node:fs';
          const c=v=>String(v??'').trim();
          const account=c(process.env.CLOUDFLARE_ACCOUNT_ID),token=c(process.env.CLOUDFLARE_API_TOKEN),base='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${token}`};
          async function cf(path,opts={}){const r=await fetch(`${base}${path}`,{...opts,headers:{...headers,...(opts.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{};if(!r.ok||j?.success!==true)throw new Error(`CF ${path} ${r.status}: ${t.slice(0,240)}`);return j;}
          function latest(j){const rows=j?.result?.deployments||j?.result||[],d=Array.isArray(rows)?rows[0]:null;return{deploymentId:c(d?.id),versions:(Array.isArray(d?.versions)?d.versions:[]).map(v=>({versionId:c(v?.version_id),percentage:Number(v?.percentage||0)}))};}
          async function deployment(worker){return latest(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/deployments`));}
          const pct=(d,id)=>d.versions.find(v=>v.versionId===id)?.percentage;
          const mode=process.argv[2]||'pre';
          const student=await deployment(process.env.STUDENT_WORKER),browser=await deployment(process.env.BROWSER_WORKER),bridge=await deployment(process.env.BRIDGE_WORKER),quiz=await deployment(process.env.QUIZ_WORKER);
          // During normal CP12 promotion, freeze every non-Browser component to its verified anchor.
          // During emergency rollback, restore/verify the Browser independently so unrelated production drift
          // cannot mask a successful Browser rollback.
          if(mode!=='rollback'){
            if(pct(student,process.env.EXPECTED_STUDENT_VERSION)!==100)throw new Error('Student version moved');
            if(pct(bridge,process.env.EXPECTED_BRIDGE_VERSION)!==100)throw new Error('Bridge version moved');
            if(pct(quiz,process.env.EXPECTED_QUIZ_VERSION)!==100)throw new Error('Quiz version moved');
          }
          if(mode==='pre'&&pct(browser,process.env.OLD_BROWSER_VERSION)!==100)throw new Error(`Pre Browser mismatch ${JSON.stringify(browser.versions)}`);
          if(mode==='split'&&(pct(browser,process.env.OLD_BROWSER_VERSION)!==100||pct(browser,process.env.CANDIDATE_BROWSER_VERSION)!==0))throw new Error(`Split mismatch ${JSON.stringify(browser.versions)}`);
          if(mode==='final'&&pct(browser,process.env.CANDIDATE_BROWSER_VERSION)!==100)throw new Error(`Final Browser mismatch ${JSON.stringify(browser.versions)}`);
          if(mode==='rollback'&&pct(browser,process.env.OLD_BROWSER_VERSION)!==100)throw new Error(`Rollback mismatch ${JSON.stringify(browser.versions)}`);
          const settings=(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(process.env.BROWSER_WORKER)}/settings`)).result||{},bs=Array.isArray(settings.bindings)?settings.bindings:[];
          if(bs.length!==2||!bs.some(b=>c(b.name)==='ASSETS'&&c(b.type)==='assets')||!bs.some(b=>c(b.name)==='STAGING_API'&&c(b.type)==='service'&&c(b.service)===process.env.STUDENT_WORKER))throw new Error('Browser binding drift');
          const host=c(process.env.PROD_HOST).toLowerCase(),zones=(await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`)).result||[],zone=zones.filter(z=>host===c(z.name).toLowerCase()||host.endsWith(`.${c(z.name).toLowerCase()}`)).sort((a,b)=>c(b.name).length-c(a.name).length)[0];if(!zone)throw new Error('zone missing');
          const routes=(await cf(`/zones/${zone.id}/workers/routes`)).result||[],hrs=routes.filter(r=>c(r.pattern).toLowerCase().includes(host));if(hrs.length!==1||c(hrs[0].pattern).toLowerCase()!==`${host}/*`||c(hrs[0].script)!==process.env.BROWSER_WORKER)throw new Error('Browser route drift');
          const q=await cf(`/accounts/${account}/d1/database/${process.env.PORTAL_D1_ID}/query`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sql:'SELECT COUNT(*) AS n FROM quiz_launch_codes'})});const block=Array.isArray(q.result)?q.result[0]:q.result,launchRows=Number(block?.results?.[0]?.n??-1);if(launchRows!==8)throw new Error(`launch rows ${launchRows}`);
          const out={marker:`CP12_PROPAGATION_STATE_${mode.toUpperCase()}_PASS`,student,browser,bridge,quiz,bindings:bs.map(b=>({name:b.name,type:b.type,service:b.service||null})),route:{pattern:hrs[0].pattern,script:hrs[0].script},launchRows};
          fs.writeFileSync(`/tmp/cp12-propagation-state-${mode}.json`,JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE
          node /tmp/cp12-state.mjs pre

      - name: Checkout and rebuild exact accepted frontend
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.FRONTEND_SHA }}
          path: cp12-frontend
          persist-credentials: false

      - name: Reprove candidate byte identity and fail-closed API facade
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C cp12-frontend rev-parse HEAD)" = "$FRONTEND_SHA"
          cd cp12-frontend
          npm install --no-package-lock --no-audit --no-fund
          npm run test:static
          npm run build
          cd "$GITHUB_WORKSPACE"
          LOCAL_JS="$(find cp12-frontend/dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*protected*' | head -n1)"; test -n "$LOCAL_JS"
          curl -fsS -H 'Cache-Control: no-store' "$CANDIDATE_PREVIEW_ROOT/?cp12=${GITHUB_RUN_ID}" -o /tmp/cp12-preview-index.html
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/cp12-preview-index.html|head -n1|sed -E 's/^src="//;s/"$//')"; test -n "$P"
          case "$P" in http*) U="$P";; /*) U="${CANDIDATE_PREVIEW_ROOT}${P}";; *) U="${CANDIDATE_PREVIEW_ROOT}/${P}";; esac
          curl -fsS -H 'Cache-Control: no-store' "${U}?cp12=${GITHUB_RUN_ID}" -o /tmp/cp12-preview-bundle.js
          PREVIEW_SHA="$(sha256sum /tmp/cp12-preview-bundle.js|awk '{print $1}')"
          test "$(sha256sum "$LOCAL_JS"|awk '{print $1}')" = "$PREVIEW_SHA"
          echo "PREVIEW_SHA=$PREVIEW_SHA" >> "$GITHUB_ENV"
          for M in '/api/v2/student/quiz/eligibility' '/api/v2/student/quiz/launch' '11+ Practice' 'quiz.futureperfect.education'; do grep -Fq "$M" /tmp/cp12-preview-bundle.js; done
          CODE="$(curl -sS -H "Origin: https://${PROD_HOST}" -D /tmp/cp12-preview-api.headers -o /tmp/cp12-preview-api.json -w '%{http_code}' "$CANDIDATE_PREVIEW_ROOT/api/v2/student/quiz/eligibility"||true)"; test "$CODE" = 401
          grep -qi '^x-fpt-cp9-browser-facade: service-binding' /tmp/cp12-preview-api.headers
          echo CP12_PROPAGATION_CANDIDATE_IDENTITY_PASS

      - name: Pin Wrangler and exact Browser config
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
          rm -rf rebuild/browser-staging/public && mkdir -p rebuild/browser-staging/public
          cp -a cp12-frontend/dist/. rebuild/browser-staging/public/
          cat > rebuild/browser-staging/wrangler.cp12.toml <<TOML
          name = "${BROWSER_WORKER}"
          main = "src/index.js"
          compatibility_date = "2026-08-20"
          workers_dev = true
          [[services]]
          binding = "STAGING_API"
          service = "${STUDENT_WORKER}"
          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          TOML

      - name: Establish candidate at zero percent and verify control plane
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          npx wrangler versions deploy "${OLD_BROWSER_VERSION}@100%" "${CANDIDATE_BROWSER_VERSION}@0%" --config rebuild/browser-staging/wrangler.cp12.toml -y --message 'CP12 propagation-aware zero-percent smoke' >/tmp/cp12-propagation-split-cli.log 2>&1
          RC=$?
          set -e
          echo "WRANGLER_SPLIT_EXIT=$RC"
          cat /tmp/cp12-propagation-split-cli.log
          sleep 2
          node /tmp/cp12-state.mjs split

      - name: Smoke exact candidate through production hostname override
        shell: bash
        run: |
          set -Eeuo pipefail
          OVERRIDE="Cloudflare-Workers-Version-Overrides: ${BROWSER_WORKER}=\"${CANDIDATE_BROWSER_VERSION}\""
          READY=0
          for i in $(seq 1 20); do
            ROOT="$(curl -sS -H "$OVERRIDE" -H 'Cache-Control: no-store' -o /tmp/cp12-override-index.html -w '%{http_code}' "https://${PROD_HOST}/?cp12=${GITHUB_RUN_ID}-${i}"||true)"
            API="$(curl -sS -H "$OVERRIDE" -H "Origin: https://${PROD_HOST}" -D /tmp/cp12-override-api.headers -o /tmp/cp12-override-api.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/eligibility"||true)"
            if [ "$ROOT" = 200 ] && [ "$API" = 401 ] && grep -qi '^x-fpt-cp9-browser-facade: service-binding' /tmp/cp12-override-api.headers; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/cp12-override-index.html|head -n1|sed -E 's/^src="//;s/"$//')"; test -n "$P"
          case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
          curl -fsS -H "$OVERRIDE" -H 'Cache-Control: no-store' "${U}?cp12=${GITHUB_RUN_ID}" -o /tmp/cp12-override-bundle.js
          test "$(sha256sum /tmp/cp12-override-bundle.js|awk '{print $1}')" = "$PREVIEW_SHA"
          ALLOWED="$(curl -sS -H "$OVERRIDE" -H "Origin: https://${PROD_HOST}" -H 'Content-Type: application/json' -X POST -o /tmp/cp12-override-launch.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch"||true)"; test "$ALLOWED" = 401
          HOSTILE="$(curl -sS -H "$OVERRIDE" -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -o /tmp/cp12-override-hostile.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch"||true)"; test "$HOSTILE" = 403
          echo CP12_PROPAGATION_ZERO_PERCENT_SMOKE_PASS

      - name: Promote candidate and verify 100-percent control-plane state
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          npx wrangler versions deploy "${CANDIDATE_BROWSER_VERSION}@100%" --config rebuild/browser-staging/wrangler.cp12.toml -y --message "CP12 public Quiz surface propagation-aware ${FRONTEND_SHA}" >/tmp/cp12-propagation-promote-cli.log 2>&1
          RC=$?
          set -e
          echo "WRANGLER_PROMOTE_EXIT=$RC"
          cat /tmp/cp12-propagation-promote-cli.log
          sleep 2
          node /tmp/cp12-state.mjs final

      - name: Wait for exact candidate to propagate publicly and verify security
        shell: bash
        run: |
          set -Eeuo pipefail
          MATCH=0
          for i in $(seq 1 60); do
            ROOT_URL="https://${PROD_HOST}/?cp12=${GITHUB_RUN_ID}-public-${i}"
            ROOT="$(curl -sS -H 'Cache-Control: no-store' -o /tmp/cp12-public-index.html -w '%{http_code}' "$ROOT_URL"||true)"
            if [ "$ROOT" = 200 ]; then
              P="$(grep -oE 'src="[^"]+\.js"' /tmp/cp12-public-index.html|head -n1|sed -E 's/^src="//;s/"$//' || true)"
              if [ -n "$P" ]; then
                case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
                if curl -fsS -H 'Cache-Control: no-store' "${U}?cp12=${GITHUB_RUN_ID}-public-${i}" -o /tmp/cp12-public-bundle.js; then
                  GOT="$(sha256sum /tmp/cp12-public-bundle.js|awk '{print $1}')"
                  if [ "$GOT" = "$PREVIEW_SHA" ]; then
                    MATCH=1
                    echo "CP12_PUBLIC_BUNDLE_PROPAGATED attempt=$i sha=$GOT path=$P"
                    break
                  fi
                  echo "Waiting for Browser edge propagation attempt=$i got=$GOT path=$P"
                fi
              fi
            fi
            sleep 2
          done
          test "$MATCH" = 1
          for M in '/api/v2/student/quiz/eligibility' '/api/v2/student/quiz/launch' '11+ Practice' 'quiz.futureperfect.education'; do grep -Fq "$M" /tmp/cp12-public-bundle.js; done
          ELIG="$(curl -sS -H "Origin: https://${PROD_HOST}" -o /tmp/cp12-public-elig.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/eligibility"||true)"; test "$ELIG" = 401
          LAUNCH="$(curl -sS -H "Origin: https://${PROD_HOST}" -H 'Content-Type: application/json' -X POST -o /tmp/cp12-public-launch.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch"||true)"; test "$LAUNCH" = 401
          HOSTILE="$(curl -sS -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -X POST -o /tmp/cp12-public-hostile.json -w '%{http_code}' "https://${PROD_HOST}/api/v2/student/quiz/launch"||true)"; test "$HOSTILE" = 403
          node /tmp/cp12-state.mjs final
          echo CP12_PROPAGATION_PUBLIC_SECURITY_PASS

      - name: Stability recheck after propagation
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 5
          curl -fsS -H 'Cache-Control: no-store' "https://${PROD_HOST}/?cp12=${GITHUB_RUN_ID}-stable" -o /tmp/cp12-stable-index.html
          P="$(grep -oE 'src="[^"]+\.js"' /tmp/cp12-stable-index.html|head -n1|sed -E 's/^src="//;s/"$//')"; test -n "$P"
          case "$P" in http*) U="$P";; /*) U="https://${PROD_HOST}${P}";; *) U="https://${PROD_HOST}/${P}";; esac
          curl -fsS -H 'Cache-Control: no-store' "${U}?cp12=${GITHUB_RUN_ID}-stable" -o /tmp/cp12-stable-bundle.js
          test "$(sha256sum /tmp/cp12-stable-bundle.js|awk '{print $1}')" = "$PREVIEW_SHA"
          node /tmp/cp12-state.mjs final
          jq -n --arg marker CP12_BROWSER_PUBLIC_PROMOTION_PASS --arg frontendSha "$FRONTEND_SHA" --arg browserVersion "$CANDIDATE_BROWSER_VERSION" --arg bundleSha "$PREVIEW_SHA" '{marker:$marker,frontendSha:$frontendSha,browserVersion:$browserVersion,bundleSha256:$bundleSha,zeroPercentSmoke:true,publicPropagationVerified:true,security:{unauthenticatedEligibility:401,unauthenticatedLaunch:401,hostileOriginLaunch:403},stableRecheck:true}' > /tmp/cp12-browser-public-closeout.json
          cat /tmp/cp12-browser-public-closeout.json

      - name: Emergency rollback and verify exact old Browser state
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}" >/dev/null 2>&1 || true
          set +e
          npx wrangler versions deploy "${OLD_BROWSER_VERSION}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 propagation-aware emergency rollback' >/tmp/cp12-propagation-rollback-cli.log 2>&1
          RC=$?
          set -e
          echo "WRANGLER_ROLLBACK_EXIT=$RC"
          cat /tmp/cp12-propagation-rollback-cli.log
          sleep 2
          node /tmp/cp12-state.mjs rollback
          echo CP12_PROPAGATION_ROLLBACK_STATE_VERIFIED_PASS

      - name: Upload propagation-aware promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-browser-propagation-aware-promotion-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/cp12-propagation-state-pre.json
            /tmp/cp12-propagation-state-split.json
            /tmp/cp12-propagation-state-final.json
            /tmp/cp12-propagation-state-rollback.json
            /tmp/cp12-preview-index.html
            /tmp/cp12-preview-bundle.js
            /tmp/cp12-preview-api.headers
            /tmp/cp12-preview-api.json
            /tmp/cp12-propagation-split-cli.log
            /tmp/cp12-propagation-promote-cli.log
            /tmp/cp12-propagation-rollback-cli.log
            /tmp/cp12-override-index.html
            /tmp/cp12-override-bundle.js
            /tmp/cp12-override-api.headers
            /tmp/cp12-override-api.json
            /tmp/cp12-override-launch.json
            /tmp/cp12-override-hostile.json
            /tmp/cp12-public-index.html
            /tmp/cp12-public-bundle.js
            /tmp/cp12-public-elig.json
            /tmp/cp12-public-launch.json
            /tmp/cp12-public-hostile.json
            /tmp/cp12-stable-index.html
            /tmp/cp12-stable-bundle.js
            /tmp/cp12-browser-public-closeout.json