name: CP12 Admin Candidate Preview Diagnostic

on:
  push:
    branches:
      - incident/cp12-admin-principal-2026-09-14
    paths:
      - .github/workflows/cp12-admin-candidate-preview-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_STUDENT: fpt-portal-v2-rebuild-student-prod
  EXPECTED_ACTIVE_VERSION: 0751feed-5aa3-40fb-854f-5847c8603872
  CANDIDATE_VERSION: bed8e660-facb-47f3-afad-7a9996d95c5a
  STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm production rollback is active and candidate still exists
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/workers/scripts/${PROD_STUDENT}/deployments" "${AUTH[@]}" -o /tmp/deployments.json
          ACTIVE="$(jq -r '.result.deployments[0].versions[] | select((.percentage // 0)==100) | .version_id' /tmp/deployments.json | head -n1)"
          test "$ACTIVE" = "$EXPECTED_ACTIVE_VERSION"
          curl --fail --silent --show-error "${API}/workers/scripts/${PROD_STUDENT}/versions?deployable=true" "${AUTH[@]}" -o /tmp/versions.json
          jq -e --arg candidate "$CANDIDATE_VERSION" 'any(.result.items[]; .id==$candidate)' /tmp/versions.json >/dev/null
          jq -n --arg marker 'CP12_ADMIN_CANDIDATE_PREVIEW_PREFLIGHT_PASS' --arg active "$ACTIVE" --arg candidate "$CANDIDATE_VERSION" '{marker:$marker,productionActiveVersion:$active,candidate:$candidate,productionTrafficCandidatePercent:0}' | tee /tmp/candidate-preflight.json
      - name: Authenticated read-path smoke against exact candidate Version Preview URL
        shell: bash
        env:
          SMOKE_BASE_URL: https://bed8e660-fpt-portal-v2-rebuild-student-prod.futureperfectlessons.workers.dev
          SMOKE_ORIGIN: https://lessons.futureperfect.education
          SMOKE_PHASE: exact-version-preview
          EXPECT_ADMIN_STATUS: '200'
          SMOKE_OUTPUT: /tmp/candidate-preview-smoke.json
        run: node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
      - name: Upload safe candidate diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-admin-candidate-preview-diagnostic
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/candidate-preflight.json
            /tmp/candidate-preview-smoke.json
