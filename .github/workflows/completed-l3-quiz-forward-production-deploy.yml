name: Completed L3 quiz forward-only production deploy

on:
  push:
    branches: ['fix/completed-l3-quiz-aar1811-2026-09-28']
    paths: ['.github/workflows/completed-l3-quiz-forward-production-deploy.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run completed L3 regression gate
        run: |
          set -euo pipefail
          node ops/completed-l3-quiz-regression.mjs
      - name: Build exact production composition
        working-directory: worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml --outdir /tmp/completed-l3-prod
          grep -R -q 'MATHS_11PLUS_QUIZ_L3_COMPLETED' /tmp/completed-l3-prod
          grep -R -q 'completed-l3' /tmp/completed-l3-prod
      - name: Deploy forward only
        working-directory: worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify live Worker deployment and bindings
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$api/deployments" -H "$auth" -o /tmp/deployments.json
          jq -e '(.result.deployments // .result // []) | length > 0' /tmp/deployments.json >/dev/null
          curl --fail --silent --show-error "$api/settings" -H "$auth" -o /tmp/settings.json
          jq -e '.result.bindings | map(.name) | index("STUDENTS_KV") != null and index("DB") != null and index("READ_MODELS_KV") != null' /tmp/settings.json >/dev/null
          echo "LIVE_DEPLOYMENT=$(jq -c '(.result.deployments // .result // [])[0] | {id,created_on,versions}' /tmp/deployments.json)"
          echo COMPLETED_L3_FORWARD_PRODUCTION_DEPLOY_PASS
