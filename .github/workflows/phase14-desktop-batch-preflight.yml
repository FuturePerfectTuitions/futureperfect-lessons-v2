name: Phase 14 desktop batch preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-desktop-batch-preflight.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  preflight:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read-only D1 batch inventory for desktop acceptance
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT batch_key, subject, school_year, stream, maths_level, active_from, active_to FROM batch_definitions ORDER BY batch_key; SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; PRAGMA quick_check;" \
            >/tmp/p14-desktop-batches.json 2>/tmp/p14-desktop-batches.err
          echo 'BEGIN_SAFE_BATCH_INVENTORY'
          jq -c '.[0].results' /tmp/p14-desktop-batches.json
          echo 'END_SAFE_BATCH_INVENTORY'
          test "$(jq -r '.[1].results[0].entitlement_count' /tmp/p14-desktop-batches.json)" = '632'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-desktop-batches.json)" = '4'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-desktop-batches.json)" = '0'
          jq -e '.[4].results[0].quick_check == "ok"' /tmp/p14-desktop-batches.json >/dev/null
          echo 'Phase 14 desktop batch preflight: PASS; read-only baseline unchanged.'
