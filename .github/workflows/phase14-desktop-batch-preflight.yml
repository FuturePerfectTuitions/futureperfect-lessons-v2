name: Phase 14 desktop batch and lesson preflight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Frozen read-only preflight
        shell: bash
        run: |
          echo 'FROZEN: this pre-acceptance baseline check expected 632 entitlements / 4 assignments / 0 releases.'
          echo 'Superseded after controlled Phase 14 desktop fixtures and successful workbook sync tests.'
          echo 'Do not rerun as current-state acceptance evidence.'
