name: Temporary empty PreLesson verification
on:
  push:
    branches: [prelesson-empty-navigation-20260907]
    paths:
      - '.github/workflows/tmp-prelesson-empty-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prelesson-empty-navigation-20260907
      - name: Verify Change 10 and UI
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change10.js
          node --check assets/phase7.js
          node tests/prelesson-empty-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
