name: Post-Step-10 family depth inventory v2

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - '.github/workflows/post-step10-family-depth-inventory-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Build corrected read-only family inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-family-depth-v2"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          q(){ npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "$1" --json; }
          q "WITH qi AS (SELECT family_id,COUNT(*) AS live_count,SUM(CASE WHEN UPPER(difficulty_band)='STANDARD' THEN 1 ELSE 0 END) AS standard_count,SUM(CASE WHEN UPPER(difficulty_band)='FOUNDATION' THEN 1 ELSE 0 END) AS foundation_count,SUM(CASE WHEN UPPER(difficulty_band)='CORE' THEN 1 ELSE 0 END) AS core_count,SUM(CASE WHEN UPPER(difficulty_band)='CHALLENGE' THEN 1 ELSE 0 END) AS challenge_count,COUNT(DISTINCT presentation_type) AS presentation_type_count,SUM(CASE WHEN UPPER(COALESCE(diagram_type,'')) NOT IN ('','NONE','NO','N/A','NA','NONE/TEXT') THEN 1 ELSE 0 END) AS visual_count,COUNT(DISTINCT CASE WHEN UPPER(COALESCE(diagram_type,'')) NOT IN ('','NONE','NO','N/A','NA','NONE/TEXT') THEN diagram_type END) AS visual_type_count FROM question_instance WHERE lifecycle_status='Live' GROUP BY family_id),ev AS (SELECT family_id,COUNT(DISTINCT golden_source_id) AS evidence_source_count FROM gl_evidence_link WHERE family_id IS NOT NULL GROUP BY family_id) SELECT qf.family_id,qf.topic,qf.family_name,qf.primary_skill_id,qf.source_count,qf.earliest_release_point,qf.question_level_override_needed,CASE WHEN qf.generator_rules_json IS NOT NULL AND LENGTH(TRIM(qf.generator_rules_json))>2 THEN 1 ELSE 0 END AS generator_rules_present,CASE WHEN qf.gl_method_signature IS NOT NULL AND LENGTH(TRIM(qf.gl_method_signature))>0 THEN 1 ELSE 0 END AS gl_method_signature_present,COALESCE(qi.live_count,0) AS live_count,COALESCE(qi.standard_count,0) AS standard_count,COALESCE(qi.foundation_count,0) AS foundation_count,COALESCE(qi.core_count,0) AS core_count,COALESCE(qi.challenge_count,0) AS challenge_count,COALESCE(qi.presentation_type_count,0) AS presentation_type_count,COALESCE(qi.visual_count,0) AS visual_count,COALESCE(qi.visual_type_count,0) AS visual_type_count,COALESCE(ev.evidence_source_count,0) AS evidence_source_count FROM question_family qf LEFT JOIN qi ON qi.family_id=qf.family_id LEFT JOIN ev ON ev.family_id=qf.family_id WHERE qf.family_wide_eligible=1 AND qf.status='ELIGIBLE' AND qf.evidence_gate_status='PASS' ORDER BY live_count ASC,qf.family_id;" >/tmp/families.json
          q "SELECT corpus_series,COUNT(*) AS source_question_count FROM gl_source_question GROUP BY corpus_series ORDER BY source_question_count DESC,corpus_series;" >/tmp/source_series.json
          q "SELECT e.family_id,s.corpus_series,COUNT(DISTINCT e.golden_source_id) AS linked_source_count FROM gl_evidence_link e JOIN gl_source_question s ON s.golden_source_id=e.golden_source_id JOIN question_family qf ON qf.family_id=e.family_id WHERE e.family_id IS NOT NULL AND qf.family_wide_eligible=1 AND qf.status='ELIGIBLE' AND qf.evidence_gate_status='PASS' GROUP BY e.family_id,s.corpus_series ORDER BY e.family_id,s.corpus_series;" >/tmp/family_series.json
          python3 - <<'PY'
          import json,csv
          from pathlib import Path
          def rows(p): return json.loads(Path(p).read_text())[0]['results']
          fam=rows('/tmp/families.json'); series=rows('/tmp/source_series.json'); fs=rows('/tmp/family_series.json')
          assert len(fam)==91 and sum(int(r['live_count']) for r in fam)==714
          by={r['family_id']:{} for r in fam}
          for r in fs: by[r['family_id']][r['corpus_series']]=int(r['linked_source_count'])
          names=[r['corpus_series'] for r in series]
          fields=list(fam[0].keys())+[f'series::{n}' for n in names]
          with open('/tmp/post_step10_family_depth_inventory_v2.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for r in fam:
                  out=dict(r)
                  for n in names: out[f'series::{n}']=by[r['family_id']].get(n,0)
                  w.writerow(out)
          summary={'marker':'POST_STEP10_FAMILY_DEPTH_INVENTORY_V2_PASS','eligible_families':91,'live_questions':714,'standard_questions':sum(int(r['standard_count']) for r in fam),'visual_questions':sum(int(r['visual_count']) for r in fam),'text_nonvisual_questions':sum(int(r['live_count'])-int(r['visual_count']) for r in fam),'min_live':min(int(r['live_count']) for r in fam),'median_live':sorted(int(r['live_count']) for r in fam)[45],'max_live':max(int(r['live_count']) for r in fam),'under_8':sum(int(r['live_count'])<8 for r in fam),'under_10':sum(int(r['live_count'])<10 for r in fam),'source_series':series}
          Path('/tmp/post_step10_family_depth_summary_v2.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-family-depth-inventory-v2
          path: |
            /tmp/post_step10_family_depth_inventory_v2.csv
            /tmp/post_step10_family_depth_summary_v2.json
          retention-days: 90
