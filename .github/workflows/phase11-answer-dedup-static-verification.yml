name: Phase 11 Answer Pack dedup static verification

on:
  pull_request:
    branches: [main]
    paths:
      - worker/src/phase11-resources.js
      - tests/phase11-answer-dedup-static-verification.mjs
      - .github/workflows/phase11-answer-dedup-static-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify paired Answer Packs cannot reappear as supplementary resources
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/phase11-resources.js
          node --experimental-default-type=module tests/phase11-answer-dedup-static-verification.mjs
