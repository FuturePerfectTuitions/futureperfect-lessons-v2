name: Phase 11 final adapter static verification

on:
  pull_request:
    branches: [main]
    paths:
      - worker/src/index-phase11-final.js
      - worker/src/phase11-other-resources.js
      - worker/src/phase11-navigation-cache.js
      - worker/src/phase11-navigation-manifest.generated.js
      - scripts/phase11-navigation-manifest.mjs
      - scripts/phase11-apply-package.mjs
      - docs/data/phase11/catalogue_payload/**
      - assets/phase11-other.js
      - tests/phase11-other-static-verification.mjs
      - tests/phase11-navigation-cache-static-verification.mjs
      - .github/workflows/phase11-final-static-verification.yml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Phase 11 final adapter remains safe through later progression
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase11-final.js
          node --check worker/src/phase11-other-resources.js
          node --check worker/src/phase11-navigation-cache.js
          node --check scripts/phase11-navigation-manifest.mjs
          node --check assets/phase11-other.js
          node --experimental-default-type=module tests/phase11-other-static-verification.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          grep -Eq '^main = "src/(index-phase10-history|index-phase12)\.js"$' worker/wrangler.toml
          ! grep -Fq 'assets/phase11-other.js' phase10.html
          grep -Fq "import phase11ResourcesWorker from './index-phase11-resources.js';" worker/src/index-phase11-final.js
          grep -Fq "phase11NavigationEnv" worker/src/index-phase11-final.js
          grep -Fq "p11elevenother" worker/src/index-phase11-final.js
          grep -Fq "PHASE11_NAVIGATION_MANIFEST" worker/src/phase11-navigation-cache.js
          grep -Fq "BUNDLED_MANIFEST_VALID" worker/src/phase11-navigation-cache.js
          grep -Fq "Home navigation must use zero LESSONS_KV gets." tests/phase11-navigation-cache-static-verification.mjs
          echo 'Phase 11 final adapter static verification: PASS'
