name: CP12 admin Answer Pack credential shape read-only

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths: ['.github/workflows/cp12-admin-answer-credential-shape-readonly.yml']

permissions:
  contents: read

env:
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read production admin credential shape only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          curl --fail --silent --show-error "${API}/storage/kv/namespaces/${EXPECTED_STUDENTS_KV}/values/user%3Aadmin" "${AUTH[@]}" -o /tmp/admin.json
          jq -e 'type=="object"' /tmp/admin.json >/dev/null
          LOGIN="$(jq -r '.p // empty' /tmp/admin.json)"
          ANSWER="$(jq -r '.answerPassword // .answer_password // .answerPackPassword // .answer_pack_password // .ap // empty' /tmp/admin.json)"
          FIRST="$(jq -r '.firstName // .name // empty' /tmp/admin.json)"
          test -n "$LOGIN"; test -n "$ANSWER"; test -n "$FIRST"
          echo "::add-mask::$LOGIN"; echo "::add-mask::$ANSWER"; echo "::add-mask::$FIRST"
          valid4(){ local value="$1"; [ "${#value}" -eq 4 ] && [[ "$value" =~ [A-Z] ]] && [[ "$value" =~ [a-z] ]] && [[ "$value" =~ [0-9] ]]; }
          valid4 "$LOGIN"
          valid4 "$ANSWER"
          jq -n '{marker:"CP12_ADMIN_CREDENTIAL_SHAPE_READONLY_PASS",status:"PASS",readOnly:true,loginPasswordValid:true,answerPasswordValid:true,firstNamePresent:true,valuesDisclosed:false,productionMutation:false}' | tee /tmp/cp12-admin-credential-shape.json
          rm -f /tmp/admin.json
      - name: Upload safe evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-admin-credential-shape-readonly
          path: /tmp/cp12-admin-credential-shape.json
          if-no-files-found: error
          retention-days: 30
