name: Cumulative Homework live catalogue audit

on:
  push:
    branches:
      - ops/cumulative-homework-audit-20260908
    paths:
      - .github/workflows/cumulative-homework-audit.yml
      - ops/cumulative-homework-audit.trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v6

      - name: Confirm Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve live bindings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cumulative-audit
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            > cumulative-audit/worker-settings.json
          jq -e '.success == true' cumulative-audit/worker-settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id // empty' cumulative-audit/worker-settings.json)"
          MATERIALS_R2_BUCKET="$(jq -r '.result.bindings[] | select(.name=="MATERIALS_R2") | .bucket_name // empty' cumulative-audit/worker-settings.json)"
          test -n "$LESSONS_KV_ID"
          test -n "$MATERIALS_R2_BUCKET"
          printf '%s' "$LESSONS_KV_ID" > cumulative-audit/lessons-kv-id.txt
          printf '%s' "$MATERIALS_R2_BUCKET" > cumulative-audit/r2-bucket.txt
          echo "Resolved live LESSONS_KV and MATERIALS_R2 bindings."

      - name: Snapshot every live lesson record
        shell: bash
        run: |
          set -euo pipefail
          NS="$(cat cumulative-audit/lessons-kv-id.txt)"
          printf '[]' > cumulative-audit/lesson-keys.json
          cursor=''
          while :; do
            url="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/keys?limit=1000&prefix=lesson%3A"
            if [ -n "$cursor" ]; then
              encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${encoded}"
            fi
            page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success == true' <<<"$page" >/dev/null
            jq '[.result[]? | .name]' <<<"$page" > cumulative-audit/page-keys.json
            jq -s '.[0] + .[1]' cumulative-audit/lesson-keys.json cumulative-audit/page-keys.json > cumulative-audit/next.json
            mv cumulative-audit/next.json cumulative-audit/lesson-keys.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          jq -r '.[]' cumulative-audit/lesson-keys.json | LC_ALL=C sort -u > cumulative-audit/lesson-keys.txt
          : > cumulative-audit/live-lessons.ndjson
          while IFS= read -r key; do
            encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            value="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${encoded}")"
            jq -cn --arg key "$key" --argjson record "$value" '{kvKey:$key,record:$record}' >> cumulative-audit/live-lessons.ndjson
          done < cumulative-audit/lesson-keys.txt
          echo "Live lesson records: $(wc -l < cumulative-audit/live-lessons.ndjson | tr -d ' ')"

      - name: Snapshot live R2 object keys
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="$(cat cumulative-audit/r2-bucket.txt)"
          printf '[]' > cumulative-audit/r2-objects.json
          cursor=''
          while :; do
            url="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then
              encoded="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${encoded}"
            fi
            page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success == true' <<<"$page" >/dev/null
            jq '[.result[]? | {key,size,etag,last_modified}]' <<<"$page" > cumulative-audit/page-r2.json
            jq -s '.[0] + .[1]' cumulative-audit/r2-objects.json cumulative-audit/page-r2.json > cumulative-audit/next.json
            mv cumulative-audit/next.json cumulative-audit/r2-objects.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          echo "Live R2 objects: $(jq 'length' cumulative-audit/r2-objects.json)"

      - name: Audit Cumulative Homework classifications and primary files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import PurePosixPath

          root='cumulative-audit'
          rows=[json.loads(line) for line in open(f'{root}/live-lessons.ndjson', encoding='utf-8') if line.strip()]
          r2=json.load(open(f'{root}/r2-objects.json', encoding='utf-8'))
          r2keys=sorted({x.get('key','') for x in r2 if x.get('key')})

          def arr(v): return v if isinstance(v,list) else []
          def obj(v): return v if isinstance(v,dict) else {}
          def label(v):
              if not isinstance(v,dict): return ''
              return str(v.get('displayName') or v.get('name') or v.get('r2Key') or v.get('r2') or '')
          def r2key(v):
              if not isinstance(v,dict): return ''
              return str(v.get('r2Key') or v.get('r2') or '')
          def primary(pair):
              if not isinstance(pair,dict): return None
              for k in ('homework','sheet','primary'):
                  if isinstance(pair.get(k),dict): return pair[k]
              return None
          def answer(pair):
              if not isinstance(pair,dict): return None
              for k in ('answerPack','answerKey','answer'):
                  if isinstance(pair.get(k),dict): return pair[k]
              return None
          def is_cumulative_text(s):
              s=str(s or '').lower()
              return 'cumulative' in s or re.search(r'\bcum\b', s) is not None
          def all_r2_refs(v, out):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k in ('r2Key','r2') and isinstance(x,str) and x.strip(): out.add(x.strip())
                      else: all_r2_refs(x,out)
              elif isinstance(v,list):
                  for x in v: all_r2_refs(x,out)

          allrefs=set()
          for row in rows: all_r2_refs(row.get('record'),allrefs)

          current_pairs=[]
          missing_primary=[]
          supplemental_cum=[]
          all_supp=[]
          for row in rows:
              rec=obj(row.get('record'))
              lesson=rec.get('lessonId') or row['kvKey'].split(':',1)[-1]
              p11=obj(rec.get('phase11Resources'))
              core=obj(p11.get('core'))
              ep=obj(p11.get('elevenPlus'))
              for stream, pairs in (
                  ('core', arr(core.get('cumulativeHomeworks'))),
                  ('elevenPlus', arr(ep.get('cumulativeHomeworks'))),
              ):
                  for i,pair in enumerate(pairs,1):
                      p=primary(pair); a=answer(pair)
                      item={'lessonId':lesson,'stream':stream,'index':i,
                            'primaryName':label(p),'primaryR2':r2key(p),
                            'answerName':label(a),'answerR2':r2key(a)}
                      current_pairs.append(item)
                      if a and not r2key(p): missing_primary.append(item)
              for stream, answers in (
                  ('core', arr(core.get('supplementaryAnswers'))),
                  ('elevenPlus', arr(ep.get('supplementaryAnswers'))),
              ):
                  for i,a in enumerate(answers,1):
                      if not isinstance(a,dict): continue
                      item={'lessonId':lesson,'stream':stream,'index':i,'answerName':label(a),'answerR2':r2key(a)}
                      all_supp.append(item)
                      if is_cumulative_text(label(a)) or is_cumulative_text(r2key(a)):
                          supplemental_cum.append(item)

          def lesson_prefix_from_key(key):
              if not key: return ''
              m=re.match(r'^(.*?/(?:Y\d+[ME]\d+|L\d+[^/]*?))(?:/|$)', key, flags=re.I)
              if m: return m.group(1).rstrip('/') + '/'
              parts=key.split('/')
              for i,p in enumerate(parts):
                  if re.fullmatch(r'(?:Y\d+[ME]\d+|L\d+T\d+[ME]\d+)',p,re.I):
                      return '/'.join(parts[:i+1])+'/'
              return ''

          far_keys=[k for k in r2keys if PurePosixPath(k).name.upper().startswith('FAR')]
          cum_named_keys=[k for k in r2keys if is_cumulative_text(PurePosixPath(k).name)]
          cumulativeish=sorted(set(far_keys+cum_named_keys))
          unreferenced=[k for k in cumulativeish if k not in allrefs]

          candidates=[]
          for item in supplemental_cum:
              ak=item['answerR2']
              prefix=lesson_prefix_from_key(ak)
              # Prefer same lesson directory. Exclude protected answers and current answer itself.
              c=[]
              for k in r2keys:
                  if prefix and not k.startswith(prefix): continue
                  base=PurePosixPath(k).name.lower()
                  if k==ak or 'answer' in base: continue
                  if k in allrefs: continue
                  if base.startswith('far') or is_cumulative_text(base): c.append(k)
              candidates.append({**item,'lessonPrefix':prefix,'unreferencedPrimaryCandidates':c})

          # Also inspect missing-primary cumulative pairs in the same way.
          missing_candidates=[]
          for item in missing_primary:
              ak=item['answerR2']
              prefix=lesson_prefix_from_key(ak)
              c=[]
              for k in r2keys:
                  if prefix and not k.startswith(prefix): continue
                  base=PurePosixPath(k).name.lower()
                  if k==ak or 'answer' in base or k in allrefs: continue
                  if base.startswith('far') or is_cumulative_text(base): c.append(k)
              missing_candidates.append({**item,'lessonPrefix':prefix,'unreferencedPrimaryCandidates':c})

          report={
            'liveLessonCount':len(rows),
            'liveR2ObjectCount':len(r2keys),
            'currentCumulativePairCount':len(current_pairs),
            'cumulativePairsMissingPrimaryCount':len(missing_primary),
            'supplementaryCumulativeAnswerCount':len(supplemental_cum),
            'farR2ObjectCount':len(far_keys),
            'cumulativeNamedR2ObjectCount':len(cum_named_keys),
            'cumulativeLikeUnreferencedR2Count':len(unreferenced),
            'currentCumulativePairs':current_pairs,
            'missingPrimaryPairs':missing_primary,
            'supplementaryCumulativeAnswers':supplemental_cum,
            'supplementaryCumulativeCandidates':candidates,
            'missingPrimaryCandidates':missing_candidates,
            'unreferencedCumulativeLikeR2Keys':unreferenced,
            'allFarR2Keys':far_keys,
          }
          json.dump(report,open(f'{root}/cumulative-audit-report.json','w',encoding='utf-8'),indent=2)

          print('=== CUMULATIVE HOMEWORK LIVE AUDIT SUMMARY ===')
          for k in ('liveLessonCount','liveR2ObjectCount','currentCumulativePairCount','cumulativePairsMissingPrimaryCount','supplementaryCumulativeAnswerCount','farR2ObjectCount','cumulativeNamedR2ObjectCount','cumulativeLikeUnreferencedR2Count'):
              print(f'{k}: {report[k]}')
          print('\n=== SUPPLEMENTARY CUMULATIVE ANSWERS AND PRIMARY CANDIDATES ===')
          print(json.dumps(candidates,indent=2))
          print('\n=== EXISTING CUMULATIVE PAIRS MISSING PRIMARY AND CANDIDATES ===')
          print(json.dumps(missing_candidates,indent=2))
          print('\n=== UNREFERENCED CUMULATIVE/FAR R2 KEYS ===')
          print(json.dumps(unreferenced,indent=2))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-homework-live-audit
          path: cumulative-audit/
          retention-days: 7
