name: Rename AdminTrial Portal IDs to Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-admintrial-users.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only locate AdminTrial identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee /tmp/admintrial-diagnostic.txt
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '');
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const workerName = String(process.env.WORKER_NAME || 'fpt-portal-v2-worker');
          const api = 'https://api.cloudflare.com/client/v4';
          async function cf(pathname) {
            const r = await fetch(`${api}${pathname}`, { headers: { Authorization: `Bearer ${token}` } });
            const b = await r.json().catch(() => null);
            if (!r.ok || !b?.success) throw new Error(`CF_READ_FAILED ${pathname} HTTP=${r.status} errors=${JSON.stringify(b?.errors || [])}`);
            return b;
          }
          const settings = await cf(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const bindings = settings?.result?.bindings || [];
          console.log('BINDINGS=' + bindings.map(x => `${x.name}:${x.type}`).join(','));
          const students = String(bindings.find(x => x?.name === 'STUDENTS_KV' && x?.type === 'kv_namespace')?.namespace_id || '');
          const db = bindings.find(x => x?.name === 'DB');
          console.log(`STUDENTS_BOUND=${Boolean(students)} DB_TYPE=${String(db?.type || '')} DB_ID_FIELD=${Boolean(db?.id)} DB_DATABASE_ID_FIELD=${Boolean(db?.database_id)}`);
          if (!students) throw new Error('STUDENTS_KV_NOT_FOUND');
          let cursor = '';
          const names = [];
          do {
            const q = new URLSearchParams({ limit: '1000' });
            if (cursor) q.set('cursor', cursor);
            const page = await cf(`/accounts/${accountId}/storage/kv/namespaces/${students}/keys?${q.toString()}`);
            for (const x of page.result || []) names.push(String(x?.name || ''));
            cursor = String(page?.result_info?.cursor || '');
          } while (cursor);
          const matches = names.filter(x => x.toLowerCase().includes('admintrial'));
          console.log(`KV_TOTAL_KEYS=${names.length}`);
          console.log(`ADMINTRIAL_MATCH_COUNT=${matches.length}`);
          console.log('ADMINTRIAL_KEYS=' + matches.join(','));
          const prefixes = [...new Set(names.filter(x => x.includes(':')).map(x => x.split(':')[0]))].sort();
          console.log('KV_PREFIXES=' + prefixes.join(','));
          NODE
      - name: Upload safe diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admintrial-diagnostic
          path: /tmp/admintrial-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
