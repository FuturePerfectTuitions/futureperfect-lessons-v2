name: Rename AdminTrial Portal IDs to Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-admintrial-users.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read identity-safe KV metadata only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' 2>&1 | tee /tmp/admintrial-kv-read-diagnostic.txt
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'');
          const accountId=String(process.env.CLOUDFLARE_ACCOUNT_ID||'');
          const workerName=String(process.env.WORKER_NAME||'fpt-portal-v2-worker');
          const api='https://api.cloudflare.com/client/v4';
          async function envelope(path){const r=await fetch(`${api}${path}`,{headers:{Authorization:`Bearer ${token}`}});const b=await r.json().catch(()=>null);if(!r.ok||!b?.success)throw new Error(`Envelope read failed HTTP=${r.status}`);return b;}
          const settings=await envelope(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const ns=String((settings?.result?.bindings||[]).find(x=>x?.name==='STUDENTS_KV'&&x?.type==='kv_namespace')?.namespace_id||'');
          if(!ns) throw new Error('STUDENTS_KV unavailable');
          for(const suffix of ['2','3','4','411','5','511','6']){
            const key=`user:admintrial${suffix}`;
            const r=await fetch(`${api}/accounts/${accountId}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers:{Authorization:`Bearer ${token}`}});
            const raw=await r.text();
            if(!r.ok) throw new Error(`Direct KV read failed ${key} HTTP=${r.status}`);
            let obj; try{obj=JSON.parse(raw)}catch{throw new Error(`Record is not JSON: ${key}`)}
            console.log(`${key} portalUserId=${String(obj?.portalUserId||'')} fields=${Object.keys(obj).sort().join(',')}`);
          }
          NODE
      - name: Upload safe KV read diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admintrial-kv-read-diagnostic
          path: /tmp/admintrial-kv-read-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
