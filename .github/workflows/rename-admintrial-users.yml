name: Rename AdminTrial Portal IDs to Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-admintrial-users.yml'

permissions:
  contents: read

jobs:
  stage-demo-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create exact Demo copies with only portalUserId renamed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const api='https://api.cloudflare.com/client/v4';
          const ids=['2','3','4','411','5','511','6'];
          const settings=await fetch(`${api}/accounts/${account}/workers/scripts/${process.env.WORKER_NAME}/settings`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
          if(!settings?.success) throw new Error('Could not read production settings');
          const ns=(settings.result.bindings||[]).find(x=>x.name==='STUDENTS_KV'&&x.type==='kv_namespace')?.namespace_id;
          if(!ns) throw new Error('STUDENTS_KV missing');
          async function read(key){const r=await fetch(`${api}/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers:{Authorization:`Bearer ${token}`}});if(r.status===404)return null;if(!r.ok)throw new Error(`Read failed ${key}`);return r.text();}
          async function write(key,value){const r=await fetch(`${api}/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:value});const j=await r.json();if(!r.ok||!j?.success)throw new Error(`Write failed ${key}`);}
          for(const n of ids){
            const oldKey=`user:admintrial${n}`, newKey=`user:demo${n}`;
            const oldRaw=await read(oldKey); if(!oldRaw) throw new Error(`Missing ${oldKey}`);
            if(await read(newKey)) throw new Error(`Target already exists ${newKey}`);
            const before=JSON.parse(oldRaw); if(before.portalUserId!==`AdminTrial${n}`) throw new Error(`ID mismatch ${oldKey}`);
            const after=structuredClone(before); after.portalUserId=`Demo${n}`;
            await write(newKey,JSON.stringify(after));
            const check=JSON.parse(await read(newKey));
            const a=structuredClone(before),b=structuredClone(check); delete a.portalUserId; delete b.portalUserId;
            if(check.portalUserId!==`Demo${n}`||JSON.stringify(a)!==JSON.stringify(b)) throw new Error(`Parity failed ${newKey}`);
          }
          console.log('DEMO_KV_STAGE_PASS accounts=7');
          NODE
