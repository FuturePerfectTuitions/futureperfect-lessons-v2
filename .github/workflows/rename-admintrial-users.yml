name: Rename AdminTrial Portal IDs to Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-admintrial-users.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only D1 identity reference counts
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT 'lesson_entitlements' AS table_name, COUNT(*) AS old_rows FROM lesson_entitlements WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'student_sessions', COUNT(*) FROM student_sessions WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'curriculum_start_points', COUNT(*) FROM curriculum_start_points WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'answer_view_tokens', COUNT(*) FROM answer_view_tokens WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'mock_password_rate_limits', COUNT(*) FROM mock_password_rate_limits WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'student_session_profiles', COUNT(*) FROM student_session_profiles WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'student_batch_assignments', COUNT(*) FROM student_batch_assignments WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'online_prelesson_entitlements', COUNT(*) FROM online_prelesson_entitlements WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'trial_login_consumptions', COUNT(*) FROM trial_login_consumptions WHERE portal_user_id_norm LIKE 'admintrial%'
          UNION ALL SELECT 'student_session_windows', COUNT(*) FROM student_session_windows WHERE portal_user_id_norm LIKE 'admintrial%';"
          npx --yes wrangler@4.125.0 d1 execute fpt_portal_v2_db --remote --command "$SQL" --json | tee /tmp/admintrial-d1-counts.json
      - name: Upload D1 counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admintrial-d1-counts
          path: /tmp/admintrial-d1-counts.json
          if-no-files-found: error
          retention-days: 1
