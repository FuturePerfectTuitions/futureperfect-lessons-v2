name: Lesson description review index

on:
  push:
    branches: [main]
    paths: ['.github/workflows/lesson-description-index.yml']

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build compact review index
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const dir='ops/live-descriptions';
          const rows=[];
          for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort()){
            const group=file.replace('.json','');
            const data=JSON.parse(fs.readFileSync(`${dir}/${file}`,'utf8'));
            for(const x of data.lessons){
              const d=String(x.description||'');
              rows.push({group,lessonId:x.lessonId,order:x.order,title:x.title,chars:d.length,words:d.trim()?d.trim().split(/\s+/).length:0,hasVideo:!!x.hasVideo,active:x.active!==false});
            }
          }
          fs.writeFileSync('ops/live-description-index.json',JSON.stringify(rows,null,2));
          fs.writeFileSync('ops/live-description-index.tsv',['group\tlessonId\torder\ttitle\tchars\twords\thasVideo\tactive',...rows.map(r=>[r.group,r.lessonId,r.order,r.title.replace(/\t/g,' '),r.chars,r.words,r.hasVideo,r.active].join('\t'))].join('\n')+'\n');
          console.log(`INDEX_ROWS=${rows.length}`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/live-description-index.json ops/live-description-index.tsv
          git commit -m 'Update live lesson description review index'
          git push
