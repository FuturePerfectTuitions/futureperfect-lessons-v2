name: Incident - Semantic Entitlement Audit Quick

on:
  push:
    branches:
      - incident/entitlement-audit-2026-09-15
    paths:
      - .github/workflows/incident-entitlement-semantic-quick.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LEGACY_WORKER: fpt-portal-v2-worker
  AS_OF_DATE: '2026-09-15'
  TARGET_USER: dha2806
  TARGET_LESSON: Y4T1EE01

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only semantic entitlement audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/incident-entitlement-semantic-audit-v2.mjs
          set +e
          node scripts/incident-entitlement-semantic-audit-v2.mjs | tee /tmp/semantic-audit-console.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          test -s /tmp/entitlement-semantic-audit.json
          test -s /tmp/dha2806-trace.json
          echo "semantic_audit_exit_code=$code"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entitlement-semantic-audit-quick
          path: |
            /tmp/entitlement-semantic-audit.json
            /tmp/dha2806-trace.json
            /tmp/semantic-audit-console.log
          if-no-files-found: error
          retention-days: 30
