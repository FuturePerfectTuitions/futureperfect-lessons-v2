name: CP12 approved V2 UI production preflight

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths: ['.github/workflows/cp12-approved-v2-ui-production-preflight.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: cp12-approved-v2-ui-production-preflight
  cancel-in-progress: false

env:
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_DB: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev
  EXPECTED_STUDENT_VERSION: bed8e660-facb-47f3-afad-7a9996d95c5a
  EXPECTED_STUDENT_ROLLBACK: 0751feed-5aa3-40fb-854f-5847c8603872
  EXPECTED_BROWSER_VERSION: 412d5dd1-8f36-4e84-b5b6-eba39c670820
  EXPECTED_LEGACY_VERSION: b1c8326e-a9cc-4150-b43b-cc572a4404c1
  OFFICIAL_CP12_SHA: b5e38b3768d269f632bbf4fc95e7d3f2a3fb3ba2
  METADATA_COMMIT: 9793028e34b16972defa64d3e465db907868e645
  CANDIDATE_FRONTEND_SHA: 598ec347ffddb126889f95d6a7753539e0ed3c97
  STAGING_UAT_RUN_ID: '34931616127'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze official CP12 and exact validated backend source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin rebuild/checkpoint12-stabilisation-2026-09-14
          test "$(git rev-parse origin/rebuild/checkpoint12-stabilisation-2026-09-14)" = "$OFFICIAL_CP12_SHA"
          git merge-base --is-ancestor "$OFFICIAL_CP12_SHA" HEAD
          paths=(rebuild/adminops/src/lib/compiler.mjs rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/student/src/lib/runtime.mjs tests/rebuild-cp12-resource-presentation-groups.mjs)
          for path in "${paths[@]}"; do
            test "$(git rev-parse "${METADATA_COMMIT}:${path}")" = "$(git hash-object "$path")"
          done
          RUNTIME_DIFF="$(git diff --name-only "$OFFICIAL_CP12_SHA"...HEAD -- rebuild/adminops/src/lib/compiler.mjs rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/student/src/lib/runtime.mjs | sort)"
          test "$RUNTIME_DIFF" = $'rebuild/adminops/src/lib/compiler.mjs\nrebuild/shared/read-models/phase11-extension-resources.mjs\nrebuild/student/src/lib/runtime.mjs'
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          echo CP12_APPROVED_V2_UI_EXACT_BACKEND_SOURCE_PASS

      - name: Require exact successful staging browser UAT
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${STAGING_UAT_RUN_ID}" -o /tmp/staging-uat.json
          jq -e --arg sha '152614f37e8f3ce659ce9d51170962545d3d7e38' '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .path==".github/workflows/cp12-approved-v2-ui-browser-uat-retry.yml"' /tmp/staging-uat.json >/dev/null
          echo CP12_APPROVED_V2_UI_STAGING_UAT_AUTHORITY_PASS

      - name: Checkout exact staging-proven frontend
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.CANDIDATE_FRONTEND_SHA }}
          path: candidate-frontend
          persist-credentials: false

      - name: Build exact frontend and rerun source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate-frontend rev-parse HEAD)" = "$CANDIDATE_FRONTEND_SHA"
          cd candidate-frontend
          npm install --no-audit --no-fund
          npm run test:static
          node tests/cp12-collapsible-resource-sections-static.mjs
          node tests/cp12-approved-v2-ui-parity-static.mjs
          npm run build
          grep -R -F 'Verbal Reasoning' dist >/dev/null
          grep -R -F 'data-resource-toggle' dist >/dev/null
          grep -R -F "'s Portal" dist >/dev/null
          ! grep -R -F 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev' dist
          echo CP12_APPROVED_V2_UI_FRONTEND_SOURCE_PASS

      - name: Fresh production topology versions bindings and rollback baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}" "${AUTH[@]}" -o /tmp/zones.json
          ZONE_ID="$(jq -r '.result[]|select(.name=="futureperfect.education")|.id' /tmp/zones.json | head -n1)"; test -n "$ZONE_ID"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes.json >/dev/null
          for worker in "$LEGACY_WORKER" "$BROWSER_WORKER" "$STUDENT_WORKER"; do
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/settings" "${AUTH[@]}" -o "/tmp/${worker}-settings.json"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/${worker}-deployments.json"
          done
          jq -e --arg student "$STUDENT_WORKER" '.success==true and ([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .type=="service" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' "/tmp/${BROWSER_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_READ_MODELS_KV" 'any(.result.bindings[];.name=="READ_MODELS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_STUDENTS_KV" 'any(.result.bindings[];.name=="STUDENTS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_DB" 'any(.result.bindings[];.name=="DB" and (.database_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg bucket "$EXPECTED_R2" 'any(.result.bindings[];.name=="MATERIALS_R2" and (.bucket_name//.bucket)==$bucket)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e 'any(.result.bindings[];.name=="AUTH_SIGNING_SECRET" and .type=="secret_text") and any(.result.bindings[];.name=="ACCESS_SCOPE_SECRET" and .type=="secret_text")' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          STUDENT_ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${STUDENT_WORKER}-deployments.json" | head -n1)"
          BROWSER_ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${BROWSER_WORKER}-deployments.json" | head -n1)"
          LEGACY_ACTIVE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${LEGACY_WORKER}-deployments.json" | head -n1)"
          test "$STUDENT_ACTIVE" = "$EXPECTED_STUDENT_VERSION"
          test "$BROWSER_ACTIVE" = "$EXPECTED_BROWSER_VERSION"
          test "$LEGACY_ACTIVE" = "$EXPECTED_LEGACY_VERSION"
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions.json
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/browser-versions.json
          jq -e --arg v "$EXPECTED_STUDENT_ROLLBACK" 'any(.result.items[];.id==$v)' /tmp/student-versions.json >/dev/null
          jq -e --arg v "$EXPECTED_STUDENT_VERSION" 'any(.result.items[];.id==$v)' /tmp/student-versions.json >/dev/null
          jq -e --arg v "$EXPECTED_BROWSER_VERSION" 'any(.result.items[];.id==$v)' /tmp/browser-versions.json >/dev/null
          jq '[.result.bindings[]|if ((.type//"")|test("secret";"i")) then {name,type} else . end]|sort_by(.name)' "/tmp/${STUDENT_WORKER}-settings.json" >/tmp/student-binding-signature.json
          jq '[.result.bindings[]|if .type=="assets" then {name,type} else . end]|sort_by(.name)' "/tmp/${BROWSER_WORKER}-settings.json" >/tmp/browser-binding-signature.json
          printf '%s\n' "$STUDENT_ACTIVE" >/tmp/student-before-version
          printf '%s\n' "$BROWSER_ACTIVE" >/tmp/browser-before-version
          printf '%s\n' "$LEGACY_ACTIVE" >/tmp/legacy-before-version
          echo CP12_APPROVED_V2_UI_FRESH_PRODUCTION_TOPOLOGY_PASS

      - name: Prove prepared lesson migration remains presentation-metadata-only
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim();
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID), token=clean(process.env.CLOUDFLARE_API_TOKEN);
          const lessons=clean(process.env.EXPECTED_LESSONS_KV), read=clean(process.env.EXPECTED_READ_MODELS_KV);
          const api=`https://api.cloudflare.com/client/v4/accounts/${account}`, headers={Authorization:`Bearer ${token}`};
          async function req(path){const r=await fetch(api+path,{headers});const text=await r.text();return{r,text};}
          async function kvText(ns,key){const o=await req(`/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);if(o.r.status===404)return null;if(!o.r.ok)throw new Error(`KV read ${o.r.status}:${key}`);return o.text;}
          async function kvJson(ns,key){const t=await kvText(ns,key);if(t==null)return null;return JSON.parse(t);}
          async function list(ns,prefix){let cursor='',out=[];do{const q=new URLSearchParams({prefix,limit:'1000'});if(cursor)q.set('cursor',cursor);const r=await fetch(`${api}/storage/kv/namespaces/${ns}/keys?${q}`,{headers});const b=await r.json();if(!r.ok||b.success!==true)throw new Error(`KV list failed:${prefix}`);out.push(...(b.result||[]).map(x=>clean(x.name)).filter(Boolean));cursor=clean(b.result_info?.cursor);}while(cursor);return out;}
          function stripGroups(value){if(Array.isArray(value))return value.map(stripGroups);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).filter(([k])=>k!=='presentationGroup').map(([k,v])=>[k,stripGroups(v)]));return value;}
          const allowed=new Set(['core-prelesson','core-homework','core-other','core-cumulative','core-answers','elevenplus-prelesson','elevenplus-homework','elevenplus-cumulative','elevenplus-answers','vr-prelesson','vr-homework','vr-answers']);
          const pointerKeys=(await list(read,'rm:v1:scope:lesson_3A')).filter(k=>k.endsWith(':current')).sort();
          if(pointerKeys.length<250)throw new Error(`Unexpected published lesson pointer count:${pointerKeys.length}`);
          let changed=0,resources=0,vr=0,eleven=0,core=0;
          for(const pointerKey of pointerKeys){
            const pointer=await kvJson(read,pointerKey), scope=clean(pointer?.scope);
            if(!scope.startsWith('lesson:')||!pointer?.current?.version)throw new Error(`Invalid lesson pointer:${pointerKey}`);
            const lessonId=scope.slice(7), record=await kvJson(lessons,`lesson:${lessonId}`);
            if(!record?.lessonId||clean(record.lessonId)!==lessonId)throw new Error(`Missing source:${scope}`);
            const candidate=await compileLessonDetail(record,{resourceExists:async()=>true});
            const env=await kvJson(read,versionKey(scope,pointer.current.version)); if(!env?.payload)throw new Error(`Missing current:${scope}`);
            if(stableStringify(stripGroups(env.payload))!==stableStringify(stripGroups(candidate)))throw new Error(`Non-presentationGroup drift:${scope}`);
            if(stableStringify(env.payload)!==stableStringify(candidate))changed++;
            for(const r of candidate.resources||[]){resources++;const g=clean(r.presentationGroup);if(!g||!allowed.has(g))throw new Error(`Missing/unknown group:${scope}:${g}`);if(g.startsWith('vr-'))vr++;else if(g.startsWith('elevenplus-'))eleven++;else if(g.startsWith('core-'))core++;}
          }
          if(changed===0||resources===0||vr===0||eleven===0||core===0)throw new Error(`Unexpected metadata migration shape changed=${changed} resources=${resources} vr=${vr} eleven=${eleven} core=${core}`);
          const report={marker:'CP12_APPROVED_V2_UI_METADATA_ONLY_PASS',status:'PASS',publishedLessonScopes:pointerKeys.length,changedLessonScopes:changed,totalResources:resources,coreResources:core,elevenPlusResources:eleven,vrResources:vr,nonMetadataDiffs:0,writes:false};
          fs.writeFileSync('/tmp/cp12-approved-v2-ui-prepared-preflight.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE

      - name: Assemble production preflight evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg marker CP12_APPROVED_V2_UI_PRODUCTION_PREFLIGHT_PASS \
            --arg official "$OFFICIAL_CP12_SHA" \
            --arg frontend "$CANDIDATE_FRONTEND_SHA" \
            --arg metadata "$METADATA_COMMIT" \
            --arg stagingRun "$STAGING_UAT_RUN_ID" \
            --arg student "$(cat /tmp/student-before-version)" \
            --arg browser "$(cat /tmp/browser-before-version)" \
            --arg legacy "$(cat /tmp/legacy-before-version)" \
            --arg rollback "$EXPECTED_STUDENT_ROLLBACK" \
            --slurpfile prepared /tmp/cp12-approved-v2-ui-prepared-preflight.json \
            '{marker:$marker,status:"PASS",readOnly:true,officialCp12Sha:$official,frontendSha:$frontend,metadataCommit:$metadata,stagingUatRun:$stagingRun,studentVersion:$student,browserVersion:$browser,legacyVersion:$legacy,studentRollbackRetained:$rollback,canonicalTopology:true,browserToAdminOps:false,prepared:$prepared[0]}' \
            >/tmp/cp12-approved-v2-ui-production-preflight.json
          cat /tmp/cp12-approved-v2-ui-production-preflight.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-approved-v2-ui-production-preflight
          path: |
            /tmp/cp12-approved-v2-ui-production-preflight.json
            /tmp/cp12-approved-v2-ui-prepared-preflight.json
            /tmp/student-binding-signature.json
            /tmp/browser-binding-signature.json
          if-no-files-found: error
          retention-days: 30
