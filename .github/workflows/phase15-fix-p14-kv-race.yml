name: Phase 15 fix P14 KV propagation harness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase15-fix-p14-kv-race.yml'

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase15-student-persona-testing' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '525a496ef39f43dfd60241e5f031ea96b451151e' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch P14 login snapshot propagation wait
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/phase15-guarded-live-personas.sh')
          s = p.read_text()
          old = '''JAR="$TMP/full-11.jar"; login_user testy5e "$JAR" "$TMP/full-11-login.json"
          PHASE15_STAGE="p14-full-library-home"
          api_get "$JAR" '/api/v1/student/home' "$TMP/full-11-home.json"
          echo "PHASE15_STAGE p14-full-library-home views=$(jq -c '[.subjects[]|select(.subject==\"english\")|.views[]|{viewId,lockedPreview}]' "$TMP/full-11-home.json")"
          jq -e '.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year4-11plus" and .lockedPreview==false)' "$TMP/full-11-home.json" >/dev/null
          '''
          new = '''PHASE15_STAGE="p14-full-library-home"
          P14_READY=0
          for attempt in $(seq 1 20); do
            JAR="$TMP/full-11.jar"
            rm -f "$JAR"
            login_user testy5e "$JAR" "$TMP/full-11-login.json"
            api_get "$JAR" '/api/v1/student/home' "$TMP/full-11-home.json"
            if jq -e '.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year4-11plus" and .lockedPreview==false)' "$TMP/full-11-home.json" >/dev/null; then
              P14_READY=1
              break
            fi
            sleep 2
          done
          echo "PHASE15_STAGE p14-full-library-home views=$(jq -c '[.subjects[]|select(.subject==\"english\")|.views[]|{viewId,lockedPreview}]' "$TMP/full-11-home.json")"
          test "$P14_READY" = '1'
          '''
          if old not in s:
              raise SystemExit('P14 block not found exactly')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          bash -n tests/phase15-guarded-live-personas.sh
          grep -Fq 'P14_READY=0' tests/phase15-guarded-live-personas.sh
          grep -Fq 'test "$P14_READY" = '\''1'\''' tests/phase15-guarded-live-personas.sh
          rm .github/workflows/phase15-fix-p14-kv-race.yml

      - name: Commit harness fix and remove transient workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phase15-guarded-live-personas.sh .github/workflows/phase15-fix-p14-kv-race.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: P14 propagation patch produced no changes.' >&2; exit 1; }
          git commit -m 'Phase 15: make P14 KV propagation deterministic'
          git push origin "HEAD:${HEAD_BRANCH}"
