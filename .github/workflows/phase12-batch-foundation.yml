name: Phase 12 batch foundation

on:
  pull_request:
    branches: [main]
    paths:
      - worker/migrations/0008_phase12_batch_configuration.sql
      - tests/phase12-batch-schema-static-verification.mjs
      - docs/data/phase12/BATCH_CONFIGURATION.md
      - .github/workflows/phase12-batch-foundation.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Phase 12 batch schema
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y sqlite3
          fi
          node --experimental-default-type=module tests/phase12-batch-schema-static-verification.mjs
          grep -Fq 'must never insert lesson-entitlement rows by itself' docs/data/phase12/BATCH_CONFIGURATION.md
          grep -Fq 'exact academic-year batch name' docs/data/phase12/BATCH_CONFIGURATION.md

  apply-development:
    needs: static
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-batch-foundation' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard Phase 11 closure invariants and V2 development bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/catalogue-check.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' docs/data/phase11/PHASE11_CLOSURE.md

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings.json)"
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login is enabled; refusing Phase 12 schema apply.' >&2; exit 1;; esac
          echo "db=$DB" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Worker security markers before D1 schema write
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-before.bin
          for marker in SPECIAL_ACCESS_REQUIRED MOCK_PASSWORD_INCORRECT MOCK_DAILY_PASSWORDS QUIZ_NOT_AVAILABLE answer_view_tokens previous X-FPT-Students-KV-Read-Ops; do
            grep -aFq "$marker" /tmp/worker-before.bin
          done

      - name: Snapshot D1 invariants and entitlement count
        id: before
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/phase12-d1-before.json 2>/tmp/phase12-d1-before.err
          grep -Fq 'trg_student_sessions_single_active' /tmp/phase12-d1-before.json
          grep -Fq '"ok"' /tmp/phase12-d1-before.json
          ENTITLEMENTS="$(node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/phase12-d1-before.json','utf8'));
          let count=null;
          const visit=v=>{if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'entitlement_count')) count=Number(v.entitlement_count); for(const x of Object.values(v)) visit(x);}};
          visit(data);
          if(!Number.isInteger(count)||count<0) process.exit(2);
          process.stdout.write(String(count));
          NODE
          )"
          echo "entitlements=$ENTITLEMENTS" >> "$GITHUB_OUTPUT"

      - name: Apply idempotent Phase 12 batch schema to development D1
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote \
            --file worker/migrations/0008_phase12_batch_configuration.sql --yes \
            >/tmp/phase12-batch-schema-apply.log 2>/tmp/phase12-batch-schema-apply.err

      - name: Verify schema and prove no retroactive entitlement mutation
        shell: bash
        env:
          BEFORE_ENTITLEMENTS: ${{ steps.before.outputs.entitlements }}
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('batch_definitions','student_batch_assignments','batch_lesson_releases') ORDER BY name; SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_student_batch_assignments_user_dates','idx_student_batch_assignments_batch_dates','idx_student_batch_assignments_open_unique','idx_batch_lesson_releases_lesson') ORDER BY name; SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/phase12-d1-after.json 2>/tmp/phase12-d1-after.err
          for marker in batch_definitions student_batch_assignments batch_lesson_releases idx_student_batch_assignments_user_dates idx_student_batch_assignments_batch_dates idx_student_batch_assignments_open_unique idx_batch_lesson_releases_lesson trg_student_sessions_single_active '"ok"'; do
            grep -Fq "$marker" /tmp/phase12-d1-after.json
          done
          AFTER_ENTITLEMENTS="$(node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/phase12-d1-after.json','utf8'));
          let count=null;
          const visit=v=>{if(v&&typeof v==='object'){if(Object.prototype.hasOwnProperty.call(v,'entitlement_count')) count=Number(v.entitlement_count); for(const x of Object.values(v)) visit(x);}};
          visit(data);
          if(!Number.isInteger(count)||count<0) process.exit(2);
          process.stdout.write(String(count));
          NODE
          )"
          test "$AFTER_ENTITLEMENTS" = "$BEFORE_ENTITLEMENTS"

      - name: Confirm no KV, R2 or Worker mutation is part of this change
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'kv (bulk )?put|r2 object put|wrangler.*deploy' .github/workflows/phase12-batch-foundation.yml
          echo 'Phase 12 development batch schema applied with entitlement count unchanged.'
