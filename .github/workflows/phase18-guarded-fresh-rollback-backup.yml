name: Phase 18 guarded fresh rollback backup

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-guarded-fresh-rollback-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
  WRANGLER_VERSION: 4.125.0
  EXPECTED_MAIN: 3c63a49ef0d679318e8c6901b12e82c007b56271
  EXPECTED_CATALOGUE_SHA: 7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663
  PHASE17_REAL_BACKUP_FILE: /tmp/phase18-current-real-config.json

jobs:
  backup:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact Phase 17 closure baseline
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          echo "PHASE18_MAIN_SHA=${ACTUAL_MAIN}"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"

          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p18-nav.json
          jq -e --arg h "$EXPECTED_CATALOGUE_SHA" '.catalogueSha256 == $h and .curricula == 11 and .lessons == 369' /tmp/p18-nav.json >/dev/null

          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p18-reconcile.json
          jq -e '.status == "PASS" and .state == "POST_CLEANUP_EXACT" and .d1.entitlements == 173 and .d1.batches == 4 and .d1.assignments == 4 and .d1.releases == 0 and .kv.userRecords == 2 and .kv.lessonKvKeys == 381 and .kv.explicitVrHowToUrls == 11' /tmp/p18-reconcile.json >/dev/null

          PHASE17_FINALIZE_ACTION=postcheck node tests/phase17-finalize-state.mjs | tee /tmp/p18-final-state.json
          jq -e '.status == "PASS" and .realStudentRecords == 2 and .fullLibraryAssignments == 0 and .credentialFormatFailures == 0 and .manualCoreAssignments == 0 and .manualVrAssignments == 0 and .manualSpecialAssignments == 0 and .blockedLessonOverrides == 0 and .identitiesOrPasswordsExposed == false' /tmp/p18-final-state.json >/dev/null
          echo 'PHASE18_FRESH_BACKUP_BASELINE_GUARD=PASS'

      - name: Create and verify fresh private rollback backup
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"

          PHASE17_FINALIZE_ACTION=backup-real node tests/phase17-finalize-state.mjs | tee /tmp/p18-backup-summary.json
          jq -e '.status == "PASS" and .backupWritten == true and .identitiesOrPasswordsExposed == false' /tmp/p18-backup-summary.json >/dev/null
          test -s "$PHASE17_REAL_BACKUP_FILE"
          chmod 600 "$PHASE17_REAL_BACKUP_FILE"

          LOCAL_SHA="$(sha256sum "$PHASE17_REAL_BACKUP_FILE" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$PHASE17_REAL_BACKUP_FILE")"
          MAIN_SHORT="${EXPECTED_MAIN:0:12}"
          BACKUP_KEY="_internal/phase18-backup/precutover-${GITHUB_RUN_ID}-${MAIN_SHORT}.json"

          $W r2 object put "$R2_BUCKET/$BACKUP_KEY" --file="$PHASE17_REAL_BACKUP_FILE" --content-type=application/json --remote >/tmp/p18-put.log 2>&1
          rm -f /tmp/p18-redownload.json
          $W r2 object get "$R2_BUCKET/$BACKUP_KEY" --file=/tmp/p18-redownload.json --remote >/tmp/p18-get.log 2>&1
          test -s /tmp/p18-redownload.json

          REMOTE_SHA="$(sha256sum /tmp/p18-redownload.json | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          cmp -s "$PHASE17_REAL_BACKUP_FILE" /tmp/p18-redownload.json

          echo "PHASE18_FRESH_ROLLBACK_BACKUP_KEY=${BACKUP_KEY}"
          echo "PHASE18_FRESH_ROLLBACK_BACKUP_SHA256=${REMOTE_SHA}"
          echo "PHASE18_FRESH_ROLLBACK_BACKUP_BYTES=${BYTES}"
          echo 'PHASE18_FRESH_ROLLBACK_BACKUP=PASS'

      - name: Safety declaration
        run: echo 'PHASE18_BACKUP_COMPLETE public_mutations=0 dns_changes=0 route_changes=0 login_enablements=0 real_syncs=0 old_live_changes=0 private_r2_backup_writes=1'
