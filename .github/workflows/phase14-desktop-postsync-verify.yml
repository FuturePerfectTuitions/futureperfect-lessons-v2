name: Phase 14 desktop post-sync read-only verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-desktop-postsync-verify.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  verify:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.sha == '458a67cee0f20b21a6083e7073190cfe14628867'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify exact desktop acceptance state without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-postsync-settings.json
          jq -e '.success == true' /tmp/p14-postsync-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-postsync-settings.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-postsync-settings.json)" = 'fpt-materials-dev'
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-postsync-settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal V2 student login is enabled; FAIL.' >&2; false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p14-postsync-settings.json)"
          test -n "$STUDENTS" && test "$STUDENTS" != null

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS test_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS test_assignments FROM student_batch_assignments WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full'); SELECT portal_user_id_norm,lesson_id,core_access,vr_access FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full') ORDER BY portal_user_id_norm; SELECT batch_key,lesson_id FROM batch_lesson_releases WHERE (batch_key='Y3FM' AND lesson_id='Y3M1') OR (batch_key='Y3FE' AND lesson_id='Y3E1') OR (batch_key='Y511FE' AND lesson_id='Y5E10') OR (batch_key='Y511FM' AND lesson_id='Y5M1') ORDER BY batch_key,lesson_id; SELECT COUNT(*) AS invalid_entitlement FROM lesson_entitlements WHERE portal_user_id_norm='testy3p14m' AND lesson_id='Y3M999'; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/p14-postsync-d1.json 2>/tmp/p14-postsync-d1.err

          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-postsync-d1.json)" = '636'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p14-postsync-d1.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-postsync-d1.json)" = '8'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-postsync-d1.json)" = '4'
          test "$(jq -r '.[4].results[0].test_entitlements' /tmp/p14-postsync-d1.json)" = '4'
          test "$(jq -r '.[5].results[0].test_assignments' /tmp/p14-postsync-d1.json)" = '4'
          jq -e '.[6].results | length == 4' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[6].results[] | select(.portal_user_id_norm=="testy3p14m") | .lesson_id=="Y3M1" and .core_access==1 and .vr_access==0' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[6].results[] | select(.portal_user_id_norm=="testy3p14e") | .lesson_id=="Y3E1" and .core_access==1 and .vr_access==0' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[6].results[] | select(.portal_user_id_norm=="testy5p1411e") | .lesson_id=="Y5E10" and .core_access==1 and .vr_access==1' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[6].results[] | select(.portal_user_id_norm=="testy5p14full") | .lesson_id=="Y5M1" and .core_access==1 and .vr_access==0' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[7].results | length == 4' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[7].results[] | select(.batch_key=="Y3FM" and .lesson_id=="Y3M1")' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[7].results[] | select(.batch_key=="Y3FE" and .lesson_id=="Y3E1")' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[7].results[] | select(.batch_key=="Y511FE" and .lesson_id=="Y5E10")' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[7].results[] | select(.batch_key=="Y511FM" and .lesson_id=="Y5M1")' /tmp/p14-postsync-d1.json >/dev/null
          test "$(jq -r '.[8].results[0].invalid_entitlement' /tmp/p14-postsync-d1.json)" = '0'
          jq -e '.[9].results[0].name == "trg_student_sessions_single_active"' /tmp/p14-postsync-d1.json >/dev/null
          jq -e '.[10].results[0].quick_check == "ok"' /tmp/p14-postsync-d1.json >/dev/null

          enc() { node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$1"; }
          for user in testy3p14m testy3p14e testy5p1411e testy5p14full; do
            curl --fail --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/values/$(enc "user:${user}")" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --output "/tmp/${user}.json"
          done
          jq -e '.vrEligible == true' /tmp/testy5p1411e.json >/dev/null
          jq -e '.fullLibraries | index("MATHS_L2_FULL") != null' /tmp/testy5p14full.json >/dev/null

          echo 'PHASE14_DESKTOP_POSTSYNC_READONLY_PASS'
          echo 'Exact expected state: 4 TestY entitlements, 4 releases, invalid Y3M999 absent, VR flag correct, Full Library preserved.'
