name: Riaan1808 production allowlist read-only check

on:
  push:
    branches: [ops/cloudflare-audit]
    paths:
      - '.github/workflows/riaan1808-allowlist-readonly.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Check only whether Riaan is in the live production allowlist
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          VALUE="$(jq -r '[.result.bindings[] | select(.name=="PROD_LOGIN_ALLOWLIST" and .type=="plain_text") | .text][0] // ""' /tmp/settings.json)"
          python3 - "$VALUE" <<'PY'
import sys
vals={x.strip().lower() for x in sys.argv[1].split(',') if x.strip()}
print('prod_allowlist_configured=', bool(vals))
print('prod_allowlist_entry_count=', len(vals))
print('riaan1808_in_prod_allowlist=', 'riaan1808' in vals)
PY
      - name: Confirm no writes
        run: echo 'READ_ONLY_ALLOWLIST_CHECK_PASS'
