name: R2 Drive Y4 read-only progress snapshot

on:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/r2-drive-y4-progress-trigger.txt

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: List Year 4 R2 object families read-only
        run: |
          python3 - <<'PY'
          import json, os, re, requests
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; bucket=os.environ['R2_BUCKET']
          base=f'https://api.cloudflare.com/client/v4/accounts/{acct}/r2/buckets/{bucket}/objects'
          headers={'Authorization':f'Bearer {token}'}
          out=[]; cursor=None
          while True:
              params={'per_page':'1000'}
              if cursor: params['cursor']=cursor
              r=requests.get(base,headers=headers,params=params,timeout=120); r.raise_for_status(); p=r.json()
              if not p.get('success'): raise RuntimeError(p)
              out.extend(p.get('result') or [])
              i=p.get('result_info') or {}; cursor=i.get('cursor') if i.get('is_truncated') else None
              if not cursor: break
          keys=[o.get('key') or '' for o in out if (o.get('key') or '') and not (o.get('key') or '').endswith('/')]
          current=[k for k in keys if re.match(r'^english/year4/Y4T[123]E\d{2}/',k,re.I) or re.match(r'^maths/year4/L1T[123]M\d{2}/',k,re.I)]
          legacy=[k for k in keys if re.match(r'^english/year4/Y4E\d+/',k,re.I) or re.match(r'^maths/year4/Y4M\d+/',k,re.I) or re.match(r'^english/year4/Y4T[123]EE\d{2}/',k,re.I)]
          s={'current_target_family_file_count':len(current),'legacy_managed_file_count':len(legacy),'current_sample':sorted(current)[:10],'legacy_sample':sorted(legacy)[:10]}
          print(json.dumps(s,indent=2)); open('y4-progress.json','w').write(json.dumps(s,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y4-r2-progress-snapshot
          path: y4-progress.json
          retention-days: 7
