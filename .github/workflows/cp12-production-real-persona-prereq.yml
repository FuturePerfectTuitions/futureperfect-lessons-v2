name: CP12 production real persona prerequisite

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths:
      - 'scripts/cp12-production-real-persona-prereq.mjs'
      - '.github/workflows/cp12-production-real-persona-prereq.yml'

permissions:
  contents: read

env:
  PROD_BASE: https://lessons.futureperfect.education
  PROD_HOST: lessons.futureperfect.education
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  LEGACY_WORKER: fpt-portal-v2-worker
  EXPECTED_BROWSER_VERSION: 412d5dd1-8f36-4e84-b5b6-eba39c670820
  EXPECTED_STUDENT_VERSION: bed8e660-facb-47f3-afad-7a9996d95c5a
  EXPECTED_LEGACY_VERSION: b1c8326e-a9cc-4150-b43b-cc572a4404c1
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  CP12_METADATA_ACTION: preview
  CP12_METADATA_REPORT: /tmp/cp12-real-persona-rollback-preview.json
  CP12_METADATA_BACKUP: /tmp/cp12-real-persona-unused-backup.json

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse privacy-safe persona probe
        run: |
          set -Eeuo pipefail
          node --check scripts/cp12-production-real-persona-prereq.mjs
          node --check scripts/cp12-resource-ui-production-metadata.mjs
          ! grep -F 'console.log(secrets' scripts/cp12-production-real-persona-prereq.mjs
          ! grep -F 'presentationScopes' scripts/cp12-production-real-persona-prereq.mjs
          echo CP12_REAL_PERSONA_SOURCE_PASS

      - name: Fresh rollback topology and Worker-version proof
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/deployments" "${AUTH[@]}" -o /tmp/browser-deployments.json
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/deployments" "${AUTH[@]}" -o /tmp/student-deployments.json
          curl --fail --silent --show-error "${API}/workers/scripts/${LEGACY_WORKER}/deployments" "${AUTH[@]}" -o /tmp/legacy-deployments.json
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/browser-deployments.json | head -n1)" = "$EXPECTED_BROWSER_VERSION"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/student-deployments.json | head -n1)" = "$EXPECTED_STUDENT_VERSION"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/legacy-deployments.json | head -n1)" = "$EXPECTED_LEGACY_VERSION"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}" "${AUTH[@]}" -o /tmp/zones.json
          ZONE_ID="$(jq -r '.result[]|select(.name=="futureperfect.education")|.id' /tmp/zones.json | head -n1)"; test -n "$ZONE_ID"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes.json >/dev/null
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/settings" "${AUTH[@]}" -o /tmp/browser-settings.json
          jq -e --arg student "$STUDENT_WORKER" '([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' /tmp/browser-settings.json >/dev/null
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/settings" "${AUTH[@]}" -o /tmp/student-settings.json
          jq -e --arg students "$EXPECTED_STUDENTS_KV" --arg rm "$EXPECTED_READ_MODELS_KV" 'any(.result.bindings[];.name=="STUDENTS_KV" and (.namespace_id//.id)==$students) and any(.result.bindings[];.name=="READ_MODELS_KV" and (.namespace_id//.id)==$rm)' /tmp/student-settings.json >/dev/null
          echo CP12_POST_ATTEMPT3_ROLLBACK_TOPOLOGY_PASS

      - name: Prove exact prepared pointers are back on rolled-back baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cp12-resource-ui-production-metadata.mjs
          jq -e '.marker=="CP12_RESOURCE_UI_METADATA_PREVIEW_PASS" and .status=="PASS" and .writes==false and .publishedLessonScopes==372 and .changedLessonScopes==369 and .unchangedLessonScopes==3 and .nonPresentationGroupDiffs==0' "$CP12_METADATA_REPORT" >/dev/null
          echo CP12_POST_ATTEMPT3_POINTER_BASELINE_PASS

      - name: Find correct real ordinary and VR UAT principals without disclosure
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cp12-production-real-persona-prereq.mjs
          jq -e '.marker=="CP12_PRODUCTION_REAL_PERSONA_PREREQ_READONLY_PASS" and .status=="PASS" and .productionMutation==false and .ordinary.lessonOpen==true and .ordinary.year5ElevenPlusAbsent==true and .vr.lessonOpen==true and .vr.vrHowToVisible==true and .vr.accessProven==true and .vr.preparedCoreAccess==true and .vr.preparedVrAccess==true and .distinctPrincipals==true and .ordinary.credentialDisclosed==false and .vr.credentialDisclosed==false and .secretMaterialLogged==false' /tmp/cp12-production-real-persona-prereq.json >/dev/null
          test -s /tmp/cp12-production-real-persona-secrets.json
          rm -f /tmp/cp12-production-real-persona-secrets.json
          echo CP12_REAL_PRODUCTION_PERSONAS_PASS

      - name: Upload non-secret read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-production-real-persona-prereq
          path: |
            /tmp/cp12-production-real-persona-prereq.json
            /tmp/cp12-real-persona-rollback-preview.json
          if-no-files-found: error
          retention-days: 30
