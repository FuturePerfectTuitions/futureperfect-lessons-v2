name: Y4E1 source chain diagnostic

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-source-chain-diagnostic.yml
      - .github/y4e1-source-chain-trigger.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Trace Y4E1 source authority and PreLesson transformations
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Y4E1 REPOSITORY OCCURRENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'Y4E1' . | head -n 500 || true
          echo '=== Y4T1E01 REPOSITORY OCCURRENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'Y4T1E01' . | head -n 500 || true
          echo '=== PRELESSON REFERENCES IN WORKER SOURCE ==='
          grep -RInE 'preLessonSheets|prelessonSection|renderPreLesson|phase11Resources' worker/src assets | head -n 500 || true
          echo 'SOURCE_CHAIN_DIAGNOSTIC_COMPLETE=true'
