name: Personalise student portal labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personalise-student-portal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Personalise portal labels after login
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/phase7.js')
          text = path.read_text(encoding='utf-8')

          anchor = "  function api(path, options = {}) {"
          if anchor not in text:
              raise SystemExit('api anchor not found')

          helper = r'''  const defaultDocumentTitle = document.title;

  function setPortalOwnerLabel(firstName = '') {
    const owner = String(firstName || '').trim();
    const replacement = owner ? `${owner}'s Portal` : 'Student Portal';
    const walker = document.createTreeWalker(els.portalScreen, NodeFilter.SHOW_TEXT);

    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (node.__fptOriginalPortalText === undefined && String(node.nodeValue || '').includes('Student Portal')) {
        node.__fptOriginalPortalText = String(node.nodeValue || '');
      }
      const original = node.__fptOriginalPortalText;
      if (typeof original === 'string' && original.includes('Student Portal')) {
        node.nodeValue = original.replaceAll('Student Portal', replacement);
      }
    }

    document.title = owner
      ? defaultDocumentTitle.replaceAll('Student Portal', replacement)
      : defaultDocumentTitle;
  }

'''

          if 'function setPortalOwnerLabel' not in text:
              text = text.replace(anchor, helper + anchor, 1)

          login_anchor = "  function showLogin() {\n    state.session = null;\n"
          login_replacement = "  function showLogin() {\n    state.session = null;\n    setPortalOwnerLabel();\n"
          if login_anchor in text:
              text = text.replace(login_anchor, login_replacement, 1)
          elif login_replacement not in text:
              raise SystemExit('showLogin anchor not found')

          portal_anchor = "    const firstName = String(session?.firstName || 'Student').trim() || 'Student';\n    els.greeting.textContent = `Hi, ${firstName}`;"
          portal_replacement = "    const firstName = String(session?.firstName || 'Student').trim() || 'Student';\n    setPortalOwnerLabel(firstName);\n    els.greeting.textContent = `Hi, ${firstName}`;"
          if portal_anchor in text:
              text = text.replace(portal_anchor, portal_replacement, 1)
          elif portal_replacement not in text:
              raise SystemExit('showPortal anchor not found')

          path.write_text(text, encoding='utf-8')
          PY

          grep -q "setPortalOwnerLabel(firstName)" assets/phase7.js
          grep -q "defaultDocumentTitle.replaceAll('Student Portal', replacement)" assets/phase7.js

          git config user.name "FuturePerfectTuitions"
          git config user.email "futureperfectlessons@gmail.com"
          git rm .github/workflows/personalise-student-portal.yml
          git add assets/phase7.js
          git commit -m "Personalise student portal labels by first name"
          git push origin HEAD:main
