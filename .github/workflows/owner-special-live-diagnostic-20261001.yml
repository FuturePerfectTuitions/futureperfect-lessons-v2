name: Owner special live diagnostic 2026-10-01
# Verification rerun after Admin0206 Year 6/SATS list fast-path deployment.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-special-live-diagnostic-20261001.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose Admin0206 SATS and Year 6 live read-only
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/fpt-owner-diagnostic
          rm -rf "$work"; mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT
          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in .github/secure-transfer/l3t1m02/private.pem.enc \
            -out "$work/private.pem" -pass env:CLOUDFLARE_API_TOKEN
          base64 -d .github/secure-transfer/owner-special-logins-20260930/credential.rsa.b64 > "$work/credential.rsa"
          openssl pkeyutl -decrypt -inkey "$work/private.pem" -in "$work/credential.rsa" -out "$work/credential.txt"
          secret="$(cat "$work/credential.txt")"; echo "::add-mask::$secret"; unset secret
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'

          jq -nc --arg u 'admin0206' --rawfile p "$work/credential.txt" '{username:$u,password:$p}' > "$work/login-body.json"
          set +e
          login_meta="$(curl --connect-timeout 5 --max-time 25 -sS -c "$work/cookies" -o "$work/login.json" -w 'http=%{http_code} total=%{time_total}' -H 'Content-Type: application/json' --data @"$work/login-body.json" "$BASE/api/v1/student/auth/login")"
          login_rc=$?
          set -e
          echo "ADMIN0206_LOGIN rc=$login_rc $login_meta ok=$(jq -r '.ok // false' "$work/login.json" 2>/dev/null || echo unreadable)"
          test "$login_rc" = '0'
          jq -e '.ok==true' "$work/login.json" >/dev/null

          set +e
          home_meta="$(curl --connect-timeout 5 --max-time 25 -sS -b "$work/cookies" -o "$work/home.json" -w 'http=%{http_code} total=%{time_total}' "$BASE/api/v1/student/home")"
          home_rc=$?
          set -e
          echo "ADMIN0206_HOME rc=$home_rc $home_meta ok=$(jq -r '.ok // false' "$work/home.json" 2>/dev/null || echo unreadable)"
          if test "$home_rc" = '0' && jq -e '.ok==true' "$work/home.json" >/dev/null 2>&1; then
            labels="$(jq -r '[.subjects[]|select((.subject|ascii_downcase)=="maths")|.views[]|select(.current==true or .group=="current")|.label]|join("|")' "$work/home.json")"
            echo "ADMIN0206_MATHS_LABELS=$labels"
            echo "ADMIN0206_SATS_CARD=$(jq -r '[.subjects[]|select((.subject|ascii_downcase)=="maths")|.views[]|select((.current==true or .group=="current") and .label=="SATS")]|length == 1' "$work/home.json")"
          fi

          set +e
          y6_meta="$(curl --connect-timeout 5 --max-time 25 -sS -b "$work/cookies" -o "$work/year6.json" -w 'http=%{http_code} total=%{time_total}' "$BASE/api/v1/student/views/maths-year6/lessons")"
          y6_rc=$?
          set -e
          echo "ADMIN0206_YEAR6 rc=$y6_rc $y6_meta ok=$(jq -r '.ok // false' "$work/year6.json" 2>/dev/null || echo unreadable) count=$(jq -r '(.lessons // [])|length' "$work/year6.json" 2>/dev/null || echo unreadable)"
          if test "$y6_rc" = '0' && jq -e '.ok==true and (.lessons|type)=="array"' "$work/year6.json" >/dev/null 2>&1; then
            echo "ADMIN0206_YEAR6_HAS_MEAN_MEDIAN_MODE=$(jq -r '[.lessons[]? | (.lessonId // .lesson_id // .displayLessonId // .display_lesson_id // "") | ascii_downcase] | index("maths_l3_11p_t2m25_2026") != null' "$work/year6.json")"
            echo "ADMIN0206_YEAR6_HAS_ADVANCED_STATISTICS=$(jq -r '[.lessons[]? | (.lessonId // .lesson_id // .displayLessonId // .display_lesson_id // "") | ascii_downcase] | index("maths_l3_11p_t3m43_2026") != null' "$work/year6.json")"
          fi

          set +e
          sats_meta="$(curl --connect-timeout 5 --max-time 25 -sS -b "$work/cookies" -o "$work/sats.json" -w 'http=%{http_code} total=%{time_total}' "$BASE/api/v1/student/views/maths-sats/lessons")"
          sats_rc=$?
          set -e
          echo "ADMIN0206_SATS_ROUTE rc=$sats_rc $sats_meta ok=$(jq -r '.ok // false' "$work/sats.json" 2>/dev/null || echo unreadable) label=$(jq -r '.view.label // ""' "$work/sats.json" 2>/dev/null || echo unreadable) count=$(jq -r '(.lessons // [])|length' "$work/sats.json" 2>/dev/null || echo unreadable)"

          test "$home_rc" = '0'
          jq -e '.ok==true' "$work/home.json" >/dev/null
          jq -e '[.subjects[]|select((.subject|ascii_downcase)=="maths")|.views[]|select((.current==true or .group=="current") and .label=="SATS")]|length == 1' "$work/home.json" >/dev/null
          test "$y6_rc" = '0'
          jq -e '.ok==true and (.lessons|type)=="array"' "$work/year6.json" >/dev/null
          jq -e '[.lessons[]? | (.lessonId // .lesson_id // .displayLessonId // .display_lesson_id // "") | ascii_downcase] | index("maths_l3_11p_t2m25_2026") == null and index("maths_l3_11p_t3m43_2026") == null' "$work/year6.json" >/dev/null
          test "$sats_rc" = '0'
          jq -e '.ok==true and .view.label=="SATS" and (.lessons|type)=="array"' "$work/sats.json" >/dev/null
          echo 'ADMIN0206_EXACT_LIVE_REQUIREMENTS_PASS'
