name: Secure production provisioning bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prod-secure-bootstrap.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  bootstrap:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' && github.event.head_commit.message == 'Bootstrap secure production provisioning channel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate one-time public-key channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .secure-provisioning
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const secret = String(process.env.CLOUDFLARE_API_TOKEN || '');
          if (!secret) throw new Error('Missing Cloudflare token');

          const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
            modulusLength: 4096,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });

          const wrappingKey = crypto.createHash('sha256')
            .update('fpt-prod-provision-wrap-v1\0')
            .update(secret)
            .digest();
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', wrappingKey, iv);
          const ciphertext = Buffer.concat([cipher.update(Buffer.from(privateKey, 'utf8')), cipher.final()]);
          const tag = cipher.getAuthTag();

          fs.writeFileSync('.secure-provisioning/public.pem', publicKey, 'utf8');
          fs.writeFileSync('.secure-provisioning/private.enc.json', JSON.stringify({
            schema: 'fpt-prod-private-key-wrap-v1',
            iv: iv.toString('base64'),
            tag: tag.toString('base64'),
            ciphertext: ciphertext.toString('base64')
          }) + '\n', 'utf8');
          NODE

      - name: Commit non-plaintext key material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add .secure-provisioning/public.pem .secure-provisioning/private.enc.json
          git commit -m 'Create secure provisioning key material'
          git push origin main
