name: Live catalogue branch verification

on:
  push:
    branches: [fix/live-l1-catalogue-authority-v2]
    paths:
      - '.github/workflows/live-catalogue-branch-verification.yml'
      - 'worker/src/live-student-catalogue-overlay.js'
      - 'worker/src/index-phase20-change17-parent-email.js'
      - 'tests/live-student-catalogue-overlay-verification.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live catalogue outer overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/live-catalogue-nav
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/live-catalogue-nav >/tmp/live-catalogue-nav.log
          node --check worker/src/live-student-catalogue-overlay.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node tests/live-student-catalogue-overlay-verification.mjs
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/parent-email-import-verification.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          grep -Fq 'LIVE_STUDENT_CATALOGUE_OVERLAY_V1' worker/src/live-student-catalogue-overlay.js
          grep -Fq 'repairLiveStudentCatalogueResponse' worker/src/index-phase20-change17-parent-email.js
          echo 'LIVE_CATALOGUE_BRANCH_PASS'
