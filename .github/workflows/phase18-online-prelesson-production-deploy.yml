name: Phase 18 online PreLesson production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase18-online-prelesson-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
      WRANGLER_VERSION: 4.125.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static fail-closed verification
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase18-online-prelesson.js
          node --check assets/phase18-online-prelesson-ui.js
          grep -Fq 'main = "src/index-phase18-online-prelesson.js"' worker/wrangler.toml
          grep -Fq '<script src="assets/phase18-online-prelesson-ui.js"></script>' phase11.html
          grep -Fq "prelesson_grant" worker/src/index-phase18-online-prelesson.js
          grep -Fq "const PRELESSON_DOWNLOAD_KINDS = new Set(['pre', 'p11corepre', 'p11elevenpre', 'vrpre']);" worker/src/index-phase18-online-prelesson.js
          grep -Fq "PRELESSON_ONLY" worker/src/index-phase18-online-prelesson.js
          grep -Fq "if (item.operation === 'grant' && result.ok) await clearPrelesson(env, item);" worker/src/index-phase18-online-prelesson.js
          grep -Fq 'Only PreLesson Sheets available to download and print. Other resources will be unlocked once the lesson starts.' worker/src/index-phase18-online-prelesson.js
          echo 'PHASE18_STATIC_PASS'

      - name: Capture production bindings and generate preserved runtime config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings-before.json
          jq -e '.success == true' /tmp/settings-before.json >/dev/null

          plain() {
            jq -r --arg n "$1" '[.result.bindings[] | select(.name == $n and .type == "plain_text") | .text][0] // ""' /tmp/settings-before.json
          }
          binding_field() {
            local name="$1" type="$2" field="$3"
            jq -r --arg n "$name" --arg t "$type" --arg f "$field" '[.result.bindings[] | select(.name == $n and .type == $t) | .[$f]][0] // ""' /tmp/settings-before.json
          }

          ENVIRONMENT_VALUE="$(plain ENVIRONMENT)"
          ORIGINS="$(plain ALLOWED_ORIGINS)"
          DEV_ALLOWLIST="$(plain DEV_LOGIN_ALLOWLIST)"
          PROD_ALLOWLIST="$(plain PROD_LOGIN_ALLOWLIST)"
          LOGIN_ENABLED="$(plain STUDENT_LOGIN_ENABLED)"
          STUDENTS_ID="$(binding_field STUDENTS_KV kv_namespace namespace_id)"
          LESSONS_ID="$(binding_field LESSONS_KV kv_namespace namespace_id)"
          DATABASE_ID="$(binding_field DB d1 id)"
          R2_BUCKET="$(binding_field MATERIALS_R2 r2_bucket bucket_name)"

          test "$(printf '%s' "$ENVIRONMENT_VALUE" | tr '[:upper:]' '[:lower:]')" = 'production'
          test "$(printf '%s' "$LOGIN_ENABLED" | tr '[:upper:]' '[:lower:]')" = 'true'
          printf '%s' "$ORIGINS" | tr ',' '\n' | grep -Fxq "$PRODUCTION_ORIGIN"
          test -n "$STUDENTS_ID"; test -n "$LESSONS_ID"; test -n "$DATABASE_ID"; test -n "$R2_BUCKET"

          jq -c '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | sort' /tmp/settings-before.json > /tmp/secrets-before.json
          printf '%s' "$STUDENTS_ID" > /tmp/students-id.txt
          printf '%s' "$LESSONS_ID" > /tmp/lessons-id.txt
          printf '%s' "$DATABASE_ID" > /tmp/database-id.txt
          printf '%s' "$R2_BUCKET" > /tmp/r2-bucket.txt
          printf '%s' "$ENVIRONMENT_VALUE" > /tmp/environment.txt
          printf '%s' "$ORIGINS" > /tmp/origins.txt
          printf '%s' "$DEV_ALLOWLIST" > /tmp/dev-allowlist.txt
          printf '%s' "$PROD_ALLOWLIST" > /tmp/prod-allowlist.txt
          printf '%s' "$LOGIN_ENABLED" > /tmp/login-enabled.txt

          cat > worker/wrangler.phase18.runtime.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index-phase18-online-prelesson.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true

          [vars]
          ENVIRONMENT = "${ENVIRONMENT_VALUE}"
          ALLOWED_ORIGINS = "${ORIGINS}"
          DEV_LOGIN_ALLOWLIST = "${DEV_ALLOWLIST}"
          PROD_LOGIN_ALLOWLIST = "${PROD_ALLOWLIST}"
          STUDENT_LOGIN_ENABLED = "${LOGIN_ENABLED}"

          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_ID}"

          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_ID}"

          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2_BUCKET}"

          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DATABASE_ID}"
          EOF
          chmod 600 worker/wrangler.phase18.runtime.toml
          echo 'PHASE18_BINDING_CAPTURE_PASS'

      - name: Apply idempotent PreLesson entitlement migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db \
            --config worker/wrangler.phase18.runtime.toml \
            --remote \
            --file worker/migrations/0009_online_prelesson_entitlements.sql \
            >/tmp/migration.log 2>/tmp/migration.err
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db \
            --config worker/wrangler.phase18.runtime.toml \
            --remote --json \
            --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name='online_prelesson_entitlements'; SELECT COUNT(*) AS row_count FROM online_prelesson_entitlements; PRAGMA quick_check;" \
            >/tmp/d1-check.json 2>/tmp/d1-check.err
          test "$(jq -r '.[0].results[0].table_count' /tmp/d1-check.json)" = '1'
          test "$(jq -r '.[2].results[0].quick_check' /tmp/d1-check.json)" = 'ok'
          jq -r '.[1].results[0].row_count' /tmp/d1-check.json > /tmp/prelesson-count-before-deploy.txt
          echo 'PHASE18_MIGRATION_PASS'

      - name: Deploy production Worker with preserved bindings and vars
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --config worker/wrangler.phase18.runtime.toml \
            --keep-vars \
            --message 'Portal V2 online PreLesson-only access' \
            >/tmp/deploy.log 2>/tmp/deploy.err
          echo 'PHASE18_WORKER_DEPLOYED'

      - name: Verify production bindings, secrets and migration remain intact
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings-after.json
          jq -e '.success == true' /tmp/settings-after.json >/dev/null

          plain_after() {
            jq -r --arg n "$1" '[.result.bindings[] | select(.name == $n and .type == "plain_text") | .text][0] // ""' /tmp/settings-after.json
          }
          binding_after() {
            local name="$1" type="$2" field="$3"
            jq -r --arg n "$name" --arg t "$type" --arg f "$field" '[.result.bindings[] | select(.name == $n and .type == $t) | .[$f]][0] // ""' /tmp/settings-after.json
          }

          test "$(binding_after STUDENTS_KV kv_namespace namespace_id)" = "$(cat /tmp/students-id.txt)"
          test "$(binding_after LESSONS_KV kv_namespace namespace_id)" = "$(cat /tmp/lessons-id.txt)"
          test "$(binding_after DB d1 id)" = "$(cat /tmp/database-id.txt)"
          test "$(binding_after MATERIALS_R2 r2_bucket bucket_name)" = "$(cat /tmp/r2-bucket.txt)"
          test "$(plain_after ENVIRONMENT)" = "$(cat /tmp/environment.txt)"
          test "$(plain_after ALLOWED_ORIGINS)" = "$(cat /tmp/origins.txt)"
          test "$(plain_after DEV_LOGIN_ALLOWLIST)" = "$(cat /tmp/dev-allowlist.txt)"
          test "$(plain_after PROD_LOGIN_ALLOWLIST)" = "$(cat /tmp/prod-allowlist.txt)"
          test "$(plain_after STUDENT_LOGIN_ENABLED)" = "$(cat /tmp/login-enabled.txt)"
          jq -c '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | sort' /tmp/settings-after.json > /tmp/secrets-after.json
          cmp -s /tmp/secrets-before.json /tmp/secrets-after.json

          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db \
            --config worker/wrangler.phase18.runtime.toml \
            --remote --json \
            --command "SELECT COUNT(*) AS row_count FROM online_prelesson_entitlements; PRAGMA quick_check;" \
            >/tmp/d1-after.json 2>/tmp/d1-after.err
          test "$(jq -r '.[0].results[0].row_count' /tmp/d1-after.json)" = "$(cat /tmp/prelesson-count-before-deploy.txt)"
          test "$(jq -r '.[1].results[0].quick_check' /tmp/d1-after.json)" = 'ok'
          echo 'PHASE18_BINDINGS_AND_D1_PASS'

      - name: Live Worker route acceptance
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/sync-noauth.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --request POST --data '{"items":[{"syncRowId":"phase18-noauth","operation":"prelesson_grant","portalUserId":"missing","lessonId":"missing","batchKey":"O","lessonDate":"2026-09-06"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = '401'
          jq -e '.error == "SYNC_UNAUTHORISED"' /tmp/sync-noauth.json >/dev/null

          code="$(curl --silent --show-error --output /tmp/sync-browser.json --write-out '%{http_code}' \
            --header "Origin: $PRODUCTION_ORIGIN" --header 'Content-Type: application/json' \
            --request POST --data '{"items":[{"syncRowId":"phase18-browser","operation":"prelesson_grant","portalUserId":"missing","lessonId":"missing","batchKey":"O","lessonDate":"2026-09-06"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = '403'
          jq -e '.error == "BROWSER_REQUEST_NOT_ALLOWED"' /tmp/sync-browser.json >/dev/null
          echo 'PHASE18_LIVE_WORKER_PASS'

      - name: Verify production portal UI is published
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$PRODUCTION_ORIGIN/phase11.html?phase18=${GITHUB_SHA}" -o /tmp/phase11-live.html && \
               grep -Fq 'assets/phase18-online-prelesson-ui.js' /tmp/phase11-live.html && \
               curl --fail --silent --show-error "$PRODUCTION_ORIGIN/assets/phase18-online-prelesson-ui.js?phase18=${GITHUB_SHA}" -o /tmp/phase18-ui-live.js && \
               grep -Fq 'PreLesson only' /tmp/phase18-ui-live.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = '1'
          echo 'PHASE18_LIVE_UI_PASS'

      - name: Final closure marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f worker/wrangler.phase18.runtime.toml
          echo 'PHASE18_ONLINE_PRELESSON_PRODUCTION_PASS'
