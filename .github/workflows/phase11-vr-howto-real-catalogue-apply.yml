name: Phase 11 real VR How To guarded apply

on:
  pull_request:
    branches: [main]
    paths: ['.github/phase11-vr-howto-real-apply-trigger.txt']

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  LEGACY_WORKER_NAME: frosty-rain-828e
  LEGACY_LESSONS_KV_ID: 80e5015aeb7046aa917189304a093a7c
  WRANGLER_VERSION: 4.125.0

jobs:
  apply:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'ops/phase11-vr-howto-real-apply' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact trigger branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard trigger-only branch and static invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..HEAD)" = '.github/phase11-vr-howto-real-apply-trigger.txt'
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          jq -e . worker/fixtures/phase11/special-VR_HOWTO.json >/dev/null
          node tests/phase11-vr-howto-real-catalogue-static-verification.mjs
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs

      - name: Guard isolated V2 development and source bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/v2-settings.json
          jq -e '.success == true' /tmp/v2-settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/v2-settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ALLOWED_ORIGINS" and .type=="plain_text" and .text=="https://futureperfecttuitions.github.io")' /tmp/v2-settings.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[] | select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text") | .text][0] // ""' /tmp/v2-settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login appears enabled; refusing apply.' >&2; exit 1;; esac
          LESSONS="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/v2-settings.json)"
          test -n "$LESSONS"; test "$LESSONS" != null; test "$LESSONS" != "$LEGACY_LESSONS_KV_ID"
          echo "lessons=$LESSONS" >> "$GITHUB_OUTPUT"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${LEGACY_WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/legacy-settings.json
          jq -e --arg ns "$LEGACY_LESSONS_KV_ID" '.result.bindings[] | select(.name=="FPT_LESSONS" and .type=="kv_namespace" and .namespace_id==$ns)' /tmp/legacy-settings.json >/dev/null

      - name: Snapshot V2 target and authoritative legacy source
        shell: bash
        env:
          V2_LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W kv key get 'special:VR_HOWTO' --namespace-id "$V2_LESSONS_KV_ID" --remote > /tmp/v2-before.json
          $W kv key get 'VR_HOWTO' --namespace-id "$LEGACY_LESSONS_KV_ID" --remote > /tmp/legacy-vr-howto.json
          jq -e . /tmp/v2-before.json >/dev/null
          jq -e . /tmp/legacy-vr-howto.json >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const legacy = JSON.parse(fs.readFileSync('/tmp/legacy-vr-howto.json','utf8'));
          const target = JSON.parse(fs.readFileSync('worker/fixtures/phase11/special-VR_HOWTO.json','utf8'));
          if (!Array.isArray(legacy) || legacy.length !== 11 || target.items.length !== legacy.length) throw new Error('Unexpected legacy VR_HOWTO source shape/count.');
          for (let i=0; i<legacy.length; i++) {
            const l=legacy[i], t=target.items[i];
            for (const [a,b,label] of [[l.n,t.n,'n'],[l.title,t.title,'title'],[l.desc,t.description,'description'],[l.sp,t.video?.screenpal,'screenpal']]) {
              if (a !== b) throw new Error(`Legacy/source mismatch at item ${i+1} ${label}`);
            }
          }
          const before = JSON.parse(fs.readFileSync('/tmp/v2-before.json','utf8'));
          const targetText = JSON.stringify(target);
          const beforeText = JSON.stringify(before);
          const knownFixture = before?.testOnly === true && Array.isArray(before?.items) && before.items.some(x => String(x?.video?.screenpal||'').startsWith('DEV-P10-'));
          if (beforeText !== targetText && !knownFixture) throw new Error('V2 special:VR_HOWTO is neither the known Phase 10 fixture nor the exact Phase 11 target; refusing overwrite.');
          console.log('Authoritative legacy source matches Phase 11 target exactly: 11 items.');
          NODE

      - name: Verify all 11 authoritative ScreenPal videos are live before write
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@latest >/dev/null
          google-chrome --version
          node tests/phase11-vr-howto-screenpal-live-verification.mjs

      - name: Apply only the V2 VR How To special key
        shell: bash
        env:
          V2_LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          if diff -u <(jq -S . /tmp/v2-before.json) <(jq -S . worker/fixtures/phase11/special-VR_HOWTO.json) >/dev/null; then
            echo 'V2 special:VR_HOWTO already exact; no KV write needed.'
          else
            npx --yes wrangler@${WRANGLER_VERSION} kv key put 'special:VR_HOWTO' \
              --namespace-id "$V2_LESSONS_KV_ID" --remote \
              --path worker/fixtures/phase11/special-VR_HOWTO.json >/tmp/vr-howto-put.log
            touch /tmp/vr-howto-write-applied
            echo 'Applied one V2 LESSONS_KV key: special:VR_HOWTO.'
          fi

      - name: Exact-verify V2 key and deployed API
        shell: bash
        env:
          V2_LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W kv key get 'special:VR_HOWTO' --namespace-id "$V2_LESSONS_KV_ID" --remote > /tmp/v2-after.json
          diff -u <(jq -S . worker/fixtures/phase11/special-VR_HOWTO.json) <(jq -S . /tmp/v2-after.json)

          JAR=/tmp/vr-howto.cookies
          curl --fail-with-body --silent --show-error --cookie-jar "$JAR" \
            --header 'Origin: https://futureperfecttuitions.github.io' --header 'Content-Type: application/json' \
            --request POST --data '{"username":"TestY511EM","password":"Te12"}' \
            'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/auth/login' >/tmp/login.json
          jq -e '.ok == true' /tmp/login.json >/dev/null
          curl --fail-with-body --silent --show-error --cookie "$JAR" \
            --header 'Origin: https://futureperfecttuitions.github.io' \
            'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/special-areas/VR_HOWTO?viewId=english-year5-11plus' >/tmp/detail.json
          jq -e '.ok == true and .area.title == "VR How To" and (.area.items|length)==11 and .area.items[0].title=="Mirroring Codes" and .area.items[10].title=="Hidden Words" and (.area.description|contains("manually assigned")|not)' /tmp/detail.json >/dev/null

          node <<'NODE'
          const fs=require('fs'); const cp=require('child_process');
          const detail=JSON.parse(fs.readFileSync('/tmp/detail.json','utf8'));
          const target=JSON.parse(fs.readFileSync('worker/fixtures/phase11/special-VR_HOWTO.json','utf8'));
          for (let i=0;i<detail.area.items.length;i++) {
            const key=detail.area.items[i].resourceKey;
            if (!key) throw new Error(`Missing resource key at ${i+1}`);
            const url='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/special-resources/'+encodeURIComponent(key)+'/video?viewId=english-year5-11plus';
            const out=cp.execFileSync('curl',['--fail-with-body','--silent','--show-error','--cookie','/tmp/vr-howto.cookies','--header','Origin: https://futureperfecttuitions.github.io',url],{encoding:'utf8'});
            const body=JSON.parse(out);
            const id=target.items[i].video.screenpal;
            if (!body.ok || !String(body.embedUrl||'').includes(`/player/${id}?`)) throw new Error(`Incorrect deployed ScreenPal URL at ${i+1}`);
          }
          console.log('Deployed V2 API exposes all 11 exact authoritative VR How To videos.');
          NODE

      - name: Reconfirm legacy source unchanged
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} kv key get 'VR_HOWTO' --namespace-id "$LEGACY_LESSONS_KV_ID" --remote > /tmp/legacy-after.json
          diff -u <(jq -S . /tmp/legacy-vr-howto.json) <(jq -S . /tmp/legacy-after.json)
          echo 'Legacy VR_HOWTO unchanged.'

      - name: Roll back V2 special key on failure
        if: failure()
        shell: bash
        env:
          V2_LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
        run: |
          set -euo pipefail
          if [ -f /tmp/vr-howto-write-applied ] && [ -s /tmp/v2-before.json ]; then
            npx --yes wrangler@${WRANGLER_VERSION} kv key put 'special:VR_HOWTO' \
              --namespace-id "$V2_LESSONS_KV_ID" --remote --path /tmp/v2-before.json >/dev/null
            echo 'Rolled back V2 special:VR_HOWTO to its pre-run value.'
          fi

      - name: Completion
        if: success()
        run: echo 'Phase 11 real VR How To guarded apply and verification PASS.'
