name: Phase 14 remaining Excel matrix acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - tests/phase14-excel-sync-matrix-verification.mjs
      - tests/phase13-excel-sync-verification.mjs
      - worker/src/index-phase13.js
      - worker/src/index-phase12.js
      - worker/src/index.js
      - docs/data/phase14/**
      - .github/workflows/phase14-excel-matrix-acceptance.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FPT_PORTAL_V2_EXCEL_SYNC_TOKEN: ${{ secrets.FPT_PORTAL_V2_EXCEL_SYNC_TOKEN }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  static-regression:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Phase 14 gap matrix and inherited regression gates
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = '458a67cee0f20b21a6083e7073190cfe14628867'
          node --check worker/src/index-phase13.js
          node tests/phase14-excel-sync-matrix-verification.mjs
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs
          node tests/phase12-batch-schema-static-verification.mjs
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/p14-catalogue.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/p14-catalogue.log
          node tests/phase11-session-efficiency-static-verification.mjs
          node tests/phase11-answer-dedup-static-verification.mjs
          node tests/phase11-answer-header-static-verification.mjs
          node tests/phase11-screenpal-static-verification.mjs
          node tests/phase11-vr-howto-top-level-static-verification.mjs
          node --experimental-default-type=module tests/phase11-vr-howto-real-catalogue-static-verification.mjs
          node tests/phase11-vr-solution-video-policy-static-verification.mjs
          node --experimental-default-type=module tests/phase11-test-personas-static-verification.mjs
          grep -Fq "MATHS_L2_FULL" worker/src/index.js
          grep -Fq "function fullLibraryCoversLesson" worker/src/index.js
          grep -Fq "ENGLISH_Y5_11PLUS_FULL" worker/src/index.js
          grep -Fq "function fullLibraryGrantsVr" worker/src/index-phase9.js
          echo 'Phase 14 static and inherited regression matrix: PASS'

  guarded-live-matrix:
    needs: static-regression
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guarded isolated V2 live matrix with exact cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          MUTATION_STARTED=0
          STUDENTS=''
          LESSONS=''
          DB=''
          R2=''
          USERS=(testy5p14m testy5p14e testy5p1411e testy5p14full)
          BATCHES=(P14_Y5M P14_Y5E P14_Y511E)

          kv_key_url() {
            local namespace="$1"
            local key="$2"
            local encoded
            encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$key")"
            printf 'https://api.cloudflare.com/client/v4/accounts/%s/storage/kv/namespaces/%s/values/%s' \
              "$CLOUDFLARE_ACCOUNT_ID" "$namespace" "$encoded"
          }

          d1_cleanup() {
            local sql
            sql="DELETE FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full'); DELETE FROM batch_lesson_releases WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); DELETE FROM student_batch_assignments WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full') AND batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); DELETE FROM batch_definitions WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E');"
            $W d1 execute fpt_portal_v2_db --remote --json --command "$sql" >/tmp/p14-clean-d1.json 2>/tmp/p14-clean-d1.err
          }

          kv_cleanup() {
            local user key url
            for user in "${USERS[@]}"; do
              key="user:${user}"
              url="$(kv_key_url "$STUDENTS" "$key")"
              curl --fail --silent --show-error --request DELETE "$url" \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null
            done
          }

          cleanup() {
            local rc=0
            set +e
            if [ "$MUTATION_STARTED" -eq 1 ]; then
              d1_cleanup || rc=1
              kv_cleanup || rc=1
            fi
            set -e
            return "$rc"
          }

          on_exit() {
            local status=$?
            trap - EXIT
            if ! cleanup; then
              echo 'ERROR: Phase 14 exact fixture cleanup failed.' >&2
              exit 97
            fi
            exit "$status"
          }
          trap on_exit EXIT

          echo 'Phase 14 live matrix: starting read-only guards.'
          test "${{ github.event.pull_request.base.sha }}" = '458a67cee0f20b21a6083e7073190cfe14628867'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FPT_PORTAL_V2_EXCEL_SYNC_TOKEN"
          test "${#FPT_PORTAL_V2_EXCEL_SYNC_TOKEN}" -ge 24

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-settings.json
          jq -e '.success == true' /tmp/p14-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal V2 student login is enabled; refusing Phase 14 fixture work.' >&2; false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p14-settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p14-settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p14-settings.json)"
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-settings.json)"
          test "$R2" = 'fpt-materials-dev'
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-kv-namespaces.json
          jq -e '.success == true' /tmp/p14-kv-namespaces.json >/dev/null
          LEGACY="$(jq -r '[.result[]|select(.title=="FPT_LESSONS_TEST")|.id][0] // ""' /tmp/p14-kv-namespaces.json)"
          if [ -n "$LEGACY" ]; then test "$LESSONS" != "$LEGACY"; fi

          $W secret list --name "$WORKER_NAME" --format json >/tmp/p14-secret-list.json
          jq -e '.[] | select(.name == "EXCEL_SYNC_TOKEN")' /tmp/p14-secret-list.json >/dev/null
          echo 'Dedicated Excel sync secret is present. Value was not printed.'

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(DISTINCT portal_user_id_norm) AS assigned_users FROM student_batch_assignments; SELECT COUNT(*) AS assigned_user_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN (SELECT DISTINCT portal_user_id_norm FROM student_batch_assignments); SELECT COUNT(*) AS temp_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS temp_batches FROM batch_definitions WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT COUNT(*) AS temp_assignments FROM student_batch_assignments WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full') OR batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT COUNT(*) AS temp_releases FROM batch_lesson_releases WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/p14-d1-before.json 2>/tmp/p14-d1-before.err
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-d1-before.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p14-d1-before.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-d1-before.json)" = '4'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-d1-before.json)" = '0'
          test "$(jq -r '.[4].results[0].assigned_users' /tmp/p14-d1-before.json)" = '2'
          test "$(jq -r '.[5].results[0].assigned_user_entitlements' /tmp/p14-d1-before.json)" = '173'
          test "$(jq -r '.[6].results[0].temp_entitlements' /tmp/p14-d1-before.json)" = '0'
          test "$(jq -r '.[7].results[0].temp_batches' /tmp/p14-d1-before.json)" = '0'
          test "$(jq -r '.[8].results[0].temp_assignments' /tmp/p14-d1-before.json)" = '0'
          test "$(jq -r '.[9].results[0].temp_releases' /tmp/p14-d1-before.json)" = '0'
          grep -Fq 'trg_student_sessions_single_active' /tmp/p14-d1-before.json
          grep -Fq '"ok"' /tmp/p14-d1-before.json

          PREFIX="$(node -e 'process.stdout.write(encodeURIComponent("user:testy5p14"))')"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/keys?prefix=${PREFIX}&limit=100" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-temp-kv-before.json
          jq -e '.success == true and (.result|length) == 0' /tmp/p14-temp-kv-before.json >/dev/null

          for lesson in Y5M1 Y5E1; do
            url="$(kv_key_url "$LESSONS" "lesson:${lesson}")"
            curl --fail --silent --show-error "$url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --output "/tmp/p14-${lesson}.json"
          done
          jq -e '.lessonId == "Y5M1" and .subject == "maths" and .active != false and (.curriculumCodes|index("MATHS_L2")) != null' /tmp/p14-Y5M1.json >/dev/null
          jq -e '.lessonId == "Y5E1" and .subject == "english" and .active != false and (.curriculumCodes|index("ENGLISH_Y5")) != null' /tmp/p14-Y5E1.json >/dev/null

          echo 'Preflight passed: documented baseline and exact temporary fixture absence confirmed.'
          MUTATION_STARTED=1

          cat >/tmp/p14-user-m.json <<'JSON'
          {"firstName":"TestY5P14M","schoolYear":5,"vrEligible":false,"status":"active","expires":null,"batches":["P14_Y5M"],"fullLibraries":[],"manualAccess":{"coreLessons":[],"vrLessons":[],"specialBuckets":[]},"blockedLessons":[]}
          JSON
          cat >/tmp/p14-user-e.json <<'JSON'
          {"firstName":"TestY5P14E","schoolYear":5,"vrEligible":false,"status":"active","expires":null,"batches":["P14_Y5E"],"fullLibraries":[],"manualAccess":{"coreLessons":[],"vrLessons":[],"specialBuckets":[]},"blockedLessons":[]}
          JSON
          cat >/tmp/p14-user-11e.json <<'JSON'
          {"firstName":"TestY5P1411E","schoolYear":5,"vrEligible":true,"status":"active","expires":null,"batches":["P14_Y511E"],"fullLibraries":[],"manualAccess":{"coreLessons":[],"vrLessons":[],"specialBuckets":[]},"blockedLessons":[]}
          JSON
          cat >/tmp/p14-user-full.json <<'JSON'
          {"firstName":"TestY5P14FULL","schoolYear":5,"vrEligible":false,"status":"active","expires":null,"batches":["P14_Y5M"],"fullLibraries":["MATHS_L2_FULL"],"manualAccess":{"coreLessons":[],"vrLessons":[],"specialBuckets":[]},"blockedLessons":[]}
          JSON

          declare -A USER_FILES=(
            [testy5p14m]=/tmp/p14-user-m.json
            [testy5p14e]=/tmp/p14-user-e.json
            [testy5p1411e]=/tmp/p14-user-11e.json
            [testy5p14full]=/tmp/p14-user-full.json
          )
          for user in "${USERS[@]}"; do
            url="$(kv_key_url "$STUDENTS" "user:${user}")"
            curl --fail --silent --show-error --request PUT "$url" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${USER_FILES[$user]}" >/dev/null
          done

          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          SEED_SQL="INSERT INTO batch_definitions (batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to,created_at,updated_at) VALUES ('P14_Y5M','2026-27','maths',5,'normal',NULL,'2026-09-01',NULL,'${NOW}','${NOW}'),('P14_Y5E','2026-27','english',5,'normal',NULL,'2026-09-01',NULL,'${NOW}','${NOW}'),('P14_Y511E','2026-27','english',5,'11plus',NULL,'2026-09-01',NULL,'${NOW}','${NOW}'); INSERT INTO student_batch_assignments (portal_user_id_norm,batch_key,effective_from,effective_to,created_at,updated_at) VALUES ('testy5p14m','P14_Y5M','2026-09-15',NULL,'${NOW}','${NOW}'),('testy5p14e','P14_Y5E','2026-09-15',NULL,'${NOW}','${NOW}'),('testy5p1411e','P14_Y511E','2026-09-15',NULL,'${NOW}','${NOW}'),('testy5p14full','P14_Y5M','2026-09-15',NULL,'${NOW}','${NOW}');"
          $W d1 execute fpt_portal_v2_db --remote --json --command "$SEED_SQL" >/tmp/p14-seed.json 2>/tmp/p14-seed.err

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${FPT_PORTAL_V2_EXCEL_SYNC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"items":[{"syncRowId":"p14-full-precheck","operation":"status_check","portalUserId":"TestY5P14FULL","lessonId":"Y5M1","batchKey":"P14_Y5M","lessonDate":"2026-09-15"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync" >/tmp/p14-full-precheck.json
          jq -e '.ok == true and (.results|length)==1 and .results[0].status == "NOT_CONFIRMED" and .results[0].ok == false' /tmp/p14-full-precheck.json >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${FPT_PORTAL_V2_EXCEL_SYNC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"items":[{"syncRowId":"p14-maths","operation":"grant","portalUserId":"TestY5P14M","lessonId":"Y5M1","batchKey":"P14_Y5M","lessonDate":"2026-09-15"},{"syncRowId":"p14-english","operation":"grant","portalUserId":"TestY5P14E","lessonId":"Y5E1","batchKey":"P14_Y5E","lessonDate":"2026-09-15"},{"syncRowId":"p14-english-vr","operation":"grant","portalUserId":"TestY5P1411E","lessonId":"Y5E1","batchKey":"P14_Y511E","lessonDate":"2026-09-15"},{"syncRowId":"p14-full","operation":"grant","portalUserId":"TestY5P14FULL","lessonId":"Y5M1","batchKey":"P14_Y5M","lessonDate":"2026-09-15"},{"syncRowId":"p14-invalid","operation":"grant","portalUserId":"TestY5P14E","lessonId":"__P14_MISSING__","batchKey":"P14_Y5E","lessonDate":"2026-09-15"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync" >/tmp/p14-live.json
          jq -e '.ok == true and (.results|length)==5 and .summary.succeeded==4 and .summary.failed==1' /tmp/p14-live.json >/dev/null
          jq -e '[.results[].status] == ["CREATED","CREATED","CREATED","CREATED","LESSON_NOT_FOUND"]' /tmp/p14-live.json >/dev/null

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS temp_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS temp_releases FROM batch_lesson_releases WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT portal_user_id_norm,lesson_id,core_access,vr_access FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full') ORDER BY portal_user_id_norm;" \
            >/tmp/p14-d1-live.json 2>/tmp/p14-d1-live.err
          test "$(jq -r '.[0].results[0].temp_entitlements' /tmp/p14-d1-live.json)" = '4'
          test "$(jq -r '.[1].results[0].temp_releases' /tmp/p14-d1-live.json)" = '3'
          jq -e '.[2].results | length == 4' /tmp/p14-d1-live.json >/dev/null
          jq -e '.[2].results[] | select(.portal_user_id_norm=="testy5p14m") | .lesson_id=="Y5M1" and .core_access==1 and .vr_access==0' /tmp/p14-d1-live.json >/dev/null
          jq -e '.[2].results[] | select(.portal_user_id_norm=="testy5p14e") | .lesson_id=="Y5E1" and .core_access==1 and .vr_access==0' /tmp/p14-d1-live.json >/dev/null
          jq -e '.[2].results[] | select(.portal_user_id_norm=="testy5p1411e") | .lesson_id=="Y5E1" and .core_access==1 and .vr_access==1' /tmp/p14-d1-live.json >/dev/null
          jq -e '.[2].results[] | select(.portal_user_id_norm=="testy5p14full") | .lesson_id=="Y5M1" and .core_access==1 and .vr_access==0' /tmp/p14-d1-live.json >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${FPT_PORTAL_V2_EXCEL_SYNC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"items":[{"syncRowId":"p14-full-repeat","operation":"grant","portalUserId":"TestY5P14FULL","lessonId":"Y5M1","batchKey":"P14_Y5M","lessonDate":"2026-09-15"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync" >/tmp/p14-repeat.json
          jq -e '.results[0].status == "CONFIRMED" and .results[0].entitlement == "confirmed" and .results[0].batchRelease == "confirmed"' /tmp/p14-repeat.json >/dev/null

          echo 'Live remaining-matrix assertions passed; performing exact cleanup.'
          cleanup
          MUTATION_STARTED=0

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(DISTINCT portal_user_id_norm) AS assigned_users FROM student_batch_assignments; SELECT COUNT(*) AS assigned_user_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN (SELECT DISTINCT portal_user_id_norm FROM student_batch_assignments); SELECT COUNT(*) AS temp_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS temp_batches FROM batch_definitions WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT COUNT(*) AS temp_assignments FROM student_batch_assignments WHERE portal_user_id_norm IN ('testy5p14m','testy5p14e','testy5p1411e','testy5p14full') OR batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT COUNT(*) AS temp_releases FROM batch_lesson_releases WHERE batch_key IN ('P14_Y5M','P14_Y5E','P14_Y511E'); SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/p14-d1-after.json 2>/tmp/p14-d1-after.err
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-d1-after.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p14-d1-after.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-d1-after.json)" = '4'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-d1-after.json)" = '0'
          test "$(jq -r '.[4].results[0].assigned_users' /tmp/p14-d1-after.json)" = '2'
          test "$(jq -r '.[5].results[0].assigned_user_entitlements' /tmp/p14-d1-after.json)" = '173'
          test "$(jq -r '.[6].results[0].temp_entitlements' /tmp/p14-d1-after.json)" = '0'
          test "$(jq -r '.[7].results[0].temp_batches' /tmp/p14-d1-after.json)" = '0'
          test "$(jq -r '.[8].results[0].temp_assignments' /tmp/p14-d1-after.json)" = '0'
          test "$(jq -r '.[9].results[0].temp_releases' /tmp/p14-d1-after.json)" = '0'
          grep -Fq 'trg_student_sessions_single_active' /tmp/p14-d1-after.json
          grep -Fq '"ok"' /tmp/p14-d1-after.json

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/keys?prefix=${PREFIX}&limit=100" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-temp-kv-after.json
          jq -e '.success == true and (.result|length) == 0' /tmp/p14-temp-kv-after.json >/dev/null

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-settings-after.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-settings-after.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-settings-after.json)" = 'fpt-materials-dev'
          AFTER_LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-settings-after.json)"
          case "${AFTER_LOGIN,,}" in ''|'false') ;; *) false;; esac

          trap - EXIT
          echo 'Phase 14 guarded live remaining matrix: PASS; exact documented D1/KV baseline restored.'
