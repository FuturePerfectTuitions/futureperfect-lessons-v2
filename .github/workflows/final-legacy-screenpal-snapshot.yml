name: Final legacy ScreenPal metadata read-only snapshot

on:
  workflow_dispatch:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-legacy-screenpal-snapshot.yml

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve legacy lessons namespace read-only
        id: resolve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy-screenpal
          page="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100")"
          jq -e '.success == true' <<<"$page" >/dev/null
          jq -r '.result[] | [.title,.id] | @tsv' <<<"$page" > legacy-screenpal/namespaces.tsv
          ns="$(jq -r '.result[] | select(.title=="FPT_LESSONS_TEST") | .id' <<<"$page" | head -n1)"
          if [ -z "$ns" ] || [ "$ns" = null ]; then
            ns="$(jq -r '.result[] | select(.title=="FPT_LESSONS") | .id' <<<"$page" | head -n1)"
          fi
          test -n "$ns"; test "$ns" != null
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      - name: Export only non-user legacy content keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEGACY_NS: ${{ steps.resolve.outputs.ns }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          for key in Y4M Y4M11plus Y5M Y5M11plus Y6M; do
            encoded="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${LEGACY_NS}/values/${encoded}" > "legacy-screenpal/${key}.json"
            jq -e 'type=="array" or type=="object"' "legacy-screenpal/${key}.json" >/dev/null
          done

      - name: Reject user-shaped data
        shell: bash
        run: |
          set -euo pipefail
          if grep -ERqi '"(password|portalUserId|username|expires|manualAccess)"[[:space:]]*:' legacy-screenpal/*.json; then
            echo 'Unexpected user-shaped field found; refusing artifact.' >&2
            exit 1
          fi

      - name: Upload legacy ScreenPal metadata
        uses: actions/upload-artifact@v4
        with:
          name: final-legacy-screenpal-snapshot
          path: legacy-screenpal/
          retention-days: 7
