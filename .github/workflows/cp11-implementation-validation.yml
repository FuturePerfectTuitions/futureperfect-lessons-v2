name: CP11 Implementation Validation

on:
  push:
    branches:
      - rebuild/checkpoint11-implementation-build-2026-09-14
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_WORKER: fpt-portal-v2-worker
  WORKER_NAME: fpt-portal-v2-worker
  PROD_SHADOW_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  CHECKPOINT8_AS_OF_DATE: '2026-09-14'
  CHECKPOINT11_AS_OF_DATE: '2026-09-14'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          set -o pipefail
          {
            node --check rebuild/adminops/src/lib/compiler.mjs
            node --check rebuild/student/src/index.js
            node --check rebuild/student/src/lib/vr-howto-runtime.mjs
            node --check scripts/rebuild-checkpoint11-backfill.mjs
            node --check scripts/rebuild-checkpoint11-special-backfill.mjs
            node --check scripts/rebuild-checkpoint11-vr-howto-live-smoke.mjs
            node --check scripts/rebuild-checkpoint11-cutover.mjs
            node --check scripts/rebuild-checkpoint8-special-area-audit.mjs
            node --check tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          } 2>&1 | tee /tmp/cp11-validation-syntax.log
      - name: Main reversible-cutover orchestration includes VR How-To gates
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/rebuild-checkpoint11-reversible-cutover.yml
          grep -F 'scripts/rebuild-checkpoint11-special-backfill.mjs' "$WORKFLOW" >/dev/null
          grep -F 'tests/rebuild-checkpoint11-vr-howto-runtime.mjs' "$WORKFLOW" >/dev/null
          test "$(grep -c -F 'scripts/rebuild-checkpoint11-vr-howto-live-smoke.mjs' "$WORKFLOW")" -ge 2
          grep -F 'VR_HOWTO' "$WORKFLOW" >/dev/null
          grep -F 'manualAccess.specialBuckets' "$WORKFLOW" >/dev/null
          grep -F 'directGrantedCurrent==0' "$WORKFLOW" >/dev/null
          grep -F 'manualGrantedCurrent==3' "$WORKFLOW" >/dev/null
          echo REBUILD_CHECKPOINT11_MAIN_ORCHESTRATION_VR_HOWTO_PASS | tee /tmp/cp11-validation-orchestration.log
      - name: Backfill rerun safety is fail-closed and propagation-aware
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=scripts/rebuild-checkpoint11-backfill.mjs
          grep -F 'reusedVerifiedScopes' "$SCRIPT" >/dev/null
          grep -F 'waitForExactPointer' "$SCRIPT" >/dev/null
          grep -F 'strictPropagationVerification:true' "$SCRIPT" >/dev/null
          grep -F 'current?.sha256' "$SCRIPT" >/dev/null
          grep -F 'verifyStoredVersion' "$SCRIPT" >/dev/null
          echo REBUILD_CHECKPOINT11_BACKFILL_RERUN_SAFETY_PASS | tee /tmp/cp11-validation-backfill-rerun.log
      - name: Scope compatibility
        run: |
          set -o pipefail
          node tests/rebuild-checkpoint11-scope-compatibility.mjs 2>&1 | tee /tmp/cp11-validation-scope.log
      - name: VR How-To compatibility
        run: |
          set -o pipefail
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs 2>&1 | tee /tmp/cp11-validation-vr.log
      - name: Prior checkpoint regressions
        run: |
          set -o pipefail
          {
            node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
            node tests/rebuild-checkpoint8-backfill-access-parity.mjs
            node tests/rebuild-checkpoint6-new-student-worker.mjs
            node tests/rebuild-checkpoint5-auth-capability-core.mjs
            node tests/rebuild-checkpoint4-dual-write-compatibility.mjs
            node tests/rebuild-checkpoint3-atomic-publishing.mjs
            node tests/rebuild-checkpoint2-read-models.mjs
          } 2>&1 | tee /tmp/cp11-validation-regressions.log
      - name: Read-only live CP11 special-area gate
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/rebuild-checkpoint8-special-area-audit.mjs | tee /tmp/cp11-validation-live-special.json
          jq -e '.status=="PASS" and .profilesWithSpecialAreas==3 and .tokenCounts.VR_HOWTO==3 and .manualTokenCounts.VR_HOWTO==3 and (.directTokenCounts.VR_HOWTO // 0)==0 and .cp11RuntimeGate.enabled==true and .cp11RuntimeGate.compatible==true and (.cp11RuntimeGate.unsupportedCurrentTokens|length)==0 and .cp11RuntimeGate.catalogueRevision.checked==true and .cp11RuntimeGate.catalogueRevision.inSync==true' /tmp/cp11-validation-live-special.json >/dev/null
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp11-implementation-validation-logs
          path: |
            /tmp/cp11-validation-*.log
            /tmp/cp11-validation-live-special.json
          if-no-files-found: ignore
          retention-days: 30
