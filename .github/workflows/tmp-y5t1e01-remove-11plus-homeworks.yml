name: Temporary remove Y5T1E01 11+ homeworks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-y5t1e01-remove-11plus-homeworks.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  remove:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact live lesson state and prepare KV replacement
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accountId=String(process.env.CLOUDFLARE_ACCOUNT_ID||'').trim();
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'').trim();
          const workerName=String(process.env.WORKER_NAME||'').trim();
          if(!accountId||!token||!workerName) throw new Error('Missing Cloudflare configuration');
          const names=[
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Adventure.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Chiller.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fable.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fantasy.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Mystery.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Myths and Legends.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Sci-Fi.pdf',
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Traditional Tale.pdf'
          ];
          const target=new Set(names);
          async function cf(path,init={}) { const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{...init,headers:{Authorization:`Bearer ${token}`,...(init.body?{'Content-Type':'application/json'}:{}),...(init.headers||{})}}); const b=await r.json().catch(()=>null); if(!r.ok||!b?.success) throw new Error(`CF ${path} HTTP ${r.status}`); return b; }
          const settings=await cf(`/accounts/${accountId}/workers/scripts/${workerName}/settings`);
          const bind=(n,t)=>settings.result.bindings.find(x=>x?.name===n&&(!t||x?.type===t));
          const environment=String(bind('ENVIRONMENT','plain_text')?.text||'');
          const lessonsId=String(bind('LESSONS_KV','kv_namespace')?.namespace_id||'');
          const bucket=String(bind('MATERIALS_R2','r2_bucket')?.bucket_name||'');
          if(environment!=='production') throw new Error(`Refusing non-production environment: ${environment}`);
          if(!lessonsId||bucket!=='fpt-materials-dev') throw new Error(`Unexpected binding state bucket=${bucket}`);
          const buckets=await cf(`/accounts/${accountId}/r2/buckets`);
          const bucketNames=(buckets.result?.buckets||buckets.result||[]).map(x=>x?.name).filter(Boolean);
          if(bucketNames.length!==1||bucketNames[0]!==bucket) throw new Error(`Unexpected R2 bucket inventory: ${bucketNames.join(',')}`);
          const body=await cf(`/accounts/${accountId}/storage/kv/namespaces/${lessonsId}/bulk/get`,{method:'POST',body:JSON.stringify({keys:['lesson:Y5E2'],type:'text',withMetadata:false})});
          const raw=body?.result?.values?.['lesson:Y5E2'];
          if(!raw) throw new Error('lesson:Y5E2 missing');
          const rec=JSON.parse(String(raw));
          if(rec?.lessonId!=='Y5E2'||rec?.displayIds?.['english-year5']!=='Y5T1E01') throw new Error('Lesson identity/display ID mismatch');
          const pairs=rec?.phase11Resources?.elevenPlus?.homeworks;
          if(!Array.isArray(pairs)||pairs.length!==8) throw new Error(`Expected exactly 8 current 11+ homework pairs; found ${Array.isArray(pairs)?pairs.length:'missing'}`);
          const matched=[];
          for(const p of pairs){
            const key=String(p?.homework?.r2Key||'');
            const base=key.split('/').pop();
            if(target.has(base)) matched.push({pair:p,key,base});
          }
          if(matched.length!==8||new Set(matched.map(x=>x.base)).size!==8) throw new Error(`Expected 8 exact target pairs; found ${matched.length}`);
          if(matched.some(x=>x.pair?.answerPack!=null)) throw new Error('A target pair unexpectedly has an Answer Pack; refusing deletion');
          const allRefs=[]; function walk(v){if(Array.isArray(v))return v.forEach(walk);if(!v||typeof v!=='object')return;if(typeof v.r2Key==='string')allRefs.push(v.r2Key);Object.values(v).forEach(walk);} walk(rec);
          const exactRefs=allRefs.filter(k=>target.has(String(k).split('/').pop()));
          if(exactRefs.length!==8) throw new Error(`Target references occur ${exactRefs.length} times, expected 8`);
          fs.writeFileSync('/tmp/target-keys.txt',matched.map(x=>x.key).join('\n')+'\n');
          fs.writeFileSync('/tmp/meta.env',`LESSONS_KV_ID=${lessonsId}\nR2_BUCKET=${bucket}\n`);
          rec.phase11Resources.elevenPlus.homeworks=[];
          const afterRefs=[]; walkAfter(rec,afterRefs);
          function walkAfter(v,out){if(Array.isArray(v))return v.forEach(x=>walkAfter(x,out));if(!v||typeof v!=='object')return;if(typeof v.r2Key==='string')out.push(v.r2Key);Object.values(v).forEach(x=>walkAfter(x,out));}
          if(afterRefs.some(k=>target.has(String(k).split('/').pop()))) throw new Error('Target reference remained after mutation');
          fs.writeFileSync('/tmp/y5e2-before.json',String(raw));
          fs.writeFileSync('/tmp/y5e2-kv-bulk.json',JSON.stringify([{key:'lesson:Y5E2',value:JSON.stringify(rec)}]));
          console.log(JSON.stringify({status:'PREWRITE_PASS',environment,bucket,lessonKey:'lesson:Y5E2',displayId:'Y5T1E01',targetPairs:matched.length,answerPacksAmongTargets:0,resultingElevenPlusHomeworkPairs:0},null,2));
          NODE
          cat /tmp/meta.env >> "$GITHUB_ENV"

      - name: Reconfirm all eight exact R2 objects exist before writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-precheck
          n=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            n=$((n+1))
            npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${R2_BUCKET}/${key}" --file="/tmp/r2-precheck/${n}.pdf" --remote >/dev/null
          done </tmp/target-keys.txt
          test "$n" -eq 8
          echo "R2 precheck PASS: ${n}/8 objects present"

      - name: Remove all eight portal references from live LESSONS_KV
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} kv bulk put /tmp/y5e2-kv-bulk.json --namespace-id "$LESSONS_KV_ID" --remote >/tmp/kv-put.log
          echo 'LESSONS_KV write completed for lesson:Y5E2'

      - name: Verify portal lesson record no longer contains the eight homeworks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId=String(process.env.CLOUDFLARE_ACCOUNT_ID||'').trim();
          const token=String(process.env.CLOUDFLARE_API_TOKEN||'').trim();
          const lessonsId=String(process.env.LESSONS_KV_ID||'').trim();
          const targets=new Set([
            'Y5T1E01 11+ Homework Uplevelling Descriptive Writing Adventure.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Chiller.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fable.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Fantasy.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Mystery.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Myths and Legends.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Sci-Fi.pdf','Y5T1E01 11+ Homework Uplevelling Descriptive Writing Traditional Tale.pdf'
          ]);
          async function read(){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces/${lessonsId}/bulk/get`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({keys:['lesson:Y5E2'],type:'text',withMetadata:false})});const b=await r.json();if(!r.ok||!b?.success)throw new Error(`KV verify HTTP ${r.status}`);return JSON.parse(String(b?.result?.values?.['lesson:Y5E2']||'null'));}
          let ok=false;
          for(let attempt=1;attempt<=12;attempt++){
            const rec=await read(); const hw=rec?.phase11Resources?.elevenPlus?.homeworks;
            const refs=[]; (function walk(v){if(Array.isArray(v))return v.forEach(walk);if(!v||typeof v!=='object')return;if(typeof v.r2Key==='string')refs.push(v.r2Key);Object.values(v).forEach(walk)})(rec);
            const left=refs.filter(k=>targets.has(String(k).split('/').pop()));
            if(Array.isArray(hw)&&hw.length===0&&left.length===0){console.log(JSON.stringify({status:'PORTAL_KV_PASS',attempt,elevenPlusHomeworkPairs:0,targetReferencesRemaining:0}));ok=true;break;}
            if(attempt<12) await new Promise(r=>setTimeout(r,5000));
          }
          if(!ok) throw new Error('Live LESSONS_KV did not converge to target-free state');
          NODE

      - name: Delete the eight exact PDFs from the only R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            n=$((n+1))
            npx --yes wrangler@${WRANGLER_VERSION} r2 object delete "${R2_BUCKET}/${key}" --remote --force >/dev/null
            printf 'DELETED\t%s\n' "$key"
          done </tmp/target-keys.txt
          test "$n" -eq 8
          echo "R2 deletion commands completed: ${n}/8"

      - name: Final exact verification
        shell: bash
        run: |
          set -euo pipefail
          n=0
          remaining=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            n=$((n+1))
            tmp="/tmp/verify-$n.pdf"
            if npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${R2_BUCKET}/${key}" --file="$tmp" --remote >/dev/null 2>&1; then
              echo "STILL_PRESENT $key" >&2
              remaining=$((remaining+1))
            else
              printf 'ABSENT\t%s\n' "$key"
            fi
          done </tmp/target-keys.txt
          test "$n" -eq 8
          test "$remaining" -eq 0
          echo 'FINAL PASS: portal references 0/8; R2 objects remaining 0/8; removed 8/8.'
