name: Trial prepared access reconcile only

on:
  push:
    branches:
      - fix/trial-prepared-access-single-login-2026-09-21
    paths:
      - '.github/workflows/trial-prepared-access-reconcile-only.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
  PROD_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  PROD_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  TARGET_USER_NORM: trialeva

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Trial prepared-access publisher syntax
        run: node --check worker/src/trial-prepared-access-publisher.js

      - name: Repair TrialEva prepared access only and verify live state
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { publishTrialPreparedAccess } from './worker/src/trial-prepared-access-publisher.js';
          import { resolveCurrentScope } from './worker/src/access-read-model-sync.js';

          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const studentsKv=process.env.PROD_STUDENTS_KV_ID;
          const readKv=process.env.PROD_READ_MODELS_KV_ID;
          const db=process.env.PROD_D1_ID;
          const user=process.env.TARGET_USER_NORM;
          const expected=['maths-level1','maths-level2','english-year4-11plus'];
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}`;
          const headers={Authorization:`Bearer ${token}`};

          async function checked(response,label){
            const text=await response.text();
            if(!response.ok) throw new Error(`${label} ${response.status}: ${text.slice(0,300)}`);
            return text;
          }
          async function kvGet(ns,key,options={}){
            const r=await fetch(`${base}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers});
            if(r.status===404) return null;
            const text=await checked(r,`KV GET ${key}`);
            return options?.type==='json'?JSON.parse(text):text;
          }
          async function kvPut(ns,key,value){
            const r=await fetch(`${base}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{
              method:'PUT',headers:{...headers,'content-type':'text/plain'},body:String(value)
            });
            await checked(r,`KV PUT ${key}`);
          }
          async function d1(sql,params=[]){
            const r=await fetch(`${base}/d1/database/${db}/query`,{
              method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({sql,params})
            });
            const body=JSON.parse(await checked(r,'D1 query'));
            if(body.success!==true) throw new Error(`D1 failed: ${JSON.stringify(body.errors||[])}`);
            return body.result?.[0]?.results||[];
          }
          function dbAdapter(){
            return {prepare(sql){let params=[];return {bind(...values){params=values;return this;},async all(){return {results:await d1(sql,params)};},async first(){return (await d1(sql,params))[0]||null;}};}};
          }
          function sameSet(a,b){
            const left=[...a].map(String).sort();
            const right=[...b].map(String).sort();
            return left.length===right.length && left.every((value,index)=>value===right[index]);
          }
          async function consumptionRows(){
            return d1('SELECT consumed_at FROM trial_login_consumptions WHERE portal_user_id_norm = ? ORDER BY consumed_at',[user]);
          }

          const canonical=await kvGet(studentsKv,`user:${user}`,{type:'json'});
          if(!canonical) throw new Error('TrialEva canonical profile is missing.');
          const canonicalViews=Array.isArray(canonical.trialViews)?canonical.trialViews.map(String):[];
          if(!sameSet(canonicalViews,expected)) throw new Error(`Canonical TrialEva views are not the expected three: ${JSON.stringify(canonicalViews)}`);

          const beforeConsumption=await consumptionRows();
          if(beforeConsumption.length>1) throw new Error(`Unexpected duplicate TrialEva consumption rows: ${beforeConsumption.length}`);
          fs.writeFileSync('/tmp/trialeva-consumption-before.json',JSON.stringify(beforeConsumption));

          const env={
            STUDENTS_KV:{get:(key,options)=>kvGet(studentsKv,key,options)},
            READ_MODELS_KV:{get:(key,options)=>kvGet(readKv,key,options),put:(key,value)=>kvPut(readKv,key,value)},
            DB:dbAdapter()
          };

          const published=await publishTrialPreparedAccess(env,user);
          if(!published?.ok) throw new Error('TrialEva prepared-access publish did not return ok.');
          if(!sameSet(published.trialViews||[],expected)) throw new Error(`Publisher returned unexpected Trial views: ${JSON.stringify(published.trialViews||[])}`);
          if(Number(published.viewCount||0)!==3) throw new Error(`Expected 3 prepared Trial views, got ${published.viewCount}.`);
          if(Number(published.lessonAccessCount||0)<=0) throw new Error('Publisher returned zero lesson access.');

          const store={get:key=>kvGet(readKv,key),put:(key,value)=>kvPut(readKv,key,value)};
          const resolved=await resolveCurrentScope(store,`access:${published.scopeId}`);
          const snapshot=resolved?.payload?.snapshot;
          if(!snapshot) throw new Error('Prepared TrialEva snapshot missing after publish.');
          const preparedViews=Array.isArray(snapshot.account?.trialViews)?snapshot.account.trialViews.map(String):[];
          if(snapshot.account?.trial!==true || !sameSet(preparedViews,expected)) throw new Error(`Prepared account Trial metadata mismatch: ${JSON.stringify(snapshot.account||{})}`);
          const viewRows=Array.isArray(snapshot.views)?snapshot.views:[];
          const viewIds=viewRows.map(row=>String(row?.viewId||''));
          if(viewRows.length!==3 || !expected.every(id=>viewIds.includes(id))) throw new Error(`Prepared views mismatch: ${JSON.stringify(viewIds)}`);
          for(const id of expected){
            const row=viewRows.find(item=>String(item?.viewId||'')===id);
            if(Number(row?.openLessonCount||0)<=0) throw new Error(`Prepared view ${id} has no open lessons.`);
            if(row?.lockedPreview===true) throw new Error(`Prepared view ${id} is still locked preview.`);
          }
          const lessonAccessCount=Object.keys(snapshot.lessonAccess||{}).length;
          if(lessonAccessCount<=0) throw new Error('Prepared lessonAccess is empty after publish.');

          const afterConsumption=await consumptionRows();
          if(JSON.stringify(afterConsumption)!==JSON.stringify(beforeConsumption)) {
            throw new Error(`TrialEva one-login state changed during prepared-access repair. before=${JSON.stringify(beforeConsumption)} after=${JSON.stringify(afterConsumption)}`);
          }

          const result={
            marker:'TRIALEVA_PREPARED_ACCESS_REPAIR_PASS',
            canonicalViews,
            preparedViews,
            preparedViewIds:viewIds,
            viewCount:viewRows.length,
            lessonAccessCount,
            oneLoginStatePreserved:true,
            consumptionRows:afterConsumption.length,
            preparedVersion:resolved.version,
            publisherReused:published.reused===true
          };
          fs.writeFileSync('/tmp/trialeva-prepared-access-repair.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trialeva-prepared-access-repair
          path: /tmp/trialeva-prepared-access-repair.json
          retention-days: 14
          if-no-files-found: ignore
