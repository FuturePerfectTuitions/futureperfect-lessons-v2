name: R2 Drive Y5 guarded apply
on:
  push:
    branches: [ops/r2-drive-sync-y5]
    paths:
      - .github/r2-drive-y5-apply-trigger.txt
permissions:
  contents: read
concurrency:
  group: r2-drive-y5-apply
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
  CONFIRM_YEAR5_APPLY: YES
jobs:
  reconcile-year5:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Reconcile current Year 5 English and Maths from Drive to R2
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_y5_apply.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y5-r2-reconciliation-summary
          path: y5-r2-reconciliation-summary.json
          retention-days: 30
