name: Hotfix - restore development Admin all-access catalogue visibility

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/hotfix-restore-development-admin-all-access.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore development-only Admin catalogue access
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, requests, urllib.parse, datetime
          api='https://api.cloudflare.com/client/v4'
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          h={'Authorization':f'Bearer {token}'}
          worker='fpt-portal-v2-worker'

          settings=requests.get(f'{api}/accounts/{acct}/workers/scripts/{worker}/settings',headers=h,timeout=60).json()
          assert settings.get('success'), settings
          bindings=settings['result']['bindings']
          env=next(x.get('text') for x in bindings if x.get('name')=='ENVIRONMENT')
          students=next(x.get('namespace_id') for x in bindings if x.get('name')=='STUDENTS_KV')
          lessons=next(x.get('namespace_id') for x in bindings if x.get('name')=='LESSONS_KV')
          db=next(x.get('id') for x in bindings if x.get('name')=='DB')
          assert env=='development', 'STOP: not development'
          assert students and lessons and db

          def kv_get(ns,key):
            r=requests.get(f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'+urllib.parse.quote(key,safe=''),headers=h,timeout=60)
            r.raise_for_status()
            return r.json()

          user=kv_get(students,'user:admin')
          assert user.get('demoAdminAllAccess') is True, 'STOP: user:admin is not marked demoAdminAllAccess'

          curricula=[
            'MATHS_Y2','MATHS_Y3','MATHS_L1','MATHS_L2','MATHS_L3','MATHS_Y6_EXTRA',
            'ENGLISH_Y2','ENGLISH_Y3','ENGLISH_Y4','ENGLISH_Y5','ENGLISH_Y6'
          ]
          lesson_ids=[]
          for code in curricula:
            cur=kv_get(lessons,'curriculum:'+code)
            ids=cur.get('lessonIds') or cur.get('lessons') or cur.get('items') or []
            for item in ids:
              lid=item if isinstance(item,str) else str((item or {}).get('lessonId') or '').strip()
              if lid and lid not in lesson_ids: lesson_ids.append(lid)
          assert len(lesson_ids) >= 300, f'Unexpected catalogue size: {len(lesson_ids)}'

          manual=dict(user.get('manualAccess') or {})
          existing=[str(x).strip() for x in manual.get('coreLessons') or [] if str(x).strip()]
          manual['coreLessons']=list(dict.fromkeys(existing+lesson_ids))
          user['manualAccess']=manual

          full=[str(x).strip().upper() for x in user.get('fullLibraries') or [] if str(x).strip()]
          full += [
            'MATHS_L1_FULL','MATHS_L2_FULL','MATHS_L3_FULL','MATHS_Y6_FULL',
            'ENGLISH_Y4_11PLUS_FULL','ENGLISH_Y5_11PLUS_FULL'
          ]
          user['fullLibraries']=list(dict.fromkeys(full))

          historical=[str(x).strip().lower() for x in user.get('historicalViews') or [] if str(x).strip()]
          historical += [
            'maths-year2','maths-year3','maths-year4','maths-year5','maths-year6',
            'maths-level1','maths-level2','maths-level3',
            'english-year2','english-year3','english-year4','english-year4-11plus',
            'english-year5','english-year5-11plus','english-year6'
          ]
          user['historicalViews']=list(dict.fromkeys(historical))

          key_url=f'{api}/accounts/{acct}/storage/kv/namespaces/{students}/values/'+urllib.parse.quote('user:admin',safe='')
          put=requests.put(key_url,headers={**h,'Content-Type':'application/json'},data=json.dumps(user,separators=(',',':')).encode(),timeout=60).json()
          assert put.get('success'), put

          # Refresh any currently active Admin session projection so the open browser
          # sees the restored profile immediately instead of waiting for re-login.
          safe=dict(user)
          safe.pop('p',None)
          safe.pop('answerPassword',None)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          payload={
            'sql':'UPDATE student_session_profiles SET user_json=?, updated_at=? WHERE portal_user_id_norm=?',
            'params':[json.dumps(safe,separators=(',',':')),now,'admin']
          }
          q=requests.post(f'{api}/accounts/{acct}/d1/database/{db}/query',headers={**h,'Content-Type':'application/json'},json=payload,timeout=60).json()
          assert q.get('success'), q

          check=kv_get(students,'user:admin')
          assert check.get('demoAdminAllAccess') is True
          assert len((check.get('manualAccess') or {}).get('coreLessons') or []) >= len(lesson_ids)
          assert {'MATHS_L1_FULL','MATHS_L2_FULL','MATHS_L3_FULL','ENGLISH_Y4_11PLUS_FULL','ENGLISH_Y5_11PLUS_FULL'}.issubset(set(check.get('fullLibraries') or []))
          print(json.dumps({
            'status':'PASS',
            'environment':env,
            'adminCoreLessonCount':len((check.get('manualAccess') or {}).get('coreLessons') or []),
            'fullLibraries':check.get('fullLibraries') or [],
            'historicalViewCount':len(check.get('historicalViews') or [])
          },indent=2))
          print('DEVELOPMENT_ADMIN_ALL_ACCESS_RESTORED')
          PY