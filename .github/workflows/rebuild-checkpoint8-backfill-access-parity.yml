name: CP12 entitlement population audit - read only

on:
  push:
    branches:
      - audit/cp12-entitlement-population-2026-09-14
    paths:
      - '.github/workflows/rebuild-checkpoint8-backfill-access-parity.yml'
      - 'scripts/rebuild-checkpoint8-live-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entitlement-population-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      STUDENT_WORKER_NAME: fpt-portal-v2-rebuild-student-prod
      BROWSER_WORKER_NAME: fpt-portal-v2-rebuild-browser-prod
      CHECKPOINT8_AS_OF_DATE: '2026-09-14'
      AYLA_PORTAL_ID: Ayla0108
      REINA_PORTAL_ID: Rei0710
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm read-only credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Cloudflare credentials are present; values are not printed.'
      - name: Syntax check population audit
        run: node --check scripts/rebuild-checkpoint8-live-audit.mjs
      - name: Audit every current student source entitlement against published access
        run: node scripts/rebuild-checkpoint8-live-audit.mjs
      - name: Upload complete entitlement audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-entitlement-population-audit
          path: /tmp/cp12-entitlement-population-audit.json
          if-no-files-found: error
          retention-days: 30
