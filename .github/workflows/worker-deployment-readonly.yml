name: Production Worker deployment read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/worker-deployment-readonly.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Read current deployment and bindings only
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          deployments="$(curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/deployments")"
          jq -e '.success == true' <<<"$deployments" >/dev/null
          echo 'CURRENT_DEPLOYMENT:'
          jq '.result.deployments[0]' <<<"$deployments"
          echo 'RECENT_DEPLOYMENTS:'
          jq '[.result.deployments[:5][] | {id,created_on,source,annotations,versions}]' <<<"$deployments"

          settings="$(curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          echo 'BINDING_NAMES:'
          jq '[.result.bindings[]? | {name,type}]' <<<"$settings"
          echo 'READ_ONLY_COMPLETE=true'
