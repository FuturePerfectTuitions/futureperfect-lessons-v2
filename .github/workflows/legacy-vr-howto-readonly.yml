name: Legacy VR How-To read-only audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/legacy-vr-howto-readonly.yml'
      - '.github/legacy-vr-howto-readonly-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER_NAME: frosty-rain-828e
      LEGACY_LESSONS_KV_ID: 80e5015aeb7046aa917189304a093a7c
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Confirm read-only audit credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Credentials present; values are not printed.'

      - name: Read legacy Worker bindings only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${LEGACY_WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/legacy-worker-settings.json
          jq '{success, errors, result: {bindings: [(.result.bindings // [])[] | {name, type, namespace_id, bucket_name, database_id}]}}' /tmp/legacy-worker-settings.json

      - name: List only legacy lesson keys relevant to VR How-To
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$LEGACY_LESSONS_KV_ID" --remote > /tmp/legacy-keys.json
          jq '[.[] | .name | select(test("HOWTO|HowTo|howto|VR_HOW|VRHOW|VR_HOWTO|HOW_TO"))]' /tmp/legacy-keys.json

      - name: Read candidate VR How-To values only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest kv key list --namespace-id "$LEGACY_LESSONS_KV_ID" --remote > /tmp/legacy-keys.json
          mapfile -t keys < <(jq -r '.[] | .name | select(test("HOWTO|HowTo|howto|VR_HOW|VRHOW|VR_HOWTO|HOW_TO"))' /tmp/legacy-keys.json)
          test "${#keys[@]}" -gt 0
          for key in "${keys[@]}"; do
            echo "=== KEY: ${key} ==="
            npx --yes wrangler@latest kv key get "$key" --namespace-id "$LEGACY_LESSONS_KV_ID" --remote
            echo
          done

      - name: Confirm no writes performed
        run: echo 'Legacy VR How-To read-only audit complete. No Cloudflare write/deploy command was executed.'
