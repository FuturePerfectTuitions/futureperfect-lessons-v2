name: Home live counts branch verification

on:
  push:
    branches: [fix/home-live-catalogue-counts]
    paths:
      - '.github/workflows/home-live-counts-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify home count reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/live-student-catalogue-overlay.js
          node tests/live-student-catalogue-overlay-verification.mjs
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'LIVE_HOME_COUNTS_AUTHORITY_V1' worker/src/live-student-catalogue-overlay.js
          echo 'HOME_LIVE_COUNTS_BRANCH_PASS'
