name: Recover exact browser Worker source

on:
  push:
    branches:
      - ops/purge-lessons-cache-20261002
    paths:
      - '.github/workflows/recover-browser-worker-source-20261002.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-rebuild-browser-prod
    steps:
      - name: Download exact deployed Worker and print source
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error             --dump-header /tmp/package.headers             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"             "${AUTH[@]}" -o /tmp/package.bin
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          import hashlib,re,pathlib
          headers=pathlib.Path('/tmp/package.headers').read_text('latin-1',errors='replace')
          body=pathlib.Path('/tmp/package.bin').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ct=m.group(1).strip()
          msg=BytesParser(policy=default).parsebytes(
            ('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+body
          )
          found=None
          for p in msg.iter_parts():
            name=p.get_filename() or p.get_param('name',header='content-disposition') or p.get_param('name')
            if name=='index.js':
              found=p.get_payload(decode=True) or b''
              break
          if found is None:
            raise SystemExit('index.js not found')
          digest=hashlib.sha256(found).hexdigest()
          print('INDEX_JS_SHA256',digest)
          if digest!='2257d56c5cd930dacfefa00f310eb5f9bc2db6cd18e3ebf16fb7d8c4ad4c3cbd':
            raise SystemExit('unexpected deployed index.js hash')
          print('---BEGIN INDEX.JS---')
          print(found.decode('utf-8'))
          print('---END INDEX.JS---')
          PY
