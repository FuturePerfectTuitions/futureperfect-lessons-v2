name: Admin console live read-only verification

on:
  push:
    branches: [verify/admin-console-live-2026-09-22]
    paths: ['.github/workflows/admin-console-live-readonly-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      ORIGIN: https://lessons.futureperfect.education
      PAGES: https://futureperfecttuitions.github.io/futureperfect-lessons-v2
    steps:
      - uses: actions/checkout@v4
      - name: Verify live protected Admin endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          for route in \
            /api/v1/admin/trials/list \
            /api/v1/admin/trials/delete \
            /api/v1/admin/students/batches \
            /api/v1/admin/students/create; do
            code="$(curl -sS -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}' -o /tmp/body.json -w '%{http_code}' "$BASE$route")"
            echo "$route => $code $(cat /tmp/body.json)"
            test "$code" = 401
            grep -Fq 'UNAUTHORISED' /tmp/body.json
          done
          echo ADMIN_NEW_ROUTES_LIVE_PROTECTED_PASS
      - name: Verify deployed Worker contains new Admin implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/${WORKER_NAME}" -o /tmp/worker.bin
          grep -aFq '/api/v1/admin/students/create' /tmp/worker.bin
          grep -aFq '/api/v1/admin/students/batches' /tmp/worker.bin
          grep -aFq '/api/v1/admin/trials/delete' /tmp/worker.bin
          grep -aFq 'TRIAL_PROFILE_DELETE_VERIFY_FAILED' /tmp/worker.bin
          grep -aFq 'STUDENT_PROVISION_FAILED' /tmp/worker.bin
          echo ADMIN_NEW_IMPLEMENTATION_LIVE_PASS
      - name: Verify published Admin page assets
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS "$PAGES/assets/admin-trials.js?verify=${GITHUB_SHA}" -o /tmp/admin-trials.js \
              && grep -Fq "button('Delete', 'delete'" /tmp/admin-trials.js \
              && grep -Fq 'Create Student Login' /tmp/admin-trials.js \
              && grep -Fq 'grid.prepend(releaseCard)' /tmp/admin-trials.js; then
              echo ADMIN_PAGES_ENHANCEMENTS_LIVE_PASS
              exit 0
            fi
            sleep 5
          done
          echo 'Admin Pages enhancement markers not live.' >&2
          exit 1
      - name: Fingerprint hidden quiz bridge without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -H "Origin: $ORIGIN" -o /tmp/eligibility.json -w '%{http_code}' "$BASE/api/v1/student/quiz/eligibility")"
          echo "quiz eligibility unauthenticated => $code $(cat /tmp/eligibility.json)"
          if test "$code" = 401 && grep -Fq 'eligible' /tmp/eligibility.json; then
            echo HIDDEN_QUIZ_BRIDGE_PRESENT
          else
            echo HIDDEN_QUIZ_BRIDGE_NOT_PRESENT
          fi
          exit 0
