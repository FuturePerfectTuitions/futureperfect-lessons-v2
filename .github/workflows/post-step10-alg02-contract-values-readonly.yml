name: Post-Step-10 ALG-02 contract values read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-alg02-contract-values-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Extract ALG-02 contract values only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-alg02-contract-values-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT question_id,difficulty_band,presentation_type,diagram_type,diagram_spec_json,validation_spec_json,correct_option,correct_display,earliest_release_point,prerequisite_lessons,lifecycle_status,deployment_status FROM question_instance WHERE family_id='ALG-02' AND lifecycle_status='Live' ORDER BY question_id;" --json >/tmp/raw.json
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=json.loads(Path('/tmp/raw.json').read_text())[0]['results']
          out=[]
          for r in rows:
              d=json.loads(r['diagram_spec_json']) if r.get('diagram_spec_json') else {}
              v=json.loads(r['validation_spec_json']) if r.get('validation_spec_json') else {}
              rc=d.get('render_contract') or {}
              out.append({
                  'question_id':r['question_id'],
                  'difficulty_band':r['difficulty_band'],
                  'presentation_type':r['presentation_type'],
                  'diagram_type':r['diagram_type'],
                  'formula':d.get('formula'),
                  'diagram_w':d.get('w'),
                  'diagram_h':d.get('h'),
                  'validation_type':v.get('type'),
                  'validation_w':v.get('w'),
                  'validation_h':v.get('h'),
                  'validation_c':v.get('c'),
                  'correct_option':r.get('correct_option'),
                  'correct_display':r.get('correct_display'),
                  'earliest_release_point':r.get('earliest_release_point'),
                  'prerequisite_lessons':r.get('prerequisite_lessons'),
                  'deployment_status':r.get('deployment_status'),
                  'viewBox':rc.get('viewBox'),
                  'min_font_px':rc.get('min_font_px'),
                  'min_stroke_px':rc.get('min_stroke_px'),
                  'responsive':rc.get('responsive')
              })
          if len(out)!=6:
              raise SystemExit(f'Expected 6 ALG-02 Live rows, found {len(out)}')
          with open('/tmp/alg02_contract_values.csv','w',newline='',encoding='utf-8') as h:
              w=csv.DictWriter(h,fieldnames=out[0].keys()); w.writeheader(); w.writerows(out)
          print(json.dumps({
              'marker':'POST_STEP10_ALG02_CONTRACT_VALUES_READONLY_PASS',
              'live_rows':len(out),
              'question_ids':[x['question_id'] for x in out],
              'raw_question_text_exported':False,
              'raw_source_text_exported':False,
              'd1_write_performed':False
          },indent=2))
          PY
          rm -f /tmp/raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-alg02-contract-values-readonly
          path: /tmp/alg02_contract_values.csv
          retention-days: 30
