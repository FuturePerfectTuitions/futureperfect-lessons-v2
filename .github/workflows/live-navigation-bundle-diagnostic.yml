name: Live navigation bundle diagnostic

on:
  push:
    branches: [diag/live-navigation-bundle]
    paths:
      - '.github/workflows/live-navigation-bundle-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Inspect deployed Worker for bundled catalogue data
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker.bin
          echo "worker_bytes=$(wc -c </tmp/worker.bin)"
          for marker in \
            'catalogueSha256' \
            '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' \
            'curriculumCode' \
            'MATHS_L1' \
            'Y4M36' \
            'Transition to Level 1' \
            'Y4M35' \
            'Shapes 3'; do
            if grep -aFq "$marker" /tmp/worker.bin; then
              echo "marker_present=$marker"
            else
              echo "marker_absent=$marker"
            fi
          done
          # Stronger structural proof: these three navigation-only strings should
          # coexist in the deployed script after manifest generation.
          grep -aFq 'catalogueSha256' /tmp/worker.bin
          grep -aFq 'curriculumCode' /tmp/worker.bin
          grep -aFq 'Transition to Level 1' /tmp/worker.bin
          echo 'LIVE_BUNDLED_NAVIGATION_DATA_PASS'
