name: R2 Drive Y4 target filename audit

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y4
    paths:
      - .github/workflows/r2-drive-y4-target-name-audit.yml
      - scripts/r2_drive_y4_target_name_audit.py

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  audit-y4-target-names:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Audit final Year 4 R2 target filenames without mutation
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_y4_target_name_audit.py
      - name: Upload target filename audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y4-final-target-filename-audit
          path: y4-final-target-filename-audit.json
          if-no-files-found: warn
          retention-days: 30
