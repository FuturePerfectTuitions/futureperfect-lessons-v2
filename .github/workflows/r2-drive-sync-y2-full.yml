name: R2 Drive sync Y2 full

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y2
    paths:
      - .github/workflows/r2-drive-sync-y2-full.yml
      - scripts/r2_drive_sync_y2_full.py

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  reconcile-year2:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --quiet google-auth requests

      - name: Reconcile all Year 2 English and Maths from Drive to R2
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_sync_y2_full.py

      - name: Upload reconciliation audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y2-r2-reconciliation-summary
          path: y2-r2-reconciliation-summary.json
          if-no-files-found: warn
          retention-days: 30
