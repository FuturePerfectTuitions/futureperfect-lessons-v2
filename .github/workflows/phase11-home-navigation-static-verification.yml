name: Phase 11 home navigation static verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/phase7.js'
      - 'tests/phase11-home-navigation-static-verification.mjs'
      - '.github/workflows/phase11-home-navigation-static-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify Phase 11 home navigation readiness
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/phase7.js
          node --experimental-default-type=module tests/phase11-home-navigation-static-verification.mjs
