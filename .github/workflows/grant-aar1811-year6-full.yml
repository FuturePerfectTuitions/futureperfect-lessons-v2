name: One-off Aar1811 full Year 6 access

on:
  push:
    branches: [main]
    paths:
      - 'ops/grant-aar1811-year6-full.mjs'
      - '.github/workflows/grant-aar1811-year6-full.yml'

permissions:
  contents: read

concurrency:
  group: portal-v2-aar1811-year6-full-access
  cancel-in-progress: false

env:
  WORKER_NAME: fpt-portal-v2-worker
  EXPECTED_STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_PROD_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guarded operation source
        shell: bash
        run: |
          set -euo pipefail
          node --check ops/grant-aar1811-year6-full.mjs
          node --check worker/src/access-read-model-sync.js
          grep -Fq "'maths-year6'" worker/src/access-read-model-sync.js
          grep -Fq "MATHS_Y6_FULL" worker/src/access-read-model-sync.js
          grep -Fq "'english-year6'" worker/src/access-read-model-sync.js
          grep -Fq "ENGLISH_Y6_FULL" worker/src/access-read-model-sync.js
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Grant and verify full Year 6 access
        shell: bash
        run: |
          set -euo pipefail
          node ops/grant-aar1811-year6-full.mjs
          jq -e '
            .marker == "AAR1811_YEAR6_FULL_ACCESS_PASS" and
            .status == "PASS" and
            (.requiredLibraries | sort) == (["MATHS_Y6_FULL","ENGLISH_Y6_FULL"] | sort) and
            (.requiredViews | sort) == (["maths-year6","english-year6"] | sort) and
            .year6CatalogueLessonCount > 0 and
            .explicitYear6Blocks == 0 and
            .unrelatedProfileFieldsPreserved == true and
            .credentialsDisclosed == false and
            .canonicalReadbackVerified == true and
            .preparedReadbackVerified == true and
            .rollbackInvoked == false
          ' /tmp/aar1811-year6-full-evidence.json >/dev/null
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar1811-year6-full-access-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: /tmp/aar1811-year6-full-evidence.json
