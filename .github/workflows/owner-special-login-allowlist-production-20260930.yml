name: Owner special login allowlist production admission

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-special-login-allowlist-production-20260930.yml'

permissions:
  contents: read

jobs:
  admit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Owner special login allowlist admission forward-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove production Worker source is unchanged from last deploy
        run: |
          set -euo pipefail
          git diff --exit-code 3eb6509471a1b7501b0d2905052061b8c78d9ded -- \
            worker/src worker/wrangler.toml ops/deploy_current_worker_preserve.sh
          echo 'OWNER_LOGIN_WORKER_SOURCE_UNCHANGED_PASS'
      - name: Admit owner-scoped IDs and deploy unchanged Worker forward-only
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$auth" "$api/workers/scripts/${WORKER_NAME}/settings" > /tmp/owner-login-settings-before.json
          current="$(jq -r '[.result.bindings[]|select(.name=="PROD_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/owner-login-settings-before.json)"
          test -n "$current"
          printf '%s' "$current" > /tmp/owner-login-allowlist-before.txt
          echo "::add-mask::$current"
          updated="$(python3 - "$current" <<'PY'
          import sys
          values=[]
          seen=set()
          for raw in sys.argv[1].split(',') + ['admin0206','admin0411']:
              value=raw.strip().lower()
              if value and value not in seen:
                  seen.add(value); values.append(value)
          print(','.join(values), end='')
          PY
          )"
          test -n "$updated"
          echo "::add-mask::$updated"
          export OWNER_PROD_LOGIN_ALLOWLIST="$updated"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('ops/deploy_current_worker_preserve.sh')
          text=path.read_text()
          old='  printf \'PROD_LOGIN_ALLOWLIST = "%s"\\n\' "$(plain PROD_LOGIN_ALLOWLIST)"'
          new='  printf \'PROD_LOGIN_ALLOWLIST = "%s"\\n\' "$OWNER_PROD_LOGIN_ALLOWLIST"'
          if old not in text:
              raise SystemExit('preserve deploy allowlist line not found')
          path.write_text(text.replace(old,new,1))
          PY
          bash ops/deploy_current_worker_preserve.sh
          curl -fsS -H "$auth" "$api/workers/scripts/${WORKER_NAME}/settings" > /tmp/owner-login-settings-after.json
          before="$(cat /tmp/owner-login-allowlist-before.txt)"
          after="$(jq -r '[.result.bindings[]|select(.name=="PROD_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/owner-login-settings-after.json)"
          echo "::add-mask::$after"
          python3 - "$before" "$after" <<'PY'
          import sys
          def ids(text): return {x.strip().lower() for x in text.split(',') if x.strip()}
          before,after=map(ids,sys.argv[1:3])
          required={'admin0206','admin0411'}
          assert before <= after, 'existing production login IDs were lost'
          assert required <= after, 'owner login IDs missing after deploy'
          print(f'OWNER_LOGIN_ALLOWLIST_PRESERVED_PASS beforeCount={len(before)} afterCount={len(after)}')
          PY
          superusers="$(jq -r '[.result.bindings[]|select(.name=="ADMIN_SUPERUSER_IDS" and .type=="plain_text")|.text][0] // ""' /tmp/owner-login-settings-after.json)"
          python3 - "$superusers" <<'PY'
          import sys
          values={x.strip().lower() for x in sys.argv[1].split(',') if x.strip()}
          assert 'admin0206' not in values and 'admin0411' not in values, 'owner IDs must not be generic admin superusers'
          print('OWNER_LOGIN_NOT_GENERIC_SUPERUSER_PASS')
          PY
      - name: Verify both live Portal logins and requested access boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('ops/verify_owner_special_logins_live_20260930.sh')
          text=path.read_text()
          old='''  jq -nc --arg u "$id" --rawfile p "$work/credential.txt" '{username:$u,password:$p}' > "$work/login-body.json"'''
          new='''  jq -nc --arg u "$id" --arg p "$(tr -d '\\r\\n' < "$work/credential.txt")" '{username:$u,password:$p}' > "$work/login-body.json"'''
          if old not in text:
              raise SystemExit('expected live verifier credential line not found')
          path.write_text(text.replace(old,new,1))
          PY
          bash ops/verify_owner_special_logins_live_20260930.sh
