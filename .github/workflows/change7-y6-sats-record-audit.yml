name: Change 7 Year 6 SATs record audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/change7-y6-sats-record-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - name: Dump SATS lesson records
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/settings.json
          ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings.json)"
          for n in 51 52 57 59 60 68 69; do
            echo "=== lesson:Y6M${n} ==="
            npx --yes wrangler@4.125.0 kv key get "lesson:Y6M${n}" --namespace-id "$ID" --remote
          done
