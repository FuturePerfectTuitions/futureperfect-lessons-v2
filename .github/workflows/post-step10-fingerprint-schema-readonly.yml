name: Post-Step-10 fingerprint schema read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-fingerprint-schema-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Read question table schemas only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-fingerprint-schema-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "PRAGMA table_info(gl_source_question);" --json >/tmp/gl_schema.json
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "PRAGMA table_info(question_instance);" --json >/tmp/qi_schema.json
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=[]
          for table,path in [('gl_source_question','/tmp/gl_schema.json'),('question_instance','/tmp/qi_schema.json')]:
              payload=json.loads(Path(path).read_text())
              for r in payload[0]['results']:
                  rows.append({'table':table,'cid':r['cid'],'name':r['name'],'type':r['type'],'notnull':r['notnull'],'pk':r['pk']})
          with open('/tmp/post_step10_fingerprint_schema.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['table','cid','name','type','notnull','pk'])
              w.writeheader();w.writerows(rows)
          print('POST_STEP10_FINGERPRINT_SCHEMA_READONLY_PASS')
          for r in rows: print(f"{r['table']}|{r['name']}|{r['type']}|notnull={r['notnull']}|pk={r['pk']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-fingerprint-schema-readonly
          path: /tmp/post_step10_fingerprint_schema.csv
          retention-days: 30
