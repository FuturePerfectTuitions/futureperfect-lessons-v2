name: Phase 17 Final Production Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev

jobs:
  readiness:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen architecture and exact final state
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p17-cat.json
          jq -e '.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons==369 and .curricula==11' /tmp/p17-cat.json >/dev/null
          node tests/phase17-explicit-special-screenpal-static.mjs
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase15-master-navigation-regression.mjs
          node tests/phase16-session-transport-static-verification.mjs
          node tests/phase17-reconcile-readonly.mjs | tee /tmp/p17-reconcile.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT"' /tmp/p17-reconcile.json >/dev/null
          node tests/phase17-finalize-state.mjs | tee /tmp/p17-real.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0' /tmp/p17-real.json >/dev/null
          echo 'PHASE17_MANUAL_READINESS_PASS'
