name: Phase 11 Year 5 Answer Pack PDF static verification

on:
  pull_request:
    branches: [main]
    paths:
      - worker/src/phase11-year5-answer-pdf.js
      - worker/src/index-phase11-change4.js
      - scripts/phase11-build-year5-answer-pdf.py
      - tests/phase11-year5-answer-pdf-static-verification.mjs
      - .github/workflows/phase11-year5-answer-pdf-static-verification.yml
      - .github/workflows/phase11-year5-answer-pdf-apply.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify JavaScript and routing invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/phase11-year5-answer-pdf.js
          node --check worker/src/index-phase11-change4.js
          node --check tests/phase11-year5-answer-pdf-static-verification.mjs
          node tests/phase11-year5-answer-pdf-static-verification.mjs
          grep -Fq "phase11/view-overrides/maths-year5/Y5M1/homework/answers/Y5T1M01 Answer Pack Homework Number and Place Value I.pdf" worker/src/phase11-year5-answer-pdf.js
          grep -Fq "maths/level2/Y5M1/homework/answers/L2T1M01 Answer Pack Homework Number and Place Value I.pdf" worker/src/phase11-year5-answer-pdf.js
      - name: Verify PDF builder syntax and exact source guard
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/phase11-build-year5-answer-pdf.py
          grep -Fq 'e1b900264b562abfe561a0cd8149ccce991f69876f02690f6def9a6f535277e5' scripts/phase11-build-year5-answer-pdf.py
          grep -Fq 'EXPECTED_OCCURRENCES = 6' scripts/phase11-build-year5-answer-pdf.py
