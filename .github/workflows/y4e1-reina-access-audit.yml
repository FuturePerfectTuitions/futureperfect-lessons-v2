name: Y4E1 Reina access read-only audit

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-reina-access-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Resolve current Reina profile and Y4E1 access without mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          settings="$(curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          student_ns="$(jq -r '.result.bindings[]? | select(.name=="STUDENTS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          dbid="$(jq -r '.result.bindings[]? | select(.name=="DB") | (.id // .database_id)' <<<"$settings")"
          test -n "$student_ns"; test "$student_ns" != null
          test -n "$dbid"; test "$dbid" != null

          echo '=== ACTIVE/CACHED REINA SESSION PROFILES (NO TOKEN HASHES) ==='
          payload='{"sql":"SELECT DISTINCT portal_user_id_norm, json_extract(user_json, \"$.firstName\") AS first_name, json_extract(user_json, \"$.name\") AS profile_name FROM student_session_profiles WHERE lower(coalesce(json_extract(user_json, \"$.firstName\"), \"\")) = \"reina\" OR lower(coalesce(json_extract(user_json, \"$.name\"), \"\")) LIKE \"reina%\" ORDER BY portal_user_id_norm"}'
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data "$payload" "${BASE}/d1/database/${dbid}/query" -o /tmp/profile-query.json
          jq '{success,errors,result:[.result[]? | {results,success}]}' /tmp/profile-query.json
          jq -r '.result[]?.results[]?.portal_user_id_norm // empty' /tmp/profile-query.json | sort -u > /tmp/reina-ids.txt

          echo '=== SANITISED STUDENTS_KV PROFILE(S) ==='
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            key="user:${id}"
            enc="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$key")"
            if curl -fsS -H "$AUTH" "${BASE}/storage/kv/namespaces/${student_ns}/values/${enc}" -o /tmp/user.json; then
              echo "--- ${key} (sanitised) ---"
              jq 'del(.p,.password,.answerPassword,.answer_password,.loginPassword,.login_password) | {firstName,name,schoolYear,accountStatus,batches,fullLibraries,blockedLessons,manualAccess,trial}' /tmp/user.json
            fi
          done < /tmp/reina-ids.txt

          echo '=== Y4E1 FULL ENTITLEMENTS FOR RESOLVED REINA IDS ==='
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            payload="$(jq -nc --arg id "$id" '{sql:"SELECT portal_user_id_norm, lesson_id, core_access, vr_access, source, source_batch_code, source_lesson_date, first_granted_at, last_confirmed_at FROM lesson_entitlements WHERE portal_user_id_norm = ? AND lesson_id = ?",params:[$id,"Y4E1"]}')"
            curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data "$payload" "${BASE}/d1/database/${dbid}/query" | jq '{success,errors,result:[.result[]? | {results,success}]}'
          done < /tmp/reina-ids.txt

          echo '=== Y4E1 PRELESSON ENTITLEMENTS FOR RESOLVED REINA IDS ==='
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            payload="$(jq -nc --arg id "$id" '{sql:"SELECT portal_user_id_norm, lesson_id, vr_access, batch_key, lesson_date, first_granted_at FROM online_prelesson_entitlements WHERE portal_user_id_norm = ? AND lesson_id = ?",params:[$id,"Y4E1"]}')"
            curl -fsS -H "$AUTH" -H 'Content-Type: application/json' --data "$payload" "${BASE}/d1/database/${dbid}/query" | jq '{success,errors,result:[.result[]? | {results,success}]}'
          done < /tmp/reina-ids.txt

          echo 'REINA_ACCESS_AUDIT_COMPLETE=true'
