name: One-shot deploy recent shares and collapsible lessons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-recent-shares-collapsible.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      DEPLOY_MESSAGE: Add recent shares panel and collapsible lesson sections
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/admin-lesson-release-import.js
          node --check assets/phase7.js
          node --check assets/phase20-collapsible-lessons.js
          node tests/recent-shares-collapsible-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/lesson-release-navigation-verification.mjs
          node tests/prelesson-11plus-regression.mjs

      - name: Generate canonical navigation manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs
          grep -Fq 'const PHASE11_NAVIGATION_MANIFEST = {' worker/src/phase11-navigation-manifest.generated.js
          grep -Fq '"english-year5-11plus"' worker/src/phase11-navigation-manifest.generated.js

      - name: Confirm current production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'main = "src/index-phase20-change8.js"' worker/wrangler.toml

      - name: Deploy while preserving bindings and secrets
        shell: bash
        run: bash ops/deploy_current_worker_preserve.sh

      - name: Verify live Worker contains recent-share backend changes
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error \
            "$API/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/live-worker.bin
          grep -aFq 'recentShareItems' /tmp/live-worker.bin
          grep -aFq 'first_granted_at' /tmp/live-worker.bin
          grep -aFq 'PreLesson Sheets only' /tmp/live-worker.bin
          grep -aFq 'PHASE20_DISABLE_LEGACY_PRELESSON_OVERLAY' /tmp/live-worker.bin
          echo 'Live Worker package contains recent-share and existing Change 8 access fixes.'

      - name: Verify production admin isolation remains intact
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          code="$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST \
            -H 'Origin: https://futureperfecttuitions.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/v1/admin/lesson-releases/preview")"
          test "$code" = '401'
          grep -q 'UNAUTHORISED' /tmp/admin.json
          code="$(curl -sS -o /tmp/excel.json -w '%{http_code}' -X POST \
            -H 'Origin: https://futureperfecttuitions.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = '403'
          grep -q 'BROWSER_REQUEST_NOT_ALLOWED' /tmp/excel.json

      - name: Deployment complete
        run: echo 'Recent shares backend deployed and verified.'
