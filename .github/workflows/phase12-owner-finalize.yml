name: Phase 12 owner login finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/phase12-owner-finalize-trigger.txt
      - .github/workflows/phase12-owner-finalize.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  finalize:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-owner-check' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard Phase 11 closure, catalogue and isolated development bindings
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = 'ac01bd4590fccb313fbafd58259e87a696e05b31'
          test -f docs/data/phase12/owner-check-payload.enc.json
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/catalogue-before.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/catalogue-before.log
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings-before.json
          jq -e '.success == true' /tmp/settings-before.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings-before.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings-before.json >/dev/null
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings-before.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings-before.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings-before.json)"
          OLD_ALLOWLIST="$(jq -r '.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text' /tmp/settings-before.json)"
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings-before.json)"
          for V in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$V"; test "$V" != null; done
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login enabled; refusing Phase 12 owner-check.' >&2; exit 1;; esac
          { echo "students=$STUDENTS"; echo "lessons=$LESSONS"; echo "db=$DB"; echo "allowlist=$OLD_ALLOWLIST"; } >> "$GITHUB_OUTPUT"

      - name: Verify deployed Phase 11 security and D1 single-device invariants
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-before.bin
          for M in SPECIAL_ACCESS_REQUIRED MOCK_PASSWORD_INCORRECT MOCK_DAILY_PASSWORDS QUIZ_NOT_AVAILABLE answer_view_tokens previous VIDEO_URL_REQUIRED p11elevenother HOME_ORDER_SENSITIVE_CURRICULA student_session_profiles X-FPT-Students-KV-Read-Ops BUNDLED_MANIFEST_VALID; do
            grep -aFq "$M" /tmp/worker-before.bin
          done
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/d1-before.json 2>/tmp/d1-before.err
          grep -Fq 'trg_student_sessions_single_active' /tmp/d1-before.json
          grep -Fq '"ok"' /tmp/d1-before.json

      - name: Decrypt owner-approved payload privately
        id: decrypt
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          KEY_ESCAPED="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('phase12:owner-check:private-key', safe=''))
          PY
          )"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${KEY_ESCAPED}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/private.pem
          chmod 600 /tmp/private.pem
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const envelope = JSON.parse(fs.readFileSync('docs/data/phase12/owner-check-payload.enc.json','utf8'));
          if (envelope.schemaVersion !== 1 || envelope.alg !== 'RSA-OAEP-256+A256GCM') throw new Error('Bad encrypted envelope');
          const aesKey = crypto.privateDecrypt({
            key: fs.readFileSync('/tmp/private.pem'),
            oaepHash: 'sha256',
            padding: crypto.constants.RSA_PKCS1_OAEP_PADDING
          }, Buffer.from(envelope.encryptedKey,'base64'));
          const decipher = crypto.createDecipheriv('aes-256-gcm', aesKey, Buffer.from(envelope.iv,'base64'));
          decipher.setAuthTag(Buffer.from(envelope.tag,'base64'));
          const payload = JSON.parse(Buffer.concat([
            decipher.update(Buffer.from(envelope.ciphertext,'base64')),
            decipher.final()
          ]).toString('utf8'));
          const validPassword = value => typeof value === 'string' && value.length === 4 && /[A-Z]/.test(value) && /[a-z]/.test(value) && /\d/.test(value);
          if (payload.schemaVersion !== 1 || !Array.isArray(payload.students) || payload.students.length !== 2) throw new Error('Expected two owner-check students');
          const ids = new Set();
          for (const student of payload.students) {
            const norm = String(student.portalUserId || '').trim().toLowerCase();
            if (!norm || ids.has(norm)) throw new Error('Bad Portal User ID');
            if (!validPassword(student.loginPassword) || !validPassword(student.answerPassword)) throw new Error('Bad four-character password');
            if (![3,5].includes(Number(student.schoolYear))) throw new Error('Bad 2026-27 school year');
            ids.add(norm);
          }
          fs.writeFileSync('/tmp/payload.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Build canonical user records, D1 entitlement plan and expected views
        id: plan
        if: steps.decrypt.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadPhase11Catalogue } from './scripts/phase11-catalogue.mjs';
          const catalogue = loadPhase11Catalogue();
          const payload = JSON.parse(fs.readFileSync('/tmp/payload.json','utf8'));
          const sql = value => value == null ? 'NULL' : `'${String(value).replaceAll("'", "''")}'`;
          const now = new Date().toISOString();
          const users = [];
          const rows = [];
          const expected = {};
          const viewCurriculum = {
            'english-year2':'ENGLISH_Y2',
            'maths-year2':'MATHS_Y2',
            'english-year4-11plus':'ENGLISH_Y4',
            'maths-level1':'MATHS_L1',
            'maths-level2':'MATHS_L2'
          };
          for (const student of payload.students) {
            const norm = student.portalUserId.trim().toLowerCase();
            const user = {
              firstName: String(student.firstName),
              p: String(student.loginPassword),
              answerPassword: String(student.answerPassword),
              schoolYear: Number(student.schoolYear),
              vrEligible: Boolean(student.vrEligible),
              status: 'active',
              expires: null,
              batches: [],
              fullLibraries: student.fullLibraries,
              manualAccess: { coreLessons: [], vrLessons: [], specialBuckets: [] },
              blockedLessons: []
            };
            users.push({ norm, key: `user:${norm}`, value: JSON.stringify(user) });
            expected[norm] = { views: student.expectedViews, counts: {} };
            for (const code of student.curricula) {
              const curriculum = catalogue.curricula?.[code];
              if (!curriculum?.lessonIds?.length) throw new Error(`Unknown curriculum ${code}`);
              const vrAccess = student.vrCurricula.includes(code) ? 1 : 0;
              for (const lessonId of curriculum.lessonIds) rows.push({ norm, lessonId, vrAccess });
            }
            for (const viewId of student.expectedViews) {
              const code = viewCurriculum[viewId];
              if (!code) throw new Error(`Unexpected expected view ${viewId}`);
              expected[norm].counts[viewId] = catalogue.curricula[code].lessonIds.length;
            }
          }
          fs.writeFileSync('/tmp/users.json', JSON.stringify(users), { mode: 0o600 });
          fs.writeFileSync('/tmp/ids.txt', users.map(item => item.norm).join('\n') + '\n', { mode: 0o600 });
          fs.writeFileSync('/tmp/expected.json', JSON.stringify(expected), { mode: 0o600 });
          fs.writeFileSync('/tmp/planned-rows.json', JSON.stringify(rows), { mode: 0o600 });
          users.forEach((item, index) => fs.writeFileSync(`/tmp/want${index}.json`, item.value, { mode: 0o600 }));
          const tuples = rows.map(row => `(${sql(row.norm)},${sql(row.lessonId)},1,${row.vrAccess},'excel',${sql(now)},${sql(now)},NULL,NULL)`).join(',\n');
          const d1Sql = `INSERT INTO lesson_entitlements (portal_user_id_norm,lesson_id,core_access,vr_access,source,first_granted_at,last_confirmed_at,source_batch_code,source_lesson_date) VALUES\n${tuples}\nON CONFLICT(portal_user_id_norm,lesson_id) DO UPDATE SET core_access=MAX(lesson_entitlements.core_access,excluded.core_access),vr_access=MAX(lesson_entitlements.vr_access,excluded.vr_access),last_confirmed_at=excluded.last_confirmed_at;\n`;
          fs.writeFileSync('/tmp/entitlements.sql', d1Sql, { mode: 0o600 });
          fs.writeFileSync('/tmp/summary.json', JSON.stringify({ students: users.length, entitlementRows: rows.length, catalogueLessons: 369, catalogueCurricula: 11 }, null, 2));
          NODE
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Guard partial state as absent or exactly owner-approved
        id: state
        if: steps.plan.outputs.ok == 'true'
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          INDEX=0
          while IFS= read -r NORM; do
            [ -n "$NORM" ] || continue
            KEY_ESCAPED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote("user:"+sys.argv[1], safe=""))' "$NORM")"
            HTTP_CODE="$(curl --silent --show-error --output "/tmp/have${INDEX}.json" --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${KEY_ESCAPED}" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            if [ "$HTTP_CODE" = '200' ]; then
              node -e 'const fs=require("fs");const i=process.argv[1];const a=JSON.parse(fs.readFileSync(`/tmp/have${i}.json`,"utf8"));const b=JSON.parse(fs.readFileSync(`/tmp/want${i}.json`,"utf8"));if(JSON.stringify(a)!==JSON.stringify(b))throw new Error("Existing user record differs from owner-approved plan");' "$INDEX"
            elif [ "$HTTP_CODE" != '404' ]; then
              echo "Unexpected KV read status ${HTTP_CODE}" >&2
              exit 1
            fi
            INDEX=$((INDEX+1))
          done </tmp/ids.txt
          IDS_SQL="$(awk 'BEGIN{ORS=""}{if(NR>1)printf ","; printf "\047%s\047",$0}' /tmp/ids.txt)"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json \
            --command "SELECT portal_user_id_norm,lesson_id,core_access,vr_access FROM lesson_entitlements WHERE portal_user_id_norm IN (${IDS_SQL});" \
            >/tmp/existing-d1.json 2>/tmp/existing-d1.err
          node <<'NODE'
          const fs = require('fs');
          const planned = JSON.parse(fs.readFileSync('/tmp/planned-rows.json','utf8'));
          const allowed = new Map(planned.map(row => [`${row.norm}|${row.lessonId}`, row]));
          const raw = JSON.parse(fs.readFileSync('/tmp/existing-d1.json','utf8'));
          const existing = raw.flatMap(item => item.results || []);
          for (const row of existing) {
            const plannedRow = allowed.get(`${row.portal_user_id_norm}|${row.lesson_id}`);
            if (!plannedRow || Number(row.core_access) !== 1 || Number(row.vr_access) > plannedRow.vrAccess) throw new Error('Unexpected pre-existing entitlement');
          }
          NODE
          mkdir -p /tmp/prewrite
          cp /tmp/settings-before.json /tmp/prewrite/settings-before.json
          cp /tmp/worker-before.bin /tmp/prewrite/worker-before.bin
          cp /tmp/existing-d1.json /tmp/prewrite/d1-before.json
          cp /tmp/summary.json /tmp/prewrite/summary.json
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.state.outputs.ok == 'true'
        with:
          name: phase12-owner-finalizer-prewrite
          path: /tmp/prewrite
          if-no-files-found: error
          retention-days: 14

      - name: Apply exact user records and permanent entitlements idempotently
        id: data
        if: steps.state.outputs.ok == 'true'
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          INDEX=0
          while IFS= read -r NORM; do
            [ -n "$NORM" ] || continue
            KEY_ESCAPED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote("user:"+sys.argv[1], safe=""))' "$NORM")"
            curl --fail --silent --show-error --request PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${KEY_ESCAPED}" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary @"/tmp/want${INDEX}.json" >/dev/null
            INDEX=$((INDEX+1))
          done </tmp/ids.txt
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote \
            --file /tmp/entitlements.sql --yes >/tmp/d1-apply.log 2>/tmp/d1-apply.err
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Allow only the two owner-check accounts in development
        id: deploy
        if: steps.data.outputs.ok == 'true'
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
          LESSONS_KV_ID: ${{ steps.guard.outputs.lessons }}
          DB_ID: ${{ steps.guard.outputs.db }}
          OLD_ALLOWLIST: ${{ steps.guard.outputs.allowlist }}
        run: |
          set -euo pipefail
          TARGET_ALLOWLIST="$(node -e 'const fs=require("fs");const old=(process.env.OLD_ALLOWLIST||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);const ids=fs.readFileSync("/tmp/ids.txt","utf8").trim().split(/\s+/).filter(Boolean);process.stdout.write([...new Set([...old,...ids])].join(","));')"
          cat >worker/wrangler.phase12.owner-finalizer.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase11-efficient.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "development"
          ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
          DEV_LOGIN_ALLOWLIST = "${TARGET_ALLOWLIST}"
          STUDENT_LOGIN_ENABLED = "false"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_KV_ID}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_KV_ID}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "fpt-materials-dev"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB_ID}"
          EOF
          npx --yes wrangler@${WRANGLER_VERSION} deploy \
            --config worker/wrangler.phase12.owner-finalizer.toml --keep-vars \
            --message 'Phase 12 owner-check logins' >/tmp/worker-deploy.log 2>&1
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Verify both real logins and exact requested historical catalogues
        id: verify
        if: steps.deploy.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/payload.json","utf8"));p.students.forEach((s,i)=>fs.writeFileSync(`/tmp/login${i}.json`,JSON.stringify({username:s.portalUserId,password:s.loginPassword}),{mode:0o600}));'
          for INDEX in 0 1; do
            HTTP_CODE="$(curl --silent --show-error --cookie-jar "/tmp/cookies${INDEX}.txt" \
              --header 'Origin: https://futureperfecttuitions.github.io' \
              --header 'Content-Type: application/json' \
              --request POST --data-binary @"/tmp/login${INDEX}.json" \
              --output "/tmp/login-response${INDEX}.json" --write-out '%{http_code}' \
              'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/auth/login')"
            test "$HTTP_CODE" = '200'
            curl --fail --silent --show-error --cookie "/tmp/cookies${INDEX}.txt" \
              --header 'Origin: https://futureperfecttuitions.github.io' \
              'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/home' \
              --output "/tmp/home${INDEX}.json"
          done
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/payload.json','utf8'));
          const expected = JSON.parse(fs.readFileSync('/tmp/expected.json','utf8'));
          payload.students.forEach((student,index) => {
            const norm = student.portalUserId.trim().toLowerCase();
            const home = JSON.parse(fs.readFileSync(`/tmp/home${index}.json`,'utf8'));
            if (!home.ok) throw new Error('Home request failed');
            if (home.diagnostics?.currentMathsDetected || home.diagnostics?.currentEnglishDetected) throw new Error('September batch detected before assignment');
            const actual = new Map(home.subjects.flatMap(subject => subject.views.map(view => [view.viewId, view])));
            for (const viewId of expected[norm].views) {
              const view = actual.get(viewId);
              if (!view) throw new Error(`Missing expected view ${viewId}`);
              if (view.openLessonCount !== expected[norm].counts[viewId] || view.lockedLessonCount !== 0) throw new Error(`Incomplete catalogue in ${viewId}`);
            }
          });
          NODE
          for INDEX in 0 1; do
            curl --fail --silent --show-error --cookie "/tmp/cookies${INDEX}.txt" \
              --header 'Origin: https://futureperfecttuitions.github.io' \
              --header 'Content-Type: application/json' --request POST \
              'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/auth/logout' >/dev/null
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - name: Final invariant verification and bootstrap-key cleanup
        id: final
        if: steps.verify.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings-after.json
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings-after.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // "false"' /tmp/settings-after.json | tr '[:upper:]' '[:lower:]')"
          test "$LOGIN_ENABLED" = 'false'
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/d1-final.json 2>/tmp/d1-final.err
          grep -Fq 'trg_student_sessions_single_active' /tmp/d1-final.json
          grep -Fq '"ok"' /tmp/d1-final.json
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/catalogue-final.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/catalogue-final.log
          KEY_ESCAPED="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('phase12:owner-check:private-key', safe=''))
          PY
          )"
          curl --fail --silent --show-error --request DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${{ steps.guard.outputs.students }}/values/${KEY_ESCAPED}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null
          mkdir -p artifacts
          cp /tmp/summary.json artifacts/summary.json
          printf '%s\n' 'verified=true' 'environment=development' 'generalStudentLogin=false' 'septemberBatchesAssigned=false' > artifacts/result.txt
          echo 'ok=true' >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.final.outputs.ok == 'true'
        with:
          name: phase12-owner-finalizer-verified
          path: artifacts
          if-no-files-found: error
          retention-days: 14
