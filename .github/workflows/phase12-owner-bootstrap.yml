name: Phase 12 owner payload bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/phase12-owner-bootstrap-trigger.txt
      - .github/workflows/phase12-owner-bootstrap.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  BOOTSTRAP_KEY: phase12:owner-check:private-key

jobs:
  bootstrap:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-owner-check' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Guard exact Phase 11 closure base
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = 'ac01bd4590fccb313fbafd58259e87a696e05b31'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' docs/data/phase11/PHASE11_CLOSURE.md

      - name: Guard isolated V2 development Worker and discover STUDENTS_KV
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/settings.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login enabled; refusing.' >&2; exit 1;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"; test "$STUDENTS" != null
          echo "students=$STUDENTS" >> "$GITHUB_OUTPUT"

      - name: Generate one-day public key and store private key only in V2 development KV
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ steps.guard.outputs.students }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node <<'NODE'
          const { generateKeyPairSync } = require('crypto');
          const fs = require('fs');
          const { publicKey, privateKey } = generateKeyPairSync('rsa', {
            modulusLength: 3072,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });
          fs.writeFileSync('/tmp/private.pem', privateKey, { mode: 0o600 });
          fs.writeFileSync('artifacts/public.pem', publicKey);
          NODE
          KEY_ESCAPED="$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('phase12:owner-check:private-key', safe=''))
          PY
          )"
          curl --fail --silent --show-error --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS_KV_ID}/values/${KEY_ESCAPED}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/private.pem >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: phase12-owner-public-key
          path: artifacts/public.pem
          if-no-files-found: error
          retention-days: 1
