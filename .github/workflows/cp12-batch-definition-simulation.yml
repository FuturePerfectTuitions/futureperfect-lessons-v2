name: CP12 batch-definition simulation

on:
  push:
    branches:
      - fix/cp12-complete-batch-view-registry-2026-09-14
    paths:
      - 'scripts/cp12-batch-definition-simulation.mjs'
      - '.github/workflows/cp12-batch-definition-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_WORKER: fpt-portal-v2-worker
      READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/cp12-batch-definition-simulation.mjs
      - run: node scripts/cp12-batch-definition-simulation.mjs
