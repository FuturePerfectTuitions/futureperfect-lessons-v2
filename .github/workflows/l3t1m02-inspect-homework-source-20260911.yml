name: L3T1M02 inspect existing homework source 2026-09-11

on:
  push:
    branches:
      - ops/l3t1m02-cumulative-replace-20260911
    paths:
      - .github/workflows/l3t1m02-inspect-homework-source-20260911.yml

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0
  TARGET_KV_KEY: lesson:Y6M2.2

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production lesson resources and hash existing homework PDFs
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          settings="$(curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          bucket="$(jq -r '.result.bindings[]? | select(.name=="MATERIALS_R2" and .type=="r2_bucket") | .bucket_name' <<<"$settings")"
          enc="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TARGET_KV_KEY")"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}" -o /tmp/lesson.json
          echo '--- elevenPlus homeworks ---'
          jq -c '.phase11Resources.elevenPlus.homeworks // []' /tmp/lesson.json
          echo '--- core homeworks ---'
          jq -c '.phase11Resources.core.homeworks // []' /tmp/lesson.json
          echo '--- cumulative ---'
          jq -c '.phase11Resources.elevenPlus.cumulativeHomeworks // []' /tmp/lesson.json
          jq -r '[.phase11Resources.elevenPlus.homeworks[]?, .phase11Resources.core.homeworks[]?] | .[] | .homework.r2Key? // empty' /tmp/lesson.json | sort -u > /tmp/keys.txt
          i=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            i=$((i+1)); f="/tmp/hw-${i}.pdf"
            npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${bucket}/${key}" --file="$f" --remote >/dev/null
            echo "HOMEWORK_SOURCE key=${key} size=$(stat -c%s "$f") sha256=$(sha256sum "$f" | awk '{print $1}')"
          done < /tmp/keys.txt
