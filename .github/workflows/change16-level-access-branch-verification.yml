name: Change 16 level access branch verification

on:
  push:
    branches: [fix/change16-actual-level-not-preview]
    paths:
      - '.github/workflows/change16-level-access-branch-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify L1 L2 access and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change16.js
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          echo 'CHANGE16_LEVEL_ACCESS_BRANCH_PASS'
