name: Repair Y4T1E01 core PreLesson mapping

on:
  push:
    branches:
      - ops/y4t1e01-prelesson-kv-repair-20260917
    paths:
      - .github/y4t1e01-prelesson-kv-apply-trigger.txt

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  TARGET_KV_KEY: lesson:Y4E1
  EXPECTED_BEFORE_SHA256: e70c944b7e6e7e0d2eb9c69c43bbbc2a8bc1e512a7b0186561706d4d0a256baa
  SOURCE_SHA256: d57553a947ef785213b9305c4453d7f39ccd2c2be225eb53f3febe106e0b6c0f
  SOURCE_R2_KEY: english/year4/Y4T1E01/prelesson/sheets/Y4T1E01 PreLesson Sheet Transitioning from Year 3 to Year 4.pdf
  SOURCE_DISPLAY_NAME: Y4T1E01 PreLesson Sheet Transitioning from Year 3 to Year 4.pdf

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve live production bindings and guard exact lesson state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          settings="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' <<<"$settings" >/dev/null

          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          bucket="$(jq -r '.result.bindings[]? | select(.name=="MATERIALS_R2" and .type=="r2_bucket") | .bucket_name' <<<"$settings")"
          test -n "$ns"; test "$ns" != null
          test -n "$bucket"; test "$bucket" != null
          echo "ns=$ns" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "Production guard: Worker=${WORKER_NAME}; LESSONS_KV=${ns}; MATERIALS_R2=${bucket}"

          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}" \
            -o /tmp/lesson-before.json

          before_sha="$(sha256sum /tmp/lesson-before.json | awk '{print $1}')"
          echo "Current lesson snapshot SHA256=${before_sha}"
          test "$before_sha" = "$EXPECTED_BEFORE_SHA256"

          jq -e '
            .lessonId == "Y4E1" and
            .title == "Transitioning from Year 3 to Year 4" and
            .displayIds["english-year4"] == "Y4T1E01" and
            .displayIds["english-year4-11plus"] == "Y4T1EE01" and
            .video == null and
            .presentation == null and
            ((.homeworks // .core.homeworks // []) | length) == 1 and
            ((.phase11Resources.core.preLessonPairs // []) | length) == 0
          ' /tmp/lesson-before.json >/dev/null
          echo 'Exact lesson-state guard: PASS'

      - name: Verify exact source PDF already present in production R2
        shell: bash
        env:
          BUCKET: ${{ steps.guard.outputs.bucket }}
        run: |
          set -euo pipefail
          npm install -g wrangler@4.134.0 >/dev/null
          wrangler r2 object get "${BUCKET}/${SOURCE_R2_KEY}" --file=/tmp/source.pdf --remote >/dev/null
          head -c 5 /tmp/source.pdf | grep -q '%PDF-'
          source_sha="$(sha256sum /tmp/source.pdf | awk '{print $1}')"
          echo "Source R2 SHA256=${source_sha}"
          test "$source_sha" = "$SOURCE_SHA256"
          echo 'Exact source R2 object: PASS'

      - name: Build one-field KV repair and prove all non-target data is unchanged
        shell: bash
        run: |
          set -euo pipefail
          jq --arg name "$SOURCE_DISPLAY_NAME" --arg key "$SOURCE_R2_KEY" '
            .phase11Resources.core.preLessonPairs = [
              {
                sheet: {
                  displayName: $name,
                  r2Key: $key
                }
              }
            ]
          ' /tmp/lesson-before.json > /tmp/lesson-after.json

          jq -S 'del(.phase11Resources.core.preLessonPairs)' /tmp/lesson-before.json > /tmp/before-nontarget.json
          jq -S 'del(.phase11Resources.core.preLessonPairs)' /tmp/lesson-after.json  > /tmp/after-nontarget.json
          cmp -s /tmp/before-nontarget.json /tmp/after-nontarget.json

          jq -e --arg name "$SOURCE_DISPLAY_NAME" --arg key "$SOURCE_R2_KEY" '
            ((.phase11Resources.core.preLessonPairs // []) | length) == 1 and
            .phase11Resources.core.preLessonPairs[0].sheet.displayName == $name and
            .phase11Resources.core.preLessonPairs[0].sheet.r2Key == $key and
            (.phase11Resources.core.preLessonPairs[0].answerPack // null) == null
          ' /tmp/lesson-after.json >/dev/null
          echo 'Mutation plan: PASS — only core.preLessonPairs changes, with no fabricated answer pack.'

      - name: Apply guarded KV repair with rollback on verification failure
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
        run: |
          set -euo pipefail
          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          endpoint="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${NS}/values/${enc}"
          mutated=0

          rollback() {
            rc=$?
            if [ "$mutated" -eq 1 ]; then
              echo 'Verification failed after KV write; restoring exact pre-repair snapshot.' >&2
              curl -fsS -X PUT \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/lesson-before.json \
                "$endpoint" >/tmp/rollback-response.json || true
              if jq -e '.success == true' /tmp/rollback-response.json >/dev/null 2>&1; then
                echo 'Rollback PUT accepted.' >&2
              else
                echo 'WARNING: rollback PUT could not be confirmed.' >&2
              fi
            fi
            exit "$rc"
          }
          trap rollback ERR

          resp="$(curl -fsS -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/lesson-after.json \
            "$endpoint")"
          jq -e '.success == true' <<<"$resp" >/dev/null
          mutated=1
          echo 'KV PUT accepted.'

          verified=0
          for i in $(seq 1 20); do
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint" -o /tmp/lesson-final.json
            if jq -e --arg name "$SOURCE_DISPLAY_NAME" --arg key "$SOURCE_R2_KEY" '
              ((.phase11Resources.core.preLessonPairs // []) | length) == 1 and
              .phase11Resources.core.preLessonPairs[0].sheet.displayName == $name and
              .phase11Resources.core.preLessonPairs[0].sheet.r2Key == $key and
              (.phase11Resources.core.preLessonPairs[0].answerPack // null) == null
            ' /tmp/lesson-final.json >/dev/null; then
              jq -S 'del(.phase11Resources.core.preLessonPairs)' /tmp/lesson-final.json > /tmp/final-nontarget.json
              if cmp -s /tmp/before-nontarget.json /tmp/final-nontarget.json; then
                verified=1
                break
              fi
            fi
            sleep 2
          done
          test "$verified" -eq 1

          trap - ERR
          echo "FINAL_LESSON_SHA256=$(sha256sum /tmp/lesson-final.json | awk '{print $1}')"
          echo 'FINAL PASS: Y4T1E01 core PreLesson mapping restored; all non-target lesson data preserved.'

      - name: Final source integrity check
        shell: bash
        env:
          BUCKET: ${{ steps.guard.outputs.bucket }}
        run: |
          set -euo pipefail
          wrangler r2 object get "${BUCKET}/${SOURCE_R2_KEY}" --file=/tmp/source-final.pdf --remote >/dev/null
          test "$(sha256sum /tmp/source-final.pdf | awk '{print $1}')" = "$SOURCE_SHA256"
          echo 'FINAL R2 PASS: source PDF unchanged and hash-verified.'
          echo 'No Worker deployment, student profile, entitlement, batch, release or password data was changed.'
