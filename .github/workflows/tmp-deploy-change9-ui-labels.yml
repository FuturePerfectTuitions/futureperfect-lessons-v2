name: One-shot deploy Change 9 UI label consistency
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-change9-ui-labels.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      DEPLOY_MESSAGE: Normalise Portal V2 11+ navigation labels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Change 9 and current student UI source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change9.js
          node tests/phase20-change9-ui-labels-verification.mjs
          node tests/recent-shares-collapsible-verification.mjs
          grep -Fq 'main = "src/index-phase20-change9.js"' worker/wrangler.toml
          grep -Fq 'background: var(--c8-navy);' assets/phase16-ui-refinement.css
          grep -Fq 'phase20-collapsible-lessons.js' phase11.html
          grep -Fq 'Just shared with you' phase11.html
      - name: Deploy while preserving bindings and secrets
        shell: bash
        run: bash ops/deploy_current_worker_preserve.sh
      - name: Verify live Worker contains Change 9
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error \
            "$API/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/live-worker.bin
          grep -aFq 'consistentViewLabel' /tmp/live-worker.bin
          grep -aFq 'Year ${match[1]}${match[2] ? '\'' 11+'\'' : '\'''\''}' /tmp/live-worker.bin || grep -aFq 'Level ${match[1]} 11+' /tmp/live-worker.bin
          echo 'Live Worker package contains Change 9 label normalisation.'
      - name: Verify admin isolation remains intact
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          code="$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST \
            -H 'Origin: https://futureperfecttuitions.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/v1/admin/lesson-releases/preview")"
          test "$code" = '401'
          grep -q 'UNAUTHORISED' /tmp/admin.json
          code="$(curl -sS -o /tmp/excel.json -w '%{http_code}' -X POST \
            -H 'Origin: https://futureperfecttuitions.github.io' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = '403'
          grep -q 'BROWSER_REQUEST_NOT_ALLOWED' /tmp/excel.json
