name: P17 sanitized historical entitlement source audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-p17-historical-source-audit.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  audit:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase17-prelaunch-freeze-production-verification' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit source classifications only
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT COUNT(*) AS entitlement_count,
            SUM(CASE WHEN source_batch_code IS NULL OR TRIM(source_batch_code)='' THEN 1 ELSE 0 END) AS blank_source,
            SUM(CASE WHEN UPPER(source_batch_code) GLOB 'Y[45]M11*' THEN 1 ELSE 0 END) AS maths_11_source,
            SUM(CASE WHEN UPPER(source_batch_code) GLOB 'Y[45]E11*' THEN 1 ELSE 0 END) AS english_11_source,
            SUM(CASE WHEN source_batch_code IS NOT NULL AND TRIM(source_batch_code)<>'' AND NOT (UPPER(source_batch_code) GLOB 'Y[45]M11*') AND NOT (UPPER(source_batch_code) GLOB 'Y[45]E11*') THEN 1 ELSE 0 END) AS other_source
            FROM lesson_entitlements GROUP BY portal_user_id_norm ORDER BY entitlement_count;"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "$SQL" > /tmp/p17-source.json 2>/tmp/p17-source.err
          jq -c '.[0].results | map({entitlement_count,blank_source,maths_11_source,english_11_source,other_source})' /tmp/p17-source.json
