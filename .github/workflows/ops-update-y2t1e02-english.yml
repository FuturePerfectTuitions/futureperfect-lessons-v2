name: Ops update Y2T1E02 English video

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-update-y2t1e02-english.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard production target, update Y2T1E02, and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_KV_ID;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
          const auth = { Authorization: `Bearer ${token}` };

          const DISPLAY_ID = 'Y2T1E02';
          const TARGET = 'cOQXFKnwGmE';
          const description = [
            'In this Year 2 English lesson, pupils learn about simple present, simple past and simple future tenses, practise common spellings, explore contractions and use picture clues to make sensible inferences.',
            '',
            'This lesson includes:',
            '✔ Understanding how verbs behave in the simple present, simple past and simple future tenses',
            '✔ Comparing forms such as run, runs, ran and will run',
            '✔ Writing sentences in different simple tenses from given topics',
            '✔ Identifying correctly spelt words including door, child, pretty, improve, parents and poor',
            '✔ Using correctly spelt words in sentences',
            '✔ Understanding that contractions are shortened forms of words or groups of words',
            '✔ Learning how apostrophes show where letters have been omitted',
            '✔ Recognising contractions such as should’ve, couldn’t, don’t, I’ll, we’re, can’t, doesn’t, it’s, I’m and wouldn’t',
            '✔ Expanding contractions back into their full forms',
            '✔ Replacing contractions in sentences with the two original words',
            '✔ Reading photographs closely and using visible clues to make predictions and inferences',
            '',
            'Pupils begin by exploring the simple present, simple past and simple future tenses, before applying them in short sentence-writing challenges. They then help the Grammar Police identify correctly spelt words and use each one in context.',
            '',
            'The lesson next introduces contractions through the Contractionator, explaining how apostrophes replace missing letters and giving pupils practice in both forming and expanding contractions.',
            '',
            'The final section develops visual inference skills. Pupils study photographs and use details from each image to explain what may be happening, what people might be thinking and what clues support their ideas.',
            '',
            'By the end of the lesson, learners will have practised simple tenses, spelling, contractions and evidence-based picture inference.'
          ].join('\n');

          function video(code) {
            return {
              screenpal: code,
              contentUrl: `https://screenpal.com/content/video/${code}`,
              embedUrl: `https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,
              watchUrl: `https://go.screenpal.com/watch/${code}`
            };
          }

          async function getJson(key) {
            const r = await fetch(base + encodeURIComponent(key), { headers: auth });
            if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
            const text = await r.text();
            try { return JSON.parse(text); } catch { throw new Error(`${key} is not valid JSON`); }
          }

          async function putJson(key, value) {
            const r = await fetch(base + encodeURIComponent(key), {
              method: 'PUT',
              headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(value)
            });
            if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
          }

          function guardLesson(r) {
            if (r?.subject !== 'english' || r?.active !== true) throw new Error('Y2T1E02 state mismatch');
            if (!Object.values(r?.displayIds || {}).includes(DISPLAY_ID)) throw new Error(`Display ID mismatch for ${r?.lessonId}`);
            const title = String(r?.title || '').toLowerCase();
            for (const required of ['tense', 'contraction']) {
              if (!title.includes(required)) throw new Error(`Y2T1E02 title guard failed: ${r?.title}`);
            }
            if (!r?.core || !Object.prototype.hasOwnProperty.call(r.core, 'video')) throw new Error('Y2T1E02 core.video missing');
          }

          (async () => {
            const curriculum = await getJson('curriculum:ENGLISH_Y2');
            if (curriculum?.curriculumCode !== 'ENGLISH_Y2') throw new Error('ENGLISH_Y2 curriculum identity mismatch');
            if (!Array.isArray(curriculum.lessonIds) || !curriculum.lessonIds.length) throw new Error('ENGLISH_Y2 lessonIds missing');

            const matches = [];
            for (const lessonId of curriculum.lessonIds) {
              const rec = await getJson(`lesson:${lessonId}`);
              if (Object.values(rec?.displayIds || {}).includes(DISPLAY_ID)) matches.push(rec);
            }
            if (matches.length !== 1) throw new Error(`Expected exactly one ${DISPLAY_ID} lesson; found ${matches.length}`);

            const before = matches[0];
            guardLesson(before);
            const lessonKey = `lesson:${before.lessonId}`;

            const next = JSON.parse(JSON.stringify(before));
            next.description = description;
            next.core.video = video(TARGET);
            next.contentStatus = {
              ...(next.contentStatus || {}),
              description: 'available',
              mainVideo: 'available',
              ownerConfirmedPending: false
            };

            await putJson(lessonKey, next);

            let verified;
            for (let attempt = 1; attempt <= 6; attempt++) {
              verified = await getJson(lessonKey);
              const ok = verified?.core?.video?.screenpal === TARGET &&
                verified?.description === description &&
                verified?.contentStatus?.description === 'available' &&
                verified?.contentStatus?.mainVideo === 'available' &&
                verified?.contentStatus?.ownerConfirmedPending === false;
              if (ok) break;
              if (attempt < 6) await sleep(2000);
            }

            guardLesson(verified);
            if (verified?.core?.video?.screenpal !== TARGET) throw new Error('Y2T1E02 ScreenPal verification failed');
            if (verified?.description !== description) throw new Error('Y2T1E02 description verification failed');
            if (verified?.contentStatus?.description !== 'available' || verified?.contentStatus?.mainVideo !== 'available' || verified?.contentStatus?.ownerConfirmedPending !== false) {
              throw new Error('Y2T1E02 content status verification failed');
            }

            console.log('Y2T1E02_VERIFIED=' + JSON.stringify({
              lessonId: verified.lessonId,
              displayId: DISPLAY_ID,
              title: verified.title,
              screenpal: verified.core.video.screenpal,
              contentStatus: verified.contentStatus
            }));
            console.log('OPS_UPDATE_Y2T1E02_PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
