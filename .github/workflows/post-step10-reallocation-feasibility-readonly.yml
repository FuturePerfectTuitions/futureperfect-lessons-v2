name: Post-Step-10 reallocation families read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-reallocation-feasibility-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Export rules, evidence IDs and LIVE runtime metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-reallocation-feasibility-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML

          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT family_id,family_name,primary_skill_id,gl_method_signature,generator_rules_json,earliest_release_point,question_level_override_needed FROM question_family WHERE family_id IN ('NPV-08','ARI-04','ARI-06') ORDER BY family_id;" --json >/tmp/rules_raw.json

          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT family_id,golden_source_id,corpus_series,evidence_role,evidence_note FROM family_source_evidence WHERE family_id IN ('NPV-08','ARI-04','ARI-06') ORDER BY family_id,golden_source_id;" --json >/tmp/evidence_raw.json

          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT family_id,question_id,difficulty_band,presentation_type,diagram_type,diagram_spec_json,validation_spec_json,correct_option,correct_display,earliest_release_point,prerequisite_lessons,lifecycle_status,deployment_status FROM question_instance WHERE family_id IN ('NPV-08','ARI-04','ARI-06') AND lifecycle_status='Live' ORDER BY family_id,question_id;" --json >/tmp/live_raw.json

          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rules=json.loads(Path('/tmp/rules_raw.json').read_text())[0]['results']
          evidence=json.loads(Path('/tmp/evidence_raw.json').read_text())[0]['results']
          live=json.loads(Path('/tmp/live_raw.json').read_text())[0]['results']
          expected={'NPV-08','ARI-04','ARI-06'}
          assert {r['family_id'] for r in rules}==expected, rules
          counts={f:sum(1 for r in live if r['family_id']==f) for f in expected}
          assert counts=={f:6 for f in expected}, counts
          Path('/tmp/reallocation_family_rules.json').write_text(json.dumps(rules,indent=2),encoding='utf-8')
          with open('/tmp/reallocation_evidence_ids.csv','w',newline='',encoding='utf-8') as h:
              fields=['family_id','golden_source_id','corpus_series','evidence_role','evidence_note']
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(evidence)
          with open('/tmp/reallocation_live_contracts.csv','w',newline='',encoding='utf-8') as h:
              fields=['family_id','question_id','difficulty_band','presentation_type','diagram_type','diagram_spec_json','validation_spec_json','correct_option','correct_display','earliest_release_point','prerequisite_lessons','deployment_status']
              w=csv.DictWriter(h,fieldnames=fields); w.writeheader(); w.writerows(live)
          print(json.dumps({
              'marker':'POST_STEP10_REALLOCATION_FEASIBILITY_READONLY_PASS',
              'families':sorted(expected),
              'rule_rows':len(rules),
              'evidence_rows':len(evidence),
              'live_rows':len(live),
              'live_counts':counts,
              'raw_question_text_exported':False,
              'raw_source_text_exported':False,
              'd1_write_performed':False
          },indent=2))
          PY
          rm -f /tmp/rules_raw.json /tmp/evidence_raw.json /tmp/live_raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-reallocation-feasibility-readonly
          path: |
            /tmp/reallocation_family_rules.json
            /tmp/reallocation_evidence_ids.csv
            /tmp/reallocation_live_contracts.csv
          retention-days: 30
