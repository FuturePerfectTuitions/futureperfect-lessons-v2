name: Phase 17 post-merge read-only closure

on:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  readonly-closure:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locked catalogue and exact clean state
        shell: bash
        env:
          PHASE17_FINALIZE_ACTION: postcheck
        run: |
          set -euo pipefail
          node scripts/phase11-navigation-manifest.mjs >/tmp/nav.json
          jq -e '.catalogueSha256=="7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .lessons==369 and .curricula==11' /tmp/nav.json >/dev/null
          node tests/phase17-reconcile-readonly.mjs >/tmp/reconcile.json
          jq -e '.status=="PASS" and .state=="POST_CLEANUP_EXACT" and .worker.environment=="development" and .worker.normalStudentLoginDisabled==true and .d1.entitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .kv.userRecords==2 and .kv.lessonKvKeys==381 and .kv.explicitVrHowToUrls==11' /tmp/reconcile.json >/dev/null
          node tests/phase17-finalize-state.mjs >/tmp/finalize.json
          jq -e '.status=="PASS" and .realStudentRecords==2 and .credentialFormatFailures==0 and .expiredRealRecordCount==0 and .developmentAllowlistEmpty==true and .realStudentAllowlistIntersectionCount==0 and .fullLibraryAssignments==0 and .manualCoreAssignments==0 and .manualVrAssignments==0 and .manualSpecialAssignments==0 and .blockedLessonOverrides==0 and .d1.entitlements==173 and .d1.realEntitlements==173 and .d1.batches==4 and .d1.assignments==4 and .d1.releases==0 and .quickCheck=="ok" and .triggerPresent==true and .identitiesOrPasswordsExposed==false' /tmp/finalize.json >/dev/null
          echo 'PHASE17_POSTMERGE_CLEAN_STATE_PASS'

      - name: Deployed Worker and retained historical presentation marker
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS_URL" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.success==true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/settings.json >/dev/null
          test -z "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          test -n "$STUDENTS"
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "SELECT portal_user_id_norm,batch_key FROM student_batch_assignments ORDER BY portal_user_id_norm,batch_key;" >/tmp/assignments.json 2>/tmp/assignments.err
          TARGET="$(jq -r '.[0].results | group_by(.portal_user_id_norm)[] | select(([.[].batch_key]|sort)==["Y511FE","Y511FM"]) | .[0].portal_user_id_norm' /tmp/assignments.json)"
          test -n "$TARGET"; echo "::add-mask::$TARGET"
          KEY="$(node -e 'process.stdout.write(encodeURIComponent("user:"+process.argv[1]))' "$TARGET")"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${STUDENTS}/values/${KEY}" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/real.json
          jq -e '(.historicalViews//[])==["english-year4-11plus","maths-level1","maths-level2"] and (.fullLibraries//[])==[] and (.manualAccess.coreLessons//[])==[] and (.manualAccess.vrLessons//[])==[] and (.manualAccess.specialBuckets//[])==[] and (.blockedLessons//[])==[]' /tmp/real.json >/dev/null
          echo 'PHASE17_POSTMERGE_DEPLOYED_CONFIG_PASS'

      - name: Unauthenticated boundary proof
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' --header 'Content-Type: application/json' --request POST --data '{"username":"__phase17_not_authorised__","password":"Aa1x"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = '401'; jq -e '.error=="INVALID_LOGIN"' /tmp/login.json >/dev/null
          for path in /api/v1/student/home /api/v1/student/session; do
            code="$(curl --silent --show-error --output /tmp/noauth.json --write-out '%{http_code}' --header 'Origin: https://futureperfecttuitions.github.io' "$WORKER_BASE$path")"
            test "$code" = '401'
          done
          echo 'PHASE17_POSTMERGE_READONLY_PASS normal_login=false allowlist_empty=true dns_switch=not_performed real_sync=not_performed old_live_retained=true'
