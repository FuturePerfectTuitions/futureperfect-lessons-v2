name: Temporary empty PreLesson UI patch
on:
  push:
    branches: [prelesson-empty-navigation-20260907]
    paths:
      - '.github/workflows/tmp-prelesson-empty-ui-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prelesson-empty-navigation-20260907
      - name: Patch student UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/phase7.js')
          s = p.read_text()

          pattern = re.compile(r"(?m)^    const link = document\.createElement\('a'\);\n    link\.className = 'phase20-recent-share-link';\n    link\.href = `#shared-\$\{encodeURIComponent\(String\(item\.viewId \|\| ''\)\)\}-\$\{encodeURIComponent\(String\(item\.lessonId \|\| ''\)\)\}`;\n    link\.textContent = sharedLessonLabel\(item\);\n    link\.addEventListener\('click', event => \{\n      event\.preventDefault\(\);\n      openSharedLesson\(item\);\n    \}\);\n")
          replacement = """    const noPreLesson = item?.accessMode === 'prelesson' && item?.preLessonAvailable === false;
              const shareClickable = item?.clickable !== false && !noPreLesson;
              const link = document.createElement(shareClickable ? 'a' : 'span');
              link.className = `phase20-recent-share-link${shareClickable ? '' : ' disabled'}`;
              link.textContent = sharedLessonLabel(item);
              if (shareClickable) {
                link.href = `#shared-${encodeURIComponent(String(item.viewId || ''))}-${encodeURIComponent(String(item.lessonId || ''))}`;
                link.addEventListener('click', event => {
                  event.preventDefault();
                  openSharedLesson(item);
                });
              }
          """
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'recent-share link replacement count={n}')

          pattern = re.compile(r"(?m)^    for \(const lesson of filtered\) \{\n      const row = document\.createElement\('button'\);\n      row\.type = 'button';\n      row\.className = 'phase6-lesson-row';\n")
          replacement = """    for (const lesson of filtered) {
              const noPreLesson = lesson?.accessMode === 'prelesson' && lesson?.preLessonAvailable === false;
              const row = document.createElement(noPreLesson ? 'div' : 'button');
              if (!noPreLesson) row.type = 'button';
              row.className = `phase6-lesson-row${noPreLesson ? ' phase6-lesson-row-unavailable' : ''}`;
              if (noPreLesson) row.setAttribute('aria-disabled', 'true');
          """
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'lesson row replacement count={n}')

          pattern = re.compile(r"(?m)^      const stateLabel = document\.createElement\('span'\);\n      stateLabel\.className = `phase6-lesson-state\$\{lesson\.locked \? ' locked' : ''\}`;\n      stateLabel\.textContent = lesson\.locked \? '🔒 Locked' : 'Available';\n\n      row\.appendChild\(main\);\n      row\.appendChild\(stateLabel\);\n      row\.addEventListener\('click', \(\) => openLesson\(lesson\)\);\n      els\.lessonList\.appendChild\(row\);\n")
          replacement = """      const stateLabel = document.createElement('span');
              stateLabel.className = `phase6-lesson-state${lesson.locked ? ' locked' : ''}${noPreLesson ? ' no-prelesson' : ''}`;
              stateLabel.textContent = noPreLesson
                ? 'No PreLesson Sheets'
                : (lesson.accessMode === 'prelesson' ? 'PreLesson Sheets only' : (lesson.locked ? '🔒 Locked' : 'Available'));

              row.appendChild(main);
              row.appendChild(stateLabel);
              if (!noPreLesson) row.addEventListener('click', () => openLesson(lesson));
              els.lessonList.appendChild(row);
          """
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'lesson state replacement count={n}')

          s, n = re.subn(
              r"(?m)^  async function openSharedLesson\(item\) \{\n    recordActivity\(\);\n",
              "  async function openSharedLesson(item) {\n    if (item?.clickable === false || (item?.accessMode === 'prelesson' && item?.preLessonAvailable === false)) return;\n    recordActivity();\n",
              s,
              count=1
          )
          if n != 1: raise SystemExit(f'openSharedLesson replacement count={n}')
          p.write_text(s)

          css = Path('assets/phase20-recent-collapse.css')
          c = css.read_text()
          marker = '/* Empty PreLesson release presentation */'
          if marker not in c:
              c += """

          /* Empty PreLesson release presentation */
          .phase6-lesson-row-unavailable { cursor: default; }
          .phase6-lesson-state.no-prelesson { color:#8a1218; font-weight:900; }
          .phase20-recent-share-link.disabled { color:#667085; cursor:default; text-decoration:none; }
          .phase20-recent-share-link.disabled:hover,
          .phase20-recent-share-link.disabled:focus-visible { text-decoration:none; }
          """
              css.write_text(c)

          for name in ('phase11.html', 'phase11-change8.html'):
              h = Path(name)
              if not h.exists(): continue
              text = h.read_text()
              text = re.sub(r'assets/phase7\.js(?:\?v=[^"\']+)?', 'assets/phase7.js?v=20260907-prelesson-empty-1', text)
              text = re.sub(r'assets/phase20-recent-collapse\.css(?:\?v=[^"\']+)?', 'assets/phase20-recent-collapse.css?v=20260907-prelesson-empty-1', text)
              h.write_text(text)
          PY
          git diff --check
          grep -q 'No PreLesson Sheets' assets/phase7.js
          grep -q 'phase6-lesson-row-unavailable' assets/phase7.js
          grep -q 'phase20-recent-share-link.*disabled' assets/phase7.js
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add assets/phase7.js assets/phase20-recent-collapse.css phase11.html phase11-change8.html
          git commit -m 'Make empty PreLesson releases non-clickable'
          git push origin HEAD:prelesson-empty-navigation-20260907
