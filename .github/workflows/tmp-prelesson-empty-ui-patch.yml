name: Temporary empty PreLesson UI patch
on:
  push:
    branches: [prelesson-empty-navigation-20260907]
    paths:
      - '.github/workflows/tmp-prelesson-empty-ui-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prelesson-empty-navigation-20260907
      - name: Patch student UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/phase7.js')
          s = p.read_text()

          old = """      const link = document.createElement('a');
              link.className = 'phase20-recent-share-link';
              link.href = `#shared-${encodeURIComponent(String(item.viewId || ''))}-${encodeURIComponent(String(item.lessonId || ''))}`;
              link.textContent = sharedLessonLabel(item);
              link.addEventListener('click', event => {
                event.preventDefault();
                openSharedLesson(item);
              });
          """
          new = """      const noPreLesson = item?.accessMode === 'prelesson' && item?.preLessonAvailable === false;
              const shareClickable = item?.clickable !== false && !noPreLesson;
              const link = document.createElement(shareClickable ? 'a' : 'span');
              link.className = `phase20-recent-share-link${shareClickable ? '' : ' disabled'}`;
              link.textContent = sharedLessonLabel(item);
              if (shareClickable) {
                link.href = `#shared-${encodeURIComponent(String(item.viewId || ''))}-${encodeURIComponent(String(item.lessonId || ''))}`;
                link.addEventListener('click', event => {
                  event.preventDefault();
                  openSharedLesson(item);
                });
              }
          """
          if old not in s:
              raise SystemExit('recent-share link block not found')
          s = s.replace(old, new, 1)

          old = """    for (const lesson of filtered) {
              const row = document.createElement('button');
              row.type = 'button';
              row.className = 'phase6-lesson-row';
          """
          new = """    for (const lesson of filtered) {
              const noPreLesson = lesson?.accessMode === 'prelesson' && lesson?.preLessonAvailable === false;
              const row = document.createElement(noPreLesson ? 'div' : 'button');
              if (!noPreLesson) row.type = 'button';
              row.className = `phase6-lesson-row${noPreLesson ? ' phase6-lesson-row-unavailable' : ''}`;
              if (noPreLesson) row.setAttribute('aria-disabled', 'true');
          """
          if old not in s:
              raise SystemExit('lesson row opening block not found')
          s = s.replace(old, new, 1)

          old = """      const stateLabel = document.createElement('span');
              stateLabel.className = `phase6-lesson-state${lesson.locked ? ' locked' : ''}`;
              stateLabel.textContent = lesson.locked ? '🔒 Locked' : 'Available';

              row.appendChild(main);
              row.appendChild(stateLabel);
              row.addEventListener('click', () => openLesson(lesson));
              els.lessonList.appendChild(row);
          """
          new = """      const stateLabel = document.createElement('span');
              stateLabel.className = `phase6-lesson-state${lesson.locked ? ' locked' : ''}${noPreLesson ? ' no-prelesson' : ''}`;
              stateLabel.textContent = noPreLesson
                ? 'No PreLesson Sheets'
                : (lesson.accessMode === 'prelesson' ? 'PreLesson Sheets only' : (lesson.locked ? '🔒 Locked' : 'Available'));

              row.appendChild(main);
              row.appendChild(stateLabel);
              if (!noPreLesson) row.addEventListener('click', () => openLesson(lesson));
              els.lessonList.appendChild(row);
          """
          if old not in s:
              raise SystemExit('lesson state/click block not found')
          s = s.replace(old, new, 1)

          old = """  async function openSharedLesson(item) {
              recordActivity();
          """
          new = """  async function openSharedLesson(item) {
              if (item?.clickable === false || (item?.accessMode === 'prelesson' && item?.preLessonAvailable === false)) return;
              recordActivity();
          """
          if old not in s:
              raise SystemExit('openSharedLesson block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('assets/phase20-recent-collapse.css')
          c = css.read_text()
          marker = '/* Empty PreLesson release presentation */'
          if marker not in c:
              c += """

          /* Empty PreLesson release presentation */
          .phase6-lesson-row-unavailable { cursor: default; }
          .phase6-lesson-state.no-prelesson { color:#8a1218; font-weight:900; }
          .phase20-recent-share-link.disabled { color:#667085; cursor:default; text-decoration:none; }
          .phase20-recent-share-link.disabled:hover,
          .phase20-recent-share-link.disabled:focus-visible { text-decoration:none; }
          """
              css.write_text(c)

          for name in ('phase11.html', 'phase11-change8.html'):
              h = Path(name)
              if not h.exists():
                  continue
              text = h.read_text()
              text = text.replace('assets/phase7.js?v=20260907-live-ui-1', 'assets/phase7.js?v=20260907-prelesson-empty-1')
              text = text.replace('assets/phase20-recent-collapse.css?v=20260907-live-ui-2', 'assets/phase20-recent-collapse.css?v=20260907-prelesson-empty-1')
              text = text.replace('assets/phase20-recent-collapse.css?v=20260907-live-ui-1', 'assets/phase20-recent-collapse.css?v=20260907-prelesson-empty-1')
              h.write_text(text)
          PY
          git diff --check
          grep -q 'No PreLesson Sheets' assets/phase7.js
          grep -q 'phase6-lesson-row-unavailable' assets/phase7.js
          grep -q 'phase20-recent-share-link.*disabled' assets/phase7.js
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add assets/phase7.js assets/phase20-recent-collapse.css phase11.html phase11-change8.html
          git commit -m 'Make empty PreLesson releases non-clickable'
          git push origin HEAD:prelesson-empty-navigation-20260907
