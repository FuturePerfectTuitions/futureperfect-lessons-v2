name: Change 12 visible-view preview deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change12-visible-preview-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Change 12 visible-view cross-subject preview fix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Change 12 syntax
        run: node --check worker/src/index-phase20-change12.js
      - name: Verify visible-view preview mapping
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { previewViewIdsFromHome } from './worker/src/index-phase20-change12.js';

          const zaraShape = {
            ok: true,
            subjects: [
              { subject: 'maths', views: [] },
              { subject: 'english', views: [
                { viewId: 'english-year3' },
                { viewId: 'english-year4' },
                { viewId: 'english-year5' }
              ] }
            ]
          };
          assert.deepEqual([...previewViewIdsFromHome(zaraShape)].sort(), [
            'maths-year3', 'maths-year4', 'maths-year5'
          ]);

          const elevenPlus = {
            ok: true,
            subjects: [
              { subject: 'maths', views: [{ viewId: 'maths-level1' }] },
              { subject: 'english', views: [] }
            ]
          };
          assert.deepEqual([...previewViewIdsFromHome(elevenPlus)], ['english-year4-11plus']);

          const alreadyEnrolled = {
            ok: true,
            subjects: [
              { subject: 'maths', views: [{ viewId: 'maths-year5' }] },
              { subject: 'english', views: [{ viewId: 'english-year5' }] }
            ]
          };
          assert.equal(previewViewIdsFromHome(alreadyEnrolled).size, 0);
          console.log('CHANGE12_VISIBLE_PREVIEW_PASS');
          NODE
      - name: Deploy Worker preserving production bindings
        run: bash ops/deploy_current_worker_preserve.sh
      - name: Complete
        run: echo CHANGE12_DEPLOY_PASS
