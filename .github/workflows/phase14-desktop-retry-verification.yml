name: Phase 14 desktop retry verification

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase14-desktop-retry-verification.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  verify-desktop-retry:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase14-failure-retry-matrix' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read-only verification of successful desktop retry
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p14-retry-settings.json
          jq -e '.success == true' /tmp/p14-retry-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p14-retry-settings.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p14-retry-settings.json)" = 'fpt-materials-dev'
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p14-retry-settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal V2 student login is enabled.' >&2; false;; esac

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS test_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN ('testy3p14m','testy3p14e','testy5p1411e','testy5p14full'); SELECT COUNT(*) AS target_entitlement FROM lesson_entitlements WHERE portal_user_id_norm='testy3p14m' AND lesson_id='Y3M1' AND source_batch_key='Y3FM' AND lesson_date='2026-09-15'; SELECT COUNT(*) AS target_release FROM batch_lesson_releases WHERE batch_key='Y3FM' AND lesson_id='Y3M1'; SELECT vr_access FROM lesson_entitlements WHERE portal_user_id_norm='testy3p14m' AND lesson_id='Y3M1'; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/p14-retry-d1.json 2>/tmp/p14-retry-d1.err

          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p14-retry-d1.json)" = '633'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p14-retry-d1.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p14-retry-d1.json)" = '8'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p14-retry-d1.json)" = '1'
          test "$(jq -r '.[4].results[0].test_entitlements' /tmp/p14-retry-d1.json)" = '1'
          test "$(jq -r '.[5].results[0].target_entitlement' /tmp/p14-retry-d1.json)" = '1'
          test "$(jq -r '.[6].results[0].target_release' /tmp/p14-retry-d1.json)" = '1'
          test "$(jq -r '.[7].results[0].vr_access' /tmp/p14-retry-d1.json)" = '0'
          grep -Fq 'trg_student_sessions_single_active' /tmp/p14-retry-d1.json
          jq -e '.[9].results[0].quick_check == "ok"' /tmp/p14-retry-d1.json >/dev/null

          echo 'PHASE14_DESKTOP_RETRY_BACKEND_VERIFIED'
          echo 'Read-only check: exactly one TestY entitlement and one Y3FM/Y3M1 release exist after the successful desktop retry.'
