name: Login gate diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-gate-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Inspect production login gate
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null

          ENVIRONMENT_VALUE="$(jq -r '[.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          ALLOWLIST="$(jq -r '[.result.bindings[]|select(.name=="PROD_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          STUDENTS_ID="$(jq -r '[.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id][0] // ""' /tmp/settings.json)"

          COUNT="$(printf '%s' "$ALLOWLIST" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | awk 'NF{n++} END{print n+0}')"
          ADMIN_PRESENT=no
          if printf '%s' "$ALLOWLIST" | tr ',' '\n' | tr '[:upper:]' '[:lower:]' | sed 's/^ *//;s/ *$//' | grep -Fxq 'admin'; then ADMIN_PRESENT=yes; fi

          curl --fail --silent --show-error -G "$API/storage/kv/namespaces/${STUDENTS_ID}/keys" -H "$AUTH" --data-urlencode 'prefix=user:' --data-urlencode 'limit=1000' -o /tmp/keys.json
          jq -e '.success == true' /tmp/keys.json >/dev/null
          USER_COUNT="$(jq '[.result[] | select(.name|startswith("user:"))] | length' /tmp/keys.json)"
          ADMIN_KEY=no
          if jq -e '[.result[].name] | index("user:admin") != null' /tmp/keys.json >/dev/null; then ADMIN_KEY=yes; fi

          echo "ENVIRONMENT=$ENVIRONMENT_VALUE"
          echo "STUDENT_LOGIN_ENABLED=$LOGIN_ENABLED"
          echo "PROD_ALLOWLIST_COUNT=$COUNT"
          echo "ADMIN_IN_ALLOWLIST=$ADMIN_PRESENT"
          echo "STUDENTS_KV_USER_KEYS_FIRST_PAGE=$USER_COUNT"
          echo "ADMIN_USER_KEY=$ADMIN_KEY"
