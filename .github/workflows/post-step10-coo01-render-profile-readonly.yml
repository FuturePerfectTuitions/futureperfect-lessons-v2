name: Post-Step-10 COO-01 render profile read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-coo01-render-profile-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Export render/range profile only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-coo01-render-profile-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT diagram_spec_json FROM question_instance WHERE family_id='COO-01' AND lifecycle_status='Live';" --json >/tmp/raw.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/raw.json').read_text())[0]['results']
          profiles=[]
          for r in rows:
              d=json.loads(r['diagram_spec_json'])
              profiles.append({'x_range':d.get('x_range'),'y_range':d.get('y_range'),'render_contract':d.get('render_contract')})
          unique=[]
          seen=set()
          for p in profiles:
              s=json.dumps(p,sort_keys=True)
              if s not in seen: seen.add(s); unique.append(p)
          out={'marker':'POST_STEP10_COO01_RENDER_PROFILE_READONLY_PASS','live_rows':len(rows),'unique_profiles':unique,'points_exported':False,'question_text_exported':False}
          Path('/tmp/coo01_render_profile.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'marker':out['marker'],'live_rows':out['live_rows'],'unique_profile_count':len(unique),'points_exported':False},indent=2))
          PY
          rm -f /tmp/raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-coo01-render-profile-readonly
          path: /tmp/coo01_render_profile.json
          retention-days: 30
