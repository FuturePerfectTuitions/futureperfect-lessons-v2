name: CP12 resource UI source patch

on:
  push:
    branches:
      - fix/cp12-resource-collapsible-ui-2026-09-14
    paths:
      - .github/workflows/cp12-resource-ui-source-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cp12-resource-collapsible-ui-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source patch
        run: python scripts/cp12-resource-ui-source-patch.py
      - name: Run focused and retained regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check rebuild/shared/read-models/phase11-extension-resources.mjs
          node --check rebuild/adminops/src/lib/compiler.mjs
          node --check rebuild/student/src/lib/runtime.mjs
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          node tests/rebuild-cp12-admin-principal.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          git diff --check
      - name: Commit tested source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name FuturePerfectTuitions
          git config user.email futureperfectlessons@gmail.com
          git add rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/adminops/src/lib/compiler.mjs rebuild/student/src/lib/runtime.mjs tests/rebuild-cp12-resource-presentation-groups.mjs
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'CP12: preserve canonical resource presentation groups'
          git push origin HEAD:fix/cp12-resource-collapsible-ui-2026-09-14
