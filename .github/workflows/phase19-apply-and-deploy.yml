name: Phase 19 apply and deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase19-apply-and-deploy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
      PAGES_ORIGIN: https://futureperfecttuitions.github.io/futureperfect-lessons-v2
      PRODUCTION_ORIGIN: https://lessons.futureperfect.education
      WRANGLER_VERSION: 4.125.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Phase 19 source
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/index-phase19-access.js
          node --check assets/phase19-access-ui.js
          test -f worker/migrations/0010_trial_and_window_sessions.sql
          grep -Fq "Trial access ended, please contact Future Perfect Tuitions to continue accessing content" worker/src/index-phase19-access.js
          grep -Fq "Full access available to enrolled students of the subject only" worker/src/index-phase19-access.js
          grep -Fq "X-FPT-Window-Token" worker/src/index-phase19-access.js
          grep -Fq "trial_login_consumptions" worker/src/index-phase19-access.js
          grep -Fq "student_session_windows" worker/src/index-phase19-access.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            trialViews,
            viewForBatch,
            counterpartView,
            forceLockedLesson
          } from './worker/src/index-phase19-access.js';

          assert.deepEqual([...trialViews({ trialViews: ['maths-year5', 'english-year5', 'bad-view'] })].sort(), ['english-year5', 'maths-year5']);
          assert.equal(viewForBatch({ subject: 'maths', school_year: 5, stream: 'normal' }), 'maths-year5');
          assert.equal(counterpartView({ subject: 'maths', school_year: 5, stream: 'normal' }), 'english-year5');
          assert.equal(viewForBatch({ subject: 'maths', school_year: 4, stream: '11plus', maths_level: 1 }), 'maths-level1');
          assert.equal(counterpartView({ subject: 'maths', school_year: 4, stream: '11plus', maths_level: 1 }), 'english-year4-11plus');
          assert.equal(counterpartView({ subject: 'english', school_year: 5, stream: '11plus' }), 'maths-level2');
          const locked = forceLockedLesson({
            locked: false,
            preLessonSheets: [{ displayName: 'Pre' }],
            video: { displayName: 'Video', resourceKey: 'x' },
            homeworks: [{ homework: { displayName: 'HW' }, answerPack: { displayName: 'AP', protected: true } }]
          }, 'MESSAGE', 'subject-preview');
          assert.equal(locked.locked, true);
          assert.equal(locked.video.locked, true);
          assert.equal(locked.preLessonSheets[0].locked, true);
          assert.equal(locked.homeworks[0].homework.locked, true);
          assert.equal(locked.homeworks[0].answerPack.locked, true);
          assert.equal(locked.accessMessage, 'MESSAGE');
          NODE

      - name: Wire Phase 19 frontend and production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html = Path('phase11.html')
          s = html.read_text(encoding='utf-8')
          marker = '  <script src="assets/phase18-online-prelesson-ui.js"></script>\n'
          addition = marker + '  <script src="assets/phase19-access-ui.js"></script>\n'
          if 'assets/phase19-access-ui.js' not in s:
              if marker not in s:
                  raise SystemExit('Phase 18 UI marker not found')
              s = s.replace(marker, addition, 1)
              html.write_text(s, encoding='utf-8')

          wrangler = Path('worker/wrangler.toml')
          w = wrangler.read_text(encoding='utf-8')
          old = 'main = "src/index-phase18-online-prelesson.js"'
          new = 'main = "src/index-phase19-access.js"'
          if old in w:
              w = w.replace(old, new, 1)
          elif new not in w:
              raise SystemExit('Expected Worker entrypoint not found')
          wrangler.write_text(w, encoding='utf-8')
          PY
          grep -Fq '<script src="assets/phase19-access-ui.js"></script>' phase11.html
          grep -Fq 'main = "src/index-phase19-access.js"' worker/wrangler.toml

      - name: Commit production wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add phase11.html worker/wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m 'Activate Phase 19 trial and window access rules'
            git push origin HEAD:main
          fi

      - name: Capture production runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/before.json
          jq -e '.success == true' /tmp/before.json >/dev/null

          plain() { jq -r --arg n "$1" '[.result.bindings[]|select(.name==$n and .type=="plain_text")|.text][0] // ""' /tmp/before.json; }
          field() { jq -r --arg n "$1" --arg t "$2" --arg f "$3" '[.result.bindings[]|select(.name==$n and .type==$t)|.[$f]][0] // ""' /tmp/before.json; }

          ENVIRONMENT_VALUE="$(plain ENVIRONMENT)"
          ORIGINS="$(plain ALLOWED_ORIGINS)"
          DEV_ALLOWLIST="$(plain DEV_LOGIN_ALLOWLIST)"
          PROD_ALLOWLIST="$(plain PROD_LOGIN_ALLOWLIST)"
          LOGIN_ENABLED="$(plain STUDENT_LOGIN_ENABLED)"
          STUDENTS_ID="$(field STUDENTS_KV kv_namespace namespace_id)"
          LESSONS_ID="$(field LESSONS_KV kv_namespace namespace_id)"
          DATABASE_ID="$(field DB d1 id)"
          R2_BUCKET="$(field MATERIALS_R2 r2_bucket bucket_name)"

          test "$(printf '%s' "$ENVIRONMENT_VALUE" | tr '[:upper:]' '[:lower:]')" = production
          test "$(printf '%s' "$LOGIN_ENABLED" | tr '[:upper:]' '[:lower:]')" = true
          for v in "$STUDENTS_ID" "$LESSONS_ID" "$DATABASE_ID" "$R2_BUCKET"; do test -n "$v"; done

          printf '%s' "$STUDENTS_ID" >/tmp/students
          printf '%s' "$LESSONS_ID" >/tmp/lessons
          printf '%s' "$DATABASE_ID" >/tmp/db
          printf '%s' "$R2_BUCKET" >/tmp/r2
          printf '%s' "$ENVIRONMENT_VALUE" >/tmp/environment
          printf '%s' "$ORIGINS" >/tmp/origins
          printf '%s' "$DEV_ALLOWLIST" >/tmp/dev
          printf '%s' "$PROD_ALLOWLIST" >/tmp/prod
          printf '%s' "$LOGIN_ENABLED" >/tmp/login
          jq -c '[.result.bindings[]|select((.type//"")|test("secret";"i"))|.name]|sort' /tmp/before.json >/tmp/secrets

          cat >worker/wrangler.phase19.deploy.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index-phase19-access.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [vars]
          ENVIRONMENT = "${ENVIRONMENT_VALUE}"
          ALLOWED_ORIGINS = "${ORIGINS}"
          DEV_LOGIN_ALLOWLIST = "${DEV_ALLOWLIST}"
          PROD_LOGIN_ALLOWLIST = "${PROD_ALLOWLIST}"
          STUDENT_LOGIN_ENABLED = "${LOGIN_ENABLED}"
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS_ID}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS_ID}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2_BUCKET}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DATABASE_ID}"
          EOF

      - name: Apply Phase 19 D1 migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply fpt_portal_v2_db --config worker/wrangler.phase19.deploy.toml --remote >/tmp/migrate.log 2>/tmp/migrate.err

      - name: Deploy Phase 19 Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --config worker/wrangler.phase19.deploy.toml --keep-vars --message 'Phase 19 trial, window-bound sessions, cross-subject descriptions' >/tmp/deploy.log 2>/tmp/deploy.err

      - name: Verify production Worker and D1
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/after.json
          plain() { jq -r --arg n "$1" '[.result.bindings[]|select(.name==$n and .type=="plain_text")|.text][0] // ""' /tmp/after.json; }
          field() { jq -r --arg n "$1" --arg t "$2" --arg f "$3" '[.result.bindings[]|select(.name==$n and .type==$t)|.[$f]][0] // ""' /tmp/after.json; }
          test "$(field STUDENTS_KV kv_namespace namespace_id)" = "$(cat /tmp/students)"
          test "$(field LESSONS_KV kv_namespace namespace_id)" = "$(cat /tmp/lessons)"
          test "$(field DB d1 id)" = "$(cat /tmp/db)"
          test "$(field MATERIALS_R2 r2_bucket bucket_name)" = "$(cat /tmp/r2)"
          test "$(plain ENVIRONMENT)" = "$(cat /tmp/environment)"
          test "$(plain ALLOWED_ORIGINS)" = "$(cat /tmp/origins)"
          test "$(plain DEV_LOGIN_ALLOWLIST)" = "$(cat /tmp/dev)"
          test "$(plain PROD_LOGIN_ALLOWLIST)" = "$(cat /tmp/prod)"
          test "$(plain STUDENT_LOGIN_ENABLED)" = "$(cat /tmp/login)"
          jq -c '[.result.bindings[]|select((.type//"")|test("secret";"i"))|.name]|sort' /tmp/after.json >/tmp/secrets-after
          cmp -s /tmp/secrets /tmp/secrets-after

          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --config worker/wrangler.phase19.deploy.toml --remote --json --command "SELECT COUNT(*) AS trial_table FROM sqlite_master WHERE type='table' AND name='trial_login_consumptions'; SELECT COUNT(*) AS window_table FROM sqlite_master WHERE type='table' AND name='student_session_windows'; PRAGMA quick_check;" >/tmp/d1.json 2>/tmp/d1.err
          test "$(jq -r '.[0].results[0].trial_table' /tmp/d1.json)" = 1
          test "$(jq -r '.[1].results[0].window_table' /tmp/d1.json)" = 1
          test "$(jq -r '.[2].results[0].quick_check' /tmp/d1.json)" = ok

          code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" "$WORKER_BASE/api/v1/student/session")"
          test "$code" = 401
          grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/session.json

          code="$(curl --silent --show-error --output /tmp/login.json --write-out '%{http_code}' --header "Origin: $PRODUCTION_ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"username":"nobody","password":"Aa1b"}' "$WORKER_BASE/api/v1/student/auth/login")"
          test "$code" = 401
          grep -Fq 'WINDOW_SESSION_REQUIRED' /tmp/login.json

          curl --silent --show-error --include --request OPTIONS \
            --header "Origin: $PRODUCTION_ORIGIN" \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: X-FPT-Window-Token' \
            "$WORKER_BASE/api/v1/student/session" >/tmp/options.txt
          grep -Eiq '^HTTP/[^ ]+ 204' /tmp/options.txt
          grep -Eiq '^access-control-allow-headers:.*x-fpt-window-token' /tmp/options.txt

          code="$(curl --silent --show-error --output /tmp/sync.json --write-out '%{http_code}' --header 'Content-Type: application/json' --request POST --data '{"items":[{"syncRowId":"phase19-noauth","operation":"status_check","portalUserId":"missing","lessonId":"missing","batchKey":"N","lessonDate":"2026-09-06"}]}' "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          test "$code" = 401
          grep -Fq 'SYNC_UNAUTHORISED' /tmp/sync.json

      - name: Verify published frontend
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$PAGES_ORIGIN/phase11.html?phase19=${GITHUB_SHA}" -o /tmp/phase11.html && \
               grep -Fq 'assets/phase19-access-ui.js' /tmp/phase11.html && \
               curl --fail --silent --show-error "$PAGES_ORIGIN/assets/phase19-access-ui.js?phase19=${GITHUB_SHA}" -o /tmp/phase19-ui.js && \
               grep -Fq 'fpt_v2_window_token' /tmp/phase19-ui.js && \
               grep -Fq 'Trial access ended, please contact Future Perfect Tuitions to continue accessing content' /tmp/phase19-ui.js && \
               grep -Fq 'Full access available to enrolled students of the subject only' /tmp/phase19-ui.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          rm -f worker/wrangler.phase19.deploy.toml
          echo 'PHASE19_PRODUCTION_PASS'
