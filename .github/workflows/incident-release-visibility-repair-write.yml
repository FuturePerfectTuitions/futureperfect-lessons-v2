name: Incident - Release Visibility Production Repair

on:
  push:
    branches:
      - incident/import-release-visibility-2026-09-16
    paths:
      - 'docs/rebuild/INCIDENT_RELEASE_VISIBILITY_REPAIR_WRITE_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: incident-release-visibility-repair-2026-09-16
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LEGACY_WORKER: fpt-portal-v2-worker
  READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  AS_OF_DATE: '2026-09-16'
  ALLOW_WRITE: 'true'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incident/import-release-visibility-2026-09-16
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static guard
        run: |
          set -Eeuo pipefail
          node --check scripts/incident-release-visibility-repair.mjs
          grep -Fq "publishScopeAtomic" scripts/incident-release-visibility-repair.mjs
          grep -Fq "Concurrent pointer change detected" scripts/incident-release-visibility-repair.mjs
          grep -Fq "restorePointers" scripts/incident-release-visibility-repair.mjs
      - name: Publish exact five prepared access scopes
        run: node scripts/incident-release-visibility-repair.mjs
      - name: Upload production repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-release-visibility-production-repair-2026-09-16
          path: /tmp/release-visibility-repair.json
          if-no-files-found: warn
          retention-days: 30
