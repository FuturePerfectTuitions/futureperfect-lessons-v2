name: R2 Drive Y6 final independent verify
on:
  push:
    branches: [ops/r2-drive-sync-y6]
    paths:
      - .github/r2-drive-y6-final-verify-trigger.txt
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
jobs:
  verify-year6:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Final read-only exact key, size and SHA-256 audit
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_y6_final_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y6-final-read-only-byte-hash-audit
          path: y6-final-read-only-byte-hash-audit.json
          retention-days: 30
