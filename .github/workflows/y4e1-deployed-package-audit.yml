name: Y4E1 deployed package read-only audit

on:
  push:
    branches:
      - diag/y4e1-live-api-20260917
    paths:
      - .github/workflows/y4e1-deployed-package-audit.yml
      - .github/y4e1-deployed-package-trigger.txt

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Inspect current production deployment, package and Y4E1 record without mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          deployments="$(curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/deployments")"
          jq -e '.success == true' <<<"$deployments" >/dev/null
          echo '=== CURRENT DEPLOYMENT ==='
          jq '.result.deployments[0] | {id,created_on,source,annotations,versions}' <<<"$deployments"

          settings="$(curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          test -n "$ns"; test "$ns" != null
          enc="$(python -c 'import urllib.parse; print(urllib.parse.quote("lesson:Y4E1",safe=""))')"
          curl -fsS -H "$AUTH" "${BASE}/storage/kv/namespaces/${ns}/values/${enc}" -o /tmp/y4e1.json
          echo '=== CURRENT Y4E1 RECORD ==='
          jq '{lessonId,topPreLessonSheets:.preLessonSheets,corePreLessonSheets:.core.preLessonSheets,homeworks:(.homeworks // .core.homeworks),vrPresent:(.vr!=null)}' /tmp/y4e1.json

          curl -fsS -H "$AUTH" "${BASE}/workers/scripts/${WORKER_NAME}" -D /tmp/headers -o /tmp/package
          echo '=== PACKAGE ==='
          wc -c /tmp/package
          sha256sum /tmp/package
          grep -i '^content-type:' /tmp/headers || true

          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/package').read_bytes()
          text = raw.decode('utf-8', 'ignore')
          needles = {
            'standard_prelesson_fallback': 'Array.isArray(core.preLessonSheets)',
            'standard_prelesson_payload': 'preLessonSheets: await Promise.all(packageData.preLessonSheets.map(safeFile))',
            'lessonCollections': 'function lessonCollections(record)',
            'phase20_full_access_early_return': 'baseBody?.lesson?.locked === false',
            'step10_quiz_route': '/api/v1/student/quiz/eligibility',
          }
          for name, needle in needles.items():
            print(f'{name}={str(needle in text).lower()}')
          print('Y4E1_occurrences=', text.count('Y4E1'))
          print('=== Y4E1 BOUNDED CONTEXTS ===')
          start = 0
          count = 0
          while True:
            i = text.find('Y4E1', start)
            if i < 0:
              break
            count += 1
            snippet = text[max(0, i-260):min(len(text), i+520)].replace('\r',' ').replace('\n',' ')
            print(f'--- occurrence {count} @ {i} ---')
            print(snippet)
            start = i + 4
          PY
          echo 'DEPLOYED_PACKAGE_AND_KV_AUDIT_COMPLETE=true'
