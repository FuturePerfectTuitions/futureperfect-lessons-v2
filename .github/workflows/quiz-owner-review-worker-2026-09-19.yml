name: Quiz owner review worker 2026-09-19

on:
  push:
    branches:
      - ops/quiz-diagram-renderer-2026-09-19
    paths:
      - '.github/workflows/quiz-owner-review-worker-2026-09-19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-owner-review-worker-2026-09-19
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  REVIEW_WORKER: futureperfect-11plus-practice-owner-review
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  REVIEW_KEY_SHA256: f2396d2b0d22b3b25987830f585ccaaa06c4ea4b83dcdd35a71cf4d3f83a7997

jobs:
  deploy-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated review gateway
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/quiz-owner-review
          cat > /tmp/quiz-owner-review/index.js <<'JS'
          const QUIZ_COOKIE='__Host-fpt_quiz_session';
          const QUIZ_UPSTREAM='https://quiz.futureperfect.education';
          const REVIEW_KEY_SHA256='f2396d2b0d22b3b25987830f585ccaaa06c4ea4b83dcdd35a71cf4d3f83a7997';
          const enc=new TextEncoder();
          const clean=v=>String(v??'').trim();
          async function sha(v){const b=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(String(v))));return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');}
          function cookies(r){const out={};for(const p of (r.headers.get('Cookie')||'').split(';')){const i=p.indexOf('=');if(i>0)out[p.slice(0,i).trim()]=p.slice(i+1).trim();}return out;}
          function token(){const a=new Uint8Array(32);crypto.getRandomValues(a);let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
          const sec={
            'Cache-Control':'no-store','Content-Security-Policy':"default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; object-src 'none'",
            'Referrer-Policy':'no-referrer','X-Content-Type-Options':'nosniff','X-Frame-Options':'DENY'
          };
          function html(body,status=200,extra={}){return new Response(body,{status,headers:{...sec,'content-type':'text/html; charset=utf-8',...extra}});}
          function redirect(to,extra={}){return new Response(null,{status:303,headers:{...sec,Location:to,...extra}});}
          function loginPage(message=''){
            return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPT 11+ Quiz · Owner Review</title></head><body style="font-family:system-ui;max-width:560px;margin:60px auto;padding:0 20px;color:#10213d"><h1>FPT 11+ Quiz · Owner Review</h1><p>This is the isolated review entrance. It is not linked from the Student Portal.</p>${message?`<p style="color:#8b1111"><strong>${message}</strong></p>`:''}<form method="post" action="/review"><label>Review key<br><input name="key" type="password" autocomplete="current-password" required style="font:inherit;padding:10px;width:100%;margin:8px 0 14px"></label><button type="submit" style="font:inherit;font-weight:700;padding:10px 16px">Open review quiz</button></form></body></html>`;
          }
          async function reviewSession(request,env){
            const raw=cookies(request)[QUIZ_COOKIE]||''; if(!raw)return null;
            const h=await sha(raw),now=new Date().toISOString();
            const row=await env.DB.prepare(`SELECT portal_user_id,expires_at FROM quiz_auth_session WHERE token_hash=? AND revoked_at IS NULL AND expires_at>? AND portal_user_id LIKE 'owner-review-%'`).bind(h,now).first();
            return row?{raw,hash:h,user:row.portal_user_id}:null;
          }
          async function releaseCodes(env){
            const rows=await env.DB.prepare(`SELECT earliest_release_point,prerequisite_lessons FROM question_instance WHERE UPPER(lifecycle_status)='LIVE'`).all();
            const set=new Set();
            for(const row of rows.results||[]){for(const v of [row.earliest_release_point,row.prerequisite_lessons]){for(const m of String(v||'').match(/L3T\dM\d+/gi)||[])set.add(m.toUpperCase());}}
            return [...set].sort();
          }
          async function createReviewLogin(request,env){
            const form=await request.formData().catch(()=>null); const supplied=clean(form?.get('key'));
            if(!supplied || await sha(supplied)!==REVIEW_KEY_SHA256)return html(loginPage('That review key is not valid.'),403);
            const raw=token(),h=await sha(raw),now=new Date(),ttl=7*24*60*60,exp=new Date(now.getTime()+ttl*1000),user=`owner-review-${crypto.randomUUID()}`;
            const codes=await releaseCodes(env); if(!codes.length)return html(loginPage('Review release context could not be prepared.'),503);
            const context={l3Eligible:true,l2Inherited:true,releasedL3LessonCodes:codes,source:'owner-external-review',reviewOnly:true};
            await env.DB.prepare(`INSERT INTO quiz_auth_session(token_hash,portal_user_id,release_context_json,created_at,last_seen_at,expires_at,revoked_at) VALUES(?,?,?,?,?,?,NULL)`).bind(h,user,JSON.stringify(context),now.toISOString(),now.toISOString(),exp.toISOString()).run();
            const cookie=`${QUIZ_COOKIE}=${raw}; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=${ttl}`;
            return redirect('/app',{'Set-Cookie':cookie});
          }
          async function proxy(request){
            const inUrl=new URL(request.url),up=new URL(inUrl.pathname+inUrl.search,QUIZ_UPSTREAM),headers=new Headers(request.headers);
            headers.set('Origin',QUIZ_UPSTREAM); headers.set('Host','quiz.futureperfect.education');
            const init={method:request.method,headers,redirect:'manual'}; if(!['GET','HEAD'].includes(request.method))init.body=request.body;
            const r=await fetch(up.toString(),init); const h=new Headers(r.headers); h.set('Cache-Control','no-store'); h.set('X-FPT-Quiz-Review','owner-isolated-gateway');
            const loc=h.get('Location'); if(loc?.startsWith(QUIZ_UPSTREAM))h.set('Location',loc.slice(QUIZ_UPSTREAM.length)||'/');
            return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h});
          }
          export default{async fetch(request,env){
            const u=new URL(request.url);
            if(u.pathname==='/review'&&request.method==='GET')return html(loginPage());
            if(u.pathname==='/review'&&request.method==='POST')return createReviewLogin(request,env);
            const s=await reviewSession(request,env);
            if(!s)return redirect('/review');
            if(u.pathname==='/')return redirect('/app');
            return proxy(request);
          }};
          JS
          cat > /tmp/quiz-owner-review/wrangler.toml <<TOML
          name = "$REVIEW_WORKER"
          main = "index.js"
          compatibility_date = "2026-09-17"
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "fpt-11plus-practice"
          database_id = "$QUIZ_D1_ID"
          TOML
          node --check /tmp/quiz-owner-review/index.js
          grep -Fq "$REVIEW_KEY_SHA256" /tmp/quiz-owner-review/index.js
          ! grep -Eq 'review key[^<]{0,40}[A-Za-z0-9_-]{20,}' /tmp/quiz-owner-review/index.js
          echo QUIZ_OWNER_REVIEW_GATEWAY_BUILD_PASS

      - name: Deploy isolated review Worker
        working-directory: /tmp/quiz-owner-review
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" deploy --config wrangler.toml --message 'Owner-only standalone Quiz review gateway; not linked from Portal'
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$REVIEW_WORKER" --json > /tmp/quiz-owner-review/deployment.json
          ACTIVE="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/quiz-owner-review/deployment.json | head -n1)"
          test -n "$ACTIVE"
          echo "$ACTIVE" > /tmp/quiz-owner-review/active-version.txt
          echo "QUIZ_OWNER_REVIEW_VERSION=$ACTIVE"

      - name: Verify review URL is external and fail-closed without key
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://${REVIEW_WORKER}.futureperfectlessons.workers.dev"
          for attempt in $(seq 1 12); do
            root="$(curl --silent --show-error --max-redirs 0 --output /tmp/quiz-owner-review/root.txt --dump-header /tmp/quiz-owner-review/root.headers --write-out '%{http_code}' "$BASE/")"
            login="$(curl --silent --show-error --max-redirs 0 --output /tmp/quiz-owner-review/login.html --write-out '%{http_code}' "$BASE/review")"
            bad="$(curl --silent --show-error --max-redirs 0 --request POST --data-urlencode 'key=definitely-not-the-owner-review-key' --output /tmp/quiz-owner-review/bad.html --write-out '%{http_code}' "$BASE/review")"
            if test "$root" = '303' && grep -iFq 'location: /review' /tmp/quiz-owner-review/root.headers && test "$login" = '200' && grep -Fq 'FPT 11+ Quiz · Owner Review' /tmp/quiz-owner-review/login.html && test "$bad" = '403'; then break; fi
            if test "$attempt" = '12'; then echo "REVIEW_VERIFY_FAILED root=$root login=$login bad=$bad" >&2; exit 1; fi
            sleep 5
          done
          printf '%s\n' "$BASE/review" > /tmp/quiz-owner-review/review-url.txt
          echo "QUIZ_OWNER_REVIEW_EXTERNAL_URL=$BASE/review"
          echo QUIZ_OWNER_REVIEW_FAIL_CLOSED_VERIFY_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-owner-review-worker-evidence
          path: /tmp/quiz-owner-review
          retention-days: 90
