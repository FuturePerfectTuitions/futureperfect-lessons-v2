name: Lesson release navigation branch verification

on:
  push:
    branches: [prelesson-navigation-surface]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify navigation and importer
        run: |
          set -euo pipefail
          node --check worker/src/index-phase20-change8.js
          node --check worker/src/index-phase20-change7.js
          node --check worker/src/admin-lesson-release-import.js
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          grep -Fq 'main = "src/index-phase20-change8.js"' worker/wrangler.toml
          echo 'LESSON_RELEASE_NAVIGATION_PASS'
