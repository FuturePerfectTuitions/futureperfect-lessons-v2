name: Owner special logins live verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-special-logins-live-verify-20260930.yml'
      - 'ops/verify_owner_special_logins_live_20260930.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Portal accounts read-only
        run: |
          sed -i 's#fpt-portal-v2-worker.futureperfectlessons.workers.dev#fpt-portal-v2-worker.future-perfect-tuitions.workers.dev#g' ops/verify_owner_special_logins_live_20260930.sh
          bash ops/verify_owner_special_logins_live_20260930.sh
