name: Owner special logins live verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-special-logins-live-verify-20260930.yml'
      - 'ops/verify_owner_special_logins_live_20260930.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all live owner Portal views read-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ops/verify_owner_special_logins_live_20260930.sh')
          text = path.read_text()
          old_body = '''  jq -nc --arg u "$id" --rawfile p "$work/credential.txt" '{username:$u,password:$p}' > "$work/login-body.json"'''
          new_body = '''  jq -nc --arg u "$id" --arg p "$(tr -d '\\r\\n' < "$work/credential.txt")" '{username:$u,password:$p}' > "$work/login-body.json"'''
          old_curl = '''  curl -fsS -c "$work/cookies-$id" -H 'Content-Type: application/json' --data @"$work/login-body.json" "$BASE/api/v1/student/auth/login" > "$work/login-$id.json"'''
          new_curl = '''  local login_status\n  login_status="$(curl -sS -o "$work/login-$id.json" -w '%{http_code}' -c "$work/cookies-$id" -H 'Content-Type: application/json' --data @"$work/login-body.json" "$BASE/api/v1/student/auth/login")"\n  echo "login_probe id=$id credentialLength=$(jq -r '.password|length' "$work/login-body.json") status=$login_status error=$(jq -r '.error // \"none\"' "$work/login-$id.json")"\n  [[ "$login_status" == "200" ]] || return 1'''
          marker = '''english_labels "$work/home-admin0411.json" > "$work/english-11.txt"'''
          diagnostics = '''english_labels "$work/home-admin0411.json" > "$work/english-11.txt"\necho 'all_views_admin0206='\njq -c '[.subjects[] | {subject,views:[.views[] | {viewId,label,current,group,previous,historical,lockedPreview,fullLibrary,fullLibraryAccess,accessSource}]}]' "$work/home-admin0206.json"\necho 'all_views_admin0411='\njq -c '[.subjects[] | {subject,views:[.views[] | {viewId,label,current,group,previous,historical,lockedPreview,fullLibrary,fullLibraryAccess,accessSource}]}]' "$work/home-admin0411.json"\ncurl -fsS -b "$work/cookies-admin0206" "$BASE/api/v1/student/quiz/eligibility" > "$work/quiz-normal-diagnostic.json"\ncurl -fsS -b "$work/cookies-admin0411" "$BASE/api/v1/student/quiz/eligibility" > "$work/quiz-11-diagnostic.json"\necho -n 'quiz_admin0206='; jq -c '{ok,eligible,currentLevel,error}' "$work/quiz-normal-diagnostic.json"\necho -n 'quiz_admin0411='; jq -c '{ok,eligible,currentLevel,error}' "$work/quiz-11-diagnostic.json"'''
          if old_body not in text or old_curl not in text or marker not in text:
              raise SystemExit('expected verifier lines not found')
          path.write_text(text.replace(old_body,new_body).replace(old_curl,new_curl).replace(marker,diagnostics))
          PY
          bash ops/verify_owner_special_logins_live_20260930.sh
