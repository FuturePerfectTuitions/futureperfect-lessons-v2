name: Temporary parent email ArrayBuffer patch

on:
  push:
    branches: [fix/email-signature-arraybuffer]
    paths:
      - '.github/workflows/tmp-fix-parent-email-arraybuffer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-signature-arraybuffer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch signature attachment to binary ArrayBufferView
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('worker/src/parent-email.js')
          s = p.read_text()

          replacements = [
            ("let signatureBase64Promise = null;", "let signatureBytesPromise = null;"),
            ("async function loadSignatureBase64(env = null) {", "async function loadSignatureBytes(env = null) {"),
            ("  const override = clean(env?.PARENT_EMAIL_SIGNATURE_BASE64);\n  if (override) return override;",
             "  const override = clean(env?.PARENT_EMAIL_SIGNATURE_BASE64);\n  if (override) {\n    const binary = atob(override);\n    const bytes = new Uint8Array(binary.length);\n    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);\n    return bytes;\n  }"),
            ("  if (!signatureBase64Promise) {\n    signatureBase64Promise = (async () => {",
             "  if (!signatureBytesPromise) {\n    signatureBytesPromise = (async () => {"),
            ("      return bytesToBase64(bytes);", "      return bytes;"),
            ("      signatureBase64Promise = null;", "      signatureBytesPromise = null;"),
            ("  return signatureBase64Promise;", "  return signatureBytesPromise;"),
            ("  let signatureBase64 = '';", "  let signatureBytes = null;"),
            ("    signatureBase64 = await loadSignatureBase64(env);", "    signatureBytes = await loadSignatureBytes(env);"),
            ("      content:signatureBase64,", "      content:signatureBytes,"),
            ("  loadSignatureBase64,", "  loadSignatureBytes,")
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected parent-email snippet: {old!r}')
            s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('tests/parent-email-import-verification.mjs')
          ts = t.read_text()
          old = "assert.equal(payload.attachments[0].content, TEST_SIGNATURE_BASE64);"
          new = "assert.ok(payload.attachments[0].content instanceof Uint8Array);\nassert.equal(new TextDecoder().decode(payload.attachments[0].content), 'test-signature');"
          if old not in ts:
            raise SystemExit('Missing expected attachment content assertion')
          ts = ts.replace(old, new, 1)
          ts = ts.replace(
            "// Production fetches this clean PNG server-side and then embeds the resulting\n// bytes as a CID image. Unit tests inject deterministic base64 so they never\n// depend on network access or manually copied image bytes.",
            "// Production fetches this clean PNG server-side and passes the exact binary\n// bytes to Cloudflare Email Sending as an ArrayBufferView CID attachment. Unit\n// tests inject deterministic base64 which is decoded to the same binary shape."
          )
          t.write_text(ts)
          PY

          node --check worker/src/parent-email.js
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-test-routing-verification.mjs

          rm .github/workflows/tmp-fix-parent-email-arraybuffer.yml

          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/parent-email.js tests/parent-email-import-verification.mjs .github/workflows/tmp-fix-parent-email-arraybuffer.yml
          git commit -m 'Send parent email signature as binary inline attachment'
          git push origin HEAD:fix/email-signature-arraybuffer
