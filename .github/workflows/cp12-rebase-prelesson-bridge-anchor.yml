name: CP12 rebase verified PreLesson VR Bridge anchor
on:
  push:
    branches: [feature/cp12-browser-promotion-2026-09-21]
    paths: ['.github/workflows/cp12-rebase-prelesson-bridge-anchor.yml']
permissions:
  contents: write
concurrency:
  group: cp12-browser-public-promotion
  cancel-in-progress: false
jobs:
  rebase-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cp12-browser-promotion-2026-09-21
          fetch-depth: 0
      - name: Rebase only the verified Bridge anchor and rollback verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/cp12-browser-public-promotion-propagation-aware.yml')
          s = p.read_text()
          old_bridge = 'EXPECTED_BRIDGE_VERSION: 2631c603-89eb-495c-b0e4-c2d87272a5b2'
          new_bridge = 'EXPECTED_BRIDGE_VERSION: 2ae28100-b4c6-40a3-87e2-42aef86c6fdf'
          if s.count(old_bridge) != 1:
              raise SystemExit(f'Expected exactly one old Bridge anchor, found {s.count(old_bridge)}')
          s = s.replace(old_bridge, new_bridge, 1)
          old_checks = """          if(pct(student,process.env.EXPECTED_STUDENT_VERSION)!==100)throw new Error('Student version moved');
          if(pct(bridge,process.env.EXPECTED_BRIDGE_VERSION)!==100)throw new Error('Bridge version moved');
          if(pct(quiz,process.env.EXPECTED_QUIZ_VERSION)!==100)throw new Error('Quiz version moved');"""
          new_checks = """          // During normal CP12 promotion, freeze every non-Browser component to its verified anchor.
          // During emergency rollback, restore/verify the Browser independently so an unrelated concurrent
          // production change cannot mask a successful Browser rollback.
          if(mode!=='rollback'){
            if(pct(student,process.env.EXPECTED_STUDENT_VERSION)!==100)throw new Error('Student version moved');
            if(pct(bridge,process.env.EXPECTED_BRIDGE_VERSION)!==100)throw new Error('Bridge version moved');
            if(pct(quiz,process.env.EXPECTED_QUIZ_VERSION)!==100)throw new Error('Quiz version moved');
          }"""
          if s.count(old_checks) != 1:
              raise SystemExit(f'Expected exactly one component-freeze block, found {s.count(old_checks)}')
          s = s.replace(old_checks, new_checks, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -Fq 'EXPECTED_BRIDGE_VERSION: 2ae28100-b4c6-40a3-87e2-42aef86c6fdf' .github/workflows/cp12-browser-public-promotion-propagation-aware.yml
          grep -Fq "if(mode!=='rollback'){" .github/workflows/cp12-browser-public-promotion-propagation-aware.yml
          ! grep -Fq 'EXPECTED_BRIDGE_VERSION: 2631c603-89eb-495c-b0e4-c2d87272a5b2' .github/workflows/cp12-browser-public-promotion-propagation-aware.yml
      - name: Commit the guarded rebase and trigger the promotion gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add .github/workflows/cp12-browser-public-promotion-propagation-aware.yml
          git diff --cached --exit-code && { echo 'No guarded rebase change found' >&2; exit 1; } || true
          git commit -m 'CP12 rebase Browser promotion onto verified PreLesson VR Bridge'
          git push origin HEAD:feature/cp12-browser-promotion-2026-09-21