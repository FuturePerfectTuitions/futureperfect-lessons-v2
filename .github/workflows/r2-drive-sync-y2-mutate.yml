name: R2 Drive sync Y2 mutate

on:
  workflow_dispatch:
  push:
    branches:
      - ops/r2-drive-sync-y2
    paths:
      - .github/workflows/r2-drive-sync-y2-mutate.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev

jobs:
  reconcile-first-y2-lessons:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: python3 -m pip install --quiet google-auth requests

      - name: Exclude PowerPoints and reconcile Y2T1E01 then Y2T1M01
        shell: bash
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          FOLDER_MIME = 'application/vnd.google-apps.folder'
          POWERPOINT_EXTENSIONS = {
              '.ppt', '.pptx', '.pptm', '.pps', '.ppsx', '.ppsm',
              '.pot', '.potx', '.potm', '.ppa', '.ppam', '.sldx', '.sldm',
          }

          LESSONS = [
              {
                  'code': 'Y2T1E01',
                  'subject': 'english',
                  'year': 'year2',
                  'drive_folder_id': '1_i54WilYBi_dMIiCC-n51oF5fEVc3ADV',
                  'old_r2_prefix': 'english/year2/Y2E1/',
                  'expected_names': {
                      'Y2T1E01 Answer Pack Homework Comprehension, Simple Present Simple Past.pdf',
                      'Y2T1E01 Homework Comprehension, Simple Present Simple Past.pdf',
                  },
              },
              {
                  'code': 'Y2T1M01',
                  'subject': 'maths',
                  'year': 'year2',
                  'drive_folder_id': '1qCX92s-3bxATWY-l05Qs01C0ioMMy81A',
                  'old_r2_prefix': 'maths/year2/Y2M1/',
                  'expected_names': {
                      'Y2T1M01 Answer Pack Homework Transition to Year 2.pdf',
                      'Y2T1M01 Homework Transition to Year 2.pdf',
                      'Y2T1M01 PreLesson Sheets Transition to Year 2.pdf',
                  },
              },
          ]

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def extension(name):
              lower = name.lower()
              dot = lower.rfind('.')
              return lower[dot:] if dot >= 0 else ''

          def classify(name):
              lower = name.lower()
              if 'answer pack' in lower or 'answer key' in lower:
                  return 'homework/answers'
              if 'prelesson' in lower or 'pre-lesson' in lower or 'pre lesson' in lower:
                  return 'prelesson/sheets'
              if 'homework' in lower:
                  return 'homework/sheets'
              return 'other'

          info = json.loads(os.environ['GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/drive.readonly'],
          )
          drive = AuthorizedSession(creds)

          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          bucket = os.environ['R2_BUCKET']
          auth_headers = {'Authorization': f'Bearer {token}'}
          base = f'https://api.cloudflare.com/client/v4/accounts/{acct}/r2/buckets/{bucket}/objects'

          def object_url(key):
              return base + '/' + urllib.parse.quote(key, safe='/')

          def list_all_r2():
              objects = []
              cursor = None
              while True:
                  params = {'per_page': '1000'}
                  if cursor:
                      params['cursor'] = cursor
                  r = requests.get(base, headers=auth_headers, params=params, timeout=120)
                  r.raise_for_status()
                  payload = r.json()
                  if not payload.get('success'):
                      raise RuntimeError(payload)
                  objects.extend(payload.get('result') or [])
                  ri = payload.get('result_info') or {}
                  cursor = ri.get('cursor') if ri.get('is_truncated') else None
                  if not cursor:
                      return objects

          def list_drive_children(folder_id):
              q = urllib.parse.quote(f"'{folder_id}' in parents and trashed=false", safe='')
              fields = urllib.parse.quote('nextPageToken,files(id,name,mimeType,size,modifiedTime)', safe='(),')
              page_token = None
              out = []
              while True:
                  url = (
                      'https://www.googleapis.com/drive/v3/files'
                      f'?q={q}&fields={fields}&pageSize=1000'
                      '&supportsAllDrives=true&includeItemsFromAllDrives=true'
                  )
                  if page_token:
                      url += '&pageToken=' + urllib.parse.quote(page_token, safe='')
                  r = drive.get(url, timeout=120)
                  r.raise_for_status()
                  payload = r.json()
                  out.extend(payload.get('files', []))
                  page_token = payload.get('nextPageToken')
                  if not page_token:
                      return out

          def walk_drive(folder_id, rel=''):
              files = []
              for item in list_drive_children(folder_id):
                  if item.get('mimeType') == FOLDER_MIME:
                      files.extend(walk_drive(item['id'], rel + item['name'] + '/'))
                  else:
                      item = dict(item)
                      item['relative_path'] = rel + item['name']
                      files.append(item)
              return files

          def reconcile(lesson):
              code = lesson['code']
              new_prefix = f"{lesson['subject']}/{lesson['year']}/{code}/"
              old_prefix = lesson['old_r2_prefix']

              children = walk_drive(lesson['drive_folder_id'])
              accepted = []
              excluded = []
              for item in children:
                  reason = None
                  if not item['name'].startswith(code):
                      reason = 'NON_CURRENT_CODE'
                  elif extension(item['name']) in POWERPOINT_EXTENSIONS:
                      reason = 'POWERPOINT_OWNER_EXCLUDED'
                  if reason:
                      excluded.append((item, reason))
                  else:
                      accepted.append(item)

              print('LESSON_START', code)
              print('DRIVE_RECURSIVE_FILE_COUNT', code, len(children))
              print('DRIVE_ACCEPTED_COUNT', code, len(accepted))
              print('DRIVE_EXCLUDED_COUNT', code, len(excluded))
              for item, reason in excluded:
                  print('DRIVE_EXCLUDED', code, json.dumps({
                      'id': item['id'],
                      'name': item['name'],
                      'relative_path': item['relative_path'],
                      'reason': reason,
                  }, sort_keys=True))

              actual_names = {item['name'] for item in accepted}
              if actual_names != lesson['expected_names']:
                  raise RuntimeError(
                      f"Unexpected accepted Drive set for {code}. "
                      f"expected={sorted(lesson['expected_names'])} actual={sorted(actual_names)}"
                  )

              authoritative = {}
              for item in sorted(accepted, key=lambda x: x['relative_path'].lower()):
                  media_url = f"https://www.googleapis.com/drive/v3/files/{item['id']}?alt=media&supportsAllDrives=true"
                  r = drive.get(media_url, timeout=240)
                  if not r.ok:
                      raise RuntimeError(f"Drive download failed for {item['name']}: HTTP {r.status_code} {r.text[:500]}")
                  body = r.content
                  if item.get('size') is not None and int(item['size']) != len(body):
                      raise RuntimeError(
                          f"Drive size mismatch for {item['name']}: metadata={item['size']} bytes={len(body)}"
                      )
                  key = new_prefix + classify(item['name']) + '/' + item['name']
                  if key in authoritative:
                      raise RuntimeError(f'Duplicate target R2 key: {key}')
                  authoritative[key] = {
                      'name': item['name'],
                      'mime': item.get('mimeType') or 'application/octet-stream',
                      'bytes': body,
                      'size': len(body),
                      'sha256': sha256(body),
                      'drive_id': item['id'],
                  }
                  print('DRIVE_AUTHORITATIVE', code, json.dumps({
                      'key': key,
                      'drive_id': item['id'],
                      'name': item['name'],
                      'size': len(body),
                      'sha256': sha256(body),
                  }, sort_keys=True))

              before = list_all_r2()
              old_objects = sorted(
                  (o.get('key') or '') for o in before
                  if (o.get('key') or '').startswith(old_prefix)
              )
              new_objects_before = sorted(
                  (o.get('key') or '') for o in before
                  if (o.get('key') or '').startswith(new_prefix)
              )
              print('R2_OLD_PREFIX_BEFORE', code, json.dumps(old_objects))
              print('R2_CURRENT_PREFIX_BEFORE', code, json.dumps(new_objects_before))

              # Write every accepted current Drive object afresh to its current lesson ID path.
              for key, rec in sorted(authoritative.items()):
                  upload_headers = {
                      'Authorization': f'Bearer {token}',
                      'Content-Type': rec['mime'],
                  }
                  r = requests.put(
                      object_url(key),
                      headers=upload_headers,
                      data=rec['bytes'],
                      timeout=300,
                  )
                  if not r.ok:
                      raise RuntimeError(f'R2 PUT failed for {key}: HTTP {r.status_code} {r.text[:1000]}')
                  payload = r.json()
                  if not payload.get('success'):
                      raise RuntimeError(payload)
                  print('AUDIT_ADD_OR_REPLACE', code, json.dumps({
                      'key': key,
                      'drive_id': rec['drive_id'],
                      'size': rec['size'],
                      'sha256': rec['sha256'],
                  }, sort_keys=True))

                  verify = requests.get(object_url(key), headers=auth_headers, timeout=300)
                  verify.raise_for_status()
                  body = verify.content
                  got_size = len(body)
                  got_sha = sha256(body)
                  if got_size != rec['size'] or got_sha != rec['sha256']:
                      raise RuntimeError(
                          f'Read-back mismatch for {key}: R2 size={got_size} sha={got_sha}'
                      )
                  print('VERIFY_R2_MATCH', code, json.dumps({
                      'key': key,
                      'size': got_size,
                      'sha256': got_sha,
                  }, sort_keys=True))

              # Only after all accepted resources verify, remove historical-ID objects.
              for key in old_objects:
                  r = requests.delete(object_url(key), headers=auth_headers, timeout=120)
                  r.raise_for_status()
                  payload = r.json()
                  if not payload.get('success'):
                      raise RuntimeError(payload)
                  print('AUDIT_DELETE_OLD_ID', code, key)

              # Remove unsupported/excess objects under the current ID, including any PowerPoint.
              expected_keys = set(authoritative)
              current_snapshot = list_all_r2()
              current_objects = sorted(
                  (o.get('key') or '') for o in current_snapshot
                  if (o.get('key') or '').startswith(new_prefix)
              )
              for key in current_objects:
                  if key not in expected_keys:
                      r = requests.delete(object_url(key), headers=auth_headers, timeout=120)
                      r.raise_for_status()
                      payload = r.json()
                      if not payload.get('success'):
                          raise RuntimeError(payload)
                      print('AUDIT_DELETE_EXCESS_CURRENT_PREFIX', code, key)

              after = list_all_r2()
              old_after = sorted(
                  (o.get('key') or '') for o in after
                  if (o.get('key') or '').startswith(old_prefix)
              )
              new_after = sorted(
                  (o.get('key') or '') for o in after
                  if (o.get('key') or '').startswith(new_prefix)
              )
              if old_after:
                  raise RuntimeError(f'{code}: historical R2 path still contains objects: {old_after}')
              if set(new_after) != expected_keys:
                  raise RuntimeError(
                      f'{code}: current lesson path parity failure. '
                      f'expected={sorted(expected_keys)} actual={new_after}'
                  )

              for key, rec in sorted(authoritative.items()):
                  verify = requests.get(object_url(key), headers=auth_headers, timeout=300)
                  verify.raise_for_status()
                  body = verify.content
                  if len(body) != rec['size'] or sha256(body) != rec['sha256']:
                      raise RuntimeError(f'{code}: final read-back mismatch for {key}')

              print('FINAL_R2_KEYS', code, json.dumps(new_after))
              print(code + '_EXACT_DRIVE_R2_PARITY_PASS')

          for lesson in LESSONS:
              reconcile(lesson)

          print('POWERPOINTS_EXCLUDED_OWNER_RULE_ACTIVE')
          print('Y2_FIRST_ENGLISH_AND_MATHS_LESSONS_PARITY_PASS')
          PY
