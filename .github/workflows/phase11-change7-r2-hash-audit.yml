name: Phase 11 Change 7 R2 exact-hash audit

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase11-change7-r2-hash-audit.yml]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  WORKER_NAME: fpt-portal-v2-worker
  EXPECTED_BUCKET: fpt-materials-dev

jobs:
  audit:
    if: github.head_ref == 'phase11-change7-r2-hash-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guard read-only diagnostic and V2 development R2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '${{ github.event.pull_request.base.sha }}'
          test "$(git diff --name-only '${{ github.event.pull_request.base.sha }}'..HEAD)" = '.github/workflows/phase11-change7-r2-hash-audit.yml'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e --arg b "$EXPECTED_BUCKET" '.result.bindings[] | select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name==$b)' /tmp/settings.json >/dev/null
      - name: List R2 objects and isolate exact-size candidates
        shell: bash
        run: |
          set -euo pipefail
          printf '[]' >/tmp/r2-objects.json
          cursor=''
          while :; do
            url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${EXPECTED_BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then
              encoded="$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$cursor")"
              url="${url}&cursor=${encoded}"
            fi
            page="$(curl --fail --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url")"
            jq -e '.success == true' <<<"$page" >/dev/null
            jq '[.result[]? | {key,size}]' <<<"$page" >/tmp/r2-page.json
            jq -s '.[0]+.[1]' /tmp/r2-objects.json /tmp/r2-page.json >/tmp/r2-next.json
            mv /tmp/r2-next.json /tmp/r2-objects.json
            cursor="$(jq -r '.result_info.cursor // empty' <<<"$page")"
            [ -z "$cursor" ] && break
          done
          jq -r '.lessons | to_entries[] | .value.homeworks[] | [.homework,.answerPack] | .[] | select(. != null) | [.sha256,.sizeBytes,.r2Key] | @tsv' \
            docs/data/phase11/change7-owner-homeworks.json >/tmp/expected.tsv
          jq -r '.[] | [.size,.key] | @tsv' /tmp/r2-objects.json >/tmp/r2-sizes.tsv
          : >/tmp/candidates.tsv
          while IFS=$'\t' read -r sha size desired; do
            while IFS=$'\t' read -r key; do
              printf '%s\t%s\t%s\t%s\n' "$sha" "$size" "$desired" "$key" >>/tmp/candidates.tsv
            done < <(awk -F '\t' -v s="$size" '$1==s {$1=""; sub(/^\t/,""); print}' /tmp/r2-sizes.tsv)
          done </tmp/expected.tsv
          echo "R2 objects: $(jq 'length' /tmp/r2-objects.json)"
          echo "Exact-size candidate rows: $(wc -l </tmp/candidates.tsv)"
      - name: SHA-256 candidate objects and report exact matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/change7-hash-audit
          : >/tmp/change7-hash-audit/matches.tsv
          : >/tmp/change7-hash-audit/candidates-checked.tsv
          n=0
          while IFS=$'\t' read -r expected_sha size desired key; do
            n=$((n+1))
            tmp="/tmp/change7-hash-audit/candidate.pdf"
            if npx --yes wrangler@${WRANGLER_VERSION} r2 object get "${EXPECTED_BUCKET}/${key}" --file="$tmp" --remote >/tmp/r2-get.log 2>&1; then
              actual="$(sha256sum "$tmp" | awk '{print $1}')"
              printf '%s\t%s\t%s\t%s\t%s\n' "$expected_sha" "$actual" "$size" "$desired" "$key" >>/tmp/change7-hash-audit/candidates-checked.tsv
              if [ "$actual" = "$expected_sha" ]; then
                printf '%s\t%s\t%s\t%s\n' "$expected_sha" "$size" "$desired" "$key" >>/tmp/change7-hash-audit/matches.tsv
              fi
            fi
          done </tmp/candidates.tsv
          echo '=== EXACT SHA-256 MATCHES ==='
          cat /tmp/change7-hash-audit/matches.tsv || true
          echo "Exact matches: $(wc -l </tmp/change7-hash-audit/matches.tsv)"
          node <<'NODE'
          const fs=require('fs');
          const expected=fs.readFileSync('/tmp/expected.tsv','utf8').trim().split(/\n/).filter(Boolean).map(x=>x.split('\t'));
          const matches=fs.readFileSync('/tmp/change7-hash-audit/matches.tsv','utf8').trim().split(/\n/).filter(Boolean).map(x=>x.split('\t'));
          const bySha=new Map();
          for(const row of matches){ if(!bySha.has(row[0])) bySha.set(row[0],[]); bySha.get(row[0]).push(row[3]); }
          const summary=expected.map(([sha,size,desired])=>({sha256:sha,sizeBytes:Number(size),desiredR2Key:desired,existingExactKeys:bySha.get(sha)||[]}));
          fs.writeFileSync('/tmp/change7-hash-audit/summary.json',JSON.stringify(summary,null,2));
          console.log(`Expected files: ${summary.length}; files with an existing exact object: ${summary.filter(x=>x.existingExactKeys.length).length}`);
          NODE
      - name: Upload read-only hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase11-change7-r2-hash-audit
          path: /tmp/change7-hash-audit/
          if-no-files-found: error
          retention-days: 7
      - name: Confirm no mutation
        run: "echo 'Read-only exact-hash audit complete; no R2/KV/D1/Worker write was executed.'"
