name: Inspect live Y5 English runtime (read-only)

on:
  push:
    branches:
      - diagnostic/y5e3-release-2026-09-20
    paths:
      - .github/workflows/inspect-prod-worker-y5e3.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read exact live non-secret access state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          STUDENTS_NS="$(jq -r '.result.bindings[] | select(.name=="STUDENTS_KV") | .namespace_id // empty' /tmp/settings.json | head -1)"
          test -n "$STUDENTS_NS"

          echo '=== Maahi non-secret access overrides ==='
          curl --fail --silent --show-error "$API/storage/kv/namespaces/$STUDENTS_NS/values/user:ma0605" -H "$AUTH" \
            | jq '{firstName, schoolYear, batches, blockedLessons, manualAccess, fullLibraries, historicalViews, upsellViews, vrEligible}'

          echo '=== Kiaan non-secret access overrides ==='
          curl --fail --silent --show-error "$API/storage/kv/namespaces/$STUDENTS_NS/values/user:kiaan1312" -H "$AUTH" \
            | jq '{firstName, schoolYear, batches, blockedLessons, manualAccess, fullLibraries, historicalViews, upsellViews, vrEligible}'

          echo '=== Current D1 English entitlement rows ==='
          npx --yes wrangler@latest d1 execute fpt_portal_v2_db --remote --command "SELECT portal_user_id_norm, lesson_id, core_access, vr_access, source_batch_code, source_lesson_date, last_confirmed_at FROM lesson_entitlements WHERE portal_user_id_norm IN ('ma0605','kiaan1312') AND lesson_id IN ('Y5E2','Y5E3','Y5E4') ORDER BY portal_user_id_norm, lesson_id;"

      - name: Confirm read-only completion
        run: echo 'Read-only inspection complete; no production mutation or deployment ran.'
