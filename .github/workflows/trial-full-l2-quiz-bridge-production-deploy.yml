name: Trial full L2 Quiz Bridge production deploy
on:
  push:
    branches: [fix/trial-11plus-full-l2-quiz-bridge-2026-09-22]
    paths: ['.github/workflows/trial-full-l2-quiz-bridge-production-deploy.yml']
permissions:
  contents: read
concurrency:
  group: trial-full-l2-quiz-bridge-production
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  WORKER_NAME: fpt-portal-v2-worker
  PORTAL_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  ORIGIN: https://lessons.futureperfect.education
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check worker/src/index-step10-quiz-bridge-trial-demo.js
          node tests/trial-full-l2-quiz-bridge.mjs
          node tests/cp12-quiz-redeem-v2.mjs
          node tests/admin-trial-manager-verification.mjs
          grep -Fq "./index-step10-quiz-bridge.js" worker/src/index-step10-quiz-bridge-trial-demo.js
          grep -Fq "./index-admin-tools.js" worker/src/index-step10-quiz-bridge.js
      - name: Fresh live snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,worker=process.env.WORKER_NAME,d1=process.env.PORTAL_D1_ID;
          const base='https://api.cloudflare.com/client/v4',headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(base+path,{headers});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`${r.status} ${path}`);return j.result;}
          const dep=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/deployments`);const ds=Array.isArray(dep?.deployments)?dep.deployments:Array.isArray(dep)?dep:[];const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];const oldVersion=String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');if(!oldVersion)throw new Error('Bridge active version unresolved');
          const s=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/settings`),bindings=s.bindings||[];
          const db=bindings.find(b=>b.name==='DB'&&b.type==='d1');if(!db||(db.id||db.database_id)!==d1)throw new Error(`Bridge D1 drift ${JSON.stringify(db)}`);
          if(!bindings.some(b=>b.name==='QUIZ_BRIDGE_SECRET'&&/secret/i.test(String(b.type))))throw new Error('QUIZ_BRIDGE_SECRET missing');
          const compact=bindings.map(b=>({name:b.name,type:b.type,namespace_id:b.namespace_id,id:b.id||b.database_id,bucket_name:b.bucket_name,service:b.service,environment:b.environment,text:b.type==='plain_text'?b.text:undefined})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
          fs.writeFileSync('/tmp/trial-bridge-before.json',JSON.stringify({oldVersion,bindings:compact},null,2),{mode:0o600});
          console.log(JSON.stringify({marker:'TRIAL_BRIDGE_PREFLIGHT_PASS',oldVersion,bindingCount:compact.length},null,2));
          NODE
          for p in rearm disable delete reset-passwords; do
            code="$(curl -sS -o /tmp/pre-$p.json -w '%{http_code}' -X OPTIONS "$BASE/api/v1/admin/trials/$p" -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization')"
            test "$code" = 200
          done
          code="$(curl -sS -o /tmp/admin-before.json -w '%{http_code}' -X POST "$BASE/api/v1/admin/trials/list" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}')"; test "$code" = 401
      - name: Deploy bridge wrapper with automatic rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD="$(jq -r .oldVersion /tmp/trial-bridge-before.json)"; DEPLOYED=0
          rollback(){ rc=$?; set +e; if [ "$DEPLOYED" = 1 ]; then npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$OLD@100%" --name "$WORKER_NAME" --message 'Rollback Trial full-L2 Quiz bridge' -y || true; sleep 4; fi; exit "$rc"; }
          trap rollback ERR
          WORKER_ENTRYPOINT=src/index-step10-quiz-bridge-trial-demo.js DEPLOY_MESSAGE='Trial full-L2 Quiz bridge with current Admin tools' bash ops/deploy_current_worker_preserve.sh
          DEPLOYED=1; sleep 5
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,worker=process.env.WORKER_NAME;
          const base='https://api.cloudflare.com/client/v4',headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(base+path,{headers});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`${r.status} ${path}`);return j.result;}
          const before=JSON.parse(fs.readFileSync('/tmp/trial-bridge-before.json','utf8'));
          const dep=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/deployments`);const ds=Array.isArray(dep?.deployments)?dep.deployments:Array.isArray(dep)?dep:[];const vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];const newVersion=String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');if(!newVersion||newVersion===before.oldVersion)throw new Error('Bridge version did not advance');
          const s=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(worker)}/settings`),compact=(s.bindings||[]).map(b=>({name:b.name,type:b.type,namespace_id:b.namespace_id,id:b.id||b.database_id,bucket_name:b.bucket_name,service:b.service,environment:b.environment,text:b.type==='plain_text'?b.text:undefined})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
          if(JSON.stringify(compact)!==JSON.stringify(before.bindings))throw new Error('Bridge bindings changed');
          console.log(JSON.stringify({marker:'TRIAL_BRIDGE_DEPLOY_TOPOLOGY_PASS',newVersion},null,2));
          NODE
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/${WORKER_NAME}" -o /tmp/trial-bridge-live.bin
          grep -aFq 'trialDemo' /tmp/trial-bridge-live.bin
          grep -aFq 'TRIAL_PREPARED_PORTAL_USER_REQUIRED' /tmp/trial-bridge-live.bin
          code="$(curl -sS -o /tmp/redeem.json -w '%{http_code}' -X POST "$BASE/api/v1/quiz-bridge/redeem" -H 'Content-Type: application/json' --data '{"code":"invalid"}')"; test "$code" = 401; grep -Fq 'UNAUTHORIZED' /tmp/redeem.json
          code="$(curl -sS -o /tmp/admin-after.json -w '%{http_code}' -X POST "$BASE/api/v1/admin/trials/list" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}')"; test "$code" = 401
          for p in rearm disable delete reset-passwords; do
            code="$(curl -sS -D /tmp/h-$p -o /tmp/b-$p -w '%{http_code}' -X OPTIONS "$BASE/api/v1/admin/trials/$p" -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization')"
            test "$code" = 200
            grep -iFq "access-control-allow-origin: $ORIGIN" /tmp/h-$p
            grep -iFq 'access-control-allow-methods: POST, OPTIONS' /tmp/h-$p
          done
          trap - ERR
          echo TRIAL_FULL_L2_QUIZ_BRIDGE_PRODUCTION_PASS
