name: CP12 approved V2 UI guarded production promotion

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths: ['docs/rebuild/CP12_APPROVED_V2_UI_PRODUCTION_TRIGGER.md']

permissions:
  contents: read
  actions: read

concurrency:
  group: cp12-approved-v2-ui-production
  cancel-in-progress: false

env:
  PROD_BASE: https://lessons.futureperfect.education
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_DB: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev
  EXPECTED_STUDENT_VERSION: bed8e660-facb-47f3-afad-7a9996d95c5a
  EXPECTED_STUDENT_ROLLBACK: 0751feed-5aa3-40fb-854f-5847c8603872
  EXPECTED_BROWSER_VERSION: 412d5dd1-8f36-4e84-b5b6-eba39c670820
  EXPECTED_LEGACY_VERSION: b1c8326e-a9cc-4150-b43b-cc572a4404c1
  OFFICIAL_CP12_SHA: b5e38b3768d269f632bbf4fc95e7d3f2a3fb3ba2
  METADATA_COMMIT: 9793028e34b16972defa64d3e465db907868e645
  CANDIDATE_FRONTEND_SHA: 598ec347ffddb126889f95d6a7753539e0ed3c97
  PREFLIGHT_RUN_ID: '34934456421'
  PREFLIGHT_HEAD_SHA: 5eb1e5f87d895adfe3855e78e8143904cd496873
  METADATA_HELPER_BLOB: 4cda45292706942a0e9f6b3c701a71c2a55c7d91
  WRANGLER_VERSION: 4.129.0
  PLAYWRIGHT_VERSION: 1.55.0
  CP12_METADATA_BACKUP: /tmp/cp12-resource-ui-pointer-backup.json
  CP12_METADATA_REPORT: /tmp/cp12-resource-ui-metadata-report.json

jobs:
  promote:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze exact source and successful production preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse origin/rebuild/checkpoint12-stabilisation-2026-09-14)" = "$OFFICIAL_CP12_SHA"
          git merge-base --is-ancestor "$OFFICIAL_CP12_SHA" HEAD
          test "$(git hash-object scripts/cp12-resource-ui-production-metadata.mjs)" = "$METADATA_HELPER_BLOB"
          for path in rebuild/adminops/src/lib/compiler.mjs rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/student/src/lib/runtime.mjs; do
            test "$(git rev-parse "${METADATA_COMMIT}:${path}")" = "$(git hash-object "${path}")"
          done
          RUNTIME_DIFF="$(git diff --name-only "$OFFICIAL_CP12_SHA"...HEAD -- rebuild/adminops/src/lib/compiler.mjs rebuild/shared/read-models/phase11-extension-resources.mjs rebuild/student/src/lib/runtime.mjs | sort)"
          test "$RUNTIME_DIFF" = $'rebuild/adminops/src/lib/compiler.mjs\nrebuild/shared/read-models/phase11-extension-resources.mjs\nrebuild/student/src/lib/runtime.mjs'
          node --check scripts/cp12-resource-ui-production-metadata.mjs
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}" -o /tmp/preflight-run.json
          jq -e --arg sha "$PREFLIGHT_HEAD_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .path==".github/workflows/cp12-approved-v2-ui-production-preflight-v3.yml"' /tmp/preflight-run.json >/dev/null
          echo CP12_RESOURCE_UI_EXACT_SOURCE_AND_PREFLIGHT_PASS

      - name: Install pinned deployment and browser tools
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}" "@playwright/test@${PLAYWRIGHT_VERSION}"

      - name: Checkout and build exact staging-proven frontend
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.CANDIDATE_FRONTEND_SHA }}
          path: candidate-frontend
          persist-credentials: false

      - name: Validate and stage exact Browser assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate-frontend rev-parse HEAD)" = "$CANDIDATE_FRONTEND_SHA"
          cd candidate-frontend
          npm install --no-audit --no-fund
          npm run test:static
          node tests/cp12-collapsible-resource-sections-static.mjs
          node tests/cp12-approved-v2-ui-parity-static.mjs
          npm run build
          grep -R -F 'Verbal Reasoning' dist >/dev/null
          grep -R -F 'data-resource-toggle' dist >/dev/null
          ! grep -R -F 'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev' dist
          cd "$GITHUB_WORKSPACE"
          rm -rf rebuild/browser-staging/public
          mkdir -p rebuild/browser-staging/public
          cp -a candidate-frontend/dist/. rebuild/browser-staging/public/
          echo CP12_RESOURCE_UI_FRONTEND_BUILD_PASS

      - name: Immediate pre-write production topology bindings versions and rollback gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}" "${AUTH[@]}" -o /tmp/zones.json
          ZONE_ID="$(jq -r '.result[]|select(.name=="futureperfect.education")|.id' /tmp/zones.json | head -n1)"; test -n "$ZONE_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes-before.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes-before.json >/dev/null
          for worker in "$LEGACY_WORKER" "$BROWSER_WORKER" "$STUDENT_WORKER"; do
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/settings" "${AUTH[@]}" -o "/tmp/${worker}-settings-before.json"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/${worker}-deployments-before.json"
          done
          jq -e --arg student "$STUDENT_WORKER" '.success==true and ([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .type=="service" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' "/tmp/${BROWSER_WORKER}-settings-before.json" >/dev/null
          jq -e --arg id "$EXPECTED_READ_MODELS_KV" 'any(.result.bindings[];.name=="READ_MODELS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings-before.json" >/dev/null
          jq -e --arg id "$EXPECTED_STUDENTS_KV" 'any(.result.bindings[];.name=="STUDENTS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings-before.json" >/dev/null
          jq -e --arg id "$EXPECTED_DB" 'any(.result.bindings[];.name=="DB" and (.database_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings-before.json" >/dev/null
          jq -e --arg bucket "$EXPECTED_R2" 'any(.result.bindings[];.name=="MATERIALS_R2" and (.bucket_name//.bucket)==$bucket)' "/tmp/${STUDENT_WORKER}-settings-before.json" >/dev/null
          jq -e 'any(.result.bindings[];.name=="AUTH_SIGNING_SECRET" and .type=="secret_text") and any(.result.bindings[];.name=="ACCESS_SCOPE_SECRET" and .type=="secret_text")' "/tmp/${STUDENT_WORKER}-settings-before.json" >/dev/null
          STUDENT_BEFORE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${STUDENT_WORKER}-deployments-before.json" | head -n1)"
          BROWSER_BEFORE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${BROWSER_WORKER}-deployments-before.json" | head -n1)"
          LEGACY_BEFORE="$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${LEGACY_WORKER}-deployments-before.json" | head -n1)"
          test "$STUDENT_BEFORE" = "$EXPECTED_STUDENT_VERSION"
          test "$BROWSER_BEFORE" = "$EXPECTED_BROWSER_VERSION"
          test "$LEGACY_BEFORE" = "$EXPECTED_LEGACY_VERSION"
          echo "STUDENT_BEFORE=$STUDENT_BEFORE" >> "$GITHUB_ENV"
          echo "BROWSER_BEFORE=$BROWSER_BEFORE" >> "$GITHUB_ENV"
          echo "LEGACY_BEFORE=$LEGACY_BEFORE" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions-before.json
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/browser-versions-before.json
          jq -e --arg v "$EXPECTED_STUDENT_ROLLBACK" 'any(.result.items[];.id==$v)' /tmp/student-versions-before.json >/dev/null
          jq -e --arg v "$STUDENT_BEFORE" 'any(.result.items[];.id==$v)' /tmp/student-versions-before.json >/dev/null
          jq -e --arg v "$BROWSER_BEFORE" 'any(.result.items[];.id==$v)' /tmp/browser-versions-before.json >/dev/null
          jq -r '.result.items[].id' /tmp/student-versions-before.json | sort -u >/tmp/student-version-ids-before
          jq -r '.result.items[].id' /tmp/browser-versions-before.json | sort -u >/tmp/browser-version-ids-before
          jq '[.result.bindings[]|if ((.type//"")|test("secret";"i")) then {name,type} else . end]|sort_by(.name)' "/tmp/${STUDENT_WORKER}-settings-before.json" >/tmp/student-bindings-before.json
          jq '[.result.bindings[]|if .type=="assets" then {name,type} else . end]|sort_by(.name)' "/tmp/${BROWSER_WORKER}-settings-before.json" >/tmp/browser-bindings-before.json
          ADMIN_PREWRITE_JSON="$(curl --fail --silent --show-error "${API}/storage/kv/namespaces/${EXPECTED_STUDENTS_KV}/values/user%3Aadmin" "${AUTH[@]}")"
          ADMIN_LOGIN_PREWRITE="$(printf '%s' "$ADMIN_PREWRITE_JSON" | jq -r '.p // empty')"
          ADMIN_ANSWER_PREWRITE="$(printf '%s' "$ADMIN_PREWRITE_JSON" | jq -r '.answerPassword // .answer_password // .answerPackPassword // .answer_pack_password // .ap // empty')"
          ADMIN_FIRST_PREWRITE="$(printf '%s' "$ADMIN_PREWRITE_JSON" | jq -r '.firstName // .name // empty')"
          echo "::add-mask::$ADMIN_LOGIN_PREWRITE"; echo "::add-mask::$ADMIN_ANSWER_PREWRITE"; echo "::add-mask::$ADMIN_FIRST_PREWRITE"
          valid4(){ local value="$1"; [ "${#value}" -eq 4 ] && [[ "$value" =~ [A-Z] ]] && [[ "$value" =~ [a-z] ]] && [[ "$value" =~ [0-9] ]]; }
          valid4 "$ADMIN_LOGIN_PREWRITE"; valid4 "$ADMIN_ANSWER_PREWRITE"; test -n "$ADMIN_FIRST_PREWRITE"
          unset ADMIN_PREWRITE_JSON ADMIN_LOGIN_PREWRITE ADMIN_ANSWER_PREWRITE ADMIN_FIRST_PREWRITE
          echo CP12_APPROVED_V2_UI_ADMIN_PREWRITE_CREDENTIAL_GATE_PASS
          echo CP12_RESOURCE_UI_IMMEDIATE_PREWRITE_GATE_PASS

      - name: Generate exact live-binding configs and dry-run both production bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/d1/database?per_page=100" "${AUTH[@]}" -o /tmp/d1-list.json
          python - <<'PY'
          import json
          from pathlib import Path
          d1=json.load(open('/tmp/d1-list.json')).get('result') or []
          if isinstance(d1,dict): d1=d1.get('items') or d1.get('databases') or []
          db_names={str(x.get('uuid') or x.get('id') or ''):str(x.get('name') or x.get('database_name') or '') for x in d1}
          def q(v): return json.dumps(str(v))
          def config(settings_path,name,main,kind):
              settings=json.load(open(settings_path))['result']; bindings=settings.get('bindings') or []
              allowed={'plain_text','secret_text','kv_namespace','d1','r2_bucket'} if kind=='student' else {'plain_text','service','assets'}
              unknown=[(b.get('name'),b.get('type')) for b in bindings if b.get('type') not in allowed]
              if unknown: raise SystemExit(f'Unsupported {kind} bindings: {unknown}')
              compatibility=settings.get('compatibility_date') or '2026-08-20'
              lines=[f'name = {q(name)}',f'main = {q(main)}',f'compatibility_date = {q(compatibility)}','workers_dev = true','keep_vars = true','']
              flags=settings.get('compatibility_flags') or []
              if flags: lines.append('compatibility_flags = ['+', '.join(q(x) for x in flags)+']')
              plain=sorted((b for b in bindings if b.get('type')=='plain_text'),key=lambda x:x['name'])
              if plain:
                  lines.append('[vars]')
                  for b in plain: lines.append(f"{b['name']} = {q(b.get('text') or '')}")
                  lines.append('')
              secrets=sorted(b['name'] for b in bindings if 'secret' in str(b.get('type','')).lower())
              if secrets:
                  lines += ['[secrets]','required = ['+', '.join(q(x) for x in secrets)+']','']
              for b in sorted((x for x in bindings if x.get('type')=='kv_namespace'),key=lambda x:x['name']):
                  ident=b.get('namespace_id') or b.get('id')
                  if not ident: raise SystemExit(f"Missing KV id {b['name']}")
                  lines += ['[[kv_namespaces]]',f"binding = {q(b['name'])}",f"id = {q(ident)}",'']
              for b in sorted((x for x in bindings if x.get('type')=='d1'),key=lambda x:x['name']):
                  ident=str(b.get('database_id') or b.get('id') or ''); dbname=db_names.get(ident,'')
                  if not ident or not dbname: raise SystemExit(f"Missing D1 name {b['name']}:{ident}")
                  lines += ['[[d1_databases]]',f"binding = {q(b['name'])}",f"database_name = {q(dbname)}",f"database_id = {q(ident)}",'']
              for b in sorted((x for x in bindings if x.get('type')=='r2_bucket'),key=lambda x:x['name']):
                  bucket=b.get('bucket_name') or b.get('bucket')
                  if not bucket: raise SystemExit(f"Missing R2 bucket {b['name']}")
                  lines += ['[[r2_buckets]]',f"binding = {q(b['name'])}",f"bucket_name = {q(bucket)}",'']
              if kind=='browser':
                  services=[b for b in bindings if b.get('type')=='service']
                  if len(services)!=1 or services[0].get('name')!='STAGING_API' or services[0].get('service')!='fpt-portal-v2-rebuild-student-prod': raise SystemExit('Browser service binding drift')
                  b=services[0]
                  lines += ['[[services]]',f"binding = {q(b['name'])}",f"service = {q(b['service'])}",'','[assets]','directory = "./rebuild/browser-staging/public"','binding = "ASSETS"','run_worker_first = true','']
              return '\n'.join(lines)+'\n'
          Path('wrangler.cp12-student-prod.toml').write_text(config('/tmp/fpt-portal-v2-rebuild-student-prod-settings-before.json','fpt-portal-v2-rebuild-student-prod','rebuild/student/src/index.js','student'))
          Path('wrangler.cp12-browser-prod.toml').write_text(config('/tmp/fpt-portal-v2-rebuild-browser-prod-settings-before.json','fpt-portal-v2-rebuild-browser-prod','rebuild/browser-staging/src/index.js','browser'))
          PY
          npx wrangler@"$WRANGLER_VERSION" deploy --config wrangler.cp12-student-prod.toml --keep-vars --dry-run --outdir /tmp/cp12-student-dry | tee /tmp/student-dry.log
          npx wrangler@"$WRANGLER_VERSION" deploy --config wrangler.cp12-browser-prod.toml --keep-vars --dry-run --outdir /tmp/cp12-browser-dry | tee /tmp/browser-dry.log
          grep -Fq 'Total Upload' /tmp/student-dry.log
          grep -Fq 'Total Upload' /tmp/browser-dry.log
          echo CP12_RESOURCE_UI_BINDING_PRESERVING_DRY_RUN_PASS

      - name: Upload Student and Browser candidates as undeployed versions
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler@"$WRANGLER_VERSION" versions upload --config wrangler.cp12-student-prod.toml --message "CP12 resource presentation metadata ${GITHUB_SHA}" --tag cp12-resource-ui-student | tee /tmp/student-version-upload.log
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions-uploaded.json
          jq -r '.result.items[].id' /tmp/student-versions-uploaded.json | sort -u >/tmp/student-version-ids-after
          comm -13 /tmp/student-version-ids-before /tmp/student-version-ids-after >/tmp/student-new-version-ids
          test "$(wc -l </tmp/student-new-version-ids | tr -d ' ')" = '1'
          STUDENT_CANDIDATE="$(cat /tmp/student-new-version-ids)"; test -n "$STUDENT_CANDIDATE"
          echo "STUDENT_CANDIDATE=$STUDENT_CANDIDATE" >> "$GITHUB_ENV"

          npx wrangler@"$WRANGLER_VERSION" versions upload --config wrangler.cp12-browser-prod.toml --message "CP12 collapsible resource hierarchy ${GITHUB_SHA}" --tag cp12-resource-ui-browser | tee /tmp/browser-version-upload.log
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/browser-versions-uploaded.json
          jq -r '.result.items[].id' /tmp/browser-versions-uploaded.json | sort -u >/tmp/browser-version-ids-after
          comm -13 /tmp/browser-version-ids-before /tmp/browser-version-ids-after >/tmp/browser-new-version-ids
          test "$(wc -l </tmp/browser-new-version-ids | tr -d ' ')" = '1'
          BROWSER_CANDIDATE="$(cat /tmp/browser-new-version-ids)"; test -n "$BROWSER_CANDIDATE"
          echo "BROWSER_CANDIDATE=$BROWSER_CANDIDATE" >> "$GITHUB_ENV"

          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/deployments" "${AUTH[@]}" -o /tmp/student-deployments-after-upload.json
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/deployments" "${AUTH[@]}" -o /tmp/browser-deployments-after-upload.json
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/student-deployments-after-upload.json | head -n1)" = "$STUDENT_BEFORE"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/browser-deployments-after-upload.json | head -n1)" = "$BROWSER_BEFORE"
          jq -n --arg marker CP12_RESOURCE_UI_CANDIDATE_UPLOAD_PASS --arg student "$STUDENT_CANDIDATE" --arg browser "$BROWSER_CANDIDATE" '{marker:$marker,status:"PASS",productionTrafficChanged:false,studentCandidate:$student,browserCandidate:$browser}' | tee /tmp/cp12-resource-ui-candidate-upload.json

      - name: Publish presentationGroup metadata to published prepared lesson scopes only
        shell: bash
        env:
          CP12_METADATA_ACTION: apply
          CP12_KV_VERIFY_TIMEOUT_MS: '120000'
          CP12_KV_VERIFY_POLL_MS: '1500'
          CP12_KV_VERIFY_CONCURRENCY: '12'
        run: |
          set -Eeuo pipefail
          node scripts/cp12-resource-ui-production-metadata.mjs
          jq -e '.marker=="CP12_RESOURCE_UI_METADATA_APPLY_PASS" and .status=="PASS" and .onlyPresentationGroupChanged==true and .accessScopesChanged==false and .sourceLessonWrites==0 and .changedLessonScopes>300' "$CP12_METADATA_REPORT" >/dev/null
          echo 'METADATA_PUBLISHED=true' >> "$GITHUB_ENV"
          echo CP12_RESOURCE_UI_METADATA_PUBLICATION_PASS

      - name: Add Student candidate at zero percent and authenticated-smoke through real Browser
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ env.EXPECTED_STUDENTS_KV }}
          SMOKE_BASE_URL: https://lessons.futureperfect.education
          SMOKE_PHASE: cp12-resource-ui-student-zero-percent
          EXPECT_ADMIN_STATUS: '200'
          OVERRIDE_WORKER: ${{ env.STUDENT_WORKER }}
          OVERRIDE_VERSION: ${{ env.STUDENT_CANDIDATE }}
          SMOKE_OUTPUT: /tmp/cp12-resource-ui-student-zero-smoke.json
        run: |
          set -Eeuo pipefail
          rollback_student(){ npx wrangler@"$WRANGLER_VERSION" versions deploy "${STUDENT_BEFORE}@100%" --name "$STUDENT_WORKER" -y --message 'CP12 resource UI automatic Student rollback' || true; }
          trap rollback_student ERR
          npx wrangler@"$WRANGLER_VERSION" versions deploy "${STUDENT_CANDIDATE}@0%" "${STUDENT_BEFORE}@100%" --name "$STUDENT_WORKER" -y --message 'CP12 resource UI Student zero-percent smoke'
          node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
          trap - ERR
          echo CP12_RESOURCE_UI_STUDENT_ZERO_PERCENT_PASS

      - name: Promote Student candidate to 100 percent and public-smoke
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ env.EXPECTED_STUDENTS_KV }}
          SMOKE_BASE_URL: https://lessons.futureperfect.education
          SMOKE_PHASE: cp12-resource-ui-student-promoted
          EXPECT_ADMIN_STATUS: '200'
          SMOKE_OUTPUT: /tmp/cp12-resource-ui-student-production-smoke.json
        run: |
          set -Eeuo pipefail
          rollback_student(){ npx wrangler@"$WRANGLER_VERSION" versions deploy "${STUDENT_BEFORE}@100%" --name "$STUDENT_WORKER" -y --message 'CP12 resource UI automatic Student rollback' || true; }
          trap rollback_student ERR
          npx wrangler@"$WRANGLER_VERSION" versions deploy "${STUDENT_CANDIDATE}@100%" --name "$STUDENT_WORKER" -y --message 'CP12 resource presentation metadata runtime'
          sleep 2
          node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
          trap - ERR
          echo CP12_RESOURCE_UI_STUDENT_PROMOTION_PASS

      - name: Add Browser candidate at zero percent and authenticated-smoke candidate version
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ env.EXPECTED_STUDENTS_KV }}
          SMOKE_BASE_URL: https://lessons.futureperfect.education
          SMOKE_PHASE: cp12-resource-ui-browser-zero-percent
          EXPECT_ADMIN_STATUS: '200'
          OVERRIDE_WORKER: ${{ env.BROWSER_WORKER }}
          OVERRIDE_VERSION: ${{ env.BROWSER_CANDIDATE }}
          SMOKE_OUTPUT: /tmp/cp12-resource-ui-browser-zero-smoke.json
        run: |
          set -Eeuo pipefail
          rollback_browser(){ npx wrangler@"$WRANGLER_VERSION" versions deploy "${BROWSER_BEFORE}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 resource UI automatic Browser rollback' || true; }
          trap rollback_browser ERR
          npx wrangler@"$WRANGLER_VERSION" versions deploy "${BROWSER_CANDIDATE}@0%" "${BROWSER_BEFORE}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 resource UI Browser zero-percent smoke'
          node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
          trap - ERR
          echo CP12_RESOURCE_UI_BROWSER_ZERO_PERCENT_PASS

      - name: Promote Browser candidate and run cache-safe public hierarchy UAT
        shell: bash
        run: |
          set -Eeuo pipefail
          rollback_browser(){ npx wrangler@"$WRANGLER_VERSION" versions deploy "${BROWSER_BEFORE}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 resource UI automatic Browser rollback' || true; }
          trap rollback_browser ERR
          npx wrangler@"$WRANGLER_VERSION" versions deploy "${BROWSER_CANDIDATE}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 collapsible resource hierarchy'
          sleep 2
          npx playwright install --with-deps chromium
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          ADMIN_JSON="$(curl --fail --silent --show-error "${API}/storage/kv/namespaces/${EXPECTED_STUDENTS_KV}/values/user%3Aadmin" "${AUTH[@]}")"
          UAT_LOGIN_PASSWORD="$(printf '%s' "$ADMIN_JSON" | jq -r '.p // empty')"
          test -n "$UAT_LOGIN_PASSWORD"
          echo "::add-mask::$UAT_LOGIN_PASSWORD"
          export UAT_LOGIN_PASSWORD CP12_BROWSER_BASE_URL="$PROD_BASE"
          ADMIN_ANSWER_PASSWORD="$(printf '%s' "$ADMIN_JSON" | jq -r '.answerPassword // .answer_password // empty')"
          ADMIN_FIRST_NAME="$(printf '%s' "$ADMIN_JSON" | jq -r '.firstName // .name // "Admin"')"
          [[ "$ADMIN_ANSWER_PASSWORD" =~ [A-Z] ]] && [[ "$ADMIN_ANSWER_PASSWORD" =~ [a-z] ]] && [[ "$ADMIN_ANSWER_PASSWORD" =~ [0-9] ]] && [ "${#ADMIN_ANSWER_PASSWORD}" -eq 4 ]
          echo "::add-mask::$ADMIN_ANSWER_PASSWORD"
          export UAT_ANSWER_PASSWORD="$ADMIN_ANSWER_PASSWORD" UAT_EXPECTED_FIRST_NAME="$ADMIN_FIRST_NAME"
          EXPECTED_JS="$(basename "$(find candidate-frontend/dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*protected-viewer*' | head -n1)")"
          curl --fail --silent --show-error -H 'cache-control: no-cache' "$PROD_BASE/?cp12-approved-v2-ui=${GITHUB_RUN_ID}" -o /tmp/cp12-approved-v2-ui-public-index.html
          grep -F "/assets/${EXPECTED_JS}" /tmp/cp12-approved-v2-ui-public-index.html >/dev/null
          export UAT_EXPECTED_JS="$EXPECTED_JS" UAT_USERNAME="admin"
          node --check scripts/cp12-approved-v2-ui-production-uat.mjs
          node scripts/cp12-approved-v2-ui-production-uat.mjs
          cp /tmp/cp12-approved-v2-ui-production-uat.json /tmp/cp12-resource-ui-browser-uat.json
          rm -rf /tmp/cp12-resource-ui-browser-evidence
          cp -a /tmp/cp12-approved-v2-ui-production-evidence /tmp/cp12-resource-ui-browser-evidence
          jq -e '.marker=="CP12_APPROVED_V2_UI_PRODUCTION_BROWSER_UAT_PASS" and .visual.personalisedPortal!=null and .visual.back.position=="fixed" and .visual.answerPassword.eyeIcon==true and .vr.outerSection==true and .vr.preLessonSubgroup==true and .vr.homeworkSubgroup==true and .vr.protectedAnswers>=2 and .ordinary.vrSectionAbsent==true and .security.answerControlsRemainPasswordGated==true' /tmp/cp12-approved-v2-ui-browser-uat.json >/dev/null
          trap - ERR
          echo CP12_RESOURCE_UI_PUBLIC_BROWSER_UAT_PASS

      - name: Final topology bindings versions rollback-retention and legacy guard verification
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes-after.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes-after.json >/dev/null
          for worker in "$LEGACY_WORKER" "$BROWSER_WORKER" "$STUDENT_WORKER"; do
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/settings" "${AUTH[@]}" -o "/tmp/${worker}-settings-after.json"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/${worker}-deployments-after.json"
          done
          jq '[.result.bindings[]|if ((.type//"")|test("secret";"i")) then {name,type} else . end]|sort_by(.name)' "/tmp/${STUDENT_WORKER}-settings-after.json" >/tmp/student-bindings-after.json
          jq '[.result.bindings[]|if .type=="assets" then {name,type} else . end]|sort_by(.name)' "/tmp/${BROWSER_WORKER}-settings-after.json" >/tmp/browser-bindings-after.json
          cmp /tmp/student-bindings-before.json /tmp/student-bindings-after.json
          cmp /tmp/browser-bindings-before.json /tmp/browser-bindings-after.json
          jq -e --arg student "$STUDENT_WORKER" '([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' "/tmp/${BROWSER_WORKER}-settings-after.json" >/dev/null
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${STUDENT_WORKER}-deployments-after.json" | head -n1)" = "$STUDENT_CANDIDATE"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${BROWSER_WORKER}-deployments-after.json" | head -n1)" = "$BROWSER_CANDIDATE"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${LEGACY_WORKER}-deployments-after.json" | head -n1)" = "$LEGACY_BEFORE"
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions-after.json
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/browser-versions-after.json
          jq -e --arg old "$STUDENT_BEFORE" 'any(.result.items[];.id==$old)' /tmp/student-versions-after.json >/dev/null
          jq -e --arg old "$EXPECTED_STUDENT_ROLLBACK" 'any(.result.items[];.id==$old)' /tmp/student-versions-after.json >/dev/null
          jq -e --arg old "$BROWSER_BEFORE" 'any(.result.items[];.id==$old)' /tmp/browser-versions-after.json >/dev/null
          curl --fail --silent --show-error "$PROD_BASE/?cp12-ui-health=${GITHUB_RUN_ID}" -H 'cache-control: no-cache' -o /tmp/public-index.html
          grep -Fq '<!doctype html' /tmp/public-index.html || grep -Fq '<!DOCTYPE html' /tmp/public-index.html
          jq -n --arg marker CP12_RESOURCE_UI_PRODUCTION_PROMOTION_PASS --arg studentBefore "$STUDENT_BEFORE" --arg studentAfter "$STUDENT_CANDIDATE" --arg browserBefore "$BROWSER_BEFORE" --arg browserAfter "$BROWSER_CANDIDATE" --arg legacy "$LEGACY_BEFORE" --slurpfile metadata "$CP12_METADATA_REPORT" --slurpfile uat /tmp/cp12-resource-ui-browser-uat.json '{marker:$marker,status:"PASS",canonicalTopology:true,browserToAdminOps:false,student:{before:$studentBefore,after:$studentAfter,bindingsPreserved:true},browser:{before:$browserBefore,after:$browserAfter,bindingsPreserved:true},legacy:{version:$legacy,unchanged:true},metadata:$metadata[0],browserUat:$uat[0],rollbackVersionsRetained:true}' | tee /tmp/cp12-resource-ui-production-promotion.json
          echo CP12_RESOURCE_UI_FINAL_INVARIANTS_PASS

      - name: Automatic full rollback on any promotion failure
        if: failure()
        shell: bash
        env:
          CP12_METADATA_ACTION: rollback
          CP12_ROLLBACK_REASON: automatic after production promotion failure
          CP12_KV_VERIFY_TIMEOUT_MS: '120000'
          CP12_KV_VERIFY_POLL_MS: '1500'
          CP12_KV_VERIFY_CONCURRENCY: '12'
        run: |
          set +e
          OVERALL_RC=0
          echo 'CP12 approved V2 UI failure detected; restoring any changed Browser, Student and prepared pointers.'
          if [ -n "${BROWSER_BEFORE:-}" ]; then
            npx wrangler@"$WRANGLER_VERSION" versions deploy "${BROWSER_BEFORE}@100%" --name "$BROWSER_WORKER" -y --message 'CP12 approved V2 UI full automatic Browser rollback' || OVERALL_RC=1
          fi
          if [ -n "${STUDENT_BEFORE:-}" ]; then
            npx wrangler@"$WRANGLER_VERSION" versions deploy "${STUDENT_BEFORE}@100%" --name "$STUDENT_WORKER" -y --message 'CP12 approved V2 UI full automatic Student rollback' || OVERALL_RC=1
          fi
          if [ -s "$CP12_METADATA_BACKUP" ]; then
            node scripts/cp12-resource-ui-production-metadata.mjs || OVERALL_RC=1
          else
            echo 'No prepared-pointer backup exists; metadata publication had not started.'
          fi
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          if [ -n "${STUDENT_BEFORE:-}" ]; then
            curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/deployments" "${AUTH[@]}" -o /tmp/student-rollback-deployments.json || OVERALL_RC=1
            if [ -s /tmp/student-rollback-deployments.json ]; then
              test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/student-rollback-deployments.json | head -n1)" = "$STUDENT_BEFORE" || OVERALL_RC=1
            else
              OVERALL_RC=1
            fi
          fi
          if [ -n "${BROWSER_BEFORE:-}" ]; then
            curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/deployments" "${AUTH[@]}" -o /tmp/browser-rollback-deployments.json || OVERALL_RC=1
            if [ -s /tmp/browser-rollback-deployments.json ]; then
              test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' /tmp/browser-rollback-deployments.json | head -n1)" = "$BROWSER_BEFORE" || OVERALL_RC=1
            else
              OVERALL_RC=1
            fi
          fi
          if [ "$OVERALL_RC" -ne 0 ]; then
            echo CP12_RESOURCE_UI_AUTOMATIC_FULL_ROLLBACK_FAIL >&2
            exit 1
          fi
          echo CP12_RESOURCE_UI_AUTOMATIC_FULL_ROLLBACK_PASS

      - name: Upload production promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-approved-v2-ui-production-promotion-v3
          path: |
            /tmp/cp12-resource-ui-candidate-upload.json
            /tmp/cp12-resource-ui-pointer-backup.json
            /tmp/cp12-resource-ui-metadata-report.json
            /tmp/cp12-resource-ui-student-zero-smoke.json
            /tmp/cp12-resource-ui-student-production-smoke.json
            /tmp/cp12-resource-ui-browser-zero-smoke.json
            /tmp/cp12-resource-ui-browser-uat.json
            /tmp/cp12-resource-ui-browser-evidence
            /tmp/cp12-resource-ui-production-promotion.json
            /tmp/student-bindings-before.json
            /tmp/student-bindings-after.json
            /tmp/browser-bindings-before.json
            /tmp/browser-bindings-after.json
          if-no-files-found: warn
          retention-days: 30
