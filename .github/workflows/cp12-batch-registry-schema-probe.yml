name: CP12 batch-registry schema probe

on:
  push:
    branches:
      - fix/cp12-complete-batch-view-registry-2026-09-14
    paths:
      - 'scripts/cp12-batch-registry-schema-probe.mjs'
      - '.github/workflows/cp12-batch-registry-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/cp12-batch-registry-schema-probe.mjs
      - run: node scripts/cp12-batch-registry-schema-probe.mjs
