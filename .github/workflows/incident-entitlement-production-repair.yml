name: Incident - Guarded Entitlement Production Repair

on:
  push:
    branches:
      - incident/entitlement-audit-2026-09-15
    paths:
      - 'docs/rebuild/INCIDENT_ENTITLEMENT_PRODUCTION_REPAIR_TRIGGER.md'

permissions:
  contents: read

concurrency:
  group: incident-entitlement-production-repair-2026-09-15
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_HOST: lessons.futureperfect.education
      LEGACY_WORKER: fpt-portal-v2-worker
      BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
      STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
      AS_OF_DATE: '2026-09-15'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static guard before production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/incident-entitlement-production-repair.mjs
          node --check scripts/incident-entitlement-semantic-audit-v2.mjs
          node --check scripts/incident-roster-entitlement-audit.mjs
          test "$(git rev-parse --abbrev-ref HEAD)" = 'incident/entitlement-audit-2026-09-15'

      - name: Apply guarded source repair and canonical prepared-model republish
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/incident-entitlement-production-repair.mjs

      - name: Independent semantic all-user post-repair audit
        shell: bash
        env:
          TARGET_USER: dha2806
          TARGET_LESSON: Y4T1EE01
        run: |
          set -Eeuo pipefail
          node scripts/incident-entitlement-semantic-audit-v2.mjs | tee /tmp/postrepair-semantic-console.log
          test -s /tmp/entitlement-semantic-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/entitlement-semantic-audit.json','utf8'));
          if(r.status!=='PASS') throw new Error(`Semantic audit is ${r.status}`);
          if(Number(r?.semanticUnderEntitlements?.currentRows||0)!==0) throw new Error('Current semantic under-entitlements remain.');
          if(r?.target?.storedEntitlement?.vr!==true) throw new Error('Dha2806 stored VR is not true.');
          if(r?.target?.profileVrEligible!==true) throw new Error('Dha2806 profile VR eligibility is not true.');
          if(Number(r?.target?.lesson?.vrHomeworkCount||0)<1) throw new Error('Y4E1 VR homework missing after repair.');
          NODE

      - name: Roster-backed post-repair check with assignment drift explicitly isolated
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          node scripts/incident-roster-entitlement-audit.mjs | tee /tmp/postrepair-roster-console.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          test -s /tmp/roster-entitlement-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/roster-entitlement-audit.json','utf8'));
          const d=r.defects||{};
          if((d.configProblems||[]).length) throw new Error('Roster/batch-definition configuration problems remain.');
          if((d.entitlementRows||[]).length) throw new Error('Roster-backed entitlement row defects remain.');
          if((d.profileProblems||[]).length) throw new Error('Roster-backed profile VR defects remain.');
          if((d.sourceBatchVrProblems||[]).length) throw new Error('English11 source-batch VR defects remain.');
          console.log(JSON.stringify({marker:'INCIDENT_POSTREPAIR_ROSTER_ENTITLEMENT_PASS',assignmentProblemsDeferred:(d.assignmentProblems||[]).length},null,2));
          NODE

      - name: Upload safe repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-entitlement-production-repair-2026-09-15
          path: |
            /tmp/incident-entitlement-production-repair.json
            /tmp/entitlement-semantic-audit.json
            /tmp/dha2806-trace.json
            /tmp/roster-entitlement-audit.json
            /tmp/postrepair-semantic-console.log
            /tmp/postrepair-roster-console.log
          if-no-files-found: warn
          retention-days: 30
