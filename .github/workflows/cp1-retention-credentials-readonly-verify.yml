name: CP1 retention credentials read-only verify

on:
  push:
    branches:
      - ops/cp1-retention-control-v1-2026-09-20
    paths:
      - '.github/workflows/cp1-retention-credentials-readonly-verify.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Exact identity and read-only invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "$AUTH" "$API/d1/database/$D1_ID" > /tmp/db.json
          jq -e --arg id "$D1_ID" '.success==true and .result.uuid==$id and .result.name=="fpt-11plus-practice"' /tmp/db.json >/dev/null
          curl -fsS -H "$AUTH" "$API/workers/scripts/$QUIZ_WORKER/settings" > /tmp/settings.json
          jq -e --arg id "$D1_ID" '.success==true and any(.result.bindings[]?; .name=="DB" and ((.id==$id) or (.database_id==$id)))' /tmp/settings.json >/dev/null
          curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT COUNT(*) AS n FROM question_instance WHERE UPPER(lifecycle_status)=\"LIVE\""}' \
            "$API/d1/database/$D1_ID/query" > /tmp/query.json
          jq -e '.success==true and .result[0].success==true and .result[0].results[0].n==714 and ((.result[0].meta.changes // 0)==0) and ((.result[0].meta.rows_written // 0)==0)' /tmp/query.json >/dev/null
          echo CP1_RETENTION_CREDENTIALS_READONLY_PASS
