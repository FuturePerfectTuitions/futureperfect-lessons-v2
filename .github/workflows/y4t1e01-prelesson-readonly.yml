name: Y4T1E01 PreLesson read-only preflight

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/y4t1e01-prelesson-readonly.yml
      - .github/y4t1e01-prelesson-readonly-trigger.txt

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  TARGET_KV_KEY: lesson:Y4E1

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Read live Worker settings and exact Y4E1 lesson only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')

          settings="$(curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success == true' <<<"$settings" >/dev/null
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' <<<"$settings" >/dev/null

          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          bucket="$(jq -r '.result.bindings[]? | select(.name=="MATERIALS_R2" and .type=="r2_bucket") | .bucket_name' <<<"$settings")"
          test -n "$ns"; test "$ns" != null
          test -n "$bucket"; test "$bucket" != null
          echo "ENVIRONMENT=production"
          echo "LESSONS_KV=${ns}"
          echo "MATERIALS_R2=${bucket}"

          enc="$(python -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$TARGET_KV_KEY")"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/${enc}" \
            -o /tmp/y4e1.json

          jq -e '.lessonId == "Y4E1"' /tmp/y4e1.json >/dev/null
          echo "LESSON_SHA256=$(sha256sum /tmp/y4e1.json | awk '{print $1}')"
          echo '=== Y4E1 identity and resource structure ==='
          jq '{
            lessonId,
            title,
            displayIds,
            video,
            presentation,
            homeworkCount: ((.homeworks // .core.homeworks // []) | length),
            homeworks: (.homeworks // .core.homeworks // []),
            phase11Resources,
            vr,
            elevenPlus
          }' /tmp/y4e1.json

          echo '=== Non-target structural counts ==='
          jq '{
            corePreLessonCount: ((.phase11Resources.core.preLessonPairs // []) | length),
            coreCumulativeCount: ((.phase11Resources.core.cumulativeHomeworks // []) | length),
            coreSupplementaryAnswerCount: ((.phase11Resources.core.supplementaryAnswers // []) | length),
            elevenPlusPreLessonCount: ((.phase11Resources.elevenPlus.preLessonPairs // []) | length),
            elevenPlusHomeworkCount: ((.phase11Resources.elevenPlus.homeworks // []) | length),
            elevenPlusCumulativeCount: ((.phase11Resources.elevenPlus.cumulativeHomeworks // []) | length),
            elevenPlusSupplementaryAnswerCount: ((.phase11Resources.elevenPlus.supplementaryAnswers // []) | length),
            vrSupplementaryAnswerCount: ((.phase11Resources.vr.supplementaryAnswers // []) | length)
          }' /tmp/y4e1.json

      - name: Confirm read-only completion
        run: echo 'PASS: Y4E1 preflight was read-only; no production data was changed.'
