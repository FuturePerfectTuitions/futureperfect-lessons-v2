# Owner-authorised Aar1811 completed-L3 production apply: 2026-09-28
name: Aar1811 completed L3 guarded production correction

on:
  push:
    branches: ['fix/y6-l3-sats-prepared-model-2026-09-27']
    paths:
      - 'scripts/apply-aar1811-completed-l3.mjs'
      - '.github/workflows/aar1811-completed-l3-production.yml'

permissions:
  contents: read

concurrency:
  group: aar1811-completed-l3-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LESSONS_KV_NAMESPACE_ID: 49619b1a24b244bc8aaa6223fcd24e80
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      DB_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      APPLY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regenerate live catalogue
        run: |
          set -euo pipefail
          node scripts/rebuild-checkpoint2-prepare-catalogue.mjs rebuild/student/src/prepared-catalogue.generated.js /tmp/aar1811-apply-catalogue.json
          test "$(jq -r '.viewLessonCounts["maths-level1"]' /tmp/aar1811-apply-catalogue.json)" = "35"
          test "$(jq -r '.viewLessonCounts["maths-level2"]' /tmp/aar1811-apply-catalogue.json)" = "38"
          test "$(jq -r '.viewLessonCounts["maths-level3"]' /tmp/aar1811-apply-catalogue.json)" = "45"
          test "$(jq -r '.viewLessonCounts["maths-sats"]' /tmp/aar1811-apply-catalogue.json)" = "19"
      - name: Dry-run exact production correction
        run: node scripts/apply-aar1811-completed-l3.mjs

  apply:
    needs: preflight
    if: contains(github.event.head_commit.message, '[apply-aar1811-completed-l3]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LESSONS_KV_NAMESPACE_ID: 49619b1a24b244bc8aaa6223fcd24e80
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      DB_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
      APPLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recompile live catalogue immediately before write
        run: node scripts/rebuild-checkpoint2-prepare-catalogue.mjs rebuild/student/src/prepared-catalogue.generated.js /tmp/aar1811-final-catalogue.json
      - name: Apply Aarav-only forward correction and atomically publish read model
        run: node scripts/apply-aar1811-completed-l3.mjs
