name: Phase 18 read-only live route diagnostic

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-readonly-live-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  EXPECTED_MAIN: 3c63a49ef0d679318e8c6901b12e82c007b56271
  ZONE_ID: 53c8b65553136ea796e926a32960ae07

jobs:
  inspect:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard frozen main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
      - name: Query Cloudflare DNS record and Worker routes independently
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          DNS_URL="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=lessons.futureperfect.education&per_page=100"
          ROUTES_URL="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes"

          dns_code="$(curl -sS -o /tmp/p18-dns.json -w '%{http_code}' "$DNS_URL" -H "$AUTH" || true)"
          echo "PHASE18_CF_DNS_HTTP=${dns_code}"
          if [ "$dns_code" = 200 ] && jq -e '.success==true' /tmp/p18-dns.json >/dev/null 2>&1; then
            jq -r '.result[]|"PHASE18_CF_DNS id=\(.id) type=\(.type) name=\(.name) content=\(.content) proxied=\(.proxied) ttl=\(.ttl)"' /tmp/p18-dns.json
          else
            jq -c '{success,errors}' /tmp/p18-dns.json 2>/dev/null | sed 's/^/PHASE18_CF_DNS_ERROR=/' || true
          fi

          routes_code="$(curl -sS -o /tmp/p18-routes.json -w '%{http_code}' "$ROUTES_URL" -H "$AUTH" || true)"
          echo "PHASE18_CF_ROUTES_HTTP=${routes_code}"
          if [ "$routes_code" = 200 ] && jq -e '.success==true' /tmp/p18-routes.json >/dev/null 2>&1; then
            count="$(jq '[.result[]|select((.pattern//"")|contains("lessons.futureperfect.education"))]|length' /tmp/p18-routes.json)"
            echo "PHASE18_CF_RELEVANT_ROUTE_COUNT=${count}"
            jq -r '.result[]|select((.pattern//"")|contains("lessons.futureperfect.education"))|"PHASE18_CF_ROUTE id=\(.id) pattern=\(.pattern) script=\(.script//"")"' /tmp/p18-routes.json
          else
            jq -c '{success,errors}' /tmp/p18-routes.json 2>/dev/null | sed 's/^/PHASE18_CF_ROUTES_ERROR=/' || true
          fi
      - name: Query public DNS and compare live HTML with old portal repository
        shell: bash
        run: |
          set -euo pipefail
          DOH='https://cloudflare-dns.com/dns-query?name=lessons.futureperfect.education&type=CNAME'
          code="$(curl -sS -o /tmp/p18-doh.json -w '%{http_code}' "$DOH" -H 'accept: application/dns-json' || true)"
          echo "PHASE18_PUBLIC_DOH_HTTP=${code}"
          if [ "$code" = 200 ]; then
            jq -r '(.Answer // [])[] | "PHASE18_PUBLIC_DNS name=\(.name) type=\(.type) ttl=\(.TTL) data=\(.data)"' /tmp/p18-doh.json
          fi

          live_code="$(curl -sS -L -o /tmp/p18-live.html -w '%{http_code}' https://lessons.futureperfect.education/ || true)"
          raw_code="$(curl -sS -L -o /tmp/p18-oldrepo.html -w '%{http_code}' https://raw.githubusercontent.com/FuturePerfectTuitions/futureperfect-lessons/main/public/index.html || true)"
          echo "PHASE18_LIVE_HTTP=${live_code}"
          echo "PHASE18_OLD_REPO_RAW_HTTP=${raw_code}"
          if [ "$live_code" = 200 ] && [ "$raw_code" = 200 ]; then
            live_sha="$(sha256sum /tmp/p18-live.html | awk '{print $1}')"
            raw_sha="$(sha256sum /tmp/p18-oldrepo.html | awk '{print $1}')"
            echo "PHASE18_LIVE_HTML_SHA256=${live_sha}"
            echo "PHASE18_OLD_REPO_HTML_SHA256=${raw_sha}"
            if cmp -s /tmp/p18-live.html /tmp/p18-oldrepo.html; then
              echo 'PHASE18_LIVE_EQUALS_OLD_REPO_INDEX=true'
            else
              echo 'PHASE18_LIVE_EQUALS_OLD_REPO_INDEX=false'
            fi
          fi
      - name: Completion
        run: echo 'PHASE18_LIVE_ROUTE_DIAGNOSTIC_COMPLETE cloudflare_writes=0 public_mutations=0 dns_changes=0 route_changes=0'
