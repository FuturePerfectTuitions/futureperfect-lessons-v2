name: R2 Drive Y6 full read-only preflight
on:
  push:
    branches: [ops/r2-drive-sync-y6]
    paths:
      - .github/r2-drive-y6-preflight-trigger.txt
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
jobs:
  preflight-year6:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Full strict read-only Year 6 Drive/R2 byte-hash preflight
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/r2_drive_y6_full_preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y6-r2-full-read-only-preflight
          path: y6-r2-full-read-only-preflight.json
          retention-days: 30
