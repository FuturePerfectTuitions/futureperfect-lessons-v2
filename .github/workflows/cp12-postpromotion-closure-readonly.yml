name: CP12 post-promotion closure read-only

on:
  push:
    branches: [fix/cp12-approved-v2-ui-staging-2026-09-14]
    paths: ['.github/workflows/cp12-postpromotion-closure-readonly.yml']

permissions:
  contents: read

concurrency:
  group: cp12-postpromotion-closure-readonly
  cancel-in-progress: false

env:
  PROD_BASE: https://lessons.futureperfect.education
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_DB: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev
  EXPECTED_STUDENT_VERSION: 32467053-f348-449c-a2ae-1dae9688b446
  EXPECTED_BROWSER_VERSION: 67880177-1328-46dd-a228-47ba245e33ae
  EXPECTED_LEGACY_VERSION: b1c8326e-a9cc-4150-b43b-cc572a4404c1
  RETAIN_STUDENT_ROLLBACK_1: bed8e660-facb-47f3-afad-7a9996d95c5a
  RETAIN_STUDENT_ROLLBACK_2: 0751feed-5aa3-40fb-854f-5847c8603872
  RETAIN_BROWSER_ROLLBACK: 412d5dd1-8f36-4e84-b5b6-eba39c670820
  OFFICIAL_CP12_SHA: b5e38b3768d269f632bbf4fc95e7d3f2a3fb3ba2
  REAL_PERSONA_PREREQ_BLOB: 2c1ace8dadd683511e6876e6aaed44b1e7ed5fb1

jobs:
  closure-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
      LESSONS_KV_ID: 49619b1a24b244bc8aaa6223fcd24e80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source and canonical-runtime gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin rebuild/checkpoint12-stabilisation-2026-09-14
          test "$(git rev-parse origin/rebuild/checkpoint12-stabilisation-2026-09-14)" = "$OFFICIAL_CP12_SHA"
          git merge-base --is-ancestor "$OFFICIAL_CP12_SHA" HEAD
          test "$(git hash-object scripts/cp12-production-real-persona-prereq.mjs)" = "$REAL_PERSONA_PREREQ_BLOB"
          node --check scripts/cp12-production-real-persona-prereq.mjs
          node tests/rebuild-cp12-resource-presentation-groups.mjs
          node tests/rebuild-checkpoint8-phase11-resource-parity.mjs
          node tests/rebuild-checkpoint11-scope-compatibility.mjs
          node tests/rebuild-checkpoint11-vr-howto-runtime.mjs
          node tests/rebuild-checkpoint6-new-student-worker.mjs
          grep -F 'loadPreparedViewLessons' rebuild/student/src/lib/runtime.mjs >/dev/null
          grep -F 'loadPreparedLessonDetail' rebuild/student/src/lib/runtime.mjs >/dev/null
          ! grep -F 'assets.list(' rebuild/student/src/lib/runtime.mjs
          echo CP12_POSTPROMOTION_CANONICAL_RUNTIME_SOURCE_PASS

      - name: Exact current-source 372-lesson oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim();
          const account=clean(process.env.CLOUDFLARE_ACCOUNT_ID), token=clean(process.env.CLOUDFLARE_API_TOKEN), lessons=clean(process.env.EXPECTED_LESSONS_KV), read=clean(process.env.EXPECTED_READ_MODELS_KV);
          if(!account||!token||!lessons||!read)throw new Error('Protected read bindings missing.');
          const api=`https://api.cloudflare.com/client/v4/accounts/${account}`,headers={Authorization:`Bearer ${token}`};
          async function kvText(ns,key){const r=await fetch(`${api}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers});if(r.status===404)return null;if(!r.ok)throw new Error(`KV read ${r.status}:${key}`);return r.text();}
          async function kvJson(ns,key){const t=await kvText(ns,key);return t==null?null:JSON.parse(t);}
          async function list(ns,prefix){let cursor='',out=[];do{const q=new URLSearchParams({prefix,limit:'1000'});if(cursor)q.set('cursor',cursor);const r=await fetch(`${api}/storage/kv/namespaces/${ns}/keys?${q}`,{headers});const b=await r.json();if(!r.ok||b?.success!==true)throw new Error(`KV list failed:${prefix}`);out.push(...(b.result||[]).map(x=>clean(x.name)).filter(Boolean));cursor=clean(b?.result_info?.cursor);}while(cursor);return out;}
          const allowed=new Set(['core-prelesson','core-homework','core-other','core-cumulative','core-answers','elevenplus-prelesson','elevenplus-homework','elevenplus-cumulative','elevenplus-answers','vr-prelesson','vr-homework','vr-answers']);
          const keys=(await list(read,'rm:v1:scope:lesson_3A')).filter(k=>k.endsWith(':current')).sort();
          if(keys.length!==372)throw new Error(`Expected 372 prepared lesson scopes; observed ${keys.length}.`);
          let resources=0,core=0,eleven=0,vr=0;
          for(const key of keys){
            const pointer=await kvJson(read,key),scope=clean(pointer?.scope),version=clean(pointer?.current?.version);
            if(!scope.startsWith('lesson:')||!version)throw new Error(`Malformed lesson pointer:${key}`);
            const lessonId=scope.slice(7),record=await kvJson(lessons,`lesson:${lessonId}`);
            if(!record?.lessonId)throw new Error(`Missing source lesson:${lessonId}`);
            const candidate=await compileLessonDetail(record,{resourceExists:async()=>true});
            const envelope=await kvJson(read,versionKey(scope,version));
            if(!envelope?.payload)throw new Error(`Missing prepared payload:${scope}`);
            if(stableStringify(envelope.payload)!==stableStringify(candidate))throw new Error(`Current compiler mismatch:${scope}`);
            for(const row of candidate.resources||[]){resources++;const g=clean(row.presentationGroup);if(!allowed.has(g))throw new Error(`Unexpected presentation group:${scope}:${g}`);if(g.startsWith('vr-'))vr++;else if(g.startsWith('elevenplus-'))eleven++;else if(g.startsWith('core-'))core++;}
          }
          if(!resources||!core||!eleven||!vr)throw new Error(`Resource coverage incomplete core=${core} eleven=${eleven} vr=${vr}`);
          const report={marker:'CP12_POSTPROMOTION_CURRENT_SOURCE_372_ORACLE_PASS',status:'PASS',readOnly:true,productionMutation:false,lessonScopes:keys.length,totalResources:resources,coreResources:core,elevenPlusResources:eleven,vrResources:vr,mismatches:0};
          fs.writeFileSync('/tmp/cp12-postpromotion-current-oracle.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          NODE

      - name: Real personas and live topology/version/binding invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cp12-production-real-persona-prereq.mjs
          jq -e '.marker=="CP12_PRODUCTION_REAL_PERSONA_PREREQ_READONLY_PASS" and .status=="PASS" and .productionMutation==false and .ordinary.lessonOpen==true and .ordinary.year5ElevenPlusAbsent==true and .vr.lessonOpen==true and .vr.vrHowToVisible==true and .vr.accessProven==true and .vr.preparedCoreAccess==true and .vr.preparedVrAccess==true and .vr.canonicalVrRows==true and .vr.canonicalVrResourceCount>=4 and .distinctPrincipals==true and .secretMaterialLogged==false' /tmp/cp12-production-real-persona-prereq.json >/dev/null
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}" "${AUTH[@]}" -o /tmp/zones.json
          ZONE_ID="$(jq -r '.result[]|select(.name=="futureperfect.education")|.id' /tmp/zones.json | head -n1)"; test -n "$ZONE_ID"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" "${AUTH[@]}" -o /tmp/routes.json
          jq -e --arg host "${PROD_HOST}/*" --arg browser "$BROWSER_WORKER" '.success==true and ([.result[]|select(.pattern==$host and .script==$browser)]|length)==1 and ([.result[]|select(.pattern==$host and .script!=$browser)]|length)==0' /tmp/routes.json >/dev/null
          for worker in "$LEGACY_WORKER" "$BROWSER_WORKER" "$STUDENT_WORKER"; do
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/settings" "${AUTH[@]}" -o "/tmp/${worker}-settings.json"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/${worker}-deployments.json"
          done
          jq -e --arg student "$STUDENT_WORKER" '([.result.bindings[]|select(.type=="service")]|length)==1 and any(.result.bindings[];.name=="STAGING_API" and .type=="service" and .service==$student) and ([.result.bindings[]|select(.type=="service" and .name!="STAGING_API")]|length)==0' "/tmp/${BROWSER_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_READ_MODELS_KV" 'any(.result.bindings[];.name=="READ_MODELS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_STUDENTS_KV" 'any(.result.bindings[];.name=="STUDENTS_KV" and (.namespace_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg id "$EXPECTED_DB" 'any(.result.bindings[];.name=="DB" and (.database_id//.id)==$id)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          jq -e --arg bucket "$EXPECTED_R2" 'any(.result.bindings[];.name=="MATERIALS_R2" and (.bucket_name//.bucket)==$bucket)' "/tmp/${STUDENT_WORKER}-settings.json" >/dev/null
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${STUDENT_WORKER}-deployments.json"|head -n1)" = "$EXPECTED_STUDENT_VERSION"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${BROWSER_WORKER}-deployments.json"|head -n1)" = "$EXPECTED_BROWSER_VERSION"
          test "$(jq -r '.result.deployments[0].versions[]|select((.percentage//0)==100)|.version_id' "/tmp/${LEGACY_WORKER}-deployments.json"|head -n1)" = "$EXPECTED_LEGACY_VERSION"
          curl --fail --silent --show-error "${API}/workers/scripts/${STUDENT_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/student-versions.json
          curl --fail --silent --show-error "${API}/workers/scripts/${BROWSER_WORKER}/versions?deployable=true" "${AUTH[@]}" -o /tmp/browser-versions.json
          jq -e --arg v "$RETAIN_STUDENT_ROLLBACK_1" 'any(.result.items[];.id==$v)' /tmp/student-versions.json >/dev/null
          jq -e --arg v "$RETAIN_STUDENT_ROLLBACK_2" 'any(.result.items[];.id==$v)' /tmp/student-versions.json >/dev/null
          jq -e --arg v "$RETAIN_BROWSER_ROLLBACK" 'any(.result.items[];.id==$v)' /tmp/browser-versions.json >/dev/null
          echo CP12_POSTPROMOTION_LIVE_TOPOLOGY_PASS

      - name: Answer Pack capability matrix authenticated routes and performance thresholds
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          const base=String(process.env.PROD_BASE).replace(/\/$/,'');
          const origin=new URL(base).origin;
          const personas=JSON.parse(fs.readFileSync('/tmp/cp12-production-real-persona-secrets.json','utf8'));
          const p95=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.max(0,Math.ceil(.95*s.length)-1)];};
          async function login(p){const t=performance.now();const r=await fetch(`${base}/api/v2/auth/login`,{method:'POST',redirect:'manual',headers:{origin,'content-type':'application/json'},body:JSON.stringify({username:p.username,password:p.password})});const elapsed=performance.now()-t;let b=null;try{b=await r.json();}catch{};if(r.status!==200||b?.ok!==true)throw new Error(`Login failed:${r.status}`);const cookie=(r.headers.get('set-cookie')||'').split(';')[0];if(!/^fpt_session=/.test(cookie))throw new Error('Session cookie missing.');return {cookie,elapsed};}
          async function get(path,cookie,redirect='manual'){const t=performance.now();const r=await fetch(`${base}${path}`,{headers:{cookie},redirect});const elapsed=performance.now()-t;return {r,elapsed};}
          async function json(path,cookie){const x=await get(path,cookie);let b=null;try{b=await x.r.json();}catch{};return {...x,b};}
          async function post(path,cookie,headers={}){const t=performance.now();const r=await fetch(`${base}${path}`,{method:'POST',redirect:'manual',headers:{...(cookie?{cookie}:{}),...headers}});const elapsed=performance.now()-t;let b=null;try{b=await r.json();}catch{};return {r,b,elapsed};}
          const ordinary=await login(personas.ordinary), vr=await login(personas.vr);
          const oh=await json('/api/v2/student/home',ordinary.cookie);if(oh.r.status!==200||oh.b?.ok!==true)throw new Error('Ordinary home failed.');
          const ov=await json(`/api/v2/student/views/${encodeURIComponent(personas.ordinary.viewId)}/lessons`,ordinary.cookie);if(ov.r.status!==200||ov.b?.ok!==true)throw new Error('Ordinary view failed.');
          const ol=await json(`/api/v2/student/lessons/${encodeURIComponent(personas.ordinary.lessonId)}`,ordinary.cookie);if(ol.r.status!==200||ol.b?.ok!==true)throw new Error('Ordinary lesson failed.');
          if((ol.b.resources||[]).some(r=>(r.presentationScopes||[]).includes('vr')))throw new Error('Ordinary control received VR resources.');
          const vv=await json(`/api/v2/student/views/${encodeURIComponent(personas.vr.viewId)}/lessons`,vr.cookie);if(vv.r.status!==200||vv.b?.ok!==true)throw new Error('VR view failed.');
          const vl=await json(`/api/v2/student/lessons/${encodeURIComponent(personas.vr.lessonId)}`,vr.cookie);if(vl.r.status!==200||vl.b?.ok!==true)throw new Error('VR lesson failed.');
          const protectedRows=(vl.b.resources||[]).filter(r=>r.type==='answer-pack'&&r.protected===true&&(r.presentationScopes||[]).includes('vr'));
          if(protectedRows.length<2)throw new Error(`Expected >=2 protected VR answers; observed ${protectedRows.length}`);
          const row=protectedRows[0],openPath=`/api/v2/student/lessons/${encodeURIComponent(personas.vr.lessonId)}/resources/${row.index}/open`;
          const noSession=await post(openPath,'',{'x-fpt-answer-password':personas.vr.answerPassword});if(noSession.r.status!==401)throw new Error(`No-session protected open expected 401; observed ${noSession.r.status}`);
          const wrong=await post(openPath,vr.cookie,{'x-fpt-answer-password':'Zz9!'});if(wrong.r.status!==403||wrong.b?.error!=='ANSWER_PASSWORD_INVALID')throw new Error(`Wrong-password protected open failed closed incorrectly:${wrong.r.status}`);
          const correct=await post(openPath,vr.cookie,{'x-fpt-answer-password':personas.vr.answerPassword});if(correct.r.status!==200||correct.b?.ok!==true||!correct.b?.capabilityUrl)throw new Error(`Correct protected open failed:${correct.r.status}`);
          const cap=new URL(correct.b.capabilityUrl);const capPath=cap.pathname+cap.search;
          const serve=await get(capPath,vr.cookie);if(serve.r.status!==302)throw new Error(`Protected serve expected 302 viewer handoff; observed ${serve.r.status}`);
          const requiredHeaders={
            'cache-control':/private.*no-store|no-store.*private/i,
            'x-content-type-options':/^nosniff$/i,
            'x-frame-options':/^DENY$/i,
            'referrer-policy':/^no-referrer$/i,
            'cross-origin-resource-policy':/^same-origin$/i,
            'cross-origin-opener-policy':/^same-origin$/i
          };
          for(const [h,re] of Object.entries(requiredHeaders)){const v=serve.r.headers.get(h)||'';if(!re.test(v))throw new Error(`Protected serve security header ${h} invalid:${v}`);}
          const viewerLocation=serve.r.headers.get('location');if(!viewerLocation)throw new Error('Protected-viewer handoff location missing.');
          const wrongUser=await get(capPath,ordinary.cookie);if(![401,403].includes(wrongUser.r.status))throw new Error(`Wrong-user capability reuse expected 401/403; observed ${wrongUser.r.status}`);if(wrongUser.r.headers.get('location'))throw new Error('Wrong-user capability unexpectedly redirected.');
          const viewer=await fetch(new URL(viewerLocation,base),{headers:{cookie:vr.cookie},redirect:'manual'});if(viewer.status>=400)throw new Error(`Protected viewer handoff failed:${viewer.status}`);

          const loginBootstrap=[];for(let i=0;i<10;i++){const t=performance.now();const l=await login(personas.ordinary);const h=await json('/api/v2/student/home',l.cookie);if(h.r.status!==200||h.b?.ok!==true)throw new Error('Login bootstrap sample failed.');loginBootstrap.push(performance.now()-t);}
          const warmView=[];for(let i=0;i<20;i++){const x=await json(`/api/v2/student/views/${encodeURIComponent(personas.ordinary.viewId)}/lessons`,ordinary.cookie);if(x.r.status!==200)throw new Error('Warm view sample failed.');warmView.push(x.elapsed);}
          const coldView=[];for(let i=0;i<10;i++){const l=await login(personas.ordinary);const x=await json(`/api/v2/student/views/${encodeURIComponent(personas.ordinary.viewId)}/lessons`,l.cookie);if(x.r.status!==200)throw new Error('Cold view sample failed.');coldView.push(x.elapsed);}
          const warmLesson=[];for(let i=0;i<20;i++){const x=await json(`/api/v2/student/lessons/${encodeURIComponent(personas.ordinary.lessonId)}`,ordinary.cookie);if(x.r.status!==200)throw new Error('Warm lesson sample failed.');warmLesson.push(x.elapsed);}
          const coldLesson=[];for(let i=0;i<10;i++){const l=await login(personas.ordinary);const x=await json(`/api/v2/student/lessons/${encodeURIComponent(personas.ordinary.lessonId)}`,l.cookie);if(x.r.status!==200)throw new Error('Cold lesson sample failed.');coldLesson.push(x.elapsed);}
          const protectedWarm=[];for(let i=0;i<10;i++){const t=performance.now();const o=await post(openPath,vr.cookie,{'x-fpt-answer-password':personas.vr.answerPassword});if(o.r.status!==200||!o.b?.capabilityUrl)throw new Error('Protected warm open sample failed.');const u=new URL(o.b.capabilityUrl),s=await get(u.pathname+u.search,vr.cookie);if(s.r.status!==302)throw new Error('Protected warm serve sample failed.');protectedWarm.push(performance.now()-t);}
          const metrics={
            loginBootstrapP95Ms:p95(loginBootstrap),warmViewP95Ms:p95(warmView),coldViewP95Ms:p95(coldView),warmLessonP95Ms:p95(warmLesson),coldLessonP95Ms:p95(coldLesson),protectedWarmOpenP95Ms:p95(protectedWarm)
          };
          const thresholds={loginBootstrapP95Ms:1500,warmViewP95Ms:300,coldViewP95Ms:800,warmLessonP95Ms:300,coldLessonP95Ms:800,protectedWarmOpenP95Ms:1500};
          for(const [k,max] of Object.entries(thresholds))if(!(metrics[k]<max))throw new Error(`Performance SLOW ${k}=${metrics[k].toFixed(1)}ms threshold<${max}ms`);
          const report={marker:'CP12_POSTPROMOTION_SECURITY_PERFORMANCE_PASS',status:'PASS',readOnly:true,productionMutation:false,routes:{ordinaryHome:true,ordinaryView:true,ordinaryLesson:true,vrView:true,vrLesson:true},answerPack:{protectedVrAnswers:protectedRows.length,noSessionStatus:noSession.r.status,wrongPasswordStatus:wrong.r.status,correctOpenStatus:correct.r.status,serveStatus:serve.r.status,wrongUserReuseStatus:wrongUser.r.status,viewerStatus:viewer.status,securityHeaders:true,capabilityBoundToSession:true},performance:{classification:'FAST',sampleCounts:{loginBootstrap:loginBootstrap.length,warmView:warmView.length,coldView:coldView.length,warmLesson:warmLesson.length,coldLesson:coldLesson.length,protectedWarmOpen:protectedWarm.length},metrics,thresholds}};
          fs.writeFileSync('/tmp/cp12-postpromotion-security-performance.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          NODE
          rm -f /tmp/cp12-production-real-persona-secrets.json

      - name: Canonical Admin production smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/cp12-production-admin-view-prereq.mjs
          jq -e '.marker=="CP12_PRODUCTION_ADMIN_VIEW_PREREQ_READONLY_PASS" and .status=="PASS" and .productionMutation==false and .admin.requiredViews==true and .credentialDisclosed==false' /tmp/cp12-production-admin-view-prereq.json >/dev/null
          export SMOKE_BASE_URL="$PROD_BASE" SMOKE_PHASE='cp12-postpromotion-closure' EXPECT_ADMIN_STATUS='200' SMOKE_OUTPUT='/tmp/cp12-postpromotion-admin-smoke.json'
          node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
          echo CP12_POSTPROMOTION_ADMIN_RUNTIME_PASS

      - name: Assemble closure-observer evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --arg marker CP12_POSTPROMOTION_CLOSURE_READONLY_PASS --arg student "$EXPECTED_STUDENT_VERSION" --arg browser "$EXPECTED_BROWSER_VERSION" --arg legacy "$EXPECTED_LEGACY_VERSION" --slurpfile oracle /tmp/cp12-postpromotion-current-oracle.json --slurpfile personas /tmp/cp12-production-real-persona-prereq.json --slurpfile security /tmp/cp12-postpromotion-security-performance.json --slurpfile admin /tmp/cp12-production-admin-view-prereq.json '{marker:$marker,status:"PASS",readOnly:true,productionMutation:false,canonicalTopology:true,browserToAdminOps:false,versions:{student:$student,browser:$browser,legacy:$legacy},oracle:$oracle[0],realPersonas:$personas[0],securityPerformance:$security[0],admin:$admin[0]}' | tee /tmp/cp12-postpromotion-closure-readonly.json

      - name: Upload closure observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp12-postpromotion-closure-readonly
          path: |
            /tmp/cp12-postpromotion-closure-readonly.json
            /tmp/cp12-postpromotion-current-oracle.json
            /tmp/cp12-production-real-persona-prereq.json
            /tmp/cp12-postpromotion-security-performance.json
            /tmp/cp12-production-admin-view-prereq.json
            /tmp/cp12-postpromotion-admin-smoke.json
          if-no-files-found: error
          retention-days: 30
