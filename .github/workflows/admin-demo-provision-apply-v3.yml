name: Admin demo secure provisioning apply v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-demo-provision-apply-v3.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard secure inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s .secure-admin-provisioning/private.enc.json
          test -s .secure-admin-provisioning/payload.enc.json
      - name: Apply guarded runtime fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/admin-demo-secure-apply.mjs')
          text = path.read_text()
          old = "const existing = await kvBulkGet(studentsId, keys);\nif (Object.keys(existing).length) throw new Error('One or more requested account keys already exist; refusing to overwrite');"
          new = "const existing = await kvBulkGet(studentsId, keys);\nconst existingValues = existing;\nconst existingKeySet = new Set(Object.keys(existingValues));\nconst newlyCreatedKeys = keys.filter(key => !existingKeySet.has(key));"
          if old not in text:
              raise SystemExit('Target existing-account guard not found')
          text = text.replace(old, new, 1)
          old_rb = "if (kvWritten) {\n    try { for (const key of keys) await kvDelete(studentsId, key); } catch { console.error('WARNING: Student KV rollback failed'); }\n  }"
          new_rb = "if (kvWritten) {\n    try {\n      const restorePairs = Object.entries(existingValues).map(([key, value]) => ({ key, value: String(value) }));\n      if (restorePairs.length) await kvBulkPut(studentsId, restorePairs);\n      for (const key of newlyCreatedKeys) await kvDelete(studentsId, key);\n    } catch { console.error('WARNING: Student KV rollback failed'); }\n  }"
          if old_rb not in text:
              raise SystemExit('Target rollback block not found')
          text = text.replace(old_rb, new_rb, 1)
          old_cfg = "const prodConfig = '/tmp/fpt-admin-demo-production.toml';\nconst rollbackConfig = '/tmp/fpt-admin-demo-rollback.toml';"
          new_cfg = "const prodConfig = 'worker/wrangler.admin-demo-production.toml';\nconst rollbackConfig = 'worker/wrangler.admin-demo-rollback.toml';"
          if old_cfg not in text:
              raise SystemExit('Runtime config path block not found')
          path.write_text(text.replace(old_cfg, new_cfg, 1))
      - name: Apply and verify production accounts
        run: node scripts/admin-demo-secure-apply.mjs
