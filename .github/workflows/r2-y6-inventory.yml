name: R2 Y6 read-only namespace inventory
on:
  push:
    branches: [ops/r2-drive-sync-y6]
    paths:
      - .github/r2-y6-inventory-trigger.txt
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - run: python3 scripts/r2_y6_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: y6-r2-namespace-inventory
          path: y6-r2-namespace-inventory.json
          retention-days: 30
