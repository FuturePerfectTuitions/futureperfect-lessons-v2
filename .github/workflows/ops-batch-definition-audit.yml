name: Reconcile Year 6 online English batch definition

on:
  push:
    branches: [ops/zara-entitlement-20260908]
    paths:
      - '.github/workflows/ops-batch-definition-audit.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Resolve production D1
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          DBID="$(jq -r '.result.bindings[] | select(.name=="DB" and (.type=="d1" or .type=="d1_database")) | (.id // .database_id // empty)' /tmp/settings.json | head -n1)"
          test -n "$DBID" && test "$DBID" != null
          echo "dbid=$DBID" >> "$GITHUB_OUTPUT"
          echo 'PRODUCTION_GUARD=true'

      - name: Insert exact missing Year 6 online English definition
        env:
          DB_ID: ${{ steps.guard.outputs.dbid }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; db=os.environ['DB_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          def q(sql,params=[]):
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query',data=json.dumps({'sql':sql,'params':params}).encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r: body=json.load(r)
              if not body.get('success'): raise SystemExit(2)
              return ((body.get('result') or [{}])[0].get('results') or [])
          existing=q("SELECT batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to FROM batch_definitions WHERE batch_key='Y6OE'")
          if existing:
              r=existing[0]
              ok=(r.get('academic_year')=='2026-27' and r.get('subject')=='english' and int(r.get('school_year') or 0)==6 and r.get('stream')=='normal' and r.get('maths_level') is None)
              if not ok:
                  print('EXISTING_DEFINITION_CONFLICT=true'); raise SystemExit(3)
              print('DEFINITION_ALREADY_CORRECT=true')
          else:
              now='2026-09-08T18:21:00Z'
              q("INSERT INTO batch_definitions (batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to,created_at,updated_at) VALUES ('Y6OE','2026-27','english',6,'normal',NULL,'2026-09-07',NULL,?,?)",[now,now])
              print('DEFINITION_CREATED=true')
          verify=q("SELECT COUNT(*) c FROM batch_definitions WHERE batch_key='Y6OE' AND academic_year='2026-27' AND subject='english' AND school_year=6 AND stream='normal' AND maths_level IS NULL")
          if int((verify[0] if verify else {}).get('c') or 0)!=1: raise SystemExit(4)
          linked=q("SELECT COUNT(*) c FROM lesson_entitlements e JOIN batch_definitions b ON b.batch_key=e.source_batch_code WHERE e.source_batch_code='Y6OE' AND b.subject='english' AND b.school_year=6 AND b.stream='normal'")
          print('DEFINITION_VERIFY=true')
          print('Y6OE_LINKED_RELEASE_COUNT=' + str(int((linked[0] if linked else {}).get('c') or 0)))
          PY
