name: Apply forward-only deploy policy

on:
  push:
    branches: ['fix/forward-only-production-deploy-2026-09-28']
    paths: ['.github/workflows/apply-forward-only-deploy-policy.yml']

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forward-only-production-deploy-2026-09-28
      - name: Remove legacy automatic rollback path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/admin-superuser-production-deploy.yml')
          text = path.read_text()

          def remove_step(source, start_name, next_name):
              start = source.index(f'      - name: {start_name}\n')
              end = source.index(f'      - name: {next_name}\n', start)
              return source[:start] + source[end:]

          text = remove_step(
              text,
              'Capture production rollback anchor',
              'Deploy Worker preserving bindings and secrets'
          )
          text = remove_step(
              text,
              'Roll back production Worker if any verification failed',
              'Complete'
          )
          text = text.replace(
              '# Production Worker gate for authenticated Admin operations, quiz-bridge compatibility and protected-view stability.',
              '# Forward-only production Worker gate for authenticated Admin operations, quiz-bridge compatibility and protected-view stability. Failed verification requires a later forward fix; this workflow never rolls production back.'
          )

          assert 'Capture production rollback anchor' not in text
          assert 'Roll back production Worker' not in text
          assert 'ROLLING_BACK_SHARED_WORKER_TO' not in text
          assert 'versions deploy "$OLD@100%"' not in text
          assert 'Failed verification requires a later forward fix' in text
          path.write_text(text)
          PY
      - name: Verify forward-only policy
        run: |
          set -euo pipefail
          ! grep -Fq 'Capture production rollback anchor' .github/workflows/admin-superuser-production-deploy.yml
          ! grep -Fq 'Roll back production Worker' .github/workflows/admin-superuser-production-deploy.yml
          ! grep -Fq 'ROLLING_BACK_SHARED_WORKER_TO' .github/workflows/admin-superuser-production-deploy.yml
          ! grep -Fq 'versions deploy "$OLD@100%"' .github/workflows/admin-superuser-production-deploy.yml
          grep -Fq 'Failed verification requires a later forward fix' .github/workflows/admin-superuser-production-deploy.yml
      - name: Commit policy hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/admin-superuser-production-deploy.yml
          git diff --cached --check
          git commit -m 'Make production deploy strictly forward-only'
          git push origin HEAD:fix/forward-only-production-deploy-2026-09-28
