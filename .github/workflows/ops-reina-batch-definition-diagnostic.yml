name: Guarded 11+ batch definition diagnostic

on:
  push:
    branches: [ops/reina-entitlement]
    paths:
      - '.github/workflows/ops-reina-batch-definition-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LEGACY_WORKER: fpt-portal-v2-worker
    steps:
      - name: Read relevant production batch definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; worker=os.environ['LEGACY_WORKER']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def call(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={'Authorization':f'Bearer {token}'}
              if body is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as r: out=json.load(r)
              if not out.get('success'): raise SystemExit('CLOUDFLARE_REQUEST_FAILED')
              return out
          settings=call(f'/workers/scripts/{worker}/settings')['result']
          if not any(b.get('name')=='ENVIRONMENT' and b.get('text')=='production' for b in settings.get('bindings',[])): raise SystemExit('NOT_PRODUCTION')
          db=next(((b.get('id') or b.get('database_id')) for b in settings.get('bindings',[]) if b.get('name')=='DB'),None)
          if not db: raise SystemExit('DB_MISSING')
          sql="SELECT batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to FROM batch_definitions WHERE batch_key LIKE 'Y411%' OR batch_key LIKE 'Y511%' ORDER BY batch_key"
          out=call(f'/d1/database/{db}/query','POST',{'sql':sql})
          rows=((out.get('result') or [{}])[0].get('results') or [])
          print('BATCH_DEFINITIONS='+json.dumps(rows,separators=(',',':'),sort_keys=True))
          print('READ_ONLY_BATCH_DEFINITION_DIAGNOSTIC_PASS=true')
          PY
