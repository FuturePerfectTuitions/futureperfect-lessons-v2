name: Admin demo secure provisioning bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-demo-provision-bootstrap.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  bootstrap:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Generate one-time public-key channel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .secure-admin-provisioning
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const secret = String(process.env.CLOUDFLARE_API_TOKEN || '');
          if (!secret) throw new Error('Missing Cloudflare token');
          const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
            modulusLength: 4096,
            publicKeyEncoding: { type: 'spki', format: 'pem' },
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
          });
          const wrappingKey = crypto.createHash('sha256')
            .update('fpt-admin-demo-provision-wrap-v1\0')
            .update(secret)
            .digest();
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', wrappingKey, iv);
          const ciphertext = Buffer.concat([cipher.update(Buffer.from(privateKey, 'utf8')), cipher.final()]);
          const tag = cipher.getAuthTag();
          fs.writeFileSync('.secure-admin-provisioning/public.pem', publicKey, 'utf8');
          fs.writeFileSync('.secure-admin-provisioning/private.enc.json', JSON.stringify({
            schema: 'fpt-admin-demo-private-wrap-v1',
            iv: iv.toString('base64'),
            tag: tag.toString('base64'),
            ciphertext: ciphertext.toString('base64')
          }) + '\n', 'utf8');
          NODE
      - name: Commit non-plaintext key material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name FuturePerfectTuitions
          git config user.email futureperfectlessons@gmail.com
          git add .secure-admin-provisioning/public.pem .secure-admin-provisioning/private.enc.json
          git commit -m 'Create admin demo provisioning key material'
          git push origin HEAD:main
