name: Final minimal - build current navigation manifest

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-navigation-manifest-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build deterministic navigation manifest from development KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          s=requests.get(f'{api}/accounts/{acct}/workers/scripts/fpt-portal-v2-worker/settings',headers=auth,timeout=60).json(); assert s.get('success')
          b=s['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); bucket=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert bucket=='fpt-materials-dev'; assert ns
          base=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def get(k):
            r=requests.get(base+urllib.parse.quote(k,safe=''),headers=auth,timeout=60); r.raise_for_status(); return r.json()
          expected={
            'MATHS_Y2':36,'MATHS_Y3':34,'MATHS_L1':35,'MATHS_L2':38,'MATHS_L3':43,'MATHS_Y6_EXTRA':24,
            'ENGLISH_Y2':29,'ENGLISH_Y3':32,'ENGLISH_Y4':34,'ENGLISH_Y5':36,'ENGLISH_Y6':31
          }
          curricula={}; raw_lessons={}; ids=[]
          for code in expected:
            rec=get('curriculum:'+code); assert rec.get('curriculumCode')==code; lesson_ids=rec.get('lessonIds') or []
            assert len(lesson_ids)==expected[code],(code,len(lesson_ids),expected[code]); assert len(set(lesson_ids))==len(lesson_ids)
            curricula[code]={'curriculumCode':code,'lessonIds':lesson_ids,'schemaVersion':rec.get('schemaVersion',1)}; ids.extend(lesson_ids)
          assert len(ids)==372; assert len(set(ids))==372, f'Navigation lesson IDs overlap: total={len(ids)} unique={len(set(ids))}'
          lessons={}
          for lid in sorted(ids):
            rec=get('lesson:'+lid); assert rec.get('lessonId')==lid; assert rec.get('active') is not False
            raw_lessons[lid]=rec
            safe={'lessonId':lid,'title':str(rec.get('title') or ''),'active':True,'order':rec.get('order')}
            assert safe['title'].strip(); assert isinstance(safe['order'],int) and safe['order']>=1
            if rec.get('displayIds') is not None: safe['displayIds']=rec.get('displayIds')
            if rec.get('displayLessonIds') is not None: safe['displayLessonIds']=rec.get('displayLessonIds')
            if isinstance(rec.get('presentation'),dict) and rec['presentation'].get('displayIds') is not None: safe['presentation']={'displayIds':rec['presentation']['displayIds']}
            lessons[lid]=safe
          # Hash the exact current source records used to build navigation, not the old packaged Phase 11 payload.
          source={'curricula':{k:get('curriculum:'+k) for k in sorted(expected)},'lessons':raw_lessons}
          source_json=json.dumps(source,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          catalogue_hash=hashlib.sha256(source_json.encode()).hexdigest()
          manifest={'catalogueSha256':catalogue_hash,'curricula':{k:curricula[k] for k in sorted(curricula)},'lessons':lessons}
          manifest_json=json.dumps(manifest,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          nav_hash=hashlib.sha256(manifest_json.encode()).hexdigest()
          js='\n'.join([
            '// Generated from the reconciled development LESSONS_KV catalogue.',
            f'// Source catalogue SHA-256: {catalogue_hash}',
            f'// Navigation manifest SHA-256: {nav_hash}',
            '// Navigation-only metadata; full lesson/resource records remain in LESSONS_KV.',
            '',f'const PHASE11_NAVIGATION_MANIFEST = {manifest_json};','', 'export { PHASE11_NAVIGATION_MANIFEST };',''
          ])
          open('phase11-navigation-manifest.generated.js','w').write(js)
          report={'environment':env,'bucket':bucket,'curricula':len(curricula),'lessons':len(lessons),'catalogueSha256':catalogue_hash,'navigationSha256':nav_hash,'counts':expected}
          json.dump(report,open('final-navigation-manifest-report.json','w'),indent=2,sort_keys=True)
          print('FINAL_NAVIGATION_MANIFEST_PASS',json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-navigation-manifest
          path: |
            phase11-navigation-manifest.generated.js
            final-navigation-manifest-report.json
          retention-days: 30
