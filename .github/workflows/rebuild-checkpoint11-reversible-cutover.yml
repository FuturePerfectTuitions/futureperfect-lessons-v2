name: Rebuild Checkpoint 11 - Read-only Closure Gate

on:
  push:
    branches:
      - rebuild/checkpoint11-reversible-cutover-2026-09-13
      - rebuild/portal-v2-performance-2026-09-13
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: portal-v2-rebuild-checkpoint11-closure
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_WORKER: fpt-portal-v2-worker
  PROD_HOST: lessons.futureperfect.education
  EXPECTED_PROD_DEPLOYMENT: ce193be0-d018-403f-a417-999e9e6eea41
  EXPECTED_PROD_VERSION: aed13a31-21fa-49c3-8830-c37fd8645c31
  EXPECTED_FRONTEND_MAIN_SHA: 96bfdc4dc3e72b0f354a205bc5a79f6d51c290f7
  EXPECTED_STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_LESSONS_KV_ID: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_PROD_D1_ID: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_PROD_R2: fpt-materials-dev
  PROD_SHADOW_KV_ID: 77b35165c8694087bc1b0515c35a7e89
  PROD_SHADOW_D1_ID: 3a17180e-b554-4740-a629-bcaca6a2eeb5
  NEW_STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  NEW_BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  CHECKPOINT8_AS_OF_DATE: '2026-09-14'
  CHECKPOINT11_AS_OF_DATE: '2026-09-14'
  EXECUTION_RUN_ID: '34823892175'
  EXECUTION_SHA: dd5c222dfc1f82993de0379b77f42f8bbab8e71f

jobs:
  cp11-readonly-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert closure workflow is read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/rebuild-checkpoint11-reversible-cutover.yml
          ! grep -F 'scripts/rebuild-checkpoint11-backfill.mjs' "$WORKFLOW"
          ! grep -F 'scripts/rebuild-checkpoint11-special-backfill.mjs' "$WORKFLOW"
          ! grep -F 'rebuild-checkpoint11-cutover.mjs rehearse' "$WORKFLOW"
          ! grep -F 'rebuild-checkpoint11-cutover.mjs public' "$WORKFLOW"
          ! grep -F 'rebuild-checkpoint11-cutover.mjs rollback' "$WORKFLOW"
          ! grep -F 'wrangler deploy' "$WORKFLOW"
          ! grep -F 'wrangler secret put' "$WORKFLOW"
          echo REBUILD_CHECKPOINT11_READONLY_WORKFLOW_PASS

      - name: Recover exact successful CP11 execution evidence
        uses: actions/download-artifact@v4
        with:
          name: checkpoint11-reversible-cutover-execution-evidence
          path: /tmp/cp11-execution-evidence
          github-token: ${{ github.token }}
          repository: FuturePerfectTuitions/futureperfect-lessons-v2
          run-id: ${{ env.EXECUTION_RUN_ID }}

      - name: Verify exact execution evidence before closure
        shell: bash
        run: |
          set -Eeuo pipefail
          GATE=/tmp/cp11-execution-evidence/checkpoint11-execution-gate.json
          test -s "$GATE"
          jq -e --arg sha "$EXECUTION_SHA" --arg run "$EXECUTION_RUN_ID" '
            .marker=="REBUILD_CHECKPOINT11_EXECUTION_PASS" and
            .exactSha==$sha and .runId==$run and
            .rehearsal.passed==true and
            .cutover.marker=="REBUILD_CHECKPOINT11_PUBLIC_CUTOVER_PASS" and
            .productionSmoke.marker=="REBUILD_CHECKPOINT11_SMOKE_PASS" and
            .productionSmoke.auth.sessionCookie.maxAgeSeconds==28800 and
            .productionSmoke.resources.answerPackLivePassword==true and
            .productionSmoke.resources.answerPackCapabilityMaxSeconds==300 and
            .productionVrSmoke.marker=="REBUILD_CHECKPOINT11_VR_HOWTO_LIVE_SMOKE_PASS" and
            .productionVrSmoke.candidateCount==3 and .productionVrSmoke.guideCount==11 and
            .productionVrSmoke.providerContactedOnlyAfterView==true and
            .special.status=="PASS" and .special.manualTokenCounts.VR_HOWTO==3 and
            (.special.directTokenCounts.VR_HOWTO // 0)==0 and
            .parity.status=="PASS" and .parity.catalogue.lessonCount==372 and
            .parity.catalogue.resourceMismatchCount==0 and
            .parity.students.unexplainedDifferenceCount==0 and
            .publicVerify.marker=="REBUILD_CHECKPOINT11_PUBLIC_VERIFY_PASS"
          ' "$GATE" >/dev/null

      - name: Re-run read-only live parity and VR How-To special-area gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/rebuild-checkpoint8-profile-mode-inventory.mjs | tee /tmp/checkpoint11-closure-profile-mode.json
          node scripts/rebuild-checkpoint8-special-area-audit.mjs | tee /tmp/checkpoint11-closure-special-area.json
          node scripts/rebuild-checkpoint8-live-audit.mjs
          cp /tmp/checkpoint8-live-summary.json /tmp/checkpoint11-closure-live-parity.json
          jq -e '.status=="PASS" and .catalogue.lessonCount==372 and .catalogue.resourceMismatchCount==0 and .students.unexplainedDifferenceCount==0' /tmp/checkpoint11-closure-live-parity.json >/dev/null
          jq -e '.status=="PASS" and .profilesWithSpecialAreas==3 and .tokenCounts.VR_HOWTO==3 and .manualTokenCounts.VR_HOWTO==3 and (.directTokenCounts.VR_HOWTO // 0)==0 and .cp11RuntimeGate.enabled==true and .cp11RuntimeGate.compatible==true and (.cp11RuntimeGate.unsupportedCurrentTokens|length)==0 and .cp11RuntimeGate.catalogueRevision.checked==true and .cp11RuntimeGate.catalogueRevision.inSync==true' /tmp/checkpoint11-closure-special-area.json >/dev/null

      - name: Verify authoritative public topology and rollback anchors read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/cp11-closure-topology.mjs <<'NODE'
          import fs from 'node:fs';
          import https from 'node:https';
          import { Resolver, resolve4 } from 'node:dns/promises';
          const clean=v=>String(v??'').trim();
          const token=clean(process.env.CLOUDFLARE_API_TOKEN),account=clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const host=clean(process.env.PROD_HOST).toLowerCase(),browser=clean(process.env.NEW_BROWSER_WORKER),legacyWorker=clean(process.env.PROD_WORKER);
          const expectedDeployment=clean(process.env.EXPECTED_PROD_DEPLOYMENT),expectedVersion=clean(process.env.EXPECTED_PROD_VERSION),expectedFrontend=clean(process.env.EXPECTED_FRONTEND_MAIN_SHA);
          if(!token||!account||!host||!browser||!legacyWorker)throw new Error('Closure topology check requires frozen Cloudflare inputs.');
          const base='https://api.cloudflare.com/client/v4';
          async function cf(path){const r=await fetch(`${base}${path}`,{headers:{Authorization:`Bearer ${token}`}});const text=await r.text();let body=null;try{body=JSON.parse(text);}catch{}if(!r.ok||body?.success!==true)throw new Error(`Cloudflare read failed ${r.status}: ${path}`);return body;}
          function deploymentAnchor(body){const rows=body?.result?.deployments||body?.result||[];const first=Array.isArray(rows)?rows[0]:null;const versions=Array.isArray(first?.versions)?first.versions:[];return{deploymentId:clean(first?.id),versionId:clean((versions.find(v=>Number(v?.percentage||0)===100)||versions[0])?.version_id)};}
          const zones=(await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`)).result||[];
          const zone=zones.filter(z=>host===z.name||host.endsWith(`.${z.name}`)).sort((a,b)=>b.name.length-a.name.length)[0];
          if(!zone)throw new Error('No Cloudflare zone for production host.');
          const records=(await cf(`/zones/${zone.id}/dns_records?name=${encodeURIComponent(host)}&per_page=100`)).result||[];
          if(records.length!==1||records[0].type!=='CNAME'||records[0].proxied!==true)throw new Error('Production DNS is not the expected single proxied CNAME.');
          const routeRows=(await cf(`/zones/${zone.id}/workers/routes`)).result||[];
          const matching=routeRows.filter(r=>clean(r.pattern).toLowerCase().includes(host));
          const route=matching.find(r=>clean(r.pattern).toLowerCase()===`${host}/*`&&clean(r.script)===browser);
          if(!route||matching.some(r=>clean(r.script)!==browser))throw new Error('Production Worker route is missing or has a foreign owner.');
          await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(browser)}/settings`);
          const legacy=deploymentAnchor(await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(legacyWorker)}/deployments`));
          if(legacy.deploymentId!==expectedDeployment||legacy.versionId!==expectedVersion)throw new Error('Legacy rollback Worker anchor moved.');
          const mainResponse=await fetch('https://api.github.com/repos/FuturePerfectTuitions/futureperfect-lessons-test/branches/main',{headers:{'user-agent':'fpt-cp11-closure'}});
          if(!mainResponse.ok)throw new Error(`Rollback frontend branch query failed ${mainResponse.status}.`);
          const frontendMain=clean((await mainResponse.json())?.commit?.sha);
          if(frontendMain!==expectedFrontend)throw new Error('Rollback frontend main moved.');
          const details=(await cf(`/zones/${zone.id}`)).result||{};
          const nameservers=Array.isArray(details.name_servers)?details.name_servers.map(clean).filter(Boolean):[];
          if(!nameservers.length)throw new Error('Cloudflare authoritative nameservers unavailable.');
          let resolved=null,lastError='';
          for(let attempt=0;attempt<45&&!resolved;attempt++){
            for(const ns of nameservers){let nsIps=[];try{nsIps=await resolve4(ns);}catch(e){lastError=clean(e?.message);continue;}
              for(const nsIp of nsIps){try{const resolver=new Resolver();resolver.setServers([nsIp]);const edgeIps=await resolver.resolve4(host);if(edgeIps.length){resolved={nameserver:ns,nameserverIp:nsIp,edgeIps:[...new Set(edgeIps)]};break;}}catch(e){lastError=clean(e?.message);}}
              if(resolved)break;
            }
            if(!resolved)await new Promise(r=>setTimeout(r,1000));
          }
          if(!resolved)throw new Error(`Authoritative DNS did not publish candidate edge addresses: ${lastError}`);
          function direct(url,edgeIp){const target=new URL(url);return new Promise((resolve,reject)=>{const req=https.request({protocol:'https:',hostname:edgeIp,port:443,servername:target.hostname,path:`${target.pathname}${target.search}`,method:'GET',headers:{Host:target.host,'Cache-Control':'no-store','User-Agent':'fpt-cp11-closure-edge'},rejectUnauthorized:true,timeout:10000},res=>{const chunks=[];res.on('data',c=>chunks.push(c));res.on('end',()=>resolve({status:res.statusCode||0,text:Buffer.concat(chunks).toString('utf8'),headers:res.headers}));});req.on('timeout',()=>req.destroy(new Error('Direct edge request timed out.')));req.on('error',reject);req.end();});}
          let verified=null,edgeError='';
          for(const edgeIp of resolved.edgeIps){try{const api=await direct(`https://${host}/api/v2/student/home`,edgeIp);const root=await direct(`https://${host}/`,edgeIp);const facade=clean(api.headers['x-fpt-cp9-browser-facade']).toLowerCase()==='service-binding';const brand=root.status>=200&&root.status<300&&/Future Perfect Tuitions/i.test(root.text);if(api.status===401&&facade&&brand){verified={edgeIp,apiStatus:api.status,rootStatus:root.status,facade:true};break;}}catch(e){edgeError=clean(e?.message);}}
          if(!verified)throw new Error(`No authoritative edge served the closed CP11 topology: ${edgeError}`);
          const out={marker:'REBUILD_CHECKPOINT11_CLOSURE_TOPOLOGY_PASS',checkpoint:11,readOnly:true,host,zone:{id:zone.id,name:zone.name},dns:{id:records[0].id,type:records[0].type,content:records[0].content,proxied:true},route:{id:route.id,pattern:route.pattern,script:route.script},candidateBrowserWorkerPresent:true,legacyRollbackAnchor:legacy,rollbackFrontendMainSha:frontendMain,authoritative:{nameserver:resolved.nameserver,nameserverIp:resolved.nameserverIp,edgeIp:verified.edgeIp,rootStatus:verified.rootStatus,apiStatus:verified.apiStatus,facade:verified.facade}};
          fs.writeFileSync('/tmp/checkpoint11-closure-topology.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));
          NODE
          node /tmp/cp11-closure-topology.mjs
          jq -e '.marker=="REBUILD_CHECKPOINT11_CLOSURE_TOPOLOGY_PASS" and .readOnly==true and .dns.proxied==true and .route.script=="fpt-portal-v2-rebuild-browser-prod" and .authoritative.rootStatus==200 and .authoritative.apiStatus==401 and .authoritative.facade==true' /tmp/checkpoint11-closure-topology.json >/dev/null

      - name: Assemble read-only CP11 closure gate
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg marker 'REBUILD_CHECKPOINT11_CLOSURE_PASS' \
            --arg closureSha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg executionSha "$EXECUTION_SHA" \
            --arg executionRunId "$EXECUTION_RUN_ID" \
            --slurpfile execution /tmp/cp11-execution-evidence/checkpoint11-execution-gate.json \
            --slurpfile topology /tmp/checkpoint11-closure-topology.json \
            --slurpfile parity /tmp/checkpoint11-closure-live-parity.json \
            --slurpfile special /tmp/checkpoint11-closure-special-area.json \
            '{marker:$marker,checkpoint:11,readOnly:true,closureSha:$closureSha,branch:$branch,runId:$runId,executionSha:$executionSha,executionRunId:$executionRunId,execution:$execution[0],topology:$topology[0],parity:$parity[0],special:$special[0]}' \
            > /tmp/checkpoint11-closure-gate.json
          jq -e --arg executionSha "$EXECUTION_SHA" --arg executionRunId "$EXECUTION_RUN_ID" '
            .marker=="REBUILD_CHECKPOINT11_CLOSURE_PASS" and .readOnly==true and
            .execution.marker=="REBUILD_CHECKPOINT11_EXECUTION_PASS" and
            .execution.exactSha==$executionSha and .execution.runId==$executionRunId and
            .topology.marker=="REBUILD_CHECKPOINT11_CLOSURE_TOPOLOGY_PASS" and .topology.readOnly==true and
            .topology.dns.proxied==true and .topology.route.script=="fpt-portal-v2-rebuild-browser-prod" and
            .parity.status=="PASS" and .parity.catalogue.lessonCount==372 and .parity.catalogue.resourceMismatchCount==0 and .parity.students.unexplainedDifferenceCount==0 and
            .special.status=="PASS" and .special.manualTokenCounts.VR_HOWTO==3 and (.special.directTokenCounts.VR_HOWTO // 0)==0 and .special.cp11RuntimeGate.catalogueRevision.inSync==true
          ' /tmp/checkpoint11-closure-gate.json >/dev/null
          cat /tmp/checkpoint11-closure-gate.json

      - name: Upload CP11 read-only closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint11-readonly-closure-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            /tmp/checkpoint11-closure-gate.json
            /tmp/checkpoint11-closure-topology.json
            /tmp/checkpoint11-closure-live-parity.json
            /tmp/checkpoint11-closure-special-area.json
            /tmp/checkpoint11-closure-profile-mode.json
