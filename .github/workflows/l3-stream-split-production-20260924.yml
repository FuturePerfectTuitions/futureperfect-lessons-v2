name: L3 stream-specific lessons production migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/l3-stream-split-production-20260924.yml'

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0
  NEW25_ID: MATHS_L3_11P_T2M25_2026
  NEW43_ID: MATHS_L3_11P_T3M43_2026
  PAYLOAD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-a434-8210-8b98-10b41394cab8/raw?se=2026-09-24T21%3A22%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=490eecdc-85c7-5ddf-94eb-bb50783d70a7&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T20%3A42%3A36Z&ske=2026-09-25T20%3A42%3A36Z&sks=b&skv=2026-02-06&sig=3pvqU5%2B6rgWiP9jE2ktDmJjd8s5%2BmVG5f7WQokcFdII%3D'
  PAYLOAD_SHA256: 78f0d970875dcea1f3c7480442ddbfd3b1f3d0869105ab480f42650c344a7773

jobs:
  migrate:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_MESSAGE: Portal V2 L3 stream-specific T2M25/T3M43 catalogue split
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static guard for view-specific catalogue filtering
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/src/live-student-catalogue-overlay.js
          grep -Fq "if (!hasView(record, viewId)) continue;" worker/src/live-student-catalogue-overlay.js
          echo 'STATIC_STREAM_SPLIT_PASS'

      - name: Reconstruct and verify exact owner-supplied PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/l3split
          curl --fail --location --silent --show-error "$PAYLOAD_URL" --output /tmp/l3split/package.bin
          test "$(sha256sum /tmp/l3split/package.bin | awk '{print $1}')" = "$PAYLOAD_SHA256"
          dd if=/tmp/l3split/package.bin of=/tmp/l3split/payload.key.rsa bs=384 count=1 status=none
          tail -c +385 /tmp/l3split/package.bin > /tmp/l3split/payload.enc

          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in .github/secure-transfer/l3t1m02/private.pem.enc \
            -out /tmp/l3split/private.pem \
            -pass env:CLOUDFLARE_API_TOKEN

          if ! openssl pkeyutl -decrypt \
            -inkey /tmp/l3split/private.pem \
            -in /tmp/l3split/payload.key.rsa \
            -out /tmp/l3split/payload.key.txt 2>/dev/null; then
            if ! openssl pkeyutl -decrypt \
              -inkey /tmp/l3split/private.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -in /tmp/l3split/payload.key.rsa \
              -out /tmp/l3split/payload.key.txt 2>/dev/null; then
              openssl pkeyutl -decrypt \
                -inkey /tmp/l3split/private.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -in /tmp/l3split/payload.key.rsa \
                -out /tmp/l3split/payload.key.txt
            fi
          fi

          openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/l3split/payload.enc \
            -out /tmp/l3split/payload.tar \
            -pass file:/tmp/l3split/payload.key.txt
          tar -xf /tmp/l3split/payload.tar -C /tmp/l3split

          verify_pdf(){
            local file="$1" size="$2" sha="$3"
            test "$(head -c 4 "/tmp/l3split/$file")" = '%PDF'
            test "$(stat -c%s "/tmp/l3split/$file")" = "$size"
            test "$(sha256sum "/tmp/l3split/$file" | awk '{print $1}')" = "$sha"
          }
          verify_pdf m25-pre.pdf 204933 cc72aaa3ce3f0a60f3a20e5916cc1737c4c6dda0531632685fa3c3247f820b01
          verify_pdf m25-hw.pdf 569663 09ab56d0b4cd48098431a27b934f8a44fb51003bbf01e0372d32afc7a4bec207
          verify_pdf m25-ans.pdf 576746 c96d537995b6bd463d9189ad556c1bc3e2a5da40460a78f8aae5911ebdb29217
          verify_pdf m43-hw.pdf 1210947 5858f50e529e53656772d64dae5069fa55c2f7d3e0d5ca8bef86a346734a3c4a
          verify_pdf m43-ans.pdf 947461 41a0abc24544b82f337b4433063f4966f8a3ffba0227ac6da301e657c6d02958
          echo 'SECURE_SOURCE_PDFS_PASS'

      - name: Guard production bindings and snapshot exact live targets
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          settings="$(curl -fsS "${auth[@]}" "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          jq -e '.success==true' <<<"$settings" >/dev/null
          jq -e '.result.bindings[]? | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' <<<"$settings" >/dev/null
          ns="$(jq -r '.result.bindings[]? | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' <<<"$settings")"
          bucket="$(jq -r '.result.bindings[]? | select(.name=="MATERIALS_R2" and .type=="r2_bucket") | .bucket_name' <<<"$settings")"
          dbid="$(jq -r '.result.bindings[]? | select(.name=="DB" and .type=="d1") | .id' <<<"$settings")"
          test -n "$ns"; test "$ns" != null; test -n "$bucket"; test "$bucket" != null; test -n "$dbid"; test "$dbid" != null
          echo "ns=$ns" >> "$GITHUB_OUTPUT"; echo "bucket=$bucket" >> "$GITHUB_OUTPUT"; echo "dbid=$dbid" >> "$GITHUB_OUTPUT"
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W kv key get 'curriculum:MATHS_L3' --namespace-id "$ns" --remote > /tmp/l3split/curriculum-before.json
          jq -e '.lessonIds|type=="array" and length>0' /tmp/l3split/curriculum-before.json >/dev/null
          : > /tmp/l3split/targets.tsv
          while IFS= read -r id; do
            $W kv key get "lesson:${id}" --namespace-id "$ns" --remote > "/tmp/l3split/lesson-${id}.json"
            code="$(jq -r '.displayIds["maths-level3"] // empty' "/tmp/l3split/lesson-${id}.json")"
            if [ "$code" = 'L3T2M25' ] || [ "$code" = 'L3T3M43' ]; then printf '%s\t%s\n' "$code" "$id" >> /tmp/l3split/targets.tsv; fi
          done < <(jq -r '.lessonIds[]' /tmp/l3split/curriculum-before.json)
          test "$(awk '$1=="L3T2M25"{c++} END{print c+0}' /tmp/l3split/targets.tsv)" = 1
          test "$(awk '$1=="L3T3M43"{c++} END{print c+0}' /tmp/l3split/targets.tsv)" = 1
          old25="$(awk '$1=="L3T2M25"{print $2}' /tmp/l3split/targets.tsv)"
          old43="$(awk '$1=="L3T3M43"{print $2}' /tmp/l3split/targets.tsv)"
          cp "/tmp/l3split/lesson-${old25}.json" /tmp/l3split/old25-before.json
          cp "/tmp/l3split/lesson-${old43}.json" /tmp/l3split/old43-before.json
          jq -e '.active!=false and (.displayIds["maths-year6"]|type=="string" and length>0)' /tmp/l3split/old25-before.json >/dev/null
          jq -e '.active!=false and (.displayIds["maths-year6"]|type=="string" and length>0)' /tmp/l3split/old43-before.json >/dev/null
          if $W kv key get "lesson:${NEW25_ID}" --namespace-id "$ns" --remote >/tmp/l3split/new25-existing.json 2>/dev/null; then test ! -s /tmp/l3split/new25-existing.json; fi
          if $W kv key get "lesson:${NEW43_ID}" --namespace-id "$ns" --remote >/tmp/l3split/new43-existing.json 2>/dev/null; then test ! -s /tmp/l3split/new43-existing.json; fi
          echo "old25=$old25" >> "$GITHUB_OUTPUT"; echo "old43=$old43" >> "$GITHUB_OUTPUT"

          query_count(){
            local sql="$1"
            curl -fsS "${auth[@]}" -X POST --data "$(jq -nc --arg s "$sql" '{sql:$s}')" \
              "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${dbid}/query" \
              | jq -r '.result[0].results[0].n // 0'
          }
          full11="$(query_count "SELECT COUNT(*) AS n FROM lesson_entitlements WHERE lesson_id IN ('${old25}','${old43}') AND source_batch_code LIKE '%11%'")"
          pre11="$(query_count "SELECT COUNT(*) AS n FROM online_prelesson_entitlements WHERE lesson_id IN ('${old25}','${old43}') AND batch_key LIKE '%11%'")"
          test "$full11" = 0; test "$pre11" = 0
          echo "LIVE_TARGET_GUARD_PASS old25=${old25} old43=${old43}"

      - name: Deploy alias-aware current production Worker preserving bindings
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh
          echo 'WORKER_DEPLOY_PASS'

      - name: Upload source PDFs to R2 and verify exact hashes
        shell: bash
        env:
          BUCKET: ${{ steps.guard.outputs.bucket }}
        run: |
          set -euo pipefail
          npm install -g wrangler@${WRANGLER_VERSION} >/dev/null
          put_verify(){
            local file="$1" key="$2"
            wrangler r2 object put "${BUCKET}/${key}" --file="$file" --content-type='application/pdf' --remote >/dev/null
            wrangler r2 object get "${BUCKET}/${key}" --file="${file}.readback" --remote >/dev/null
            test "$(sha256sum "$file"|awk '{print $1}')" = "$(sha256sum "${file}.readback"|awk '{print $1}')"
          }
          put_verify /tmp/l3split/m25-pre.pdf 'maths/level3-11plus/MATHS_L3_11P_T2M25_2026/prelesson/L3T2M25 PreLesson Sheets Mean Median Mode.pdf'
          put_verify /tmp/l3split/m25-hw.pdf 'maths/level3-11plus/MATHS_L3_11P_T2M25_2026/homework/L3T2M25 Homework Mean Median Mode.pdf'
          put_verify /tmp/l3split/m25-ans.pdf 'maths/level3-11plus/MATHS_L3_11P_T2M25_2026/answers/L3T2M25 Answer Pack Homework Mean Median Mode.pdf'
          put_verify /tmp/l3split/m43-hw.pdf 'maths/level3-11plus/MATHS_L3_11P_T3M43_2026/homework/L3T3M43 Homework Advanced Statistics.pdf'
          put_verify /tmp/l3split/m43-ans.pdf 'maths/level3-11plus/MATHS_L3_11P_T3M43_2026/answers/L3T3M43 Answer Pack Homework Advanced Statistics.pdf'
          echo 'R2_UPLOAD_HASH_PASS'

      - name: Apply stream-specific lesson records and curriculum membership
        id: apply
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
          OLD25: ${{ steps.guard.outputs.old25 }}
          OLD43: ${{ steps.guard.outputs.old43 }}
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          jq 'del(.displayIds["maths-level3"])' /tmp/l3split/old25-before.json > /tmp/l3split/old25-after.json
          jq 'del(.displayIds["maths-level3"])' /tmp/l3split/old43-before.json > /tmp/l3split/old43-after.json
          cat > /tmp/l3split/new25.json <<'JSON'
          {"lessonId":"MATHS_L3_11P_T2M25_2026","subject":"maths","title":"Mean Median Mode","description":"Mean Median Mode","active":true,"displayIds":{"maths-level3":"L3T2M25"},"phase11Resources":{"core":{"preLessonPairs":[],"cumulativeHomeworks":[],"supplementaryAnswers":[]},"elevenPlus":{"preLessonPairs":[{"sheet":{"displayName":"L3T2M25 PreLesson Sheets Mean Median Mode.pdf","r2Key":"maths/level3-11plus/MATHS_L3_11P_T2M25_2026/prelesson/L3T2M25 PreLesson Sheets Mean Median Mode.pdf"}}],"homeworks":[{"homework":{"displayName":"L3T2M25 Homework Mean Median Mode.pdf","r2Key":"maths/level3-11plus/MATHS_L3_11P_T2M25_2026/homework/L3T2M25 Homework Mean Median Mode.pdf"},"answerPack":{"displayName":"L3T2M25 Answer Pack Homework Mean Median Mode.pdf","r2Key":"maths/level3-11plus/MATHS_L3_11P_T2M25_2026/answers/L3T2M25 Answer Pack Homework Mean Median Mode.pdf"}}],"cumulativeHomeworks":[],"supplementaryAnswers":[]},"vr":{"supplementaryAnswers":[]}}}
          JSON
          cat > /tmp/l3split/new43.json <<'JSON'
          {"lessonId":"MATHS_L3_11P_T3M43_2026","subject":"maths","title":"Advanced Statistics","description":"Advanced Statistics","active":true,"displayIds":{"maths-level3":"L3T3M43"},"phase11Resources":{"core":{"preLessonPairs":[],"cumulativeHomeworks":[],"supplementaryAnswers":[]},"elevenPlus":{"preLessonPairs":[],"homeworks":[{"homework":{"displayName":"L3T3M43 Homework Advanced Statistics.pdf","r2Key":"maths/level3-11plus/MATHS_L3_11P_T3M43_2026/homework/L3T3M43 Homework Advanced Statistics.pdf"},"answerPack":{"displayName":"L3T3M43 Answer Pack Homework Advanced Statistics.pdf","r2Key":"maths/level3-11plus/MATHS_L3_11P_T3M43_2026/answers/L3T3M43 Answer Pack Homework Advanced Statistics.pdf"}}],"cumulativeHomeworks":[],"supplementaryAnswers":[]},"vr":{"supplementaryAnswers":[]}}}
          JSON
          jq --arg old25 "$OLD25" --arg old43 "$OLD43" --arg new25 "$NEW25_ID" --arg new43 "$NEW43_ID" '
            .lessonIds |= reduce .[] as $id ([]; . + [$id] + (if $id==$old25 then [$new25] elif $id==$old43 then [$new43] else [] end))
          ' /tmp/l3split/curriculum-before.json > /tmp/l3split/curriculum-after.json
          $W kv key put "lesson:${OLD25}" --namespace-id "$NS" --remote --path /tmp/l3split/old25-after.json >/dev/null
          touch /tmp/l3split/mutation-started
          $W kv key put "lesson:${OLD43}" --namespace-id "$NS" --remote --path /tmp/l3split/old43-after.json >/dev/null
          $W kv key put "lesson:${NEW25_ID}" --namespace-id "$NS" --remote --path /tmp/l3split/new25.json >/dev/null
          $W kv key put "lesson:${NEW43_ID}" --namespace-id "$NS" --remote --path /tmp/l3split/new43.json >/dev/null
          $W kv key put 'curriculum:MATHS_L3' --namespace-id "$NS" --remote --path /tmp/l3split/curriculum-after.json >/dev/null
          echo 'applied=true' >> "$GITHUB_OUTPUT"
          echo 'KV_APPLY_PASS'

      - name: Exact production read-back verification
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
          OLD25: ${{ steps.guard.outputs.old25 }}
          OLD43: ${{ steps.guard.outputs.old43 }}
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W kv key get "lesson:${OLD25}" --namespace-id "$NS" --remote > /tmp/l3split/v-old25.json
          $W kv key get "lesson:${OLD43}" --namespace-id "$NS" --remote > /tmp/l3split/v-old43.json
          $W kv key get "lesson:${NEW25_ID}" --namespace-id "$NS" --remote > /tmp/l3split/v-new25.json
          $W kv key get "lesson:${NEW43_ID}" --namespace-id "$NS" --remote > /tmp/l3split/v-new43.json
          $W kv key get 'curriculum:MATHS_L3' --namespace-id "$NS" --remote > /tmp/l3split/v-curriculum.json
          jq -e '.displayIds["maths-level3"]==null and (.displayIds["maths-year6"]|length>0)' /tmp/l3split/v-old25.json >/dev/null
          jq -e '.displayIds["maths-level3"]==null and (.displayIds["maths-year6"]|length>0)' /tmp/l3split/v-old43.json >/dev/null
          jq -e '.lessonId=="MATHS_L3_11P_T2M25_2026" and .displayIds["maths-level3"]=="L3T2M25" and .title=="Mean Median Mode" and ((.phase11Resources.elevenPlus.preLessonPairs//[])|length)==1 and ((.phase11Resources.elevenPlus.homeworks//[])|length)==1' /tmp/l3split/v-new25.json >/dev/null
          jq -e '.lessonId=="MATHS_L3_11P_T3M43_2026" and .displayIds["maths-level3"]=="L3T3M43" and .title=="Advanced Statistics" and ((.phase11Resources.elevenPlus.preLessonPairs//[])|length)==0 and ((.phase11Resources.elevenPlus.homeworks//[])|length)==1' /tmp/l3split/v-new43.json >/dev/null
          test "$(jq --arg id "$NEW25_ID" '[.lessonIds[]|select(.==$id)]|length' /tmp/l3split/v-curriculum.json)" = 1
          test "$(jq --arg id "$NEW43_ID" '[.lessonIds[]|select(.==$id)]|length' /tmp/l3split/v-curriculum.json)" = 1
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          test "$(curl -sS -o /tmp/l3split/security.json -w '%{http_code}' -H 'Origin: https://lessons.futureperfect.education' "$BASE/api/v1/student/home")" = 401
          rm -f /tmp/l3split/mutation-started
          echo 'FINAL_PRODUCTION_PASS'

      - name: Roll back KV on failed migration
        if: failure()
        shell: bash
        env:
          NS: ${{ steps.guard.outputs.ns }}
          OLD25: ${{ steps.guard.outputs.old25 }}
          OLD43: ${{ steps.guard.outputs.old43 }}
        run: |
          set -euo pipefail
          if [ -f /tmp/l3split/mutation-started ] && [ -n "${NS:-}" ]; then
            W="npx --yes wrangler@${WRANGLER_VERSION}"
            $W kv key put "lesson:${OLD25}" --namespace-id "$NS" --remote --path /tmp/l3split/old25-before.json >/dev/null || true
            $W kv key put "lesson:${OLD43}" --namespace-id "$NS" --remote --path /tmp/l3split/old43-before.json >/dev/null || true
            $W kv key put 'curriculum:MATHS_L3' --namespace-id "$NS" --remote --path /tmp/l3split/curriculum-before.json >/dev/null || true
            $W kv key delete "lesson:${NEW25_ID}" --namespace-id "$NS" --remote --force >/dev/null 2>&1 || true
            $W kv key delete "lesson:${NEW43_ID}" --namespace-id "$NS" --remote --force >/dev/null 2>&1 || true
            echo 'KV_ROLLBACK_ATTEMPTED'
          fi
