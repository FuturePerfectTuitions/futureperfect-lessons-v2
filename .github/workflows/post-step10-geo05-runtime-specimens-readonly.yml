name: Post-Step-10 GEO-05 runtime specimens read-only

on:
  push:
    branches:
      - mastery/post-step10-expansion-planning-2026-09-18
    paths:
      - '.github/workflows/post-step10-geo05-runtime-specimens-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Export GEO-05 numeric diagram/validation specimens only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/w.toml <<TOML
          name = "post-step10-geo05-runtime-specimens-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML
          npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/w.toml --command "SELECT question_id,json_extract(diagram_spec_json,'$.angles') AS angles,json_extract(validation_spec_json,'$.a') AS a,json_extract(validation_spec_json,'$.b') AS b,correct_display FROM question_instance WHERE family_id='GEO-05' AND lifecycle_status='Live' ORDER BY question_id;" --json >/tmp/raw.json
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          rows=json.loads(Path('/tmp/raw.json').read_text())[0]['results']
          with open('/tmp/geo05_runtime_specimens.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['question_id','angles','a','b','correct_display'])
              w.writeheader();w.writerows(rows)
          print(json.dumps({'marker':'POST_STEP10_GEO05_RUNTIME_SPECIMENS_READONLY_PASS','rows':len(rows),'question_text_exported':False,'source_stems_exported':False},indent=2))
          PY
          rm -f /tmp/raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-geo05-runtime-specimens-readonly
          path: /tmp/geo05_runtime_specimens.csv
          retention-days: 30
