name: CP12 approved V2 UI browser UAT retry

on:
  push:
    branches:
      - fix/cp12-approved-v2-ui-staging-2026-09-14
    paths:
      - .github/workflows/cp12-approved-v2-ui-browser-uat-retry.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  STAGING_STUDENTS_KV_TITLE: FPT_PORTAL_V2_REBUILD_STUDENTS_STAGING
  CP12_BROWSER_BASE_URL: https://fpt-portal-v2-rebuild-browser-staging-cp9.futureperfectlessons.workers.dev
  CANDIDATE_FRONTEND_SHA: 598ec347ffddb126889f95d6a7753539e0ed3c97
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  browser-uat-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze production deployment anchors read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          for worker in fpt-portal-v2-worker fpt-portal-v2-rebuild-student-prod fpt-portal-v2-rebuild-browser-prod; do
            safe="$(echo "$worker" | tr -c 'A-Za-z0-9' '_')"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/prod-${safe}-before.json"
          done

      - name: Recover masked synthetic staging credentials read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "${API}/storage/kv/namespaces?per_page=100" "${AUTH[@]}" -o /tmp/kv.json
          NS="$(jq -r --arg title "$STAGING_STUDENTS_KV_TITLE" '.result[] | select(.title==$title) | .id' /tmp/kv.json | head -n1)"
          test -n "$NS"
          curl --fail --silent --show-error "${API}/storage/kv/namespaces/${NS}/values/user%3Acp12vrui" "${AUTH[@]}" -o /tmp/user.json
          P="$(jq -r '.p // empty' /tmp/user.json)"
          A="$(jq -r '.answerPassword // empty' /tmp/user.json)"
          [[ "$P" =~ [A-Z] ]] && [[ "$P" =~ [a-z] ]] && [[ "$P" =~ [0-9] ]] && [ "${#P}" -eq 4 ]
          [[ "$A" =~ [A-Z] ]] && [[ "$A" =~ [a-z] ]] && [[ "$A" =~ [0-9] ]] && [ "${#A}" -eq 4 ]
          echo "::add-mask::$P"; echo "::add-mask::$A"
          echo "UAT_LOGIN_PASSWORD=$P" >> "$GITHUB_ENV"
          echo "UAT_ANSWER_PASSWORD=$A" >> "$GITHUB_ENV"
          rm -f /tmp/user.json

      - name: Checkout and build exact candidate only to derive asset identity
        uses: actions/checkout@v4
        with:
          repository: FuturePerfectTuitions/futureperfect-lessons-test
          ref: ${{ env.CANDIDATE_FRONTEND_SHA }}
          path: candidate-frontend
          persist-credentials: false

      - name: Prove staged Browser is serving exact candidate asset identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate-frontend rev-parse HEAD)" = "$CANDIDATE_FRONTEND_SHA"
          cd candidate-frontend
          npm install --no-audit --no-fund
          npm run test:static
          node tests/cp12-collapsible-resource-sections-static.mjs
          node tests/cp12-approved-v2-ui-parity-static.mjs
          npm run build
          EXPECTED_JS="$(basename "$(find dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*protected-viewer*' | head -n1)")"
          test -n "$EXPECTED_JS"
          cd "$GITHUB_WORKSPACE"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "${CP12_BROWSER_BASE_URL}/?cp12-exact-retry=$(date +%s)" -o /tmp/staged-index.html
          grep -F "/assets/${EXPECTED_JS}" /tmp/staged-index.html >/dev/null
          echo "EXPECTED_JS=$EXPECTED_JS" >> "$GITHUB_ENV"
          echo CP12_STAGED_EXACT_FRONTEND_IDENTITY_PASS

      - name: Install browser runner and align harness with exact responsive contract
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/cp12-approved-v2-ui-browser-uat.mjs')
          s=p.read_text()
          old_fetch="""  const response=await page.request.get(bundleUrl,{headers:{'cache-control':'no-cache'}});\n  assert.equal(response.status(),200,'Candidate frontend bundle could not be fetched.');\n  const text=await response.text();\n  for(const marker of ['Verbal Reasoning','VR PreLesson','VR Homework','subject-maths','lesson-description-toggle']){\n    assert(text.includes(marker),`Loaded browser asset is missing approved candidate marker: ${marker}`);\n  }\n"""
          new_fetch="""  const loaded=await page.evaluate(url=>performance.getEntriesByType('resource').some(entry=>entry.name===url),bundleUrl);\n  assert.equal(loaded,true,'Candidate frontend bundle was not loaded by the browser page.');\n"""
          assert s.count(old_fetch)==1
          s=s.replace(old_fetch,new_fetch,1)
          old_border="  assert.equal(chrome.borderTopWidth,'6px','Approved desktop airmail border thickness changed.');"
          new_border="  const expectedBorder=(page.viewportSize()?.width||0)<=720?'5px':'6px';\n  assert.equal(chrome.borderTopWidth,expectedBorder,`Approved responsive airmail border thickness changed: ${chrome.borderTopWidth} at ${page.viewportSize()?.width}px.`);"
          assert s.count(old_border)==1
          s=s.replace(old_border,new_border,1)
          p.write_text(s)
          PY
          node --check scripts/cp12-approved-v2-ui-browser-uat.mjs

      - name: Run full real-browser approved Portal V2 presentation UAT
        run: node scripts/cp12-approved-v2-ui-browser-uat.mjs

      - name: Prove production deployments unchanged
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          for worker in fpt-portal-v2-worker fpt-portal-v2-rebuild-student-prod fpt-portal-v2-rebuild-browser-prod; do
            safe="$(echo "$worker" | tr -c 'A-Za-z0-9' '_')"
            curl --fail --silent --show-error "${API}/workers/scripts/${worker}/deployments" "${AUTH[@]}" -o "/tmp/prod-${safe}-after.json"
            jq -S '.result.deployments[0] // .result[0]' "/tmp/prod-${safe}-before.json" > "/tmp/${safe}-before-anchor.json"
            jq -S '.result.deployments[0] // .result[0]' "/tmp/prod-${safe}-after.json" > "/tmp/${safe}-after-anchor.json"
            cmp "/tmp/${safe}-before-anchor.json" "/tmp/${safe}-after-anchor.json"
          done
          echo CP12_APPROVED_V2_UI_RETRY_PRODUCTION_UNCHANGED_PASS

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-approved-v2-ui-browser-uat-retry
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/cp12-approved-v2-ui-browser-uat.json
            /tmp/cp12-approved-v2-ui-browser-evidence/*.png
