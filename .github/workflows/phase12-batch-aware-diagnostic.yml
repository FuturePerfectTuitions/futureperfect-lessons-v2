name: Phase 12 batch-aware deployment diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase12-batch-aware-diagnostic.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  TEST_ORIGIN: https://futureperfecttuitions.github.io

jobs:
  diagnose:
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase12-batch-aware-deploy' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Diagnose guarded Phase 12 deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          STAGE='initialise'
          STUDENTS=''
          LESSONS=''
          DB=''

          make_config() {
            local ENTRYPOINT="$1"
            local OUT="$2"
            cat >"$OUT" <<EOF
          name = "fpt-portal-v2-worker"
          main = "${ENTRYPOINT}"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "fpt-materials-dev"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          }

          cleanup_rows() {
            if [ -z "$DB" ]; then return; fi
            set +e
            $W d1 execute fpt_portal_v2_db --remote --command \
              "DELETE FROM student_batch_assignments WHERE batch_key IN ('__P12_DIAG_E5__','__P12_DIAG_M4__','__P12_DIAG_ML2__'); DELETE FROM batch_lesson_releases WHERE batch_key IN ('__P12_DIAG_E5__','__P12_DIAG_M4__','__P12_DIAG_ML2__'); DELETE FROM batch_definitions WHERE batch_key IN ('__P12_DIAG_E5__','__P12_DIAG_M4__','__P12_DIAG_ML2__');" \
              --yes >/tmp/diag-cleanup.log 2>&1
            set -e
          }

          rollback_worker() {
            if [ -z "$STUDENTS" ] || [ -z "$LESSONS" ] || [ -z "$DB" ]; then return; fi
            set +e
            make_config 'src/index-phase11-efficient.js' 'worker/wrangler.phase12.diag-rollback.toml'
            $W deploy --config worker/wrangler.phase12.diag-rollback.toml --keep-vars \
              --message 'Rollback Phase 12 diagnostic failure' >/tmp/diag-rollback.log 2>&1
            local RC=$?
            if [ "$RC" -ne 0 ]; then
              echo 'Rollback command failed:'
              tail -n 40 /tmp/diag-rollback.log || true
            else
              echo 'Rollback command completed.'
            fi
            set -e
          }

          show_safe_diagnostics() {
            echo "Phase 12 diagnostic failed at stage: ${STAGE}"
            for F in /tmp/diag-deploy.log /tmp/diag-seed.log /tmp/diag-login.json /tmp/diag-e.home.json /tmp/diag-m.home.json /tmp/diag-e11.detail.json /tmp/diag-e11.video.json /tmp/diag-vr-howto.json; do
              if [ -f "$F" ]; then
                echo "--- $(basename "$F") ---"
                if [[ "$F" == *.json ]]; then
                  jq 'if .subjects then {ok,student:{portalUserId:(.student.portalUserId // null)},subjects:[.subjects[]|{subject,views:[.views[]|{viewId,current,group,lockedPreview}]}]} elif .lesson then {ok,lesson:{lessonId:(.lesson.lessonId // null),presentation:(.lesson.presentation // null),video:(.lesson.video.resourceKey // null),quiz:(.lesson.quiz // null)}} elif .area then {ok,area:{bucketId:(.area.bucketId // null)}} else . end' "$F" 2>/dev/null || cat "$F"
                else
                  tail -n 60 "$F" || true
                fi
              fi
            done
          }

          failure() {
            local STATUS=$?
            trap - ERR
            show_safe_diagnostics
            cleanup_rows
            rollback_worker
            exit "$STATUS"
          }
          trap failure ERR

          STAGE='cloudflare-guard'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/diag-settings.json
          jq -e '.success == true' /tmp/diag-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/diag-settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket" and .bucket_name=="fpt-materials-dev")' /tmp/diag-settings.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/diag-settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing.' >&2; false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/diag-settings.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/diag-settings.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/diag-settings.json)"
          for V in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$V"; test "$V" != null; done

          STAGE='d1-preflight'
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/diag-d1-before.json 2>/tmp/diag-d1-before.err
          test "$(jq -r '.[0].results[0].batch_count' /tmp/diag-d1-before.json)" = '0'
          test "$(jq -r '.[1].results[0].assignment_count' /tmp/diag-d1-before.json)" = '0'
          test "$(jq -r '.[2].results[0].release_count' /tmp/diag-d1-before.json)" = '0'
          grep -Fq 'trg_student_sessions_single_active' /tmp/diag-d1-before.json
          grep -Fq '"ok"' /tmp/diag-d1-before.json

          STAGE='worker-deploy'
          make_config 'src/index-phase12.js' 'worker/wrangler.phase12.diag.toml'
          $W deploy --config worker/wrangler.phase12.diag.toml --keep-vars \
            --message 'Phase 12 guarded diagnostic deployment' >/tmp/diag-deploy.log 2>&1
          echo 'Phase 12 diagnostic Worker deploy completed.'
          sleep 3

          STAGE='seed-test-batches'
          cleanup_rows
          $W d1 execute fpt_portal_v2_db --remote --command \
            "INSERT INTO batch_definitions(batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to,created_at,updated_at) VALUES ('__P12_DIAG_E5__','TEST','english',5,'normal',NULL,'2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP), ('__P12_DIAG_M4__','TEST','maths',4,'normal',NULL,'2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP), ('__P12_DIAG_ML2__','TEST','maths',4,'11plus',2,'2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP); INSERT INTO student_batch_assignments(portal_user_id_norm,batch_key,effective_from,effective_to,source,created_at,updated_at) VALUES ('testy2e','__P12_DIAG_E5__','2000-01-01',NULL,'acceptance-fixture',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP), ('testy2m','__P12_DIAG_M4__','2000-01-01',NULL,'acceptance-fixture',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP), ('testy2m','__P12_DIAG_ML2__','2000-01-01',NULL,'acceptance-fixture',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);" \
            --yes >/tmp/diag-seed.log 2>&1

          login_home() {
            local USERNAME="$1"
            local COOKIE="$2"
            local BODY="$3"
            curl --fail-with-body --silent --show-error --cookie-jar "$COOKIE" \
              --header "Origin: $TEST_ORIGIN" --header 'Content-Type: application/json' \
              --request POST --data "{\"username\":\"${USERNAME}\",\"password\":\"Te12\"}" \
              "$WORKER_BASE/api/v1/student/auth/login" >/tmp/diag-login.json
            jq -e '.ok == true' /tmp/diag-login.json >/dev/null
            curl --fail-with-body --silent --show-error --cookie "$COOKIE" --header "Origin: $TEST_ORIGIN" \
              "$WORKER_BASE/api/v1/student/home" >"$BODY"
            jq -e '.ok == true' "$BODY" >/dev/null
          }

          STAGE='english-home-acceptance'
          login_home 'testy2e' /tmp/diag-e.cookies /tmp/diag-e.home.json
          jq '{subjects:[.subjects[]|{subject,views:[.views[]|{viewId,current,group,lockedPreview}]}]}' /tmp/diag-e.home.json
          jq -e '[.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year5" and .current==true and .group=="current")]|length == 1' /tmp/diag-e.home.json >/dev/null
          jq -e '[.subjects[]|select(.subject=="english")|.views[]|select(.viewId=="english-year2" and .current==false and .group=="previous")]|length == 1' /tmp/diag-e.home.json >/dev/null
          curl --silent --show-error --cookie /tmp/diag-e.cookies --header "Origin: $TEST_ORIGIN" --request POST "$WORKER_BASE/api/v1/student/auth/logout" >/dev/null

          STAGE='maths-home-acceptance'
          login_home 'testy2m' /tmp/diag-m.cookies /tmp/diag-m.home.json
          jq '{subjects:[.subjects[]|{subject,views:[.views[]|{viewId,current,group,lockedPreview}]}]}' /tmp/diag-m.home.json
          jq -e '[.subjects[]|select(.subject=="maths")|.views[]|select(.viewId=="maths-level2" and .current==true and .group=="current")]|length == 1' /tmp/diag-m.home.json >/dev/null
          jq -e '[.subjects[]|select(.subject=="maths")|.views[]|select(.viewId=="maths-year4" and .current==false and .group=="previous")]|length == 1' /tmp/diag-m.home.json >/dev/null
          curl --silent --show-error --cookie /tmp/diag-m.cookies --header "Origin: $TEST_ORIGIN" --request POST "$WORKER_BASE/api/v1/student/auth/logout" >/dev/null

          STAGE='english-video-and-vr-howto'
          node --experimental-default-type=module <<'NODE' >/tmp/diag-english-candidate.json
          import { loadPhase11Catalogue } from './scripts/phase11-catalogue.mjs';
          const c = loadPhase11Catalogue();
          const rows = c.curricula.ENGLISH_Y5.lessonIds.map(id => c.lessons[id]).filter(x => x?.core?.video?.embedUrl && !x?.core?.video?.quiz);
          if (!rows.length) throw new Error('No Y5 English ordinary-video/no-quiz candidate');
          console.log(JSON.stringify({lessonId: rows[0].lessonId}));
          NODE
          ENGLISH_ID="$(jq -r '.lessonId' /tmp/diag-english-candidate.json)"
          curl --fail-with-body --silent --show-error --cookie-jar /tmp/diag-e11.cookies \
            --header "Origin: $TEST_ORIGIN" --header 'Content-Type: application/json' \
            --request POST --data '{"username":"testy511e","password":"Te12"}' \
            "$WORKER_BASE/api/v1/student/auth/login" >/tmp/diag-login.json
          jq -e '.ok == true' /tmp/diag-login.json >/dev/null
          curl --fail-with-body --silent --show-error --cookie /tmp/diag-e11.cookies --header "Origin: $TEST_ORIGIN" \
            "$WORKER_BASE/api/v1/student/lessons/$ENGLISH_ID?viewId=english-year5-11plus" >/tmp/diag-e11.detail.json
          jq -e '.ok == true and .lesson.presentation == "11plus" and .lesson.video.resourceKey != null and .lesson.quiz == null' /tmp/diag-e11.detail.json >/dev/null
          VIDEO_KEY="$(jq -r '.lesson.video.resourceKey' /tmp/diag-e11.detail.json)"
          curl --fail-with-body --silent --show-error --cookie /tmp/diag-e11.cookies --header "Origin: $TEST_ORIGIN" \
            "$WORKER_BASE/api/v1/student/resources/$VIDEO_KEY/video?viewId=english-year5-11plus" >/tmp/diag-e11.video.json
          jq -e '.ok == true and (.embedUrl|startswith("https://go.screenpal.com/player/")) and ((.embedUrl|contains("quiz_id="))|not)' /tmp/diag-e11.video.json >/dev/null
          curl --fail-with-body --silent --show-error --cookie /tmp/diag-e11.cookies --header "Origin: $TEST_ORIGIN" \
            "$WORKER_BASE/api/v1/student/special-areas/VR_HOWTO?viewId=english-year5-11plus" >/tmp/diag-vr-howto.json
          jq -e '.ok == true and .area.bucketId == "VR_HOWTO"' /tmp/diag-vr-howto.json >/dev/null
          curl --silent --show-error --cookie /tmp/diag-e11.cookies --header "Origin: $TEST_ORIGIN" --request POST "$WORKER_BASE/api/v1/student/auth/logout" >/dev/null

          STAGE='cleanup-and-final-verify'
          cleanup_rows
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; PRAGMA quick_check;" \
            >/tmp/diag-d1-after.json 2>/tmp/diag-d1-after.err
          test "$(jq -r '.[0].results[0].batch_count' /tmp/diag-d1-after.json)" = '0'
          test "$(jq -r '.[1].results[0].assignment_count' /tmp/diag-d1-after.json)" = '0'
          test "$(jq -r '.[2].results[0].release_count' /tmp/diag-d1-after.json)" = '0'
          grep -Fq '"ok"' /tmp/diag-d1-after.json
          node tests/phase12-batch-aware-worker-verification.mjs
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/diag-catalogue.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/diag-catalogue.log
          trap - ERR
          echo 'Phase 12 guarded deployment diagnostic: PASS'