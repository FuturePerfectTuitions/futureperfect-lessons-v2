name: R2 Y5 read-only progress snapshot
on:
  push:
    branches: [ops/r2-drive-sync-y5]
    paths:
      - .github/r2-y5-progress-trigger.txt
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: fpt-materials-dev
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet requests
      - run: python3 scripts/r2_y5_progress_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: y5-r2-progress
          path: y5-r2-progress.json
          retention-days: 7
