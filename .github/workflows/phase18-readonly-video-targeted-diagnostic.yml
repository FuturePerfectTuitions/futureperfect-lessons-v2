name: Phase 18 read-only targeted video KV diagnostic

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-readonly-video-targeted-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  EXPECTED_MAIN: 3c63a49ef0d679318e8c6901b12e82c007b56271
  SOURCE_NS: 80e5015aeb7046aa917189304a093a7c
  V2_NS: 49619b1a24b244bc8aaa6223fcd24e80

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve remaining mappings read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          cat >.phase18-target.mjs <<'NODE'
          const API=process.env.CF_API, account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const src=process.env.SOURCE_NS,v2=process.env.V2_NS,headers={Authorization:`Bearer ${token}`};
          async function get(ns,key){const r=await fetch(`${API}/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers});if(r.status===404)return null;if(!r.ok)throw new Error(`${key} HTTP ${r.status}`);return await r.text()}
          function splitObjects(raw){const out=[];let depth=0,start=-1,inStr=false,esc=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(inStr){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c==='"')inStr=false;continue}if(c==='"'){inStr=true;continue}if(c==='{'){if(depth===0)start=i;depth++}else if(c==='}'){depth--;if(depth===0&&start>=0){try{out.push(JSON.parse(raw.slice(start,i+1)))}catch{}start=-1}}}return out}
          function collect(x,out=[]){if(Array.isArray(x)){for(const v of x)collect(v,out);return out}if(!x||typeof x!=='object')return out;if(x.n!=null||x.title||x.sp){out.push(x);return out}for(const v of Object.values(x))collect(v,out);return out}
          function parse(raw){try{return collect(JSON.parse(raw),[])}catch{return splitObjects(raw).flatMap(x=>collect(x,[]))}}
          function token(v){if(!v)return '';try{return new URL(v).pathname.split('/').filter(Boolean).at(-1)||v}catch{return String(v).trim()}}
          function sv(x){return token(x?.sp||x?.video||x?.videoUrl||'')}
          function vv(rec){const v=rec?.core?.video;if(!v)return '';for(const x of [v.id,v.videoId,v.embedUrl,v.contentUrl,v.watchUrl])if(typeof x==='string'&&x.trim())return token(x);return ''}
          const targeted=['Y4M14','Y6M34','Y6M35','Y6M36','Y6M37','Y6M38','Y5M12','Y5M13'];
          for(const id of targeted){const raw=await get(v2,`lesson:${id}`);const rec=raw?JSON.parse(raw):null;console.log(`PHASE18_TARGET_V2 id=${id} exists=${!!rec} title=${rec?.title||''} coreVideo=${vv(rec)||'(none)'} topKeys=${rec?Object.keys(rec).join('|'):''}`);if(id==='Y5M12'||id==='Y5M13'){const variantKeys=rec?Object.keys(rec).filter(k=>/video|variant|11|quiz|presentation/i.test(k)):[];console.log(`PHASE18_TARGET_V2_VARIANT_KEYS id=${id} keys=${variantKeys.join('|')||'(none)'}`)}}
          for(const bucket of ['Y4M','Y4M11plus','Y5M','Y5M11plus','Y6M']){const items=parse(await get(src,bucket));for(const item of items){const title=String(item.title||'');if(/Y4M14\b|Y4M22\b|Y5M12\b|Y5M13\b|Y6M3[4-8]\b/i.test(title))console.log(`PHASE18_TARGET_SOURCE bucket=${bucket} n=${item.n??''} title=${title} video=${sv(item)||'(none)'}`)}}
          NODE
          node .phase18-target.mjs
          rm -f .phase18-target.mjs
      - run: echo 'PHASE18_TARGETED_VIDEO_DIAGNOSTIC_COMPLETE writes=0'
