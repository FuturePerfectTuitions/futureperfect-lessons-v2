name: Audit Admin0206 prepared SATS access

on:
  push:
    branches:
      - ops/purge-lessons-cache-20261002
    paths:
      - '.github/workflows/audit-admin0206-prepared-sats-20261002.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/purge-lessons-cache-20261002

      - name: Inspect Admin0206 prepared access read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            SCOPE_SALT_KEY,
            opaqueAccessScopeId,
            resolveCurrentScope
          } from './worker/src/access-read-model-sync.js';

          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID || '').trim();
          if (!token || !account) throw new Error('CLOUDFLARE_DIAGNOSTIC_INPUT_REQUIRED');
          const auth = { Authorization: `Bearer ${token}` };
          const api = `https://api.cloudflare.com/client/v4/accounts/${account}`;

          const settingsResponse = await fetch(`${api}/workers/scripts/fpt-portal-v2-rebuild-student-prod/settings`, { headers: auth });
          if (!settingsResponse.ok) throw new Error(`WORKER_SETTINGS_FAILED:${settingsResponse.status}`);
          const settings = await settingsResponse.json();
          const bindings = Array.isArray(settings?.result?.bindings) ? settings.result.bindings : [];
          const ns = bindings.find(binding => binding?.name === 'READ_MODELS_KV' && binding?.type === 'kv_namespace')?.namespace_id || '';
          if (!ns) throw new Error('READ_MODELS_KV_BINDING_MISSING');

          const valueUrl = key => `${api}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`;
          const store = {
            async get(key) {
              const response = await fetch(valueUrl(key), { headers: auth });
              if (response.status === 404) return null;
              if (!response.ok) throw new Error(`KV_GET_FAILED:${response.status}`);
              return response.text();
            }
          };

          const salt = String(await store.get(SCOPE_SALT_KEY) || '').trim();
          if (!/^[0-9a-f]{64}$/i.test(salt)) throw new Error('READ_MODEL_SCOPE_SALT_INVALID');
          const scopeId = await opaqueAccessScopeId('admin0206', salt);
          const current = await resolveCurrentScope(store, `access:${scopeId}`);
          const snapshot = current?.payload?.snapshot || {};

          const views = (snapshot.views || []).map(view => ({
            viewId: view.viewId,
            label: view.label,
            current: view.current,
            group: view.group,
            lockedPreview: view.lockedPreview,
            openLessonCount: view.openLessonCount
          }));

          console.log(JSON.stringify({
            version: current.version,
            views,
            hasMathsYear6: views.some(view => view.viewId === 'maths-year6'),
            hasMathsSats: views.some(view => view.viewId === 'maths-sats')
          }));

          if (!views.some(view => view.viewId === 'maths-year6')) throw new Error('ADMIN0206_YEAR6_VIEW_MISSING');
          if (!views.some(view => view.viewId === 'maths-sats')) throw new Error('ADMIN0206_SATS_VIEW_MISSING');
          console.log('ADMIN0206_PREPARED_SATS_ACCESS_PASS');
          NODE
