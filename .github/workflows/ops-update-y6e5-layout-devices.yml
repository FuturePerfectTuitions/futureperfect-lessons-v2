name: Ops update Y6T1E05 Layout Devices

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-update-y6e5-layout-devices.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker

jobs:
  apply:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard production target, update Y6T1E05, and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          SETTINGS="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$SETTINGS" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="production")' /tmp/settings.json >/dev/null
          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV" and .type=="kv_namespace") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"; test "$LESSONS_KV_ID" != null
          export LESSONS_KV_ID

          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_KV_ID;
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${ns}/values/`;
          const auth = { Authorization: `Bearer ${token}` };

          const DISPLAY_ID = 'Y6T1E05';
          const TARGET = 'cOQj2znwz7j';
          const description = [
            'In this Year 6 English lesson, students explore how layout devices organise information and help readers navigate non-fiction texts, with a particular focus on headings, subheadings, columns, bullet points and tables.',
            '',
            'This lesson includes:',
            '✔ Identifying common layout devices and explaining their purpose',
            '✔ Understanding how headings and subheadings guide the reader through a text',
            '✔ Exploring how columns make large blocks of information easier to read',
            '✔ Using bullet points to separate and highlight key information clearly',
            '✔ Applying punctuation rules consistently in bulleted lists',
            '✔ Using capital letters, full stops and question marks correctly in complete bullet-point sentences and questions',
            '✔ Recognising when simple list items need no end punctuation and when a stem, colon and semi-colons may be used',
            '✔ Using tables to organise related information into rows and columns for comparison',
            '✔ Recognising other layout features such as photographs, captions, quotes, colour, fonts, diagrams and maps',
            '',
            'Students first investigate a range of non-fiction layout devices and discuss why writers use them. The lesson then examines bullet points in greater depth, including how punctuation changes depending on whether the items are full sentences, questions, proper nouns, simple words or short phrases.',
            '',
            'The final section returns to broader layout choices, showing how tables and other visual devices can make information clearer, easier to compare and more appealing to the reader.',
            '',
            'By the end of the lesson, learners will be able to identify and explain a range of layout devices and use bullet points with consistent, appropriate punctuation.'
          ].join('\n');

          function video(code) {
            return {
              screenpal: code,
              contentUrl: `https://screenpal.com/content/video/${code}`,
              embedUrl: `https://go.screenpal.com/player/${code}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent`,
              watchUrl: `https://go.screenpal.com/watch/${code}`
            };
          }

          async function getJson(key) {
            const r = await fetch(base + encodeURIComponent(key), { headers: auth });
            if (!r.ok) throw new Error(`GET ${key} failed HTTP ${r.status}`);
            const text = await r.text();
            try { return JSON.parse(text); } catch { throw new Error(`${key} is not valid JSON`); }
          }

          async function putJson(key, value) {
            const r = await fetch(base + encodeURIComponent(key), {
              method: 'PUT',
              headers: { ...auth, 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(value)
            });
            if (!r.ok) throw new Error(`PUT ${key} failed HTTP ${r.status}: ${await r.text()}`);
          }

          function guardLesson(r) {
            if (r?.subject !== 'english' || r?.active !== true) throw new Error('Y6T1E05 state mismatch');
            if (!Object.values(r?.displayIds || {}).includes(DISPLAY_ID)) throw new Error(`Display ID mismatch for ${r?.lessonId}`);
            const title = String(r?.title || '').toLowerCase();
            if (!title.includes('layout') || !title.includes('device')) throw new Error(`Y6T1E05 title guard failed: ${r?.title}`);
            if (!r?.core || !Object.prototype.hasOwnProperty.call(r.core, 'video')) throw new Error('Y6T1E05 core.video missing');
          }

          (async () => {
            const curriculum = await getJson('curriculum:ENGLISH_Y6');
            if (curriculum?.curriculumCode !== 'ENGLISH_Y6') throw new Error('ENGLISH_Y6 curriculum identity mismatch');
            if (!Array.isArray(curriculum.lessonIds) || !curriculum.lessonIds.length) throw new Error('ENGLISH_Y6 lessonIds missing');

            const matches = [];
            for (const lessonId of curriculum.lessonIds) {
              const rec = await getJson(`lesson:${lessonId}`);
              if (Object.values(rec?.displayIds || {}).includes(DISPLAY_ID)) matches.push(rec);
            }
            if (matches.length !== 1) throw new Error(`Expected exactly one ${DISPLAY_ID} lesson; found ${matches.length}`);

            const before = matches[0];
            guardLesson(before);
            const lessonKey = `lesson:${before.lessonId}`;

            const next = JSON.parse(JSON.stringify(before));
            next.description = description;
            next.core.video = video(TARGET);
            next.contentStatus = {
              ...(next.contentStatus || {}),
              description: 'available',
              mainVideo: 'available',
              ownerConfirmedPending: false
            };

            await putJson(lessonKey, next);

            let verified;
            for (let attempt = 1; attempt <= 6; attempt++) {
              verified = await getJson(lessonKey);
              const ok = verified?.core?.video?.screenpal === TARGET &&
                verified?.description === description &&
                verified?.contentStatus?.description === 'available' &&
                verified?.contentStatus?.mainVideo === 'available' &&
                verified?.contentStatus?.ownerConfirmedPending === false;
              if (ok) break;
              if (attempt < 6) await sleep(2000);
            }

            guardLesson(verified);
            if (verified?.core?.video?.screenpal !== TARGET) throw new Error('Y6T1E05 ScreenPal verification failed');
            if (verified?.description !== description) throw new Error('Y6T1E05 description verification failed');
            if (verified?.contentStatus?.description !== 'available' || verified?.contentStatus?.mainVideo !== 'available' || verified?.contentStatus?.ownerConfirmedPending !== false) {
              throw new Error('Y6T1E05 content status verification failed');
            }

            console.log('Y6T1E05_VERIFIED=' + JSON.stringify({
              lessonId: verified.lessonId,
              displayId: verified.displayIds['english-year6'],
              title: verified.title,
              screenpal: verified.core.video.screenpal,
              contentStatus: verified.contentStatus
            }));
            console.log('OPS_UPDATE_Y6E5_PASS');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
