name: Phase 15 guarded development Worker deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/src/phase11-vr-howto.js'
      - 'worker/src/index-phase12.js'
      - 'worker/src/index-phase13.js'
      - 'tests/phase11-vr-howto-top-level-static-verification.mjs'
      - 'tests/phase15-*'
      - '.github/workflows/phase15-guarded-development-deploy.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  deploy-development:
    name: Guard and deploy isolated Phase 15 Worker
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'phase15-student-persona-testing' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase 15 head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard, deploy and postflight isolated development Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          BASE='${{ github.event.pull_request.base.sha }}'
          EXPECTED_BASE='525a496ef39f43dfd60241e5f031ea96b451151e'
          STUDENTS=''; LESSONS=''; DB=''; R2=''; DEPLOYED=0; STAGE='initialise'

          make_config() {
            local entrypoint="$1" out="$2"
            cat >"$out" <<EOF
          name = "fpt-portal-v2-worker"
          main = "${entrypoint}"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF
          }

          verify_baseline() {
            local out="$1"
            $W d1 execute fpt_portal_v2_db --remote --json --command \
              "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(DISTINCT portal_user_id_norm) AS assigned_users FROM student_batch_assignments; SELECT COUNT(*) AS assigned_user_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN (SELECT DISTINCT portal_user_id_norm FROM student_batch_assignments); SELECT COUNT(*) AS temp_entitlements FROM lesson_entitlements WHERE source_batch_code IN ('P15_M3A','P15_M4B','P15_E411'); SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" >"$out" 2>"$out.err"
            test "$(jq -r '.[0].results[0].entitlement_count' "$out")" = '632'
            test "$(jq -r '.[1].results[0].batch_count' "$out")" = '4'
            test "$(jq -r '.[2].results[0].assignment_count' "$out")" = '4'
            test "$(jq -r '.[3].results[0].release_count' "$out")" = '0'
            test "$(jq -r '.[4].results[0].assigned_users' "$out")" = '2'
            test "$(jq -r '.[5].results[0].assigned_user_entitlements' "$out")" = '173'
            test "$(jq -r '.[6].results[0].temp_entitlements' "$out")" = '0'
            jq -e '.[7].results[0].name == "trg_student_sessions_single_active"' "$out" >/dev/null
            jq -e '.[8].results[0].quick_check == "ok"' "$out" >/dev/null
          }

          rollback_worker() {
            if [ "$DEPLOYED" -ne 1 ]; then return 0; fi
            set +e
            rm -rf /tmp/p15-rollback
            git worktree add --detach /tmp/p15-rollback "$BASE" >/tmp/p15-worktree.log 2>&1
            local rc=$?
            if [ "$rc" -eq 0 ]; then
              (cd /tmp/p15-rollback && node scripts/phase11-navigation-manifest.mjs >/tmp/p15-rollback-navigation.log 2>&1)
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              make_config 'src/index-phase13.js' '/tmp/p15-rollback/worker/wrangler.phase15.rollback.toml'
              (cd /tmp/p15-rollback && $W deploy --config worker/wrangler.phase15.rollback.toml --keep-vars \
                --message 'Rollback failed Phase 15 guarded development deployment' >/tmp/p15-rollback.log 2>&1)
              rc=$?
            fi
            [ "$rc" -eq 0 ] && echo 'Fail-closed rollback to Phase 14 Worker source completed.' || echo 'ERROR: Phase 15 automatic rollback failed.' >&2
            set -e
            return "$rc"
          }

          failure() {
            local status=$?
            trap - ERR
            echo "Phase 15 development deployment failed at stage: ${STAGE}" >&2
            rollback_worker || true
            exit "$status"
          }
          trap failure ERR

          STAGE='source-and-base-guard'
          test "$BASE" = "$EXPECTED_BASE"
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --check worker/src/phase11-vr-howto.js
          node --check worker/src/index-phase12.js
          node --check worker/src/index-phase13.js
          node tests/phase11-vr-howto-top-level-static-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs
          node tests/phase13-excel-sync-verification.mjs
          node --experimental-default-type=module tests/phase11-catalogue-static-verification.mjs >/tmp/p15-catalogue.log
          grep -Fq '7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663' /tmp/p15-catalogue.log
          node scripts/phase11-navigation-manifest.mjs | tee /tmp/p15-navigation-manifest.log
          jq -e '.catalogueSha256 == "7ef38f56d9891e4e1ae5aaa3874ae43b18a2fcd70f8f02e34b54ff9066306663" and .curricula == 11 and .lessons == 369' /tmp/p15-navigation-manifest.log >/dev/null
          node tests/phase15-master-navigation-regression.mjs
          grep -Fq 'manualAccess.specialBuckets+open-english-11plus-view' worker/src/phase11-vr-howto.js
          grep -Fq 'SPECIAL_ACCESS_REQUIRED' worker/src/phase11-vr-howto.js

          STAGE='cloudflare-isolation-guard'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p15-settings-before.json
          jq -e '.success == true' /tmp/p15-settings-before.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p15-settings-before.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p15-settings-before.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p15-settings-before.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p15-settings-before.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p15-settings-before.json)"
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p15-settings-before.json)"
          test "$R2" = 'fpt-materials-dev'
          for value in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$value"; test "$value" != null; done
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p15-namespaces.json
          LEGACY="$(jq -r '[.result[]|select(.title=="FPT_LESSONS_TEST")|.id][0] // ""' /tmp/p15-namespaces.json)"
          if [ -n "$LEGACY" ]; then test "$LESSONS" != "$LEGACY"; fi
          $W secret list --name "$WORKER_NAME" --format json | jq -r '.[].name' | sort > /tmp/p15-secrets-before.txt
          grep -Fxq 'EXCEL_SYNC_TOKEN' /tmp/p15-secrets-before.txt
          verify_baseline /tmp/p15-d1-before.json

          STAGE='dry-run-worker-bundle'
          make_config 'src/index-phase13.js' 'worker/wrangler.phase15.runtime.toml'
          $W deploy --config worker/wrangler.phase15.runtime.toml --dry-run --outdir /tmp/p15-build >/tmp/p15-dry-run.log
          test -d /tmp/p15-build

          STAGE='deploy-isolated-development-worker'
          $W deploy --config worker/wrangler.phase15.runtime.toml --keep-vars \
            --message 'Phase 15 guarded student-persona development Worker' >/tmp/p15-deploy.log 2>&1
          DEPLOYED=1
          sleep 3

          STAGE='post-deploy-binding-secret-guard'
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --output /tmp/p15-settings-after.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p15-settings-after.json >/dev/null
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p15-settings-after.json)" = 'fpt-materials-dev'
          AFTER_LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p15-settings-after.json)"
          case "${AFTER_LOGIN,,}" in ''|'false') ;; *) false;; esac
          for var in ALLOWED_ORIGINS DEV_LOGIN_ALLOWLIST STUDENT_LOGIN_ENABLED; do
            test "$(jq -r --arg n "$var" '[.result.bindings[]|select(.name==$n and .type=="plain_text")|.text][0] // ""' /tmp/p15-settings-after.json)" = \
                 "$(jq -r --arg n "$var" '[.result.bindings[]|select(.name==$n and .type=="plain_text")|.text][0] // ""' /tmp/p15-settings-before.json)"
          done
          test "$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p15-settings-after.json)" = "$STUDENTS"
          test "$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/p15-settings-after.json)" = "$LESSONS"
          test "$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/p15-settings-after.json)" = "$DB"
          $W secret list --name "$WORKER_NAME" --format json | jq -r '.[].name' | sort > /tmp/p15-secrets-after.txt
          cmp /tmp/p15-secrets-before.txt /tmp/p15-secrets-after.txt

          STAGE='route-smoke-no-mutation'
          CODE=''; ERROR=''
          for attempt in 1 2 3 4 5; do
            CODE="$(curl --silent --show-error --output /tmp/p15-vr-noauth.json --write-out '%{http_code}' \
              --header 'Origin: https://futureperfecttuitions.github.io' \
              "$WORKER_BASE/api/v1/student/special-areas/VR_HOWTO?viewId=english-year5-11plus")"
            ERROR="$(jq -r '.error // ""' /tmp/p15-vr-noauth.json 2>/dev/null || true)"
            if [ "$CODE" = '401' ]; then
              case "$ERROR" in SESSION_REQUIRED|SESSION_INVALID) break;; esac
            fi
            sleep 2
          done
          echo "PHASE15_ROUTE_SMOKE status=${CODE} error=${ERROR}"
          test "$CODE" = '401'
          case "$ERROR" in SESSION_REQUIRED|SESSION_INVALID) ;; *) false;; esac
          verify_baseline /tmp/p15-d1-after.json

          STAGE='complete'
          DEPLOYED=0
          trap - ERR
          echo 'PHASE15_DEVELOPMENT_WORKER_DEPLOY_PASS'
