name: Secure Quiz owner-review deploy 2026-09-19

on:
  push:
    branches:
      - ops/quiz-diagram-renderer-2026-09-19
    paths:
      - '.github/workflows/quiz-secure-owner-review-deploy-2026-09-19.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secure-quiz-owner-review-deploy-2026-09-19
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_WORKER: futureperfect-11plus-practice-step10-preview
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e
  EXPECTED_OLD_QUIZ_VERSION: e6cc78a5-4d8e-47ea-87ac-0f5d7aced9ae
  EXPECTED_SOURCE_COMMIT: 1bfef511ca2b501446384eee755a6af506136cfc
  EXPECTED_SOURCE_ZIP_SHA256: 82eb557bde2825939daf87cdaa9c6c51afe50e75780181f8d9815ec14ebdaf8a
  EXPECTED_LIVE_COUNT: '714'
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  EXPECTED_BROWSER_VERSION: f8a64bc8-8192-4400-9e45-8f1a1de10019
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_STUDENT_VERSION: f26167b1-073c-4015-912a-288a3d20e0bb
  TRANSFER_BRANCH: ops/quiz-diagram-renderer-2026-09-19

jobs:
  deploy-review-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/quiz-diagram-renderer-2026-09-19
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require deployment credentials and prove hold boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/secure-quiz-deploy
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/secure-quiz-deploy/quiz-before.json
          OLD_VERSION="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/secure-quiz-deploy/quiz-before.json | head -n1)"
          test "$OLD_VERSION" = "$EXPECTED_OLD_QUIZ_VERSION" || { echo "QUIZ_VERSION_DRIFT expected=$EXPECTED_OLD_QUIZ_VERSION actual=$OLD_VERSION"; exit 1; }
          echo "OLD_VERSION=$OLD_VERSION" >> "$GITHUB_ENV"

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$BROWSER_WORKER" --json > /tmp/secure-quiz-deploy/browser-before.json
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$STUDENT_WORKER" --json > /tmp/secure-quiz-deploy/student-before.json
          browser="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/secure-quiz-deploy/browser-before.json | head -n1)"
          student="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/secure-quiz-deploy/student-before.json | head -n1)"
          test "$browser" = "$EXPECTED_BROWSER_VERSION" || { echo "PORTAL_BROWSER_DRIFT expected=$EXPECTED_BROWSER_VERSION actual=$browser"; exit 1; }
          test "$student" = "$EXPECTED_STUDENT_VERSION" || { echo "PORTAL_STUDENT_DRIFT expected=$EXPECTED_STUDENT_VERSION actual=$student"; exit 1; }

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$QUIZ_D1_NAME" --remote --command "SELECT COUNT(*) AS live_questions FROM question_instance WHERE UPPER(lifecycle_status)='LIVE'; SELECT COUNT(*) AS active_non_review FROM quiz_auth_session WHERE revoked_at IS NULL AND expires_at > datetime('now') AND portal_user_id NOT LIKE 'owner-review-%';" --json > /tmp/secure-quiz-deploy/db-before.json
          live="$(jq -r '.[0].results[0].live_questions' /tmp/secure-quiz-deploy/db-before.json)"
          nonreview="$(jq -r '.[1].results[0].active_non_review' /tmp/secure-quiz-deploy/db-before.json)"
          test "$live" = "$EXPECTED_LIVE_COUNT" || { echo "LIVE_BANK_DRIFT expected=$EXPECTED_LIVE_COUNT actual=$live"; exit 1; }
          test "$nonreview" = '0' || { echo "ACTIVE_NON_REVIEW_AUTH_PRESENT count=$nonreview"; exit 1; }

          curl --fail --silent --show-error 'https://lessons.futureperfect.education/' -o /tmp/secure-quiz-deploy/portal-root.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, urllib.parse
          html=Path('/tmp/secure-quiz-deploy/portal-root.html').read_text(errors='replace')
          refs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not refs: raise SystemExit('NO_PORTAL_JS_ASSET_FOUND')
          text=''
          for i,ref in enumerate(refs):
              url=urllib.parse.urljoin('https://lessons.futureperfect.education/',ref)
              out=f'/tmp/secure-quiz-deploy/portal-{i}.js'
              subprocess.run(['curl','--fail','--silent','--show-error',url,'-o',out],check=True)
              text += Path(out).read_text(errors='replace')
          markers=['11+ Practice','quiz.futureperfect.education','/api/v2/student/quiz/eligibility','/api/v2/student/quiz/launch']
          found=[m for m in markers if m in text]
          if found: raise SystemExit('QUIZ_SURFACE_PRESENT_IN_PORTAL: '+repr(found))
          PY
          echo QUIZ_OWNER_REVIEW_HOLD_PREFLIGHT_PASS

      - name: Generate one-time transfer key and publish public half
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/secure-quiz-deploy/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/secure-quiz-deploy/private.pem -pubout -out /tmp/secure-quiz-deploy/public.pem >/dev/null 2>&1
          body="$(printf 'Temporary one-time public key for GitHub Actions run `%s`. It is safe to publish; the private key exists only in the active runner and will be destroyed when the job ends.\n\n```pem\n%s\n```\n' "$GITHUB_RUN_ID" "$(cat /tmp/secure-quiz-deploy/public.pem)")"
          issue_url="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="TEMP Quiz secure transfer public key ${GITHUB_RUN_ID}" -f body="$body" --jq .html_url)"
          issue_no="${issue_url##*/}"
          echo "TRANSFER_ISSUE=$issue_no" >> "$GITHUB_ENV"
          echo "SECURE_TRANSFER_ISSUE=$issue_no"

      - name: Wait for encrypted tested runtime bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          base="ops/quiz-secure-transfer/${GITHUB_RUN_ID}"
          ready=false
          for attempt in $(seq 1 120); do
            git fetch origin "$TRANSFER_BRANCH" --quiet || true
            ok=true
            for f in key.b64 part00 part01 part02 part03 part04; do
              git show "origin/${TRANSFER_BRANCH}:${base}/${f}" > "/tmp/secure-quiz-deploy/${f}" 2>/dev/null || { ok=false; break; }
            done
            if test "$ok" = true; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true || { echo ENCRYPTED_TRANSFER_TIMEOUT; exit 1; }
          cat /tmp/secure-quiz-deploy/part0{0,1,2,3,4} | base64 -d > /tmp/secure-quiz-deploy/runtime.zip.enc
          base64 -d /tmp/secure-quiz-deploy/key.b64 > /tmp/secure-quiz-deploy/key.enc
          openssl pkeyutl -decrypt -inkey /tmp/secure-quiz-deploy/private.pem -in /tmp/secure-quiz-deploy/key.enc -out /tmp/secure-quiz-deploy/pass.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/secure-quiz-deploy/runtime.zip.enc -out /tmp/secure-quiz-deploy/runtime.zip -pass file:/tmp/secure-quiz-deploy/pass.txt
          actual="$(sha256sum /tmp/secure-quiz-deploy/runtime.zip | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SOURCE_ZIP_SHA256" || { echo "SOURCE_ZIP_DIGEST_MISMATCH expected=$EXPECTED_SOURCE_ZIP_SHA256 actual=$actual"; exit 1; }
          mkdir -p /tmp/secure-quiz-deploy/runtime
          unzip -q /tmp/secure-quiz-deploy/runtime.zip -d /tmp/secure-quiz-deploy/runtime
          test "$(cat /tmp/secure-quiz-deploy/runtime/SOURCE_COMMIT.txt)" = "$EXPECTED_SOURCE_COMMIT"
          sed 's#/tmp/quiz-runtime-source/#/tmp/secure-quiz-deploy/runtime/#' /tmp/secure-quiz-deploy/runtime/SHA256SUMS.txt > /tmp/secure-quiz-deploy/runtime/SHA256SUMS.local.txt
          sha256sum -c /tmp/secure-quiz-deploy/runtime/SHA256SUMS.local.txt
          node --check /tmp/secure-quiz-deploy/runtime/src/index.js
          echo SECURE_TESTED_RUNTIME_TRANSFER_PASS

      - name: Prepare keep-vars Quiz deployment config
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/secure-quiz-deploy/runtime/wrangler.toml <<TOML
          name = "${QUIZ_WORKER}"
          main = "src/index.js"
          compatibility_date = "2026-09-17"
          keep_vars = true

          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML

          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${QUIZ_WORKER}/settings" -H "$AUTH" -o /tmp/secure-quiz-deploy/settings-before.json
          expected_names='DB,ENVIRONMENT,LAUNCH_REDEEM_TIMEOUT_MS,PORTAL_BRIDGE_URL,PORTAL_LOGIN_URL,QUIZ_BRIDGE_SECRET,QUIZ_ORIGIN,QUIZ_SESSION_TTL_SECONDS'
          actual_names="$(jq -r '[.result.bindings[].name] | sort | join(",")' /tmp/secure-quiz-deploy/settings-before.json)"
          test "$actual_names" = "$expected_names" || { echo "QUIZ_BINDING_SET_DRIFT $actual_names"; exit 1; }
          jq -e --arg id "$QUIZ_D1_ID" '.result.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/secure-quiz-deploy/settings-before.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/secure-quiz-deploy/settings-before.json >/dev/null

          npx --yes wrangler@"$WRANGLER_VERSION" versions list --name "$QUIZ_WORKER" --json > /tmp/secure-quiz-deploy/versions-before.json
          jq -r '.[] | (.id // .version_id // empty)' /tmp/secure-quiz-deploy/versions-before.json | sort -u > /tmp/secure-quiz-deploy/version-ids-before.txt
          echo QUIZ_DEPLOY_CONFIG_PASS

      - name: Upload tested build without traffic
        id: upload
        working-directory: /tmp/secure-quiz-deploy/runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions upload src/index.js --config wrangler.toml --keep-vars --message 'Owner-review build: diagrams + diagram-aware explanations' | tee /tmp/secure-quiz-deploy/upload.txt
          npx --yes wrangler@"$WRANGLER_VERSION" versions list --name "$QUIZ_WORKER" --json > /tmp/secure-quiz-deploy/versions-after-upload.json
          jq -r '.[] | (.id // .version_id // empty)' /tmp/secure-quiz-deploy/versions-after-upload.json | sort -u > /tmp/secure-quiz-deploy/version-ids-after.txt
          NEW_VERSION="$(comm -13 /tmp/secure-quiz-deploy/version-ids-before.txt /tmp/secure-quiz-deploy/version-ids-after.txt | head -n1)"
          test -n "$NEW_VERSION"
          test "$NEW_VERSION" != "$OLD_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "QUIZ_OWNER_REVIEW_CANDIDATE=$NEW_VERSION"

      - name: Inspect candidate bindings before traffic
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${QUIZ_WORKER}/versions/${NEW_VERSION}" -H "$AUTH" -o /tmp/secure-quiz-deploy/candidate.json
          jq -e '.success == true' /tmp/secure-quiz-deploy/candidate.json >/dev/null
          expected_names='DB,ENVIRONMENT,LAUNCH_REDEEM_TIMEOUT_MS,PORTAL_BRIDGE_URL,PORTAL_LOGIN_URL,QUIZ_BRIDGE_SECRET,QUIZ_ORIGIN,QUIZ_SESSION_TTL_SECONDS'
          actual_names="$(jq -r '[.result.resources.bindings[].name] | sort | join(",")' /tmp/secure-quiz-deploy/candidate.json)"
          test "$actual_names" = "$expected_names" || { echo "CANDIDATE_BINDINGS_CHANGED $actual_names"; exit 1; }
          jq -e --arg id "$QUIZ_D1_ID" '.result.resources.bindings[] | select(.name=="DB" and (.id==$id or .database_id==$id))' /tmp/secure-quiz-deploy/candidate.json >/dev/null
          jq -e '.result.resources.bindings[] | select(.name=="QUIZ_BRIDGE_SECRET" and ((.type//"")|test("secret";"i")))' /tmp/secure-quiz-deploy/candidate.json >/dev/null
          echo QUIZ_OWNER_REVIEW_CANDIDATE_BINDINGS_PASS

      - name: Promote owner-review build to hidden Quiz runtime
        id: promote
        continue-on-error: true
        working-directory: /tmp/secure-quiz-deploy/runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$NEW_VERSION@100%" --name "$QUIZ_WORKER" --message 'Owner-review build: fixed diagrams and original diagrams in explanations' -y
          echo QUIZ_OWNER_REVIEW_BUILD_PROMOTED

      - name: Verify hidden Quiz runtime and Portal hold
        id: verify
        if: steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/secure-quiz-deploy/quiz-after.json
          jq -e --arg id "$NEW_VERSION" '.versions[] | select(.version_id==$id and .percentage==100)' /tmp/secure-quiz-deploy/quiz-after.json >/dev/null

          code="$(curl --silent --show-error --output /tmp/secure-quiz-deploy/health-after.json --write-out '%{http_code}' 'https://quiz.futureperfect.education/health')"
          test "$code" = '200'
          curl --fail --silent --show-error 'https://quiz.futureperfect.education/assets/app.js' -o /tmp/secure-quiz-deploy/live-app.js
          grep -Fq "return svg('Equal-part diagram with '" /tmp/secure-quiz-deploy/live-app.js
          grep -Fq "return svg('3D solid diagram'" /tmp/secure-quiz-deploy/live-app.js
          grep -Fq "diagram(x.diagramType,x.diagramSpec)" /tmp/secure-quiz-deploy/live-app.js
          grep -Fq "Diagram unavailable" /tmp/secure-quiz-deploy/live-app.js
          ! grep -Fq "<strong>Equal-part diagram:</strong>" /tmp/secure-quiz-deploy/live-app.js
          ! grep -Fq "<strong>3D solid:</strong>" /tmp/secure-quiz-deploy/live-app.js

          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$QUIZ_D1_NAME" --remote --command "SELECT COUNT(*) AS live_questions FROM question_instance WHERE UPPER(lifecycle_status)='LIVE'; SELECT COUNT(*) AS active_non_review FROM quiz_auth_session WHERE revoked_at IS NULL AND expires_at > datetime('now') AND portal_user_id NOT LIKE 'owner-review-%';" --json > /tmp/secure-quiz-deploy/db-after.json
          live="$(jq -r '.[0].results[0].live_questions' /tmp/secure-quiz-deploy/db-after.json)"
          nonreview="$(jq -r '.[1].results[0].active_non_review' /tmp/secure-quiz-deploy/db-after.json)"
          test "$live" = "$EXPECTED_LIVE_COUNT"
          test "$nonreview" = '0'

          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$BROWSER_WORKER" --json > /tmp/secure-quiz-deploy/browser-after.json
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$STUDENT_WORKER" --json > /tmp/secure-quiz-deploy/student-after.json
          browser="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/secure-quiz-deploy/browser-after.json | head -n1)"
          student="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/secure-quiz-deploy/student-after.json | head -n1)"
          test "$browser" = "$EXPECTED_BROWSER_VERSION"
          test "$student" = "$EXPECTED_STUDENT_VERSION"
          echo QUIZ_OWNER_REVIEW_RUNTIME_VERIFY_PASS

      - name: Automatic Quiz-only rollback on failed promotion or verification
        if: always() && env.OLD_VERSION != '' && (steps.promote.outcome != 'success' || steps.verify.outcome != 'success')
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" versions deploy "$OLD_VERSION@100%" --name "$QUIZ_WORKER" --message 'Automatic rollback after owner-review Quiz build failure' -y
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$QUIZ_WORKER" --json > /tmp/secure-quiz-deploy/rollback.json
          jq -e --arg id "$OLD_VERSION" '.versions[] | select(.version_id==$id and .percentage==100)' /tmp/secure-quiz-deploy/rollback.json >/dev/null
          echo QUIZ_OWNER_REVIEW_BUILD_AUTOMATIC_ROLLBACK_PASS

      - name: Close temporary transfer issue
        if: always() && env.TRANSFER_ISSUE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          outcome='${{ steps.verify.outcome }}'
          gh issue comment "$TRANSFER_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Secure transfer job finished. Verification outcome: **${outcome}**. The one-time private key has been destroyed with the runner."
          gh issue close "$TRANSFER_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Require verified owner-review deployment
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.promote.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
          echo QUIZ_OWNER_REVIEW_DEPLOY_COMPLETE
