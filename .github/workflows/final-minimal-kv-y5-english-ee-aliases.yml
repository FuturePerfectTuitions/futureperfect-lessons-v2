name: Final minimal KV - Year 5 English 11+ EE aliases

on:
  push:
    branches: [ops/final-drive-r2-kv-closure-2026-09-06]
    paths:
      - .github/workflows/final-minimal-kv-y5-english-ee-aliases.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API: https://api.cloudflare.com/client/v4
  WORKER_NAME: fpt-portal-v2-worker
  EXPECTED_R2: fpt-materials-dev

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply and verify Year 5 English 11+ EE aliases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.parse,requests
          api='https://api.cloudflare.com/client/v4'; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; auth={'Authorization':f'Bearer {token}'}
          settings=requests.get(f'{api}/accounts/{acct}/workers/scripts/fpt-portal-v2-worker/settings',headers=auth,timeout=60).json(); assert settings.get('success')
          b=settings['result']['bindings']; env=next(x.get('text') for x in b if x.get('name')=='ENVIRONMENT'); bucket=next(x.get('bucket_name') for x in b if x.get('name')=='MATERIALS_R2'); ns=next(x.get('namespace_id') for x in b if x.get('name')=='LESSONS_KV')
          assert env=='development'; assert bucket=='fpt-materials-dev'; assert ns
          base=f'{api}/accounts/{acct}/storage/kv/namespaces/{ns}/values/'
          def u(k): return base+urllib.parse.quote(k,safe='')
          def get(k):
            r=requests.get(u(k),headers=auth,timeout=60); r.raise_for_status(); return r.json()
          def put(k,v):
            r=requests.put(u(k),headers={**auth,'Content-Type':'application/json'},data=json.dumps(v,separators=(',',':')).encode(),timeout=60); r.raise_for_status(); p=r.json(); assert p.get('success'),p
          cur=get('curriculum:ENGLISH_Y5'); ids=cur.get('lessonIds') or []; assert len(ids)==36
          out=[]
          for lid in ids:
            rec=get('lesson:'+lid); assert rec.get('active') is not False
            d=rec.setdefault('displayIds',{}); normal=str(d.get('english-year5') or '').strip()
            m=re.fullmatch(r'(Y5T[123])E(\d{2})',normal); assert m,(lid,normal,d)
            eleven=f'{m.group(1)}EE{m.group(2)}'
            d['english-year5-11plus']=eleven
            put('lesson:'+lid,rec)
            after=get('lesson:'+lid); assert after.get('displayIds',{}).get('english-year5')==normal; assert after.get('displayIds',{}).get('english-year5-11plus')==eleven
            out.append({'lessonId':lid,'normal':normal,'elevenPlus':eleven})
          assert len({x['normal'] for x in out})==36 and len({x['elevenPlus'] for x in out})==36
          json.dump({'environment':env,'count':36,'aliases':out},open('y5-english-ee-aliases.json','w'),indent=2)
          print('Y5_ENGLISH_EE_ALIASES_PASS',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: y5-english-ee-aliases-evidence
          path: y5-english-ee-aliases.json
          retention-days: 30
