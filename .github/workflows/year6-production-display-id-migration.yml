name: Year 6 production display-ID migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/year6-production-display-id-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-prove exact Year 6 boundary before production write
        run: node tests/year6-live-structure-regression.mjs

      - name: Resolve production LESSONS_KV namespace
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/settings.json
          NS="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings.json)"
          test -n "$NS" && test "$NS" != null
          echo "LESSONS_KV_NAMESPACE=$NS" >> "$GITHUB_ENV"
          echo "Resolved production LESSONS_KV namespace: $NS"

      - name: Guarded migration of Year 6 display IDs only
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          mkdir -p /tmp/year6-before
          : >/tmp/year6-changes.tsv

          kvurl() {
            local key="$1" encoded
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            printf '%s/storage/kv/namespaces/%s/values/%s' "$API" "$LESSONS_KV_NAMESPACE" "$encoded"
          }
          migrate_one() {
            local id="$1" target="$2" old_expected="$3"
            local url current
            url="$(kvurl "lesson:$id")"
            curl --fail --silent --show-error "$url" -H "$AUTH" -o "/tmp/year6-before/$id.json"
            jq -e '.displayIds and (.displayIds|type=="object")' "/tmp/year6-before/$id.json" >/dev/null
            current="$(jq -r '.displayIds["maths-year6"] // ""' "/tmp/year6-before/$id.json")"
            if [ "$current" != "$old_expected" ] && [ "$current" != "$target" ]; then
              echo "REFUSING $id: unexpected live display ID '$current' (expected '$old_expected' or idempotent '$target')" >&2
              exit 1
            fi
            if [ "$current" = "$target" ]; then
              printf '%s\t%s\t%s\n' "$id" "$current" "$target" >>/tmp/year6-changes.tsv
              return
            fi
            jq --arg target "$target" '.displayIds["maths-year6"]=$target' "/tmp/year6-before/$id.json" > /tmp/year6-after.json
            jq 'del(.displayIds["maths-year6"])' "/tmp/year6-before/$id.json" > /tmp/before-without.json
            jq 'del(.displayIds["maths-year6"])' /tmp/year6-after.json > /tmp/after-without.json
            diff -u /tmp/before-without.json /tmp/after-without.json
            curl --fail --silent --show-error -X PUT "$url" -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/year6-after.json >/dev/null
            curl --fail --silent --show-error "$url" -H "$AUTH" -o /tmp/year6-reread.json
            test "$(jq -r '.displayIds["maths-year6"] // ""' /tmp/year6-reread.json)" = "$target"
            jq 'del(.displayIds["maths-year6"])' /tmp/year6-reread.json > /tmp/reread-without.json
            diff -u /tmp/before-without.json /tmp/reread-without.json
            printf '%s\t%s\t%s\n' "$id" "$current" "$target" >>/tmp/year6-changes.tsv
          }

          for n in $(seq 22 35); do migrate_one "M3.L$n" "Y6T2M$((n-21))" "Y6T2M$n"; done
          for n in $(seq 1 13); do migrate_one "Y6.EXTRA.L$n" "Y6T3M$n" "Y6T3M$((35+n))"; done

          tar -czf /tmp/year6-before.tgz -C /tmp/year6-before .
          echo "YEAR6_DISPLAY_ID_MIGRATION_RECORDS=$(wc -l </tmp/year6-changes.tsv)"
          cat /tmp/year6-changes.tsv

      - name: Verify production KV sequence
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          : >/tmp/year6-live-sequence.txt
          get_display() {
            local id="$1" encoded
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "lesson:$id")"
            curl --fail --silent --show-error "$API/storage/kv/namespaces/$LESSONS_KV_NAMESPACE/values/$encoded" -H "$AUTH" | jq -r '.displayIds["maths-year6"] // ""'
          }
          for n in $(seq 1 35); do get_display "M3.L$n" >>/tmp/year6-live-sequence.txt; done
          for n in $(seq 1 13); do get_display "Y6.EXTRA.L$n" >>/tmp/year6-live-sequence.txt; done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { expectedYear6StandardDisplaySequence } from './ops/year6-display-id-policy.mjs';
          const actual=fs.readFileSync('/tmp/year6-live-sequence.txt','utf8').trim().split(/\r?\n/);
          const expected=expectedYear6StandardDisplaySequence();
          assert.deepEqual(actual, expected, 'Production KV sequence must match the canonical 48-lesson Year 6 sequence');
          const i=actual.indexOf('Y6T1M21');
          assert.equal(actual[i+1], 'Y6T2M1');
          assert.equal(actual[35], 'Y6T3M1');
          console.log(`PRODUCTION_KV_BOUNDARY=${actual[i]} -> ${actual[i+1]}`);
          console.log(`PRODUCTION_KV_TERM3_START=${actual[35]}`);
          console.log(`PRODUCTION_KV_STANDARD_COUNT=${actual.length}`);
          NODE

      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year6-display-id-migration-evidence
          path: |
            /tmp/year6-before.tgz
            /tmp/year6-changes.tsv
            /tmp/year6-live-sequence.txt
          if-no-files-found: ignore
          retention-days: 30
