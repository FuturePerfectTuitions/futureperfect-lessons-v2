name: Incident - Entitlement Repair Final Read-only Observer

on:
  push:
    branches:
      - incident/entitlement-audit-2026-09-15
    paths:
      - 'docs/rebuild/INCIDENT_ENTITLEMENT_FINAL_OBSERVER_TRIGGER.md'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_BASE: https://lessons.futureperfect.education
  PROD_HOST: lessons.futureperfect.education
  LEGACY_WORKER: fpt-portal-v2-worker
  BROWSER_WORKER: fpt-portal-v2-rebuild-browser-prod
  STUDENT_WORKER: fpt-portal-v2-rebuild-student-prod
  EXPECTED_LEGACY_VERSION: 2eec1f4d-daec-4d40-be55-b779852ddfb2
  ROLLBACK_LEGACY_VERSION: b1c8326e-a9cc-4150-b43b-cc572a4404c1
  EXPECTED_BROWSER_VERSION: 67880177-1328-46dd-a228-47ba245e33ae
  EXPECTED_STUDENT_VERSION: 32467053-f348-449c-a2ae-1dae9688b446
  EXPECTED_LESSONS_KV: 49619b1a24b244bc8aaa6223fcd24e80
  EXPECTED_READ_MODELS_KV: 77b35165c8694087bc1b0515c35a7e89
  EXPECTED_STUDENTS_KV: c9723c8806334e4ea54d1b456d31b794
  EXPECTED_D1: 97250a54-fa91-45ad-a002-3c4566b1fc38
  EXPECTED_R2: fpt-materials-dev
  PATCH_COMMIT: 9b60be6e8d5f586a1abf16fefc56e2f5f9aec774
  AS_OF_DATE: '2026-09-15'

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: incident/entitlement-audit-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Source recurrence-fix and regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$PATCH_COMMIT" HEAD
          node --check worker/src/admin-lesson-release-import.js
          node tests/admin-lesson-release-import-verification.mjs
          node tests/admin-lesson-release-y6-sats-verification.mjs
          node tests/lesson-release-navigation-verification.mjs
          node tests/admin-import-auto-process-static-verification.mjs
          node tests/admin-import-manual-email-verification.mjs
          node tests/parent-email-import-verification.mjs
          node tests/parent-email-idempotency-verification.mjs
          node tests/parent-email-completed-status-verification.mjs
          node tests/parent-email-test-routing-verification.mjs
          grep -Fq "clean(validation.batch?.stream).toLowerCase() === '11plus' ? 1 : 0" worker/src/admin-lesson-release-import.js
          grep -Fq 'WHEN lesson_entitlements.vr_access = 1 OR excluded.vr_access = 1 THEN 1' worker/src/admin-lesson-release-import.js
          ! grep -Fq 'validation.student?.vrEligible === true ? 1 : 0' worker/src/admin-lesson-release-import.js
          jq -n --arg sha "$GITHUB_SHA" --arg patch "$PATCH_COMMIT" '{marker:"INCIDENT_ENTITLEMENT_SOURCE_GATE_PASS",status:"PASS",readOnly:true,sha:$sha,patchCommit:$patch}' | tee /tmp/incident-source.json

      - name: Independent semantic and roster-backed entitlement audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/incident-entitlement-semantic-audit-v2.mjs >/tmp/incident-semantic.log
          cp /tmp/entitlement-semantic-audit.json /tmp/incident-semantic.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/incident-semantic.json','utf8'));
          if(r.status!=='PASS'||Number(r?.semanticUnderEntitlements?.currentRows||0)!==0) throw new Error(`Semantic entitlement audit failed: ${r.status}`);
          if(r?.target?.portalUserId!=='dha2806'||r?.target?.storedEntitlement?.vr!==true||r?.target?.profileVrEligible!==true) throw new Error('Dha entitlement/profile repair invariant failed');
          if(Number(r?.target?.lesson?.preLessonCount||0)!==0||Number(r?.target?.lesson?.vrHomeworkCount||0)<1) throw new Error('Y4E1 resource repair invariant failed');
          NODE

          roster_rc=0
          node scripts/incident-roster-entitlement-audit.mjs >/tmp/incident-roster.log || roster_rc=$?
          cp /tmp/roster-entitlement-audit.json /tmp/incident-roster.json
          ROSTER_RC="$roster_rc" node --input-type=module <<'NODE'
          import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('/tmp/incident-roster.json','utf8')),d=r.defects||{};
          for(const k of ['configProblems','entitlementRows','profileProblems','sourceBatchVrProblems']) if((d[k]||[]).length) throw new Error(`Roster-backed critical defect remains in ${k}`);
          if((d.assignmentProblems||[]).length!==21) throw new Error(`Deferred assignment drift changed: ${(d.assignmentProblems||[]).length}`);
          const out={marker:'INCIDENT_ENTITLEMENT_ROSTER_GATE_PASS',status:'PASS_WITH_ASSIGNMENT_DRIFT_DEFERRED',readOnly:true,rosterExitCode:Number(process.env.ROSTER_RC||0),assignmentProblemsDeferred:(d.assignmentProblems||[]).length,criticalDefects:0};
          fs.writeFileSync('/tmp/incident-roster-gate.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out));
          NODE

      - name: Full current-source production read-model oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compileLessonDetail } from './rebuild/adminops/src/lib/compiler.mjs';
          import { stableStringify, versionKey } from './rebuild/adminops/src/lib/atomic-publisher.mjs';
          const clean=v=>String(v??'').trim(), account=clean(process.env.CLOUDFLARE_ACCOUNT_ID), token=clean(process.env.CLOUDFLARE_API_TOKEN), lessons=clean(process.env.EXPECTED_LESSONS_KV), read=clean(process.env.EXPECTED_READ_MODELS_KV);
          if(!account||!token||!lessons||!read) throw new Error('Protected production read configuration incomplete');
          const api=`https://api.cloudflare.com/client/v4/accounts/${account}`,headers={Authorization:`Bearer ${token}`};
          async function kvText(ns,key){const r=await fetch(`${api}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`,{headers});if(r.status===404)return null;if(!r.ok)throw new Error(`KV read ${r.status}:${key}`);return r.text();}
          async function kvJson(ns,key){const t=await kvText(ns,key);return t==null?null:JSON.parse(t);}
          async function list(ns,prefix){let cursor='',out=[];do{const q=new URLSearchParams({prefix,limit:'1000'});if(cursor)q.set('cursor',cursor);const r=await fetch(`${api}/storage/kv/namespaces/${ns}/keys?${q}`,{headers});const b=await r.json();if(!r.ok||b.success!==true)throw new Error(`KV list failed:${prefix}`);out.push(...(b.result||[]).map(x=>clean(x.name)).filter(Boolean));cursor=clean(b.result_info?.cursor);}while(cursor);return out;}
          const keys=(await list(read,'rm:v1:scope:lesson_3A')).filter(k=>k.endsWith(':current')).sort();if(keys.length!==372)throw new Error(`Expected 372 lesson scopes, found ${keys.length}`);
          let mismatches=0,totalResources=0,core=0,eleven=0,vr=0;const errors=[];
          async function check(key){const pointer=await kvJson(read,key),scope=clean(pointer?.scope),ver=clean(pointer?.current?.version);if(!scope.startsWith('lesson:')||!ver)throw new Error(`Malformed pointer:${key}`);const lessonId=scope.slice(7),source=await kvJson(lessons,`lesson:${lessonId}`),envelope=await kvJson(read,versionKey(scope,ver));if(!source?.lessonId||!envelope?.payload)throw new Error(`Missing source/payload:${scope}`);const candidate=await compileLessonDetail(source,{resourceExists:async()=>true});if(stableStringify(candidate)!==stableStringify(envelope.payload)){mismatches++;errors.push(scope);}for(const row of candidate.resources||[]){totalResources++;const g=clean(row.presentationGroup);if(g.startsWith('vr-'))vr++;else if(g.startsWith('elevenplus-'))eleven++;else if(g.startsWith('core-'))core++;}}
          for(let i=0;i<keys.length;i+=12)await Promise.all(keys.slice(i,i+12).map(check));
          if(mismatches!==0)throw new Error(`Read-model mismatches ${mismatches}: ${errors.slice(0,8).join(',')}`);
          const report={marker:'INCIDENT_ENTITLEMENT_READ_MODEL_ORACLE_PASS',status:'PASS',readOnly:true,lessonScopes:keys.length,resourceMismatchCount:mismatches,totalResources,coreResources:core,elevenPlusResources:eleven,vrResources:vr};fs.writeFileSync('/tmp/incident-oracle.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          NODE

      - name: Authoritative topology versions bindings and rollback retention
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,legacy=process.env.LEGACY_WORKER,browser=process.env.BROWSER_WORKER,student=process.env.STUDENT_WORKER,host=process.env.PROD_HOST,target=process.env.EXPECTED_LEGACY_VERSION,rollback=process.env.ROLLBACK_LEGACY_VERSION;
          const base='https://api.cloudflare.com/client/v4',headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(base+path,{headers});const j=await r.json();if(!r.ok||j.success!==true)throw new Error(`${r.status} ${path}: ${JSON.stringify(j.errors||[])}`);return j.result;}
          async function settings(name){return cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/settings`);}
          async function active(name){const x=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(name)}/deployments`),ds=Array.isArray(x?.deployments)?x.deployments:Array.isArray(x)?x:[],vs=Array.isArray(ds[0]?.versions)?ds[0].versions:[];return String((vs.find(v=>Number(v.percentage||0)===100)||vs[0])?.version_id||'');}
          const zones=await cf(`/zones?per_page=50&account.id=${encodeURIComponent(account)}`),zone=zones.filter(z=>host===z.name||host.endsWith('.'+z.name)).sort((a,b)=>b.name.length-a.name.length)[0];if(!zone)throw new Error('Production zone unresolved');
          const routes=await cf(`/zones/${zone.id}/workers/routes`),hr=routes.filter(r=>String(r.pattern||'').toLowerCase().includes(host.toLowerCase()));if(hr.length!==1||String(hr[0].pattern).toLowerCase()!==`${host.toLowerCase()}/*`||hr[0].script!==browser)throw new Error(`Public route drift ${JSON.stringify(hr)}`);
          const bs=await settings(browser),svc=(bs.bindings||[]).filter(b=>b.type==='service');if(svc.length!==1||svc[0].service!==student)throw new Error(`Browser service drift ${JSON.stringify(svc)}`);if((bs.bindings||[]).some(b=>/admin/i.test(`${b.name||''} ${b.service||''}`)))throw new Error('Forbidden Browser Admin binding');
          const browserVersion=await active(browser),studentVersion=await active(student),legacyVersion=await active(legacy);if(browserVersion!==process.env.EXPECTED_BROWSER_VERSION)throw new Error(`Browser version drift ${browserVersion}`);if(studentVersion!==process.env.EXPECTED_STUDENT_VERSION)throw new Error(`Student version drift ${studentVersion}`);if(legacyVersion!==target)throw new Error(`Incident importer Worker is not active: ${legacyVersion}`);
          const ss=await settings(student);const find=(arr,n)=>arr.find(b=>b.name===n);if((ss.bindings||[]).filter(b=>b.type==='service').length)throw new Error('Student Worker gained service binding');if((find(ss.bindings||[],'READ_MODELS_KV')?.namespace_id||'')!==process.env.EXPECTED_READ_MODELS_KV)throw new Error('Student read-model KV drift');if((find(ss.bindings||[],'STUDENTS_KV')?.namespace_id||'')!==process.env.EXPECTED_STUDENTS_KV)throw new Error('Student profiles KV drift');if((find(ss.bindings||[],'DB')?.id||find(ss.bindings||[],'DB')?.database_id||'')!==process.env.EXPECTED_D1)throw new Error('Student D1 drift');if((find(ss.bindings||[],'MATERIALS_R2')?.bucket_name||'')!==process.env.EXPECTED_R2)throw new Error('Student R2 drift');
          const ls=await settings(legacy);if((find(ls.bindings||[],'LESSONS_KV')?.namespace_id||'')!==process.env.EXPECTED_LESSONS_KV||(find(ls.bindings||[],'STUDENTS_KV')?.namespace_id||'')!==process.env.EXPECTED_STUDENTS_KV)throw new Error('Legacy importer KV binding drift');
          const versionList=await cf(`/accounts/${account}/workers/scripts/${encodeURIComponent(legacy)}/versions`),versions=Array.isArray(versionList?.items)?versionList.items:Array.isArray(versionList)?versionList:[];if(!versions.some(v=>String(v.id||v.version_id||'')===rollback))throw new Error('Legacy rollback version not retained');
          const report={marker:'INCIDENT_ENTITLEMENT_TOPOLOGY_PASS',status:'PASS',readOnly:true,route:{pattern:hr[0].pattern,script:hr[0].script},browserVersion,studentVersion,legacyVersion,rollbackLegacyVersionRetained:true,browserToAdminOps:false,studentServiceBindings:0};fs.writeFileSync('/tmp/incident-topology.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report));
          NODE

      - name: Public authenticated portal smoke and importer security boundary
        shell: bash
        env:
          STUDENTS_KV_ID: ${{ env.EXPECTED_STUDENTS_KV }}
          SMOKE_BASE_URL: https://lessons.futureperfect.education
          SMOKE_PHASE: incident-entitlement-final-observer
          EXPECT_ADMIN_STATUS: '200'
          SMOKE_OUTPUT: /tmp/incident-authenticated-smoke.json
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$PROD_BASE/" -o /tmp/incident-public-root.html
          grep -F 'Future Perfect' /tmp/incident-public-root.html >/dev/null
          code="$(curl --silent --show-error -D /tmp/incident-public-api.headers -o /tmp/incident-public-api.json --write-out '%{http_code}' "$PROD_BASE/api/v2/student/home" || true)"; test "$code" = '401'; grep -i '^x-fpt-cp9-browser-facade: service-binding' /tmp/incident-public-api.headers >/dev/null
          node scripts/rebuild-cp12-admin-incident-auth-smoke.mjs
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'; ORIGIN="$PROD_BASE"
          code="$(curl --silent --show-error --output /tmp/incident-import-login-negative.json --write-out '%{http_code}' --header "Origin: $ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"password":"__deliberately_wrong__"}' "$BASE/api/v1/admin/lesson-releases/login")"; test "$code" = '401'; jq -e '.error=="UNAUTHORISED"' /tmp/incident-import-login-negative.json >/dev/null
          code="$(curl --silent --show-error --output /tmp/incident-import-preview-negative.json --write-out '%{http_code}' --header "Origin: $ORIGIN" --header 'Content-Type: application/json' --request POST --data '{"rows":[]}' "$BASE/api/v1/admin/lesson-releases/preview")"; test "$code" = '401'; jq -e '.error=="UNAUTHORISED"' /tmp/incident-import-preview-negative.json >/dev/null

      - name: Produce final incident observer summary
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --slurpfile source /tmp/incident-source.json --slurpfile semantic /tmp/incident-semantic.json --slurpfile roster /tmp/incident-roster-gate.json --slurpfile oracle /tmp/incident-oracle.json --slurpfile topo /tmp/incident-topology.json --slurpfile auth /tmp/incident-authenticated-smoke.json --arg sha "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg observedAt "$(date -u +%FT%TZ)" '{marker:"INCIDENT_ENTITLEMENT_FINAL_OBSERVER_PASS",status:"PASS",readOnly:true,sha:$sha,runId:$runId,observedAt:$observedAt,source:$source[0],semantic:{status:$semantic[0].status,currentUnderEntitlements:$semantic[0].semanticUnderEntitlements.currentRows,target:$semantic[0].target},roster:$roster[0],oracle:$oracle[0],topology:$topo[0],authenticatedSmoke:$auth[0],incidentClosedReady:true}' | tee /tmp/incident-final-observer.json

      - name: Upload final observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: incident-entitlement-final-observer-2026-09-15
          path: |
            /tmp/incident-final-observer.json
            /tmp/incident-source.json
            /tmp/incident-semantic.json
            /tmp/incident-roster.json
            /tmp/incident-roster-gate.json
            /tmp/incident-oracle.json
            /tmp/incident-topology.json
            /tmp/incident-authenticated-smoke.json
            /tmp/incident-import-login-negative.json
            /tmp/incident-import-preview-negative.json
          if-no-files-found: error
          retention-days: 30
