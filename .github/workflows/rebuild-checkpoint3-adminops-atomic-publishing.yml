name: Rebuild Checkpoint 3 AdminOps atomic publishing

# Checkpoint 3 passed on run 34759399085 at branch head
# b0d86ad0607d232a1204458052308a2dc3f29aff. Keep the verification
# workflow available for deliberate historical re-runs, but do not let later
# checkpoint changes to the shared AdminOps runtime re-trigger a stale gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-v2-rebuild-checkpoint3-adminops-atomic-publishing
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  PROD_WORKER: fpt-portal-v2-worker
  EXPECTED_PROD_DEPLOYMENT: b803da70-766c-4a16-a4aa-c8bc238d3e77
  EXPECTED_PROD_VERSION: 971509f0-ce1e-4b27-8e8d-0d96a64cfa50
  LESSONS_KV_NAMESPACE_ID: 49619b1a24b244bc8aaa6223fcd24e80
  READ_MODELS_KV_TITLE: FPT_PORTAL_V2_REBUILD_READ_MODELS_STAGING
  ADMINOPS_STAGING_WORKER: fpt-portal-v2-rebuild-adminops-staging
  WORKERS_SUBDOMAIN: futureperfectlessons

jobs:
  historical-gate:
    name: Historical Checkpoint 3 gate (manual only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b0d86ad0607d232a1204458052308a2dc3f29aff
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Re-run immutable Checkpoint 3 semantic tests
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'b0d86ad0607d232a1204458052308a2dc3f29aff'
          node tests/rebuild-checkpoint3-atomic-publishing.mjs | tee /tmp/checkpoint3-tests.log
          grep -Fq 'REBUILD_CHECKPOINT3_ATOMIC_PUBLISHING_PASS' /tmp/checkpoint3-tests.log
          echo 'REBUILD_CHECKPOINT3_HISTORICAL_RERUN_PASS'
