name: Login password shape diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-password-shape-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Validate login password field shapes without exposing values
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings.json
          STUDENTS_ID="$(jq -r '[.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id][0] // ""' /tmp/settings.json)"
          test -n "$STUDENTS_ID"
          curl --fail --silent --show-error -G "$API/storage/kv/namespaces/${STUDENTS_ID}/keys" -H "$AUTH" --data-urlencode 'prefix=user:' --data-urlencode 'limit=1000' -o /tmp/keys.json
          jq -r '.result[].name' /tmp/keys.json >/tmp/keynames.txt

          total=0; missing=0; invalid=0; valid=0; admin_valid=no
          while IFS= read -r key; do
            total=$((total+1))
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$key")"
            curl --fail --silent --show-error "$API/storage/kv/namespaces/${STUDENTS_ID}/values/${encoded}" -H "$AUTH" -o /tmp/user.json
            p="$(jq -r '.p // ""' /tmp/user.json)"
            if [ -z "$p" ]; then
              missing=$((missing+1)); ok=no
            elif [ "${#p}" -eq 4 ] && printf '%s' "$p" | grep -q '[A-Z]' && printf '%s' "$p" | grep -q '[a-z]' && printf '%s' "$p" | grep -q '[0-9]'; then
              valid=$((valid+1)); ok=yes
            else
              invalid=$((invalid+1)); ok=no
            fi
            if [ "$key" = 'user:admin' ]; then admin_valid="$ok"; fi
          done </tmp/keynames.txt

          echo "TOTAL_USERS=$total"
          echo "VALID_LOGIN_PASSWORD_FIELDS=$valid"
          echo "MISSING_LOGIN_PASSWORD_FIELDS=$missing"
          echo "INVALID_LOGIN_PASSWORD_FIELDS=$invalid"
          echo "ADMIN_LOGIN_PASSWORD_FIELD_VALID=$admin_valid"
