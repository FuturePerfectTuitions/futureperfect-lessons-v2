name: Preserve exact live browser Worker source

on:
  push:
    branches:
      - ops/purge-lessons-cache-20261002
    paths:
      - '.github/workflows/preserve-live-browser-worker-source-20261002.yml'

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-rebuild-browser-prod
      EXPECTED_INDEX_SHA256: 2257d56c5cd930dacfefa00f310eb5f9bc2db6cd18e3ebf16fb7d8c4ad4c3cbd
    steps:
      - name: Check out exact ops branch
        uses: actions/checkout@v4
        with:
          ref: ops/purge-lessons-cache-20261002
          fetch-depth: 0

      - name: Recover exact deployed index.js
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl --fail --silent --show-error             --dump-header /tmp/package.headers             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"             "${AUTH[@]}"             -o /tmp/package.bin

          mkdir -p ops/live-browser-worker-prod
          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          import hashlib,re,pathlib,os
          headers=pathlib.Path('/tmp/package.headers').read_text('latin-1',errors='replace')
          body=pathlib.Path('/tmp/package.bin').read_bytes()
          m=re.search(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          if not m:
              raise SystemExit('missing package content-type')
          ct=m.group(1).strip()
          msg=BytesParser(policy=default).parsebytes(
              ('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+body
          )
          data=None
          for p in msg.iter_parts():
              name=p.get_filename() or p.get_param('name',header='content-disposition') or p.get_param('name')
              if name=='index.js':
                  data=p.get_payload(decode=True) or b''
                  break
          if data is None:
              raise SystemExit('deployed index.js not found')
          digest=hashlib.sha256(data).hexdigest()
          expected=os.environ['EXPECTED_INDEX_SHA256']
          print('Recovered index.js SHA256:',digest)
          if digest != expected:
              raise SystemExit(f'unexpected index.js hash: {digest}')
          pathlib.Path('ops/live-browser-worker-prod/index.js').write_bytes(data)
          PY

          cat > ops/live-browser-worker-prod/PROVENANCE.md <<'EOF'
          # Live browser Worker provenance

          Production script: `fpt-portal-v2-rebuild-browser-prod`

          Recovered read-only from the deployed Cloudflare Worker package on 2026-10-02 before the Year 6 nested-navigation asset repair.

          Preserved runtime module SHA-256:

          `2257d56c5cd930dacfefa00f310eb5f9bc2db6cd18e3ebf16fb7d8c4ad4c3cbd`

          Production bindings observed at recovery:
          - `ASSETS`: Workers static-assets binding.
          - `STAGING_API`: service binding to `fpt-portal-v2-rebuild-student-prod`, environment `production`.

          Production route observed at recovery:
          - `lessons.futureperfect.education/*` -> `fpt-portal-v2-rebuild-browser-prod`.

          The runtime source is preserved byte-for-byte so frontend asset deployments do not need to reinterpret or replace the edge/API proxy logic.
          EOF

      - name: Verify recovered source
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum ops/live-browser-worker-prod/index.js | awk '{print $1}')" = "$EXPECTED_INDEX_SHA256"
          grep -Fq 'env.STAGING_API.fetch' ops/live-browser-worker-prod/index.js
          grep -Fq 'env.ASSETS.fetch' ops/live-browser-worker-prod/index.js

      - name: Commit preserved source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add ops/live-browser-worker-prod/index.js ops/live-browser-worker-prod/PROVENANCE.md
          if git diff --cached --quiet; then
            echo 'Exact browser Worker source already preserved.'
            exit 0
          fi
          git commit -m 'Preserve exact live browser Worker source'
          git push origin HEAD:ops/purge-lessons-cache-20261002
