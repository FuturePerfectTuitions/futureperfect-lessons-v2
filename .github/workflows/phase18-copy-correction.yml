name: Phase 18 copy correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase18-copy-correction.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Worker copy and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/src/index-phase18-online-prelesson.js')
          s = p.read_text(encoding='utf-8')
          old = 'Only PreLesson Sheets available to download and print. Other resources will be unlocked once the lesson starts.'
          new = 'Only PreLesson Sheets available to download and print. Other resources will be unlocked once the lesson is marked Completed.'
          if old not in s:
              raise SystemExit('Expected old wording not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          grep -Fq 'Other resources will be unlocked once the lesson is marked Completed.' worker/src/index-phase18-online-prelesson.js
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add worker/src/index-phase18-online-prelesson.js
          git commit -m 'Clarify full access requires Completed status'
          git push origin HEAD:main
