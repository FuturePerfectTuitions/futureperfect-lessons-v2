name: Post-Step-10 family depth inventory

on:
  push:
    branches:
      - mastery/step10-gate-e-frontend-2026-09-18
    paths:
      - '.github/workflows/post-step10-family-depth-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-step10-family-depth-inventory
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice
  QUIZ_D1_ID: 5b988d3d-341a-492d-8e40-8d4efa66150e

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"

      - name: Query non-sensitive family aggregates only
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/family-depth-wrangler.toml <<TOML
          name = "post-step10-family-depth-readonly"
          compatibility_date = "2026-09-18"
          [[d1_databases]]
          binding = "DB"
          database_name = "${QUIZ_D1_NAME}"
          database_id = "${QUIZ_D1_ID}"
          TOML

          q(){ npx wrangler d1 execute "$QUIZ_D1_NAME" --remote --config /tmp/family-depth-wrangler.toml --command "$1" --json; }

          q "SELECT difficulty_band, COUNT(*) AS n FROM question_instance WHERE lifecycle_status='Live' GROUP BY difficulty_band ORDER BY difficulty_band;" > /tmp/difficulty_totals.json

          q "WITH qi AS (SELECT family_id, COUNT(*) AS live_count, SUM(CASE WHEN UPPER(difficulty_band)='FOUNDATION' THEN 1 ELSE 0 END) AS foundation_count, SUM(CASE WHEN UPPER(difficulty_band)='CORE' THEN 1 ELSE 0 END) AS core_count, SUM(CASE WHEN UPPER(difficulty_band)='CHALLENGE' THEN 1 ELSE 0 END) AS challenge_count, COUNT(DISTINCT presentation_type) AS presentation_type_count, SUM(CASE WHEN UPPER(COALESCE(diagram_type,'')) NOT IN ('','NONE','NO','N/A','NA') THEN 1 ELSE 0 END) AS visual_count, COUNT(DISTINCT CASE WHEN UPPER(COALESCE(diagram_type,'')) NOT IN ('','NONE','NO','N/A','NA') THEN diagram_type END) AS visual_type_count FROM question_instance WHERE lifecycle_status='Live' GROUP BY family_id), ev AS (SELECT family_id, COUNT(DISTINCT golden_source_id) AS evidence_source_count FROM gl_evidence_link WHERE family_id IS NOT NULL GROUP BY family_id) SELECT qf.family_id,qf.topic,qf.family_name,qf.primary_skill_id,qf.source_count,qf.earliest_release_point,qf.question_level_override_needed,CASE WHEN qf.generator_rules_json IS NOT NULL AND LENGTH(TRIM(qf.generator_rules_json))>2 THEN 1 ELSE 0 END AS generator_rules_present,CASE WHEN qf.gl_method_signature IS NOT NULL AND LENGTH(TRIM(qf.gl_method_signature))>0 THEN 1 ELSE 0 END AS gl_method_signature_present,COALESCE(qi.live_count,0) AS live_count,COALESCE(qi.foundation_count,0) AS foundation_count,COALESCE(qi.core_count,0) AS core_count,COALESCE(qi.challenge_count,0) AS challenge_count,COALESCE(qi.presentation_type_count,0) AS presentation_type_count,COALESCE(qi.visual_count,0) AS visual_count,COALESCE(qi.visual_type_count,0) AS visual_type_count,COALESCE(ev.evidence_source_count,0) AS evidence_source_count FROM question_family qf LEFT JOIN qi ON qi.family_id=qf.family_id LEFT JOIN ev ON ev.family_id=qf.family_id WHERE qf.family_wide_eligible=1 AND qf.status='ELIGIBLE' AND qf.evidence_gate_status='PASS' ORDER BY live_count ASC,qf.family_id;" > /tmp/families.json

          q "SELECT corpus_series, COUNT(*) AS source_question_count FROM gl_source_question GROUP BY corpus_series ORDER BY source_question_count DESC, corpus_series;" > /tmp/source_series.json

          q "SELECT e.family_id,s.corpus_series,COUNT(DISTINCT e.golden_source_id) AS linked_source_count FROM gl_evidence_link e JOIN gl_source_question s ON s.golden_source_id=e.golden_source_id JOIN question_family qf ON qf.family_id=e.family_id WHERE e.family_id IS NOT NULL AND qf.family_wide_eligible=1 AND qf.status='ELIGIBLE' AND qf.evidence_gate_status='PASS' GROUP BY e.family_id,s.corpus_series ORDER BY e.family_id,s.corpus_series;" > /tmp/family_series.json

          python3 - <<'PY'
          import json,csv
          from pathlib import Path

          def rows(path):
              data=json.loads(Path(path).read_text())
              if not data or not isinstance(data,list): raise SystemExit(f'Bad D1 JSON {path}')
              return data[0].get('results',[])

          families=rows('/tmp/families.json')
          diff=rows('/tmp/difficulty_totals.json')
          series=rows('/tmp/source_series.json')
          fseries=rows('/tmp/family_series.json')
          if len(families)!=91: raise SystemExit(f'Expected 91 eligible families, found {len(families)}')
          if sum(int(r['live_count']) for r in families)!=714: raise SystemExit('Family live counts do not sum to 714')

          per={r['family_id']:{} for r in families}
          for r in fseries:
              per.setdefault(r['family_id'],{})[r['corpus_series']]=int(r['linked_source_count'])
          series_names=[r['corpus_series'] for r in series]

          fields=['family_id','topic','family_name','primary_skill_id','source_count','earliest_release_point','question_level_override_needed','generator_rules_present','gl_method_signature_present','live_count','foundation_count','core_count','challenge_count','presentation_type_count','visual_count','visual_type_count','evidence_source_count'] + [f'series::{s}' for s in series_names]
          with open('/tmp/post_step10_family_depth_inventory.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for r in families:
                  out=dict(r)
                  for s in series_names: out[f'series::{s}']=per.get(r['family_id'],{}).get(s,0)
                  w.writerow(out)

          summary={
              'marker':'POST_STEP10_FAMILY_DEPTH_INVENTORY_PASS',
              'eligible_family_count':len(families),
              'live_question_count':sum(int(r['live_count']) for r in families),
              'difficulty_totals':diff,
              'source_series':series,
              'min_live_per_family':min(int(r['live_count']) for r in families),
              'max_live_per_family':max(int(r['live_count']) for r in families),
              'median_live_per_family':sorted(int(r['live_count']) for r in families)[len(families)//2],
              'families_under_5':sum(int(r['live_count'])<5 for r in families),
              'families_under_8':sum(int(r['live_count'])<8 for r in families),
              'families_under_10':sum(int(r['live_count'])<10 for r in families),
              'families_missing_foundation':sum(int(r['foundation_count'])==0 for r in families),
              'families_missing_core':sum(int(r['core_count'])==0 for r in families),
              'families_missing_challenge':sum(int(r['challenge_count'])==0 for r in families),
              'families_with_visuals':sum(int(r['visual_count'])>0 for r in families),
          }
          Path('/tmp/post_step10_family_depth_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          print('--- SHALLOWEST 20 FAMILIES ---')
          for r in families[:20]:
              print(json.dumps({k:r[k] for k in ['family_id','topic','family_name','live_count','foundation_count','core_count','challenge_count','presentation_type_count','visual_count','evidence_source_count']},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: post-step10-family-depth-inventory
          path: |
            /tmp/post_step10_family_depth_inventory.csv
            /tmp/post_step10_family_depth_summary.json
          retention-days: 90
