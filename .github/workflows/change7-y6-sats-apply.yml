name: Change 7 Year 6 SATs apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change7-y6-sats-apply.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight and update Year 6 SATS aliases
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/settings-before.json
          jq -e '.success==true' /tmp/settings-before.json >/dev/null
          LESSONS_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings-before.json)"
          test -n "$LESSONS_ID"
          export LESSONS_ID
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ns = process.env.LESSONS_ID;
          const api = 'https://api.cloudflare.com/client/v4';
          const keys = Array.from({length:19}, (_,i)=>`lesson:Y6M${51+i}`);
          const headers = {Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path, init={}) {
            const r = await fetch(`${api}${path}`, {...init, headers:{...headers,...(init.headers||{})}});
            const j = await r.json();
            if (!r.ok || !j.success) throw new Error(`Cloudflare ${path} HTTP ${r.status}`);
            return j;
          }
          const got = await cf(`/accounts/${accountId}/storage/kv/namespaces/${ns}/bulk/get`, {
            method:'POST', body:JSON.stringify({keys,type:'text',withMetadata:false})
          });
          const values = got.result?.values || {};
          if (Object.keys(values).length !== 19) throw new Error('Expected all 19 existing SATS canonical records');
          await import('node:fs').then(fs=>fs.writeFileSync('/tmp/change7-kv-backup.json', JSON.stringify(values), {mode:0o600}));
          const exactPre = {
            1:['Y6MS1 PreLesson Sheets SATs Preparation Measurement.pdf'],
            7:['Y6MS7 PreLesson Sheet SATs Preparation Position and Direction.pdf'],
            9:['Y6MS9 PreLesson Sheet SATs Preparation Ratio and Proportion.pdf'],
            10:['Y6MS10 PreLesson Sheet SATs Preparation Statistics.pdf'],
            18:['Y6MS18 PreLesson Sheet SATs Reasoning Focus.pdf','Y6MS18 Guidance for PreLesson Sheet SATs Reasoning Focus.pdf']
          };
          const pairs=[];
          for (let n=1;n<=19;n++) {
            const key=`lesson:Y6M${50+n}`;
            const rec=JSON.parse(values[key]);
            if (rec.lessonId !== `Y6M${50+n}` || rec.active === false || rec.subject !== 'maths') throw new Error(`Unexpected canonical record ${key}`);
            const oldAlias=String(rec.displayIds?.['maths-year6']||'');
            if (![ `Y6M${n}`, `Y6MS${n}` ].includes(oldAlias)) throw new Error(`Unexpected Year 6 alias ${oldAlias} for ${key}`);
            rec.displayIds={...(rec.displayIds||{}),'maths-year6':`Y6MS${n}`};
            const replaceDisplay = obj => {
              if (!obj || typeof obj !== 'object') return;
              if (typeof obj.displayName === 'string') {
                const re=new RegExp(`^Y6M${n}(?=\\s)`,'i');
                obj.displayName=obj.displayName.replace(re,`Y6MS${n}`);
              }
              for (const value of Object.values(obj)) {
                if (Array.isArray(value)) value.forEach(replaceDisplay);
                else if (value && typeof value === 'object') replaceDisplay(value);
              }
            };
            replaceDisplay(rec.core);
            replaceDisplay(rec.phase11Resources);
            replaceDisplay(rec.phase11OtherResources);
            if (exactPre[n]) {
              const sheets=Array.isArray(rec.core?.preLessonSheets)?rec.core.preLessonSheets:[];
              if (sheets.length !== exactPre[n].length) throw new Error(`Drive/portal PreLesson count mismatch for Y6MS${n}`);
              sheets.forEach((sheet,i)=>{sheet.displayName=exactPre[n][i];});
            }
            pairs.push({key,value:JSON.stringify(rec)});
          }
          const put=await cf(`/accounts/${accountId}/storage/kv/namespaces/${ns}/bulk`, {method:'PUT',body:JSON.stringify(pairs)});
          if ((put.result?.unsuccessful_keys||[]).length) throw new Error('KV update reported unsuccessful keys');
          const curriculum=await cf(`/accounts/${accountId}/storage/kv/namespaces/${ns}/bulk/get`, {
            method:'POST',body:JSON.stringify({keys:['curriculum:MATHS_Y6_EXTRA'],type:'text',withMetadata:false})
          });
          const c=JSON.parse(curriculum.result.values['curriculum:MATHS_Y6_EXTRA']);
          const expected=Array.from({length:19},(_,i)=>`Y6M${51+i}`);
          if (JSON.stringify(c.lessonIds.slice(-19))!==JSON.stringify(expected)) throw new Error('SATS canonical sequence is not at the end of Year 6 Maths');
          console.log('CHANGE7_KV_WRITE_PASS aliases=Y6MS1-Y6MS19 canonical=Y6M51-Y6M69 order=end');
          NODE

      - name: Deploy Change 7 Worker wrapper
        env:
          DEPLOY_MESSAGE: 'Change 7 Year 6 SATS aliases and sync resolver'
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh

      - name: Verify production Change 7
        shell: bash
        run: |
          set -euo pipefail
          node -e "import('./worker/src/index-phase20-change7.js').then(m=>{for(let n=1;n<=19;n++){if(m.canonicalLessonId('Y6MS'+n)!=='Y6M'+(50+n))process.exit(1)}; console.log('CHANGE7_ALIAS_RESOLVER_STATIC_PASS')})"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/settings-after.json
          jq -e '.success==true' /tmp/settings-after.json >/dev/null
          LESSONS_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings-after.json)"
          export LESSONS_ID
          node <<'NODE'
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, ns=process.env.LESSONS_ID;
          const keys=Array.from({length:19},(_,i)=>`lesson:Y6M${51+i}`);
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces/${ns}/bulk/get`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({keys,type:'text',withMetadata:false})});
          const j=await r.json(); if(!r.ok||!j.success) throw new Error('KV readback failed');
          for(let n=1;n<=19;n++){
            const rec=JSON.parse(j.result.values[`lesson:Y6M${50+n}`]);
            if(rec.displayIds?.['maths-year6']!==`Y6MS${n}`) throw new Error(`Alias verification failed Y6MS${n}`);
            if(rec.lessonId!==`Y6M${50+n}`) throw new Error('Canonical ID changed unexpectedly');
            for(const pair of rec.core?.homeworks||[]){
              if(pair.answerPack && !String(pair.answerPack.r2Key||'').includes('/homework/answers/')) throw new Error('Answer Pack R2 protection path changed');
            }
          }
          console.log('CHANGE7_PRODUCTION_VERIFY_PASS aliases=19 canonical_unchanged=true resources_preserved=true');
          NODE

      - name: Roll back KV on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/change7-kv-backup.json ]; then exit 0; fi
          LESSONS_ID="$(jq -r '.result.bindings[] | select(.name=="LESSONS_KV") | .namespace_id' /tmp/settings-before.json)"
          export LESSONS_ID
          node <<'NODE'
          import fs from 'node:fs';
          const values=JSON.parse(fs.readFileSync('/tmp/change7-kv-backup.json','utf8'));
          const pairs=Object.entries(values).map(([key,value])=>({key,value:String(value)}));
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${process.env.LESSONS_ID}/bulk`,{method:'PUT',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(pairs)});
          if(!r.ok) throw new Error('KV rollback failed');
          console.log('CHANGE7_KV_ROLLBACK_APPLIED');
          NODE
