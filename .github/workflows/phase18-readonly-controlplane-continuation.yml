name: Phase 18 read-only control-plane continuation

on:
  push:
    branches: [phase18-readonly-launch-reconciliation]
    paths:
      - '.github/workflows/phase18-readonly-controlplane-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  R2_BUCKET: fpt-materials-dev
  WRANGLER_VERSION: 4.125.0

jobs:
  verify:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard frozen main and read current Worker settings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = '3c63a49ef0d679318e8c6901b12e82c007b56271'
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings"
          curl --fail --silent --show-error "$URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/settings.json
          jq -e '.success==true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text" and .text=="false")' /tmp/settings.json >/dev/null
          test -z "$(jq -r '[.result.bindings[]|select(.name=="DEV_LOGIN_ALLOWLIST" and .type=="plain_text")|.text][0] // ""' /tmp/settings.json)"
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)" = 'fpt-materials-dev'
          echo "PHASE18_WORKER=${WORKER_NAME}"
          echo "PHASE18_WORKER_BASE=${WORKER_BASE}"
          echo "PHASE18_ENVIRONMENT=$(jq -r '.result.bindings[]|select(.name=="ENVIRONMENT")|.text' /tmp/settings.json)"
          echo "PHASE18_STUDENT_LOGIN_ENABLED=$(jq -r '.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED")|.text' /tmp/settings.json)"
          echo 'PHASE18_DEV_LOGIN_ALLOWLIST_EMPTY=true'
          echo "PHASE18_ALLOWED_ORIGINS=$(jq -r '.result.bindings[]|select(.name=="ALLOWED_ORIGINS")|.text' /tmp/settings.json)"
          echo "PHASE18_STUDENTS_KV_ID=$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          echo "PHASE18_LESSONS_KV_ID=$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings.json)"
          echo "PHASE18_D1_ID=$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings.json)"
          echo "PHASE18_R2_BUCKET=$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings.json)"
          echo 'PHASE18_SECRET_NAMES:'
          jq -r '.result.bindings[]|select(.type=="secret_text")|.name' /tmp/settings.json | sort
          echo 'PHASE18_DEPLOYMENT_STATUS_BEGIN'
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "$WORKER_NAME" --json
          echo 'PHASE18_DEPLOYMENT_STATUS_END'

      - name: Verify exact Phase 17 rollback backup objects
        shell: bash
        run: |
          set -euo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          PRE='_internal/phase17-backup/prelaunch-33251109750-9bace406a04b.tar.gz'
          $W r2 object get "$R2_BUCKET/$PRE" --remote --file=/tmp/pre.tar.gz >/dev/null 2>&1
          test "$(sha256sum /tmp/pre.tar.gz|awk '{print $1}')" = 'fb214cb3abc5802b300cab00ad071e7bfcc459b10bbc1d1177d4efeb126c1a88'
          echo "PHASE18_BACKUP_PASS key=${PRE} sha256=fb214cb3abc5802b300cab00ad071e7bfcc459b10bbc1d1177d4efeb126c1a88"

          HIST='__phase17_backups/retained-history-preapply-33259502392.json'
          $W r2 object get "$R2_BUCKET/$HIST" --remote --file=/tmp/hist.json >/dev/null 2>&1
          test "$(sha256sum /tmp/hist.json|awk '{print $1}')" = '7d45b4ec24b57f92aff61f8f38a522536e57ce0378919d2ad53caa8961524f72'
          echo "PHASE18_BACKUP_PASS key=${HIST} sha256=7d45b4ec24b57f92aff61f8f38a522536e57ce0378919d2ad53caa8961524f72"

          LIST="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects"
          curl --fail --silent --show-error --get "$LIST" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --data-urlencode 'prefix=_internal/phase17-backup/finalize-' --data-urlencode 'per_page=100' -o /tmp/list.json
          jq -e '.success==true' /tmp/list.json >/dev/null
          : >/tmp/matches
          while IFS= read -r k; do
            [ -n "$k" ] || continue
            rm -f /tmp/real.json
            if $W r2 object get "$R2_BUCKET/$k" --remote --file=/tmp/real.json >/dev/null 2>&1; then
              [ "$(sha256sum /tmp/real.json|awk '{print $1}')" = 'e610cf71cd03804264739912e277459ef3e83c4a35aa08bb2dc34eca10b26c58' ] && echo "$k" >>/tmp/matches
            fi
          done < <(jq -r '.result[]?.key // empty' /tmp/list.json)
          test "$(wc -l </tmp/matches|tr -d ' ')" = '1'
          echo "PHASE18_BACKUP_PASS key=$(cat /tmp/matches) sha256=e610cf71cd03804264739912e277459ef3e83c4a35aa08bb2dc34eca10b26c58"
          echo 'PHASE18_BACKUPS_PASS count=3'

      - name: Read current Cloudflare DNS and Worker routes for live domain
        shell: bash
        run: |
          set -euo pipefail
          Z="https://api.cloudflare.com/client/v4/zones?name=futureperfect.education&account.id=${CLOUDFLARE_ACCOUNT_ID}&status=active&per_page=50"
          curl --fail --silent --show-error "$Z" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/zones.json
          jq -e '.success==true and (.result|length)==1' /tmp/zones.json >/dev/null
          ZID="$(jq -r '.result[0].id' /tmp/zones.json)"
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZID}/dns_records?name=lessons.futureperfect.education&per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/dns.json
          jq -e '.success==true and (.result|length)>=1' /tmp/dns.json >/dev/null
          curl --fail --silent --show-error "https://api.cloudflare.com/client/v4/zones/${ZID}/workers/routes" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/routes.json
          jq -e '.success==true' /tmp/routes.json >/dev/null
          echo "PHASE18_ZONE_ID=${ZID}"
          jq -r '.result[]|"PHASE18_DNS_RECORD id=\(.id) type=\(.type) name=\(.name) content=\(.content) proxied=\(.proxied) ttl=\(.ttl)"' /tmp/dns.json
          echo "PHASE18_RELEVANT_WORKER_ROUTE_COUNT=$(jq '[.result[]|select((.pattern//"")|contains("lessons.futureperfect.education"))]|length' /tmp/routes.json)"
          jq -r '.result[]|select((.pattern//"")|contains("lessons.futureperfect.education"))|"PHASE18_WORKER_ROUTE id=\(.id) pattern=\(.pattern) script=\(.script//"")"' /tmp/routes.json

      - name: Verify current old-live and isolated V2 public targets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://lessons.futureperfect.education/ -o /tmp/old.html
          grep -Fq 'https://fpt-lessons-api.futureperfectlessons.workers.dev' /tmp/old.html
          echo 'PHASE18_OLD_LIVE_PASS domain=https://lessons.futureperfect.education worker=https://fpt-lessons-api.futureperfectlessons.workers.dev repo=FuturePerfectTuitions/futureperfect-lessons main=d6b8614021a7b2a225eb39ac1f3617021ec175d0'
          curl -fsSL https://futureperfecttuitions.github.io/futureperfect-lessons-v2/phase11.html -o /tmp/v2.html
          grep -Fq 'Future Perfect' /tmp/v2.html
          curl -fsSL https://futureperfecttuitions.github.io/futureperfect-lessons-v2/ -o /tmp/root.html
          grep -Fq 'Portal V2 Development' /tmp/root.html
          echo 'PHASE18_V2_PASS app=https://futureperfecttuitions.github.io/futureperfect-lessons-v2/phase11.html root=https://futureperfecttuitions.github.io/futureperfect-lessons-v2/ root_is_development_landing=true'
          echo 'PHASE18_CONTROLPLANE_PASS public_mutations=0 login_enablements=0 dns_changes=0 route_changes=0 real_syncs=0 old_live_retained=true'
