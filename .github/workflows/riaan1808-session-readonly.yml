name: Riaan1808 session read-only diagnostic

on:
  push:
    branches: [ops/cloudflare-audit]
    paths:
      - '.github/workflows/riaan1808-session-readonly.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Riaan session attempts only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.130.0 d1 execute fpt_portal_v2_db --remote --json --command "SELECT portal_user_id_norm, created_at, last_activity_at, idle_expires_at, revoked_at FROM student_sessions WHERE portal_user_id_norm='riaan1808' ORDER BY created_at DESC LIMIT 20;" | jq .
      - name: Confirm no writes
        run: echo 'READ_ONLY_RIAAN1808_SESSION_DIAGNOSTIC_PASS'
