name: Phase 13 controlled Excel sync fixture

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-controlled-fixture.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0
  FIXTURE_BATCH: __P13_ACCEPT_E5__
  FIXTURE_USER: testy511e

jobs:
  prepare:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard and seed controlled Phase 13 fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/fpt-portal-v2-worker/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/p13-fixture-settings.json
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/p13-fixture-settings.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/p13-fixture-settings.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing fixture setup.' >&2; false;; esac
          test "$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/p13-fixture-settings.json)" = 'fpt-materials-dev'

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; PRAGMA quick_check;" \
            >/tmp/p13-fixture-before.json
          echo 'Fixture preflight:'
          jq -c '[.[0].results[0],.[1].results[0],.[2].results[0],.[3].results[0],.[4].results[0]]' /tmp/p13-fixture-before.json
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/p13-fixture-before.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/p13-fixture-before.json)" = '4'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/p13-fixture-before.json)" = '4'
          test "$(jq -r '.[3].results[0].release_count' /tmp/p13-fixture-before.json)" = '0'
          jq -e '.[4].results[] | select(.quick_check=="ok")' /tmp/p13-fixture-before.json >/dev/null

          node --experimental-default-type=module <<'NODE' >/tmp/p13-candidate.sql
          import { loadPhase11Catalogue } from './scripts/phase11-catalogue.mjs';
          const catalogue = loadPhase11Catalogue();
          const ids = catalogue.curricula.ENGLISH_Y5.lessonIds;
          const values = ids.map(id => `('${String(id).replaceAll("'", "''")}')`).join(',');
          console.log(`WITH candidates(lesson_id) AS (VALUES ${values}) SELECT lesson_id FROM candidates WHERE NOT EXISTS (SELECT 1 FROM lesson_entitlements e WHERE e.portal_user_id_norm='testy511e' AND e.lesson_id=candidates.lesson_id) ORDER BY lesson_id LIMIT 1;`);
          NODE

          $W d1 execute fpt_portal_v2_db --remote --json --command "$(cat /tmp/p13-candidate.sql)" >/tmp/p13-candidate.json
          echo 'Candidate query:'
          jq -c '.[0].results' /tmp/p13-candidate.json
          TEST_LESSON="$(jq -r '.[0].results[0].lesson_id // ""' /tmp/p13-candidate.json)"
          test -n "$TEST_LESSON"
          case "$TEST_LESSON" in Y5E*) ;; *) echo 'Unexpected test lesson.' >&2; false;; esac

          $W d1 execute fpt_portal_v2_db --remote --command \
            "INSERT INTO batch_definitions(batch_key,academic_year,subject,school_year,stream,maths_level,active_from,active_to,created_at,updated_at) VALUES ('__P13_ACCEPT_E5__','2026-27','english',5,'11plus',NULL,'2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP); INSERT INTO student_batch_assignments(portal_user_id_norm,batch_key,effective_from,effective_to,created_at,updated_at) VALUES ('testy511e','__P13_ACCEPT_E5__','2000-01-01',NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);" \
            --yes >/tmp/p13-fixture-seed.log 2>&1

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS batch_rows FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__'; SELECT COUNT(*) AS assignment_rows FROM student_batch_assignments WHERE batch_key='__P13_ACCEPT_E5__' AND portal_user_id_norm='testy511e'; SELECT COUNT(*) AS entitlement_rows FROM lesson_entitlements WHERE portal_user_id_norm='testy511e' AND lesson_id='${TEST_LESSON}'; SELECT COUNT(*) AS release_rows FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id='${TEST_LESSON}';" \
            >/tmp/p13-fixture-after.json
          test "$(jq -r '.[0].results[0].batch_rows' /tmp/p13-fixture-after.json)" = '1'
          test "$(jq -r '.[1].results[0].assignment_rows' /tmp/p13-fixture-after.json)" = '1'
          test "$(jq -r '.[2].results[0].entitlement_rows' /tmp/p13-fixture-after.json)" = '0'
          test "$(jq -r '.[3].results[0].release_rows' /tmp/p13-fixture-after.json)" = '0'

          echo "CONTROLLED_FIXTURE_BATCH=${FIXTURE_BATCH}"
          echo "CONTROLLED_FIXTURE_USER=${FIXTURE_USER}"
          echo "CONTROLLED_FIXTURE_LESSON=${TEST_LESSON}"
          echo 'CONTROLLED_FIXTURE_DATE=2026-09-12'
          echo 'Phase 13 controlled fixture prepared; no entitlement or batch release has been created yet.'
