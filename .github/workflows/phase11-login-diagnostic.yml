name: Phase 11 login exception diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/phase11-login-diagnostic-trigger.txt]

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: fpt-portal-v2-worker
  WRANGLER_VERSION: 4.125.0

jobs:
  diagnostic:
    name: Diagnose Phase 11 TestY login 1101
    if: >-
      github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2' &&
      github.event.pull_request.head.ref == 'ops/phase11-login-diagnostic' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard diagnostic-only trigger and V2 development bindings
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..HEAD)" = ".github/phase11-login-diagnostic-trigger.txt"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="ALLOWED_ORIGINS" and .type=="plain_text" and .text=="https://futureperfecttuitions.github.io")' /tmp/settings.json >/dev/null
          LOGIN_ENABLED="$(jq -r '[.result.bindings[] | select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text") | .text][0] // ""' /tmp/settings.json)"
          case "${LOGIN_ENABLED,,}" in ''|'false') ;; *) echo 'Normal student login appears enabled; refusing diagnostic.' >&2; exit 1;; esac

      - name: Read D1 session schema and TestY411M state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute fpt_portal_v2_db --remote --json --command "SELECT COUNT(*) AS session_count, SUM(CASE WHEN revoked_at IS NULL THEN 1 ELSE 0 END) AS active_count FROM student_sessions; SELECT portal_user_id_norm, created_at, last_activity_at, idle_expires_at, revoked_at FROM student_sessions WHERE portal_user_id_norm = 'testy411m' ORDER BY created_at DESC LIMIT 10; SELECT name, sql FROM sqlite_master WHERE type = 'trigger' AND name = 'trg_student_sessions_single_active'; PRAGMA quick_check;" | tee /tmp/phase11-login-d1.json

      - name: Tail one failing login and capture Worker exception
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/phase11-login-tail.log
          : >/tmp/phase11-login-response.txt
          (
            timeout 30s npx --yes wrangler@${WRANGLER_VERSION} tail "$WORKER_NAME" \
              --format json --status error --sampling-rate 1 \
              > /tmp/phase11-login-tail.log 2>&1
          ) &
          TAIL_PID=$!
          sleep 6
          set +e
          HTTP_CODE="$(curl --silent --show-error \
            --header 'Origin: https://futureperfecttuitions.github.io' \
            --header 'Content-Type: application/json' \
            --request POST \
            --data '{"username":"testy411m","password":"Te12"}' \
            --output /tmp/phase11-login-response.txt \
            --write-out '%{http_code}' \
            'https://fpt-portal-v2-worker.futureperfectlessons.workers.dev/api/v1/student/auth/login')"
          CURL_RC=$?
          set -e
          sleep 6
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "Diagnostic login curl_rc=$CURL_RC http=$HTTP_CODE"
          echo '--- login response ---'
          cat /tmp/phase11-login-response.txt || true
          echo
          echo '--- Worker error tail ---'
          cat /tmp/phase11-login-tail.log || true

      - name: Upload login diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-login-diagnostic
          path: |
            /tmp/phase11-login-d1.json
            /tmp/phase11-login-response.txt
            /tmp/phase11-login-tail.log
            /tmp/settings.json
          if-no-files-found: warn
          retention-days: 14
