name: Apply Trial-ended UX to rebuilt Browser UI v3

on:
  push:
    branches: ['feature/trial-ended-upsell-browser-2026-09-17']
    paths: ['.github/workflows/apply-trial-ended-source-change-v3.yml']

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch source and prove reproducible narrow build
        shell: bash
        run: |
          set -Eeuo pipefail
          APP='rebuild/browser-ui/src/app.js'
          CSS='rebuild/browser-ui/src/styles.css'
          test -s "$APP"
          test -s rebuild/browser-ui/src/protected-viewer.js

          python3 - <<'PY'
          from pathlib import Path
          app=Path('rebuild/browser-ui/src/app.js')
          s=app.read_text(encoding='utf-8')
          if 'function isTrialEndedError(error)' not in s:
              old="""function friendlyError(error) {
  if (error?.name === 'AbortError') return 'This is taking longer than expected. Please try again.';
  if (error?.message === 'ACCOUNT_LOCKED') return 'Your access to Future Perfect Material has now been withdrawn.';
  return 'This part of the portal could not be loaded. Please try again.';
}"""
              new="""function isTrialEndedError(error) {
  return error?.message === 'TRIAL_ACCESS_ENDED' || error?.payload?.error === 'TRIAL_ACCESS_ENDED';
}

function friendlyError(error) {
  if (error?.name === 'AbortError') return 'This is taking longer than expected. Please try again.';
  if (error?.message === 'ACCOUNT_LOCKED') return 'Your access to Future Perfect Material has now been withdrawn.';
  if (isTrialEndedError(error)) return 'Your Future Perfect trial has now ended.\\nTo continue accessing lessons and resources, please contact us to discuss the right programme for your child.';
  return 'This part of the portal could not be loaded. Please try again.';
}"""
              if old not in s: raise SystemExit('friendlyError anchor not found')
              s=s.replace(old,new,1)

              old="button.disabled = true; button.textContent = 'Logging in…'; error.hidden = true;"
              new="button.disabled = true; button.textContent = 'Logging in…'; error.hidden = true; error.classList.remove('trial-ended');"
              if old not in s: raise SystemExit('login start anchor not found')
              s=s.replace(old,new,1)

              old="error.textContent = err.status === 401 ? 'Invalid username or password.' : friendlyError(err);\n      error.hidden = false;"
              new="error.textContent = err.status === 401 ? 'Invalid username or password.' : friendlyError(err);\n      error.classList.toggle('trial-ended', isTrialEndedError(err));\n      error.hidden = false;"
              if old not in s: raise SystemExit('login catch anchor not found')
              s=s.replace(old,new,1)

              old='''function renderPortalError(title, error, retry) {
  root.innerHTML = shell(`<section class="card"><p class="eyebrow">Student Portal</p><h1>${escapeHtml(title)}</h1><div class="error-box" role="alert">${escapeHtml(friendlyError(error))}</div><p><button id="retry" class="button button-primary" type="button">Try again</button></p></section>`, { portal: true });'''
              new='''function renderPortalError(title, error, retry) {
  const errorClass = isTrialEndedError(error) ? 'error-box trial-ended' : 'error-box';
  root.innerHTML = shell(`<section class="card"><p class="eyebrow">Student Portal</p><h1>${escapeHtml(title)}</h1><div class="${errorClass}" role="alert">${escapeHtml(friendlyError(error))}</div><p><button id="retry" class="button button-primary" type="button">Try again</button></p></section>`, { portal: true });'''
              if old not in s: raise SystemExit('portal error anchor not found')
              s=s.replace(old,new,1)
              app.write_text(s,encoding='utf-8')

          css=Path('rebuild/browser-ui/src/styles.css')
          c=css.read_text(encoding='utf-8')
          rule='.error-box.trial-ended{background:#eef8f3;color:#174c3a;border-color:#b8dfce;white-space:pre-line;font-weight:500}'
          if rule not in c:
              c += rule
              css.write_text(c,encoding='utf-8')
          PY

          mkdir -p rebuild/browser-ui/assets
          cp assets/fpt-logo.png rebuild/browser-ui/assets/fpt-logo.png

          cat > rebuild/browser-ui/package.json <<'JSON'
          {
            "name": "fpt-portal-v2-rebuilt-browser-ui",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {"build":"vite build"},
            "devDependencies": {"vite":"7.1.5"}
          }
          JSON
          cat > rebuild/browser-ui/vite.config.js <<'JS'
          import { defineConfig } from 'vite';
          export default defineConfig({
            base: './',
            build: {
              sourcemap: true,
              rollupOptions: {
                external: id => id === './protected-viewer.js' || id.endsWith('/protected-viewer.js'),
                output: {
                  entryFileNames: 'assets/portal-[hash].js',
                  chunkFileNames: 'assets/portal-[hash].js',
                  assetFileNames: 'assets/portal-[hash][extname]'
                }
              }
            }
          });
          JS

          cd rebuild/browser-ui
          npm install --no-audit --no-fund >/tmp/npm-install.log
          npm run build >/tmp/browser-ui-build.log
          test -f dist/index.html
          BUNDLE="$(find dist/assets -maxdepth 1 -type f -name 'portal-*.js' ! -name '*.map' | head -n1)"
          STYLE="$(find dist/assets -maxdepth 1 -type f -name 'portal-*.css' ! -name '*.map' | head -n1)"
          test -n "$BUNDLE"; test -n "$STYLE"
          grep -Fq 'Your Future Perfect trial has now ended.' "$BUNDLE"
          grep -Fq 'right programme for your child.' "$BUNDLE"
          grep -Fq 'This part of the portal could not be loaded. Please try again.' "$BUNDLE"
          grep -Fq 'TRIAL_ACCESS_ENDED' "$BUNDLE"
          grep -Fq 'protected-viewer.js' "$BUNDLE"
          grep -Fq 'eef8f3' "$STYLE"

          # Keep the exact currently-live protected viewer and its worker payloads,
          # so this release does not rebuild or upgrade PDF.js.
          curl --fail --silent --show-error 'https://lessons.futureperfect.education/assets/portal-protected-viewer-MQIf8meW.js' -o dist/assets/protected-viewer.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('dist/assets/protected-viewer.js').read_text(encoding='utf-8')
          refs=sorted(set(re.findall(r'[A-Za-z0-9._-]+\.(?:mjs|wasm)',text)))
          print('PROTECTED_VIEWER_STATIC_REFS',refs)
          for ref in refs:
              url='https://lessons.futureperfect.education/assets/'+ref
              subprocess.run(['curl','--fail','--silent','--show-error',url,'-o','dist/assets/'+ref],check=True)
          PY
          test -s dist/assets/protected-viewer.js
          echo "BUILT_MAIN=$BUNDLE"
          echo "BUILT_STYLE=$STYLE"
          echo NARROW_BROWSER_BUILD_PASS

      - name: Commit maintained rebuilt UI source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'FuturePerfectTuitions'
          git config user.email 'futureperfectlessons@gmail.com'
          git add rebuild/browser-ui/src/app.js rebuild/browser-ui/src/styles.css rebuild/browser-ui/src/protected-viewer.js rebuild/browser-ui/assets/fpt-logo.png rebuild/browser-ui/package.json rebuild/browser-ui/package-lock.json rebuild/browser-ui/vite.config.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show friendly informational message after Trial exhaustion'
          git push origin HEAD:feature/trial-ended-upsell-browser-2026-09-17
