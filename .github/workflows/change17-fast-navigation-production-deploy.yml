name: Change 17 fast navigation production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change17-fast-navigation-production-deploy.yml'
      - 'worker/src/index-phase20-change17.js'
      - 'worker/src/index-phase20-change17-parent-email.js'
      - 'worker/wrangler.toml'
      - 'ops/deploy_change17_parent_email_preserve.sh'
      - 'scripts/phase11-apply-package.mjs'
      - 'scripts/phase11-navigation-manifest.mjs'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_ENTRYPOINT: src/index-phase20-change17-parent-email.js
      WRANGLER_VERSION: 4.125.0
      PARENT_EMAIL_TEST_TO: sejal.mail@gmail.com
      DEPLOY_MESSAGE: Portal V2 fast navigation integrated with parent email

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify integrated fast navigation and canonical bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/change17-navigation-package
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/change17-navigation-package >/tmp/change17-navigation.log
          jq -e '.navigationManifestLessons == 369 and .navigationManifestCurricula == 11' /tmp/change17-navigation-package/phase11-apply-summary.json >/dev/null
          node --check worker/src/index-phase20-change17.js
          node --check worker/src/index-phase20-change17-parent-email.js
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/live-student-catalogue-overlay-verification.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          grep -Fq "import fastNavigationWorker from './index-phase20-change17.js';" worker/src/index-phase20-change17-parent-email.js
          grep -Fq 'main = "src/index-phase20-change17-parent-email.js"' worker/wrangler.toml
          grep -Fq 'PARENT_EMAIL_TEST_TO' ops/deploy_change17_parent_email_preserve.sh
          echo 'CHANGE17_FAST_NAV_INTEGRATION_PASS'

      - name: Require production bindings and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PARENT_EMAIL_TEST_TO" = 'sejal.mail@gmail.com'
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-settings-before.json
          jq -e '.success == true' /tmp/change17-settings-before.json >/dev/null
          for binding in STUDENTS_KV LESSONS_KV MATERIALS_R2 DB; do
            jq -e --arg n "$binding" '.result.bindings[] | select(.name==$n)' /tmp/change17-settings-before.json >/dev/null
          done
          for required in ADMIN_IMPORT_PASSWORD ADMIN_IMPORT_SESSION_SECRET EXCEL_SYNC_TOKEN; do
            jq -e --arg n "$required" '[.result.bindings[] | select((.type // "") | test("secret"; "i")) | .name] | index($n) != null' /tmp/change17-settings-before.json >/dev/null
          done
          echo 'CHANGE17_FAST_NAV_BINDINGS_PASS'

      - name: Deploy integrated Worker preserving parent email bindings
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_change17_parent_email_preserve.sh

      - name: Verify live fast navigation and parent email outer layer
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-settings-after.json
          jq -e '.success == true' /tmp/change17-settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="EMAIL")' /tmp/change17-settings-after.json >/dev/null
          jq -e --arg expected "$PARENT_EMAIL_TEST_TO" '.result.bindings[] | select(.name=="PARENT_EMAIL_TEST_TO" and .type=="plain_text" and .text==$expected)' /tmp/change17-settings-after.json >/dev/null
          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/change17-worker-after.bin
          grep -aFq '/api/v1/student/navigation' /tmp/change17-worker-after.bin
          grep -aFq 'fast-v1' /tmp/change17-worker-after.bin
          grep -aFq 'live-kv-v1' /tmp/change17-worker-after.bin
          echo 'CHANGE17_LIVE_FAST_NAVIGATION_PASS'

      - name: Verify live security boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://lessons.futureperfect.education'
          code="$(curl --silent --show-error --output /tmp/change17-navigation.json --write-out '%{http_code}' \
            --header "Origin: $ORIGIN" "$BASE/api/v1/student/navigation")"
          test "$code" = '401'
          echo 'CHANGE17_LIVE_SECURITY_PASS'
