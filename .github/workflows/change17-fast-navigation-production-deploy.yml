name: Change 17 fast navigation production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/change17-fast-navigation-production-deploy.yml'
      - 'worker/src/index-phase20-change17.js'
      - 'worker/src/index-phase20-change17-parent-email.js'
      - 'worker/src/live-student-catalogue-overlay.js'
      - 'worker/wrangler.toml'
      - 'ops/deploy_change17_parent_email_preserve.sh'
      - 'scripts/phase11-apply-package.mjs'
      - 'scripts/phase11-navigation-manifest.mjs'
      - 'tests/live-student-catalogue-overlay-verification.mjs'
      - 'tests/year6-sequential-catalogue-order-verification.mjs'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      WORKER_ENTRYPOINT: src/index-step10-quiz-bridge.js
      WRANGLER_VERSION: 4.125.0
      DEPLOY_MESSAGE: Restore canonical composed Worker after Year 6 navigation deploy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Year 6 navigation and canonical composition
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/change17-navigation-package
          node --experimental-default-type=module scripts/phase11-apply-package.mjs --write-dir /tmp/change17-navigation-package >/tmp/change17-navigation.log
          jq -e '.navigationManifestLessons == 369 and .navigationManifestCurricula == 11' /tmp/change17-navigation-package/phase11-apply-summary.json >/dev/null
          node tests/subject-preview-enrolment-boundary-verification.mjs
          node tests/maths-11plus-level-navigation-verification.mjs
          node tests/y411-admin-import-baseline-verification.mjs
          node tests/admin-lesson-release-import-verification.mjs
          node tests/live-student-catalogue-overlay-verification.mjs
          node tests/year6-sequential-catalogue-order-verification.mjs
          node tests/shared-worker-entrypoint-preservation.mjs
          node --experimental-default-type=module tests/phase11-navigation-cache-static-verification.mjs
          grep -Fq 'main = "src/index-step10-quiz-bridge.js"' worker/wrangler.toml
          grep -Fq "import currentWorker from './index-admin-tools.js';" worker/src/index-step10-quiz-bridge.js
          grep -Fq "./admin-resource-replace-consistency.js" worker/src/index-admin-tools.js
          echo 'CHANGE17_CANONICAL_COMPOSITION_PASS'

      - name: Capture production rollback anchor
        id: rollback
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" deployments status --name "$WORKER_NAME" --json >/tmp/change17-before.json
          OLD="$(jq -r '.versions[] | select(.percentage==100) | .version_id' /tmp/change17-before.json | head -n1)"
          test -n "$OLD"
          echo "old_version=$OLD" >> "$GITHUB_OUTPUT"
          echo "CHANGE17_ROLLBACK_ANCHOR=$OLD"

      - name: Deploy canonical composed Worker preserving all bindings
        shell: bash
        run: |
          set -euo pipefail
          bash ops/deploy_current_worker_preserve.sh

      - name: Verify canonical shared Worker and lesson-release capability
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          BASE='https://fpt-portal-v2-worker.futureperfectlessons.workers.dev'
          ORIGIN='https://futureperfecttuitions.github.io'

          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}/settings" -H "$AUTH" -o /tmp/settings-after.json
          jq -e '.success == true' /tmp/settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="READ_MODELS_KV" and .type=="kv_namespace")' /tmp/settings-after.json >/dev/null
          jq -e '.result.bindings[] | select(.name=="EMAIL")' /tmp/settings-after.json >/dev/null

          curl --fail --silent --show-error "$API/workers/scripts/${WORKER_NAME}" -H "$AUTH" -o /tmp/live-worker.bin
          grep -aFq '/api/v1/quiz-bridge/redeem' /tmp/live-worker.bin
          grep -aFq 'replace-resource-consistency-v1' /tmp/live-worker.bin
          grep -aFq '/api/v1/admin/lesson-releases/confirm' /tmp/live-worker.bin
          grep -aFq 'trial-runtime-access-v2' /tmp/live-worker.bin

          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --request OPTIONS \
              --header "Origin: $ORIGIN" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type, authorization' \
              --dump-header /tmp/release-preflight-headers.txt \
              --output /tmp/release-preflight-body.json \
              --write-out '%{http_code}' \
              "$BASE/api/v1/admin/lesson-releases/confirm")"
            echo "Lesson release preflight attempt $attempt returned HTTP $code"
            if test "$code" = '200' \
              && grep -iFq "access-control-allow-origin: $ORIGIN" /tmp/release-preflight-headers.txt \
              && grep -iEq '^access-control-allow-methods:.*POST' /tmp/release-preflight-headers.txt; then
              echo 'LESSON_RELEASE_PREFLIGHT_LIVE_PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'Lesson Release Import preflight did not converge.' >&2
          cat /tmp/release-preflight-headers.txt >&2 || true
          cat /tmp/release-preflight-body.json >&2 || true
          exit 1

      - name: Roll back if production verification failed
        if: failure() && steps.rollback.outputs.old_version != ''
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" rollback "${{ steps.rollback.outputs.old_version }}" --name "$WORKER_NAME" --message 'Automatic rollback after failed canonical Change17 recovery verification'
