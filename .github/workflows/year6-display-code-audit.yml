name: Year 6 display-code read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/year6-display-code-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read focused live Year 6 display mappings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-settings.json

          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name == "LESSONS_KV") | .namespace_id' /tmp/worker-settings.json)"
          test -n "$LESSONS_KV_ID"

          for code in MATHS_L3 MATHS_Y6_EXTRA; do
            npx --yes wrangler@latest kv key get "curriculum:${code}" --namespace-id "$LESSONS_KV_ID" --remote > "/tmp/${code}.json"
            echo "=== curriculum:${code} ==="
            jq -c '{curriculumCode, lessonIds:(.lessonIds // .lessons // .items // .)}' "/tmp/${code}.json"
          done

          echo "=== focused live lesson records ==="
          for lesson_id in Y6M16 Y6M17 Y6M18 Y6M34 Y6M35 Y6M36 Y6M37 Y6M38 Y6M46 Y6M47 Y6M48 Y6M49 Y6M50 Y6M51; do
            npx --yes wrangler@latest kv key get "lesson:${lesson_id}" --namespace-id "$LESSONS_KV_ID" --remote > /tmp/lesson.json
            jq -c --arg fallback "$lesson_id" '{lessonId:(.lessonId // $fallback), title, active, displayIds, displayLessonIds, presentationDisplayIds:(.presentation.displayIds // null)}' /tmp/lesson.json
          done

      - name: Confirm read-only boundary
        run: echo "Focused Year 6 display-code audit complete. No KV, D1, R2 or Worker write/deploy command was executed."
