name: Verify Aarav Year 6 SAT access

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/year6-display-code-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
      EXPECTED_STUDENTS_KV_ID: c9723c8806334e4ea54d1b456d31b794
      EXPECTED_READ_MODELS_KV_ID: 77b35165c8694087bc1b0515c35a7e89
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read back Aarav prepared access
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-aarav.mjs <<'JS'
          import {
            opaqueAccessScopeId,
            resolveCurrentScope,
            globalToCatalogue,
            isYear6SatsLessonId,
            Y6_SATS_DIRECT_RELEASE_MARKER
          } from './worker/src/access-read-model-sync.js';

          const clean = value => String(value ?? '').trim();
          const norm = value => clean(value).toLowerCase();
          const token = clean(process.env.CLOUDFLARE_API_TOKEN);
          const account = clean(process.env.CLOUDFLARE_ACCOUNT_ID);
          const worker = clean(process.env.WORKER_NAME || 'fpt-portal-v2-worker');
          if (Y6_SATS_DIRECT_RELEASE_MARKER !== 'y6-sats-direct-release-v1') throw new Error('SAT rule marker missing');
          const api = 'https://api.cloudflare.com/client/v4';
          const auth = { Authorization:`Bearer ${token}` };

          async function req(path) {
            const r = await fetch(`${api}${path}`, { headers:auth });
            const text = await r.text();
            let body = null; try { body = JSON.parse(text); } catch {}
            return { r, text, body };
          }
          async function envelope(path) {
            const x = await req(path);
            if (!x.r.ok || x.body?.success !== true) throw new Error(`Cloudflare request failed ${x.r.status}`);
            return x.body;
          }
          async function kvText(ns, key) {
            const x = await req(`/accounts/${account}/storage/kv/namespaces/${ns}/values/${encodeURIComponent(key)}`);
            if (!x.r.ok) throw new Error(`KV read failed ${x.r.status}`);
            return x.text;
          }
          function remoteKv(ns) {
            return { async get(key, options={}) {
              const text = await kvText(ns,key);
              if (options?.type === 'json') return JSON.parse(text);
              return text;
            }};
          }

          const settings = (await envelope(`/accounts/${account}/workers/scripts/${worker}/settings`)).result || {};
          const binding = name => (settings.bindings || []).find(x => x?.name === name) || {};
          const studentsId = clean(binding('STUDENTS_KV').namespace_id);
          const readModelsId = clean(binding('READ_MODELS_KV').namespace_id);
          if (studentsId !== clean(process.env.EXPECTED_STUDENTS_KV_ID)) throw new Error('STUDENTS_KV binding drift');
          if (readModelsId !== clean(process.env.EXPECTED_READ_MODELS_KV_ID)) throw new Error('READ_MODELS_KV binding drift');
          const store = remoteKv(readModelsId);

          const profile = JSON.parse(await kvText(studentsId, 'user:aar1811'));
          const libraries = new Set((profile.fullLibraries || []).map(x => clean(x).toUpperCase()));
          if (!libraries.has('MATHS_Y6_FULL')) throw new Error('Aarav broad Year 6 library missing');

          const global = await resolveCurrentScope(store, 'global');
          const catalogue = globalToCatalogue(global.payload);
          const year6Ids = Object.entries(catalogue.lessonToViews || {})
            .filter(([,views]) => Array.isArray(views) && views.map(norm).includes('maths-year6'))
            .map(([id]) => clean(id));
          const satIds = year6Ids.filter(isYear6SatsLessonId).sort();
          const normalIds = year6Ids.filter(id => !isYear6SatsLessonId(id));
          if (satIds.length !== 19) throw new Error(`SAT count drift ${satIds.length}`);

          const salt = clean(await store.get('meta:scope-salt'));
          const scopeId = await opaqueAccessScopeId('aar1811', salt);
          const prepared = await resolveCurrentScope(store, `access:${scopeId}`);
          const snapshot = prepared.payload?.snapshot || prepared.payload;
          if (!snapshot?.lessonAccess) throw new Error('Prepared lessonAccess unavailable');
          if (!(snapshot.fullViewIds || []).map(norm).includes('maths-year6')) throw new Error('Year 6 full view presentation missing');

          const normalFailures = normalIds.filter(id => {
            const s = snapshot.lessonAccess[id];
            return !s?.core || s?.blocked === true || s?.preLessonOnly === true;
          });
          if (normalFailures.length) throw new Error(`NORMAL_YEAR6_FULL_ACCESS_REGRESSED:${normalFailures.length}`);

          const inheritedSat = satIds.filter(id => (snapshot.lessonAccess[id]?.sources || []).includes('full-library'));
          if (inheritedSat.length) throw new Error(`SAT_FULL_LIBRARY_INHERITANCE_REMAINS:${inheritedSat.join(',')}`);

          const directFull = satIds.filter(id => snapshot.lessonAccess[id]?.core === true);
          const preOnly = satIds.filter(id => snapshot.lessonAccess[id]?.preLessonOnly === true);
          const locked = satIds.filter(id => !snapshot.lessonAccess[id] || snapshot.lessonAccess[id]?.blocked === true);
          for (const id of directFull) {
            const sources = snapshot.lessonAccess[id]?.sources || [];
            if (!sources.some(s => ['earned','manual','temporary'].includes(s))) throw new Error(`SAT_FULL_WITHOUT_DIRECT_SOURCE:${id}`);
          }

          console.log(JSON.stringify({
            marker:'AARAV_Y6_SATS_VERIFIED', status:'PASS',
            normalYear6LessonCount:normalIds.length,
            normalYear6FullPreserved:true,
            satLessonCount:satIds.length,
            satInheritedFromFullLibrary:0,
            satFullReleasedIndividually:directFull.length,
            satPreLessonOnly:preOnly.length,
            satLocked:locked.length,
            directFullSatLessonIds:directFull,
            preLessonSatLessonIds:preOnly,
            preparedVersion:prepared.version,
            canonicalProfileChanged:false,
            d1Changed:false,
            credentialsDisclosed:false
          }, null, 2));
          JS
          node verify-aarav.mjs
          rm verify-aarav.mjs
