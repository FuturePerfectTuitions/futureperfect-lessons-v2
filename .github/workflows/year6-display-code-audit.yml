name: Year 6 display-code read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/year6-display-code-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read live Year 6 curriculum and display mappings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/worker-settings.json

          LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name == "LESSONS_KV") | .namespace_id' /tmp/worker-settings.json)"
          test -n "$LESSONS_KV_ID"
          echo "LESSONS_KV binding resolved."

          for code in MATHS_L3 MATHS_Y6_EXTRA; do
            npx --yes wrangler@latest kv key get "curriculum:${code}" --namespace-id "$LESSONS_KV_ID" --remote > "/tmp/${code}.json"
            echo "=== curriculum:${code} ==="
            jq '{curriculumCode, lessonIds:(.lessonIds // .lessons // .items // .)}' "/tmp/${code}.json"
          done

          jq -r '[.lessonIds // .lessons // .items // .][] | if type=="string" then . else .lessonId end' /tmp/MATHS_L3.json /tmp/MATHS_Y6_EXTRA.json \
            | sed '/^null$/d;/^$/d' | awk '!seen[$0]++' > /tmp/y6-lesson-ids.txt

          echo "=== live Year 6 lesson records: canonical -> displayed IDs ==="
          while IFS= read -r lesson_id; do
            npx --yes wrangler@latest kv key get "lesson:${lesson_id}" --namespace-id "$LESSONS_KV_ID" --remote > /tmp/lesson.json
            jq -c '{lessonId:(.lessonId // "'"$lesson_id"'"), title, active, displayIds, displayLessonIds, presentationDisplayIds:(.presentation.displayIds // null)}' /tmp/lesson.json
          done < /tmp/y6-lesson-ids.txt

          echo "=== duplicate display IDs within maths-year6 ==="
          while IFS= read -r lesson_id; do
            npx --yes wrangler@latest kv key get "lesson:${lesson_id}" --namespace-id "$LESSONS_KV_ID" --remote > /tmp/lesson.json
            jq -r --arg id "$lesson_id" '
              (.displayIds // .displayLessonIds // .presentation.displayIds // {}) as $m |
              [($m["maths-year6"] // $m["MATHS-YEAR6"] // $m["maths-Year6"] // empty), $id, (.title // "")] | @tsv
            ' /tmp/lesson.json
          done < /tmp/y6-lesson-ids.txt | awk -F '\t' 'NF>=2 && $1!="" {count[$1]++; rows[$1]=rows[$1] $0 "\n"} END {for (k in count) if (count[k]>1) printf "%s", rows[k]}' | sort

      - name: Confirm read-only boundary
        run: echo "Year 6 display-code audit complete. No KV, D1, R2 or Worker write/deploy command was executed."
