name: Year 6 full display-code read-only audit

on:
  push:
    branches:
      - ops/cloudflare-audit
    paths:
      - .github/workflows/year6-display-code-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: fpt-portal-v2-worker
    steps:
      - uses: actions/checkout@v6
      - name: Audit all live Year 6 display IDs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings.json
          export LESSONS_KV_ID="$(jq -r '.result.bindings[] | select(.name == "LESSONS_KV") | .namespace_id' /tmp/settings.json)"
          test -n "$LESSONS_KV_ID"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, concurrent.futures, re
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; ns=os.environ['LESSONS_KV_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}/values/'
          def get(key):
              req=urllib.request.Request(base+urllib.parse.quote(key,safe=''), headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30) as r: return json.loads(r.read())
          curricula={c:get('curriculum:'+c) for c in ('MATHS_L3','MATHS_Y6_EXTRA')}
          ids=[]
          for c in ('MATHS_L3','MATHS_Y6_EXTRA'):
              raw=curricula[c]; items=raw.get('lessonIds') or raw.get('lessons') or raw.get('items') or raw
              for x in items:
                  lid=x if isinstance(x,str) else x.get('lessonId')
                  if lid and lid not in ids: ids.append(lid)
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              vals=dict(zip(ids, ex.map(lambda i:get('lesson:'+i), ids)))
          rows=[]
          for i,lid in enumerate(ids,1):
              v=vals[lid]; did=(v.get('displayIds') or {}).get('maths-year6')
              rows.append((i,lid,v.get('title'),did,(v.get('displayIds') or {}).get('maths-level3')))
          print('ORDER\tCANONICAL\tTITLE\tYEAR6_DISPLAY\tL3_DISPLAY')
          for r in rows: print('\t'.join('' if x is None else str(x) for x in r))
          nums={}
          for _,lid,title,did,_ in rows:
              m=re.fullmatch(r'Y6T([123])M(\d+)', did or '')
              if m: nums.setdefault(int(m.group(2)),[]).append((did,lid,title))
          print('=== REUSED M NUMBERS ACROSS TERMS ===')
          for n,arr in sorted(nums.items()):
              terms={x[0].split('M')[0] for x in arr}
              if len(terms)>1:
                  for x in arr: print(n,*x,sep='\t')
          PY
      - name: Confirm read-only boundary
        run: echo "Full Year 6 audit complete; no production write/deploy command executed."
