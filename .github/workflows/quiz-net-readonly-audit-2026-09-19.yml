name: Quiz net read-only audit 2026-09-19

on:
  push:
    branches:
      - ops/quiz-diagram-renderer-2026-09-19
    paths:
      - '.github/workflows/quiz-net-readonly-audit-2026-09-19.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.134.0
  QUIZ_D1_NAME: fpt-11plus-practice

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read net questions and answer contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p /tmp/net-audit
          npx --yes wrangler@"$WRANGLER_VERSION" d1 execute "$QUIZ_D1_NAME" --remote --command "SELECT qi.question_id,qi.stem,qi.diagram_spec_json,qi.correct_option,qi.correct_display,group_concat(qo.option_key||'='||qo.option_value,' | ') AS options FROM question_instance qi JOIN question_option qo ON qo.question_id=qi.question_id WHERE UPPER(qi.lifecycle_status)='LIVE' AND qi.diagram_type='Net' GROUP BY qi.question_id,qi.stem,qi.diagram_spec_json,qi.correct_option,qi.correct_display ORDER BY qi.question_id;" --json > /tmp/net-audit/net.json
          cat /tmp/net-audit/net.json
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-net-readonly-audit
          path: /tmp/net-audit
          retention-days: 7
