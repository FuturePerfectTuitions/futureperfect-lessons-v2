name: Phase 13 guarded redeploy with controlled fixture

on:
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-redeploy-with-fixture.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FPT_PORTAL_V2_EXCEL_SYNC_TOKEN: ${{ secrets.FPT_PORTAL_V2_EXCEL_SYNC_TOKEN }}
  WORKER_NAME: fpt-portal-v2-worker
  WORKER_BASE: https://fpt-portal-v2-worker.futureperfectlessons.workers.dev
  WRANGLER_VERSION: 4.125.0

jobs:
  redeploy:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Guard, redeploy and verify Phase 13 with fixture preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FPT_PORTAL_V2_EXCEL_SYNC_TOKEN"
          W="npx --yes wrangler@${WRANGLER_VERSION}"

          node --check worker/src/index-phase13.js
          node tests/phase13-excel-sync-verification.mjs
          node tests/phase12-batch-aware-worker-verification.mjs

          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/settings-before.json
          jq -e '.success == true' /tmp/settings-before.json >/dev/null
          jq -e '.result.bindings[]|select(.name=="ENVIRONMENT" and .type=="plain_text" and .text=="development")' /tmp/settings-before.json >/dev/null
          LOGIN="$(jq -r '[.result.bindings[]|select(.name=="STUDENT_LOGIN_ENABLED" and .type=="plain_text")|.text][0] // ""' /tmp/settings-before.json)"
          case "${LOGIN,,}" in ''|'false') ;; *) echo 'Normal login enabled; refusing redeploy.' >&2; false;; esac
          STUDENTS="$(jq -r '.result.bindings[]|select(.name=="STUDENTS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings-before.json)"
          LESSONS="$(jq -r '.result.bindings[]|select(.name=="LESSONS_KV" and .type=="kv_namespace")|.namespace_id' /tmp/settings-before.json)"
          DB="$(jq -r '.result.bindings[]|select(.name=="DB" and .type=="d1")|.id' /tmp/settings-before.json)"
          R2="$(jq -r '.result.bindings[]|select(.name=="MATERIALS_R2" and .type=="r2_bucket")|.bucket_name' /tmp/settings-before.json)"
          test "$R2" = 'fpt-materials-dev'
          for V in "$STUDENTS" "$LESSONS" "$DB"; do test -n "$V"; test "$V" != null; done

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS fixture_batch FROM batch_definitions WHERE batch_key='__P13_ACCEPT_E5__' AND subject='english' AND school_year=5 AND stream='normal'; SELECT COUNT(*) AS fixture_assignment FROM student_batch_assignments WHERE portal_user_id_norm='testy2e' AND batch_key='__P13_ACCEPT_E5__' AND effective_from='2000-01-01' AND effective_to IS NULL; SELECT COUNT(*) AS fixture_entitlement FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id='Y5E10'; SELECT COUNT(*) AS fixture_release FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id='Y5E10'; PRAGMA quick_check;" \
            >/tmp/d1-before.json
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/d1-before.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/d1-before.json)" = '5'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/d1-before.json)" = '5'
          test "$(jq -r '.[3].results[0].release_count' /tmp/d1-before.json)" = '0'
          test "$(jq -r '.[4].results[0].fixture_batch' /tmp/d1-before.json)" = '1'
          test "$(jq -r '.[5].results[0].fixture_assignment' /tmp/d1-before.json)" = '1'
          test "$(jq -r '.[6].results[0].fixture_entitlement' /tmp/d1-before.json)" = '0'
          test "$(jq -r '.[7].results[0].fixture_release' /tmp/d1-before.json)" = '0'
          jq -e '.[8].results[] | select(.quick_check=="ok")' /tmp/d1-before.json >/dev/null

          $W secret list --name "$WORKER_NAME" --format json >/tmp/secrets.json
          jq -e '.[] | select(.name == "EXCEL_SYNC_TOKEN")' /tmp/secrets.json >/dev/null

          cat >worker/wrangler.phase13.fixture.toml <<EOF
          name = "fpt-portal-v2-worker"
          main = "src/index-phase13.js"
          compatibility_date = "2026-08-20"
          keep_vars = true
          workers_dev = true
          [[kv_namespaces]]
          binding = "STUDENTS_KV"
          id = "${STUDENTS}"
          [[kv_namespaces]]
          binding = "LESSONS_KV"
          id = "${LESSONS}"
          [[r2_buckets]]
          binding = "MATERIALS_R2"
          bucket_name = "${R2}"
          [[d1_databases]]
          binding = "DB"
          database_name = "fpt_portal_v2_db"
          database_id = "${DB}"
          EOF

          $W deploy --config worker/wrangler.phase13.fixture.toml --keep-vars \
            --message 'Phase 13 guarded redeploy with controlled fixture' >/tmp/deploy.log 2>&1
          sleep 3

          CODE="$(curl --silent --show-error --output /tmp/noauth.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --request POST \
            --data '{"items":[{"syncRowId":"noauth","operation":"status_check","portalUserId":"testy2e","lessonId":"Y5E10","batchKey":"__P13_ACCEPT_E5__","lessonDate":"2026-09-12"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync")"
          test "$CODE" = '401'
          jq -e '.error == "SYNC_UNAUTHORISED"' /tmp/noauth.json >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $FPT_PORTAL_V2_EXCEL_SYNC_TOKEN" \
            --header 'Content-Type: application/json' --request POST \
            --data '{"items":[{"syncRowId":"fixture-status","operation":"status_check","portalUserId":"testy2e","lessonId":"Y5E10","batchKey":"__P13_ACCEPT_E5__","lessonDate":"2026-09-12"}]}' \
            "$WORKER_BASE/api/v1/admin/excel-entitlements/sync" >/tmp/status.json
          cat /tmp/status.json | jq -c .
          jq -e '.ok == true and .results[0].ok == false and .results[0].status == "NOT_ENTITLED"' /tmp/status.json >/dev/null

          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(*) AS fixture_entitlement FROM lesson_entitlements WHERE portal_user_id_norm='testy2e' AND lesson_id='Y5E10'; SELECT COUNT(*) AS fixture_release FROM batch_lesson_releases WHERE batch_key='__P13_ACCEPT_E5__' AND lesson_id='Y5E10'; PRAGMA quick_check;" \
            >/tmp/d1-after.json
          test "$(jq -r '.[0].results[0].entitlement_count' /tmp/d1-after.json)" = '632'
          test "$(jq -r '.[1].results[0].batch_count' /tmp/d1-after.json)" = '5'
          test "$(jq -r '.[2].results[0].assignment_count' /tmp/d1-after.json)" = '5'
          test "$(jq -r '.[3].results[0].release_count' /tmp/d1-after.json)" = '0'
          test "$(jq -r '.[4].results[0].fixture_entitlement' /tmp/d1-after.json)" = '0'
          test "$(jq -r '.[5].results[0].fixture_release' /tmp/d1-after.json)" = '0'
          jq -e '.[6].results[] | select(.quick_check=="ok")' /tmp/d1-after.json >/dev/null

          echo 'Phase 13 Worker redeployed; controlled fixture remains unentitled and ready for workbook retry.'
