name: Phase 13 D1 read-only diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase13-d1-readonly-diagnostic.yml
  push:
    branches:
      - phase13-sync-portal-entitlements
    paths:
      - .github/workflows/phase13-d1-readonly-diagnostic.yml

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_VERSION: 4.125.0

jobs:
  inspect:
    if: github.repository == 'FuturePerfectTuitions/futureperfect-lessons-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read Phase 13 D1 closure state only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          W="npx --yes wrangler@${WRANGLER_VERSION}"
          $W d1 execute fpt_portal_v2_db --remote --json --command \
            "SELECT COUNT(*) AS entitlement_count FROM lesson_entitlements; SELECT COUNT(*) AS batch_count FROM batch_definitions; SELECT COUNT(*) AS assignment_count FROM student_batch_assignments; SELECT COUNT(*) AS release_count FROM batch_lesson_releases; SELECT COUNT(DISTINCT portal_user_id_norm) AS entitlement_users FROM lesson_entitlements; SELECT SUM(CASE WHEN portal_user_id_norm LIKE 'testy%' THEN 1 ELSE 0 END) AS test_fixture_entitlements, SUM(CASE WHEN portal_user_id_norm NOT LIKE 'testy%' THEN 1 ELSE 0 END) AS non_test_fixture_entitlements FROM lesson_entitlements; SELECT SUM(CASE WHEN portal_user_id_norm LIKE 'testy%' THEN 1 ELSE 0 END) AS test_fixture_users, SUM(CASE WHEN portal_user_id_norm NOT LIKE 'testy%' THEN 1 ELSE 0 END) AS non_test_fixture_users FROM (SELECT DISTINCT portal_user_id_norm FROM lesson_entitlements); SELECT COUNT(DISTINCT portal_user_id_norm) AS assigned_users FROM student_batch_assignments; SELECT COUNT(*) AS assigned_user_entitlements FROM lesson_entitlements WHERE portal_user_id_norm IN (SELECT DISTINCT portal_user_id_norm FROM student_batch_assignments); SELECT COUNT(*) AS unassigned_user_entitlements FROM lesson_entitlements WHERE portal_user_id_norm NOT IN (SELECT DISTINCT portal_user_id_norm FROM student_batch_assignments); SELECT source, COUNT(*) AS entitlements FROM lesson_entitlements GROUP BY source ORDER BY source; SELECT batch_key, COUNT(*) AS assignments FROM student_batch_assignments GROUP BY batch_key ORDER BY batch_key; SELECT batch_key, COUNT(*) AS releases FROM batch_lesson_releases GROUP BY batch_key ORDER BY batch_key; SELECT name FROM sqlite_master WHERE type='trigger' AND name='trg_student_sessions_single_active'; PRAGMA quick_check;" \
            >/tmp/p13-d1-diagnostic.json
          jq -c '[.[0].results[0],.[1].results[0],.[2].results[0],.[3].results[0],.[4].results[0],.[5].results[0],.[6].results[0],.[7].results[0],.[8].results[0],.[9].results[0]]' /tmp/p13-d1-diagnostic.json
          echo 'Entitlements by source:'
          jq -c '.[10].results' /tmp/p13-d1-diagnostic.json
          echo 'Assignments by batch:'
          jq -c '.[11].results' /tmp/p13-d1-diagnostic.json
          echo 'Releases by batch:'
          jq -c '.[12].results' /tmp/p13-d1-diagnostic.json
          jq -e '.[13].results[] | select(.name=="trg_student_sessions_single_active")' /tmp/p13-d1-diagnostic.json >/dev/null
          jq -e '.[14].results[] | select(.quick_check=="ok")' /tmp/p13-d1-diagnostic.json >/dev/null
          echo 'Phase 13 D1 read-only diagnostic: PASS'
