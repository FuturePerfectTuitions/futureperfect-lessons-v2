name = "fpt-portal-v2-rebuild-student-dev"
main = "src/index.js"
compatibility_date = "2026-08-20"
workers_dev = true

[vars]
ENVIRONMENT = "development"
DEPLOYMENT_IDENTITY = "student-development"
CHECKPOINT = "6"
BASELINE_SOURCE_SHA = "e4c7bde7ad9a9402136da5798d7ab690ab30322c"

[env.staging]
name = "fpt-portal-v2-rebuild-student-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
DEPLOYMENT_IDENTITY = "student-staging-cp9"
CHECKPOINT = "9"
BASELINE_SOURCE_SHA = "e4c7bde7ad9a9402136da5798d7ab690ab30322c"
STUDENT_LOGIN_ENABLED = "true"
ALLOWED_ORIGINS = "https://fpt-portal-v2-rebuild-browser-staging-cp9.futureperfectlessons.workers.dev"

[[env.staging.kv_namespaces]]
binding = "READ_MODELS_KV"
id = "0aaa397a1c8c409e9f29d3a148dcc56e"

[[env.staging.kv_namespaces]]
