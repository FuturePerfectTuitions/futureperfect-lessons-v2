name = "fpt-portal-v2-worker"
main = "src/index-phase17.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io,https://lessons.futureperfect.education"
DEV_LOGIN_ALLOWLIST = ""
STUDENT_LOGIN_ENABLED = "true"

# Portal V2 production entrypoint. src/index-phase17.js retains the Phase 17
# explicit ScreenPal metadata guard and also fails closed for student login:
# production login is available only when STUDENT_LOGIN_ENABLED is true AND the
# normalised username is present in the Cloudflare-managed PROD_LOGIN_ALLOWLIST.
# The production allowlist is deliberately not committed to this public repo.
# keep_vars preserves Cloudflare-managed runtime values on ordinary deployments.
#
# The Phase 13 Excel route remains unchanged and still requires the dedicated
# EXCEL_SYNC_TOKEN Worker secret. The secret is deliberately not present in
# this file or any repository source. Student + Lesson remains the permanent
# idempotent entitlement identity while Batch + Lesson remains operational
# release context; Excel does not mutate membership.
#
# Passwords, Answer Pack passwords, private student records, production student
# allowlists and Cloudflare credential values are never committed in plaintext.
# The production deployment preserves the existing audited Students KV,
# Lessons KV, D1 and R2 bindings; exact binding identifiers remain
# Cloudflare-managed rather than source data.
