name = "fpt-portal-v2-worker"
main = "src/index-admin-tools.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io,https://lessons.futureperfect.education"
DEV_LOGIN_ALLOWLIST = ""
STUDENT_LOGIN_ENABLED = "true"
PARENT_EMAIL_TEST_TO = ""

[[send_email]]
name = "EMAIL"

# Prepared access read models used by the rebuilt public Student Worker. The
# lesson-release importer reconciles this projection immediately after canonical
# D1 access writes so public Portal access cannot remain stale/preview-only.
[[kv_namespaces]]
binding = "READ_MODELS_KV"
id = "77b35165c8694087bc1b0515c35a7e89"

# Canonical Portal V2 production entrypoint.
# Admin Tools wraps Phase 24 only to add authenticated operational routes such as
# Replace Resource. Every non-admin-resource request is delegated unchanged to
# Phase 24. Production student/lesson KV, D1, R2 bindings and secrets remain
# Cloudflare-managed; READ_MODELS_KV is deliberately pinned here because it is
# the live prepared-access projection shared with the rebuilt Student Worker.
#
# Phase 24 wraps Phase 23 only to extend 11+ Trial access with the VR resources
# belonging to the explicitly allowed Year 4/Year 5 English 11+ trial view.
# Core Trial behaviour remains unchanged: lesson descriptions and the main lesson
# video stay open, while non-VR worksheets/homework/answers remain restricted.
# VR protected answers continue through the existing password, session, rate-limit
# and protected-view controls; Phase 24 does not bypass those checks.
#
# Phase 23 wraps the current Change 20 production Worker only for protected
# Answer Pack/Answer Key fetch stability. If an initial protected PDF request
# races the existing short content-open window or repeats a single-use request,
# Phase 23 retries it only while the original session-bound lease is still valid.
# All password, session, entitlement, view, account and password-fingerprint
# checks remain owned by the existing protected-answer Worker chain.
#
# Change 20 adds explicit, profile-configured locked upsell views through
# `upsellViews`. When that field is present, those views are the student's exact
# upsell set: they are visible immediately, even before a counterpart lesson or
# batch release exists, and their lesson catalogues/descriptions are browseable
# while every resource remains locked. An explicit empty array means no upsells.
# Profiles without `upsellViews` retain the existing automatic cross-subject
# preview behaviour for backwards compatibility.
#
# Change 20 delegates all non-upsell behaviour to Change 19. Change 19 retains
# the authenticated Admin fast path, Change 18 retains Admin superuser access,
# and the underlying Change 17/16 chain retains student navigation, Full Library,
# trial, batch, lesson-release, PreLesson-only, Answer Pack and resource controls.
#
# The Admin Replace Resource route reuses the signed lesson-release-import Admin
# session. It writes each replacement PDF to a fresh MATERIALS_R2 key, verifies
# the uploaded bytes by SHA-256 read-back, checks optimistic concurrency against
# the selected existing r2Key, then updates only that resource reference in the
# canonical lesson KV record. The old R2 object is intentionally retained for
# rollback; student entitlements are not modified.
#
# Production KV, D1, R2 bindings and secrets remain Cloudflare-managed. The
# outbound EMAIL and READ_MODELS_KV bindings are declared here because Wrangler
# treats them as Worker bindings and production deploys must carry them explicitly.
# `keep_vars = true` preserves existing dashboard vars/secrets; deployment scripts
# separately preserve/verify the production bindings.
# Passwords, Answer Pack passwords, private student records, production allowlists
# and Cloudflare credential values must never be committed to this repository.
