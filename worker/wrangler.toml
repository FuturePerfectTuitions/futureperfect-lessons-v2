name = "fpt-portal-v2-worker"
main = "src/index-phase20-change11.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io,https://lessons.futureperfect.education"
DEV_LOGIN_ALLOWLIST = ""
STUDENT_LOGIN_ENABLED = "true"

# Portal V2 production entrypoint. Change 11 wraps Change 10 and makes an
# explicit Full Library enrolment participate in cross-subject preview discovery
# even when there is no matching active D1 batch assignment. The synthetic row is
# request-local and preview-only: it never creates batch membership, never writes
# D1/KV and never grants lesson/resource access. The existing Phase 19 server-side
# preview gate remains authoritative, so the counterpart subject catalogue and
# full lesson descriptions may be browsed while all resources stay locked unless
# an independent entitlement already grants access.
#
# Change 10 wraps Change 9 and verifies that an imported PRELESSON_ONLY release
# actually has at least one usable PreLesson resource before it is presented as
# clickable/available. Empty PreLesson releases stay visible for information as
# "No PreLesson Sheets" but are not openable.
#
# Change 9 normalises every student-facing 11+ Year/Level label to one convention:
# "Year N 11+" / "Level N 11+" (no mixed parenthesised/non-parenthesised forms).
# It does not alter curriculum access, lesson identity, entitlement or resources.
#
# Change 8 surfaces imported FULL / Online PreLesson-only lesson access in the
# correct student year/11+ navigation view without depending on the D1 batch roster.
# Existing Phase 18/19 resource gates remain authoritative: PreLesson-only access
# exposes only allowed PreLesson downloads; video, homework and Answer Packs stay
# locked until FULL access exists.
#
# Change 7 remains responsible for the Year 6 Maths SATS student/workbook alias
# resolver: Y6MS1-Y6MS19 map to immutable canonical lesson keys Y6M51-Y6M69.
# The canonical keys remain entitlement/content identities.
#
# Online PreLesson rule remains unchanged: selected rows for Batch IDs containing
# O may grant PreLesson-only access before completion; full lesson access comes
# only from a Completed import. There is no date/time automatic promotion.
#
# Trial Portal User IDs are recognised by the Trial prefix, except IDs beginning
# admintrial, which are deliberately exempt from the Trial rule and use their
# normal/admin-configured entitlements. Trial views are stored as trialViews.
# A Trial ID can complete only its first successful login; later logins are
# rejected. Trial access exposes full lesson descriptions and lesson videos only.
#
# Student sessions are bound to a per-window token supplied by the published
# frontend. A fresh browser window without that token cannot reuse an existing
# session cookie and must authenticate again.
#
# Students may browse the corresponding unenrolled subject catalogue for their
# active normal/11+ programme. Full lesson descriptions are visible, while all
# lesson resources remain server-side locked unless an independent entitlement
# already grants access.
#
# Year 6 Maths SATS lessons appear at the end of the normal Year 6 Maths list as
# Y6MS1-Y6MS19. Their ordinary resource model is unchanged: PreLesson Sheets,
# Homework and password-protected Answer Packs use the existing lesson gates.
#
# Production login remains governed by the inherited Phase 17 guard: login is
# available only when STUDENT_LOGIN_ENABLED is true AND the normalised username
# is present in the Cloudflare-managed PROD_LOGIN_ALLOWLIST.
# The production allowlist is deliberately not committed to this public repo.
#
# Excel sync still requires the dedicated EXCEL_SYNC_TOKEN Worker secret. The
# secret is deliberately not present in this file or any repository source.
#
# Passwords, Answer Pack passwords, private student records, production student
# allowlists and Cloudflare credential values are never committed in plaintext.
# Production deployment must preserve the existing audited Students KV,
# Lessons KV, D1 and R2 bindings; exact binding identifiers remain
# Cloudflare-managed rather than source data.
