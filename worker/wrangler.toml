name = "fpt-portal-v2-worker"
main = "src/index-phase17.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
DEV_LOGIN_ALLOWLIST = ""

# Phase 17 frozen development entrypoint. src/index-phase17.js adds one narrow
# pre-launch safety guard on top of the accepted Phase 13/15 stack: special-area
# ScreenPal playback succeeds only when the stored special-content metadata
# contains the exact explicit approved HTTPS URL returned by the inherited
# handler. A bare ScreenPal ID is therefore never sufficient at the Phase 17
# boundary.
#
# The Phase 13 Excel route remains unchanged and still requires the dedicated
# EXCEL_SYNC_TOKEN Worker secret. The secret is deliberately not present in
# this file or any repository source. Student + Lesson remains the permanent
# idempotent entitlement identity while Batch + Lesson remains operational
# release context; Excel does not mutate membership.
#
# Sensitive values, private student configuration and Cloudflare binding IDs are
# never committed. Guarded deployment workflows reconstruct the audited isolated
# development bindings from Cloudflare before deploy. Normal student login
# remains disabled. The checked-in development allowlist is empty after Phase 17
# fixture cleanup; any temporary owner-only verification access must be applied
# privately and removed again before closure.
