name = "fpt-portal-v2-worker"
main = "src/index-phase13.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io"
DEV_LOGIN_ALLOWLIST = "test0101,test0202,test0303,test0404,test0505,test0606,test0707"

# Phase 13 development entrypoint. src/index-phase13.js adds one narrow,
# development-only authenticated Excel entitlement-sync route on top of the
# completed Phase 12 batch-aware Worker. All ordinary student routes continue
# to delegate to Phase 12 unchanged.
#
# The Excel route requires the dedicated EXCEL_SYNC_TOKEN Worker secret. The
# secret is deliberately not present in this file or any repository source.
# It processes explicit student-level items only, validates exact D1 batch
# configuration/effective dates, and keeps Student + Lesson as the permanent
# idempotent entitlement identity while Batch + Lesson remains operational
# release context.
#
# MOCK_DAILY_PASSWORDS and other sensitive values are Worker secrets/config and
# must never be committed. Cloudflare binding identifiers remain generated from
# the audited V2 runtime by guarded deployment workflows rather than hard-coded
# in this repository file. Normal student login remains disabled; the checked-in
# DEV_LOGIN_ALLOWLIST contains controlled TestY/development fixtures only.
