name = "fpt-portal-v2-worker"
main = "src/index-step10-quiz-bridge.js"
compatibility_date = "2026-08-20"
keep_vars = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://futureperfecttuitions.github.io,https://lessons.futureperfect.education"
DEV_LOGIN_ALLOWLIST = ""
STUDENT_LOGIN_ENABLED = "true"
PARENT_EMAIL_TEST_TO = ""

[[send_email]]
name = "EMAIL"

# Canonical Portal V2 production entrypoint on this isolated Step 10 branch.
# Step 10 wraps index-admin-tools.js only to add the minimal standalone 11+ Practice
# launch bridge. All existing Portal authentication, entitlement and resource logic
# remains delegated unchanged to the established Worker chain.
#
# The bridge exposes only:
# - authenticated L3 eligibility for the Portal top link;
# - a short-lived, single-use launch code tied to the live Portal session;
# - server-to-server redemption protected by QUIZ_BRIDGE_SECRET.
# Portal cookies are never shared with quiz.futureperfect.education.
# Production question-bank content is never served or stored by this Worker.
#
# QUIZ_BRIDGE_SECRET must be configured as a Cloudflare secret and must never be
# committed. Migration 0011_quiz_launch_codes.sql must be applied before activation.
# No production deployment is authorised by this branch change alone.
